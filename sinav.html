<style>
:root{--inkc:#1f3fb0;--hand:Caveat,"Segoe Print","Bradley Hand",cursive}
/* ---------- Kütüphane ---------- */
.lib{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:stretch;margin-bottom:28px}
.lib-txt{padding:30px}
.lib-txt h1{font-size:clamp(30px,4.2vw,44px);margin:6px 0 10px}
.lib-txt p{margin:0 0 18px;color:var(--ink2)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat div{padding:12px 14px;border-radius:14px;background:var(--soft);font-size:13.5px;color:var(--ink2);line-height:1.4}
.feat b{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:14px;margin-bottom:3px}
.feat b svg{width:17px;height:17px;color:var(--p)}
.updrop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line2);border-radius:22px;padding:34px 24px;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s;min-height:280px}
.updrop:hover,.updrop.over{border-color:var(--p);background:var(--p-soft)}
.updrop .ico{width:64px;height:64px;border-radius:20px;margin:0 0 14px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.updrop .ico svg{width:30px;height:30px}
.updrop b{font-size:19px;display:block;margin-bottom:4px}
.updrop .btn{margin-top:16px}
.upmsg{margin-top:12px;font-weight:700;min-height:22px;color:var(--ink2)}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.excard{overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.excard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.excard .th{aspect-ratio:3/2.3;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.excard .th img{width:100%;display:block}
.excard .tx{padding:12px 14px 14px}
.excard b{display:block;font-size:15px;line-height:1.3}
.excard .mut{font-size:12.5px}
.excard .bar{height:6px;border-radius:9px;background:var(--soft);margin-top:10px;overflow:hidden}
.excard .bar i{display:block;height:100%;background:var(--p)}
.excard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
/* ---------- Sınav ekranı ---------- */
.exbar{position:sticky;top:62px;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:16px;margin-bottom:14px;flex-wrap:wrap}
.exbar .ttl{font-weight:800;font-size:14.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px;align-items:center;padding:3px;border-radius:13px;background:var(--soft)}
.tools button{width:38px;height:36px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--ink2);position:relative;font:800 16px/1 Fraunces,serif}
.tools button svg{width:19px;height:19px}
.tools button:hover{background:var(--card)}
.tools button.on{background:var(--card);color:var(--p);box-shadow:var(--sh1)}
.sw{display:flex;gap:4px;padding:0 4px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--ink)}
.tmr{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;padding:0 10px;height:36px;border-radius:11px;background:var(--soft)}
.tmr svg{width:16px;height:16px}
.tmr.low{color:var(--bad)}
.exbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0;overflow-x:auto;padding-bottom:40px}
.pg{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px -10px rgba(0,0,0,.25);border-radius:4px;flex:0 0 auto;--user-unit:1;--total-scale-factor:calc(var(--scale-factor) * var(--user-unit));--scale-round-x:1px;--scale-round-y:1px}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:4px}
.pg .pgno{position:absolute;bottom:-20px;right:0;font-size:12px;font-weight:700;color:var(--mut)}
.pg .load{position:absolute;inset:0;display:grid;place-items:center;color:#94a3b8;font-weight:700}
.anno{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:multiply;overflow:visible}
.ink{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.ov{position:absolute;inset:0;z-index:4;pointer-events:none;touch-action:none}
.qlay{position:absolute;inset:0;z-index:5;pointer-events:none}
.pages.t-select .qlay>*{pointer-events:auto}
.notes{position:absolute;inset:0;z-index:6;pointer-events:none}
/* kâğıt üstü işaretleme */
.mk{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.mk::before{content:"";position:absolute;inset:-4px -5px;border-radius:50%}
.mk:hover::before{background:rgba(31,63,176,.08);box-shadow:0 0 0 1.5px rgba(31,63,176,.35)}
.mk.on::after,.mk.ok::after,.mk.no::after,.mk.key::after{content:"";position:absolute;inset:-3px -6px -2px;border:2.4px solid var(--inkc);border-radius:50%;transform:rotate(-8deg);pointer-events:none}
.mk.ok::after{border-color:#15803d}
.mk.no::after{border-color:#dc2626}
.mk.no::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:2.4px;background:#dc2626;transform:rotate(-20deg);border-radius:2px;box-shadow:none}
.mk.key::after{border-color:#15803d;border-style:dashed}
.tfc{position:absolute;display:flex;gap:calc(var(--scale-factor)*4px);align-items:center}
.tfc button{font:800 calc(var(--scale-factor)*10.5px)/1 "Plus Jakarta Sans",sans-serif;height:calc(var(--scale-factor)*17px);min-width:calc(var(--scale-factor)*22px);padding:0 calc(var(--scale-factor)*4px);border:1.3px solid #94a3b8;border-radius:calc(var(--scale-factor)*5px);background:rgba(255,255,255,.92);color:#334155;cursor:pointer}
.tfc button:hover{border-color:var(--inkc);color:var(--inkc)}
.tfc button.on{border-color:var(--inkc);color:#fff;background:var(--inkc)}
.tfc button.ok{border-color:#15803d;background:#15803d;color:#fff}
.tfc button.no{border-color:#dc2626;background:#dc2626;color:#fff}

.bl{position:absolute;border:0;border-radius:3px;background:rgba(31,63,176,.06);font:700 calc(var(--scale-factor)*14.5px)/1 var(--hand);color:var(--inkc);padding:0 calc(var(--scale-factor)*3px);outline:none;text-align:center}
.bl:focus{background:rgba(31,63,176,.12)}
.bl.ok{color:#15803d;background:rgba(21,128,61,.1)}.bl.no{color:#dc2626;background:rgba(220,38,38,.08);text-decoration:line-through}
.wr{position:absolute;border:1.3px dashed rgba(31,63,176,.32);border-radius:6px;background:rgba(31,63,176,.025);resize:none;font:600 calc(var(--scale-factor)*17px)/calc(var(--scale-factor)*21px) var(--hand);color:var(--inkc);padding:calc(var(--scale-factor)*4px) calc(var(--scale-factor)*7px);outline:none;overflow:auto}
.wr::placeholder{color:rgba(31,63,176,.42);font-family:"Plus Jakarta Sans",sans-serif;font-size:calc(var(--scale-factor)*10.5px);font-weight:600}
.wr:focus{background:rgba(31,63,176,.05);border-color:rgba(31,63,176,.55)}
.wr.lined{border-color:transparent;background:transparent;line-height:calc(var(--lh) * var(--scale-factor));padding-top:calc(var(--lh) * var(--scale-factor) * .32)}
.wr.lined:focus{border-color:rgba(31,63,176,.35)}
.wrb{position:absolute;width:calc(var(--scale-factor)*22px);height:calc(var(--scale-factor)*22px);border-radius:50%;border:1.5px solid var(--inkc);background:#fff;color:var(--inkc);display:grid;place-items:center;font-size:calc(var(--scale-factor)*12px);padding:0;cursor:pointer}
.wrb.has{background:var(--inkc);color:#fff}
.tbx{position:absolute;pointer-events:auto;border:1.2px dashed transparent;border-radius:5px;background:transparent;resize:horizontal;font:600 calc(var(--scale-factor)*17px)/1.2 var(--hand);color:var(--inkc);padding:2px 5px;outline:none;min-width:60px;overflow:hidden}
.tbx:hover,.tbx:focus{border-color:rgba(31,63,176,.45);background:rgba(255,255,255,.6)}
.pages.t-erase .tbx{cursor:pointer}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;width:30px;height:34px;border:0;background:none;padding:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.pin svg{width:30px;height:34px}
.pin span{position:absolute;top:6px;left:0;right:0;text-align:center;font:800 11px "Plus Jakarta Sans",sans-serif;color:#422006}
.nedit{position:absolute;z-index:8;width:270px;background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh2);padding:10px;pointer-events:auto}
.nedit textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:10px;padding:8px;resize:vertical;background:var(--card);font-size:14px}
.nedit textarea.hand{font:600 19px/1.25 var(--hand);color:var(--inkc)}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;letter-spacing:normal;word-spacing:normal;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;caret-color:CanvasText;z-index:2;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;-webkit-user-select:text;user-select:text}
.textLayer > :not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer ::selection{background:rgba(20,184,166,.32);color:transparent}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;-webkit-user-select:none;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.pages.t-pen .ov,.pages.t-note .ov,.pages.t-rect .ov,.pages.t-erase .ov,.pages.t-txt .ov,.pages.t-circ .ov{pointer-events:auto;cursor:crosshair}
.pages.t-erase .ov{cursor:cell}.pages.t-txt .ov{cursor:text}
.pages.t-circ .textLayer,.pages.t-pen .textLayer,.pages.t-note .textLayer,.pages.t-erase .textLayer,.pages.t-rect .textLayer,.pages.t-txt .textLayer{pointer-events:none}
.hintbar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;margin-bottom:14px;font-size:14px;background:var(--acc-soft);border-color:transparent}
.hintbar span{flex:1}.hintbar svg{width:18px;height:18px;vertical-align:-4px}
.selfab{position:fixed;z-index:70;display:flex;gap:6px;padding:6px;border-radius:14px;background:var(--ink);box-shadow:var(--sh2)}
.selfab button{border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;background:var(--card);color:var(--ink)}
/* ---------- Cevap kâğıdı ---------- */
.sheet{position:sticky;top:130px;max-height:calc(100vh - 146px);display:flex;flex-direction:column;overflow:hidden}
.sh-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.types{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.types span{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--ink2)}
.sh-tabs{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--soft);margin-top:10px}
.sh-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px;font-weight:800;font-size:13px;color:var(--mut)}
.sh-tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.sh-b{overflow:auto;padding:8px 10px 10px;flex:1}
.qrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:12px;min-height:42px}
.qrow:hover{background:var(--soft)}
.qrow .qn{width:34px;flex:0 0 34px;text-align:right;font-weight:800;font-size:13px;color:var(--ink2);border:0;background:none;padding:4px 2px;border-radius:8px}
.qrow .qn.has{color:var(--p);text-decoration:underline dotted}
.qctl{flex:1;min-width:0;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.bub{display:flex;gap:5px}
.bub button{min-width:31px;height:31px;padding:0 4px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card);font-weight:800;font-size:12px;color:var(--ink2);transition:transform .08s}
.bub button:active{transform:scale(.92)}
.bub button.on{background:var(--p);border-color:var(--p);color:var(--p-ink)}
.bub button.key{box-shadow:0 0 0 2.5px var(--ok)}
.sbl{flex:1;min-width:60px;height:31px;border:1.5px solid var(--line);border-radius:9px;padding:0 8px;background:var(--card);font-size:13.5px}
.sop{flex:1;min-width:0;text-align:left;border:1.5px dashed var(--line2);border-radius:10px;background:transparent;padding:6px 9px;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sop.has{border-style:solid;color:var(--ink);font-family:var(--hand);font-size:17px;padding:3px 9px}
.skey{flex:1;min-height:34px;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card);font-size:13px;resize:vertical}
.ttag{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--mut);flex:0 0 auto}
.aib{flex:0 0 auto;font-weight:800;font-size:12.5px;padding:3px 8px;border-radius:8px;background:var(--acc-soft);color:var(--acc2);border:0}
.qrow .fl{margin-left:auto;width:30px;height:30px;flex:0 0 30px;border:0;background:none;border-radius:8px;color:var(--line2);display:grid;place-items:center}
.qrow .fl svg{width:16px;height:16px}
.qrow .fl.on{color:var(--acc2)}
.qrow.ok{background:var(--ok-soft)}.qrow.no{background:var(--bad-soft)}
.qrow.ok .bub button.on{background:var(--ok);border-color:var(--ok)}
.qrow.no .bub button.on{background:var(--bad);border-color:var(--bad);color:#fff}
.sh-f{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.res{padding:14px;border-radius:14px;background:var(--soft);margin:6px 4px 10px}
.res b.big{font-family:Fraunces,serif;font-size:30px;display:block}
.res .btn{margin-top:10px;width:100%}
.nitem{padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;font-size:14px}
.nitem:hover{background:var(--soft)}
.tsel{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.tsel b{width:30px;text-align:right}
.tsel select{flex:1;min-height:34px;padding:4px 8px;border-radius:9px}
.info{padding:10px 12px;border-radius:12px;background:var(--acc-soft);font-size:13px;margin:4px 4px 10px;line-height:1.45}
.sheet-fab{display:none}
@media (max-width:1100px){.exbody{grid-template-columns:minmax(0,1fr) 300px}}
@media (max-width:900px){
  .lib{grid-template-columns:1fr}.lib-txt{padding:22px}
  .exbar{top:56px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-radius:0;margin:0 -14px 12px;padding:8px 14px}
  .exbar .ttl{display:none}
  .exbody{grid-template-columns:1fr}
  .sheet{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:65;max-height:74vh;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.open{transform:none}
  .sheet-fab{display:flex;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:64;box-shadow:var(--sh2)}
}
@media (max-width:900px){.lib .updrop{order:-1}}
@media (max-width:560px){.feat{grid-template-columns:1fr}.updrop{min-height:200px}.lib-txt h1{font-size:28px}}
</style>

<main class="ka-wrap" id="main"></main>
<script src="ortak.js"></script>
<script type="module">
const {$,esc}=KA;const ic=KA.ic;
const icT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>';
const icMark='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6.5" transform="rotate(-10 12 12)"/><path d="M10 14l2-5 2 5m-3.3-1.6h2.6"/></svg>';

/* ---------- Kalıcı kayıt (tarayıcı veritabanı) ---------- */
const idb=(()=>{let dbp;const open=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('ka-sinav',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('exams'))d.createObjectStore('exams',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const tx=(s,m,f)=>open().then(d=>new Promise((ok,no)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}));
  return {all:()=>tx('exams','readonly',s=>s.getAll()),get:id=>tx('exams','readonly',s=>s.get(id)),put:v=>tx('exams','readwrite',s=>s.put(v)),del:id=>Promise.all([tx('exams','readwrite',s=>s.delete(id)),tx('files','readwrite',s=>s.delete(id))]),file:id=>tx('files','readonly',s=>s.get(id)),putFile:(id,b)=>tx('files','readwrite',s=>s.put(b,id))};
})();

/* ---------- pdf.js (sitenin kendi kopyası) ---------- */
let pdfjs=null;
async function lib(){if(!pdfjs){pdfjs=await import('./lib/pdfjs/pdf-v3.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc=new URL('lib/pdfjs/pdf.worker-v3.min.mjs',location.href).href}return pdfjs}

/* ---------- Sınavı oku: soruları, şıkları, boşlukları ve yazı alanlarını bul ---------- */
const r1=n=>Math.round(n*10)/10;
const isRule=l=>{const c=l.t.replace(/\s/g,'');return c.replace(/[_.…\-–—]/g,'').length<=2&&/[_.…]{8,}/.test(c)&&(l.x1-l.x0)>110};
const SECRE=/^(part|section|bölüm|task|exercise)\b|^(choose|circle|fill in|complete|answer|read|write|match|decide)\b/i;
const TFRE=/\btrue\s*(or|\/|-)\s*false\b|\(\s*T\s*\/\s*F\s*\)|\bT\s*\/\s*F\b|doğru\s*(mu|\/|ya da|veya)\s*yanlış|\bD\s*\/\s*Y\b/i,NGRE=/not\s*given|\bNG\b/i;
async function analyse(doc){
  const pages=[],L=[];let txt='';
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p),vp=page.getViewport({scale:1}),tc=await page.getTextContent();
    pages.push([vp.width,vp.height]);
    const lines=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const t=it.transform,fs=Math.hypot(t[2],t[3])||it.height||10,x=t[4],y=vp.height-t[5];let l=lines.find(q=>Math.abs(q.y-y)<Math.max(2,fs*.35));if(!l){l={p,y,fs,parts:[]};lines.push(l)}l.fs=Math.max(l.fs,fs);l.parts.push({x,w:it.width||fs*.5*it.str.length,s:it.str,fs})});
    lines.sort((a,b)=>a.y-b.y).forEach(l=>{l.parts.sort((a,b)=>a.x-b.x);let t='',end=-1e9;l.parts.forEach(a=>{if(t&&a.x-end>a.fs*.15&&!/\s$/.test(t))t+=' ';t+=a.s;end=a.x+a.w});
      l.t=t.replace(/\s+/g,' ').trim();l.x0=l.parts[0].x;l.x1=Math.max(...l.parts.map(a=>a.x+a.w));l.top=l.y-l.fs*.85;l.bot=l.y+l.fs*.25;l.ci=txt.length;txt+=l.t+'\n';L.push(l)});
  }
  const empty={pages,qs:[],opts:4,doc:txt.slice(0,60000),scanned:L.length<3};
  if(L.length<3)return empty;
  const QRE=/^(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.)]\s*(?=\S)/i,starts=[];let want=1;
  L.forEach((l,i)=>{const m=l.t.match(QRE);if(m&&+m[1]===want&&!/^\d{1,3}\s*[.)]\s*\d/.test(l.t)){starts.push(i);want++}});
  if(starts.length<2)return empty;

  L.forEach((l,i)=>{if(S.has(i)){secAt[i]=sec;return}
    if(TFRE.test(l.t)||/write\s+(T|true)\b/i.test(l.t))sec=NGRE.test(l.t)?'tfng':/doğru|yanlış|\bD\s*\/\s*Y/i.test(l.t)?'dy':'tf';
    else if(/^(part|section|bölüm|task|exercise)\b/i.test(l.t)||/choose the (best|correct)|circle the|fill in|complete the|answer the following|write (a|your)|in your own words/i.test(l.t))sec=''});

    const q={n:qi+1,p:L[si].p,x:r1(L[si].x0),y:r1(L[si].top),ci:L[si].ci,text:own.map(l=>l.t).join(' ').slice(0,900)};
    const [pw,ph]=pages[q.p-1];
    // şıklar
    const mk=[];
    for(let j=si;j<ei;j++){const l=L[j];if(j>si&&l.p!==L[si].p&&j>=k&&mk.length===0)break;l.parts.forEach(a=>{const re=/(^|\s)(\(([A-Ea-e])\)|([A-E])[.)]|([a-e])[.)])(?=\s|$)/g;let m;const n=a.s.length||1;while((m=re.exec(a.s))){const ci=m.index+m[1].length,len=m[2].length;mk.push({l:(m[3]||m[4]||m[5]).toUpperCase(),p:l.p,x:a.x+a.w*ci/n,y:l.top,w:Math.max(a.w*len/n,l.fs*.55),h:l.bot-l.top})}})}
    let run=[];for(let i=0;i<mk.length;i++){if(mk[i].l!=='A')continue;const r=[mk[i]];for(let j=i+1;j<mk.length&&r.length<5;j++)if(mk[j].l===String.fromCharCode(65+r.length))r.push(mk[j]);if(r.length>run.length)run=r}
    if(run.length>=3){q.t='mc';q.opts=run.map(o=>({l:o.l,p:o.p,x:r1(o.x),y:r1(o.y),w:r1(o.w),h:r1(o.h)}));maxL=Math.max(maxL,run.length)}
    else if(TFRE.test(q.text)||/\(\s*(T|F|true|false)\s*\)\s*$/i.test(q.text)||secAt[si]){
      const s=secAt[si],ng=NGRE.test(q.text)||s==='tfng',dy=/doğru|yanlış/i.test(q.text)||s==='dy';
      q.t='tf';q.ch=dy?['D','Y']:ng?['T','F','NG']:['T','F'];

      if(bl.length&&!rules.length){q.t='blank';q.bl=bl.slice(0,6)}
      else{
        q.t='open';
        for(let j=k;j<ei&&isRule(L[j]);j++)rules.push(L[j]);
        const last=own[own.length-1];
        const rl=rules.filter(l=>l.p===(rules[0]||{}).p);
        if(rl.length){const a=rl[0],b=rl[rl.length-1],x0=Math.min(...rl.map(l=>l.x0)),x1=Math.max(...rl.map(l=>l.x1)),lh=rl.length>1?(b.y-a.y)/(rl.length-1):a.fs*1.8,top=a.y-lh*.95;

    }
    qs.push(q);
  });
  return {pages,qs,opts:maxL>=5?5:4,doc:txt.slice(0,60000),scanned:false};
}

let EX=null,DOC=null,DOCT=null,PAGES=[],ZOOM=1,BASEW=0,TOOL='select',COLOR='#fde047',UNDO=[],saveT=null,tick=null,io=null,renderQ=[],rendering=0,TAB='ans';
const COLORS=['#fde047','#86efac','#f9a8d4','#93c5fd'];
const TYPES={mc:'Çoktan seçmeli',tf:'Doğru / Yanlış',blank:'Boşluk doldurma',open:'Yazılı'};
const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{if(EX){EX.updated=Date.now();idb.put(EX).catch(()=>{})}},350)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
const LET='ABCDE';
const qOf=k=>(EX.qs||[]).find(q=>q.n===k)||{n:k,t:'mc',gen:1};
const choices=q=>q.t==='tf'?q.ch:q.opts?q.opts.map(o=>o.l):LET.slice(0,EX.opts).split('');
const answered=k=>{const a=EX.ans[k];return Array.isArray(a)?a.some(v=>String(v||'').trim()):!!String(a||'').trim()};
const nAnswered=()=>Array.from({length:EX.q},(_,i)=>i+1).filter(answered).length;
const norm=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}\s'-]/gu,' ').replace(/\s+/g,' ').trim();
function verdict(k){
  const q=qOf(k),key=EX.key[k];if(!EX.result||key==null||key==='')return '';
  if(q.t==='open')return '';
  if(!answered(k))return 'empty';
  if(q.t==='blank'){const ks=String(key).split(/\s*[;|]\s*/),as=EX.ans[k]||[];return ks.every((kv,i)=>kv.split('/').map(norm).includes(norm(as[i])))?'ok':'no'}

}

async function upload(f){
  const msg=$('#upmsg');
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){msg.textContent='Lütfen PDF dosyası seç.';return}
  if(f.size>60*1024*1024){msg.textContent='Dosya çok büyük (en fazla 60 MB).';return}
  msg.innerHTML='<span class="ka-spin"></span> PDF okunuyor, sorular ve soru tipleri çıkarılıyor…';
  try{
    const buf=new Uint8Array(await f.arrayBuffer());
    const L=await lib(),task=L.getDocument({data:buf.slice()}),doc=await task.promise;
    const info=await analyse(doc);
    const p1=await doc.getPage(1),vp=p1.getViewport({scale:300/p1.getViewport({scale:1}).width});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await p1.render({canvasContext:c.getContext('2d'),canvas:c,viewport:vp}).promise;
    const id=uid();
    const ex={id,v:2,title:f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim()||'Sınav',pages:doc.numPages,q:info.qs.length||20,opts:info.opts,qs:info.qs,doc:info.doc,scanned:info.scanned,detected:!!info.qs.length,
      ans:{},flags:{},key:{},ai:{},annos:{},elapsed:0,limit:0,created:Date.now(),updated:Date.now(),thumb:c.toDataURL('image/jpeg',.7)};
    await idb.putFile(id,buf);await idb.put(ex);
    task.destroy();
    location.hash=id;
  }catch(e){msg.textContent='PDF açılamadı: '+(e&&e.message||e)}
}

function fitZoom(){const box=$('#pages');const w=box.clientWidth-8;ZOOM=Math.max(.5,Math.min(1.6,w/BASEW))}
function layout(){
  const box=$('#pages');if(!box)return;
  const frac=document.documentElement.scrollHeight?scrollY/document.documentElement.scrollHeight:0;
  if(io)io.disconnect();renderQ=[];
  box.innerHTML=PAGES.map(p=>{const W=Math.floor(p.w*ZOOM),H=Math.floor(p.h*ZOOM);return `<div class="pg" data-p="${p.n}" style="width:${W}px;height:${H}px;--scale-factor:${ZOOM}"><div class="load">Sayfa ${p.n}</div><canvas></canvas><svg class="anno" viewBox="0 0 1000 ${(1000*p.h/p.w).toFixed(1)}" preserveAspectRatio="none"></svg><div class="textLayer"></div><svg class="ink" viewBox="0 0 1000 ${(1000*p.h/p.w).toFixed(1)}" preserveAspectRatio="none"></svg><div class="ov"></div><div class="qlay">${qlayHTML(p.n)}</div><div class="notes"></div><span class="pgno">${p.n} / ${PAGES.length}</span></div>`}).join('');
  PAGES.forEach(p=>{p.el=box.querySelector(`.pg[data-p="${p.n}"]`);p.done=0;drawAnnos(p.n);bindPage(p);p.el.querySelectorAll('.bl').forEach(fitBl)});
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const p=PAGES[+e.target.dataset.p-1];if(p&&!p.done)queue(p)}}),{rootMargin:'900px 0px'});
  PAGES.forEach(p=>io.observe(p.el));
  requestAnimationFrame(()=>scrollTo(0,frac*document.documentElement.scrollHeight));
}
function queue(p){if(!renderQ.includes(p))renderQ.push(p);pump()}
function pump(){while(rendering<2&&renderQ.length){const p=renderQ.shift();if(p.done)continue;p.done=1;rendering++;renderPage(p).catch(()=>{p.done=0}).finally(()=>{rendering--;pump()})}}
async function renderPage(p){
  const page=await DOC.getPage(p.n),z=ZOOM,el=p.el;
  const dpr=Math.min(2,window.devicePixelRatio||1),vp=page.getViewport({scale:z}),rv=page.getViewport({scale:z*dpr});
  const c=el.querySelector('canvas');c.width=Math.floor(rv.width);c.height=Math.floor(rv.height);
  await page.render({canvasContext:c.getContext('2d'),canvas:c,viewport:rv}).promise;
  if(z!==ZOOM||el!==p.el)return;
  const ld=el.querySelector('.load');if(ld)ld.remove();
  const tl=el.querySelector('.textLayer');tl.innerHTML='';
  try{const t=new pdfjs.TextLayer({textContentSource:page.streamTextContent(),container:tl,viewport:vp});await t.render()}catch(e){}
  tl.addEventListener('mousedown',()=>tl.classList.add('selecting'));
  document.addEventListener('mouseup',()=>tl.classList.remove('selecting'));
}

/* ---------- Kâğıt üstü cevap katmanı ---------- */
function qlayHTML(pn){
  if(!EX.qs||!PAGES[pn-1])return '';
  const pw=PAGES[pn-1].w,ph=PAGES[pn-1].h,P=(x,y,w,h)=>`left:${(x/pw*100).toFixed(3)}%;top:${(y/ph*100).toFixed(3)}%;${w!=null?`width:${(w/pw*100).toFixed(3)}%;`:''}${h!=null?`height:${(h/ph*100).toFixed(3)}%;`:''}`;
  const km=EX.keyMode;let h='';
  EX.qs.forEach(q=>{const n=q.n;if(n>EX.q)return;const a=km?EX.key[n]:EX.ans[n],v=verdict(n),key=EX.key[n];
    const cls=L=>EX.result&&key?(L===key?(a===L?'ok':'key'):(a===L?'no':'')):(a===L?'on':'');
    if(q.t==='mc')q.opts.filter(o=>o.p===pn).forEach(o=>{h+=`<button class="mk ${cls(o.l)}" data-mq="${n}" data-l="${o.l}" style="${P(o.x-1,o.y,o.w+2,o.h)}" title="${n}. soru · ${o.l} şıkkı" aria-label="${n}. soru ${o.l} şıkkı"></button>`});
    else if(q.t==='tf'&&q.tf.p===pn)h+=`<div class="tfc" style="${P(q.tf.x,q.tf.y-1)}">${q.ch.map(c=>`<button class="${cls(c)}" data-mq="${n}" data-l="${c}" aria-label="${n}. soru ${c}">${c}</button>`).join('')}</div>`;
    else if(q.t==='blank')q.bl.forEach((b,i)=>{if(b.p===pn)h+=`<input class="bl ${v==='ok'?'ok':v==='no'?'no':''}" data-bq="${n}" data-i="${i}" data-w="${b.w}" value="${esc(((EX.ans[n]||[])[i])||'')}" style="${P(b.x,b.y,b.w,b.h)}" autocomplete="off" spellcheck="false" aria-label="${n}. soru, ${i+1}. boşluk" ${EX.result?'readonly':''}>`});
    else if(q.t==='open'){
      if(q.area&&q.area.p===pn)h+=`<textarea class="wr ${q.area.lined?'lined':''}" data-wq="${n}" style="${P(q.area.x,q.area.y,q.area.w,q.area.h)}${q.area.lined?`--lh:${q.area.lh}px;`:''}" placeholder="${n}. sorunun cevabını buraya yaz" spellcheck="false" ${EX.result?'readonly':''}>${esc(EX.ans[n]||'')}</textarea>`;
      else if(q.pin&&q.pin.p===pn)h+=`<button class="wrb ${answered(n)?'has':''}" data-wp="${n}" style="${P(q.pin.x,q.pin.y)}" title="${n}. soruya cevap yaz">✎</button>`}
  });

      <label><span class="eyebrow">Süre sınırı (dakika, 0 = sınırsız)</span><input class="input" id="sLim" type="number" min="0" max="600" value="${Math.round((EX.limit||0)/60)}" style="margin-top:6px"></label>
      <div><span class="eyebrow">Cevap anahtarını yapıştır</span><textarea class="textarea" id="sKey" placeholder="1A 2C 3T 4F 5 increase …" style="min-height:80px;margin-top:6px"></textarea><button class="btn btn-ghost btn-sm" data-a="pastekey" style="margin-top:6px">Anahtarı yükle</button></div>
      <details><summary style="cursor:pointer;font-weight:800;font-size:14px">Soru tiplerini düzelt</summary><p class="mut" style="font-size:12.5px;margin:6px 0">Bir soru yanlış tipte bulunduysa buradan değiştir.</p>${Array.from({length:EX.q},(_,i)=>{const k=i+1,t=qOf(k).t;return `<div class="tsel"><b>${k}.</b><select class="select" data-ty="${k}">${Object.entries(TYPES).map(([v,l])=>`<option value="${v}" ${t===v?'selected':''}>${l}</option>`).join('')}</select></div>`}).join('')}</details>
      <button class="btn btn-ghost btn-sm" data-a="savecfg">${ic('check')}Ayarları kaydet</button>
      <button class="btn btn-bad btn-sm" data-a="clearans">${ic('reset')}Cevapları ve sonucu temizle</button></div>`}</div>
  <div class="sh-f">${km?`<button class="btn btn-p" data-a="keydone">${ic('check')}Anahtarı kaydet</button><button class="btn btn-ghost btn-sm" data-a="keycancel">Vazgeç</button>`:(R?`<button class="btn btn-ghost" data-a="reopen">${ic('reset')}Yeniden çöz</button>`:`<button class="btn btn-p" data-a="finish">${ic('check')}Bitir ve puanla</button><button class="btn btn-ghost btn-sm" data-a="keymode">Cevap anahtarı gir</button>`)}</div>`;
}
function syncRow(k){const b=document.querySelector(`[data-row="${k}"]`);if(b){b.classList.toggle('has',answered(k));b.textContent=answered(k)?String(EX.ans[k]).slice(0,80):'Cevabını sayfaya yaz'}document.querySelectorAll(`[data-sb="${k}"]`).forEach(inp=>{if(document.activeElement!==inp)inp.value=((EX.ans[k]||[])[+inp.dataset.i])||''});const t=document.querySelector('.sh-h .tag');if(t&&!EX.keyMode)t.textContent=nAnswered()+'/'+EX.q}
function drawTimer(){const t=$('#tmr');if(!t||!EX)return;const lim=EX.limit||0,s=lim?lim-EX.elapsed:EX.elapsed;t.lastChild.textContent=(lim?'Kalan ':'')+fmt(s);t.classList.toggle('low',lim>0&&s<300);if(lim&&s<=0&&!EX.result){KA.toast('Süre doldu.');finish(true)}}
const objKeys=()=>Object.keys(EX.key).filter(k=>+k<=EX.q&&qOf(+k).t!=='open'&&String(EX.key[k]).trim());
function grade(){let ok=0,no=0,empty=0;const ks=objKeys();
  EX.result={};ks.forEach(k=>{const v=verdict(+k);if(v==='ok')ok++;else if(v==='no')no++;else empty++});
  EX.result={ok,no,empty,pct:ks.length?Math.round(ok/ks.length*100):null,time:EX.elapsed};save()}
function finish(force){
  const n=nAnswered(),hasObj=Array.from({length:EX.q},(_,i)=>i+1).some(k=>qOf(k).t!=='open');
  if(hasObj&&!objKeys().length&&!force){
    const m=KA.modal(`<h2 style="margin:0 0 8px">Puanlamak için cevap anahtarı gerekli</h2><p class="mut">${n}/${EX.q} soruyu cevapladın. Anahtarı “1A 2C 3T 4F 5 increase” ya da “ACBD…” biçiminde yapıştırabilir, kâğıdın üstünde işaretleyebilir ya da anahtarsız bitirebilirsin.</p><textarea class="textarea" id="mk" placeholder="1A 2C 3B 4D … ya da ACBD…"></textarea><div class="row" style="justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ghost" id="mn">Anahtarsız bitir</button><button class="btn btn-ghost" id="mm">Kâğıtta işaretle</button><button class="btn btn-p" id="mo">Puanla</button></div>`);
    m.el.querySelector('#mm').onclick=()=>{m.close();EX.keyMode=1;TAB='ans';redrawQ();drawSheet();KA.toast('Doğru şıkları kâğıdın üstünde işaretle, sonra “Anahtarı kaydet”e bas.',4200)};
    m.el.querySelector('#mn').onclick=()=>{m.close();EX.result={ok:0,no:0,empty:0,pct:null,time:EX.elapsed};save();redrawQ();drawSheet();openSheet();KA.sfx.win()};
    m.el.querySelector('#mo').onclick=()=>{if(parseKey(m.el.querySelector('#mk').value)){m.close();grade();redrawQ();drawSheet();openSheet();KA.sfx.win()}else KA.toast('Anahtar okunamadı. Örnek: 1A 2C 3B')};
    return;
  }
  if(!force&&n<EX.q&&!confirm(`${EX.q-n} soru boş. Yine de bitirilsin mi?`))return;
  grade();redrawQ();drawSheet();openSheet();KA.sfx.win();if(EX.result.pct!=null)KA.addXp(Math.round(EX.result.pct/5));
}
function parseKey(t){
  t=String(t||'');const K={};let any=false;
  const pairs=[...t.matchAll(/(\d{1,3})\s*[-.):]?\s*([^\s\d,;][^\n,;]*?)(?=\s+\d{1,3}\s*[-.):]?\s*[^\s\d]|[\n,;]|$)/g)];
  if(pairs.length>=2||(pairs.length===1&&!/^[A-Ea-e]{3,}$/.test(t.trim()))){
    pairs.forEach(m=>{const k=+m[1];if(k<1||k>EX.q)return;const q=qOf(k);let v=m[2].trim();
      if(q.t==='mc'){v=v[0].toUpperCase();if(!choices(q).includes(v))return}
      else if(q.t==='tf'){const u=v.toLocaleUpperCase('tr');v=/^(NG|NOT GIVEN)/.test(u)?'NG':/^(T|TRUE|D|DOĞRU)$/.test(u)?(q.ch.includes('D')?'D':'T'):/^(F|FALSE|Y|YANLIŞ)$/.test(u)?(q.ch.includes('Y')?'Y':'F'):'';if(!v)return}
      K[k]=v;any=true});
  }else{
    const s=t.toUpperCase().replace(/[^A-E]/g,'');let i=0;
    for(let k=1;k<=EX.q&&i<s.length;k++){const q=qOf(k);if(q.t!=='mc')continue;if(choices(q).includes(s[i])){K[k]=s[i];any=true}i++}
  }
  if(!any)return false;EX.key=Object.assign({},EX.key,K);save();return true;
}
function openSheet(){const s=$('#sheet');if(s)s.classList.add('open')}
function goQ(k){const q=qOf(k);if(!q.p)return;const pg=PAGES[q.p-1];if(!pg)return;const r=pg.el.getBoundingClientRect();scrollTo({top:scrollY+r.top+q.y/pg.h*r.height-140,behavior:'smooth'});$('#sheet').classList.remove('open');
  setTimeout(()=>{const el=document.querySelector(`[data-wq="${k}"],[data-bq="${k}"]`);if(el)el.focus({preventScroll:true})},450)}

/* ---------- Yazılı cevapları yapay zekâ değerlendirir ---------- */
const AISYS=`Sen deneyimli bir İngilizce sınav değerlendiricisisin. Aşağıda bir sınavdan yazılı (açık uçlu) sorular var. Her soru için sınav metninden ilgili BAĞLAM, varsa öğretmenin ÖRNEK CEVABI ve öğrencinin CEVABI verildi.
Her soruyu 0-10 arası puanla: içerik doğruluğu ve sorunun istediğini karşılama en önemlisi; dil hataları puanı yalnızca anlamı bozuyorsa düşürür. Boş, alakasız, anlamsız ya da metinle çelişen cevaplara 0-2 ver. Uydurma bilgi ekleme.
YALNIZCA geçerli JSON döndür: {"sonuclar":[{"n":soru numarası,"puan":0-10 tam sayı,"yorum":"Türkçe, en fazla 2 cümle: neyi doğru yaptı, neyi kaçırdı","ideal":"sorunun dilinde kısa ideal cevap"}]}`;
async function aiGrade(){
  const ks=Array.from({length:EX.q},(_,i)=>i+1).filter(k=>qOf(k).t==='open'&&answered(k)&&!EX.ai[k]);
  if(!ks.length)return;
  const btn=document.querySelector('[data-a="ai"]');if(btn){btn.disabled=true;btn.innerHTML='<span class="ka-spin"></span> Değerlendiriliyor…'}
  let err='';
  for(let i=0;i<ks.length;i+=5){
    const part=ks.slice(i,i+5);
    const input=part.map(k=>{const q=qOf(k),ci=q.ci||0,ctx=(EX.doc||'').slice(Math.max(0,ci-2600),ci).trim();return `### SORU ${k}\nSORU METNİ: ${q.text||''}\nBAĞLAM: ${ctx||'(yok)'}\nÖRNEK CEVAP: ${EX.key[k]||'(yok)'}\nÖĞRENCİ CEVABI: ${String(EX.ans[k]).slice(0,2500)}`}).join('\n\n');
    const r=await KA.askJ(AISYS,input,{ms:60000});
    const list=r.json&&Array.isArray(r.json.sonuclar)?r.json.sonuclar:null;
    if(!list){err=r.err||'yanıt yok';break}
    list.forEach(o=>{const k=+o.n;if(part.includes(k))EX.ai[k]={puan:Math.max(0,Math.min(10,Math.round(+o.puan||0))),yorum:String(o.yorum||''),ideal:String(o.ideal||'')}});
    save();
  }
  drawSheet();
  if(err)KA.toast('Değerlendirme yapılamadı: '+err);else KA.sfx.win();
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  const op=t.closest('[data-open]');if(op&&!t.closest('[data-del]')){location.hash=op.dataset.open;return}
  const dl=t.closest('[data-del]');if(dl){if(confirm('Bu sınav ve üzerindeki bütün notlar silinsin mi?')){await idb.del(dl.dataset.del);library()}return}
  const fb=t.closest('[data-fab]');if(fb){if(fb.dataset.fab==='look'){const all=getSelection().toString().trim(),w=all.split(/\s+/)[0];removeFab();if(w)KA.lookup(w,{context:all})}else applySel(fb.dataset.fab);return}
  const tl=t.closest('[data-tool]');if(tl){setTool(tl.dataset.tool);return}
  const cl=t.closest('[data-color]');if(cl){setColor(cl.dataset.color);if(!['hl','ul','pen'].includes(TOOL))setTool('hl');else if(TOOL==='hl'||TOOL==='ul')applySel(TOOL);return}
  const b=t.closest('[data-b]');if(b){setAns(+b.dataset.b,b.dataset.l);return}
  const fl=t.closest('[data-fl]');if(fl){const k=fl.dataset.fl;EX.flags[k]=!EX.flags[k];save();drawSheet();return}
  const av=t.closest('[data-aiv]');if(av){const k=+av.dataset.aiv,a=EX.ai[k];KA.modal(`<span class="eyebrow">${k}. soru · yazılı</span><h2 style="margin:6px 0 10px">${a.puan}/10</h2><p>${esc(a.yorum)}</p>${a.ideal?`<div class="info" style="margin:12px 0 0"><b>Örnek cevap:</b> ${esc(a.ideal)}</div>`:''}<p class="mut" style="margin-top:12px;font-size:13px"><b>Senin cevabın:</b> ${esc(EX.ans[k]||'')}</p>`);return}
  const go=t.closest('[data-go]');if(go){goQ(+go.dataset.go);return}
  const tb=t.closest('[data-tab]');if(tb){TAB=tb.dataset.tab;drawSheet();return}
  const no=t.closest('[data-note]');if(no){const [n,id]=no.dataset.note.split(':');const p=PAGES[+n-1];const a=annos(+n).find(x=>x.id===id);if(p&&a){const r=p.el.getBoundingClientRect();scrollTo({top:scrollY+r.top+a.y/1000*r.width-200,behavior:'smooth'});$('#sheet').classList.remove('open');setTimeout(()=>openNote(+n,id),400)}return}
  const a=t.closest('[data-a]');if(!a)return;
  ({lib:()=>{location.hash=''},hint:()=>{KA.store.set('ka_sinav_hint','1');const h=$('#hint');if(h)h.remove()},undo,zin:()=>setZoom(ZOOM*1.15),zout:()=>setZoom(ZOOM/1.15),finish:()=>finish(false),ai:aiGrade,
    sheet:()=>$('#sheet').classList.toggle('open'),
    keymode:()=>{EX.keyMode=1;TAB='ans';redrawQ();drawSheet();KA.toast('Doğru şıkları kâğıdın üstünde ya da formda işaretle.')},
    keydone:()=>{EX.keyMode=0;save();if(objKeys().length)KA.toast('Cevap anahtarı kaydedildi.');redrawQ();drawSheet()},keycancel:()=>{EX.keyMode=0;redrawQ();drawSheet()},
    reopen:()=>{EX.result=null;save();redrawQ();drawSheet()},
    pastekey:()=>{if(parseKey($('#sKey').value)){KA.toast(Object.keys(EX.key).length+' cevaplık anahtar yüklendi.');TAB='ans';drawSheet()}else KA.toast('Anahtar okunamadı. Örnek: 1A 2C 3T')},
    savecfg:()=>{EX.title=$('#sTitle').value.trim()||EX.title;EX.q=Math.max(1,Math.min(300,+$('#sQ').value||EX.q));EX.limit=Math.max(0,+$('#sLim').value||0)*60;
      document.querySelectorAll('[data-ty]').forEach(s=>{const k=+s.dataset.ty,q=qOf(k);if(q.t===s.value)return;let Q=(EX.qs||[]).find(x=>x.n===k);if(!Q){Q={n:k,gen:1};(EX.qs=EX.qs||[]).push(Q)}
        Q.t=s.value;delete EX.ans[k];delete EX.key[k];
        if(Q.t==='tf'&&!Q.ch)Q.ch=['T','F'];if(Q.t==='blank'&&!Q.bl)Q.bl=[{p:0,x:0,y:0,w:0,h:0}];if(Q.t==='mc'&&!Q.opts)delete Q.opts;if(Q.t==='open'&&!Q.area&&!Q.pin&&Q.p)Q.pin={p:Q.p,x:Math.max(6,Q.x-28),y:Q.y};
        if(Q.t==='tf'&&!Q.tf&&Q.p)Q.tf={p:Q.p,x:Math.max(40,(PAGES[Q.p-1]||{w:600}).w-110),y:Q.y,h:12}});
      save();redrawQ();drawSheet();const tt=document.querySelector('.ttl');if(tt)tt.textContent=EX.title;KA.toast('Ayarlar kaydedildi.')},
    clearans:()=>{if(confirm('Bütün cevaplar ve sonuç silinsin mi? Notlar ve vurgular kalır.')){EX.ans={};EX.flags={};EX.ai={};EX.result=null;EX.elapsed=0;save();redrawQ();drawSheet()}}
  }[a.dataset.a]||(()=>{}))();
});
document.addEventListener('input',e=>{
  const t=e.target;if(!EX)return;
  if(t.dataset.sb){const k=+t.dataset.sb,q=qOf(k);const arr=Array.isArray(EX.ans[k])?EX.ans[k]:Array(q.bl.length).fill('');arr[+t.dataset.i]=t.value;if(arr.some(v=>v.trim()))EX.ans[k]=arr;else delete EX.ans[k];save();
    const pi=document.querySelector(`[data-bq="${k}"][data-i="${t.dataset.i}"]`);if(pi){pi.value=t.value;fitBl(pi)}syncRow(k)}
  else if(t.dataset.sk){const k=+t.dataset.sk;if(t.value.trim())EX.key[k]=t.value.trim();else delete EX.key[k];save()}
});
document.addEventListener('keydown',e=>{
  if(!EX||!PAGES.length)return;
  if(e.target.matches&&e.target.matches('input,textarea,select'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  const m={v:'hl',u:'ul',p:'pen',n:'note',e:'erase',t:'txt',o:'circ',escape:'select',r:'rect'}[e.key.toLowerCase()];if(m&&!e.ctrlKey&&!e.metaKey)setTool(m);
});
let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(PAGES.length&&innerWidth<900){const z=ZOOM;fitZoom();if(Math.abs(z-ZOOM)>.02)layout();else ZOOM=z}},300)});
addEventListener('hashchange',route);
function route(){const id=location.hash.slice(1);if(id)openExam(id).catch(err=>{console.error(err);library()});else library()}
KA.nav('sinav.html');
if(!('indexedDB' in window)){$('#main').innerHTML='<div class="card" style="padding:30px"><h2>Tarayıcın sınav kaydını desteklemiyor</h2><p class="mut">Güncel bir tarayıcıyla tekrar dene.</p></div>'}else route();
</script>
</body>
