const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// harf düzeyi fark (yazılan → doğru)
function charDiff(got,want){
  const a=got,b=want,m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const out=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&a[i-1]===b[j-1]&&d[i][j]===d[i-1][j-1]){out.push(['g',b[j-1]]);i--;j--}
    else if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+1){out.push(['m',b[j-1]]);out.push(['r',a[i-1]]);i--;j--}
    else if(j>0&&d[i][j]===d[i][j-1]+1){out.push(['m',b[j-1]]);j--}
    else{out.push(['r',a[i-1]]);i--}
  }
  return out.reverse().map(([k,c])=>`<span class="${k}">${c===' '?'&nbsp;':esc(c)}</span>`).join('');
}
// kelime düzeyi hizalama: hedefteki her kelime bulundu mu?
function wordAlign(heard,target){
  const H=norm(heard).split(' ').filter(Boolean),T=target.split(/\s+/).filter(Boolean),Tn=T.map(norm);
  const m=H.length,n=T.length,L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  const eq=(h,t)=>h===t||(t.length>4&&lev(h,t)<=1);
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=eq(H[i],Tn[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(eq(H[i],Tn[j])){ok[j]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const cnt=Tn.filter(Boolean).length||1;
  return {html:T.map((w,k)=>`<span class="wd ${ok[k]?'g':'r'}">${esc(w)}</span>`).join(' '),score:ok.filter((v,k)=>v&&Tn[k]).length/cnt};
}

async function playFrom(i,paras,draw){
  const tok=++PL.tok;PL.on=true;
  for(let k=i;k<paras.length;k++){
    if(tok!==PL.tok)return;PL.i=k;draw();
    KA.ttsWarm(paras[k+1]);
    await KA.speakP(paras[k],CFG.rate);
    if(tok!==PL.tok)return;PL.heard.add(k);
    await new Promise(r=>setTimeout(r,700));
  }
  if(tok!==PL.tok)return;PL.on=false;PL.done=true;draw();
}

async function lecMake(){

  const r=await KA.askJ(LECSYS,`TOPIC: ${t}\nLENGTH: ${LEC.len==='long'?'about 520-600 words (8-9 paragraphs)':'about 300-350 words (6-7 paragraphs)'}\nPick a specific, interesting sub-topic that is not the forgetting curve.`,{ms:90000});

const TEDSYS=`You write BUEPT-style listening comprehension questions for a TED talk. You get the talk's transcript as numbered paragraphs [index | mm:ss]. Use ONLY information in the transcript.
Write exactly 10 questions in the order of the talk: 7 multiple choice ("mc", 4 options, one correct, plausible distractors) testing main idea, key details, examples/stories, the speaker's opinion and purpose; 3 note-completion gaps ("gap": a note-style sentence with ____ whose answer is 1-3 words spoken in the talk). For each question give "p" (paragraph index) and "kanit" (an exact short quote, max 25 words, that proves the answer).
Also give a one-sentence Turkish summary ("ozet") and 6 useful words from the talk with Turkish meanings ("vocab").
Return ONLY JSON: {"ozet":"...","qs":[{"type":"mc","q":"...","opts":["...","...","...","..."],"a":0,"p":0,"kanit":"..."},{"type":"gap","q":"...____...","a":"...","alt":[],"p":0,"kanit":"..."}],"vocab":[{"en":"...","tr":"..."}]}`;
let TED={phase:'pick'};
const tedCache=()=>KA.store.get('ka_ted',{})||{};
const mmss=ms=>{const s=Math.round((ms||0)/1000);return Math.floor(s/60)+':'+pad(s%60)};
function drawTed(){

function tedPick(){

  <p class="mut" style="margin:0 0 16px">Sorular konuşmanın gerçek metninden hazırlanır; her cevabın videonun kaçıncı dakikasında geçtiğini görürsün.</p>
  <div class="tgrid">${TALKS.map((t,i)=>`<button class="talk" data-talk="${i}"><span class="tth t${i%6}"><b>TED</b><i>${t.min} dk</i></span><span class="ttb"><b>${esc(t.title)}</b><span>${esc(t.speaker)}</span><span class="tmeta"><em>${esc(t.topic)}</em><em>${t.lvl}</em>${C[t.slug]&&C[t.slug].score!=null?`<em class="sc">${C[t.slug].score}/10</em>`:''}</span></span></button>`).join('')}</div>
  <div class="olab" style="margin:22px 0 8px">Başka bir TED konuşması</div><div class="sbar2"><input id="tlink" placeholder="TED bağlantısını yapıştır: https://www.ted.com/talks/..." autocomplete="off"><button class="btn btn-p" id="topen">Aç</button></div><div id="tmsg" class="mut" style="margin-top:8px;font-size:14px"></div>`;

function tedOpen(t){
  LEC.notes='';TED={phase:'watch',talk:t,status:'loading',quiz:null};draw();

async function tedPrepare(t){
  const C=tedCache();
  if(C[t.slug]&&C[t.slug].quiz){TED.quiz=C[t.slug].quiz;TED.status='ready';return tedStatus()}
  if(window.KA_PREVIEW_TED&&KA_PREVIEW_TED[t.slug]){await new Promise(r=>setTimeout(r,900));TED.quiz=KA_PREVIEW_TED[t.slug];TED.status='ready';return tedStatus()}
  if(window.KA_PREVIEW){TED.status='err';TED.err='Önizlemede yalnızca “Try something new for 30 days” konuşmasının örnek quiz’i var.';return tedStatus()}
  let data=null,err='';
  try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);const r=await fetch('api/ted?slug='+encodeURIComponent(t.slug),{signal:ac.signal});clearTimeout(tm);if(r.ok)data=await r.json();else err='metin bulunamadı'}catch(e){err='bağlantı'}
  if(TED.talk!==t)return;
  if(!data||!Array.isArray(data.paras)||data.paras.length<3){TED.status='err';TED.err='Bu konuşmanın metnine şu an ulaşılamadı ('+err+'). Başka bir konuşma seç.';return tedStatus()}
  if(data.title)t.title=data.title;if(data.speaker)t.speaker=data.speaker;
  TED.status='quiz';tedStatus();
  let txt='',lim=14000;data.paras.forEach((p,i)=>{const line=`[${i} | ${mmss(p.t)}] ${p.text}\n`;if(txt.length+line.length<lim)txt+=line});
  const r=await KA.askJ(TEDSYS,`TALK: ${t.title} — ${t.speaker}\nTRANSCRIPT:\n${txt}`,{ms:90000});
  if(TED.talk!==t)return;
  const d=r.json;
  if(!d||!Array.isArray(d.qs)||d.qs.length<5){TED.status='err';TED.err='Quiz hazırlanamadı'+(r.err?' ('+r.err+')':'')+'. Tekrar dene.';return tedStatus()}
  d.qs=d.qs.filter(q=>q&&q.q&&(q.type==='gap'?q.a:Array.isArray(q.opts)&&q.opts.length>=2&&q.a>=0&&q.a<q.opts.length)).slice(0,10);
  d.qs.forEach(q=>{if(Number.isInteger(q.p)&&data.paras[q.p])q.t=data.paras[q.p].t});
  TED.quiz=d;TED.status='ready';
  const C2=tedCache();C2[t.slug]={quiz:d,title:t.title,score:null};const ks=Object.keys(C2);if(ks.length>25)delete C2[ks[0]];KA.store.set('ka_ted',C2);
  tedStatus();
}
function tedStatus(){

function tedWatch(){
  const t=TED.talk;
  const vid=window.KA_PREVIEW?`<div class="vph"><b>TED</b><span>${esc(t.title)}</span><i>Video gerçek sitede burada oynar (önizlemede dış videolar kapalı).</i></div>`:`<iframe src="https://embed.ted.com/talks/${encodeURIComponent(t.slug)}" title="${esc(t.title)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
  $('#stage').innerHTML=`<div class="stop"><span class="eyebrow">${esc(t.topic)}${t.lvl?' · '+t.lvl:''}</span><button class="btn btn-ghost btn-sm" id="tback">${ic('back')}Konuşmalar</button></div><h2 class="serif" style="margin:4px 0 2px;font-size:24px">${esc(t.title)}</h2><p class="mut" style="margin:0 0 12px">${esc(t.speaker)}${t.min?' · ≈'+t.min+' dk':''}</p>${stepsHTML(0,1)}
    <div class="video">${vid}</div>
    <p class="note" style="margin:10px 0 0">Önce altyazısız izle. Zorlanırsan videonun altındaki altyazı düğmesinden İngilizce altyazıyı aç.</p>
    <div class="tfoot"><span id="tst" class="tst"></span><button class="btn btn-p btn-lg" id="tgo" disabled>Quiz'e geç ${ic('arrow')}</button></div>`;
  $('#side').innerHTML=notesPanel('İzlerken notların');bindNotes();
  $('#tback').onclick=()=>{TED={phase:'pick'};draw()};
  $('#tgo').onclick=()=>{TED.Q={qs:TED.quiz.qs,ans:{}};TED.phase='quiz';draw();scrollTo({top:0,behavior:'smooth'})};
  tedStatus();
}
function tedQuiz(){
  const Q=TED.Q;
  $('#stage').innerHTML=`<div class="stop"><span class="eyebrow">${esc(TED.talk.title)}</span><span class="cnt" id="qcnt"></span></div>${stepsHTML(1,1)}${quizHTML(Q)}<div class="acts2" style="margin-top:18px"><button class="btn btn-ghost" id="bk">Videoya dön</button><button class="btn btn-p btn-lg" id="sub">${ic('check')}Cevapları kontrol et</button></div>`;
  $('#side').innerHTML=notesPanel('Notların');bindNotes();
  $('#bk').onclick=()=>{TED.phase='watch';draw()};
  bindQuiz(Q,()=>{gradeQuiz(Q);const C=tedCache();if(C[TED.talk.slug]){C[TED.talk.slug].score=Q.score;KA.store.set('ka_ted',C)}TED.phase='result';draw();scrollTo({top:0,behavior:'smooth'})});
}
function tedResult(){
  const Q=TED.Q,d=TED.quiz,sc=Q.score;
  $('#stage').innerHTML=`${stepsHTML(2,1)}<div class="rtop"><div><span class="eyebrow">Sonuç · ${esc(TED.talk.title)}</span><h2 class="serif">${sc} / ${Q.qs.length}</h2><p class="mut" style="margin:0">${esc(d.ozet||'')}</p></div><div class="acts2"><button class="btn btn-ghost" id="rw">Videoyu tekrar izle</button><button class="btn btn-p" id="nt">Başka konuşma</button></div></div>
    <div class="rlist">${resultHTML(Q,{where:q=>q.t!=null?` <span class="tstamp">${ic('play')}${mmss(q.t)}</span>`:''})}</div>
    ${(d.vocab||[]).length?`<h3 class="sh">Konuşmadan kelimeler</h3><div class="vchips">${d.vocab.map((v,i)=>`<button data-voc="${i}"><b>${esc(v.en)}</b> · ${esc(v.tr)} <span>${ic('plus')}</span></button>`).join('')}</div>`:''}
    <p class="note" style="margin-top:18px">Video ve konuşma metni TED'e aittir (ted.com).</p>`;
  $('#side').innerHTML=notesPanel('Notların',null,true);
  $('#rw').onclick=()=>{TED.phase='watch';draw()};$('#nt').onclick=()=>{TED={phase:'pick'};draw()};
  vocBind(d.vocab||[]);
}

/* ---------- Ortak ---------- */
function score(ok,m){
  if(ok){SES.ok++;SES.streak++;SES.best=Math.max(SES.best,SES.streak);KA.sfx&&KA.sfx.ok()}
  else{SES.streak=0;SES.miss.push(m);KA.sfx&&KA.sfx.bad()}
  drawSide();
}
function next(){
  if(REC)stopRec();KA.stopSpeak();
  SES.i++;SES.state='ask';
  if(SES.i>=SES.list.length)SES.done=true;
  draw();
}
function drawEnd(){
  const s=SES,pct=Math.round(s.ok/s.list.length*100);
  $('#bar').style.width='100%';
  $('#stage').innerHTML=`<div class="center-col end"><span class="eyebrow">Tur bitti</span><h2 class="serif">${s.ok} / ${s.list.length}</h2><p class="mut" style="margin:0">Başarı %${pct} · en uzun seri ${s.best}</p>
    <div class="acts2" style="margin-top:8px">${s.miss.length&&CFG.mode!=='pairs'?`<button class="btn btn-p" id="redo">Hatalıları tekrar çalış</button><button class="btn btn-ghost" id="unk">${ic('plus')}Bilmediklerime ekle</button>`:''}<button class="btn ${s.miss.length&&CFG.mode!=='pairs'?'btn-ghost':'btn-p'}" id="newr">Yeni tur</button></div></div>`;
  $('#newr').onclick=()=>newSession();
  const rd=$('#redo');if(rd)rd.onclick=()=>{const ens=new Set(s.miss.map(m=>m.say));newSession(s.list.filter(x=>ens.has(x.en)||ens.has(x.s)))};
  const uk=$('#unk');if(uk)uk.onclick=()=>{const ens=new Set(s.miss.map(m=>m.say));let n=0;s.list.filter(x=>ens.has(x.en)||ens.has(x.s)).forEach(x=>{try{KA.addUnknown(x.en,x.tr,{s:x.s});n++}catch(e){}});KA.toast(n+' kelime Bilmediklerim listesine eklendi.');uk.disabled=true};
}
document.addEventListener('click',e=>{
  const t=e.target;
  const m=t.closest("[data-dm]");if(m){if(REC)stopRec();CFG.mode=m.dataset.dm;save();return newSession()}
  const u=t.closest('[data-unit]');if(u){CFG.unit=u.dataset.unit;save();return newSession()}
  const r=t.closest('[data-rate]');if(r){CFG.rate=+r.dataset.rate;save();drawTop();return}
  const tp=t.closest('[data-topic]');if(tp){LEC.topic=+tp.dataset.topic;return draw()}
  const ln=t.closest('[data-len]');if(ln){LEC.len=ln.dataset.len;return draw()}
  const ex=t.closest('[data-exam]');if(ex){LEC.exam=ex.dataset.exam==='1';return draw()}
  const hs=t.closest('[data-hist]');if(hs){const h=lecHist()[+hs.dataset.hist];if(h)lecStart(h.data);return}
});
document.addEventListener('change',e=>{if(e.target.id==='src'){CFG.src=e.target.value;save();newSession()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&SES&&!SES.done&&SES.state==='done'&&!e.target.closest('textarea,input')){const n=$('#nx');if(n&&document.activeElement!==n){e.preventDefault();n.click()}}});
KA.nav('dinle.html');
newSession();
})();
</script>
</body>
</html>
