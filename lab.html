  const got=[];const give=k=>{if(!p.ach.includes(k)){p.ach.push(k);got.push(k)}};
  if(win&&alive)give('ilk');if(win&&alive&&!g.mist.length&&g.n>=4)give('kusursuz');if(g.maxc>=8)give('kombo8');if(win&&alive&&g.dk==='zor')give('efsane');if(win&&alive&&g.data&&(g.data.own||(Array.isArray(g.data)&&g.data[0]&&g.data[0].own)))give('kendi');

  <div class="gain"><span>🪙 +${g.coins+st*5} jeton</span><span>✦ +${Math.round(g.score/6)} XP</span>${g.usedPu?`<span>⚡ ${g.usedPu} güçlendirici</span>`:''}</div>

  ${g.k==='mimar'&&p.city.length?cityHtml(p.city):''}
  ${g.mist.length?`<div class="rev"><div style="background:var(--soft)"><b>Tekrar et: ${g.mist.length} hata</b>Her birinin doğrusu ve nedeni aşağıda.</div>${g.mist.map(m=>`<div><b>${esc(m.q)}</b>Doğrusu: ${esc(m.a)}${m.why?'<br>'+esc(m.why):''}</div>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-p" data-a="again">${ic('reset')}Tekrar oyna</button><button class="btn btn-ghost" data-go="${g.k}">Yeni içerik / zorluk</button><button class="btn btn-ghost" data-a="hub">Okuma Oyunları</button></div></section>`;

/* ===== 3. TUZAK LABORATUVARI ===== */
const BIN_E={cause:'🔁',degree:'📏',compare:'⚖️',who:'👤',none:'🚫'};
function tStart(){const g=G,T=g.data;g.T=T;g.list=[];shuf(T.r.map((x,i)=>i)).forEach(ri=>shuf(T.r[ri].s).forEach(s=>g.list.push([s[0],s[1],ri])));g.i=0;g.cur=null;g.gone=[];drawT()}
function drawT(keep){
  const g=G,x=g.list[g.i],r=g.T.r[x[2]],a=g.cur,B=D.tuzak.bins;
  frame(`<section class="card stg"><div class="lbl">Numune ${g.i+1} / ${g.list.length}</div><div class="src">${KA.tokens(r.t)}</div>
  ${g.d.tz&&a==null?`<div class="tbar ${g.frz?'frz':''}" id="tb"><i style="width:100%"></i></div>`:''}
  <div class="stm" id="stm" lang="en">${esc(x[0])}</div><p class="mut" style="font-size:13px;margin:8px 0 0">Bu ifade metne göre yanlış. Hangi tuzakla yanlış yapılmış?${g.hintT&&a==null?` <b>💡 ${esc(HINTT[x[1]])}</b>`:''}</p>
  <div class="bins">${Object.entries(B).map(([b,n])=>`<button data-tz="${b}" class="${a?(b===x[1]?'ok':b===a?'no':''):g.gone.includes(b)?'gone':''}" ${a||g.gone.includes(b)?'disabled':''}><i>${BIN_E[b]}</i>${n}</button>`).join('')}</div>
  ${a?`<div class="fb ${a===x[1]?'ok':'no'}"><b>${a===x[1]?'Tuzağı yakaladın!':a==='late'?'Süre doldu · Doğrusu: '+B[x[1]]:'Doğrusu: '+B[x[1]]}</b>${esc(D.tuzak.why[x[1]])}</div><div class="row" style="margin-top:10px"><button class="btn btn-p" data-a="tnext" id="nx">${g.i+1<g.list.length?'Sıradaki ifade':'Laboratuvar raporu'}${ic('arrow')}</button></div>`:''}</section>`);
  if(a==null&&g.d.tz&&!keep){g.tl=g.d.tz*10;g.tst=Date.now()}
  if(a==null&&g.d.tz){stopTick();TICK=setInterval(()=>{if(!G||G.k!=='tuzak'||G.cur!=null)return stopTick();if(G.frz)return;G.tl--;const b=$('#tb');if(b){b.firstElementChild.style.width=(G.tl/(G.d.tz*10)*100)+'%';b.classList.toggle('low',G.tl<G.d.tz*3)}if(G.tl<=0){stopTick();tAns('late',$('#stm'))}},100)}
}
const HINTT={cause:'Metindeki neden ile sonuca bak: hangisi hangisine yol açıyor?',degree:'Kesinlik kelimelerine bak: may, some, slightly, one of…',compare:'Karşılaştırma kelimelerine bak: more, less, higher, lower.',who:'Bu bilgiyi metinde KİM söylüyor?',none:'Bu bilgi metinde gerçekten geçiyor mu?'};
function tAns(b,el){const g=G,x=g.list[g.i];if(g.cur!=null)return;g.cur=b;stopTick();if(b===x[1]){const bonus=g.d.tz?Math.round(Math.max(0,g.tl)/(g.d.tz*10)*10):0;good(el,10,bonus)}else{g.mist.push({q:x[0],a:D.tuzak.bins[x[1]],why:D.tuzak.why[x[1]]});if(!bad(el))return}g.frz=false;g.hintT=false;g.gone=[];drawT(true)}
function tClick(t){const g=G;if(!g||g.k!=='tuzak'||g.done)return false;const b=t.closest('[data-tz]');if(!b)return false;tAns(b.dataset.tz,b);return true}
function tNext(){const g=G;g.i++;g.cur=null;if(g.i>=g.list.length)return finish(true);drawT();scrollTo({top:0})}

/* ===== 4. TARAMA RADARI ===== */
function rStart(){const g=G;g.R=g.data;g.qs=shuf(g.R.q);g.qi=0;g.left=g.d.rd;g.dim=[];g.okp=null;g.wr=null;drawR();stopTick();TICK=setInterval(()=>{if(!G||G.k!=='radar'||G.done)return stopTick();G.left--;const e=$('#rt');if(e){e.textContent=fmt(G.left);e.style.color=G.left<=20?'var(--bad)':''}if(G.left<=0)finish(G.qi>=Math.ceil(G.qs.length/2),`<p>${G.qi} / ${G.qs.length} bilgi bulundu</p>`)},1000)}
const fmt=s=>Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
function drawR(){
  const g=G,R=g.R,q=g.qs[g.qi];
  frame(`<div class="rq"><div class="card"><span class="sweep"></span><b>Hangi paragrafta: <span lang="en">${esc(q[0])}</span>?</b><span class="mut" style="font-weight:800">${g.qi+1}/${g.qs.length}</span><span class="rtime" id="rt">${fmt(g.left)}</span></div></div>
  <section class="card stg"><h2 class="ttl" style="text-align:center">${esc(R.title)}</h2><p class="mut" style="text-align:center;font-size:13px;margin:0 0 10px">Okuma, tara: anahtar kelimenin eş anlamlısını ara.</p>${R.p.map((p,i)=>`<button class="rp ${g.okp===i+1?'ok':''} ${g.wr===i+1?'no':''} ${g.dim.includes(i+1)?'dim':''}" data-rp="${i+1}" ${g.dim.includes(i+1)?'disabled':''}><i>${i+1}</i><span>${esc(p)}</span></button>`).join('')}</section>`);
  g.qt0=Date.now();
}
function rClick(t){const g=G;if(!g||g.k!=='radar'||g.done)return false;const b=t.closest('[data-rp]');if(!b)return false;if(g.okp)return true;const n=+b.dataset.rp,q=g.qs[g.qi];
  if(n===q[1]){const s=(Date.now()-g.qt0)/1000;if(s<3)g.fast=true;const bonus=Math.max(0,Math.round(12-s));good(b,10,bonus);if(s<4)floatTxt(b,'⚡ Hızlı!','cb');g.okp=n;g.wr=null;drawR();setTimeout(()=>{if(!G||G.k!=='radar'||G.done)return;g.okp=null;g.dim=[];g.qi++;if(g.qi>=g.qs.length)finish(true,`<p>Kalan süre: <b>${fmt(g.left)}</b></p>`);else drawR()},550)}
  else{if(!g.shield)g.left-=8;g.wr=n;g.mist.push({q:q[0],a:'Paragraf '+q[1],why:'Paragraf '+q[1]+': '+g.R.p[q[1]-1].slice(0,110)+'…'});bad(b);if(g.left<=0)return finish(false),true;drawR()}return true}

/* ===== 5. KELİME BÜTÇESİ ===== */
function bStart(){const g=G;g.L=shuf(g.data).slice(0,6);g.i=0;g.sel=[];g.res=null;g.perfect=true;drawB()}
function drawB(){
  const g=G,x=g.L[g.i],r=g.res;const ws=x.t.split(/\s+/);const used=g.sel.length;
  let hlIdx=[];if(g.hl){const ss=x.t.match(/[^.!?]+[.!?]*/g)||[x.t];const s=ss.find(z=>x.keys.every(gr=>gr.some(k=>norm(z).includes(norm(k)))))||ss.find(z=>x.keys[0].some(k=>norm(z).includes(norm(k))))||'';let pos=0;ws.forEach((w,i)=>{const at=x.t.indexOf(w,pos);pos=at+w.length;if(s&&at>=x.t.indexOf(s.trim())&&at<x.t.indexOf(s.trim())+s.trim().length)hlIdx.push(i)})}
  frame(`<section class="card stg"><div class="lbl">Soru ${g.i+1} / ${g.L.length}</div><h3 style="margin:0 0 4px" lang="en">${esc(x.q)}</h3><div class="row" style="justify-content:space-between;margin:6px 0 12px"><span class="wl">NO MORE THAN ${x.lim} WORDS</span><span class="coins" title="Kelime jetonu">${Array.from({length:Math.max(x.lim,used)},(_,i)=>`<i class="${i<used?(i>=x.lim?'over':'u'):''}"></i>`).join('')}</span></div>
  <div class="para" lang="en">${ws.map((w,i)=>`<button class="wtok ${g.sel.includes(i)?'on':''} ${hlIdx.includes(i)?'hl':''}" data-wt="${i}" ${r?'disabled':''}>${esc(w)}</button>`).join(' ')}</div>
  <div class="tray" id="tray">${g.sel.length?g.sel.map(i=>`<button data-tr="${i}" ${r?'disabled':''}>${esc(ws[i].replace(/[.,;:!?"“”()]/g,''))}</button>`).join(''):'<span class="mut" style="font-size:13.5px">Cevabın burada oluşur. Metindeki kelimelere dokun.</span>'}</div>
  ${r?`<div class="fb ${r.ok?'ok':'no'}"><b>${r.ok?(r.extra?'Doğru, ama savurgan':'Tam isabet!'):r.over?'Bütçe aşıldı':'Kilit bilgi eksik'}</b>Örnek cevap: <b style="display:inline" lang="en">${esc(x.m)}</b>${r.ok&&r.extra?` · ${r.extra} fazla kelime: sınavda gereksiz kelime yanlış bilgi riskini artırır.`:''}</div><div class="row" style="margin-top:10px"><button class="btn btn-p" data-a="bnext">${g.i+1<g.L.length?'Sonraki soru':'Sonuç'}${ic('arrow')}</button></div>`:`<div class="row" style="margin-top:12px;gap:8px"><button class="btn btn-p" data-a="bcheck" ${used?'':'disabled'}>${ic('check')}Cevabı teslim et</button><button class="btn btn-ghost" data-a="bclear">Temizle</button></div>`}</section>`);
}
function bClick(t){const g=G;if(!g||g.k!=='butce'||g.done)return false;
  const w=t.closest('[data-wt]');if(w){if(g.res)return true;const i=+w.dataset.wt;if(g.sel.includes(i))g.sel=g.sel.filter(x=>x!==i);else{if(g.sel.length>=g.L[g.i].lim+2){KA.toast('Bütçen bitti. Bir kelimeyi geri al.');shake($('#tray'));return true}g.sel.push(i);KA.sfx.tick()}drawB();return true}
  const tr=t.closest('[data-tr]');if(tr){if(g.res)return true;g.sel=g.sel.filter(x=>x!==+tr.dataset.tr);drawB();return true}return false}
function bCheck(){const g=G,x=g.L[g.i],ws=x.t.split(/\s+/);const v=g.sel.map(i=>ws[i]).join(' ');const n=g.sel.length,ideal=Math.min(x.lim,x.m.split(/\s+/).length);const over=n>x.lim,ok=!over&&keyOk(v,x.keys);const extra=Math.max(0,n-ideal);g.res={ok,over,extra};const tray=$('#tray');
  if(ok){good(tray,Math.max(8,24-extra*5));if(extra)g.perfect=false}else{g.perfect=false;g.mist.push({q:x.q,a:x.m,why:over?'Kelime sınırını aştın.':'Cevapta kilit bilgi yoktu.'});if(!bad(tray))return}drawB()}

/* ===== Olaylar ===== */
async function go(k){stopTick();await load();brief(k);scrollTo({top:0})}
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('.wtok')){const tk=t.closest('.tk');if(tk&&!(G&&G.k==='tuzak'&&G.d&&G.d.tz&&G.cur==null)){KA.lookup(tk.dataset.w,{anchor:tk,context:''});return}}
  const pu=t.closest('[data-pu]');if(pu){usePu(pu.dataset.pu);return}
  const by=t.closest('[data-buy]');if(by){buy(by.dataset.buy);return}
  const dk=t.closest('[data-dk]');if(dk){DK=dk.dataset.dk;try{localStorage.setItem('ka_lab_dk',DK)}catch(x){}document.querySelectorAll('[data-dk]').forEach(b=>b.classList.toggle('on',b===dk));return}
  if(mClick(t)||sClick(t)||tClick(t)||rClick(t)||bClick(t))return;
  const g=t.closest('[data-go]');if(g){go(g.dataset.go);return}
  const a=t.closest('[data-a]');if(!a)return;
  ({hub:()=>{stopTick();hub()},start,again:()=>{const k=G.k,d=G.data;newG(k,d);({mimar:mStart,sempo:sStart,tuzak:tStart,radar:rStart,butce:bStart})[k]();scrollTo({top:0})},
    quit:()=>{if(G&&G.n&&!G.done&&!confirm('Oyundan çıkılsın mı? Bu turun puanı kaydedilmez.'))return;brief(G.k)},
    mcheck:mCheck,mnext:()=>{G.ri++;G.gone=[];G.cue=false;if(G.ri>=G.A.p.length){G.ph='insp';G.qi=0;G.qa=null}drawM();scrollTo({top:0})},mqn:()=>{G.qi++;G.qa=null;G.gone=[];if(G.qi>=G.A.q.length)return finish(true);drawM()},
    s1:()=>{G.ph='match';drawS();scrollTo({top:0})},snext:()=>{G.mi++;G.cur=null;G.gone=[];G.hintF=false;if(G.mi>=G.S.match.length){G.ph='mc';G.qi=0}drawS();scrollTo({top:0})},sqn:()=>{G.qi++;G.ma=null;G.gone=[];if(G.qi>=G.S.mc.length)G.ph='short';drawS();scrollTo({top:0})},scheck:sCheck,sdone:()=>finish(true),
    tnext:tNext,bcheck:bCheck,bclear:()=>{G.sel=[];drawB()},bnext:()=>{G.i++;G.sel=[];G.res=null;G.hl=false;G.gaveKey=false;if(G.i>=G.L.length)return finish(true);drawB()}}[a.dataset.a]||(()=>{}))();
});
document.addEventListener('keydown',e=>{if(!G||G.done||e.metaKey||e.ctrlKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='Enter'){const n=document.querySelector('[data-a=tnext],[data-a=snext],[data-a=sqn],[data-a=mnext],[data-a=mqn],[data-a=bnext]');if(n){e.preventDefault();n.click()}return}
  const k='12345'.indexOf(e.key);if(k<0)return;
  if(G.k==='tuzak'&&G.cur==null){const b=document.querySelectorAll('[data-tz]:not([disabled])');const all=[...document.querySelectorAll('[data-tz]')];if(all[k]&&!all[k].disabled)all[k].click()}
  else if(G.k==='sempo'){const all=[...document.querySelectorAll('[data-sm],[data-smq]')];if(all[k]&&!all[k].disabled)all[k].click()}
  else if(G.k==='mimar'&&G.ph==='insp'){const all=[...document.querySelectorAll('[data-mq]')];if(all[k]&&!all[k].disabled)all[k].click()}
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(GAMES[h]&&(!G||G.k!==h))go(h);else if(!h&&G)hub()});
KA.nav('oyunlar.html');KA._labG=()=>G;
load().then(()=>{const h=location.hash.slice(1);if(GAMES[h])brief(h);else hub()}).catch(()=>{$('#main').innerHTML='<p class="bad">İçerik yüklenemedi.</p>'});
})();
</script>
