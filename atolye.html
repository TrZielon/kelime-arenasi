<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Atölyesi · Kelime Arenası</title>
<meta name="theme-color" content="#0f766e">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css?v=22">
<style>
.intro{padding:22px 24px}
.intro h1{font-size:clamp(26px,4vw,38px);margin:6px 0}
.intro p{margin:0;color:var(--ink2);max-width:70ch}
.ftabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.ftab{--d:var(--line2);display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:16px;padding:12px 13px;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.ftab:active{transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.ftab.on{--d:color-mix(in srgb,var(--p) 68%,#000);box-shadow:0 0 0 2px var(--p) inset,0 4px 0 var(--d);background:color-mix(in srgb,var(--p) 6%,var(--card))}
.ftab i{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--p)}
.ftab.on i{background:var(--p);color:var(--p-ink)}
.ftab i svg{width:22px;height:22px}
.ftab b{display:block;font-size:15px;line-height:1.2}
.ftab small{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.ftab em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--acc2);background:var(--acc-soft);border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.why{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--acc-soft);font-size:14px;color:var(--ink2);line-height:1.5}
.why svg{width:18px;height:18px;color:var(--acc2);flex:0 0 auto;margin-top:2px}
.pane{margin-top:16px;max-width:820px;margin-left:auto;margin-right:auto}#wsrc{max-width:820px;margin:16px auto 0}#wsrc .wsrc{margin:0}
.box{padding:22px 24px;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--mut)}
.steps span.on{background:var(--p);color:var(--p-ink)}
.steps span.ok{background:var(--ok-soft);color:var(--ok)}
.task{font-size:15px;font-weight:700;margin:12px 0;color:var(--ink2)}
.task b{color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts button,.chip{--d:var(--line2);border:0;border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.opts button:active:not(:disabled),.chip:active{transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.opts button.ok{--d:color-mix(in srgb,var(--ok) 66%,#000);box-shadow:0 0 0 2px var(--ok) inset,0 4px 0 var(--d);background:var(--ok-soft)}
.opts button.no{--d:color-mix(in srgb,var(--bad) 66%,#000);box-shadow:0 0 0 2px var(--bad) inset,0 4px 0 var(--d);background:var(--bad-soft);animation:kaShake .45s}
.opts button:disabled{cursor:default}
.opts button small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.rep{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:15px;line-height:1.55;animation:kaRise .45s var(--out)}
.rep b{color:var(--ink)}
.nx{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.dots{display:flex;gap:6px;margin-top:14px;justify-content:center}
.dots i{width:28px;height:8px;border-radius:5px;background:var(--soft)}.dots i.d{background:var(--ok)}.dots i.x{background:var(--bad)}.dots i.c{background:var(--line2)}
.stars{display:inline-flex;gap:2px;vertical-align:-3px}
.stars svg{width:18px;height:18px;color:var(--line2)}.stars svg.on{color:var(--acc)}
.stamp{position:absolute;right:20px;top:54px;font-family:Fraunces,serif;font-weight:800;font-size:20px;letter-spacing:.08em;color:var(--ok);border:4px double var(--ok);border-radius:10px;padding:2px 12px;rotate:-12deg;animation:kaSlam .5s var(--spring) backwards;background:var(--card);z-index:2}
.stamp.bad{color:var(--bad);border-color:var(--bad)}
/* Dedektif */
.csent{font-family:Fraunces,serif;font-size:clamp(20px,3vw,26px);line-height:1.6;margin:14px 0 6px}
.cw{border-radius:6px;padding:0 2px;transition:background .2s}
.clue-on .cw{cursor:pointer}
.clue-on .cw:hover{background:var(--soft)}
.cw.clue{background:color-mix(in srgb,#7c3aed 16%,transparent);box-shadow:0 2px 0 #7c3aed}
.cw.clue::after{content:attr(data-k);font:800 10px "Plus Jakarta Sans",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#7c3aed;vertical-align:super;margin-left:3px}
:root[data-mode=dark] .cw.clue::after{color:#c4b5fd}
.cw.no{animation:kaShake .45s;background:var(--bad-soft)}
.myst{font-style:italic;color:var(--acc2);border-bottom:3px dotted var(--acc);padding:0 3px}
.myst small{font:800 10px "Plus Jakarta Sans",sans-serif;font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--p);vertical-align:super;margin-left:3px}
.myst.real{font-style:normal;color:var(--ok);border-bottom-style:solid;border-color:var(--ok);animation:kaStamp .5s var(--spring)}
.lens{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lens .slot{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--mut)}
.lens .slot.got{border:0;background:#7c3aed;color:#fff;animation:kaStamp .4s var(--spring)}
.lens .slot svg{width:17px;height:17px}
.ctypes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ctypes div{border-radius:12px;padding:8px 10px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px;color:var(--mut)}
.ctypes div b{display:block;font-size:13.5px;color:var(--ink)}
.ctypes div.on{border-color:#7c3aed;background:color-mix(in srgb,#7c3aed 8%,var(--card))}
.ctypes div.on b{color:#7c3aed}
:root[data-mode=dark] .ctypes div.on b{color:#c4b5fd}
.rank{display:grid;place-items:center;text-align:center;padding:30px 20px}
.rank .badge{width:96px;height:96px;border-radius:30px;background:var(--p);color:var(--p-ink);display:grid;place-items:center;animation:kaStamp .6s var(--spring)}
.rank .badge svg{width:52px;height:52px}
.rank h2{margin:14px 0 4px;font-size:28px}
.mini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.mini span{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
/* Parça (Paraphrase + İz) */
.psg{font-size:16.5px;line-height:1.85}
.psg .sn{border-radius:6px;transition:background .3s,box-shadow .3s}
.tapsent .sn{cursor:pointer}
.tapsent .sn:hover{background:var(--soft)}
.sn.ev{background:color-mix(in srgb,var(--ok) 20%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 40%,transparent)}
.sn.wrong{background:var(--bad-soft);animation:kaShake .45s}
.sn mark{background:color-mix(in srgb,var(--acc) 40%,transparent);color:inherit;border-radius:4px;padding:0 1px}
.stmt{font-family:Fraunces,serif;font-size:clamp(19px,2.6vw,23px);line-height:1.5;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--p) 7%,var(--card));border:1.5px solid color-mix(in srgb,var(--p) 30%,transparent);margin:12px 0}
.stmt mark{background:color-mix(in srgb,var(--acc) 40%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.tfn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tfn button{text-align:center}
.tfn button small{display:block}
.pairs{display:grid;gap:8px;margin-top:10px}
.pairs div{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px;font-size:14.5px;animation:kaRise .4s var(--out) backwards}
.pairs span{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700}
.pairs i{font-style:normal;text-align:center;color:var(--mut);font-weight:800}
.pairs div.trap span{border-color:var(--bad);background:var(--bad-soft)}
.pairs div.trap i{color:var(--bad)}
.izwrap{position:relative}
.iz .tk{border-radius:5px;padding:0 1px;cursor:pointer;transition:background .2s}
.iz .tk:hover{background:var(--soft)}
.iz .tk.pro{background:var(--acc);color:#1f1300;font-weight:800;padding:1px 5px;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent);animation:proP 1.6s ease-in-out infinite}
@keyframes proP{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 12%,transparent)}}
.iz .tk.done{background:color-mix(in srgb,var(--acc) 25%,transparent);font-weight:700}
.iz .tk.ref{background:color-mix(in srgb,var(--ok) 22%,transparent);box-shadow:0 2px 0 var(--ok)}
.iz .tk.wrong{background:var(--bad-soft);animation:kaShake .45s}
.arrow{position:absolute;inset:0;pointer-events:none;overflow:visible}
.arrow path{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .8s var(--out) forwards}
.arrow circle{fill:var(--ok)}
@keyframes draw{to{stroke-dashoffset:0}}
.izq{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:15px;font-weight:700;color:var(--ink2)}
.izq .pw{font-family:Fraunces,serif;font-size:22px;color:var(--acc2)}
.ptypes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptypes span{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
/* Aile */
.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 16px}
.leaf2{border-radius:16px;padding:12px 10px;text-align:center;border:2px dashed var(--line2);min-height:86px;display:grid;align-content:center;gap:4px;transition:all .3s}
.leaf2 small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.leaf2 b{font-family:Fraunces,serif;font-size:18px;color:var(--mut)}
.leaf2.got{border:2px solid var(--p);background:color-mix(in srgb,var(--p) 8%,var(--card));animation:kaStamp .5s var(--spring)}
.leaf2.got b{color:var(--ink)}
.leaf2 b u{text-decoration:none;color:var(--acc2);border-bottom:2px solid var(--acc)}
.root{display:flex;justify-content:center;margin-bottom:6px}
.root span{font-family:Fraunces,serif;font-weight:800;font-size:24px;padding:4px 16px;border-radius:12px;background:var(--p);color:var(--p-ink)}
.fsent{font-family:Fraunces,serif;font-size:clamp(20px,3vw,25px);line-height:1.55;margin:8px 0 14px}
.fsent .gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--acc);text-align:center;color:var(--acc2)}
.fsent .gap.ok{color:var(--ok);border-color:var(--ok);animation:kaStamp .45s var(--spring)}
.fsent .sig{background:color-mix(in srgb,var(--p) 16%,transparent);border-radius:5px;padding:0 3px;box-shadow:0 2px 0 var(--p)}
.sufx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;font-size:12.5px}
.sufx div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink2)}
.sufx b{display:block;color:var(--ink);font-size:13px}
@media (max-width:900px){.ftabs{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.intro{padding:18px}.box{padding:18px}.opts{grid-template-columns:1fr}.ctypes,.sufx{grid-template-columns:1fr 1fr}.tree{grid-template-columns:1fr 1fr}.stamp{top:auto;bottom:14px;right:12px;font-size:17px}.tfn button small{display:none}.ftab small{display:none}}
</style>
</head>
<body>
<main class="ka-wrap" id="main">
  <section class="card intro">
    <span class="eyebrow">Reading Atölyesi</span>
    <h1>Sınavda puan getiren dört beceri</h1>
    <p style="margin-bottom:8px"><a href="oyunlar.html" style="font-weight:800;color:var(--p)">← Oyun Salonu</a></p><p>Her biri BUEPT reading bölümündeki gerçek bir soru tipine karşılık geliyor. Hazır örneklerle anında çalışır; istersen kendi kelime listenle yeni setler hazırlatabilirsin.</p>
    <div class="ftabs" id="ftabs"></div>
    <div class="why" id="why"></div>
  </section>
  <div id="wsrc"></div>
  <div class="pane" id="pane"></div>
</main>
<script src="firebase-config.js?v=22"></script><script src="ortak.js?v=22"></script>
<script>
(function(){
'use strict';
const {$,esc}=KA,ic=KA.ic;
const SV=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 det:SV('<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 6 6"/><path d="M8 10.5a2.5 2.5 0 0 1 2.5-2.5"/>'),
 par:SV('<path d="M4 7h7M4 11h5M13 13h7M15 17h5"/><path d="M11 7c3 0 4 2 4 6"/><path d="m13 11 2 2 2-2"/>'),
 iz:SV('<path d="M5 19c0-6 4-10 10-10"/><path d="m12 6 3 3-3 3"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="9" r="2"/>'),
 fam:SV('<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="12" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 7.5V15.5M12 11H5v4.5M12 11h7v4.5"/>'),
 bulb:SV('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>'),
 star:SV('<path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.3L12 17.5l-5.6 2.9 1.1-6.3L3 9.7l6.2-.9z"/>',1),
 mag:SV('<circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/>'),
 badge:SV('<path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>')
};
const stars=n=>`<span class="stars">${[1,2,3].map(k=>`<svg class="${k<=n?'on':''}" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.3L12 17.5l-5.6 2.9 1.1-6.3L3 9.7l6.2-.9z"/></svg>`).join('')}</span>`;
const TABS=[
 ['det','Bağlam Dedektifi','geliştirildi',I.det,'Bilmediğin kelimeyi cümleden çözme becerisi. Yeni hâli sınavdaki doğru stratejiyi adım adım öğretiyor: önce kelimenin türünü bul (isim mi, sıfat mı?), sonra ipucu kelimeleri topla, sonra anlamı seç. Sonunda hangi ipucu türünü kullandığın gösteriliyor; bu dört tür (tanım, zıtlık, örnek, sebep-sonuç) BUEPT parçalarında sürekli tekrar ediyor.'],
 ['par','Paraphrase Avı','yeni',I.par,'Reading sorularının çoğu parçadaki cümleyi başka kelimelerle sorar. "Dropped considerably" ile "fallen sharply"nin aynı şey olduğunu göremeyen kişi doğru cevabı kaçırır. Burada önce ifadenin Doğru, Yanlış ya da Parçada Yok olduğuna karar veriyorsun, sonra parçada kanıt cümlesine dokunuyorsun. Ardından eşleşen kelimeler yan yana çıkıyor, "only" gibi tuzak kelimeler kırmızıyla işaretleniyor.'],
 ['iz','İz Sürücü','yeni',I.iz,'"What does \'this\' refer to?" BUEPT\'in klasik sorularından. Parçada bir zamir (it, they, this, which) parlıyor; sen onun yerini tuttuğu kelimeye dokunuyorsun ve aradaki bağ bir okla çiziliyor. Uzun parçalarda "kim, neyi yaptı?" takibini kaybetmemeyi öğretiyor.'],
 ['fam','Kelime Ailesi','yeni',I.fam,'Bir kelimeyi bilmek sınavda yetmiyor; analyse, analysis, analytical, analytically arasından cümleye uyanı seçmen gerekiyor. Her doğru cevap ailenin ağacına bir dal ekliyor. Cevaptan sonra cümlede seni doğru türe götüren işaret (the, very, to) yanıyor ve ek kuralı (-tion isim, -al sıfat, -ly zarf) gösteriliyor.']
];
let TAB=(location.hash.slice(1))||KA.store.raw('ka_feat2','det');if(!TABS.some(t=>t[0]===TAB))TAB='det';
function drawTabs(){
  $('#ftabs').innerHTML=TABS.map(([k,n,tag,svg])=>`<button class="ftab ${TAB===k?'on':''}" data-tab="${k}"><i>${svg}</i><div><b>${n}</b><small>${tag==='yeni'?'<em>YENİ</em>':'<em>GELİŞTİRİLDİ</em>'}</small></div></button>`).join('');
  const t=TABS.find(x=>x[0]===TAB);$('#why').innerHTML=`${I.bulb}<div><b>Neden işe yarar?</b> ${esc(t[4])}</div>`;
}
/* ============ BAĞLAM DEDEKTİFİ (v2) ============ */
const CT={tanim:['Tanım','cümle kelimeyi açıklıyor'],zitlik:['Zıtlık','unlike, but, while'],ornek:['Örnek','such as, for example'],sebep:['Sebep-sonuç','so, because, as a result']};
const POS=['isim','fiil','sıfat','zarf'];
let CASES=[
 {s:'Unlike her talkative brother, Maya was quite {X} and rarely spoke in class.',x:'blorvy',real:'reticent',pos:2,posWhy:'"quite" ve "was" sonrasında gelen kelime, Maya\'yı niteleyen bir sıfattır.',clues:{Unlike:'zıtlık',talkative:'karşıtı',rarely:'tanım',spoke:'tanım'},ct:'zitlik',o:['konuşkan','az konuşan, içine kapanık','öfkeli','çalışkan'],a:1,how:'"Unlike" zıtlık sinyali: kardeşi konuşkan, Maya tersi. "rarely spoke" da bunu açıkça tarif ediyor.'},
 {s:'Clean water is {X} in the region, so families often walk for hours to find it.',x:'trembish',real:'scarce',pos:2,posWhy:'"is" sonrasında suyun durumunu anlatıyor: sıfat.',clues:{so:'sonuç',walk:'kanıt',hours:'kanıt',find:'kanıt'},ct:'sebep',o:['bol','kirli','kıt, az bulunan','ücretsiz'],a:2,how:'"so" sonuç bildirir: insanlar suyu bulmak için saatlerce yürüyorsa su az bulunuyordur.'},
 {s:'Some {X}, such as hurricanes, floods and earthquakes, can destroy a city in a few hours.',x:'glimmocks',real:'catastrophes',pos:0,posWhy:'"Some" sonrasında ve "-s" çoğul ekiyle gelmiş: isim.',clues:{such:'örnek',hurricanes:'örnek',floods:'örnek',earthquakes:'örnek',destroy:'sonuç'},ct:'ornek',o:['felaketler','binalar','bilim insanları','tatil yerleri'],a:0,how:'"such as" örnek sinyali: kasırga, sel ve deprem hepsi doğal felaket. Örneklerin ortak noktası anlamı veriyor.'},
 {s:'The museum decided to {X} the old painting, which means to repair it carefully and make it look new again.',x:'franell',real:'restore',pos:1,posWhy:'"to" sonrası yalın hâlde gelen kelime: fiil.',clues:{means:'tanım',repair:'tanım',new:'tanım',again:'tanım'},ct:'tanim',o:['satmak','onarmak, eski hâline getirmek','kopyalamak','sergilemek'],a:1,how:'"which means" doğrudan tanım verir: dikkatle onarıp yeniymiş gibi göstermek.'},
 {s:'The new law was {X} by most citizens; as a result, the government had to cancel it within a month.',x:'drovished',real:'opposed',pos:1,posWhy:'"was ... by" yapısı edilgen bir fiildir (V3).',clues:{result:'sonuç',cancel:'sonuç',had:'sonuç'},ct:'sebep',o:['desteklendi','karşı çıkıldı','unutuldu','tercüme edildi'],a:1,how:'"as a result" sonuç bildirir: hükümet yasayı iptal etmek zorunda kaldıysa halk ona karşı çıkmıştır.'}
];
let D={i:0,st:'pos',posA:null,got:[],miss:0,ans:null,hist:[],hint:false};
function dReset(){Object.assign(D,{st:'pos',posA:null,got:[],miss:0,ans:null,hint:false})}
function drawDet(){
  if(D.i>=CASES.length)return drawRank();

Her kelime için TEK bir İngilizce cümle yaz; kelimenin yerine {X} koy. Cümlede anlamı ele veren en az 3 ipucu kelimesi olsun (zıtlık: unlike/but/while; örnek: such as; tanım; sebep-sonuç: so/because).
Sadece JSON döndür: {"cases":[{"real":"cümlede kullanılan hâli","s":"... {X} ...","pos":0-3 (0 isim,1 fiil,2 sıfat,3 zarf),"posWhy":"Türkçe, türü neden bu (cümledeki işaretlerden)","clues":{"cümledeki tek kelime":"Türkçe kısa etiket"},"ct":"tanim|zitlik|ornek|sebep","o":["4 Türkçe anlam seçeneği"],"a":doğru seçeneğin sırası 0-3,"how":"Türkçe 1-2 cümle: ipuçları anlamı nasıl veriyor"}]}
Kurallar: clues anahtarları cümlede AYNEN geçen tek kelimeler olmalı (noktalama yok). Yanlış seçenekler aynı türde ve makul olsun. Doğru cevabın yeri karışık olsun. B1-B2 akademik ton.`;
  const inp=ws.map(w=>w.en+(w.tr?' = '+w.tr:'')).join('\n');
  return KA.src.ask(sys,inp,j=>{
    const out=[];(j.cases||j||[]).forEach((c,i)=>{try{
      const sx=SV2.str(c.s,'cümle');if((sx.match(/\{X\}/g)||[]).length!==1)return;
      const tk=new Set(toks(sx));const cl={};Object.entries(c.clues||{}).forEach(([k,v])=>{const w=clean(k).split(' ')[0];if(tk.has(w)&&v)cl[w]=String(v)});
      if(Object.keys(cl).length<2)return;const o=SV2.arr(c.o,4,'seçenek').slice(0,4).map(String);const a=SV2.idx(c.a,4,'cevap');
      const real=SV2.str(c.real,'kelime');out.push({s:sx,real,x:nons(real,i),pos:SV2.idx(c.pos,4,'tür'),posWhy:String(c.posWhy||''),clues:cl,ct:CT[c.ct]?c.ct:'tanim',o,a,how:String(c.how||'')});
    }catch(e){}});
    if(out.length<Math.min(4,ws.length))throw new Error('yeterli geçerli soru yok ('+out.length+')');return out;
  });
}
async function genRead(ws){
  const sys=`Sen BUEPT (Boğaziçi) reading sınavı için içerik yazan bir İngilizce öğretmenisin. Öğrencinin kelimelerinin EN AZ 5 tanesini kullanarak 7-8 cümlelik akademik bir okuma parçası (B2) yaz, sonra iki tür soru hazırla.
Sadece JSON döndür:
{"title":"İngilizce başlık","ps":["cümle 1","cümle 2",...],
 "pq":[{"t":"parafraz ifade; parçadan farklı kelimeleri <mark>...</mark> ile işaretle","a":"T|F|N","ev":kanıt cümlesinin sırası (0'dan),"hl":["kanıt cümlesinde AYNEN geçen ifadeler"],"pairs":[["parçadaki ifade","sorudaki karşılığı"]],"trap":tuzak çiftin sırası ya da null,"why":"Türkçe açıklama"}],
 "zq":[{"p":[cümle sırası,"zamir ya da 'these + isim'"],"r":[cümle sırası,"gösterdiği kelime ya da ifade"],"kind":"kişi zamiri|iyelik|işaret zamiri|ilgi zamiri|işaret + isim","why":"Türkçe açıklama"}]}
Kurallar: pq tam 5 ifade (en az 2 T, 1-2 F, 1 N; N için hl ve pairs boş). zq 5 iz: p ve r ifadeleri ilgili cümlede AYNEN ve noktalama olmadan geçmeli; r, p ile aynı ya da daha önceki bir cümlede olmalı. Parçaya bilerek it, they, their, this, which, these + isim gibi göndermeler koy. "only/always/all" gibi kesinlik tuzakları kullan.`;
  const inp='Kelimeler:\n'+ws.map(w=>w.en+(w.tr?' = '+w.tr:'')).join('\n');
  return KA.src.ask(sys,inp,j=>{
    const ps=SV2.arr(j.ps,5,'parça').map(x=>String(x).trim()).filter(Boolean);
    const lo=ps.map(x=>x.toLowerCase());
    const pq=[];(j.pq||[]).forEach(q=>{try{const a=['T','F','N'].includes(q.a)?q.a:null;if(!a)return;let ev=a==='N'?0:SV2.idx(q.ev,ps.length,'kanıt');
      const hl=(q.hl||[]).map(String).filter(h=>h&&lo[ev].includes(h.toLowerCase()));
      const pairs=(q.pairs||[]).filter(x=>Array.isArray(x)&&x.length>=2).map(x=>[String(x[0]),String(x[1])]);
      pq.push({t:markOnly(SV2.str(q.t,'ifade')),a,ev,hl:a==='N'?[]:hl,pairs:a==='N'?[]:pairs,trap:Number.isInteger(q.trap)&&q.trap<pairs.length?q.trap:undefined,why:String(q.why||'')})}catch(e){}});
    if(pq.length<4)throw new Error('paraphrase soruları eksik');
    const save={PS,TOK};PS=ps;mkTok();
    const zq=[];(j.zq||[]).forEach(z=>{try{const p=[SV2.idx(z.p[0],ps.length),clean(z.p[1])],r=[SV2.idx(z.r[0],ps.length),clean(z.r[1])];if(r[0]>p[0])return;const a=findT(p[0],p[1]),b=findT(r[0],r[1]);if(!a.length||!b.length||a.some(x=>b.includes(x)))return;zq.push({p,r,kind:String(z.kind||'gönderme'),why:String(z.why||'')})}catch(e){}});
    PS=save.PS;TOK=save.TOK;
    if(zq.length<3)throw new Error('iz soruları eksik ('+zq.length+')');
    return {title:String(j.title||'Reading'),ps,pq,zq};
  });
}
async function genFam(ws){
  const sys=`Sen BUEPT (Boğaziçi) hazırlığı için İngilizce öğretmenisin. Öğrencinin kelimelerinden, farklı türlerde (fiil/isim/sıfat/zarf) en az 3 biçimi olan 3 kelime ailesi seç ve "Kelime Ailesi" soruları yaz.
Sadece JSON döndür: {"fam":[{"root":"kök kelime","f":[["fiil|isim|sıfat|zarf","gövde","ek"]],"q":[{"s":"İngilizce cümle, boşluk yerine {_}","sig":"cümlede AYNEN geçen ve türü ele veren tek kelime","a":f içindeki doğru biçimin sırası,"why":"Türkçe kısa açıklama"}]}]}
Kurallar: gövde+ek birleşince tam biçimi verir (ör. ["isim","analy","sis"]). f 3-4 biçim, her türden en fazla bir tane. Her biçim için bir cümle (q sayısı = f sayısı), cevaplar karışık sırada.`;
  const inp=ws.map(w=>w.en).join(', ');
  return KA.src.ask(sys,inp,j=>{
    const out=[];(j.fam||[]).forEach(fm=>{try{const f=SV2.arr(fm.f,2).filter(x=>Array.isArray(x)&&POS.includes(x[0])&&x[1]).map(x=>[x[0],String(x[1]),String(x[2]||'')]);
      if(f.length<2||new Set(f.map(x=>x[0])).size!==f.length)return;
      const q=(fm.q||[]).filter(x=>x&&typeof x.s==='string'&&x.s.includes('{_}')).map(x=>({s:x.s,sig:clean(x.sig).split(' ')[0],a:SV2.idx(x.a,f.length),why:String(x.why||'')}));
      if(q.length<2)return;out.push({root:String(fm.root||fword(f[0])),f,q})}catch(e){}});
    if(!out.length)throw new Error('kelime ailesi kurulamadı');return out;
  });
}
function useDet(d){CASES=d;D={i:0,st:'pos',posA:null,got:[],miss:0,ans:null,hist:[],hint:false};aRestore('det');if(TAB==='det')drawDet()}
function useRead(d){TITLE=d.title;PS=d.ps;PQ=d.pq;ZQ=d.zq;mkTok();P={i:0,st:'tfn',pick:null,evOk:false,wrongS:-1,score:0,res:[]};Z={i:0,st:'tap',wrong:-1,miss:0,ok:0};aRestore('par');aRestore('iz');if(TAB==='par')drawPar();if(TAB==='iz')drawIz()}
function useFam(d){FAM=d;F={fi:0,qi:0,ans:null,got:[],ok:0};aRestore('fam');if(TAB==='fam')drawFam()}
const SRC={
  det:{game:'atolye_det',need:6,min:4,title:'bağlam dosyaları',gen:genDet,onData:useDet,onDemo:()=>{if(CASES!==DEMO.CASES)useDet(DEMO.CASES)}},
  par:{game:'atolye_read',need:8,min:5,title:'bir okuma parçası ve sorular',hint:'Paraphrase Avı ile İz Sürücü aynı parçayı kullanır.',gen:genRead,onData:useRead,onDemo:()=>{if(PS!==DEMO.PS)useRead({title:DEMO.TITLE,ps:DEMO.PS,pq:DEMO.PQ,zq:DEMO.ZQ})}},
  fam:{game:'atolye_fam',need:10,min:5,title:'kelime aileleri',hint:'Türü değişebilen kelimeler seçilir.',gen:genFam,onData:useFam,onDemo:()=>{if(FAM!==DEMO.FAM)useFam(DEMO.FAM)}}
};
SRC.iz=SRC.par;
let barTab='';
function srcBar(){if(barTab===TAB)return;barTab=TAB;const old=$('#wsrc'),n=old.cloneNode(false);old.replaceWith(n);KA.src.bar(n,SRC[TAB])}

/* ============ KALDIĞIN YERDEN ============ */
const AK='ka_atolye_st';
const hid=d=>{const t=JSON.stringify(d);let h=0;for(let i=0;i<t.length;i+=7)h=(h*31+t.charCodeAt(i))|0;return t.length+':'+h};
const cid={det:()=>hid(CASES),par:()=>hid(PQ),iz:()=>hid(ZQ),fam:()=>hid(FAM)};
const stOf={det:()=>D,par:()=>P,iz:()=>Z,fam:()=>F};
function aLoad(){try{return JSON.parse(localStorage.getItem(AK))||{}}catch(e){return {}}}
function aSave(){const o=aLoad();['det','par','iz','fam'].forEach(k=>{const st=stOf[k]();const fresh=k==='det'?(st.i===0&&st.st==='pos'&&!st.hist.length):k==='par'?(st.i===0&&st.st==='tfn'&&!st.res.length):k==='iz'?(st.i===0&&st.st==='tap'&&!st.ok&&!st.miss):(st.fi===0&&st.qi===0&&st.ans==null&&!st.ok);
  if(fresh)delete o[k];else o[k]={id:cid[k](),st:JSON.parse(JSON.stringify(st)),t:Date.now()}});try{localStorage.setItem(AK,JSON.stringify(o))}catch(e){}}
function aRestore(k){const o=aLoad()[k];if(!o||o.id!==cid[k]())return;const st=o.st;
  if(k==='det')D=Object.assign(D,st);else if(k==='par')P=Object.assign(P,st);else if(k==='iz')Z=Object.assign(Z,st);else F=Object.assign(F,st)}
/* ============ OLAYLAR ============ */
function draw(){drawTabs();srcBar();({det:drawDet,par:drawPar,iz:drawIz,fam:drawFam})[TAB]()}
function conf(el){if(!el||!KA.confetti)return;const r=el.getBoundingClientRect();KA.confetti(r.left+r.width/2,r.top+r.height/2,22,Math.PI)}
document.addEventListener('click',()=>setTimeout(aSave,0));
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);
  let b;
  if(b=q('[data-tab]')){TAB=b.dataset.tab;KA.store.set('ka_feat2',TAB);draw();window.scrollTo({top:document.querySelector('#pane').offsetTop-80,behavior:'smooth'});return}
  /* dedektif */
  if(b=q('[data-pos]')){const c=CASES[D.i],i=+b.dataset.pos;D.posA=i;if(i===c.pos){KA.sfx.ok();D.st='clue'}else{D.miss++;KA.sfx.bad()}drawDet();return}
  if(b=q('.clue-on [data-cw]')){const c=CASES[D.i],w=b.dataset.cw;if(D.got.includes(w))return;if(c.clues[w]){D.got.push(w);KA.sfx.ok();if(D.got.length>=2)D.st='guess';drawDet()}else{D.miss++;KA.sfx.bad();b.classList.remove('no');void b.offsetWidth;b.classList.add('no')}return}
  if(q('#hint')){const c=CASES[D.i];const w=Object.keys(c.clues).find(k=>!D.got.includes(k));if(w){D.hint=true;D.got.push(w);if(D.got.length>=2)D.st='guess';drawDet()}return}
  if(b=q('[data-do]')){const c=CASES[D.i];D.ans=+b.dataset.do;D.st='done';const ok=D.ans===c.a;D.hist.push(ok?Math.max(1,3-D.miss-(D.hint?1:0)):0);if(ok)KA.addXp(5,'atolye');ok?KA.sfx.ok():KA.sfx.bad();drawDet();if(ok)conf(document.querySelector('.stamp'));return}
  if(b=q('#save')){const r=KA.addUnknown(b.dataset.w,b.dataset.t);KA.toast(r==='var'?`"${b.dataset.w}" zaten listende.`:`"${b.dataset.w}" Bilmediklerim listesine eklendi.`);b.disabled=true;return}
  if(q('#dn')){D.i++;dReset();drawDet();return}
  if(q('#drs')){D.i=0;D.hist=[];dReset();drawDet();return}
  /* paraphrase */
  if(b=q('[data-tf]')){const qq=PQ[P.i];P.pick=b.dataset.tf;P.wrongS=-1;if(qq.a==='N'||P.pick==='N'){P.st='done';P.evOk=false;finishP()}else{P.st='ev'}drawPar();return}
  if(b=q('.tapsent [data-sn]')){const qq=PQ[P.i],si=+b.dataset.sn;if(si===qq.ev){P.evOk=P.wrongS<0;P.st='done';finishP();drawPar()}else{P.wrongS=si;KA.sfx.bad();drawPar()}return}
  if(q('#pn')){P.i++;P.st='tfn';P.pick=null;P.wrongS=-1;P.evOk=false;drawPar();return}
  if(q('#prs')){P={i:0,st:'tfn',pick:null,evOk:false,wrongS:-1,score:0,res:[]};drawPar();return}
  /* iz */
  if(b=q('[data-tk]')){if(Z.st==='done'||!ZQ[Z.i])return;const qq=ZQ[Z.i],i=+b.dataset.tk;if(findT(qq.p[0],qq.p[1]).includes(i))return;if(findT(qq.r[0],qq.r[1]).includes(i)){if(Z.wrong<0){Z.ok++;KA.addXp(3,'atolye')}Z.st='done';KA.sfx.ok();drawIz()}else{Z.miss++;Z.wrong=i;KA.sfx.bad();drawIz()}return}
  if(q('#zn')){Z.i++;Z.st='tap';Z.wrong=-1;drawIz();return}
  if(q('#zrs')){Z={i:0,st:'tap',wrong:-1,miss:0,ok:0};drawIz();return}
  /* aile */
  if(b=q('[data-fa]')){const qq=FAM[F.fi].q[F.qi];F.ans=+b.dataset.fa;if(F.ans===qq.a){F.ok++;KA.addXp(2,'atolye');if(!F.got.includes(qq.a))F.got.push(qq.a);KA.sfx.ok();KA.speak&&KA.speak(fword(FAM[F.fi].f[qq.a]))}else KA.sfx.bad();drawFam();if(F.got.length===FAM[F.fi].f.length&&F.ans===qq.a)conf(document.querySelector('.root span'));return}
  if(q('#fn')){F.ans=null;if(F.qi<FAM[F.fi].q.length-1)F.qi++;else{F.fi++;F.qi=0;F.got=[]}drawFam();return}
  if(q('#frs')){F={fi:0,qi:0,ans:null,got:[],ok:0};drawFam();return}
});
function finishP(){const qq=PQ[P.i],ok=P.pick===qq.a;let s=(ok?1:0)+(qq.a==='N'?(ok?1:0):(P.evOk?1:0));P.score+=s;if(s)KA.addXp(s*2,'atolye');P.res.push(s+'/2');ok?KA.sfx.ok():KA.sfx.bad()}
addEventListener('resize',()=>{if(TAB==='iz'&&Z.st==='done')drawIz()});
KA.nav('oyunlar.html');
['det','par','iz','fam'].forEach(aRestore);
draw();
})();
</script>
