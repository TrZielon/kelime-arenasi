<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUEPT Okuma Kampı · Kelime Arenası</title>
<meta name="description" content="BUEPT reading'in en sık soru tipleri için üç alıştırma: cümle yerleştirme, vaka dosyası ve ana fikir avı.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K. Arenası">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light';if(sessionStorage.getItem('ka_gate'))document.documentElement.classList.add('ka-gin')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css?v=19">
<style>
.kh{padding:26px;margin-bottom:16px}
.kh h1{font-size:clamp(28px,4vw,40px);margin:6px 0 8px}
.kh p{color:var(--ink2);margin:0}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);font:inherit;color:inherit}
.mcard:hover{border-color:var(--p);transform:translateY(-1px)}
.mcard .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--g,var(--p));color:#fff}
.mcard .mi svg{width:24px;height:24px}
.mcard b{font-family:Fraunces,serif;font-size:21px}
.mcard p{margin:0;color:var(--ink2);font-size:14px;line-height:1.45}
.mcard small{color:var(--mut);font-weight:700}
.gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gtop .t{font-weight:800;font-size:18px;flex:1}
.hud{display:flex;gap:6px}
.stage{padding:22px}
.qlab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.psg{font-family:Fraunces,serif;font-size:18px;line-height:1.8}
.gap{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;margin:0 3px;border-radius:8px;border:2px dashed var(--p);color:var(--p);font:800 13px "Plus Jakarta Sans";cursor:pointer;vertical-align:1px;background:var(--card)}
.gap:hover{background:var(--p-soft)}
.gap.ok{background:var(--ok);border-color:var(--ok);color:#fff}.gap.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ins{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--acc-soft);font-family:Fraunces,serif;font-size:17.5px;line-height:1.6}
.ins small{display:block;font:800 11px "Plus Jakarta Sans";letter-spacing:.1em;color:var(--acc2);margin-bottom:4px}
.placed{background:color-mix(in srgb,var(--ok) 22%,transparent);border-radius:4px;padding:0 2px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:600 15px/1.45 "Plus Jakarta Sans";color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--p)}.opt kbd{font:800 12px "Plus Jakarta Sans";min-width:22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;line-height:1.55;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b.h{display:block;font-size:16px;margin-bottom:4px}
.fb .ev{display:block;margin-top:8px;font-family:Fraunces,serif;font-style:italic;color:var(--ink2)}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 14px}
.concepts div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13.5px;line-height:1.4;color:var(--ink2)}
.concepts b{display:block;color:var(--ink);font-size:14px}
.case{padding:14px 16px;border-radius:14px;border-left:4px solid var(--acc2);background:var(--card2);font-family:Fraunces,serif;font-size:18px;line-height:1.65}
.endc{text-align:center;padding:30px}
.endc .big{font:800 46px "Plus Jakarta Sans";color:var(--p)}
.miss{text-align:left;margin-top:16px;display:grid;gap:8px}
.miss div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px}
@media (max-width:820px){.modes{grid-template-columns:1fr}.psg{font-size:17px}.case{font-size:17px}.stage{padding:16px}}
</style>
</head>
<body>
<main class="ka-wrap" id="main"></main>
<script src="firebase-config.js?v=19"></script><script src="ortak.js?v=19"></script>
<script>
(()=>{
const {$,esc,shuf}=KA,ic=KA.ic;
let DB=null,VK=null,G=null;
const ROUND=8;
const BK='ka_kamp';const best=()=>{try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return {}}};
const MODES={
 yer:{n:'Cümle Yerleştir',d:'Gerçek BUEPT metinlerinden bir cümle çıkarıldı. Bağlaçlara ve zamirlere bakarak doğru boşluğu bul.',g:'#0f766e',i:'pen',k:'Her sınavda en az bir tane çıkıyor'},
 vaka:{n:'Vaka Dosyası',d:'Metindeki kavramı yeni bir duruma uygula: bu olay hangi türe, hangi kurama örnek?',g:'#b45309',i:'flag',k:'Moral Luck, Learned Helplessness, USM tipi sorular'},
 ana:{n:'Ana Fikir Avı',d:'Paragrafı oku, ana fikri seç. Tuzak: bir detay ya da başka paragrafın fikri.',g:'#6d28d9',i:'search',k:'"What is the writer\'s main point?" soruları'}
};
async function load(){
  if(!DB){DB=await (await fetch('okuma-db.json?v=1')).json()}
  if(!VK){VK=await (await fetch('kamp-vaka.json?v=1')).json()}
}
function hub(){
  G=null;if(location.hash)history.replaceState(null,'',location.pathname);const b=best();
  $('#main').innerHTML=`<section class="card kh"><span class="eyebrow">Oyun Salonu · BUEPT Okuma Kampı</span><h1>Sınavın en sık soru tiplerini çalış</h1><p>20 Boğaziçi deneme sınavında en çok tekrar eden üç soru tipi için hazırlandı. Metinler ve kavramlar bu sınavlardan geliyor; her yanlışın açıklaması metindeki kanıtla birlikte gelir.</p></section>
  <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="card mcard" data-go="${k}" style="--g:${m.g}"><span class="mi">${ic(m.i)}</span><b>${m.n}</b><p>${m.d}</p><small>${m.k}${b[k]!=null?` · En iyi: ${b[k]}/${ROUND}`:''}</small></button>`).join('')}</div>
  <p class="mut" style="margin-top:16px;font-size:13.5px"><a href="oyunlar.html">← Oyun Salonu</a> · <a href="deneme.html">Tam deneme sınavı oluştur →</a></p>`;
}

/* ---------- 1. Cümle yerleştir: metin bankasından otomatik ---------- */
const sentsOf=p=>(p.match(/[^.!?]+(?:[.!?]+["”’)]*|$)\s*/g)||[p]).map(s=>s.trim()).filter(Boolean);
const CUES=[
 [/^(For example|For instance|To illustrate|e\.g\.)/i,'Örnek veriyor: hemen öncesinde örneklenecek genel bir iddia olmalı.'],
 [/^(However|Yet|Nevertheless|Nonetheless|In contrast|By contrast|On the other hand|Still|Instead|Conversely)/i,'Zıtlık bağlacı: önceki cümle bunun tersini ya da beklenen durumu söylemeli.'],
 [/^(Moreover|Furthermore|In addition|Additionally|Also|Besides|What is more)/i,'Ekleme bağlacı: önceki cümle aynı yönde bir fikir vermeli.'],
 [/^(Therefore|Thus|As a result|Consequently|Hence|Accordingly|So,)/i,'Sonuç bağlacı: önceki cümle bu sonucun nedenini içermeli.'],
 [/^(In other words|That is|Put simply|In short|In sum)/i,'Açıklama/özet: önceki cümleyi başka sözlerle tekrar ediyor.'],
 [/^(Similarly|Likewise|In the same way|By the same token)/i,'Benzerlik: önceki cümlede benzer bir örnek ya da durum olmalı.'],
 [/^(Finally|First|Second|Third|Then|Later|Afterwards|In the following)/i,'Sıralama: önceki cümle sıradaki adımı ya da olayı vermeli.'],
 [/^(This|These|Such|That|Those|It|They|He|She|His|Her|Their|Its)\b/,'Gönderme: cümle bir zamirle başlıyor; zamirin gösterdiği şey önceki cümlede geçmeli.'],
 [/^(Although|While|Whereas|Despite|Even though)/i,'Karşıtlık içeren cümle: önceki cümleyle kurduğu ilişkiye bak.']
];
function cueOf(s){for(const [re,t] of CUES)if(re.test(s))return t;return ''}
function buildYer(){
  const pool=[];
  DB.texts.forEach(t=>t.paras.forEach((p,pi)=>{if(!/^[A-Z“"]/.test(p)||/\([A-E]\)/.test(p))return;const ss=sentsOf(p);if(ss.length<5||ss.some(s=>s.split(' ').length>60))return;
    ss.forEach((s,k)=>{if(k<1||k>ss.length-1)return;const c=cueOf(s);if(!c)return;const w=s.split(' ').length;if(w<7||w>45)return;pool.push({t:t.id,title:t.title,pi,k,ss,s,c})})}));
  return shuf(pool).slice(0,ROUND).map(x=>{const rest=x.ss.filter((v,i)=>i!==x.k),gaps=[...Array(rest.length+1).keys()].slice(1);let pick=shuf(gaps.filter(g=>g!==x.k)).slice(0,3).concat([x.k]).sort((a,b)=>a-b);return Object.assign(x,{rest,pick,a:pick.indexOf(x.k)})});
}
function drawYer(){
  const x=G.q[G.i],L='ABCD';let h='';
  x.rest.forEach((s,i)=>{if(x.pick.includes(i))h+=gapB(L[x.pick.indexOf(i)],x.pick.indexOf(i));h+=esc(s)+' '});
  if(x.pick.includes(x.rest.length))h+=gapB(L[x.pick.indexOf(x.rest.length)],x.pick.indexOf(x.rest.length));
  stage(`<div class="qlab"><span lang="en">${esc(x.title)}</span> · Paragraf ${x.pi+1} · Eksik cümle nereye?</div><div class="ins"><small>EKSİK CÜMLE</small>${esc(x.s)}</div><div class="psg" id="psg">${h}</div><p class="mut" style="font-size:13px;margin:10px 0 0">Harflerden birine dokun.</p><div id="fb"></div>`);
}
const gapB=(l,i)=>`<button class="gap" data-gap="${i}">${l}</button>`;
function ansYer(i){
  const x=G.q[G.i];if(G.lock)return;G.lock=1;const ok=i===x.a;score(ok);
  document.querySelectorAll('.gap').forEach(b=>{const k=+b.dataset.gap;b.disabled=true;if(k===x.a)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  const right=document.querySelector(`.gap[data-gap="${x.a}"]`);if(right)right.insertAdjacentHTML('afterend',` <span class="placed">${esc(x.s)}</span>`);
  const prev=x.rest[x.k-1]||'';
  fb(ok,ok?'Doğru yer!':'Doğru yer: '+'ABCD'[x.a],`${esc(x.c)}${prev?`<span class="ev">Önceki cümle: “${esc(prev)}”</span>`:''}`,ok?'':`${x.title} · ¶${x.pi+1}: ${x.s}`);
}

/* ---------- 2. Vaka dosyası ---------- */
function buildVaka(){
  const all=[];VK.sets.forEach(st=>st.q.forEach(q=>all.push({set:st,q})));
  return shuf(all).slice(0,ROUND);
}
function drawVaka(){
  const {set,q}=G.q[G.i];
  stage(`<div class="qlab"><span lang="en">${esc(set.src)}</span> · ${esc(set.t)}</div><div class="concepts">${set.c.map(([n,d])=>`<div><b>${esc(n)}</b>${esc(d)}</div>`).join('')}</div><div class="case">${esc(q.s)}</div><p style="font-weight:800;margin:14px 0 0">Bu durum en iyi hangi kavramla açıklanır?</p><div class="opts">${set.c.map(([n],i)=>`<button class="opt" data-o="${i}"><kbd>${'ABCDEF'[i]}</kbd><span>${esc(n)}</span></button>`).join('')}</div><div id="fb"></div>`);
}
function ansVaka(i){
  const {set,q}=G.q[G.i];if(G.lock)return;G.lock=1;const ok=i===q.a;score(ok);
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  fb(ok,ok?'Doğru kavram!':'Doğru cevap: '+set.c[q.a][0],esc(q.why),ok?'':`${set.c[q.a][0]}: ${q.s}`);
}

/* ---------- 3. Ana fikir avı ---------- */
const cap=s=>{s=String(s).trim();return s.charAt(0).toLocaleUpperCase('tr')+s.slice(1)+(/[.!?]$/.test(s)?'':'.')};
function buildAna(){
  return shuf(DB.kursu).slice(0,ROUND).map(k=>{
    const t=DB.texts.find(x=>x.id===k.t),para=t.paras[k.i];
    const same=shuf(DB.kursu.filter(o=>o!==k&&o.t===k.t)),other=shuf(DB.kursu.filter(o=>o.t!==k.t));
    const det=cap(shuf(k.nok)[0]);
    const opts=[{v:k.ana,w:'ok'},{v:det,w:'det'},{v:(same[0]||other[1]).ana,w:'para'},{v:(other[0]).ana,w:'other'}];
    return {k,title:t.title,para,opts:shuf(opts)};
  });
}
function drawAna(){
  const x=G.q[G.i];
  stage(`<div class="qlab"><span lang="en">${esc(x.title)}</span> · Paragraf ${x.k.i+1}</div><div class="psg">${KA.tokens(x.para)}</div><p style="font-weight:800;margin:14px 0 0">Bu paragrafın ana fikri hangisi?</p><div class="opts">${x.opts.map((o,i)=>`<button class="opt" data-o="${i}"><kbd>${'ABCD'[i]}</kbd><span>${esc(o.v)}</span></button>`).join('')}</div><div id="fb"></div>`);
}
const WHY={det:'Bu paragrafta geçen bir detay; doğru ama paragrafın tamamını kapsamıyor. Ana fikir bütün destekleyici cümleleri toparlamalı.',para:'Bu, aynı metnin başka bir paragrafının fikri. Soru sorulan paragrafın sınırları içinde kal.',other:'Bu başka bir metnin konusundan; paragrafla ilgisi yok.'};
function ansAna(i){
  const x=G.q[G.i];if(G.lock)return;G.lock=1;const o=x.opts[i],ok=o.w==='ok';score(ok);
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(x.opts[k].w==='ok')b.classList.add('ok');else if(k===i)b.classList.add('no')});
  fb(ok,ok?'Ana fikri yakaladın!':'Bu ana fikir değil',`${ok?'':esc(WHY[o.w])+'<br>'}<b>Önemli noktalar:</b> ${x.k.nok.map(esc).join(' · ')}`,ok?'':`${x.title} ¶${x.k.i+1}: ${x.k.ana}`);
}

/* ---------- Ortak oyun akışı ---------- */
async function play(m){
  location.hash=m;$('#main').innerHTML='<div class="card stage"><span class="ka-spin"></span> Hazırlanıyor…</div>';
  try{await load()}catch(e){$('#main').innerHTML=`<div class="card stage"><p class="bad">İçerik yüklenemedi: ${esc(e.message)}</p></div>`;return}
  G={m,i:0,ok:0,streak:0,miss:[],q:m==='yer'?buildYer():m==='vaka'?buildVaka():buildAna()};next();
}
function stage(h){const M=MODES[G.m];$('#main').innerHTML=`<div class="gtop"><button class="btn btn-ghost btn-sm" data-a="hub">${ic('back')}Kamp</button><span class="t">${M.n}</span><span class="hud"><span class="tag">${G.i+1}/${G.q.length}</span><span class="tag" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}${G.ok}</span>${G.streak>=2?`<span class="tag" style="background:var(--acc-soft);color:var(--acc2)">${ic('flame')}${G.streak}</span>`:''}</span></div><div class="card stage">${h}</div>`;scrollTo({top:0})}
function score(ok){if(ok){G.ok++;G.streak++;KA.sfx.ok();try{KA.addXp(2)}catch(e){}}else{G.streak=0;KA.sfx.bad()}}
function fb(ok,h,body,miss){if(!ok&&miss)G.miss.push(miss);const f=$('#fb');f.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b class="h">${h}</b>${body}</div><div class="row" style="margin-top:12px"><button class="btn btn-p" data-a="next" id="nx">${G.i+1<G.q.length?'Devam':'Sonucu gör'}${ic('arrow')}</button></div>`;const n=$('#nx');if(n)n.focus({preventScroll:true});f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){
  if(G.i>=G.q.length)return end();G.lock=0;
  ({yer:drawYer,vaka:drawVaka,ana:drawAna})[G.m]();
}
function end(){
  const b=best();if(b[G.m]==null||G.ok>b[G.m]){b[G.m]=G.ok;try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}
  if(G.ok>=G.q.length-1)KA.sfx.win();
  $('#main').innerHTML=`<div class="card endc"><span class="eyebrow">${MODES[G.m].n}</span><div class="big">${G.ok}/${G.q.length}</div><p class="mut">${G.ok===G.q.length?'Kusursuz tur!':G.ok>=G.q.length*.75?'Çok iyi; sınav seviyesindesin.':'Yanlışlarını aşağıda tekrar oku, sonra yeni bir tur dene.'}</p>${G.miss.length?`<div class="miss">${G.miss.map(m=>`<div>${esc(m)}</div>`).join('')}</div>`:''}<div class="row" style="justify-content:center;gap:8px;margin-top:16px"><button class="btn btn-p btn-lg" data-go="${G.m}">${ic('reset')}Yeni tur</button><button class="btn btn-ghost btn-lg" data-a="hub">Kampa dön</button></div></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tk=t.closest('.tk');if(tk){const s=(tk.closest('.psg')||tk.parentElement).textContent;KA.lookup(tk.dataset.w,{anchor:tk,context:(s.match(/[^.!?]+[.!?]*/g)||[]).find(z=>z.includes(tk.dataset.w))||''});return}
  const go=t.closest('[data-go]');if(go){play(go.dataset.go);return}
  const gp=t.closest('[data-gap]');if(gp&&G){ansYer(+gp.dataset.gap);return}
  const o=t.closest('[data-o]');if(o&&G){(G.m==='vaka'?ansVaka:ansAna)(+o.dataset.o);return}
  const a=t.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='hub')hub();if(a.dataset.a==='next'&&G){G.i++;next()}
});
document.addEventListener('keydown',e=>{if(!G||e.metaKey||e.ctrlKey)return;if(e.key==='Enter'&&$('#nx')){e.preventDefault();G.i++;next();return}const k='1234'.indexOf(e.key);if(k>=0&&!G.lock){if(G.m==='yer')ansYer(k);else ansVaka&&(G.m==='vaka'?ansVaka:ansAna)(k)}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(MODES[h]&&(!G||G.m!==h))play(h);else if(!h&&G)hub()});
KA.nav('oyunlar.html');
const h=location.hash.slice(1);if(MODES[h])play(h);else hub();
})();
</script>
</body>
</html>
