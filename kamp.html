<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
.kh{padding:26px;margin-bottom:16px}
.kh h1{font-size:clamp(28px,4vw,40px);margin:6px 0 8px}
.kh p{color:var(--ink2);margin:0}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);font:inherit;color:inherit}
.mcard:hover{border-color:var(--p);transform:translateY(-1px)}
.mcard .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--g,var(--p));color:#fff}
.mcard .mi svg{width:24px;height:24px}
.mcard b{font-family:Fraunces,serif;font-size:21px}
.mcard p{margin:0;color:var(--ink2);font-size:14px;line-height:1.45}
.mcard small{color:var(--mut);font-weight:700}
.gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gtop .t{font-weight:800;font-size:18px;flex:1}
.hud{display:flex;gap:6px}
.stage{padding:22px}
.qlab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.psg{font-family:Fraunces,serif;font-size:18px;line-height:1.8}
.gap{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;margin:0 3px;border-radius:8px;border:2px dashed var(--p);color:var(--p);font:800 13px "Plus Jakarta Sans";cursor:pointer;vertical-align:1px;background:var(--card)}
.gap:hover{background:var(--p-soft)}
.gap.ok{background:var(--ok);border-color:var(--ok);color:#fff}.gap.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ins{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--acc-soft);font-family:Fraunces,serif;font-size:17.5px;line-height:1.6}
.ins small{display:block;font:800 11px "Plus Jakarta Sans";letter-spacing:.1em;color:var(--acc2);margin-bottom:4px}
.placed{background:color-mix(in srgb,var(--ok) 22%,transparent);border-radius:4px;padding:0 2px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:600 15px/1.45 "Plus Jakarta Sans";color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--p)}.opt kbd{font:800 12px "Plus Jakarta Sans";min-width:22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;line-height:1.55;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b.h{display:block;font-size:16px;margin-bottom:4px}
.fb .ev{display:block;margin-top:8px;font-family:Fraunces,serif;font-style:italic;color:var(--ink2)}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 14px}
.concepts div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13.5px;line-height:1.4;color:var(--ink2)}
.concepts b{display:block;color:var(--ink);font-size:14px}
.case{padding:14px 16px;border-radius:14px;border-left:4px solid var(--acc2);background:var(--card2);font-family:Fraunces,serif;font-size:18px;line-height:1.65}
.endc{text-align:center;padding:30px}
.endc .big{font:800 46px "Plus Jakarta Sans";color:var(--p)}
.miss{text-align:left;margin-top:16px;display:grid;gap:8px}
.miss div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px}
@media (max-width:820px){.modes{grid-template-columns:1fr}.psg{font-size:17px}.case{font-size:17px}.stage{padding:16px}}
</style>

<body>
<main class="ka-wrap" id="main"></main>
<script src="firebase-config.js?v=19"></script><script src="ortak.js?v=19"></script>
<script>
(()=>{
const {$,esc,shuf}=KA,ic=KA.ic;
let DEMO=null,VK=null,G=null,BAR=null;
const ROUND=8;
const BK='ka_kamp';const best=()=>{try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return {}}};
const MODES={
 yer:{n:'Cümle Yerleştir',d:'BUEPT tarzı özgün bir paragraftan bir cümle çıkarıldı. Bağlaçlara ve zamirlere bakarak doğru boşluğu bul.',g:'#0f766e',i:'pen',k:'Her denemede en az bir tane çıkan soru tipi'},
 vaka:{n:'Vaka Dosyası',d:'Kavramı yeni bir duruma uygula: bu olay hangi türe, hangi kurama örnek?',g:'#b45309',i:'flag',k:'Kavram uygulama soruları'},
 ana:{n:'Ana Fikir Avı',d:'Paragrafı oku, ana fikri seç. Tuzaklar: dar bir detay, çarpıtılmış bir genelleme, konu dışı bir fikir.',g:'#6d28d9',i:'search',k:'"What is the writer\'s main point?" soruları'}
};
/* 20 Boğaziçi deneme sınavından çıkarılan mantık: içerik kopyalanmaz, yalnızca yapı uygulanır */
const STYLE=`BUEPT ÜSLUP PROFİLİ (20 gerçek Boğaziçi deneme sınavının analizinden; o metinleri KOPYALAMA, yalnızca mantığını uygula):
- Konu havuzu: psikoloji deneyleri ve kuramları, sosyoloji ve toplumsal hareketler, medya ve ikna, etik/felsefe/hukuk, teknoloji ve yapay zekâ, tarih ve ekonomi, sağlık ve beslenme tarihi, eğitim ve okuma, sinema ve kültür, bilim ve sözde bilim.
- Paragraf mantığı: konu cümlesi → kavram tanımı ("X refers to") → çalışma ya da düşünür (emin değilsen "one study", "researchers") → somut örnek → karşı görüş ya da sınırlama → değerlendirme.
- Cümle mantığı: although/while/despite, however/nevertheless, as a result/therefore, for example, in other words, this/such + isim gönderimleri, hedging (may, tend to, is likely to), far less X than Y, It was only after ... that.
- Dil: C1 akademik ama anlaşılır; uydurma istatistik ve gerçek kişiler hakkında yanlış bilgi yok.`;
const YER_SYS=`Sen BUEPT okuma sınavı için soru yazan deneyimli bir sınav yazarısın. Öğrencinin kelimeleriyle 6 ÖZGÜN akademik paragraf yaz ve her birinden cümle yerleştirme sorusu hazırla.
${STYLE}
Kurallar: her paragraf farklı bir konudan, 5-7 cümle, 90-140 kelime; öğrencinin kelimelerinden her paragrafta 1-3 tanesini doğal biçimde kullan, hepsini en az bir kez kullan. Her paragrafta ilk cümle OLMAYAN bir "çıkarılacak cümle" seç: yeri tek ve net olsun; ya kendisi bağlaç/zamirle önceki cümleye bağlansın (However, For example, As a result, In other words, This/Such + isim) ya da sonraki cümle ona gönderme yapsın. Başka bir yere de uyabilecek cümle seçme.
YALNIZCA JSON: {"items":[{"title":"İngilizce kısa başlık","ss":["cümle 1","cümle 2","..."],"k":çıkarılacak cümlenin sırası (0'dan; en az 1),"why":"Türkçe 1-2 cümle: hangi bağlaç ya da gönderme cümleyi oraya bağlıyor"}]}`;
const ANA_SYS=`Sen BUEPT okuma sınavı için soru yazan deneyimli bir sınav yazarısın. Öğrencinin kelimeleriyle 6 ÖZGÜN akademik paragraf yaz ve her biri için "ana fikir" sorusu hazırla.
${STYLE}
Kurallar: her paragraf farklı bir konudan, 90-130 kelime; öğrencinin kelimelerinden her paragrafta 1-3 tanesini kullan, hepsini en az bir kez kullan. Paragrafın ana fikri son cümlede ya da birkaç cümlenin birleşiminde olsun, ilk cümleyi aynen tekrar etmesin.
Her paragraf için 4 TÜRKÇE seçenek yaz, benzer uzunlukta:
- "ok": paragrafın tamamını kapsayan ana fikir (başka sözlerle)
- "det": paragrafta geçen DOĞRU ama dar bir detay
- "wrong": paragrafın kelimelerini kullanan ama anlamı çarpıtan seçenek (aşırı genelleme, ters ilişki, paragrafın reddettiği görüş)
- "other": konuyla ilgili görünen ama paragrafta olmayan bir fikir
YALNIZCA JSON: {"items":[{"title":"İngilizce kısa başlık","p":"paragraf","o":[{"t":"...","k":"ok"},{"t":"...","k":"det"},{"t":"...","k":"wrong"},{"t":"...","k":"other"}]}]}`;
const VAKA_SYS=`Sen BUEPT okuma sınavı için "kavramı yeni bir duruma uygula" soruları yazan deneyimli bir sınav yazarısın.
${STYLE}
2 kavram seti hazırla. Her set, sosyal bilimlerde gerçekten var olan ve iyi bilinen bir kavram ailesi olsun (ör. uyma türleri, yükleme hataları, güç türleri, ikna yolları, öğrenme türleri). Her sette 3-4 kavram ve her biri için kısa, kendi sözlerinle İngilizce tanım yaz. Sonra her set için 4 ÖZGÜN durum yaz: 3-5 cümlelik İngilizce bir olay; tam olarak bir kavrama uysun ama kavramın adı geçmesin; öğrencinin kelimelerini durumlarda kullan.
YALNIZCA JSON: {"sets":[{"src":"alan, ör. Social Psychology","t":"Türkçe set başlığı","c":[["Kavram adı","İngilizce tanım"]],"q":[{"s":"durum","a":doğru kavramın sırası,"why":"Türkçe 1-2 cümle açıklama"}]}]}`;
const inpOf=ws=>'Öğrencinin kelimeleri:\n'+ws.map(w=>w.en+(w.tr?' = '+w.tr:'')).join('\n');
const V=KA.src.V;
async function genYer(ws){return KA.src.ask(YER_SYS,inpOf(ws),j=>{const out=[];(j.items||[]).forEach(x=>{try{const ss=V.arr(x.ss,5,'cümleler').map(String).map(t=>t.trim()).filter(Boolean);const k=V.idx(x.k,ss.length,'k');if(k<1||ss.length<5)return;out.push({title:String(x.title||'Reading'),ss,k,why:String(x.why||'')})}catch(e){}});if(out.length<4)throw new Error('yeterli paragraf yok ('+out.length+')');return out},{ai:{tier:'long',ms:110000}})}
async function genAna(ws){return KA.src.ask(ANA_SYS,inpOf(ws),j=>{const out=[];(j.items||[]).forEach(x=>{try{const p=V.str(x.p,'paragraf');const o=V.arr(x.o,4,'seçenek').slice(0,4).map(z=>({t:String(z.t||'').trim(),k:['ok','det','wrong','other'].includes(z.k)?z.k:'other'})).filter(z=>z.t);if(o.length<4||o.filter(z=>z.k==='ok').length!==1)return;out.push({title:String(x.title||'Reading'),p,o})}catch(e){}});if(out.length<4)throw new Error('yeterli paragraf yok ('+out.length+')');return out},{ai:{tier:'long',ms:110000}})}
async function genVaka(ws){return KA.src.ask(VAKA_SYS,inpOf(ws),j=>{const sets=[];(j.sets||[]).forEach(st=>{try{const c=V.arr(st.c,3,'kavram').filter(x=>Array.isArray(x)&&x[0]&&x[1]).map(x=>[String(x[0]),String(x[1])]);if(c.length<3)return;const q=(st.q||[]).filter(x=>x&&x.s&&Number.isInteger(Number(x.a))&&Number(x.a)>=0&&Number(x.a)<c.length).map(x=>({s:String(x.s),a:Number(x.a),why:String(x.why||'')}));if(q.length<2)return;sets.push({src:String(st.src||'Social Science'),t:String(st.t||'Kavramlar'),c,q})}catch(e){}});if(!sets.length)throw new Error('kavram seti kurulamadı');return {sets}},{ai:{tier:'long',ms:110000}})}
const SRC={
 yer:{game:'kamp_yer',need:12,min:6,title:'özgün BUEPT tarzı paragraflar',hint:'Her paragrafta kelimelerinden 1-3 tanesi geçer.',gen:genYer,onData:d=>round(d),onDemo:()=>round(DEMO.yer)},
 ana:{game:'kamp_ana',need:12,min:6,title:'özgün BUEPT tarzı paragraflar',hint:'Her paragrafta kelimelerinden 1-3 tanesi geçer.',gen:genAna,onData:d=>round(d),onDemo:()=>round(DEMO.ana)},
 vaka:{game:'kamp_vaka',need:8,min:5,title:'yeni kavram setleri ve vakalar',hint:'Kavramlar gerçek sosyal bilim kavramları; vakalar senin kelimelerinle yazılır.',gen:genVaka,onData:d=>round(d.sets),onDemo:()=>round(VK.sets)}
};
async function load(){
  if(!DEMO)DEMO=await (await fetch('kamp-ornek.json?v=1')).json();
  if(!VK)VK=await (await fetch('kamp-vaka.json?v=1')).json();
}
function hub(){
  G=null;if(location.hash)history.replaceState(null,'',location.pathname);const b=best();
  $('#main').innerHTML=`<section class="card kh"><span class="eyebrow">Oyun Salonu · BUEPT Okuma Kampı</span><h1>Sınavın en sık soru tiplerini çalış</h1><p>20 Boğaziçi deneme sınavını inceledim ve en çok tekrar eden üç soru tipini çıkardım. Paragraflar ve vakalar o sınavların konu seçimine, paragraf yapısına ve cümle mantığına göre, senin kelimelerinle <b>sıfırdan</b> yazılır; her tur yenidir.</p></section>
  <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="card mcard" data-go="${k}" style="--g:${m.g}"><span class="mi">${ic(m.i)}</span><b>${m.n}</b><p>${m.d}</p><small>${m.k}${b[k]!=null?` · En iyi: ${b[k]}`:''}</small></button>`).join('')}</div>
  <p class="mut" style="margin-top:16px;font-size:13.5px"><a href="oyunlar.html">← Oyun Salonu</a> · <a href="deneme.html">Tam deneme sınavı oluştur →</a></p>`;
}

/* ---------- Ortak oyun akışı ---------- */
async function play(m){
  location.hash=m;G={m,i:0,ok:0,streak:0,miss:[],q:[]};
  $('#main').innerHTML=`<div class="gtop"><button class="btn btn-ghost btn-sm" data-a="hub">${ic('back')}Kamp</button><span class="t">${MODES[m].n}</span><span class="hud" id="hud"></span></div><div id="wsrc" style="margin-bottom:12px"></div><div class="card stage" id="stg"><span class="ka-spin"></span> Hazırlanıyor…</div>`;
  try{await load()}catch(e){$('#stg').innerHTML=`<p class="bad">İçerik yüklenemedi: ${esc(e.message)}</p>`;return}
  if(!G||G.m!==m)return;
  BAR=KA.src.bar('#wsrc',SRC[m]);
}
function round(data){
  if(!G)return;const m=G.m;let q;
  if(m==='vaka'){const all=[];(data||[]).forEach(st=>st.q.forEach(x=>all.push({set:st,q:x})));q=shuf(all).slice(0,ROUND)}
  else if(m==='yer')q=shuf(data||[]).slice(0,ROUND).map(x=>{const rest=x.ss.filter((v,i)=>i!==x.k),gaps=[...Array(rest.length+1).keys()].slice(1);const pick=shuf(gaps.filter(g=>g!==x.k)).slice(0,3).concat([x.k]).sort((a,b)=>a-b);return Object.assign({},x,{s:x.ss[x.k],rest,pick,a:pick.indexOf(x.k)})});
  else q=shuf(data||[]).slice(0,ROUND).map(x=>Object.assign({},x,{o:shuf(x.o)}));
  Object.assign(G,{i:0,ok:0,streak:0,miss:[],q});next();
}
function hud(){const h=$('#hud');if(h)h.innerHTML=`<span class="tag">${Math.min(G.i+1,G.q.length)}/${G.q.length}</span><span class="tag" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}${G.ok}</span>${G.streak>=2?`<span class="tag" style="background:var(--acc-soft);color:var(--acc2)">${ic('flame')}${G.streak}</span>`:''}`}
function stage(h){const s=$('#stg');if(!s)return;s.innerHTML=h;hud()}
function score(ok){if(ok){G.ok++;G.streak++;KA.sfx.ok();try{KA.addXp(2)}catch(e){}}else{G.streak=0;KA.sfx.bad()}}
function fb(ok,h,body,miss){if(!ok&&miss)G.miss.push(miss);hud();const f=$('#fb');f.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b class="h">${h}</b>${body}</div><div class="row" style="margin-top:12px"><button class="btn btn-p" data-a="next" id="nx">${G.i+1<G.q.length?'Devam':'Sonucu gör'}${ic('arrow')}</button></div>`;const n=$('#nx');if(n)n.focus({preventScroll:true});f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!G.q.length){stage('<p class="mut">Bu sette soru kalmadı.</p>');return}if(G.i>=G.q.length)return end();G.lock=0;({yer:drawYer,vaka:drawVaka,ana:drawAna})[G.m]();const s=$('#stg');if(s&&G.i>0)s.scrollIntoView({behavior:'smooth',block:'start'})}
function end(){
  const b=best();const sc=G.ok+'/'+G.q.length;if(b[G.m]==null||G.ok>parseInt(b[G.m])){b[G.m]=sc;try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}
  if(G.ok>=G.q.length-1)KA.sfx.win();
  stage(`<div class="endc"><span class="eyebrow">${MODES[G.m].n}</span><div class="big">${sc}</div><p class="mut">${G.ok===G.q.length?'Kusursuz tur!':G.ok>=G.q.length*.75?'Çok iyi; sınav seviyesindesin.':'Yanlışlarını aşağıda tekrar oku, sonra yeni bir tur dene.'}</p>${G.miss.length?`<div class="miss">${G.miss.map(m=>`<div>${esc(m)}</div>`).join('')}</div>`:''}<div class="row" style="justify-content:center;gap:8px;margin-top:16px"><button class="btn btn-p btn-lg" data-a="again">${ic('reset')}Aynı setle yeni tur</button><button class="btn btn-ghost btn-lg" data-a="hub">Kampa dön</button></div><p class="mut" style="font-size:13px;margin-top:10px">Tamamen yeni paragraflar için yukarıdan <b>Kendi kelimelerim → Yeni kelimelerle üret</b>.</p></div>`);
}

/* ---------- 1. Cümle yerleştir ---------- */
const gapB=(l,i)=>`<button class="gap" data-gap="${i}">${l}</button>`;
function drawYer(){
  const x=G.q[G.i],L='ABCD';let h='';
  x.rest.forEach((s,i)=>{if(x.pick.includes(i))h+=gapB(L[x.pick.indexOf(i)],x.pick.indexOf(i));h+=KA.tokens(s)+' '});
  if(x.pick.includes(x.rest.length))h+=gapB(L[x.pick.indexOf(x.rest.length)],x.pick.indexOf(x.rest.length));
  stage(`<div class="qlab"><span lang="en">${esc(x.title)}</span> · Eksik cümle nereye?</div><div class="ins"><small>EKSİK CÜMLE</small>${esc(x.s)}</div><div class="psg" id="psg">${h}</div><p class="mut" style="font-size:13px;margin:10px 0 0">Harflerden birine dokun.</p><div id="fb"></div>`);
}
function ansYer(i){
  const x=G.q[G.i];if(G.lock)return;G.lock=1;const ok=i===x.a;score(ok);
  document.querySelectorAll('.gap').forEach(b=>{const k=+b.dataset.gap;b.disabled=true;if(k===x.a)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  const right=document.querySelector(`.gap[data-gap="${x.a}"]`);if(right)right.insertAdjacentHTML('afterend',` <span class="placed">${esc(x.s)}</span>`);
  const prev=x.rest[x.k-1]||'',nx=x.rest[x.k]||'';
  fb(ok,ok?'Doğru yer!':'Doğru yer: '+'ABCD'[x.a],`${esc(x.why)}${prev?`<span class="ev">Önceki cümle: “${esc(prev)}”</span>`:''}${nx?`<span class="ev">Sonraki cümle: “${esc(nx)}”</span>`:''}`,ok?'':`${x.title}: ${x.s}`);
}
/* ---------- 2. Vaka dosyası ---------- */
function drawVaka(){
  const {set,q}=G.q[G.i];
  stage(`<div class="qlab"><span lang="en">${esc(set.src)}</span> · ${esc(set.t)}</div><div class="concepts">${set.c.map(([n,d])=>`<div><b>${esc(n)}</b>${esc(d)}</div>`).join('')}</div><div class="case">${KA.tokens(q.s)}</div><p style="font-weight:800;margin:14px 0 0">Bu durum en iyi hangi kavramla açıklanır?</p><div class="opts">${set.c.map(([n],i)=>`<button class="opt" data-o="${i}"><kbd>${'ABCDEF'[i]}</kbd><span>${esc(n)}</span></button>`).join('')}</div><div id="fb"></div>`);
}
function ansVaka(i){
  const {set,q}=G.q[G.i];if(G.lock)return;G.lock=1;const ok=i===q.a;score(ok);
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  fb(ok,ok?'Doğru kavram!':'Doğru cevap: '+set.c[q.a][0],esc(q.why),ok?'':`${set.c[q.a][0]}: ${q.s}`);
}
/* ---------- 3. Ana fikir avı ---------- */
function drawAna(){
  const x=G.q[G.i];
  stage(`<div class="qlab"><span lang="en">${esc(x.title)}</span></div><div class="psg">${KA.tokens(x.p)}</div><p style="font-weight:800;margin:14px 0 0">Bu paragrafın ana fikri hangisi?</p><div class="opts">${x.o.map((o,i)=>`<button class="opt" data-o="${i}"><kbd>${'ABCD'[i]}</kbd><span>${esc(o.t)}</span></button>`).join('')}</div><div id="fb"></div>`);
}
const WHY={det:'Bu paragrafta geçen doğru bir detay, ama çok dar: paragrafın tamamını kapsamıyor. Ana fikir bütün destekleyici cümleleri toparlamalı.',wrong:'Paragrafın kelimelerini kullanıyor ama anlamı çarpıtıyor (aşırı genelleme ya da ters ilişki). "always, only, all" gibi kesin ifadelere dikkat.',other:'Konuyla ilgili görünüyor ama paragrafta böyle bir fikir yok.'};
function ansAna(i){
  const x=G.q[G.i];if(G.lock)return;G.lock=1;const o=x.o[i],ok=o.k==='ok';score(ok);
  const right=x.o.find(z=>z.k==='ok');
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(x.o[k].k==='ok')b.classList.add('ok');else if(k===i)b.classList.add('no')});
  fb(ok,ok?'Ana fikri yakaladın!':'Bu ana fikir değil',ok?'Seçtiğin cümle paragrafın tamamını kapsıyor; detaylar onu destekliyor.':esc(WHY[o.k]),ok?'':`${x.title}: ${right.t}`);
}

document.addEventListener('click',e=>{
  const t=e.target;
  const tk=t.closest('.tk');if(tk){const s=(tk.closest('.psg,.case')||tk.parentElement).textContent;KA.lookup(tk.dataset.w,{anchor:tk,context:(s.match(/[^.!?]+[.!?]*/g)||[]).find(z=>z.includes(tk.dataset.w))||''});return}
  const go=t.closest('[data-go]');if(go){play(go.dataset.go);return}
  const gp=t.closest('[data-gap]');if(gp&&G){ansYer(+gp.dataset.gap);return}
  const o=t.closest('[data-o]');if(o&&G){(G.m==='vaka'?ansVaka:ansAna)(+o.dataset.o);return}
  const a=t.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='hub')hub();
  if(a.dataset.a==='next'&&G){G.i++;next()}
  if(a.dataset.a==='again'&&BAR){BAR.apply()}
});
document.addEventListener('keydown',e=>{if(!G||e.metaKey||e.ctrlKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Enter'&&$('#nx')){e.preventDefault();G.i++;next();return}const k='1234'.indexOf(e.key);if(k>=0&&!G.lock&&G.q.length&&G.i<G.q.length){if(G.m==='yer')ansYer(k);else(G.m==='vaka'?ansVaka:ansAna)(k)}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(MODES[h]&&(!G||G.m!==h))play(h);else if(!h&&G)hub()});
KA.nav('oyunlar.html');
const h=location.hash.slice(1);if(MODES[h])play(h);else hub();
})();
</script>
