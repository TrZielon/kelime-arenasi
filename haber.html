<style>
/* 2 AKDENİZ TEMASI & ULTRA HIZLI GPU ARKA PLAN */
body[data-pal="akdeniz"],body[data-pal="gece"],body[data-pal="kitaplik"]{
  --bg:#f3f8f6;--card:#ffffff;--line:#d5e7e1;--ink:#0d2b2a;--mut:#56736f;
  --p:#0f766e;--p2:#14b8a6;--acc:#f59e0b;--bad:#e11d48;--soft:#e2f1ed;--ok:#059669;
  --shadow:0 12px 28px -18px rgba(13,43,42,.28);--glow:rgba(20,184,166,.18);--acc-glow:rgba(245,158,11,.2);
}
body[data-pal="derin_akdeniz"],body[data-pal="sicak_espresso"]{
  --bg:#061514;--card:#0c2423;--line:#194240;--ink:#f3f8f6;--mut:#7ca39e;
  --p:#0f766e;--p2:#14b8a6;--acc:#fbbf24;--bad:#f43f5e;--soft:#11312f;--ok:#34d399;
  --shadow:0 14px 30px -18px rgba(0,0,0,.7);--glow:rgba(20,184,166,.22);--acc-glow:rgba(251,191,36,.22);
}
body{
  margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Plus Jakarta Sans","DM Sans",sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(800px 360px at 12% 0%,var(--glow),transparent 70%),radial-gradient(650px 320px at 88% 8%,var(--acc-glow),transparent 70%),radial-gradient(color-mix(in srgb,var(--mut) 10%,transparent) 1px,transparent 1.4px);
  background-size:100% 100%,100% 100%,24px 24px;
  transform:translateZ(0);will-change:transform;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);transform:translateZ(0)}
.nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo svg{width:38px;height:38px}
.logo-sub{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--acc);border:1px solid var(--line);margin-left:2px}
.navlinks{display:flex;gap:6px;margin-left:10px;flex-wrap:wrap}
.navlinks a{padding:8px 14px;border-radius:12px;font-weight:700;color:var(--mut)}
.navlinks a:hover{color:var(--ink);background:var(--soft)}
.navlinks a.cur{color:#fff;background:var(--p)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:7px}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.dots button.on{box-shadow:0 0 0 2px var(--p)}
.sndbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;min-height:34px}
.page{max-width:1100px;margin:0 auto;padding:24px 18px 90px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 20px 40px -25px var(--p);margin-bottom:24px}
.hero h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(24px,3.8vw,36px);margin:6px 0 8px;line-height:1.15}
.hero p{margin:0;opacity:.94;max-width:620px;font-size:15px}
h2.sec{font-family:Fraunces,serif;font-size:22px;margin:14px 0 14px;letter-spacing:-.3px}

/* GÖRSELLİ HABER GRIDİ */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.ncard{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--line),var(--shadow);transition:transform .18s,border-color .2s;contain:layout style}
.ncard:hover{transform:translateY(-3px);border-color:var(--p2)}
.ncard.featured{grid-column:1/-1;display:grid;grid-template-columns:1.35fr 1fr}
@media(max-width:760px){.ncard.featured{grid-template-columns:1fr}}
.nthumb{height:180px;position:relative;overflow:hidden;background:#0d2b2a}
.ncard.featured .nthumb{height:100%;min-height:240px}
.nthumb svg,.nthumb img{width:100%;height:100%;object-fit:cover;display:block}
.nbadge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.94);backdrop-filter:blur(4px);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:#0d2b2a;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ndate{position:absolute;top:12px;right:12px;background:rgba(13,43,42,.85);color:#f3f8f6;border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700}
.nbody{padding:16px 18px;display:flex;flex-direction:column;flex:1}
.nttl{font-family:Fraunces,serif;font-weight:800;font-size:18px;line-height:1.3;margin:0 0 8px;color:var(--ink)}
.ncard.featured .nttl{font-size:23px}
.nfoot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.nlv{font-weight:800;color:var(--p)}
.ncta{font-weight:800;color:var(--acc);display:inline-flex;align-items:center;gap:4px}

/* HABER DETAY (READER) */
.reader-box{background:var(--card);border:1.5px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 12px 36px -20px rgba(0,0,0,.3)}
.reader-hero{position:relative;height:240px;overflow:hidden;background:#0d2b2a}
.reader-hero svg,.reader-hero img{width:100%;height:100%;object-fit:cover;display:block}
.reader-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(6,21,20,.88) 100%);padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.reader-hero-overlay h1{font-family:Fraunces,serif;font-size:clamp(22px,3.5vw,32px);margin:6px 0 0;line-height:1.2}
.reader-body{padding:24px}
.tag{display:inline-block;font-size:11px;font-weight:800;background:var(--soft);color:var(--p);border-radius:999px;padding:4px 11px}
.pill{background:var(--soft);border:0;border-radius:999px;padding:8px 16px;min-height:38px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--p);color:#fff}
.pill.back{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px);align-self:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn3{background:var(--acc);color:#1f1300;border:0;border-radius:18px;padding:13px 22px;font-weight:800;font-size:15px;box-shadow:0 5px 0 #b45309;transition:transform .08s}
.btn3:active{transform:translateY(3px);box-shadow:0 2px 0 #b45309}
.box{background:var(--bg);border:1.5px solid var(--line);border-radius:22px;padding:22px;margin:14px 0}
.story{font-size:18px;line-height:1.9;font-family:Georgia,serif}
.tk{border-bottom:2px dotted var(--mut);cursor:pointer;border-radius:5px;padding:0 2px}
.tk:hover,.tk.sel{background:var(--soft);color:var(--p);border-bottom-color:transparent}
.tip{min-height:50px;margin-top:16px;background:var(--soft);border-radius:16px;padding:12px 16px;font-size:15px}
.tip b{color:var(--p)}
.bar{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--acc));border-radius:999px;transition:width .5s}
.qn{font-weight:800;margin-bottom:8px;font-size:16px}
.opt{display:block;width:100%;margin:8px 0;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:left;font-size:15px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--p2)}
.opt.ok{border-color:#16a34a;background:rgba(22,163,74,.15)}
.opt.bad{border-color:var(--bad);background:rgba(225,29,72,.15)}
select{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;color:var(--ink)}
@media(max-width:640px){.page{padding:14px 12px 80px}.story{font-size:17px}}
</style>
</head>

<script>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DONE=()=>{try{return JSON.parse(localStorage.getItem('ka_hn_done')||'{}')}catch(e){return {}}};
const saveDone=d=>localStorage.setItem('ka_hn_done',JSON.stringify(d));

/* KONUYA ÖZEL DİNAMİK SANAT MOTORU (HER HABERE RESİM) */

 ocean:(id)=>`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="o${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient></defs><rect width="400" height="220" fill="url(#o${id})"/><g opacity=".25" fill="#fff"><path d="M0 30 Q100 10 200 30 T400 30 V0H0z"/></g><g fill="#fb7185"><path d="M60 220 q10-60 0-90 q20 30 15 90z"/><path d="M90 220 q-5-50 20-80 q-5 40 0 80z" fill="#f97316"/><circle cx="300" cy="190" r="34" fill="#f472b6"/><circle cx="330" cy="200" r="24" fill="#fbbf24"/></g><g fill="#fde047"><path d="M200 100 q25-18 50 0 q-25 18-50 0z"/><path d="M250 100 l14-10 v20z"/></g><g fill="#fff" opacity=".7"><circle cx="180" cy="80" r="4"/><circle cx="175" cy="60" r="3"/></g></svg>`,

function getNewsArt(item, idx){
  if(item.image) return `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">`;
  const t = (String(item.title||'') + ' ' + String(item.category||'')).toLowerCase();
  let k = 'world';
  if(/coral|ocean|sea|fish|reef|marine|water|nature|animal/.test(t)) k = 'ocean';
  else if(/ai|tech|model|software|data|computer|robot|cyber|app|google|meta|chip/.test(t)) k = 'tech';
  else if(/space|moon|mars|saturn|orbit|nasa|planet|star|rocket|galaxy/.test(t)) k = 'space';
  else if(/heat|climate|warm|temperature|fire|weather|emission|carbon/.test(t)) k = 'climate';
  else if(/health|heart|walk|hospital|cancer|sleep|doctor|drug|virus/.test(t)) k = 'health';
  else if(/sport|football|cup|championship|win|match|race|olympic/.test(t)) k = 'sport';
  else if(/theatre|ancient|art|history|museum|culture|book|music/.test(t)) k = 'culture';
  return (ARTS[k] || ARTS.world)(idx);
}

/* SES */
let VOICE=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices()||[];
    VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Zira|David|Aria|Jenny|Guy|Ava|Allison/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||null;
  }catch(e){VOICE=null}
}
try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
pickVoice();
function say(t,rate){
  if(MUTED)return;
  try{
    pickVoice();speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||1;speechSynthesis.speak(u);
  }catch(e){}
}

function setPal(n){
  const t = (n==='derin_akdeniz'||n==='sicak_espresso')?'derin_akdeniz':'akdeniz';
  document.body.dataset.pal=t;
  document.querySelectorAll('.dots button').forEach(b=>b.classList.toggle('on',b.dataset.pal===t));
  try{localStorage.setItem('ka_pal',t)}catch(e){}
}
function setMute(){
  const s=$('#snd');if(s)s.textContent=MUTED?'🔇':'🔊';
  if(MUTED){try{speechSynthesis.cancel()}catch(e){}}
}
setPal(localStorage.getItem('ka_pal')||'akdeniz');
setMute();

async function load(){
  try{
    const r=await fetch('/data/news.json',{cache:'no-store'});
    if(!r.ok)throw new Error('yok');
    DATA=(await r.json()).items||[];
  }catch(e){DATA=[]}
  route();
}
function route(){
  const id=location.hash.slice(1);
  CUR=DATA.find(x=>x.id===id)||null;
  if(!CUR){LAST=null;return list()}
  if(id!==LAST){LEVEL='1';LAST=id}
  reader();
}

function list(){
  const done=DONE();
  const hero=`<section class="hero"><div class="eyebrow">Günlük haber · Görsel & Üç seviye</div><h1>Dünyadan Haberler, Gerçek İngilizce.</h1><p>Görselli haberleri oku, bilmediğin kelimelere tıkla, dinle ve quiz çözerek dil becerini pekiştir.</p></section>`;
  const body=DATA.length
    ? `<h2 class="sec">📰 Günün Haberleri</h2><div class="news-grid">`+DATA.map((x,i)=>`
      <a class="ncard ${i===0?'featured':''}" href="#${esc(x.id)}">
        <div class="nthumb">
          ${getNewsArt(x,i)}
          <span class="nbadge">${esc(x.category||'Dünya')}</span>
          <span class="ndate">${esc(x.date||'')}</span>
        </div>
        <div class="nbody">
          <h3 class="nttl">${esc(x.title)}</h3>
          <div class="nfoot">
            <span class="nlv">${[1,2,3].map(l=>LV[l]+(done[x.id+'-'+l]!=null?' ✓ %'+done[x.id+'-'+l]:'')).join(' · ')}</span>
            <span class="ncta">Haberi Oku →</span>
          </div>
        </div>
      </a>`).join('')+`</div>`
    : `<div class="box" style="text-align:center;padding:40px"><p style="color:var(--mut);margin:0">Henüz haber yüklenmedi. Haberler her sabah otomatik olarak eklenir.</p></div>`;
  $('#main').innerHTML=hero+body;
}

function reader(){
  const lv=CUR.levels[LEVEL]||CUR.levels['1'];
  const done=DONE();
  const tabs=[1,2,3].map(l=>`<button class="pill ${String(l)===LEVEL?'on':''}" data-lv="${l}">${LV[l]}${done[CUR.id+'-'+l]!=null?' ✓ %'+done[CUR.id+'-'+l]:''}</button>`).join('');
  const story=String(lv.text).split(/([A-Za-z][A-Za-z'-]*)/).map((t,i)=>i%2?`<span class="tk" data-w="${esc(t)}">${esc(t)}</span>`:esc(t)).join('');
  
  $('#main').innerHTML=`
  <div class="reader-box">
    <div class="reader-hero">
      ${getNewsArt(CUR,'hero')}
      <div class="reader-hero-overlay">
        <a class="pill back" href="#">← Haberlere Dön</a>
        <div class="row" style="margin:10px 0 2px">
          <span class="tag" style="background:rgba(255,255,255,.9);color:#0d2b2a">${esc(CUR.category||'Dünya')}</span>
          <span style="font-size:13px;opacity:.9">${esc(CUR.date)}</span>
        </div>
        <h1>${esc(CUR.title)}</h1>
      </div>
    </div>
    <div class="reader-body">
      <div class="row">${tabs}</div>
      <div class="box">
        <div class="row" style="margin-top:0">
          <button class="btn3" id="play" style="padding:10px 18px">🔊 Dinle</button>
          <select id="spd"><option value="0.8">Yavaş</option><option value="1" selected>Normal</option><option value="1.15">Hızlı</option></select>
          <button class="pill" id="stop">■ Durdur</button>
        </div>
        <div class="story">${story}</div>
        <div class="tip" id="tip"><span style="color:var(--mut)">💡 Bir kelimeye dokunun, Türkçe anlamı çıksın.</span></div>
      </div>
      <div class="row"><button class="btn3" id="quiz">Quiz'e geç →</button></div>
      <p style="font-size:12.5px;color:var(--mut);margin-top:16px">Kaynak: <a href="${esc(CUR.src)}" target="_blank" rel="noopener" style="color:var(--p);font-weight:700">${esc(CUR.source||'BBC News')}</a> · Metin bu haberden yapay zekâyla sadeleştirilmiştir.</p>
    </div>
  </div>`;
}

function quiz(){
  const qs=CUR.levels[LEVEL].quiz;
  QS={ans:Array(qs.length).fill(null)};
  $('#main').innerHTML=`
  <div class="box">
    <button class="pill" data-back="1" style="margin-bottom:14px">← Metne dön</button>
    <h2 class="sec" style="margin-top:0">${LV[LEVEL]} · Quiz</h2>
    ${qs.map((q,i)=>`<div class="box" style="background:var(--card)"><div class="qn">${i+1}. ${esc(q.q)}</div>${q.opts.map((o,k)=>`<button class="opt" data-q="${i}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`).join('')}
    <div id="res"></div>
  </div>`;
}

function answer(i,k){
  const qs=CUR.levels[LEVEL].quiz;
  if(QS.ans[i]!==null)return;
  QS.ans[i]=k;
  document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{
    b.disabled=true;
    const kk=+b.dataset.k;
    if(kk===qs[i].ans)b.classList.add('ok');
    else if(kk===k)b.classList.add('bad');
  });
  if(QS.ans.every(v=>v!==null)){
    const total=qs.length,right=QS.ans.filter((v,j)=>v===qs[j].ans).length,pct=Math.round(right/total*100);
    const d=DONE();d[CUR.id+'-'+LEVEL]=pct;saveDone(d);
    $('#res').innerHTML=`<div class="box" style="text-align:center"><div style="font-family:Fraunces,serif;font-size:32px;font-weight:900">%${pct}</div><div class="bar"><i style="width:${pct}%"></i></div><p style="color:var(--mut);margin:8px 0 16px">${right} / ${total} doğru</p><button class="btn3" data-back="1">Metne dön</button></div>`;
  }
}

async function tapWord(w,el){
  document.querySelectorAll('.tk.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  const tip=$('#tip'),key='ka_hw_'+w.toLowerCase();
  say(w);
  const cached=localStorage.getItem(key);
  if(cached){tip.innerHTML=`<b>${esc(w)}</b> — ${esc(cached)}`;return}
  tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--mut)">anlam aranıyor…</span>`;
  const sentence=CUR.levels[LEVEL].text.split(/(?<=[.!?])\s+/).find(s=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(s))||'';
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:`Translate the English word "${w}" into Turkish. It appears in this sentence: "${sentence}". Give the most fitting meaning in 1-3 Turkish words. Return ONLY JSON: {"tr":"..."}`,tier:'quick'})});
    const d=await r.json();
    const m=String(d.text||'').match(/\{[\s\S]*\}/);
    const v=m?String(JSON.parse(m[0]).tr||'').trim():'';
    if(v){localStorage.setItem(key,v);tip.innerHTML=`<b>${esc(w)}</b> — ${esc(v)}`}
    else tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--mut)">anlam bulunamadı</span>`;
  }catch(e){tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--bad)">bağlantı hatası</span>`}
}

/* EVENT DELEGATION */
document.addEventListener('click',e=>{
  const t=e.target;
  const pal=t.closest('.dots [data-pal]');if(pal){setPal(pal.dataset.pal);return}
  if(t.closest('#snd')){MUTED=!MUTED;localStorage.setItem('ka_mute',MUTED?'1':'0');setMute();return}
  const lv=t.closest('[data-lv]');if(lv){LEVEL=lv.dataset.lv;reader();return}
  if(t.closest('#quiz')){quiz();return}
  if(t.closest('[data-back]')){reader();return}
  const o=t.closest('[data-q]');if(o){answer(+o.dataset.q,+o.dataset.k);return}
  if(t.closest('#play')){say(CUR.levels[LEVEL].text,+$('#spd').value);return}
  if(t.closest('#stop')){speechSynthesis.cancel();return}
  const w=t.closest('.tk');if(w){tapWord(w.dataset.w,w);return}
});
window.addEventListener('hashchange',route);
load();
</script>
</body>
</html>
