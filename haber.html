<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haber · Kelime Arenası</title>
<meta name="description" content="Güncel dünya haberlerini üç seviyede İngilizce oku, bilmediğin kelimelere dokun, dinle ve quiz çöz.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css">
<style>
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(28px,4vw,38px);margin:6px 0 4px}
.head p{margin:0;color:var(--ink2);max-width:600px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.ph{position:relative;overflow:hidden;background:var(--soft);aspect-ratio:16/9}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.ph .cat{position:absolute;left:12px;top:12px;z-index:2;background:rgba(6,19,18,.78);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.ph .done{position:absolute;right:12px;top:12px;z-index:2;background:var(--ok);color:#fff;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;display:flex;gap:4px;align-items:center}
.ph .done svg{width:13px;height:13px}
.lead{display:grid;grid-template-columns:1.35fr 1fr;overflow:hidden;text-decoration:none;color:inherit;margin-bottom:18px}
.lead .ph{aspect-ratio:auto;min-height:340px}
.lead .tx{padding:28px;display:flex;flex-direction:column}
.lead h2{font-size:clamp(24px,3vw,32px);margin:8px 0 12px}
.lead p{color:var(--ink2);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ncard{overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.ncard:hover,.lead:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.ncard:hover img,.lead:hover img{transform:scale(1.03)}
.ncard .tx{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.ncard h3{font-size:19px;margin:6px 0 10px}
.ncard p{margin:0;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.lv{display:flex;gap:4px}
.lv i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.lv i.on{background:var(--ok)}
.reader{max-width:780px;margin:0 auto}
.rhead{margin:14px 0 18px}
.rhead h1{font-size:clamp(28px,4.2vw,40px);margin:10px 0}
.rph{border-radius:22px;overflow:hidden;aspect-ratio:16/8;margin-bottom:6px}
.credit{font-size:12px;color:var(--mut);margin-bottom:18px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--line);width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--mut)}
.tabs button small{font-weight:700;opacity:.75;margin-left:4px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.body{font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1.85;margin:20px 0;color:var(--ink)}
.body p{margin:0 0 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quiz{padding:22px;margin-top:26px}
.quiz h2{font-size:24px;margin:0 0 4px}
.qq{padding:16px 0;border-top:1px solid var(--line)}
.qq:first-of-type{border-top:0}
.qq b{display:block;margin-bottom:10px}
.qo{display:grid;gap:8px}
.qo button{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.qo button:hover:not(:disabled){border-color:var(--p)}
.qo button kbd{flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font:800 12px "Plus Jakarta Sans",sans-serif;color:var(--mut)}
.qo button.ok{border-color:var(--ok);background:var(--ok-soft)}
.qo button.no{border-color:var(--bad);background:var(--bad-soft)}
.qo button:disabled{cursor:default}
.qres{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--soft);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qres b{font-family:Fraunces,serif;font-size:26px}
.skel{border-radius:20px;background:var(--soft);min-height:260px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (max-width:860px){.lead{grid-template-columns:1fr}.lead .ph{min-height:0;aspect-ratio:16/9}.lead .tx{padding:20px}.body{font-size:18.5px}}
</style>
</head>
<body>
<main class="ka-wrap" id="main"><div class="skel"></div></main>
<script src="ortak.js"></script>
<script>
(function(){
'use strict';
const {$,esc}=KA;const ic=KA.ic;
const LV={1:['Seviye 1','A2'],2:['Seviye 2','B1'],3:['Seviye 3','B2']};
const TR_CAT={world:'Dünya',politics:'Siyaset',business:'Ekonomi',technology:'Teknoloji',science:'Bilim',health:'Sağlık',sport:'Spor',culture:'Kültür',environment:'Çevre'};
let DATA=[],LEVEL='1',FILTER='all';
const DONE=()=>KA.store.get('ka_hn_done',{})||{};
const saveDone=d=>KA.store.set('ka_hn_done',d);

/* ---------- Her habere özel fotoğraf ---------- */
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function cover(item){
  const h=hash(item.id||item.title),hu=(h%36)*10,P=[`hsl(${hu} 45% 22%)`,`hsl(${(hu+25)%360} 50% 38%)`,`hsl(${(hu+180)%360} 85% 70%)`];
  let shapes='';
  for(let i=0;i<7;i++){const r=(h>>>(i*3))&63,x=(r*37+i*91)%640,y=(r*53+i*47)%360,s=40+((h>>>(i+5))&127);shapes+=i%2?`<circle cx="${x}" cy="${y}" r="${s}" fill="#fff" opacity=".07"/>`:`<rect x="${x-s/2}" y="${y-s/2}" width="${s*1.6}" height="${s*1.6}" rx="${s/3}" transform="rotate(${(r*7)%90} ${x} ${y})" fill="${P[2]}" opacity=".12"/>`}
  const words=String(item.title||'').split(/\s+/).slice(0,3).join(' ');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/>${shapes}<text x="36" y="318" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#fff" opacity=".92">${esc(words)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function photoSrc(item){if(item.img)return item.img;if(item.src&&/bbc\./.test(item.src)&&location.protocol!=='file:')return 'api/og-image?u='+encodeURIComponent(item.src.split('?')[0]);return cover(item)}
function photo(item,eager){return `<img src="${esc(photoSrc(item))}" alt="" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async" data-cover="${esc(cover(item))}" onerror="if(this.src!==this.dataset.cover)this.src=this.dataset.cover">`}
const catName=c=>TR_CAT[String(c||'').toLowerCase()]||c||'Dünya';
const dateTr=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}catch(e){return d}};
const firstText=x=>{const l=x.levels||{};const t=(l['2']||l['1']||l['3']||{}).text||'';return t};

/* ---------- Liste ---------- */
function list(){
  document.title='Haber · Kelime Arenası';
  const done=DONE();
  const items=DATA.filter(x=>FILTER==='all'||(FILTER==='new'?!done[x.id]:!!done[x.id]));
  const lvBar=x=>`<span class="lv">${[1,2,3].map(n=>`<i class="${done[x.id]&&done[x.id][n]!=null?'on':''}"></i>`).join('')}</span>`;
  const badge=x=>done[x.id]?`<span class="done">${ic('check')}Okundu</span>`:'';
  const [L,...R]=items;
  $('#main').innerHTML=`<div class="head"><div><span class="eyebrow">Günlük haber · üç seviye</span><h1>Dünyadan haberler, gerçek İngilizce</h1><p>Her gün güncellenen haberleri seviyene göre oku. Bilmediğin kelimeye dokun, anlamını gör ve listene ekle, sonra kısa quizle pekiştir.</p></div>
  <div class="filters">${[['all','Tümü'],['new','Okunmadı'],['done','Okundu']].map(([k,t])=>`<button class="pill ${FILTER===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div></div>
  ${!items.length?'<div class="card" style="padding:40px;text-align:center"><p class="mut">Bu filtrede haber yok.</p></div>':''}
  ${L?`<a class="card lead" href="#${esc(L.id)}"><div class="ph">${photo(L,true)}<span class="cat">${esc(catName(L.category))}</span>${badge(L)}</div><div class="tx"><span class="eyebrow">${dateTr(L.date)} · ${esc(L.source||'BBC News')}</span><h2>${esc(L.title)}</h2><p>${esc((firstText(L).match(/[^.]+\.?/g)||[]).slice(0,2).join('').trim())}</p><div class="meta"><span>Seviye 1 · 2 · 3</span>${lvBar(L)}</div><div style="margin-top:16px"><span class="btn btn-p">Haberi oku${ic('arrow')}</span></div></div></a>`:''}
  <div class="grid">${R.map(x=>`<a class="card ncard" href="#${esc(x.id)}"><div class="ph">${photo(x)}<span class="cat">${esc(catName(x.category))}</span>${badge(x)}</div><div class="tx"><span class="eyebrow">${dateTr(x.date)}</span><h3>${esc(x.title)}</h3><p>${esc(firstText(x))}</p><div class="meta"><span>Oku ve quiz çöz</span>${lvBar(x)}</div></div></a>`).join('')}</div>`;
}

/* ---------- Okuyucu ---------- */
let QS=null;
function reader(x){
  document.title=x.title+' · Haber';
  const lv=x.levels||{};if(!lv[LEVEL])LEVEL=Object.keys(lv)[0]||'1';
  const L=lv[LEVEL]||{text:'',quiz:[]};
  const paras=String(L.text).split(/\n+/).filter(Boolean);
  const host=(()=>{try{return new URL(x.src).hostname.replace(/^www\./,'')}catch(e){return ''}})();
  $('#main').innerHTML=`<article class="reader">
  <a href="#" class="btn btn-ghost btn-sm">${ic('back')}Bütün haberler</a>
  <div class="rhead"><span class="eyebrow">${esc(catName(x.category))} · ${dateTr(x.date)}</span><h1>${esc(x.title)}</h1></div>
  <div class="rph ph">${photo(x,true)}</div>
  <div class="credit">Fotoğraf ve kaynak: ${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">${esc(x.source||host)}</a>`:esc(x.source||'')}</div>
  <div class="row" style="justify-content:space-between">
    <div class="tabs" role="tablist">${['1','2','3'].filter(n=>lv[n]).map(n=>`<button role="tab" class="${n===LEVEL?'on':''}" data-lv="${n}">${LV[n][0]}<small>${LV[n][1]}</small></button>`).join('')}</div>
    <div class="tools"><button class="btn btn-ghost btn-sm" data-read="1">${ic('sound')}Haberi dinle</button><button class="btn btn-ghost btn-sm" data-read=".8">Yavaş dinle</button></div>
  </div>
  <div class="body" id="body">${paras.map(p=>`<p>${KA.tokens(p)}</p>`).join('')}</div>
  <p class="mut" style="font-size:13.5px;margin-top:-6px">${ic('spark')} Bilmediğin bir kelimeye dokun: anlamı, eş anlamlıları ve “Bilmediklerime ekle” düğmesi açılır. Eklediğin kelimeler ana sayfada <b>Bilmediklerim</b> listesine düşer.</p>
  <section class="card quiz" id="quiz"></section>
  </article>`;
  QS={x,lv:LEVEL,ans:{},quiz:(L.quiz||[]).filter(q=>q&&Array.isArray(q.opts))};
  drawQuiz();
  scrollTo(0,0);
}
function drawQuiz(){
  const {quiz,ans}=QS,n=Object.keys(ans).length,ok=Object.entries(ans).filter(([i,v])=>quiz[i].ans===v).length;
  if(!quiz.length){$('#quiz').innerHTML='<p class="mut">Bu seviye için quiz yok.</p>';return}
  $('#quiz').innerHTML=`<span class="eyebrow">${LV[QS.lv][0]} quiz</span><h2>Ne kadar anladın?</h2><p class="mut" style="margin:0 0 6px">${quiz.length} soru · her doğru +5 XP</p>
  ${quiz.map((q,i)=>`<div class="qq"><b>${i+1}. ${esc(q.q)}</b><div class="qo">${q.opts.map((o,k)=>{const a=ans[i];const cls=a==null?'':(k===q.ans?'ok':(k===a?'no':''));return `<button class="${cls}" data-q="${i}" data-o="${k}" ${a!=null?'disabled':''}><kbd>${'ABCD'[k]}</kbd><span>${esc(o)}</span></button>`}).join('')}</div></div>`).join('')}
  ${n===quiz.length?`<div class="qres"><b>${ok}/${quiz.length}</b><div class="grow">${ok===quiz.length?'Kusursuz! Bir üst seviyeyi dene.':ok>=quiz.length/2?'Güzel. Yanlışlarını metinde tekrar bul.':'Metni bir kez daha oku, sonra tekrar dene.'}</div>${QS.lv<'3'&&QS.x.levels[String(+QS.lv+1)]?`<button class="btn btn-p" data-lv="${+QS.lv+1}">Seviye ${+QS.lv+1}'e geç${ic('arrow')}</button>`:''}<button class="btn btn-ghost" data-retry>${ic('reset')}Tekrar çöz</button></div>`:''}`;
}
function answer(i,k){
  if(QS.ans[i]!=null)return;QS.ans[i]=k;const ok=QS.quiz[i].ans===k;ok?KA.sfx.ok():KA.sfx.bad();
  if(ok)KA.addXp(5);
  if(Object.keys(QS.ans).length===QS.quiz.length){const d=DONE();d[QS.x.id]=d[QS.x.id]||{};d[QS.x.id][QS.lv]=Object.entries(QS.ans).filter(([a,v])=>QS.quiz[a].ans===v).length;saveDone(d)}
  drawQuiz();
}

/* ---------- Yükleme ve yönlendirme ---------- */
function route(){
  KA.closeLookup();KA.stopSpeak();
  const id=decodeURIComponent(location.hash.slice(1));
  const x=DATA.find(i=>i.id===id);
  if(x)reader(x);else list();
}
async function load(){
  try{const r=await fetch('data/news.json',{cache:'no-cache'});if(!r.ok)throw 0;const j=await r.json();DATA=(j.items||[]).filter(x=>x&&x.id&&x.levels)}catch(e){DATA=[]}
  if(!DATA.length){$('#main').innerHTML='<div class="card" style="padding:40px;text-align:center"><h2>Haberler yüklenemedi</h2><p class="mut">Biraz sonra tekrar dene.</p></div>';return}
  route();
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tk=t.closest('.tk');if(tk){const p=tk.closest('p');const s=((p?p.textContent:'').match(/[^.!?]+[.!?]*/g)||[]).map(z=>z.trim()).find(z=>z.includes(tk.dataset.w))||'';KA.lookup(tk.dataset.w,{anchor:tk,context:s});return}
  const f=t.closest('[data-f]');if(f){FILTER=f.dataset.f;list();return}
  const lv=t.closest('[data-lv]');if(lv){LEVEL=lv.dataset.lv;const x=DATA.find(i=>i.id===decodeURIComponent(location.hash.slice(1)));if(x)reader(x);return}
  const o=t.closest('[data-o]');if(o){answer(+o.dataset.q,+o.dataset.o);return}
  if(t.closest('[data-retry]')){QS.ans={};drawQuiz();return}
  const rd=t.closest('[data-read]');if(rd){const b=$('#body');if(b)KA.speak(b.textContent,+rd.dataset.read);return}
});
addEventListener('hashchange',route);
KA.nav('haber.html',{stats:true});
load();
})();
</script>
</body>
</html>
