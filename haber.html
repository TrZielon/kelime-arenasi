<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haber · Kelime Arenası</title>
<meta name="description" content="Güncel dünya haberlerini üç seviyede İngilizce oku, bilmediğin kelimelere dokun, dinle ve quiz çöz.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K. Arenası">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light';if(sessionStorage.getItem('ka_gate'))document.documentElement.classList.add('ka-gin')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css?v=17">
<style>
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(28px,4vw,38px);margin:6px 0 4px}
.head p{margin:0;color:var(--ink2);max-width:600px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.ph{position:relative;overflow:hidden;background:var(--soft);aspect-ratio:16/9}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.ph .cat{position:absolute;left:12px;top:12px;z-index:2;background:rgba(6,19,18,.78);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.ph .done{position:absolute;right:12px;top:12px;z-index:2;background:var(--ok);color:#fff;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;display:flex;gap:4px;align-items:center}
.ph .done svg{width:13px;height:13px}
.lead{display:grid;grid-template-columns:1.35fr 1fr;overflow:hidden;text-decoration:none;color:inherit;margin-bottom:18px}
.lead .ph{aspect-ratio:auto;min-height:340px}
.lead .tx{padding:28px;display:flex;flex-direction:column}
.lead h2{font-size:clamp(24px,3vw,32px);margin:8px 0 12px}
.lead p{color:var(--ink2);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ncard{overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.ncard:hover,.lead:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.ncard:hover img,.lead:hover img{transform:scale(1.03)}
.ncard .tx{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.ncard h3{font-size:19px;margin:6px 0 10px}
.ncard p{margin:0;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.lv{display:flex;gap:4px}
.lv i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.lv i.on{background:var(--ok)}
.reader{max-width:780px;margin:0 auto}
.rhead{margin:14px 0 18px}
.rhead h1{font-size:clamp(28px,4.2vw,40px);margin:10px 0}
.rph{border-radius:22px;overflow:hidden;aspect-ratio:16/8;margin-bottom:6px}
.credit{font-size:12px;color:var(--mut);margin-bottom:18px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--line);width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--mut)}
.tabs button small{font-weight:700;opacity:.75;margin-left:4px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.body{font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1.85;margin:20px 0;color:var(--ink)}
.body p{margin:0 0 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quiz{padding:22px;margin-top:26px}
.quiz h2{font-size:24px;margin:0 0 4px}
.qq{padding:16px 0;border-top:1px solid var(--line)}
.qq:first-of-type{border-top:0}
.qq b{display:block;margin-bottom:10px}
.qo{display:grid;gap:8px}
.qo button{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.qo button:hover:not(:disabled){border-color:var(--p)}
.qo button kbd{flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font:800 12px "Plus Jakarta Sans",sans-serif;color:var(--mut)}
.qo button.ok{border-color:var(--ok);background:var(--ok-soft)}
.qo button.no{border-color:var(--bad);background:var(--bad-soft)}
.qo button:disabled{cursor:default}
.qres{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--soft);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qres b{font-family:Fraunces,serif;font-size:26px}
.skel{border-radius:20px;background:var(--soft);min-height:260px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (max-width:860px){.lead{grid-template-columns:1fr}.lead .ph{min-height:0;aspect-ratio:16/9}.lead .tx{padding:20px}.body{font-size:18.5px}}

.rhead h1.veil{filter:blur(9px);user-select:none;pointer-events:none}
.fsteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fsteps span{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:800;color:var(--mut)}
.fsteps b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:11px}
.fsteps .on{background:var(--p-soft);color:var(--p)}.fsteps .on b{background:var(--p);color:var(--p-ink)}
.fsteps .done{color:var(--ok)}.fsteps .done b{background:var(--ok);color:#fff}
.hl{padding:18px 20px}
.hline{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px;min-height:44px}
.hline span{min-width:34px;padding:6px 10px;border-radius:10px;border:1.5px dashed var(--line2);font-family:Fraunces,serif;font-weight:800;font-size:18px;line-height:1.3}
.hline span.in{border-style:solid;border-color:transparent;background:var(--p);color:var(--p-ink);animation:kaStamp .35s var(--spring)}
.hbank{display:flex;flex-wrap:wrap;gap:8px}
.hbank button{--d:var(--line2);border:0;border-radius:12px;padding:9px 13px;background:var(--card);color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s,opacity .2s}
.hbank button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.hbank button.used{opacity:.25;box-shadow:0 0 0 1.5px var(--line) inset}
.hbank button.no{animation:kaShake .45s}
.tell{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.olab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.btn.onb{box-shadow:0 0 0 1.5px var(--acc) inset,0 3px 0 var(--acc2)}
.body.shownew .tk.nw{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--acc) 45%,transparent) 62%)}
.quiz h2{margin:10px 0 14px;font-size:22px}
.qpips{display:flex;gap:6px;margin-top:10px}
.qpips i{flex:1;height:8px;border-radius:5px;background:var(--soft)}
.qpips i.cur{background:var(--line2)}.qpips i.ok{background:var(--ok)}.qpips i.no{background:var(--bad)}
.fstamp{width:132px;height:132px;margin:18px auto 14px;border-radius:50%;display:grid;place-content:center;text-align:center;gap:2px;border:4px double currentColor;color:var(--ok);rotate:-8deg;animation:kaSlam .55s var(--spring) backwards}
.fstamp.half{color:var(--acc2)}
.fstamp b{font-family:Fraunces,serif;font-size:34px;line-height:1}
.fstamp span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<main class="ka-wrap" id="main"><div class="skel"></div></main>
<script src="firebase-config.js?v=17"></script><script src="ortak.js?v=17"></script>
<script>
(function(){
'use strict';
const {$,esc}=KA;const ic=KA.ic;
const LV={1:['Sade','A2'],2:['Dengeli','B1'],3:['Zengin','B2']};
const TR_CAT={world:'Dünya',politics:'Siyaset',business:'Ekonomi',technology:'Teknoloji',science:'Bilim',health:'Sağlık',sport:'Spor',culture:'Kültür',environment:'Çevre'};
let DATA=[],LEVEL='1',FILTER='all';
const DONE=()=>KA.store.get('ka_hn_done',{})||{};
const saveDone=d=>KA.store.set('ka_hn_done',d);

/* ---------- Her habere özel fotoğraf ---------- */
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function cover(item){
  const h=hash(item.id||item.title),hu=(h%36)*10,P=[`hsl(${hu} 45% 22%)`,`hsl(${(hu+25)%360} 50% 38%)`,`hsl(${(hu+180)%360} 85% 70%)`];
  let shapes='';
  for(let i=0;i<7;i++){const r=(h>>>(i*3))&63,x=(r*37+i*91)%640,y=(r*53+i*47)%360,s=40+((h>>>(i+5))&127);shapes+=i%2?`<circle cx="${x}" cy="${y}" r="${s}" fill="#fff" opacity=".07"/>`:`<rect x="${x-s/2}" y="${y-s/2}" width="${s*1.6}" height="${s*1.6}" rx="${s/3}" transform="rotate(${(r*7)%90} ${x} ${y})" fill="${P[2]}" opacity=".12"/>`}
  const words=String(item.title||'').split(/\s+/).slice(0,3).join(' ');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/>${shapes}<text x="36" y="318" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#fff" opacity=".92">${esc(words)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function photoSrc(item){return cover(item);if(item.img)return item.img;if(item.src&&/bbc\./.test(item.src)&&location.protocol!=='file:')return 'api/og-image?u='+encodeURIComponent(item.src.split('?')[0]);return cover(item)}
function photo(item,eager){return `<img src="${esc(photoSrc(item))}" alt="" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async" data-cover="${esc(cover(item))}" onerror="if(this.src!==this.dataset.cover)this.src=this.dataset.cover">`}
const catName=c=>TR_CAT[String(c||'').toLowerCase()]||c||'Dünya';
const dateTr=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}catch(e){return d}};
const firstText=x=>{const l=x.levels||{};const t=(l['2']||l['1']||l['3']||{}).text||'';return t};

/* ---------- Liste ---------- */
function list(){
  document.title='Haber · Kelime Arenası';
  const done=DONE();
  const items=DATA.filter(x=>FILTER==='all'||(FILTER==='new'?!done[x.id]:!!done[x.id]));
  const lvBar=x=>`<span class="lv">${[1,2,3].map(n=>`<i class="${done[x.id]&&done[x.id][n]!=null?'on':''}"></i>`).join('')}</span>`;
  const badge=x=>done[x.id]?`<span class="done">${ic('check')}Okundu</span>`:'';
  const [L,...R]=items;
  $('#main').innerHTML=`<div class="head"><div><span class="eyebrow">Günlük dosya · manşeti kur, oku, sorguyu geç</span><h1>Günün bülteni: <span class="sq">gerçek İngilizce<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M1 6 C 12 1, 20 9, 32 5 S 52 1, 64 5 S 86 9, 99 3"/></svg></span></h1><p>Her haber bir dosya: önce manşeti kelimelerinden kur, sonra haberi istediğin anlatımla oku, en sonda sorguyu geçip dosyayı kapat.</p></div>
  <div class="filters">${[['all','Tümü'],['new','Okunmadı'],['done','Okundu']].map(([k,t])=>`<button class="pill ${FILTER===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div></div>
  ${!items.length?'<div class="card" style="padding:40px;text-align:center"><p class="mut">Bu filtrede haber yok.</p></div>':''}
  ${L?`<a class="card lead" href="#${esc(L.id)}"><div class="ph">${photo(L,true)}<span class="cat">${esc(catName(L.category))}</span>${badge(L)}</div><div class="tx"><span class="eyebrow">Günün manşeti · ${dateTr(L.date)} · kaynak ${esc(L.source||'BBC News')}</span><h2>${esc(L.title)}</h2><p>${esc((firstText(L).match(/[^.]+\.?/g)||[]).slice(0,2).join('').trim())}</p><div class="meta"><span>Sade · Dengeli · Zengin</span>${lvBar(L)}</div><div style="margin-top:16px"><span class="btn btn-p">Haberi oku${ic('arrow')}</span></div></div></a>`:''}
  ${R.length?`<div class="sec-b"><h2>Bültenin devamı</h2><span class="mut">${R.length} haber</span></div>`:''}
  <div class="bul">${R.map((x,i)=>{const wc=firstText(x).split(/\s+/).length,full=String(((x.levels||{})[LEVEL]||{}).text||'').split(/\s+/).length;return `<a class="card brow" href="#${esc(x.id)}" style="--i:${Math.min(i,8)}"><span class="bn">${String(i+2).padStart(2,'0')}</span><span class="bstrip" style="background-image:url('${esc(cover(x))}')"></span><div class="tx"><div class="bm"><span class="cat">${esc(catName(x.category))}</span><span>${dateTr(x.date)}</span><span>${Math.max(1,Math.round(full/170))} dk okuma</span>${badge(x)}</div><h3>${esc(x.title)}</h3><p>${esc(firstText(x))}</p></div><div class="bside">${lvBar(x)}<span class="go">${ic('arrow')}</span></div></a>`}).join('')}</div>`;
}

/* ---------- Okuyucu ---------- */
let QS=null;
const wordsOf=t=>new Set((String(t||'').toLowerCase().match(/[a-z][a-z'-]{2,}/g)||[]));
const stem=w=>w.replace(/(ing|ed|es|s|ly)$/,'');
function reader(x){
  document.title=x.title+' · Haber';
  const lv=x.levels||{};if(!lv[LEVEL])LEVEL=Object.keys(lv)[0]||'1';
  const L=lv[LEVEL]||{text:'',quiz:[]};
  const paras=String(L.text).split(/\n+/).filter(Boolean);
  const host=(()=>{try{return new URL(x.src).hostname.replace(/^www\./,'')}catch(e){return ''}})();
  const d=DONE()[x.id]||{},keys=['1','2','3'].filter(n=>lv[n]);
  // bu anlatımda, bir sade anlatıma göre yeni gelen kelimeler
  const prev=lv[String(+LEVEL-1)];let fresh=new Set();
  if(prev){const base=new Set([...wordsOf(prev.text)].map(stem));fresh=new Set([...wordsOf(L.text)].filter(w=>w.length>4&&!base.has(stem(w))))}
  $('#main').innerHTML=`<article class="reader">
  <a href="#" class="btn btn-ghost btn-sm">${ic('back')}Bülten</a>
  <div class="rhead"><span class="eyebrow">Dosya · ${esc(catName(x.category))} · ${dateTr(x.date)}</span><h1 id="ttl" class="${HL[x.id]?'':'veil'}">${esc(x.title)}</h1></div>
  <div class="fsteps"><span class="${HL[x.id]?'done':'on'}"><b>1</b>Manşeti kur</span><span class="${HL[x.id]?'on':''}"><b>2</b>Oku</span><span class="${d[LEVEL]!=null?'done':''}"><b>3</b>Sorgu</span></div>
  <section class="card hl" id="hl"></section>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    <div class="tell"><span class="olab">Anlatım</span><div class="tabs" role="tablist">${keys.map(n=>`<button role="tab" class="${n===LEVEL?'on':''}" data-lv="${n}">${LV[n][0]}${d[n]!=null?' ✓':''}</button>`).join('')}</div></div>
    <div class="tools">${fresh.size?`<button class="btn btn-ghost btn-sm ${SHOWNEW?'onb':''}" data-new>${ic('spark')}Bu anlatımda yeni: ${fresh.size} kelime</button>`:''}<button class="btn btn-ghost btn-sm" data-read="1">${ic('sound')}Dinle</button><button class="btn btn-ghost btn-sm" data-read=".8">Yavaş</button></div>
  </div>
  <div class="body ${SHOWNEW?'shownew':''}" id="body">${paras.map(p=>`<p>${KA.tokens(p)}</p>`).join('')}</div>
  <p class="mut" style="font-size:13.5px;margin-top:-6px">Bilmediğin kelimeye dokun: anlamı açılır, istersen <b>Bilmediklerim</b> listene eklenir. Kaynak: ${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">${esc(x.source||host)}</a>`:esc(x.source||'')}</p>
  <section class="card quiz" id="quiz"></section>
  </article>`;
  if(fresh.size)document.querySelectorAll('#body .tk').forEach(t=>{if(fresh.has(String(t.dataset.w||'').toLowerCase()))t.classList.add('nw')});
  QS={x,lv:LEVEL,ans:{},i:0,quiz:(L.quiz||[]).filter(q=>q&&Array.isArray(q.opts))};
  drawHL(x);drawQuiz();
  scrollTo(0,0);
}
/* Manşeti kur: başlığın kelimeleri karışık gelir, sırayla dokunup kurarsın */
const HL={};let HS=null,SHOWNEW=true;
function drawHL(x){
  const box=$('#hl');if(!box)return;
  if(HL[x.id]){box.hidden=true;return}
  const W=x.title.split(/\s+/).filter(Boolean);
  if(W.length<4||W.length>16){HL[x.id]=1;$('#ttl').classList.remove('veil');box.hidden=true;return}
  if(!HS||HS.id!==x.id){let o=W.map((_,i)=>i);for(let k=0;k<5&&o.every((v,i)=>v===i);k++)o=o.sort(()=>Math.random()-.5);HS={id:x.id,W,order:o.sort(()=>Math.random()-.5),got:0,miss:0}}
  box.innerHTML=`<div class="row" style="justify-content:space-between"><span class="eyebrow">1 · Manşeti kur</span><button class="btn btn-ghost btn-sm" data-hl="skip">Geç, manşeti göster</button></div>
  <div class="hline">${HS.W.map((w,i)=>`<span class="${i<HS.got?'in':''}">${i<HS.got?esc(w):'&nbsp;'}</span>`).join('')}</div>
  <div class="hbank">${HS.order.map(i=>`<button data-hw="${i}" ${i<HS.got?'disabled class="used"':''}>${esc(HS.W[i])}</button>`).join('')}</div>
  <p class="mut" style="margin:10px 0 0;font-size:13px">Manşetin kelimelerine doğru sırayla dokun. İngilizce cümle sırasını kurmak, okumaya başlamadan konuyu kafanda toplar.</p>`;
}
function pickHL(i,el){
  if(!HS)return;const want=HS.W[HS.got];
  if(HS.W[i]===want){// aynı kelimeden iki tane varsa hangisine dokunulduğu fark etmez
    const real=HS.got;if(i!==real){const a=HS.order.indexOf(i),b=HS.order.indexOf(real);[HS.order[a],HS.order[b]]=[HS.order[b],HS.order[a]]}
    HS.got++;KA.sfx.tick&&KA.sfx.tick();
    if(HS.got===HS.W.length){HL[HS.id]=1;KA.sfx.ok();KA.addXp(HS.miss?3:6);KA.toast(HS.miss?'Manşet kuruldu: +3 XP':'İlk seferde kurdun: +6 XP');const x=QS.x;HS=null;reader(x);return}
    drawHL(QS.x)}
  else{HS.miss++;KA.sfx.bad();el.classList.remove('no');void el.offsetWidth;el.classList.add('no')}
}
function drawQuiz(){
  const {quiz,ans}=QS,n=Object.keys(ans).length,ok=Object.entries(ans).filter(([i,v])=>quiz[i].ans===v).length;
  if(!quiz.length){$('#quiz').innerHTML='<p class="mut">Bu anlatım için sorgu yok.</p>';return}
  const pips=`<div class="qpips">${quiz.map((q,i)=>`<i class="${ans[i]==null?(i===QS.i?'cur':''):ans[i]===q.ans?'ok':'no'}"></i>`).join('')}</div>`;
  if(n===quiz.length&&QS.i>=quiz.length){
    const up=QS.lv<'3'&&QS.x.levels[String(+QS.lv+1)];
    $('#quiz').innerHTML=`<span class="eyebrow">3 · Sorgu · ${LV[QS.lv][0]} anlatım</span>${pips}<div class="fstamp ${ok===quiz.length?'':'half'}"><b>${ok}/${quiz.length}</b><span>${ok===quiz.length?'Dosya kapandı':'Dosya açık'}</span></div>
    <p style="text-align:center;margin:0 0 14px;color:var(--ink2)">${ok===quiz.length?(up?'Kusursuz. Aynı haberi daha zengin anlatımla oku; yeni gelen kelimeler işaretli olacak.':'Kusursuz. Bu dosyanın en zengin anlatımını da bitirdin.'):ok>=quiz.length/2?'Yanlış yaptığın soruların cevabını metinde bul, sonra tekrar dene.':'Haberi bir kez daha oku, sonra sorguya dön.'}</p>
    <div class="row" style="justify-content:center">${up?`<button class="btn btn-p" data-lv="${+QS.lv+1}">${LV[+QS.lv+1][0]} anlatımla oku${ic('arrow')}</button>`:''}<button class="btn btn-ghost" data-retry>${ic('reset')}Sorguyu tekrarla</button><a class="btn btn-ghost" href="#">Bültene dön</a></div>`;
    return}
  const i=Math.min(QS.i,quiz.length-1),q=quiz[i],a=ans[i];
  $('#quiz').innerHTML=`<span class="eyebrow">3 · Sorgu · ${LV[QS.lv][0]} anlatım</span>${pips}<h2>${esc(q.q)}</h2>
  <div class="qo">${q.opts.map((o,k)=>{const cls=a==null?'':(k===q.ans?'ok':(k===a?'no':''));return `<button class="${cls}" data-q="${i}" data-o="${k}" ${a!=null?'disabled':''}><kbd>${'ABCD'[k]}</kbd><span>${esc(o)}</span></button>`}).join('')}</div>
  ${a!=null?`<div class="row" style="justify-content:space-between;margin-top:14px"><span class="mut" style="font-weight:700">${a===q.ans?'Doğru · +5 XP':'Cevabı metinde bulabilirsin; yukarı kaydırıp bak.'}</span><button class="btn btn-p" data-qn>${i===quiz.length-1?'Sonucu gör':'Sıradaki soru'}${ic('arrow')}</button></div>`:`<p class="mut" style="margin:12px 0 0;font-size:13px">Soru ${i+1} / ${quiz.length} · her doğru +5 XP</p>`}`;
}
function answer(i,k){
  if(QS.ans[i]!=null)return;QS.ans[i]=k;const ok=QS.quiz[i].ans===k;ok?KA.sfx.ok():KA.sfx.bad();
  if(ok)KA.addXp(5);
  if(Object.keys(QS.ans).length===QS.quiz.length){const d=DONE();d[QS.x.id]=d[QS.x.id]||{};d[QS.x.id][QS.lv]=Object.entries(QS.ans).filter(([a,v])=>QS.quiz[a].ans===v).length;saveDone(d)}
  drawQuiz();
}

/* ---------- Yükleme ve yönlendirme ---------- */
function route(){
  KA.closeLookup();KA.stopSpeak();
  const id=decodeURIComponent(location.hash.slice(1));
  const x=DATA.find(i=>i.id===id);
  if(x)reader(x);else list();
}
async function load(){
  try{const r=await fetch('data/news.json',{cache:'no-cache'});if(!r.ok)throw 0;const j=await r.json();DATA=(j.items||[]).filter(x=>x&&x.id&&x.levels)}catch(e){DATA=[]}
  if(!DATA.length){$('#main').innerHTML='<div class="card" style="padding:40px;text-align:center"><h2>Haberler yüklenemedi</h2><p class="mut">Biraz sonra tekrar dene.</p></div>';return}
  route();
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tk=t.closest('.tk');if(tk){const p=tk.closest('p');const s=((p?p.textContent:'').match(/[^.!?]+[.!?]*/g)||[]).map(z=>z.trim()).find(z=>z.includes(tk.dataset.w))||'';KA.lookup(tk.dataset.w,{anchor:tk,context:s});return}
  const f=t.closest('[data-f]');if(f){FILTER=f.dataset.f;list();return}
  const lv=t.closest('[data-lv]');if(lv){LEVEL=lv.dataset.lv;const x=DATA.find(i=>i.id===decodeURIComponent(location.hash.slice(1)));if(x)reader(x);return}
  const o=t.closest('[data-o]');if(o){answer(+o.dataset.q,+o.dataset.o);return}
  if(t.closest('[data-retry]')){QS.ans={};QS.i=0;drawQuiz();return}
  if(t.closest('[data-qn]')){QS.i++;drawQuiz();if(QS.i>=QS.quiz.length&&Object.entries(QS.ans).every(([a,v])=>QS.quiz[a].ans===v))KA.sfx.win();return}
  const hw=t.closest('[data-hw]');if(hw){pickHL(+hw.dataset.hw,hw);return}
  if(t.closest('[data-hl]')){HL[QS.x.id]=1;HS=null;reader(QS.x);return}
  if(t.closest('[data-new]')){SHOWNEW=!SHOWNEW;$('#body').classList.toggle('shownew',SHOWNEW);t.closest('[data-new]').classList.toggle('onb',SHOWNEW);return}
  const rd=t.closest('[data-read]');if(rd){const b=$('#body');if(b)KA.speak(b.textContent,+rd.dataset.read);return}
});
addEventListener('hashchange',route);
KA.nav('haber.html',{stats:true});
load();
})();
</script>
</body>
</html>
