<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haber · Kelime Arenası</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#f1f7f5;--card:#ffffff;--ink:#15322d;--muted:#5d7a73;
  --teal:#1f5f57;--teal2:#2f8a7c;--accent:#f2a53a;--accent2:#e8902a;
  --line:#dbe8e4;--soft:#e6f2ee;--ok:#2e9e6e;--bad:#d9534f;
  --r:20px;--sh:0 10px 28px -16px rgba(21,50,45,.28);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;flex-wrap:wrap}
.brand{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:22px;color:var(--teal);text-decoration:none}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink)}
nav a:hover{background:var(--soft)}
nav a.cur{background:var(--teal);color:#fff}
.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:28px;padding:28px 26px;margin:6px 0 22px;box-shadow:var(--sh)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin:0 0 6px}
.hero h1{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0 0 8px}
.hero p{margin:0;opacity:.92}
h2{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:24px;margin:8px 0 10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--sh);text-decoration:none;transition:transform .15s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--teal2)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--soft);color:var(--teal);border-radius:999px;padding:3px 10px}
.date{color:var(--muted);font-size:13px;margin-left:6px}
.ttl{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:22px;line-height:1.25;margin:8px 0 6px}
.muted{color:var(--muted);font-size:14px}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.pill:hover{border-color:var(--teal2)}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn{background:var(--accent);color:#2a1a05;border:0;border-radius:14px;padding:12px 20px;min-height:46px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px -10px var(--accent2)}
.btn:hover{filter:brightness(1.04)}
select{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font:inherit;color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:12px 0;box-shadow:var(--sh)}
.story{font-size:18px;line-height:1.9}
.tk{cursor:pointer;border-bottom:2px dotted var(--teal2);border-radius:4px}
.tk:hover,.tk.sel{background:var(--soft);color:var(--teal);border-bottom-color:transparent}
.tip{min-height:44px;margin-top:14px;background:var(--soft);border-radius:14px;padding:10px 14px;font-size:15px}
.tip b{color:var(--teal)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.qn{font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;margin:8px 0;padding:13px 14px;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font-size:15px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--teal2);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:#e7f6ef}
.opt.bad{border-color:var(--bad);background:#fbeaea}
.src{color:var(--teal);font-weight:600}
.empty{text-align:center;padding:34px 18px}
@media(max-width:480px){.hero{padding:22px 20px}.story{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="brand" href="/">⚔️ Kelime Arenası</a>
<nav><a href="/">Ana sayfa</a><a class="cur" href="/haber.html">📰 Haber</a></nav>
</header>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV={1:'Seviye 1',2:'Seviye 2',3:'Seviye 3'};
let DATA=[],CUR=null,LEVEL='1',QS=null,LAST=null;
const DONE=()=>{try{return JSON.parse(localStorage.getItem('ka_hn_done')||'{}')}catch(e){return {}}};
const saveDone=d=>localStorage.setItem('ka_hn_done',JSON.stringify(d));
function say(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||1;speechSynthesis.speak(u)}catch(e){}}

async function load(){
  try{
    const r=await fetch('/data/news.json',{cache:'no-store'});
    if(!r.ok)throw new Error('yok');
    DATA=(await r.json()).items||[];
  }catch(e){DATA=[]}
  route();
}
function route(){
  const id=location.hash.slice(1);
  CUR=DATA.find(x=>x.id===id)||null;
  if(!CUR){LAST=null;return list()}
  if(id!==LAST){LEVEL='1';LAST=id}
  reader();
}
function list(){
  const done=DONE();
  const hero=`<section class="hero"><p class="eyebrow">Günlük haber · Üç seviye</p><h1>Haberi oku, dinle, quiz çöz.</h1><p>Her gün güncel haberler eklenir. Her haber üç İngilizce seviyesinde yazılır ve her seviyenin kendi quizi vardır.</p></section>`;
  const body=DATA.length
    ? `<h2>Son haberler</h2>`+DATA.map(x=>`<a class="card" href="#${esc(x.id)}"><span class="tag">${esc(x.category)}</span><span class="date">${esc(x.date)}</span><div class="ttl">${esc(x.title)}</div><div class="muted">${[1,2,3].map(l=>LV[l]+(done[x.id+'-'+l]!=null?' ✓ %'+done[x.id+'-'+l]:'')).join(' · ')}</div></a>`).join('')
    : `<div class="box empty"><p class="muted">Henüz haber yok. Haberler her sabah otomatik eklenir.</p></div>`;
  $('#main').innerHTML=hero+body;
}
function reader(){
  const lv=CUR.levels[LEVEL]||CUR.levels['1'];
  const done=DONE();
  const tabs=[1,2,3].map(l=>`<button class="pill ${String(l)===LEVEL?'on':''}" data-lv="${l}">${LV[l]}${done[CUR.id+'-'+l]!=null?' ✓ %'+done[CUR.id+'-'+l]:''}</button>`).join('');
  const story=String(lv.text).split(/([A-Za-z][A-Za-z'-]*)/).map((t,i)=>i%2?`<span class="tk" data-w="${t}">${t}</span>`:esc(t)).join('');
  $('#main').innerHTML=`<a class="pill" href="#">← Haberler</a>
  <div class="row" style="margin-top:14px"><span class="tag">${esc(CUR.category)}</span><span class="date">${esc(CUR.date)}</span></div>
  <h2 class="ttl" style="font-size:28px">${esc(CUR.title)}</h2>
  <div class="row">${tabs}</div>
  <div class="box">
    <div class="row" style="margin-top:0"><button class="btn" id="play">🔊 Dinle</button><select id="spd"><option value="0.8">Yavaş</option><option value="1" selected>Normal</option><option value="1.15">Hızlı</option></select><button class="pill" id="stop">■ Durdur</button></div>
    <div class="story">${story}</div>
    <div class="tip" id="tip"><span class="muted">Bir kelimeye dokunun, Türkçe anlamı çıksın.</span></div>
  </div>
  <div class="row"><button class="btn" id="quiz">Quiz'e geç →</button></div>
  <p class="muted">Kaynak: <a class="src" href="${esc(CUR.src)}" target="_blank" rel="noopener">${esc(CUR.source)}</a> · Metin bu haberden yapay zekâyla sadeleştirilmiştir.</p>`;
}
function quiz(){
  const qs=CUR.levels[LEVEL].quiz;
  QS={ans:Array(qs.length).fill(null)};
  $('#main').innerHTML=`<button class="pill" data-back="1">← Metne dön</button>
  <h2 style="margin-top:14px">${LV[LEVEL]} · Quiz</h2>
  ${qs.map((q,i)=>`<div class="box"><div class="qn">${i+1}. ${esc(q.q)}</div>${q.opts.map((o,k)=>`<button class="opt" data-q="${i}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`).join('')}
  <div id="res"></div>`;
}
function answer(i,k){
  const qs=CUR.levels[LEVEL].quiz;
  if(QS.ans[i]!==null)return;
  QS.ans[i]=k;
  document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{
    b.disabled=true;
    const kk=+b.dataset.k;
    if(kk===qs[i].ans)b.classList.add('ok');
    else if(kk===k)b.classList.add('bad');
  });
  if(QS.ans.every(v=>v!==null)){
    const total=qs.length,right=QS.ans.filter((v,j)=>v===qs[j].ans).length,pct=Math.round(right/total*100);
    const d=DONE();d[CUR.id+'-'+LEVEL]=pct;saveDone(d);
    $('#res').innerHTML=`<div class="box" style="text-align:center"><div class="ttl" style="margin:0">%${pct}</div><div class="bar"><i style="width:${pct}%"></i></div><p class="muted">${right} / ${total} doğru</p><button class="btn" data-back="1">Metne dön</button></div>`;
  }
}
async function tapWord(w,el){
  document.querySelectorAll('.tk.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  const tip=$('#tip'),key='ka_hw_'+w.toLowerCase();
  say(w);
  const cached=localStorage.getItem(key);
  if(cached){tip.innerHTML=`<b>${esc(w)}</b> — ${esc(cached)}`;return}
  tip.innerHTML=`<b>${esc(w)}</b> — <span class="muted">anlam aranıyor…</span>`;
  const sentence=CUR.levels[LEVEL].text.split(/(?<=[.!?])\s+/).find(s=>new RegExp('\\b'+w+'\\b','i').test(s))||'';
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:`Translate the English word "${w}" into Turkish. It appears in this sentence: "${sentence}". Give the most fitting meaning in 1-3 Turkish words. Return ONLY JSON: {"tr":"..."}`,tier:'quick'})});
    const d=await r.json();
    const m=String(d.text||'').match(/\{[\s\S]*\}/);
    const v=m?String(JSON.parse(m[0]).tr||'').trim():'';
    if(v){localStorage.setItem(key,v);tip.innerHTML=`<b>${esc(w)}</b> — ${esc(v)}`}
    else tip.innerHTML=`<b>${esc(w)}</b> — <span class="muted">anlam bulunamadı</span>`;
  }catch(e){tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--bad)">bağlantı hatası</span>`}
}
document.addEventListener('click',e=>{
  const t=e.target;
  const lv=t.closest('[data-lv]');if(lv){LEVEL=lv.dataset.lv;reader();return}
  if(t.closest('#quiz')){quiz();return}
  if(t.closest('[data-back]')){reader();return}
  const o=t.closest('[data-q]');if(o){answer(+o.dataset.q,+o.dataset.k);return}
  if(t.closest('#play')){say(CUR.levels[LEVEL].text,+$('#spd').value);return}
  if(t.closest('#stop')){speechSynthesis.cancel();return}
  const w=t.closest('.tk');if(w){tapWord(w.dataset.w,w);return}
});
window.addEventListener('hashchange',route);
load();
</script>
</body>
</html>
