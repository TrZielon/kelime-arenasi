<!DOCTYPE html>
<html lang="tr" data-theme="arena">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haber · Kelime Arenası</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
:root{--bg:#0d0920;--p:#171130;--p2:#1f1840;--ink:#f7f3ff;--m:#a79cd6;--a:#ffc857;--a2:#ff9f43;--ok:#34d399;--bad:#ff5d73;--b:#2a2352;--r:18px;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1000px 500px at 50% -10%,var(--p2),transparent 60%),var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif}
button,select{font:inherit;color:inherit}
#app{max-width:700px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.brand{font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.pill{background:var(--p);border:1.5px solid var(--b);border-radius:999px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.pill:hover{border-color:var(--m)}
.on{border-color:var(--a)!important;color:var(--a)}
.card{display:block;background:var(--p);border:1px solid var(--b);border-top:3px solid var(--a);border-radius:var(--r);padding:16px;margin:12px 0;text-decoration:none;color:inherit}
.card:hover{border-color:var(--a)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--b);border-radius:999px;padding:2px 10px;color:var(--m)}
.m{color:var(--m);font-size:14px}
.title{font-size:22px;font-weight:800;margin:6px 0;line-height:1.3}
.box{background:var(--p);border:1px solid var(--b);border-top:3px solid var(--a);border-radius:var(--r);padding:18px;margin:12px 0}
.story{font-size:18px;line-height:1.9}
.tk{cursor:pointer;border-bottom:2px dotted var(--m);border-radius:4px}
.tk:hover,.tk.sel{background:var(--b);color:var(--a);border-bottom-color:transparent}
.tipbox{min-height:44px;margin-top:12px;background:var(--p2);border-radius:12px;padding:10px 12px;font-size:15px}
.tipbox b{color:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn{background:linear-gradient(135deg,var(--a),var(--a2));color:#1a1020;border:0;border-radius:14px;padding:12px 20px;min-height:46px;font-weight:800;cursor:pointer}
.opt{display:block;width:100%;margin:8px 0;padding:12px 14px;min-height:48px;border-radius:14px;border:1.5px solid var(--b);background:var(--p);color:var(--ink);text-align:left;cursor:pointer;font-size:15px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--m)}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}
select{background:var(--p);border:1.5px solid var(--b);border-radius:999px;padding:6px 12px}
a.src{color:var(--a)}
</style>
</head>
<body>
<div id="app">
<header><a class="brand" href="/">⚔️ Kelime Arenası</a><a class="pill" href="/">← Oyuna dön</a></header>
<main id="main"><p class="m">Haberler yükleniyor…</p></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV={1:'Seviye 1',2:'Seviye 2',3:'Seviye 3'};
let DATA=[],CUR=null,LEVEL='1',QS=null,LAST=null;
const DONE=()=>{try{return JSON.parse(localStorage.getItem('ka_hn_done')||'{}')}catch(e){return {}}};
const saveDone=d=>localStorage.setItem('ka_hn_done',JSON.stringify(d));
function say(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||1;speechSynthesis.speak(u)}catch(e){}}

async function load(){
  try{
    const r=await fetch('/data/news.json',{cache:'no-store'});
    if(!r.ok) throw new Error('yok');
    DATA=(await r.json()).items||[];
  }catch(e){DATA=[]}
  route();
}
function route(){
  const id=location.hash.slice(1);
  CUR=DATA.find(x=>x.id===id)||null;
  if(!CUR){LAST=null;return list()}
  if(id!==LAST){LEVEL='1';LAST=id}
  reader();
}
function list(){
  if(!DATA.length){$('#main').innerHTML='<div class="box"><p class="m">Henüz haber yok. Güncelleme her gün sabah otomatik çalışır. Haberler birkaç dakika içinde görünür.</p></div>';return}
  const done=DONE();
  $('#main').innerHTML=DATA.map(x=>`<a class="card" href="#${esc(x.id)}"><span class="tag">${esc(x.category)}</span> <span class="m">${esc(x.date)}</span><div class="title">${esc(x.title)}</div><div class="m">${[1,2,3].map(l=>LV[l]+(done[x.id+'-'+l]!=null?' ✓ %'+done[x.id+'-'+l]:'')).join(' · ')}</div></a>`).join('');
}
function reader(){
  const it=CUR.levels[LEVEL]||CUR.levels['1'];
  const done=DONE();
  const tabs=[1,2,3].map(l=>`<button class="pill ${String(l)===LEVEL?'on':''}" data-lv="${l}">${LV[l]}${done[CUR.id+'-'+l]!=null?' ✓ %'+done[CUR.id+'-'+l]:''}</button>`).join('');
  const story=esc(it.text).replace(/[A-Za-z][A-Za-z'-]*/g,w=>`<span class="tk" data-w="${w}">${w}</span>`);
  $('#main').innerHTML=`<a class="pill" href="#" style="margin-bottom:8px">← Haberler</a>
  <div class="row"><span class="tag">${esc(CUR.category)}</span><span class="m">${esc(CUR.date)}</span></div>
  <div class="title">${esc(CUR.title)}</div>
  <div class="row">${tabs}</div>
  <div class="box">
    <div class="row" style="margin-top:0"><button class="btn" id="play">🔊 Dinle</button><select id="spd"><option value="0.8">Yavaş</option><option value="1" selected>Normal</option><option value="1.15">Hızlı</option></select><button class="pill" id="stop">■ Durdur</button></div>
    <div class="story">${story}</div>
    <div class="tipbox" id="tip"><span class="m">Bir kelimeye dokunun: Türkçe anlamı çıkar.</span></div>
  </div>
  <div class="row"><button class="btn" id="quiz">Quiz'e geç →</button></div>
  <div class="m" style="margin-top:14px">Kaynak: <a class="src" href="${esc(CUR.src)}" target="_blank" rel="noopener">${esc(CUR.source)}</a> · Metin bu haberden yapay zekâyla sadeleştirilmiştir.</div>`;
}
function quiz(){
  const qs=CUR.levels[LEVEL].quiz;
  QS={ans:Array(qs.length).fill(null)};
  $('#main').innerHTML=`<a class="pill" href="#" data-back="1">← Metne dön</a>
  <div class="title" style="margin-top:12px">${LV[LEVEL]} · Quiz</div>
  ${qs.map((q,i)=>`<div class="box"><div style="font-weight:700;margin-bottom:6px">${i+1}. ${esc(q.q)}</div>${q.opts.map((o,k)=>`<button class="opt" data-q="${i}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`).join('')}
  <div id="res"></div>`;
}
function answer(i,k){
  const qs=CUR.levels[LEVEL].quiz;
  if(QS.ans[i]!==null) return;
  QS.ans[i]=k;
  document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{
    b.disabled=true;
    const kk=+b.dataset.k;
    if(kk===qs[i].ans)b.classList.add('ok');
    else if(kk===k)b.classList.add('bad');
  });
  if(QS.ans.every(v=>v!==null)){
    const total=qs.length,right=QS.ans.filter((v,j)=>v===qs[j].ans).length,pct=Math.round(right/total*100);
    const d=DONE();d[CUR.id+'-'+LEVEL]=pct;saveDone(d);
    $('#res').innerHTML=`<div class="box" style="text-align:center"><div class="bar"><i style="width:${pct}%"></i></div><div class="title">%${pct}</div><div class="m">${right} / ${total} doğru</div></div>`;
  }
}
async function tapWord(w,el){
  document.querySelectorAll('.tk.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  const tip=$('#tip'),key='ka_hw_'+w.toLowerCase();
  say(w);
  const cached=localStorage.getItem(key);
  if(cached){tip.innerHTML=`<b>${esc(w)}</b> — ${esc(cached)}`;return}
  tip.innerHTML=`<b>${esc(w)}</b> — <span class="m">anlam aranıyor…</span>`;
  const sentence=CUR.levels[LEVEL].text.split(/(?<=[.!?])\s+/).find(s=>new RegExp('\\b'+w+'\\b','i').test(s))||'';
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:`Translate the English word "${w}" into Turkish. It appears in this sentence: "${sentence}". Give the most fitting meaning in 1-3 Turkish words. Return ONLY JSON: {"tr":"..."}`,tier:'quick'})});
    const d=await r.json();
    const m=String(d.text||'').match(/\{[\s\S]*\}/);
    const v=m?String(JSON.parse(m[0]).tr||'').trim():'';
    if(v){localStorage.setItem(key,v);tip.innerHTML=`<b>${esc(w)}</b> — ${esc(v)}`}
    else tip.innerHTML=`<b>${esc(w)}</b> — <span class="m">anlam bulunamadı</span>`;
  }catch(e){tip.innerHTML=`<b>${esc(w)}</b> — <span class="bad2">bağlantı hatası</span>`}
}
document.addEventListener('click',e=>{
  const t=e.target;
  const lv=t.closest('[data-lv]');if(lv){LEVEL=lv.dataset.lv;reader();return}
  if(t.closest('#quiz')){quiz();return}
  if(t.closest('[data-back]')){e.preventDefault();reader();return}
  const o=t.closest('[data-q]');if(o){answer(+o.dataset.q,+o.dataset.k);return}
  if(t.closest('#play')){say(CUR.levels[LEVEL].text,+$('#spd').value);return}
  if(t.closest('#stop')){speechSynthesis.cancel();return}
  const w=t.closest('.tk');if(w){tapWord(w.dataset.w,w);return}
});
window.addEventListener('hashchange',route);
load();
</script>
</body>
</html>
