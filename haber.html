<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Günlük haberler: üç seviye, zengin editoryal fotoğraflar, sesli dinleme ve quiz.">
<title>Haber · Kelime Arenası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body[data-pal="akdeniz"],body[data-pal="gece"],body[data-pal="kitaplik"]{
  --bg:#f3f8f6;--card:#ffffff;--line:#d5e7e1;--ink:#0d2b2a;--mut:#56736f;
  --p:#0f766e;--p2:#14b8a6;--acc:#f59e0b;--bad:#e11d48;--soft:#e2f1ed;--ok:#059669;
  --shadow:0 12px 28px -18px rgba(13,43,42,.28);
}
body[data-pal="derin_akdeniz"]{
  --bg:#061514;--card:#0c2423;--line:#194240;--ink:#f3f8f6;--mut:#7ca39e;
  --p:#0f766e;--p2:#14b8a6;--acc:#fbbf24;--bad:#f43f5e;--soft:#11312f;--ok:#34d399;
  --shadow:0 14px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Plus Jakarta Sans",sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:20px}
.logo svg{width:38px;height:38px}
.logo-sub{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--acc);border:1px solid var(--line);margin-left:2px}
.navlinks{display:flex;gap:6px;margin-left:10px;flex-wrap:wrap;align-items:center}
.navlinks a{padding:8px 14px;border-radius:12px;font-weight:700;color:var(--mut);transition:all .15s}
.navlinks a:hover{color:var(--ink);background:var(--soft)}
.navlinks a.cur{color:#fff;background:var(--p)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:7px}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.dots button.on{box-shadow:0 0 0 2px var(--p)}
.sndbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;min-height:34px}
.page{max-width:1100px;margin:0 auto;padding:24px 18px 90px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 20px 40px -25px var(--p);margin-bottom:24px}
.hero h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(24px,3.8vw,36px);margin:6px 0 8px;line-height:1.15}
.hero p{margin:0;opacity:.94;max-width:620px;font-size:15px}
h2.sec{font-family:Fraunces,serif;font-size:22px;margin:14px 0 14px}

.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.ncard{
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;
}
.ncard:hover{transform:translateY(-4px);box-shadow:0 18px 36px -15px var(--p)}
.nthumb{position:relative;width:100%;height:190px;overflow:hidden;background:var(--soft)}
.nthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.ncard:hover .nthumb img{transform:scale(1.05)}
.nbadge{position:absolute;top:12px;left:12px;background:rgba(15,23,42,.85);color:#fff;backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}
.ndate{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.65);color:#fff;backdrop-filter:blur(6px);padding:3px 8px;border-radius:6px;font-size:11px}
.nbody{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.nttl{font-family:Fraunces,serif;font-size:18px;line-height:1.35;margin:0 0 10px;font-weight:800;color:var(--ink)}
.nfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}
.nlv{display:flex;gap:6px;font-weight:700}
.ncta{color:var(--p);font-weight:800}

.ncard.featured{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr}
.ncard.featured .nthumb{height:100%;min-height:260px}
@media(max-width:768px){
  .ncard.featured{grid-template-columns:1fr}
  .ncard.featured .nthumb{height:200px}
}

.reader-box{background:var(--card);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.reader-hero{position:relative;width:100%;height:320px;background:var(--soft);overflow:hidden}
.reader-hero img{width:100%;height:100%;object-fit:cover;display:block}
.reader-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,43,42,.92) 0%,rgba(13,43,42,.4) 60%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px 28px;color:#fff}
.reader-hero-overlay h1{font-family:Fraunces,serif;font-size:clamp(22px,3.2vw,34px);margin:4px 0 0;line-height:1.2}
.reader-body{padding:24px 28px}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.pill.back{color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);align-self:flex-start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.story{font-size:18px;line-height:1.8;color:var(--ink);margin:18px 0}
.tk{cursor:pointer;border-radius:4px;padding:1px 2px}
.tk:hover{background:var(--soft);color:var(--p)}
.tk.sel{background:var(--acc);color:#fff}
.box{background:var(--soft);border-radius:18px;padding:18px;margin:16px 0;border:1px solid var(--line)}
.btn3{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px}
.tip{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.qn{font-weight:800;font-size:16px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.opt:hover{border-color:var(--p);background:var(--soft)}
.opt.ok{border-color:var(--ok)!important;background:#d1fae5!important;color:var(--ok)!important}
.opt.bad{border-color:var(--bad)!important;background:#ffe4e6!important;color:var(--bad)!important}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
</style>
</head>

<main class="page" id="main"></main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV={1:'Seviye 1',2:'Seviye 2',3:'Seviye 3'};
let DATA=[],CUR=null,LEVEL='1',QS=null,LAST=null,MUTED=localStorage.getItem('ka_mute')==='1';
const DONE=()=>{try{return JSON.parse(localStorage.getItem('ka_hn_done')||'{}')}catch(e){return {}}};
const saveDone=d=>localStorage.setItem('ka_hn_done',JSON.stringify(d));

const PHOTO_POOLS = {
  ai_tech: [
    "https://images.unsplash.com/photo-1677442136019-21780efad99a?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=1200&q=80"
  ],
  space: [
    "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1517976487584-8840be6d2c49?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80"
  ],
  ocean: [
    "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
  ],
  climate: [
    "https://images.unsplash.com/photo-1466611653911-95081537e5b7?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1509391365360-2e959784a276?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80"
  ],
  health: [
    "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1530497610245-94d3c16cda28?auto=format&fit=crop&w=1200&q=80"
  ],
  economy: [
    "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80"
  ],
  culture: [
    "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&w=1200&q=80"
  ],
  sport: [
    "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1200&q=80"
  ],
  diplomacy: [
    "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1200&q=80"
  ],
  education: [
    "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1200&q=80"
  ],
  world: [
    "https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1477959858617-67f30bc75b82?auto=format&fit=crop&w=1200&q=80"
  ]
};

const CATEGORY_RULES = [
  { cat: 'ocean', pattern: /\b(?:coral|ocean|sea|marine|reef|whale|shark|fish|okyanus|deniz|mercan|balık|balina|kıyı|sahil)\b/i },
  { cat: 'space', pattern: /\b(?:space|astronomy|telescope|webb|nasa|spacex|rocket|satellite|galaxy|star|planet|mars|moon|uzay|astronomi|teleskop|roket|uydu|galaksi|yıldız|gezegen)\b/i },
  { cat: 'ai_tech', pattern: /\b(?:ai|artificial intelligence|robot|chip|semiconductor|software|algorithm|cyber|chatgpt|openai|google|apple|nvidia|tech|technology|yapay zeka|çip|yazılım|algoritma|siber|teknoloji)\b/i },
  { cat: 'climate', pattern: /\b(?:climate|global warming|emission|carbon|renewable|solar|wind turbine|glacier|forest|wildfire|temperature|environment|iklim|küresel ısınma|emisyon|karbon|yenilenebilir|güneş|buzul|orman|yangın|çevre)\b/i },
  { cat: 'health', pattern: /\b(?:health|medical|medicine|doctor|hospital|patient|virus|vaccine|cancer|disease|dna|gene|brain|therapy|sağlık|tıp|doktor|hastane|hasta|virüs|aşı|kanser|hastalık|ilaç)\b/i },
  { cat: 'economy', pattern: /\b(?:economy|market|stock|inflation|dollar|euro|bank|finance|trade|export|import|plunge|rally|earnings|investor|ekonomi|piyasa|borsa|hisse|enflasyon|banka|finans|ticaret|yatırım)\b/i },
  { cat: 'culture', pattern: /\b(?:art|artist|museum|history|ancient|archaeology|theatre|music|opera|novel|books|colosseum|sanat|müze|tarih|antik|arkeoloji|tiyatro|müzik|kitap|kültür)\b/i },
  { cat: 'sport', pattern: /\b(?:sport|football|soccer|champions|cup|tournament|match|olympic|tennis|basketball|stadium|spor|futbol|şampiyon|kupa|turnuva|maç|lig|olimpiyat|stadyum)\b/i },
  { cat: 'diplomacy', pattern: /\b(?:diplomacy|summit|treaty|president|minister|parliament|election|midterm|government|nato|diplomasi|zirve|anlaşma|başkan|meclis|seçim|hükümet)\b/i },
  { cat: 'education', pattern: /\b(?:education|university|college|school|student|teacher|academic|exam|eğitim|üniversite|okul|öğrenci|öğretmen|akademik|sınav)\b/i }
];

function resolveNewsImage(item) {
  if (item && item.image && typeof item.image === 'string' && item.image.startsWith("http")) return item.image;
  const text = (String(item?.title || '') + ' ' + String(item?.category || '')).toLowerCase();
  let matchedCat = 'world';
  for (const rule of CATEGORY_RULES) {
    if (rule.pattern.test(text)) { matchedCat = rule.cat; break; }
  }
  const pool = PHOTO_POOLS[matchedCat] || PHOTO_POOLS.world;
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) & 0xffffffff;
  return pool[Math.abs(hash) % pool.length];
}

function getNewsArt(item, idx, isHero){
  const imgSrc = resolveNewsImage(item);
  const fallbackUrl = "https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80";
  return `<img src="${esc(imgSrc)}" alt="${esc(item?.title||'Haber')}" loading="${isHero?'eager':'lazy'}" onerror="this.onerror=null;this.src='${fallbackUrl}'">`;
}

let VOICE=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices()||[];
    VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Zira|David/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||null;
  }catch(e){VOICE=null}
}
try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
pickVoice();
function say(t,rate){
  if(MUTED)return;
  try{
    pickVoice();speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||1;speechSynthesis.speak(u);
  }catch(e){}
}

function setPal(n){
  const t = (n==='derin_akdeniz')?'derin_akdeniz':'akdeniz';
  document.body.dataset.pal=t;
  document.querySelectorAll('.dots button').forEach(b=>b.classList.toggle('on',b.dataset.pal===t));
  try{localStorage.setItem('ka_pal',t)}catch(e){}
}
function setMute(){
  const s=$('#snd');if(s)s.textContent=MUTED?'🔇':'🔊';
  if(MUTED){try{speechSynthesis.cancel()}catch(e){}}
}
setPal(localStorage.getItem('ka_pal')||'akdeniz');
setMute();

const DEFAULT_NEWS = [
  {
    id: "jwst-ancient-galaxy",
    title: "James Webb Telescope Discovers One of the Most Distant Spiral Galaxies",
    category: "Space",
    date: "Bugün",
    source: "NASA / Space Science",
    levels: {
      "1": {
        text: "Astronomers have found a very old spiral galaxy using the James Webb Space Telescope. It existed when the universe was only 600 million years old. Spiral galaxies like our Milky Way have swirling arms full of bright stars.",
        quiz: [{ q: "Which telescope found the galaxy?", opts: ["Hubble", "James Webb Space Telescope", "Kepler"], ans: 1 }]
      }
    }
  }
];

async function load(){
  try{
    const r=await fetch('/data/news.json',{cache:'no-store'});
    if(!r.ok)throw new Error('Dosya yok');
    const json=await r.json();
    DATA=json.items||(Array.isArray(json)?json:[]);
    if(!DATA.length) DATA=DEFAULT_NEWS;
  }catch(e){DATA=DEFAULT_NEWS;}
  route();
}

function route(){
  const id=location.hash.slice(1);
  CUR=DATA.find(x=>x.id===id)||null;
  if(!CUR){LAST=null;return list()}
  if(id!==LAST){LEVEL='1';LAST=id}
  reader();
}

function list(){
  const done=DONE();
  const hero=`<section class="hero"><div class="eyebrow">Günlük haber · Zengin Görsel & Üç seviye</div><h1>Dünyadan Haberler, Gerçek İngilizce.</h1><p>Editoryal fotoğraflı güncel haberleri oku, bilmediğin kelimelere tıkla, dinle ve quiz çözerek dil becerini pekiştir.</p></section>`;
  const body=DATA.length
    ? `<h2 class="sec">📰 Günün Haberleri</h2><div class="news-grid">`+DATA.map((x,i)=>`
      <a class="ncard ${i===0?'featured':''}" href="#${esc(x.id)}">
        <div class="nthumb">
          ${getNewsArt(x,i)}
          <span class="nbadge">${esc(x.category||'Dünya')}</span>
          <span class="ndate">${esc(x.date||'Güncel')}</span>
        </div>
        <div class="nbody">
          <h3 class="nttl">${esc(x.title)}</h3>
          <div class="nfoot">
            <span class="nlv">${[1,2,3].map(l=>LV[l]+(done[x.id+'-'+l]!=null?' ✓ %'+done[x.id+'-'+l]:'')).join(' · ')}</span>
            <span class="ncta">Haberi Oku →</span>
          </div>
        </div>
      </a>`).join('')+`</div>`
    : `<div class="box"><p style="color:var(--mut);margin:0">Haberler yükleniyor...</p></div>`;
  $('#main').innerHTML=hero+body;
}

function reader(){
  const lv=(CUR.levels&&CUR.levels[LEVEL])||(CUR.levels&&CUR.levels['1'])||{text:'',quiz:[]};
  const done=DONE();
  const tabs=[1,2,3].map(l=>`<button class="pill ${String(l)===LEVEL?'on':''}" data-lv="${l}">${LV[l]}${done[CUR.id+'-'+l]!=null?' ✓ %'+done[CUR.id+'-'+l]:''}</button>`).join('');
  const story=String(lv.text).split(/([A-Za-z][A-Za-z'-]*)/).map((t,i)=>i%2?`<span class="tk" data-w="${esc(t)}">${esc(t)}</span>`:esc(t)).join('');
  
  $('#main').innerHTML=`
  <div class="reader-box">
    <div class="reader-hero">
      ${getNewsArt(CUR,'hero',true)}
      <div class="reader-hero-overlay">
        <a class="pill back" href="#">← Haberlere Dön</a>
        <div class="row" style="margin:10px 0 2px">
          <span class="tag" style="background:rgba(255,255,255,.9);color:#0d2b2a;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700">${esc(CUR.category||'Dünya')}</span>
          <span style="font-size:13px;opacity:.9">${esc(CUR.date||'')}</span>
        </div>
        <h1>${esc(CUR.title)}</h1>
      </div>
    </div>
    <div class="reader-body">
      <div class="row">${tabs}</div>
      <div class="box">
        <div class="row" style="margin-top:0">
          <button class="btn3" id="play" style="padding:10px 18px">🔊 Dinle</button>
          <select id="spd" style="padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)"><option value="0.8">Yavaş</option><option value="1" selected>Normal</option><option value="1.15">Hızlı</option></select>
          <button class="pill" id="stop">■ Durdur</button>
        </div>
        <div class="story">${story}</div>
        <div class="tip" id="tip"><span style="color:var(--mut)">💡 Bir kelimeye dokunun, telaffuzunu dinleyin ve Türkçe karşılığını görün.</span></div>
      </div>
      <div class="row"><button class="btn3" id="quiz">Quiz'e geç →</button></div>
    </div>
  </div>`;
}

function quiz(){
  const lv=(CUR.levels&&CUR.levels[LEVEL])||{quiz:[]};
  const qs=lv.quiz||[];
  if(!qs.length){
    $('#main').innerHTML=`<div class="box"><button class="pill" data-back="1" style="margin-bottom:14px">← Metne dön</button><p>Bu seviye için henüz quiz hazırlanmamış.</p></div>`;
    return;
  }
  QS={ans:Array(qs.length).fill(null)};
  $('#main').innerHTML=`
  <div class="box">
    <button class="pill" data-back="1" style="margin-bottom:14px">← Metne dön</button>
    <h2 class="sec" style="margin-top:0">${LV[LEVEL]} · Quiz</h2>
    ${qs.map((q,i)=>`<div class="box" style="background:var(--card)"><div class="qn">${i+1}. ${esc(q.q)}</div>${q.opts.map((o,k)=>`<button class="opt" data-q="${i}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`).join('')}
    <div id="res"></div>
  </div>`;
}

function answer(i,k){
  const qs=CUR.levels[LEVEL].quiz;
  if(!qs||QS.ans[i]!==null)return;
  QS.ans[i]=k;
  document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{
    b.disabled=true;
    const kk=+b.dataset.k;
    if(kk===qs[i].ans)b.classList.add('ok');
    else if(kk===k)b.classList.add('bad');
  });
  if(QS.ans.every(v=>v!==null)){
    const total=qs.length,right=QS.ans.filter((v,j)=>v===qs[j].ans).length,pct=Math.round(right/total*100);
    const d=DONE();d[CUR.id+'-'+LEVEL]=pct;saveDone(d);
    $('#res').innerHTML=`<div class="box" style="text-align:center"><div style="font-family:Fraunces,serif;font-size:32px;font-weight:900">%${pct}</div><div class="bar"><i style="width:${pct}%"></i></div><p style="color:var(--mut);margin:8px 0 16px">${right} / ${total} doğru</p><button class="btn3" data-back="1">Metne dön</button></div>`;
  }
}

async function tapWord(w,el){
  document.querySelectorAll('.tk.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  const tip=$('#tip'),key='ka_hw_'+w.toLowerCase();
  say(w);
  const cached=localStorage.getItem(key);
  if(cached){tip.innerHTML=`<b>${esc(w)}</b> — ${esc(cached)}`;return}
  tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--mut)">anlam aranıyor…</span>`;
  const sentence=(CUR.levels[LEVEL]?.text||'').split(/(?<=[.!?])\s+/).find(s=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(s))||'';
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:`Translate the English word "${w}" into Turkish. It appears in this sentence: "${sentence}". Give the most fitting meaning in 1-3 Turkish words. Return ONLY JSON: {"tr":"..."}`,tier:'quick'})});
    const d=await r.json();
    const m=String(d.text||'').match(/\{[\s\S]*\}/);
    const v=m?String(JSON.parse(m[0]).tr||'').trim():'';
    if(v){localStorage.setItem(key,v);tip.innerHTML=`<b>${esc(w)}</b> — ${esc(v)}`}
    else tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--mut)">anlam bulunamadı</span>`;
  }catch(e){tip.innerHTML=`<b>${esc(w)}</b> — <span style="color:var(--bad)">bağlantı hatası</span>`}
}

document.addEventListener('click',e=>{
  const t=e.target;
  const pal=t.closest('.dots [data-pal]');if(pal){setPal(pal.dataset.pal);return}
  if(t.closest('#snd')){MUTED=!MUTED;localStorage.setItem('ka_mute',MUTED?'1':'0');setMute();return}
  const lv=t.closest('[data-lv]');if(lv){LEVEL=lv.dataset.lv;reader();return}
  if(t.closest('#quiz')){quiz();return}
  if(t.closest('[data-back]')){reader();return}
  const o=t.closest('[data-q]');if(o){answer(+o.dataset.q,+o.dataset.k);return}
  if(t.closest('#play')){say(CUR.levels[LEVEL].text,+$('#spd').value);return}
  if(t.closest('#stop')){speechSynthesis.cancel();return}
  const w=t.closest('.tk');if(w){tapWord(w.dataset.w,w);return}
});
window.addEventListener('hashchange',route);
load();
</script>
</body>
</html>
