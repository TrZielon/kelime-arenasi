<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oyun Salonu · Kelime Arenası</title>
<meta name="theme-color" content="#0f766e">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css?v=8">
<style>
.hub-h{padding:24px 26px;position:relative;overflow:hidden}
.hub-h h1{font-size:clamp(28px,4.4vw,42px);margin:6px 0}
.hub-h p{margin:0;color:var(--ink2);max-width:60ch}
.hub-h .arcs{position:absolute;right:-30px;top:-40px;width:240px;opacity:.12;color:var(--p);pointer-events:none}
.atl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.atl a{display:block;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:16px;padding:12px 14px;transition:transform .2s var(--spring)}.atl a:hover{transform:translateY(-3px)}.atl b{display:block;font-size:15px}.atl span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}@media (max-width:760px){.atl{grid-template-columns:1fr 1fr}}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.gcard{--g:var(--p);border-radius:24px;background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset,var(--sh1);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--spring),box-shadow .25s}
.gcard:hover{transform:translateY(-4px);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--g) 50%,var(--line)) inset,var(--sh2)}
.gart{height:150px;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 22%,var(--card)),color-mix(in srgb,var(--g) 6%,var(--card)));overflow:hidden}
.gart svg{position:absolute;inset:0;width:100%;height:100%}
.gart .pb{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--card);color:var(--ink2);box-shadow:var(--sh1)}
.gart .nw{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:var(--acc);color:#1f1300}
.gbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.gbody h3{margin:0;font-size:22px}
.gbody p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.gbody .skills{display:flex;gap:6px;flex-wrap:wrap}
.gbody .skills span{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.gbody .btn{margin-top:auto;align-self:flex-start}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stage{padding:18px 20px;position:relative;overflow:hidden}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud span{font-size:13px;font-weight:800;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.hud span b{color:var(--ink)}
.qcard{text-align:center;margin:8px 0 12px}
.qcard .ql{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.qcard .qw{font-family:Fraunces,serif;font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.15;margin-top:2px;animation:kaPop .3s var(--spring)}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gopts button{--d:var(--line2);border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15.5px;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.gopts button:active{transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.gopts button.ok{--d:color-mix(in srgb,var(--ok) 66%,#000);box-shadow:0 0 0 2px var(--ok) inset,0 4px 0 var(--d);background:var(--ok-soft)}
.gopts button.no{--d:color-mix(in srgb,var(--bad) 66%,#000);box-shadow:0 0 0 2px var(--bad) inset,0 4px 0 var(--d);background:var(--bad-soft);animation:kaShake .4s}
.diff{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.diff button{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--line2);min-width:110px}
.diff button small{display:block;font-weight:600;color:var(--mut);font-size:12px}
.diff button.on{box-shadow:0 0 0 2px var(--p) inset,0 4px 0 color-mix(in srgb,var(--p) 68%,#000);background:color-mix(in srgb,var(--p) 8%,var(--card))}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.howto div{background:var(--soft);border-radius:14px;padding:12px;font-size:13.5px;color:var(--ink2);line-height:1.45}
.howto b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.center{text-align:center}
.endc{display:grid;place-items:center;text-align:center;padding:26px 18px}
.endc .big{font-family:Fraunces,serif;font-weight:800;font-size:clamp(34px,6vw,52px);line-height:1;margin:8px 0;animation:kaStamp .6s var(--spring)}
.endc .mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.endc .mini span{background:var(--soft);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:800}
.review{width:100%;max-width:520px;text-align:left;margin:10px 0 14px}
.review div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);margin-top:6px;font-size:14.5px}
.review div b{font-family:Fraunces,serif}
/* HALAT */
.tug svg{width:100%;height:auto;display:block}
.tug .rope{transition:transform .45s var(--spring)}
.tug .me .body,.tug .me .arm{stroke:var(--p)}.tug .me .head{fill:var(--p)}
.tug .rv .body,.tug .rv .arm{stroke:var(--acc2)}.tug .rv .head{fill:var(--acc2)}
.tug .fig .body,.tug .fig .arm,.tug .fig .leg{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.tug .fig .leg{stroke:var(--ink2)}
.tug .fig{transition:transform .3s var(--spring)}
.tug .strain .fig.me{transform:rotate(-6deg)}
.charge{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.charge i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.chargel{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--mut)}
.combo{position:absolute;left:50%;top:40%;translate:-50% -50%;font-family:Fraunces,serif;font-weight:800;font-size:34px;color:var(--acc2);pointer-events:none;animation:comboUp 1s var(--out) forwards;white-space:nowrap;text-shadow:0 2px 0 var(--card)}
@keyframes comboUp{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-50px) scale(1)}}
/* MAKAS */
.rail svg{width:100%;height:auto;display:block}
.rail .trk{fill:none;stroke:var(--line2);stroke-width:9;stroke-linecap:round}
.rail .trk.on{stroke:var(--p)}
.rail .tie{stroke:var(--line);stroke-width:2}
.rail .st rect{fill:var(--card);stroke:var(--line2);stroke-width:2}
.rail .st text{font:800 15px "Plus Jakarta Sans",sans-serif;fill:var(--ink);text-anchor:middle}
.rail .st .ty{font-size:10px;fill:var(--mut);letter-spacing:.05em}
.rail .st.ok rect{fill:var(--ok-soft);stroke:var(--ok)}
.rail .st.no rect{fill:var(--bad-soft);stroke:var(--bad)}
.rail .train .car{fill:var(--p)}.rail .train .win{fill:var(--p-ink);opacity:.85}.rail .train .chim{fill:var(--acc)}
.rail .lever{cursor:pointer}
.rsent{font-family:Fraunces,serif;font-size:clamp(18px,2.8vw,23px);line-height:1.5;text-align:center;margin:6px 0 12px;min-height:3em}
.rsent .cn{display:inline-block;min-width:96px;border-bottom:3px solid var(--acc);color:var(--acc2);font-weight:800}
.rsent .cn.ok{color:var(--ok);border-color:var(--ok);animation:kaStamp .45s var(--spring)}
.rsent .cn.no{color:var(--bad);border-color:var(--bad)}
.tbar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:10px}
.tbar i{display:block;height:100%;background:var(--p);width:100%}
.rexp{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14.5px;line-height:1.5;animation:kaRise .4s var(--out)}
.ctypes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.ctypes span{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
/* KÖPRÜ */
.bridge{position:relative;height:170px;margin:6px 0 10px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 10%,var(--card)) 0%,var(--card) 55%)}
.bridge .river{position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--p) 35%,var(--card)) 0 26px,color-mix(in srgb,var(--p) 28%,var(--card)) 26px 52px);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:52px 0}}
.bridge .cliff{position:absolute;bottom:0;width:15%;height:96px;background:color-mix(in srgb,var(--ink2) 70%,var(--card));border-radius:0 14px 0 0}
.bridge .cliff.r{right:0;border-radius:14px 0 0 0}
.bridge .cliff::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:var(--ok);border-radius:inherit;opacity:.8}
.planks{position:absolute;left:15%;right:15%;bottom:84px;display:flex;gap:3px;align-items:flex-end}
.plank{flex:1;min-width:0;height:30px;border-radius:5px;border:2px dashed var(--line2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);text-align:center;line-height:1.05;padding:0 2px;overflow:hidden}
.plank.laid{border:0;background:color-mix(in srgb,var(--acc) 55%,#8a5a00);color:#2b1700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);animation:lay .35s var(--spring)}
@keyframes lay{0%{transform:translateY(-40px) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.fall{position:absolute;width:60px;height:24px;border-radius:5px;background:var(--bad);opacity:.85;animation:fallDown .9s ease-in forwards;z-index:3}
@keyframes fallDown{to{transform:translateY(120px) rotate(70deg);opacity:0}}
.walker{position:absolute;left:4%;bottom:96px;width:30px;height:46px;transition:left 1.8s linear;z-index:2}
.walker svg{width:100%;height:100%}
.walker.go svg{animation:bob .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.chunks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.chunks button{--d:var(--line2);border:0;border-radius:12px;padding:10px 13px;font-weight:800;font-size:15px;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);animation:kaPop .3s var(--spring) backwards}
.chunks button:active{transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.chunks button.no{background:var(--bad-soft);animation:kaShake .4s}
.hearts{display:inline-flex;gap:3px;vertical-align:-3px}
.hearts svg{width:17px;height:17px;color:var(--bad)}.hearts svg.off{color:var(--line2)}
.trn{font-size:14.5px;color:var(--ink2);text-align:center;margin-top:10px;animation:kaRise .4s var(--out)}
.trn b{display:block;font-family:Fraunces,serif;color:var(--ink);font-size:17px;margin-bottom:2px}
@media (max-width:760px){.games{grid-template-columns:1fr}.howto{grid-template-columns:1fr}.gart{height:128px}}
@media (max-width:520px){.hub-h{padding:18px}.stage{padding:14px}.gopts{grid-template-columns:1fr 1fr}.gopts button{padding:12px 8px;font-size:14.5px}.plank{font-size:10px;height:34px}.bridge{height:160px}}
</style>

<script>
(function(){
'use strict';
const {$,esc}=KA,ic=KA.ic;
const sh=a=>a.slice().sort(()=>Math.random()-.5);
const best=(k,v)=>{let o={};try{o=JSON.parse(localStorage.getItem('ka_gbest')||'{}')}catch(e){}if(v!=null&&(o[k]==null||v>o[k])){o[k]=v;try{localStorage.setItem('ka_gbest',JSON.stringify(o))}catch(e){}return true}return v==null?o[k]:false};
const heart='<path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.2 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.6 0 5.8 3.5 4.3 7.2C19.5 16.4 12 21 12 21z"/>';
const conf=el=>{if(!el||!KA.confetti)return;const r=el.getBoundingClientRect();KA.confetti(r.left+r.width/2,r.top+r.height/3,30,Math.PI)};
/* ---------- veri ---------- */
const DEFW=[['significant','önemli','important'],['evidence','kanıt','proof'],['decline','düşüş','decrease'],['crucial','kritik','vital'],['assume','varsaymak','suppose'],['retain','korumak, tutmak','keep'],['enhance','geliştirmek','improve'],['scarce','kıt','rare'],['reluctant','isteksiz','unwilling'],['undermine','baltalamak','weaken'],['prevalent','yaygın','widespread'],['acquire','edinmek','obtain'],['sufficient','yeterli','enough'],['beneficial','faydalı','helpful'],['consequence','sonuç','result'],['thorough','kapsamlı','complete'],['hypothesis','hipotez','theory'],['determine','belirlemek','decide'],['wealthy','varlıklı','rich'],['achieve','başarmak','accomplish'],['approach','yaklaşım','method'],['obvious','apaçık','clear'],['constant','sürekli','continuous'],['rapid','hızlı','fast']];
let W=DEFW;try{const p=KA.getPack(KA.activeId());const it=((p&&p.items)||[]).filter(x=>x.en&&x.tr);if(it.length>=8)W=it.map(x=>[x.en,x.tr,(Array.isArray(x.syn)&&x.syn[0])||''])}catch(e){}
const hasSyn=()=>W.filter(x=>x[2]).length>=4;
/* ---------- HUB ---------- */
const ART={
fetih:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice"><path d="M60 150V80a90 90 0 0 1 180 0v70" fill="none" stroke="var(--p)" stroke-width="14" opacity=".35"/><path d="M95 150V90a55 55 0 0 1 110 0v60" fill="var(--p)" opacity=".18"/><g stroke="var(--acc2)" stroke-width="8" stroke-linecap="round"><path d="M118 58l64 64M182 58l-64 64"/></g><circle cx="150" cy="90" r="12" fill="var(--acc)"/></svg>`,
halat:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice"><path d="M0 128h300" stroke="var(--line2)" stroke-width="3"/><path d="M40 86 Q150 96 260 86" fill="none" stroke="#a16207" stroke-width="6" stroke-linecap="round"/><path d="M150 112v-50" stroke="var(--bad)" stroke-width="3" stroke-dasharray="5 5"/><circle cx="150" cy="91" r="7" fill="var(--bad)"/><g stroke="var(--p)" stroke-width="8" stroke-linecap="round" fill="none"><path d="M52 64l12 30M64 94l-14 30M64 94l12 30M58 76l20 12"/></g><circle cx="48" cy="52" r="12" fill="var(--p)"/><g stroke="var(--acc2)" stroke-width="8" stroke-linecap="round" fill="none"><path d="M248 64l-12 30M236 94l14 30M236 94l-12 30M242 76l-20 12"/></g><circle cx="252" cy="52" r="12" fill="var(--acc2)"/></svg>`,
makas:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid meet"><g fill="none" stroke="var(--p)" stroke-width="7" stroke-linecap="round" opacity=".55"><path d="M0 80h110c50 0 60-50 110-50h80"/><path d="M110 80h190"/><path d="M110 80c50 0 60 45 110 45h80"/></g><rect x="40" y="62" width="58" height="30" rx="8" fill="var(--p)"/><rect x="50" y="68" width="14" height="10" rx="3" fill="var(--p-ink)"/><rect x="70" y="68" width="14" height="10" rx="3" fill="var(--p-ink)"/><rect x="84" y="52" width="10" height="12" rx="3" fill="var(--acc)"/><rect x="226" y="16" width="70" height="26" rx="8" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><text x="261" y="34" font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)" font-family="Plus Jakarta Sans">However</text><rect x="226" y="66" width="70" height="26" rx="8" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2"/><text x="261" y="84" font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)" font-family="Plus Jakarta Sans">Therefore</text><rect x="226" y="112" width="70" height="26" rx="8" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><text x="261" y="130" font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)" font-family="Plus Jakarta Sans">Moreover</text></svg>`,
dava:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice"><rect width="300" height="150" fill="#b7834a" opacity=".35"/><rect x="30" y="22" width="84" height="104" rx="3" fill="#fbf7ee" transform="rotate(-5 72 74)"/><g stroke="#2a2418" stroke-width="3" opacity=".35" transform="rotate(-5 72 74)"><path d="M42 46h58M42 60h50M42 74h58M42 88h40"/></g><rect x="190" y="30" width="74" height="90" rx="3" fill="#fbf7ee" transform="rotate(4 227 75)"/><circle cx="227" cy="66" r="18" fill="#7c3aed" opacity=".8"/><path d="M72 30 L227 40 L150 120 Z" fill="none" stroke="#e11d48" stroke-width="2.5"/><circle cx="72" cy="30" r="6" fill="#e11d48"/><circle cx="227" cy="40" r="6" fill="#e11d48"/><circle cx="150" cy="120" r="6" fill="#e11d48"/><rect x="118" y="92" width="64" height="40" rx="3" fill="#fff8c5" transform="rotate(-8 150 112)"/></svg>`,
kopru:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice"><rect x="0" y="118" width="300" height="32" fill="var(--p)" opacity=".3"/><rect x="0" y="80" width="56" height="70" rx="8" fill="var(--ink2)" opacity=".7"/><rect x="244" y="80" width="56" height="70" rx="8" fill="var(--ink2)" opacity=".7"/><g fill="#c2840a"><rect x="60" y="78" width="40" height="14" rx="3"/><rect x="104" y="78" width="40" height="14" rx="3"/><rect x="148" y="78" width="40" height="14" rx="3"/></g><rect x="194" y="58" width="40" height="14" rx="3" fill="#c2840a" transform="rotate(-14 214 65)"/><circle cx="30" cy="54" r="9" fill="var(--p)"/><path d="M30 63v14M30 77l-6 10M30 77l6 10M24 69h12" stroke="var(--p)" stroke-width="5" stroke-linecap="round"/></svg>`
};
const GAMES=[
 ['dava','Kayıp Harita Davası','Bir müzeden harita çalındı. İngilizce belgeleri oku, ifadelerdeki çelişkileri yakala, suçluyu kanıtlarıyla göster. 20–25 dakikalık hikâyeli dava.',['Reading','Çıkarım','Paraphrase'],'#b45309',1],
 ['fetih','Arena Fethi','Bölge bölge arenayı fethet. Kızışma, rövanş kelimeleri ve maç sonu talimiyle.',['Kelime','Strateji'],'var(--p)',0],
 ['halat','Halat Çekme','Gölge rakibe karşı hız düellosu. Her doğru cevap halatı sana çeker, rakip de boş durmaz.',['Kelime','Eş anlam','Hız'],'var(--acc2)',1],
 ['makas','Bağlaç Makası','Treni doğru istasyona gönder. Makası However, Therefore ya da Moreover\'a çevir; cümle o yöne akar.',['Bağlaçlar','Reading'],'var(--p)',1],
 ['kopru','Cümle Köprüsü','Parçaları doğru sırayla dizip köprüyü kur. Yanlış tahta nehre düşer.',['Cümle yapısı','Writing'],'#a16207',1]
];
let VIEW='hub';
function hub(){
  $('#view').innerHTML=`<section class="card hub-h"><svg class="arcs" viewBox="0 0 200 200"><path d="M20 200V100a80 80 0 0 1 160 0v100" fill="none" stroke="currentColor" stroke-width="18"/><path d="M60 200v-90a40 40 0 0 1 80 0v90" fill="none" stroke="currentColor" stroke-width="14"/></svg>
   <span class="eyebrow">Oyunlar</span><h1>Oyun Salonu</h1><p>Her oyun reading ve kelime becerilerinden birini çalıştırıyor. Kısa turlar, anında sonuç; hatalarını oyun sonunda tekrar listesi olarak alırsın.</p></section>

   <div class="bridge" id="br"><div class="river"></div><div class="cliff"></div><div class="cliff r"></div><div class="planks" id="pl">${s.c.map((t,j)=>`<div class="plank ${j<K.laid?'laid':''}">${j<K.laid?esc(t):''}</div>`).join('')}</div><div class="walker" id="wk">${walker}</div></div>
   <div class="chunks" id="ch">${done?'':K.pool.map((x,j)=>`<button data-kc="${j}" style="animation-delay:${j*.04}s">${esc(x.t)}</button>`).join('')}</div>
   ${done?`<div class="trn"><b>${esc(s.c.join(' '))}</b>${esc(s.tr)}<div style="margin-top:6px;font-size:13.5px;color:var(--mut)">${esc(s.n)}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn btn-p" id="knext">${K.i<KS.length-1?'Sıradaki köprü':'Sonuç'} ${ic('arrow')}</button></div></div>`:''}</section>`;
}
function kopruPick(j,btn){
  const s=KS[K.i],x=K.pool[j];
  if(x.i===K.laid){K.laid++;K.pool.splice(j,1);KA.sfx.ok();
    const pl=$('#pl').children[K.laid-1];pl.classList.add('laid');pl.textContent=x.t;btn.remove();
    [...$('#ch').children].forEach((b,k)=>b.dataset.kc=k);
    if(K.laid===s.c.length){K.score+=K.err?50:100;if(!K.err)K.clean++;const wk=$('#wk');wk.classList.add('go');wk.style.left='86%';setTimeout(()=>{drawKopru(true);const w2=$('#wk');w2.style.transition='none';w2.style.left='86%';conf($('#br'))},1900)}}
  else{K.lives--;K.err=true;KA.sfx.bad();btn.classList.remove('no');void btn.offsetWidth;btn.classList.add('no');if(!K.miss.includes(K.i))K.miss.push(K.i);
    const br=$('#br'),pl=$('#pl').children[K.laid],r=pl.getBoundingClientRect(),R=br.getBoundingClientRect();const f=document.createElement('div');f.className='fall';f.style.left=(r.left-R.left)+'px';f.style.top=(r.top-R.top)+'px';br.appendChild(f);setTimeout(()=>f.remove(),900);
    const h=document.querySelectorAll('.hearts svg');h[K.lives]&&h[K.lives].classList.add('off');
    if(K.lives<=0)setTimeout(kopruEnd,700)}
}
function kopruEnd(){
  const nb=best('kopru',K.score),win=K.lives>0;KA.addXp(Math.round(K.score/20),'oyun');
  $('#view').innerHTML=`<section class="card stage">${head()}<div class="endc"><span class="eyebrow">${win?'Bütün köprüler kuruldu':'Canların bitti'}</span><div class="big" id="bigs">${K.score}</div><div class="mini"><span>${K.clean} hatasız köprü</span><span>${K.lives} can kaldı</span>${nb?'<span>yeni rekor</span>':''}</div>
   ${K.miss.length?`<div class="review"><div style="border:0;background:none;padding:0 2px;font-weight:800;color:var(--mut);font-size:13px">ZORLANDIĞIN YAPILAR</div>${K.miss.map(i=>`<div><span><b>${esc(KS[i].c.join(' '))}</b><br><span class="mut" style="font-size:13px">${esc(KS[i].n)}</span></span></div>`).join('')}</div>`:''}
   <div class="row" style="gap:8px;justify-content:center"><button class="btn btn-ghost" data-go="hub">Salona dön</button><button class="btn btn-p" id="kstart">Tekrar ${ic('arrow')}</button></div></div></section>`;
  if(win)conf($('#bigs'));
}
/* ---------- yönlendirme ---------- */
function go(v){VIEW=v;cancelAnimationFrame(H.raf);cancelAnimationFrame(M.raf);H.over=true;
  if(v==='hub')hub();else if(v==='halat')halatIntro();else if(v==='makas')makasIntro();else if(v==='kopru')kopruIntro();
  else if(v==='fetih'||v==='dava'){location.href=v+'.html';return}
  window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let b;
  if(b=q('[data-go]')){go(b.dataset.go);return}
  if(b=q('[data-diff]')){H.diff=+b.dataset.diff;document.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('on',x===b));return}
  if(q('#hstart')){VIEW='halat';halatStart();return}
  if(b=q('[data-ho]')){halatPick(+b.dataset.ho,b);return}
  if(q('#mstart')){VIEW='makas';makasStart();return}
  if(b=q('[data-mo]')){if(VIEW==='makas'&&M.order&&M.pick==null&&$('#mtb'))makasPick(+b.dataset.mo);return}
  if(q('#mnext')){M.i++;M.i<M.order.length?makasRound():makasEnd();return}
  if(q('#kstart')){VIEW='kopru';kopruStart();return}
  if(b=q('[data-kc]')){kopruPick(+b.dataset.kc,b);return}
  if(q('#knext')){K.i++;K.i<KS.length?kopruRound():kopruEnd();return}
});
KA.nav('oyunlar.html');
hub();
})();
</script>
</body>
