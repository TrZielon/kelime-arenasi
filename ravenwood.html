<!DOCTYPE html>
<html lang="tr" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Impostor: Ravenwood Files · Kelime Arenası</title>
<meta name="description" content="Sahte kimlikle Ravenwood Enstitüsü'ne sız, kayıp ablanın izini akademik okumayla sür: yalan yakala, sözleşme tuzaklarını gör, kelime kartlarıyla söz düellosu yap.">
<meta name="theme-color" content="#0F241D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700;900&display=swap">
<link rel="stylesheet" href="ortak.css?v=22">
<style>
:root{--em:#0F241D;--em2:#173a2e;--navy:#11151C;--navy2:#1a2030;--parch:#F4EFE6;--parch2:#e8dfcd;--ink9:#1f1a12;--gold:#D4AF37;--gold2:#b8952a;--blood:#9B1B30;--mut9:#a8b3ab;--serif:Fraunces,Georgia,"Times New Roman",serif}
body.rwb{background:radial-gradient(120% 70% at 50% -10%,#173a2e 0%,#0F241D 38%,#11151C 100%) fixed;color:#e9e4d8}
body.rwb .ka-nav{background:rgba(17,21,28,.82);border-color:rgba(212,175,55,.18)}
.rw{max-width:1040px;margin:0 auto;padding:16px 16px 120px}
.rw h1,.rw h2,.rw h3{font-family:var(--serif);color:#f5ecd6;letter-spacing:-.01em}
.rw .mut{color:var(--mut9)}
.gold{color:var(--gold)}
.rbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font:800 15px "Plus Jakarta Sans",sans-serif;cursor:pointer;background:linear-gradient(180deg,#e2c25a,#c49a26);color:#1a1405;box-shadow:0 4px 0 #8a6a14,0 10px 24px rgba(0,0,0,.35);transition:transform .12s}
.rbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6a14}
.rbtn.ghost{background:rgba(255,255,255,.06);color:#efe6cf;box-shadow:inset 0 0 0 1.5px rgba(212,175,55,.45)}
.rbtn.red{background:linear-gradient(180deg,#b72a40,#8c1527);color:#fff;box-shadow:0 4px 0 #5e0e1a}
.rbtn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.rbtn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:linear-gradient(180deg,rgba(26,32,48,.92),rgba(17,21,28,.92));border:1px solid rgba(212,175,55,.22);border-radius:18px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.lbl{font:800 11px "Plus Jakarta Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
/* HUD */
.hud{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:40;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:16px;background:rgba(11,16,14,.88);backdrop-filter:blur(10px);border:1px solid rgba(212,175,55,.25);margin-bottom:14px}
.hud .r{display:flex;align-items:center;gap:6px;font:800 12.5px "Plus Jakarta Sans",sans-serif;color:#efe6cf;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.05)}
.hud .r i{font-style:normal}
.hud .bar{width:64px;height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.hud .bar b{display:block;height:100%;background:linear-gradient(90deg,#9B1B30,#e0b74a 45%,#4ade80);transition:width .5s}
.hud .r.low{background:rgba(155,27,48,.35);animation:pulse 1.2s infinite}
.hud .day{margin-left:auto;font-family:Cinzel,serif;color:var(--gold);letter-spacing:.06em}
.hud .dots{display:flex;gap:3px}.hud .dots u{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);text-decoration:none}.hud .dots u.on{background:#facc15;box-shadow:0 0 6px #facc15}
@keyframes pulse{50%{opacity:.6}}
/* başlık ekranı */
.title{position:relative;text-align:center;padding:46px 18px 30px;border-radius:24px;overflow:hidden;background:radial-gradient(90% 70% at 50% 0%,rgba(212,175,55,.15),transparent 60%),linear-gradient(180deg,#0F241D,#11151C);border:1px solid rgba(212,175,55,.3)}
.title .crest{width:84px;height:84px;margin:0 auto 10px}
.title h1{font-family:Cinzel,serif;font-size:clamp(28px,6vw,52px);line-height:1.05;margin:4px 0;color:#f3e3b3;text-shadow:0 2px 18px rgba(212,175,55,.35)}
.title .tg{font-family:var(--serif);font-style:italic;color:#cbbf9f;font-size:18px}
.note{max-width:560px;margin:22px auto 0;background:var(--parch);color:var(--ink9);font-family:var(--serif);font-size:17px;line-height:1.55;padding:18px 20px;border-radius:6px;rotate:-1deg;box-shadow:0 14px 30px rgba(0,0,0,.45);text-align:left;position:relative}
.note:before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:20px;margin-left:-40px;background:rgba(212,175,55,.55);rotate:3deg}
.note .sig{text-align:right;font-style:italic;margin-top:8px}
/* harita */
.dayban{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.part{border-radius:14px;padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);text-align:center;font-size:12.5px;color:var(--mut9)}
.part b{display:block;font:800 13.5px "Plus Jakarta Sans",sans-serif;color:#efe6cf;margin-top:3px}
.part.now{border-color:var(--gold);background:rgba(212,175,55,.12);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.part.done{opacity:.55}.part.done b:after{content:" ✓";color:#4ade80}
.campus{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.loc{position:relative;border-radius:16px;padding:14px 12px 12px;min-height:112px;background:linear-gradient(160deg,rgba(23,58,46,.9),rgba(17,21,28,.95));border:1px solid rgba(212,175,55,.2);cursor:pointer;text-align:left;color:#efe6cf;font:inherit}
.loc svg{width:30px;height:30px;color:var(--gold)}
.loc b{display:block;font-family:var(--serif);font-size:16px;margin-top:6px}
.loc small{display:block;color:var(--mut9);font-size:12px;margin-top:2px}
.loc.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.35),0 0 26px rgba(212,175,55,.18)}
.loc.today:after{content:"BUGÜN";position:absolute;top:10px;right:10px;font:900 10px "Plus Jakarta Sans";letter-spacing:.12em;color:#1a1405;background:var(--gold);padding:3px 7px;border-radius:999px}
.loc.lock{opacity:.45;cursor:not-allowed}.loc.lock:after{content:"🔒 Nüfuz " attr(data-need);position:absolute;top:10px;right:10px;font:800 10.5px "Plus Jakarta Sans";color:#efe6cf}
/* belge */
.doc{background:var(--parch);color:var(--ink9);border-radius:6px;padding:26px 24px 22px;font-family:var(--serif);font-size:17.5px;line-height:1.75;box-shadow:0 20px 40px rgba(0,0,0,.45),inset 0 0 60px rgba(120,90,40,.12);position:relative}
.doc .dh{font:800 11px "Plus Jakarta Sans";letter-spacing:.18em;color:#7a6a4a;text-align:center}
.doc h2{font-family:var(--serif);color:#2a1f10;text-align:center;font-size:23px;margin:6px 0 2px}
.doc .ds{text-align:center;font-style:italic;color:#7a6a4a;font-size:14px;margin-bottom:14px}
.doc p{margin:0 0 14px}
.sn{cursor:pointer;border-radius:4px;transition:background .15s;padding:1px 0}
.sn:hover{background:rgba(155,27,48,.08)}
.uv .sn:hover{background:rgba(124,58,237,.14);box-shadow:0 0 0 2px rgba(124,58,237,.12)}
.sn.glow1{background:rgba(124,58,237,.06)}.sn.glow2{background:rgba(124,58,237,.14)}.sn.glow3{background:rgba(124,58,237,.24);box-shadow:0 0 12px rgba(124,58,237,.35)}
.pglow{box-shadow:-4px 0 0 rgba(124,58,237,.45)}
.sn.hit{background:rgba(155,27,48,.16);text-decoration:line-through;text-decoration-color:rgba(155,27,48,.6)}
.sn.pair{background:rgba(212,175,55,.3)}
.sn.miss{animation:shake .35s}
.aw{border-bottom:2px dotted #8a6a14;font-weight:600;cursor:help}
.aw.known{border-bottom-style:solid;border-color:#15803d}
.stamp{position:absolute;pointer-events:none;font:900 34px Cinzel,serif;color:var(--blood);border:4px solid var(--blood);padding:2px 12px;border-radius:6px;rotate:-12deg;opacity:0;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) forwards;mix-blend-mode:multiply}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:.85}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake .35s}
.side{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.side>aside{position:sticky;top:130px}
.tip{border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:14.5px;line-height:1.5}
.tip.ok{border-color:rgba(74,222,128,.5);background:rgba(22,101,52,.25)}
.tip.no{border-color:rgba(248,113,113,.5);background:rgba(127,29,29,.25)}
.evc{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,#f7f0de,#ece0c2);color:var(--ink9);margin-top:8px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.evc i{font-style:normal;font-size:20px}.evc b{display:block;font-family:var(--serif);font-size:14.5px}.evc small{display:block;font-size:12px;color:#5b4c33}
/* sözleşme */
.cl{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 6px;border-radius:6px;cursor:default}
.cl b{font-family:Cinzel,serif;color:#7a6a4a}
.pick .cl{cursor:pointer}.pick .cl:hover{background:rgba(155,27,48,.1)}
.cl.trap{background:rgba(155,27,48,.16)}.cl.warn{background:rgba(212,175,55,.25)}
/* boşluk */
.gap{display:inline-block;min-width:118px;padding:0 8px;margin:0 2px;border-radius:5px;background:#1f1a12;color:#1f1a12;cursor:pointer;text-align:center;font:700 15px "Plus Jakarta Sans";line-height:1.7;vertical-align:baseline;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4)}
.gap.fill{background:#fff7dd;color:#2a1f10;box-shadow:inset 0 0 0 2px #b8952a}
.gap.sel{outline:3px solid #7c3aed}
.gap.ok{background:#dcfce7;color:#14532d;box-shadow:inset 0 0 0 2px #16a34a}
.gap.bad{animation:shake .35s;background:#fee2e2;color:#7f1d1d}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:0;border-radius:999px;padding:8px 14px;font:800 14px "Plus Jakarta Sans";cursor:pointer;background:#f4efe6;color:#2a1f10;box-shadow:0 3px 0 #b8a77d}
.chip.sel{background:var(--gold);color:#1a1405}
.chip.used{opacity:.35;pointer-events:none}
.seal{position:absolute;right:18px;top:18px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c0394f,#7a0f20);box-shadow:0 4px 10px rgba(0,0,0,.4);display:grid;place-items:center;color:#f7d7a6;font:900 22px Cinzel}
.seal.broken{animation:breaks .7s forwards}
@keyframes breaks{50%{transform:scale(1.2) rotate(-10deg)}100%{transform:scale(.6) rotate(25deg);opacity:0}}
/* sesler */
.voices{display:grid;gap:10px;margin-top:12px}
.voice{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;border:0;border-radius:14px;padding:12px;background:rgba(255,255,255,.05);color:#efe6cf;font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.09)}
.voice:hover{border-color:var(--gold)}
.voice i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px}
.voice b{display:block;font:800 12px "Plus Jakarta Sans";letter-spacing:.1em;text-transform:uppercase}
.voice.ok{border-color:#4ade80;background:rgba(22,101,52,.3)}.voice.no{border-color:#f87171;background:rgba(127,29,29,.3);animation:shake .35s}
/* baskın */
.raid{position:relative}
.raid.alarm:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;box-shadow:inset 0 0 90px rgba(220,38,38,.55);animation:pulse .8s infinite}
.timer{font:900 34px Cinzel,serif;color:#fca5a5;text-align:center}
.tabs{display:grid;gap:10px}
.tabd{text-align:left;border:0;border-radius:10px;padding:14px;background:#f4efe6;color:#2a1f10;cursor:pointer;font-family:var(--serif);font-size:15.5px;line-height:1.5;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.tabd b{display:block;font:800 13px "Plus Jakarta Sans";letter-spacing:.06em;text-transform:uppercase;color:#7a6a4a;margin-bottom:4px}
.tabd .gapt{color:#9a8b6b;font-style:italic}
.tok{cursor:pointer;border-radius:4px;padding:0 2px;background:rgba(212,175,55,.18)}
.tok:hover{background:rgba(212,175,55,.4)}
.tok.ok{background:#bbf7d0}
/* sentez */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .doc{font-size:16px}
.ls{display:block;cursor:pointer;padding:6px 8px;border-radius:6px;margin:0 -8px 6px}
.ls:hover{background:rgba(124,58,237,.1)}
.ls.sel{background:rgba(124,58,237,.22);box-shadow:inset 3px 0 0 #7c3aed}
.ls.ok{background:rgba(22,163,74,.2);box-shadow:inset 3px 0 0 #16a34a}
.diary{background:#efe6cf;font-family:"Fraunces",cursive;font-style:italic;rotate:.6deg}
/* öğle */
.npcs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.npc{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid rgba(212,175,55,.22);border-radius:16px;padding:12px;background:rgba(255,255,255,.04);color:#efe6cf;font:inherit;cursor:pointer}
.npc:hover{border-color:var(--gold)}
.face{width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(212,175,55,.5);background:#0b100e}
.face svg{width:100%;height:100%;display:block}
.face.lg{width:96px;height:96px}
.npc b{font-family:var(--serif);font-size:17px}.npc small{display:block;color:var(--mut9)}
.rel{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rel span{font:800 11px "Plus Jakarta Sans";padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07)}
.say{font-family:var(--serif);font-size:19px;line-height:1.55;color:#f5ecd6}
.opts{display:grid;gap:10px;margin-top:14px}
.opt2{text-align:left;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04);color:#efe6cf;font:600 15px "Plus Jakarta Sans";cursor:pointer;line-height:1.45}
.opt2:hover{border-color:var(--gold)}
.opt2.ok{border-color:#4ade80;background:rgba(22,101,52,.3)}.opt2.no{border-color:#f87171;background:rgba(127,29,29,.3)}
.opt2[disabled]{cursor:default}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.fx span{font:800 12px "Plus Jakarta Sans";padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08)}.fx .p{color:#86efac}.fx .n{color:#fca5a5}
/* düello */
.arena{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.arena>*{min-width:0}.side>*{min-width:0}
.foe{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.hp{height:14px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.hp b{display:block;height:100%;background:linear-gradient(90deg,#9B1B30,#e0574f);transition:width .5s}
.hp.me b{background:linear-gradient(90deg,#15803d,#4ade80)}
.hp em{position:absolute;inset:0;display:grid;place-items:center;font:800 10.5px "Plus Jakarta Sans";color:#fff;font-style:normal}
.intent{border-radius:14px;padding:12px 14px;background:rgba(155,27,48,.18);border:1px solid rgba(248,113,113,.4)}
.intent .ty{font:900 11px "Plus Jakarta Sans";letter-spacing:.12em;color:#fca5a5}
.room{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:800 12px "Plus Jakarta Sans"}
.room .m{height:10px;border-radius:6px;background:linear-gradient(90deg,#9B1B30,#6b7280 50%,#d4af37);position:relative}
.room .m i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff;transition:left .5s}
.st{display:flex;gap:6px;flex-wrap:wrap}.st span{font:800 11px "Plus Jakarta Sans";padding:3px 8px;border-radius:999px;background:rgba(124,58,237,.3)}
.stmt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{min-height:78px;border-radius:12px;border:2px dashed rgba(212,175,55,.35);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut9);padding:6px}
.slot.full{border-style:solid;border-color:var(--gold);background:rgba(212,175,55,.1);color:#efe6cf}
.hand{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory}
.card{flex:0 0 132px;scroll-snap-align:start;border:0;border-radius:14px;padding:10px;text-align:left;cursor:pointer;font:inherit;position:relative;min-height:150px;color:#1f1a12;background:linear-gradient(180deg,#f7f0de,#e9dcbc);box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card.sel{outline:3px solid #7c3aed;transform:translateY(-8px)}
.card .k{font:900 10px "Plus Jakarta Sans";letter-spacing:.1em;text-transform:uppercase}
.card b{display:block;font-family:var(--serif);font-size:17px;margin:4px 0 2px;line-height:1.15}
.card small{display:block;font-size:11.5px;line-height:1.35;color:#4b3f2a}
.card .pw{position:absolute;right:8px;top:8px;font:900 12px "Plus Jakarta Sans";background:#1f1a12;color:#f4efe6;border-radius:999px;padding:2px 7px}
.card.atk .k{color:#9B1B30}.card.mod .k{color:#6d28d9}.card.def .k{color:#0e7490}.card.ev{background:linear-gradient(180deg,#fff,#efe7d2)}.card.ev .k{color:#92400e}
.card.rust{filter:sepia(.7) saturate(.6);background:linear-gradient(180deg,#c9b48a,#a8916a)}
.card.rust:after{content:"PASLI";position:absolute;bottom:8px;right:8px;font:900 10px "Plus Jakarta Sans";color:#7c2d12}
.card.gold{box-shadow:0 0 0 2px var(--gold),0 8px 18px rgba(0,0,0,.35)}
.card.leg{background:linear-gradient(160deg,#fde68a,#d4af37 60%,#b45309);box-shadow:0 0 18px rgba(212,175,55,.7)}
.card.gas small{filter:blur(4px)}
.boom{animation:boom .5s}
@keyframes boom{40%{transform:scale(1.18);filter:brightness(1.6)}}
.flt{position:fixed;z-index:95;pointer-events:none;font:900 26px Cinzel,serif;animation:flt 1.1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes flt{100%{transform:translateY(-70px);opacity:0}}
.ko{position:fixed;inset:0;z-index:96;display:grid;place-items:center;pointer-events:none}
.ko b{font:900 clamp(34px,9vw,84px) Cinzel,serif;color:#f3e3b3;text-shadow:0 0 30px rgba(212,175,55,.8);animation:stamp .6s cubic-bezier(.2,1.6,.4,1) forwards}
/* yurt / pano */
.yt{display:flex;gap:8px;flex-wrap:wrap}
.yt button{border:0;border-radius:999px;padding:8px 14px;font:800 13px "Plus Jakarta Sans";background:rgba(255,255,255,.07);color:#efe6cf;cursor:pointer}
.yt button.on{background:var(--gold);color:#1a1405}
.cork{position:relative;border-radius:14px;padding:18px;min-height:340px;background:#8b6a43 radial-gradient(circle at 20% 30%,#9c7a50 0 2px,transparent 3px) 0 0/22px 22px;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;position:relative;z-index:2}
.pin{border:0;text-align:left;font:inherit;background:#f7f0de;color:#1f1a12;padding:12px 10px 10px;border-radius:3px;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,.4);position:relative;rotate:var(--r,0deg)}
.pin:before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f87171,#991b1b)}
.pin b{display:block;font-family:var(--serif);font-size:14px;line-height:1.25}.pin small{font-size:11px;color:#6b5a3e}
.pin.sel{outline:3px solid #dc2626;outline-offset:2px}
.pin.used{opacity:.55}
svg.yarn{position:absolute;inset:0;z-index:3;pointer-events:none}
.epi{border-radius:16px;padding:16px;background:radial-gradient(120% 120% at 0 0,rgba(212,175,55,.25),rgba(17,21,28,.9));border:1px solid var(--gold)}
.forge{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skc{border-radius:14px;padding:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.skc b{font-family:var(--serif);font-size:16px}.skc .lv{display:flex;gap:4px;margin:6px 0}.skc .lv u{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}.skc .lv u.on{background:var(--gold)}
.nuo{display:grid;gap:8px;margin-top:10px}
.nuo button{border:0;border-radius:10px;padding:10px;font:800 15px "Plus Jakarta Sans";background:#f4efe6;color:#1f1a12;cursor:pointer;text-align:left}
.nuo button.done{background:#bbf7d0}
.wpop{position:fixed;inset:0;z-index:90;background:rgba(5,8,7,.6);display:grid;place-items:end center;padding:12px}
.wpop .in{width:min(520px,100%);background:linear-gradient(180deg,#1a2030,#11151C);border:1px solid rgba(212,175,55,.4);border-radius:20px;padding:18px;color:#efe6cf;max-height:86vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.wpop h3{margin:0;font-size:26px}.wpop .stp{margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05)}
.lock2{filter:blur(5px);user-select:none}
.big{font:900 46px Cinzel,serif;color:var(--gold);text-align:center}
.flow{display:grid;gap:14px}
.phone{max-width:420px;margin:10px auto;border-radius:36px;padding:14px;background:#05070a;border:2px solid #2a2f3a;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.pbar{display:flex;justify-content:space-between;font:700 12px "Plus Jakarta Sans";color:#9ca3af;padding:2px 10px 10px}
.plock{border-radius:24px;padding:18px;background:radial-gradient(120% 80% at 50% 0,#1d2a40,#0b0f16);color:#e5e7eb;min-height:420px}
.pmsg{display:flex;flex-direction:column;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);margin:10px 0}.pmsg b{font-size:15px}.pmsg span{font-size:12px;color:#9ca3af}
.vn{font-family:var(--serif);font-size:16.5px;line-height:1.55;padding:12px;border-radius:12px;background:rgba(0,0,0,.35);filter:blur(1.2px);color:#cbd5e1}.vn.on{filter:none}
.vn p{margin:0 0 8px}
.defn{font-family:var(--serif);font-style:italic;font-size:17px;padding:12px;border-radius:12px;background:rgba(212,175,55,.1);border:1px dashed rgba(212,175,55,.45);color:#fde68a}
.tiles{display:grid;gap:12px;margin-top:12px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ts{width:40px;height:48px;border-radius:10px;border:2px solid rgba(212,175,55,.5);display:grid;place-items:center;font:900 22px Cinzel,serif;color:#f3e3b3;background:rgba(255,255,255,.04)}
.ts.f{background:rgba(212,175,55,.2)}.ts.hint{color:rgba(243,227,179,.45)}
.lt{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.tile{width:44px;height:48px;border:0;border-radius:10px;background:linear-gradient(180deg,#f7f0de,#e3d3ad);color:#1f1a12;font:900 21px Cinzel,serif;cursor:pointer;box-shadow:0 4px 0 #a8916a}
.tile.u{opacity:.25;pointer-events:none}
.scene .sart{width:100%;height:clamp(130px,22vw,200px);border-radius:18px 18px 0 0;display:block;border:1px solid rgba(212,175,55,.25);border-bottom:0}
.scene .panel{border-radius:0 0 18px 18px}
.beat.new{animation:beatIn .9s ease both}
@keyframes beatIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}}
.risk{font:900 10px "Plus Jakarta Sans";letter-spacing:.1em;color:#fff;background:#9B1B30;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.watch{max-width:620px;margin:10px auto;border-radius:22px;padding:24px 20px;text-align:center;background:radial-gradient(90% 70% at 50% 0,rgba(124,58,237,.28),#0a0b12 70%);border:1px solid rgba(196,181,253,.35)}
.watch .eye{font-size:54px;animation:pulse 2.4s infinite}
.watch .tip{text-align:left}
.wtype{animation:beatIn 1.4s ease both}
.myst{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.mq{border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15)}
.mq b{display:block;font-size:13.5px}.mq small{display:block;color:var(--mut9);font-size:12.5px;margin-top:3px}
.mq.ok{border-style:solid;border-color:rgba(74,222,128,.45);background:rgba(22,101,52,.18)}
.shard{width:22px;height:22px;border-radius:5px;transform:rotate(45deg);background:rgba(255,255,255,.08);border:1px solid rgba(196,181,253,.4)}
.shard.on{background:linear-gradient(135deg,#c4b5fd,#7c3aed);box-shadow:0 0 10px rgba(167,139,250,.7)}
.npc.sel2{border-color:#f87171;box-shadow:0 0 0 2px rgba(248,113,113,.5)}
.hud .fire{background:rgba(251,146,60,.2);color:#fdba74}
@media (max-width:640px){.myst{grid-template-columns:1fr}.ts{width:34px;height:42px;font-size:19px}.tile{width:40px;height:44px}}
.story .say{font-size:18.5px;line-height:1.6}
.trl{margin:-6px 0 10px;font-size:14px;color:#a8b3ab;font-style:italic;border-left:2px solid rgba(212,175,55,.35);padding-left:10px}
.qbox{border-radius:14px;padding:14px;background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.3)}
.trd{margin-top:6px;font-size:13.5px;color:#a8b3ab}.trd summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:12.5px}
.skillchip{display:inline-block;margin:0 0 8px;font:700 12.5px "Plus Jakarta Sans";color:#c7f9e4;background:rgba(20,184,166,.15);border:1px solid rgba(94,234,212,.35);padding:5px 10px;border-radius:999px}
.skl{display:grid;gap:8px;margin-top:8px}.skl div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}.skl i{grid-column:1/-1;height:6px;border-radius:3px;background:linear-gradient(90deg,#d4af37,#4ade80)}
@media (max-width:820px){.side{grid-template-columns:1fr}.side>aside{position:static}.two{grid-template-columns:1fr}}
@media (max-width:640px){.dayban{grid-template-columns:1fr}.dayban .rbtn{width:100%}.foe{grid-template-columns:72px 1fr}.foe .face.lg{width:72px;height:72px}.campus{grid-template-columns:repeat(2,1fr)}.parts{grid-template-columns:repeat(2,1fr)}.doc{padding:20px 16px;font-size:16.5px}.npcs{grid-template-columns:1fr}.sk{grid-template-columns:1fr}.stmt{gap:6px}.card{flex-basis:120px}.hud .bar{width:44px}.hud{top:calc(56px + env(safe-area-inset-top))}}

function speak(){
 if(!S.duel)return;const D=S.duel,o=D.opp,it=o.ints[D.ii%o.ints.length];const sel=D.sel.map(cInfo);
 const ev=sel.find(x=>x.ev),mod=sel.find(x=>x.k==='mod'),vb=sel.find(x=>x.k==='atk'),df=sel.find(x=>x.k==='def');
 let msg='',dmg=0,room=0;
 const lvf=w=>{const d=S.deck[w];return d?(1+.15*(d.lv-1))*(rusty(w)?.7:1):1};
 if(df){const w=df.w;
  if(w==='equivocate'||w==='qualify'){if(it.ty==='trap'){D.ans=w==='equivocate'?'dodge':'half';room=w==='qualify'?6:2;msg=`<b>"${w==='equivocate'?'Bu sorunun cevabı, nasıl tanımladığınıza bağlı…':'Kısmen evet; ancak bunu bir koşula bağlamam gerek…'}"</b> Tuzak soru boşa çıktı.`;ok()}else{room=-10;mask(-3);msg=`Kaçamak cevap seyirciyi soğuttu: bu bir tuzak soru değildi, ${TYL[it.ty].toLowerCase()} karşısında kaçamak zayıflık sayılır.`;bad()}}
  if(w==='concede'){D.shield+=df.v||14;room=it.ty==='trap'?-5:4;msg=`<b>"Bu noktada haklı olabilirsiniz, ancak…"</b> Küçük bir noktayı kabul edip kalkan kurdun (+${df.v||14}).`;ok()}
  if(w==='deflect'){if(['threat','motive'].includes(it.ty)){D.ans='reflect';room=8;msg='<b>"Asıl soru, bu suçlamayı neden şimdi yaptığınız."</b> Saldırıyı geri çevireceksin.';ok()}else{D.ans='halfin';room=-4;msg='Saptırma bu iddiaya pek uymadı; hasarın yarısını alacaksın.';bad()}}
 }else{
  const vw=vb&&vb.w;const fit=vw&&(NEEDS[it.ty]||[]).includes(vw);
  const agree=vw&&['corroborate','substantiate','verify'].includes(vw)&&['claim','motive','threat'].includes(it.ty);
  if(agree){dmg=0;room=-15;D.me=Math.max(0,D.me-8);msg=`<b>Geri tepti!</b> "${vw}" = ${W[vw].tr}. Rakibin iddiasını <b>desteklemiş</b> oldun! Seyirci gülüyor. (-8)`;bad();shakeScreen()}
  else{
   let base=(vb?vb.b*lvf(vw):0)+(ev?ev.p:0);if(!vb&&ev)base=ev.p*.7;
   let mult=mod?mod.m*lvf(mod.w):1;if(mod&&!vb&&!ev){base=4}
   let combo=false;
   const adjOk=mod&&['fallacious','irrefutable','clandestine','unprecedented','machiavellian'].includes(mod.w)&&ev;
   const advOk=mod&&vb&&(vb.mods||[]).includes(mod.w);
   const tagOk=ev&&(ev.tag===it.ty||(ev.tag==='claim'&&it.ty==='trap'));
   if((advOk||adjOk)&&ev&&tagOk&&(fit||adjOk))combo=true;
   dmg=base*mult;
   if(vb){if(fit){dmg*=1.3;room+=8}else{dmg*=.6;room-=8}}
   if(ev&&tagOk)dmg*=1.15;if(combo){dmg*=1.25*(S.sk.synth?1.25:1)}
   if(S.sk.lexicon&&vb)dmg*=1.1;if(D.st.flust)dmg*=1.1;if(o.hp<o.max*.4)dmg*=1.3;
   dmg=Math.round(dmg);
   const sent=vb?SAY[vw].replace('{m} ',mod&&mod.k==='mod'&&!adjOk?mod.w+' ':''):(mod?`This is ${mod.w}`:'Look at this');
   msg=`<i>"${esc(sent)}${ev?': '+esc(ev.t)+(adjOk?` — ${mod.w} evidence`:''):''}."</i> <b>${dmg} hasar</b>`;
   if(vb&&!fit)msg+=` · "${vw}" bu ${TYL[it.ty].toLowerCase()} için zayıf bir cevap (doğal karşılık: ${(NEEDS[it.ty]||[]).slice(0,3).join(', ')}).`;
   if(vb&&fit)msg+=' · Yerinde cevap!';
   if(combo){room+=15;D.st.stun=1;D.st.flust=1;msg=`<b style="color:#d4af37">KUSURSUZ COLLOCATION KOMBOSU!</b> ${msg} · rakip bir tur sersemledi.`;bigText('KOMBO!');win()}else if(dmg)ok();
   o.hp=Math.max(0,o.hp-dmg);
  }
  if(it.gas&&vw&&['scrutinize','verify'].includes(vw))D.ans=D.ans||'half';
 }
 D.room=clamp(D.room+room,0,100);
 D.energy-=D.sel.length;D.sel.forEach(c=>{D.hand=D.hand.filter(y=>y!==c);if(!c.startsWith('ev:'))D.disc.push(c)});D.sel=[];

  else if(D.ans==='reflect'){const r=Math.round(dmg*.5);o.hp=Math.max(1,o.hp-r);msg=`Saldırıyı geri çevirdin: rakip ${r} hasar aldı, sen hiç almadın.`;dmg=0}

  if(dmg){D.me=Math.max(0,D.me-dmg);msg=msg||`${esc(o.n.split(' ')[0])}: ${dmg} hasar${ab?` (kalkan ${ab} emdi)`:''}.`;D.room=clamp(D.room-4,0,100);flt('-'+dmg,'#fca5a5');bad()}

 D.log.push(msg);D.ii++;D.ans=null;D.energy=3+(D.room>=70?1:0);D.disc.push(...D.hand.filter(c=>!c.startsWith('ev:')));D.hand.filter(c=>c.startsWith('ev:')).forEach(c=>D.draw.unshift(c));D.hand=[];drawHand();D.gasNow=D.gas;D.gas=0;D.sel=[];

 else{mask(-6);S.rel[k].t-=3;S.rel[k].s+=2;bad();out=`${esc(NPC[k].n.split(' ')[0])} seni bembeyaz bir yüzle dinliyor. "Gerçekten bunu mu düşünüyorsun?" Kapıyı çarpıp çıkıyor. Ertesi sabah gerçeği bir başkası itiraf edecek; ama ${esc(NPC[k].n.split(' ')[0])} bunu unutmayacak.`}

 view(hud()+`<div class="panel flow"><div class="lbl">Karar</div>${pf(k==='kaelen'?'kaelen':k)}<p class="say">${out}</p><div class="row"><button class="rbtn" data-a="voice2">Elara'nın kaydını çöz →</button></div></div>`);
}
function voiceNote(){
 view(`<div class="phone"><div class="pbar"><span>00:41</span><span>📶 🔋</span></div><div class="plock"><div class="lbl">Elara · şifresi çözülen kayıt · ${S.shards.length}/5 parça</div>
 <div class="vn on">${SHARDS.map((t,i)=>S.shards.includes(i)?`<p class="beat new" style="animation-delay:${i*.6}s">${esc(t)}</p>`:`<p class="mut">██████████ <small>(bu parça bulunamadı: Gözlemci'nin bulmacalarını çözersen parçalar tamamlanır)</small></p>`).join('')}</div>
 ${VQ.map((q,qi)=>`<div class="qbox" style="margin-top:12px"><div class="lbl">Dinlediğini anladın mı? ${qi+1}/3</div><p style="margin:6px 0;font-weight:700">${esc(q.q)}</p><div class="opts">${(S.vq&&S.vq[qi]!=null)?q.o.map((o,i)=>`<button class="opt2 ${i===q.a?'ok':S.vq[qi]===i?'no':''}" disabled>${esc(o)}</button>`).join(''):q.o.map((o,i)=>[o,i]).sort((x,y)=>(x[0].length%3)-(y[0].length%3)).map(([o,i])=>`<button class="opt2" data-a="vqa" data-q="${qi}" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
 <div class="row" style="margin-top:12px"><button class="rbtn" data-a="toend" ${S.vq&&Object.keys(S.vq).length>=3?'':'disabled'}>Bölümü bitir →</button></div></div></div>`);
}
function vqAns(qi,i){S.vq=S.vq||{};if(S.vq[qi]!=null)return;S.vq[qi]=i;const okk=i===VQ[qi].a;stat('voice',okk);if(okk){ok();gainXp(4)}else bad();if(qi===0){learn('erase',W.erase.tr)}if(qi===1)learn('coerce',W.coerce.tr);save();voiceNote()}

/* ---------- Gece tekrarı: o günün kelimeleri ---------- */
function dayWords(d){
 const keys=new Set();const re=/\{\{[^|}]+\|([^}]+)\}\}/g;const txt=JSON.stringify(DAYS[d-1])+JSON.stringify(SCENES[d]||{});let m;while((m=re.exec(txt)))keys.add(m[1]);
 Object.keys(S.lex).forEach(k=>{if(S.lex[k]===2&&S.learnt&&S.learnt[k]&&S.learnt[k].day===d)keys.add(k)});
 return [...keys].filter(k=>W[k]&&W[k].cols);
}
let RV=null;
function review(){
 if(!RV||RV.day!==S.day){const ws=shuf(dayWords(S.day)).slice(0,4);RV={day:S.day,qs:ws.map((w,i)=>{const x=W[w];const t=['mean','col','def','mean'][i%4];
   if(t==='mean')return {w,t,q:`"${w}" ne demek?`,o:shuf([x.tr,...shuf(Object.values(W).filter(y=>y!==x&&y.tr).map(y=>y.tr)).slice(0,2)]),a:x.tr,ex:x.col};
   if(t==='col')return {w,t,q:`Doğal eşdizim hangisi?`,o:shuf(x.cols.map(c=>w+' '+c)),a:w+' '+x.cols[0],ex:x.col};
   return {w,t,q:`"${x.def}"`,o:shuf([w,...shuf(Object.keys(W).filter(y=>y!==w&&W[y].pos===x.pos)).slice(0,2)]),a:w,ex:x.col}}),i:0,ok:0,ans:null}}
 if(!RV.qs.length){S.rev[S.day]=1;save();return night(false,true)}
 const q=RV.qs[RV.i];
 view(hud()+`<div class="panel flow" style="max-width:640px;margin:0 auto"><div class="lbl">Gece tekrarı · bugünün kelimeleri · ${RV.i+1}/${RV.qs.length}</div><h2 style="margin:0">Uyumadan önce kelimelerini sağlamlaştır</h2><p class="mut" style="margin:0">Bugün metinlerde karşılaştığın akademik kelimeler. Gece tekrar etmek, yarın hatırlamanı kolaylaştırır.</p>
 <p class="say" style="font-size:19px">${esc(q.q)}</p><div class="opts">${q.o.map(o=>`<button class="opt2 ${RV.ans!=null?(o===q.a?'ok':o===RV.ans?'no':''):''}" data-a="rva" data-v="${esc(o)}" ${RV.ans!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
 ${RV.ans!=null?`<div class="tip ${RV.ans===q.a?'ok':'no'}"><b>${esc(q.w)}</b> = ${esc(W[q.w].tr)} · <i>${esc(q.ex)}</i></div><div class="row"><button class="rbtn" data-a="rvn">${RV.i<RV.qs.length-1?'Sonraki →':'Tekrarı bitir →'}</button></div>`:''}</div>`);
}
function reviewAns(v){const q=RV.qs[RV.i];if(RV.ans!=null)return;RV.ans=v;const okk=v===q.a;stat('review',okk);if(okk){ok();RV.ok++;gainXp(2);learn(q.w,W[q.w].tr)}else bad();save();review()}
function reviewNext(){if(RV.i<RV.qs.length-1){RV.i++;RV.ans=null;return review()}const tot=RV.qs.length,o=RV.ok;S.rev[S.day]=1;if(o===tot){ins(1);toast('Kusursuz tekrar! +1 İçgörü')}RV=null;save();night(false,true)}
/* ---------- Öğrenme raporu ve dışa aktarma ---------- */
const SKN={prep:'Kanıtı iddiayla eşleştirme',audit:'Close reading: çelişki ve kanıtsız kesinlik',contract:'Hukuki dil: provided that, unless, notwithstanding',redacted:'Bağlaçlar ve paragraf bütünlüğü',subtext:'Ton ve çıkarım',raid:'Skimming ve scanning',synth:'Çoklu kaynak sentezi',scene:'Hikâye okuma (anlama soruları)',review:'Kelime tekrarı',voice:'Ses kaydı anlama'};
function learnReport(){
 const L=S.learnt||{};const words=Object.keys(L);const deck=Object.keys(S.deck);
 const all=[...new Set(words.concat(deck))].filter(w=>W[w]);
 const st=S.st2||{};
 return `<div class="panel" style="max-width:640px;margin:20px auto 0;text-align:left"><div class="lbl">Öğrenme raporu</div>
 <p style="margin:6px 0">Bu bölümde <b>${all.length}</b> akademik kelimeyle çalıştın (${words.length} tanesini metinde ya da tekrarda çözdün, ${deck.length} tanesi destende).</p>
 <div class="skl">${Object.keys(SKN).filter(k=>st[k]).map(k=>{const r=st[k],t=r.ok+r.no,p=Math.round(r.ok/t*100);return `<div><span>${esc(SKN[k])}</span><b>${p}%</b><i style="width:${p}%"></i></div>`}).join('')}</div>
 <div class="chips" style="margin-top:10px">${all.slice(0,40).map(w=>`<span class="chip" style="cursor:default;font-size:12.5px">${esc(w)} · <span style="font-weight:600">${esc(W[w].tr)}</span></span>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="rbtn" data-a="export">📚 Bu kelimeleri Kelime Arenası listeme ekle</button><a class="rbtn ghost sm" href="index.html">Ana sayfada çalış →</a></div>
 <p class="mut" style="font-size:12.5px;margin:6px 0 0">"Ravenwood · Bölüm 1" adında yeni bir liste açılır; Kapı, Kalem ve Bekçi gibi ana çalışmalarda bu kelimelerle devam edebilirsin.</p></div>`;
}
function exportWords(){
 const L=S.learnt||{};const all=[...new Set(Object.keys(L).concat(Object.keys(S.deck)))].filter(w=>W[w]);
 const items=all.map(w=>({en:w,tr:W[w].tr,ex:W[w].col}));
 try{const p=KA.normPack({id:'rw1',name:'Ravenwood · Bölüm 1',items,words:items.map(x=>({en:x.en,tr:x.tr}))});KA.savePack(p,true);toast(items.length+' kelime "Ravenwood · Bölüm 1" listesine eklendi');S.exported=1;save()}catch(e){toast('Liste oluşturulamadı')}
}

/* ================= OLAYLAR ================= */
document.addEventListener('click',e=>{
 const aw=e.target.closest('.aw');if(aw){e.stopPropagation();return wordPop(aw.dataset.w,aw.dataset.surf||aw.textContent)}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 const H={
  startgame:()=>{if(!S.pro){TL=null;return prologue()}if(!S.start)return placement();hub()},
  tile:()=>{const ctx=!S.pro?'pro':'watch';const r=tileTap(+b.dataset.i);if(ctx==='pro'){if(r==='ok'){S.pro=true;learn('erase',W.erase.tr);save()}return prologue(r==='ok'?'ok':r==='bad'?'bad':'')}if(r==='ok'){const w=WATCH[S.day];S.watch[S.day]='ok';addShard();ins(1);S.whispers.push({en:w.wh,tr:w.whtr});learn(w.a.toLowerCase(),w.tr);stat('review',true);gainXp(4);save()}watcher(r==='bad'?'bad':'')},
  tback:()=>{if(TL)TL.pick.pop();(!S.pro?prologue:watcher)()},
  pronext:()=>{if(!S.start)return placement();hub()},
  beat:()=>{SC.b++;scene()},sctr:()=>{SC.tr=!SC.tr;scene()},vqa:()=>vqAns(+b.dataset.q,+b.dataset.i),rva:()=>reviewAns(b.dataset.v),rvn:reviewNext,export:exportWords,sopt:()=>sceneOpt(+b.dataset.i),sdone:sceneDone,schoose:()=>sceneChoose(+b.dataset.i),
  wdone:()=>night(),wskip:()=>{S.watch[S.day]='skip';save();night()},
  mole:moleFile,acwho:()=>{AC2.who=b.dataset.k;accuse()},acpick:()=>{const id=b.dataset.e;AC2.pick=AC2.pick.includes(id)?AC2.pick.filter(x=>x!==id):AC2.pick.length<2?AC2.pick.concat(id):AC2.pick;accuse()},acgo:accuseGo,voice2:voiceNote,toend:()=>{S.part='end';save();chapterEnd()},
  newgame:()=>{if(!confirm('Bütün Ravenwood ilerlemen silinsin mi?'))return;S=fresh();STARTER.forEach(w=>addCard(w,true));save();title()},
  title:title,hub:()=>{clearInterval(RT);FG=null;hub()},go:()=>{clearInterval(RT);goPart()},
  placeans:()=>placeAns(+b.dataset.i,b),
  loc:()=>locInfo(b.dataset.k),
  yurt:()=>{YT='ocak';FG=null;night(S.part!=='night')},rels:rels,deck:()=>{YT='ocak';FG=null;night(S.part!=='night')},leak:()=>{LK=null;leak()},gaunt:gaunt,
  wclose:()=>{const p=b.closest('.wpop');p&&p.remove()},
  wguess:()=>{const k=b.dataset.k;const okk=b.dataset.v===W[k].tr;document.querySelectorAll('[data-a=wguess]').forEach(x=>{x.disabled=true;if(x.dataset.v===W[k].tr)x.classList.add('ok')});if(okk){ins(1);ok();wordSolved(k,'guess')}else{b.classList.add('no');bad();S.lex[k]=1;save();setTimeout(()=>wordSolved(k,'miss'),900)}},
  wreveal:()=>{const k=b.dataset.k;if(S.lex[k]&&S.ins<1){toast('İçgörü jetonun yok. Tahmin etmeyi dene!');return}if(S.lex[k])ins(-1);wordSolved(k,'reveal')},
  wsay:()=>{try{KA.speak(b.dataset.k)}catch(x){}},
  wlist:()=>{try{KA.addUnknown(b.dataset.k,W[b.dataset.k].tr);toast('Bilmediklerim listesine eklendi')}catch(x){}},
  lexall:()=>{Object.keys(S.lex).filter(k=>S.lex[k]===2).forEach(k=>{try{KA.addUnknown(k,W[k].tr)}catch(x){}});toast('Kelimeler Bilmediklerim listesine eklendi')},
  sent:()=>auditClick(b.dataset.s,b),mdone:morningDone,
  cdec:()=>contractDec(b.dataset.v),clause:()=>contractPick(b.dataset.c),ccheck:()=>contractCheck(+b.dataset.i,b),
  gap:()=>redGap(b.dataset.g),chip:()=>redChip(b.dataset.v),rcheck:redCheck,topic:()=>redTopic(+b.dataset.i,b),
  voice:()=>voiceAns(+b.dataset.i,b),
  raidgo:()=>{S.m.phase='skim';save();mRaid()},tab:()=>raidTab(b.dataset.t,b),tok:()=>raidTok(b.dataset.t,b),raidretry:()=>{const M=S.m;M.phase='brief';M.left=null;M.si=0;M.got=[];M.tip='';save();mRaid()},
  ls:()=>synSel(b.dataset.side,+b.dataset.i),link:synLink,syn:()=>synAns(+b.dataset.i,b),
  prep:()=>prepPick(b.dataset.e),prepdone:morningDone,
  lpick:()=>{S.lunch.who=b.dataset.k;save();lunch()},lskip:()=>{S.part='eve';S.lunch=null;save();lunchEnd()},lans:()=>lunchAns(+b.dataset.i),lend:lunchEnd,
  card:()=>cardSel(b.dataset.c),speak:speak,endturn:endTurn,dhelp:duelHelp,finans:()=>finAns(b.dataset.v,b),
  gauntquit:()=>{S.duel=null;S.gaunt.run=null;save();gaunt()},gnext:gauntNext,gquit:()=>{S.gaunt.run=null;save();gaunt()},gpick:()=>{addCard(b.dataset.w);S.gaunt.pickCards=null;save();gaunt()},
  yt:()=>{YT=b.dataset.t;FG=null;PTIP='';night(S.part!=='night')},sleep:sleep,
  forge:()=>forgeStart(b.dataset.w),fback:()=>{FG=null;night(S.part!=='night')},
  fcol:()=>{if(FG.done)return;const okk=b.dataset.v===W[FG.w].cols[0];forgeResult(okk,okk?'':`Doğru eşdizim: "${FG.w} ${W[FG.w].cols[0]}".`)},
  ffam:()=>{if(FG.done)return;const okk=b.dataset.v===FG.ans;forgeResult(okk,okk?'':`Doğrusu: ${FG.ans}.`)},
  fnu:()=>{if(FG.done||FG.ord.includes(b.dataset.v))return;FG.ord.push(b.dataset.v);const i=FG.ord.length-1;if(FG.g.w[i]!==b.dataset.v){forgeResult(false,`Doğru sıra: ${FG.g.w.join(' < ')}.`);return}if(FG.ord.length===FG.g.w.length)return forgeResult(true,FG.g.w.join(' < '));night(S.part!=='night')},
  pal:()=>{const id=b.dataset.e;PTIP='';PAL=PAL.includes(id)?PAL.filter(x=>x!==id):PAL.length<3?PAL.concat(id):PAL;night(S.part!=='night')},palgo:palaceGo,palclr:()=>{PAL=[];PTIP='';night(S.part!=='night')},
  skill:()=>{const k=b.dataset.k;if(S.sp<1||S.sk[k]>=SKILLS[k].max)return;S.sp--;S.sk[k]++;ok();save();night(S.part!=='night')},
  lsent:()=>leakClick(+b.dataset.i),leakend:()=>{LK=null;leak()},
  rewind:()=>rewind(+b.dataset.d)
 };
 if(H[a]){e.preventDefault();H[a]()}
});
window.addEventListener('resize',()=>{if(YT==='saray')drawYarn()});
KA.nav('oyunlar.html');
(S.start?hub:title)();
})();
</script>
