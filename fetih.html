<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena Fethi · Kelime Arenası</title>
<meta name="description" content="Kelimelerinle Akdeniz'i fethet: her maçta yeni harita, jokerler, düellolar ve başkent kuşatmaları.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css">
<style>
:root{--c0:#0f766e;--c1:#c0392b;--c2:#c98a0b;--sand:#efe2c0;--sand-ink:#5b4a22;--sea1:#cdebe7;--sea2:#94cfc8;--coast:#8a7442;--bord:rgba(70,52,18,.38);--gold:#f59e0b}
[data-mode="dark"]{--c0:#1fb8a4;--c1:#e5574a;--c2:#e9a92c;--sand:#4a5541;--sand-ink:#d6dccf;--sea1:#0d302e;--sea2:#071d1c;--coast:#0b1716;--bord:rgba(0,0,0,.5)}
.wrapx{max-width:1240px}
/* ---------- Kurulum ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);gap:18px;align-items:stretch}
.hero{padding:0;overflow:hidden;display:flex;flex-direction:column}
.hero-map{position:relative;background:var(--sea2);aspect-ratio:608/335;overflow:hidden}
.hero-map svg{display:block;width:100%;height:100%}
.hero-map:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,color-mix(in srgb,var(--card) 92%,transparent) 100%);pointer-events:none}
.hero-txt{padding:0 28px;margin-top:-64px;position:relative;z-index:2}
.hero-txt h1{font-size:clamp(34px,5vw,52px);margin:4px 0 8px}
.hero-txt p{margin:0;color:var(--ink2);max-width:560px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 28px 0}
.steps div{background:var(--soft);border-radius:14px;padding:12px;font-size:13px;color:var(--ink2);line-height:1.4}
.steps b{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13.5px;margin-bottom:3px}
.steps b svg{width:16px;height:16px;color:var(--p)}
.rankcard{display:flex;align-items:center;gap:14px;margin:20px 28px 26px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card2)}
.rankcard .emb{width:46px;height:52px;flex:0 0 46px}
.rankcard .rk{flex:1;min-width:0}
.rankcard .rk b{font-size:17px;display:block}
.rankcard .rk .eyebrow{display:block}
.xpbar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fbbf24);border-radius:9px}
.recs{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.recs b{color:var(--ink);font-size:15px}
.cfg{padding:24px;display:flex;flex-direction:column;gap:18px}
.cfg h3{font-family:inherit;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{text-align:left;padding:12px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s,transform .1s}
.choice:hover{border-color:var(--line2)}
.choice:active{transform:scale(.98)}
.choice b{font-size:14.5px;display:flex;align-items:center;gap:6px}
.choice b svg{width:16px;height:16px}
.choice span{font-size:12.5px;color:var(--mut);line-height:1.35}
.choice.on{border-color:var(--p);background:var(--p-soft)}
.startbtn{margin-top:auto;min-height:60px;font-size:18px;border-radius:18px;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 70%,#000));box-shadow:0 10px 24px -10px color-mix(in srgb,var(--p) 80%,transparent)}
/* ---------- Oyun ---------- */
body.ingame .ka-tabbar{display:none}
.game{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.pls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.pl{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);position:relative;transition:border-color .2s,box-shadow .2s,opacity .3s;min-width:0}
.pl .emb{width:34px;height:39px;flex:0 0 34px}
.pl .pi{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.pl .nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-family:Fraunces,serif;font-size:21px;font-variant-numeric:tabular-nums}
.pl .st{font-size:11.5px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap}
.pl .tw{display:inline-flex;gap:2px}.pl .tw i{width:6px;height:8px;border-radius:1.5px;background:currentColor}.pl .tw i.off{opacity:.2}
.pl.turn{border-color:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.pl.dead{opacity:.45;filter:grayscale(.8)}
.pl .ans{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;transform:scale(0);transition:transform .2s}
.pl .ans.wait{transform:scale(1);background:var(--line2);animation:pulse 1s infinite}
.pl .ans.lock{transform:scale(1);background:var(--ink2)}
.pl .ans.ok{transform:scale(1);background:var(--ok)}
.pl .ans.no{transform:scale(1);background:var(--bad)}
.pl .fl{color:var(--gold);font-weight:800;font-size:11.5px;display:none}
.pl .fl.on{display:inline-flex;align-items:center}
@keyframes pulse{50%{opacity:.45}}
.board{padding:0;overflow:hidden;position:relative}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.bhead .eyebrow{display:block;margin:0}
.bhead b{font-size:15px}
.joks{display:flex;gap:6px}
.jk{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:12.5px;color:var(--ink2)}
.jk svg{width:15px;height:15px}
.jk i{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:11px}
.jk.use{border-color:var(--gold);color:var(--acc2);background:var(--acc-soft)}
.jk:disabled{opacity:.4;cursor:default}
.mapw{position:relative;background:var(--sea2)}
.mapw svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rg{color:var(--sand);transition:color .45s}
.rg polygon{fill:currentColor;stroke:currentColor;stroke-width:.7}
.rg.o0{color:var(--c0)}.rg.o1{color:var(--c1)}.rg.o2{color:var(--c2)}
.rg.sel{cursor:pointer}
.rg.sel:hover{filter:brightness(1.15) saturate(1.1)}
.rg.dim{filter:saturate(.55) brightness(.92)}
.bd{fill:none;stroke:var(--bord);stroke-width:1.1;stroke-linecap:round}
.cs{fill:none;stroke:var(--coast);stroke-width:2.2;stroke-linecap:round}
.shal{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
[data-mode="dark"] .shal{stroke-opacity:.07}
.wvp{stroke-opacity:.22}[data-mode="dark"] .wvp{stroke-opacity:.05}
.hlp{fill:none;stroke:#fff;stroke-width:2.6;stroke-dasharray:5 4;animation:dash 1s linear infinite;pointer-events:none;stroke-linecap:round}
.hlp.tg{stroke:#fde047}
@keyframes dash{to{stroke-dashoffset:-18}}
.lb{pointer-events:none;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;text-anchor:middle;paint-order:stroke;stroke-linejoin:round}
.lbn{font-size:8.6px;fill:var(--sand-ink);stroke:var(--sand);stroke-width:2.6;letter-spacing:.02em}
.lbn.own{fill:#fff;stroke:rgba(0,0,0,.35)}
.lbv{font-size:11px;fill:#fff;stroke:rgba(0,0,0,.45);stroke-width:3}
.cap{pointer-events:none}
.float{font:900 15px "Plus Jakarta Sans",sans-serif;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3.5;fill:#fff;animation:fup 1.5s ease-out forwards;pointer-events:none}
.float.g{fill:#fde047}.float.r{fill:#fecaca}
@keyframes fup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.ring{fill:none;stroke-width:3;animation:ring .9s ease-out forwards;pointer-events:none}
@keyframes ring{from{opacity:.9;r:4}to{opacity:0;r:46}}
.arrow{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:10 7;animation:dash .6s linear infinite;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;text-align:center;padding:16px 30px;border-radius:20px;background:color-mix(in srgb,var(--ink) 86%,transparent);color:#fff;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);transition:opacity .25s,transform .25s;z-index:5;min-width:240px}
[data-mode="dark"] .banner{background:rgba(2,12,11,.88)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner b{display:block;font-family:Fraunces,serif;font-size:clamp(24px,3.4vw,34px);letter-spacing:.01em}
.banner span{font-size:14px;opacity:.85}
.logline{padding:9px 16px;font-size:13.5px;color:var(--ink2);border-top:1px solid var(--line);min-height:40px;display:flex;align-items:center;gap:8px}
.logline svg{width:16px;height:16px;color:var(--p);flex:0 0 16px}
/* ---------- Panel ---------- */
.panel{position:sticky;top:76px;padding:16px;min-height:300px}
.qh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.qtag{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:10px;background:var(--p-soft);color:var(--p);line-height:1.3}
.qtag.duel{background:var(--bad-soft);color:var(--bad)}
.qtag.spec{background:var(--acc-soft);color:var(--acc2)}
.tmr{position:relative;width:44px;height:44px;flex:0 0 44px}
.tmr svg{width:44px;height:44px;transform:rotate(-90deg)}
.tmr circle{fill:none;stroke-width:3.5}
.tmr .tb{stroke:var(--soft)}.tmr .tf{stroke:var(--p);stroke-linecap:round;stroke-dasharray:100.5}
.tmr.low .tf{stroke:var(--bad)}
.tmr b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.vs{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px;border-radius:14px;background:var(--soft)}
.vs .side{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:13px}
.vs .side:last-child{justify-content:flex-end;text-align:right}
.vs .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .emb{width:26px;height:30px;flex:0 0 26px}
.vs .x{font-family:Fraunces,serif;font-weight:800;color:var(--bad);font-size:15px}
.qt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.qw{font-family:Fraunces,serif;font-size:clamp(26px,3vw,34px);font-weight:800;margin:2px 0 6px;line-height:1.15;word-break:break-word}
.qs{font-size:16.5px;line-height:1.5;margin:6px 0 8px;font-weight:600}
.qs .blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--p);margin:0 2px}
.lis{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:74px;border-radius:16px;border:2px dashed var(--line2);background:var(--card2);font-weight:800;font-size:16px;margin:8px 0}
.lis svg{width:26px;height:26px;color:var(--p)}
.qo{display:grid;gap:8px;margin-top:10px}
.qo button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;box-shadow:0 2px 0 var(--line);transition:transform .08s,border-color .15s,background .15s}
.qo button:hover:not(:disabled){border-color:var(--p)}
.qo button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.qo kbd{flex:0 0 24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:800 12px "Plus Jakarta Sans",sans-serif;color:var(--mut)}
.qo button.pick{border-color:var(--p);background:var(--p-soft)}
.qo button.ok{border-color:var(--ok);background:var(--ok-soft)}
.qo button.ok kbd{background:var(--ok);color:#fff}
.qo button.no{border-color:var(--bad);background:var(--bad-soft)}
.qo button.no kbd{background:var(--bad);color:#fff}
.qo button.gone{opacity:.25;pointer-events:none}
.qo button:disabled{cursor:default}
.qtype{display:flex;gap:8px;margin-top:12px}
.qtype input{flex:1;min-width:0;font-size:18px;font-weight:700}
.qtype input.ok{border-color:var(--ok);background:var(--ok-soft)}.qtype input.no{border-color:var(--bad);background:var(--bad-soft)}
.qj{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.qps{display:grid;gap:6px;margin-top:12px}
.qp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 10px;border-radius:11px;background:var(--soft)}
.qp i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.qp .r{margin-left:auto;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.qp .g{color:var(--ok)}.qp .b{color:var(--bad)}
.learn{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--acc-soft);font-size:14px;line-height:1.45}
.learn b{font-size:15px}
.learn .ex{margin-top:6px;color:var(--ink2);font-style:italic}
.learn .row{gap:6px;margin-top:8px}
.nextb{width:100%;margin-top:12px;position:relative;overflow:hidden}
.nextb i{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.5;animation:fill linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.idle h3{margin:0 0 6px;font-size:20px}
.idle p{margin:0 0 12px;color:var(--ink2)}
.feed{display:grid;gap:6px;margin-top:10px}
.feed div{font-size:13px;color:var(--ink2);padding:7px 10px;border-radius:10px;background:var(--soft);display:flex;gap:8px;align-items:flex-start}
.feed i{width:8px;height:8px;border-radius:2px;flex:0 0 8px;margin-top:5px}
.dblbtn{width:100%;margin-top:4px}
/* ---------- Bitiş ---------- */
.end{padding:32px 24px;text-align:center;max-width:820px;margin:0 auto}
.end h1{font-size:clamp(30px,4.5vw,44px);margin:8px 0 6px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:22px auto 18px;align-items:end}
.podium div{border-radius:16px 16px 6px 6px;padding:12px 8px;color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.podium .emb{width:34px;height:39px}
.podium b{font-family:Fraunces,serif;font-size:24px}
.podium small{font-size:12px;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 18px}
.tiles div{padding:12px;border-radius:14px;background:var(--soft)}
.tiles b{display:block;font-family:Fraunces,serif;font-size:24px}
.tiles span{font-size:12.5px;color:var(--mut)}
.medals{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.medal{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--acc-soft);font-weight:800;font-size:13px;animation:pop .4s backwards}
.medal i{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#fde68a,#f59e0b);display:grid;place-items:center;color:#5a3500}
.medal i svg{width:16px;height:16px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.missed{text-align:left;max-width:560px;margin:18px auto 0}
.missed>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.missed .grow{flex:1}
.conf{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (max-width:1060px){.game{grid-template-columns:minmax(0,1fr) 320px}.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .setup{grid-template-columns:1fr}
  .game{grid-template-columns:1fr}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:65;border-radius:22px 22px 0 0;max-height:64vh;overflow:auto;min-height:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -12px 34px -12px rgba(0,0,0,.35)}
  .panel .idle p,.panel .feed{display:none}
  .panel .idle h3{font-size:16px;margin:0}
  body.ingame .ka-wrap{padding-bottom:140px}
  .qo{grid-template-columns:1fr 1fr}
  .qo button{min-height:54px;padding:9px 10px;font-size:14px}
  .qo kbd{display:none}
  .lbn{display:none}
  .lbv{font-size:15px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .panel{max-height:58vh;padding-top:12px}
  .qps{display:none}
  .qh{margin-bottom:4px}.vs{padding:6px 8px;margin-bottom:8px}
  .qw{font-size:26px;margin:0 0 2px}.qs{font-size:15px;margin:4px 0}
  .lis{min-height:50px;margin:6px 0}
  .qo{margin-top:6px;gap:6px}.qj{margin-top:8px}
  .learn{margin-top:8px;padding:9px 12px;font-size:13.5px}
  .nextb{margin-top:8px}
  .pls{margin-bottom:8px}
  .bhead>div:first-child{min-width:0}
  #rd{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:560px){
  .pls{gap:6px}.pl{padding:7px 8px;gap:6px}.pl .emb{width:24px;height:28px;flex-basis:24px}.pl .sc{font-size:17px}.pl .st{font-size:10.5px}.pl .nm{font-size:11.5px}
  .opts3{grid-template-columns:1fr}.choice{flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap}
  .steps{display:none}.hero-txt{padding:0 18px;margin-top:-44px}.hero-txt p{font-size:14.5px}.rankcard{margin:16px 18px 20px}.cfg{padding:18px}
  .bhead{padding:8px 10px}.jk span{display:none}#jk{display:none}
  .vs .side span{font-size:12px}
}
</style>
</head>
<body>
<main class="ka-wrap" id="main"></main>
<script src="ortak.js"></script>
<script>
(function(){
'use strict';
const {$,esc,forms}=KA;const ic=KA.ic;

const S=13,SQ=Math.sqrt(3),COLS=25,ROWS=15,PAD=17,NREG=18;

function genMap(R){
  for(let tries=0;tries<60;tries++){
    const NG=5,g1=Array.from({length:(NG+1)**2},R),g2=Array.from({length:(2*NG+1)**2},R);
    const sm=t=>t*t*(3-2*t);
    const nz=(g,N,u,v)=>{u*=N;v*=N;const i=Math.min(N-1,u|0),j=Math.min(N-1,v|0),fu=sm(u-i),fv=sm(v-j),G=(a,b)=>g[b*(N+1)+a];const a=G(i,j)+(G(i+1,j)-G(i,j))*fu,b=G(i,j+1)+(G(i+1,j+1)-G(i,j+1))*fu;return a+(b-a)*fv};
    const T=[],grid=[];
    for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){
      const x=PAD+SQ*S*(c+.5+.5*(r&1)),y=PAD+S+1.5*S*r,u=x/MW,v=y/MH;
      const d=Math.hypot((u-.5)/.5,(v-.5)/.47),n=nz(g1,NG,u,v)*.7+nz(g2,2*NG,u,v)*.3;
      const t={i:T.length,c,r,x,y,land:d<.8+(n-.5)*.85&&d<.97,reg:-1};T.push(t);grid[r][c]=t}}
    const nb=(t,k)=>{const [dc,dr]=DIRS[t.r&1][k],rr=grid[t.r+dr];return rr?rr[t.c+dc]||null:null};
    T.forEach(t=>t.n=[0,1,2,3,4,5].map(k=>nb(t,k)));
    let best=[];const seen=new Set();
    T.forEach(t=>{if(!t.land||seen.has(t))return;const comp=[],st=[t];seen.add(t);while(st.length){const a=st.pop();comp.push(a);a.n.forEach(b=>{if(b&&b.land&&!seen.has(b)){seen.add(b);st.push(b)}})}if(comp.length>best.length)best=comp});
    const keep=new Set(best);T.forEach(t=>{if(!keep.has(t))t.land=false});
    const land=best;if(land.length<T.length*.48||land.length>T.length*.72)continue;
    const seeds=[land[R()*land.length|0]];
    while(seeds.length<NREG){let bt=null,bd=-1;land.forEach(t=>{let m=1e9;seeds.forEach(s=>{const d=(t.x-s.x)**2+(t.y-s.y)**2;if(d<m)m=d});m*=.85+R()*.3;if(m>bd){bd=m;bt=t}});seeds.push(bt)}
    seeds.forEach((s,i)=>s.reg=i);
    let front=[...seeds];
    while(front.length){const nx=[];shuf(front,R).forEach(t=>t.n.forEach(b=>{if(b&&b.land&&b.reg<0){b.reg=t.reg;nx.push(b)}}));front=nx}
    const regs=Array.from({length:NREG},(_,i)=>({i,tiles:land.filter(t=>t.reg===i),nb:new Set()}));
    if(regs.some(r=>r.tiles.length<6))continue;
    let coast='',bord='';
    regs.forEach(r=>{r.out='';let sx=0,sy=0;r.tiles.forEach(t=>{sx+=t.x;sy+=t.y;t.n.forEach((b,k)=>{const a1=corner(t,k),a2=corner(t,k+1),seg=`M${f1(a1[0])} ${f1(a1[1])}L${f1(a2[0])} ${f1(a2[1])}`;
      if(!b||!b.land){coast+=seg;r.out+=seg}else if(b.reg!==t.reg){r.out+=seg;r.nb.add(b.reg);if(t.i<b.i)bord+=seg}})});
      r.cx=sx/r.tiles.length;r.cy=sy/r.tiles.length;let lt=r.tiles[0],ld=1e9;r.tiles.forEach(t=>{const inner=t.n.filter(b=>b&&b.reg===r.i).length;const d=(t.x-r.cx)**2+(t.y-r.cy)**2-inner*40;if(d<ld){ld=d;lt=t}});r.lx=lt.x;r.ly=lt.y;r.nb=[...r.nb]});
    let caps=[0,1,2],cd=-1;
    for(let a=0;a<NREG;a++)for(let b=a+1;b<NREG;b++)for(let c=b+1;c<NREG;c++){const D=(p,q)=>Math.hypot(regs[p].cx-regs[q].cx,regs[p].cy-regs[q].cy);const m=Math.min(D(a,b),D(a,c),D(b,c));if(m>cd){cd=m;caps=[a,b,c]}}
    caps=shuf(caps,R);
    const names=shuf(PLACES,R);regs.forEach((r,i)=>r.name=names[i]);
    return {T,land,regs,coast,bord,caps};
  }
  return null;
}

const head=x=>forms(x.en)[0];
function cloze(x){
  if(!x.s)return null;const h=head(x).split(' ')[0];if(h.length<3)return null;
  const stem=h.slice(0,Math.max(3,Math.min(h.length-1,6)));
  const m=x.s.match(new RegExp('\\b'+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*','i'));
  return m?x.s.replace(m[0],'§'):null;
}
function makeQ(kind){
  const it=G.items;let x=G.deck.shift();if(!x){G.deck=shuf(it);x=G.deck.shift()}
  const pool=it.filter(o=>o!==x),r=rnd();
  const mk=(type,o)=>Object.assign({x,type},o);
  if(kind==='type')return mk('Türkçesini gör, İngilizcesini yaz',{typing:1,text:x.tr,ans:head(x)});
  const dEN=n=>shuf(pool.map(head).filter(w=>w&&w!==head(x))).filter((v,i,a)=>a.indexOf(v)===i).slice(0,n);
  const dTR=n=>shuf(pool.map(o=>o.tr).filter(t=>t&&t.toLowerCase()!==x.tr.toLowerCase())).filter((v,i,a)=>a.indexOf(v)===i).slice(0,n);
  if(r<.14){const c=cloze(x);if(c){const d=dEN(3);if(d.length===3)return mk('Boşluğa hangisi gelir?',{sent:c,ans:head(x),opts:shuf([head(x),...d])})}}
  if(r<.26&&x.syn&&x.syn.length){const s=x.syn[0],d=dEN(4).filter(w=>!x.syn.includes(w)).slice(0,3);if(d.length===3)return mk('Eş anlamlısı hangisi?',{text:head(x),ans:s,opts:shuf([s,...d])})}
  if(r<.34&&x.s&&x.st){const d=shuf(pool.filter(o=>o.st&&o.st!==x.st).map(o=>o.st)).slice(0,3);if(d.length===3)return mk('Cümlenin anlamı hangisi?',{sent:x.s,ans:x.st,opts:shuf([x.st,...d])})}
  if(r<.42&&!G.noAudio)return mk('Dinle, anlamını seç',{listen:1,text:x.en,ans:x.tr,opts:shuf([x.tr,...dTR(3)])});
  const en=r<.72;
  return en?mk('İngilizce → Türkçe',{text:x.en,ans:x.tr,opts:shuf([x.tr,...dTR(3)])}):mk('Türkçe → İngilizce',{text:x.tr,ans:head(x),opts:shuf([head(x),...dEN(3)])});
}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

/* ---------- Soru: herkes aynı anda cevaplar ---------- */
function ask(q,who,o={}){
  const g=G;
  return new Promise(res=>{
    const meIn=who.includes(0)||(!!o.spectate&&G.pl[0].alive),lim=G.lim+(q.typing?5:0)+(q.sent?3:0);
    const all=[...new Set([...who,...(meIn?[0]:[])])];
    const out={};let done=false,picked=-1,used50=false;const t0=performance.now();
    const tag=o.duel?`<div class="vs"><div class="side">${emblem(o.duel.a)}<span>${esc(G.pl[o.duel.a].n)}</span></div><span class="x">VS</span><div class="side"><span>${esc(G.pl[o.duel.d].n)}${o.duel.cap?' ♜':''}</span>${emblem(o.duel.d)}</div></div>`:'';
    $('#panel').innerHTML=`${tag}<div class="qh"><span class="qtag ${o.duel&&who.includes(0)?'duel':o.spectate?'spec':''}">${esc(o.label||'')}</span><div class="tmr" id="tm"><svg viewBox="0 0 36 36"><circle class="tb" cx="18" cy="18" r="16"/><circle class="tf" id="tf" cx="18" cy="18" r="16"/></svg><b id="tt">${lim}</b></div></div>
    <div class="qt">${esc(q.type)}</div>
    ${q.listen?`<button class="lis" data-say="${esc(q.text)}">${ic('sound')}Kelimeyi dinle</button>`:q.sent?`<div class="qs">${esc(q.sent).replace('§','<span class="blank"></span>')}</div>`:`<div class="qw">${esc(q.text)}</div>`}
    ${q.typing?`<form class="qtype" id="qf" autocomplete="off"><input class="input" id="qi" placeholder="İngilizcesini yaz" autocapitalize="off" spellcheck="false"><button class="btn btn-p">Gönder</button></form>`:`<div class="qo">${q.opts.map((t,i)=>`<button data-o="${i}"><kbd>${i+1}</kbd><span>${esc(t)}</span></button>`).join('')}</div>`}
    ${!q.typing?`<div class="qj"><button class="jk" data-j="yari" ${G.pl[0].jok.yari?'':'disabled'}>${svgI('half')}<span>Yarı yarıya</span><i>${G.pl[0].jok.yari}</i></button>${o.defend?`<button class="jk ${G.shield?'use':''}" data-j="kalkan" ${G.pl[0].jok.kalkan||G.shield?'':'disabled'}>${svgI('shield')}<span>Kalkan</span><i>${G.pl[0].jok.kalkan}</i></button>`:''}</div>`:''}
    <div class="qps">${all.map(i=>`<div class="qp" id="qp${i}"><i style="background:${col(i)}"></i>${esc(G.pl[i].n)}<span class="r">düşünüyor…</span></div>`).join('')}</div><div id="qr"></div>`;
    all.forEach(i=>{const a=$('#an'+i);if(a){a.className='ans wait';a.textContent=''}});
    if(q.listen)setTimeout(()=>KA.speak(q.text),250);
    const set=(i,txt,c)=>{const e=$('#qp'+i+' .r');if(e){e.textContent=txt;e.className='r '+(c||'')}};
    const timers=[];
    who.filter(i=>i!==0).forEach(i=>{const b=botAns(i,q);timers.push(setTimeout(()=>{if(done||stopped(g))return;out[i]=b;set(i,'cevapladı');const a=$('#an'+i);if(a){a.className='ans lock';a.textContent='✓'}check()},b.t*1000))});
    const ring=$('#tf');let raf;
    const tick=()=>{if(done||stopped(g))return;const el=(performance.now()-t0)/1000,left=Math.max(0,lim-el);ring.style.strokeDashoffset=String(100.5*(1-left/lim));$('#tt').textContent=Math.ceil(left);$('#tm').classList.toggle('low',left<4);if(left<=0)return finish();raf=requestAnimationFrame(tick)};tick();
    const mine=ok=>{if(out[0]||done)return;const t=+((performance.now()-t0)/1000).toFixed(1);out[0]={ok,t};set(0,t+' sn');const a=$('#an0');if(a){a.className='ans lock';a.textContent='✓'}check()};
    G.key=e=>{if(done){if(e.key===' '||e.key==='Enter'){e.preventDefault();G.skip&&G.skip()}return}if(!meIn||q.typing)return;const n=+e.key;if(n>=1&&n<=4){const b=document.querySelector(`[data-o="${n-1}"]`);if(b&&!b.classList.contains('gone'))b.click()}};
    if(meIn&&!q.typing)document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(out[0]||done)return;picked=+b.dataset.o;b.classList.add('pick');document.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);mine(q.opts[picked]===q.ans)});
    if(!meIn)document.querySelectorAll('[data-o]').forEach(b=>b.disabled=true);
    if(meIn&&q.typing){const f=$('#qf'),inp=$('#qi');setTimeout(()=>inp.focus({preventScroll:true}),60);f.onsubmit=e=>{e.preventDefault();if(out[0])return;inp.disabled=true;mine(typedOk(inp.value,q.x))}}
    const jy=document.querySelector('[data-j="yari"]');if(jy)jy.onclick=()=>{if(used50||out[0]||!meIn||!G.pl[0].jok.yari)return;used50=true;G.pl[0].jok.yari--;shuf(q.opts.map((t,i)=>i).filter(i=>q.opts[i]!==q.ans)).slice(0,2).forEach(i=>document.querySelector(`[data-o="${i}"]`).classList.add('gone'));jy.disabled=true;jy.querySelector('i').textContent=G.pl[0].jok.yari;drawJokers();KA.sfx.tick()};
    const jk=document.querySelector('[data-j="kalkan"]');if(jk)jk.onclick=()=>{if(G.shield||!G.pl[0].jok.kalkan)return;G.shield=true;G.pl[0].jok.kalkan--;jk.classList.add('use');jk.querySelector('i').textContent=G.pl[0].jok.kalkan;drawJokers();KA.sfx.tick();KA.toast('Kalkan hazır: bu düelloyu kaybetsen de bölgen gitmez.')};
    function check(){if(all.every(i=>out[i]))finish()}
    function finish(){
      if(done||stopped(g))return;done=true;cancelAnimationFrame(raf);timers.forEach(clearTimeout);
      all.forEach(i=>{if(!out[i])out[i]={ok:false,t:lim}});
      if(!q.typing)document.querySelectorAll('[data-o]').forEach(b=>{const i=+b.dataset.o;b.disabled=true;if(q.opts[i]===q.ans)b.classList.add('ok');else if(i===picked)b.classList.add('no')});
      if(q.typing&&meIn){const inp=$('#qi');inp.disabled=true;inp.classList.add(out[0].ok?'ok':'no')}
      all.forEach(i=>{const r=out[i],a=$('#an'+i);set(i,r.ok?`Doğru · ${r.t} sn`:'Yanlış',r.ok?'g':'b');if(a){a.className='ans '+(r.ok?'ok':'no');a.textContent=r.ok?'✓':'✕'}});
      const x=q.x;let showLearn=!meIn&&q.typing;
      if(meIn){const me=G.pl[0];G.stats.tot++;
        if(out[0].ok){G.stats.ok++;me.streak++;G.stats.best=Math.max(G.stats.best,me.streak);KA.sfx.ok();
          if(me.streak%3===0){const k=shuf(Object.keys(JOK))[0];me.jok[k]++;KA.toast(`${me.streak}'li seri! Ödül: ${JOK[k].n}`);drawJokers()}}
        else{me.streak=0;KA.sfx.bad();G.missed.push(x)}
        showLearn=!out[0].ok||q.listen||q.typing}
      if(showLearn)$('#qr').innerHTML=`<div class="learn"><b>${esc(head(x))}</b> — ${esc(x.tr)}${x.s?`<div class="ex">${esc(x.s)}</div>`:''}<div class="row"><button class="btn btn-ghost btn-sm" data-say="${esc(head(x))}">${ic('sound')}Dinle</button>${meIn&&!out[0].ok?`<button class="btn btn-ghost btn-sm" data-add="${esc(x.en)}">${ic('plus')}Listeme ekle</button>`:''}</div></div>`;
      drawPlayers();
      const hold=meIn&&!out[0].ok?3800:q.listen||q.typing?2600:1700;
      $('#qr').insertAdjacentHTML('beforeend',`<button class="btn btn-p nextb" id="nx">Devam ${ic('arrow')}<i style="animation-duration:${hold}ms"></i></button>`);
      let fin=false;const go=()=>{if(fin||stopped(g))return;fin=true;G.key=null;G.skip=null;all.forEach(i=>{const a=$('#an'+i);if(a)a.className='ans'});res({out})};
      G.skip=go;$('#nx').onclick=go;setTimeout(go,hold);
    }
  });
}
const rank=(out,ids)=>ids.filter(i=>out[i]&&out[i].ok).sort((a,b)=>out[a].t-out[b].t);

/* ---------- Bölge seçimi ---------- */
function pickRegion(list,title,text,o={}){
  const g=G;
  return new Promise(r=>{
    refresh(list,o.attack?'tg':'');
    const me=G.pl[0];
    idle(title,text,o.attack&&me.jok.cift?`<button class="btn btn-ghost dblbtn" id="dbl">${svgI('sword')} Çift saldırı kullan (${me.jok.cift})</button>`:'');
    const d=$('#dbl');if(d)d.onclick=()=>{if(G.dbl||!me.jok.cift)return;G.dbl=true;me.jok.cift--;drawJokers();d.disabled=true;d.textContent='Çift saldırı hazır: bu tur iki kez saldıracaksın';KA.sfx.tick()};
    const svg=$('#map');
    const on=e=>{const t=e.target.closest('.rg.sel');if(!t||stopped(g))return;svg.removeEventListener('click',on);r(+t.dataset.r)};
    svg.addEventListener('click',on);
    const pan=$('#panel');if(innerWidth<=900&&pan){const m=$('#map').getBoundingClientRect();if(m.top<60||m.bottom>innerHeight-pan.offsetHeight)scrollTo({top:scrollY+m.top-64,behavior:'smooth'})}
  });
}
function botPick(p,list){
  const sc=r=>G.M.regs[r].nb.filter(n=>G.owner[n]===p).length*2+rnd()*2.5;
  return list.reduce((b,r)=>sc(r)>sc(b)?r:b,list[0]);
}
function botTarget(p,tg){
  const agg=PL[p].agg;
  const sc=r=>{const o=G.owner[r],isCap=G.pl[o].cap===r;let s=rnd()*3;if(o===0)s+=agg*3;if(isCap)s+=G.pl[o].tw===1?6:1.2-agg;s+=G.val[r]/400;if(score(o)>score(p))s+=1;return s};
  return tg.reduce((b,r)=>sc(r)>sc(b)?r:b,tg[0]);
}

/* ---------- Oyun akışı ---------- */
function newGame(){
  const daily=CFG.mode==='daily';
  rnd=daily?seeded(daySeed()):Math.random;
  const M=genMap(daily?seeded(daySeed()+11):Math.random);
  const items=words(),df=DIFF[CFG.diff];
  G={M,items,deck:shuf(items),df,lim:df.lim,turn:-1,feed:[],missed:[],shield:false,dbl:false,noAudio:false,
    stats:{ok:0,tot:0,caps:0,razed:0,def:0,spec:0,lost:0,best:0},
    owner:Array(NREG).fill(-1),val:Array(NREG).fill(0),
    pl:PL.map((p,i)=>({n:p.n,alive:1,tw:3,bonus:0,streak:0,cap:M.caps[i],jok:{yari:1,kalkan:1,cift:1}}))};
  M.caps.forEach((r,i)=>{G.owner[r]=i;G.val[r]=1000});
  KA.store.set('ka_fetih_cfg',CFG);
  document.body.classList.add('ingame');
  $('#main').innerHTML=`<div class="game"><div><div class="pls" id="pls"></div>
  <section class="card board" id="board"><div class="bhead"><div><span class="eyebrow" id="ph">Hazırlık</span><b id="rd">${esc(MODES[CFG.mode].n)} · ${esc(DIFF[CFG.diff].n)}</b></div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="joks" id="jk"></div><button class="ka-icon-btn" data-a="quit" title="Oyundan çık" aria-label="Oyundan çık">${ic('x')}</button></div></div>
  <div class="mapw">${mapSVG(M,'map')}<div class="banner" id="bn"></div></div><div class="logline" id="log">${ic('flag')}<span>Ordular hazır. Kaleli bölge senin başkentin.</span></div></section></div>
  <aside class="card panel" id="panel"></aside></div>`;
  refresh();idle('Arenaya hoş geldin','Her doğru cevap topraklarını büyütür. Hızlı ol, rakipler de cevaplıyor.');
  play(G);
}
async function play(g){
  const setPh=(p,r)=>{$('#ph').textContent=p;$('#rd').textContent=r||''};
  ringAt(G.pl[0].cap,0);floatAt(G.pl[0].cap,'Başkentin','g');
  await banner('Yayılma','En hızlı doğru cevap 2, ikinci 1 bölge seçer');if(stopped(g))return;
  let round=0;
  while(empty().length&&round<12){
    round++;setPh('Yayılma',`Tur ${round} · ${empty().length} boş bölge`);
    const typing=round%4===0;
    const {out}=await ask(makeQ(typing?'type':'mc'),alive(),{label:typing?'Yazma turu · en hızlı doğru yazan kazanır':'Hız turu · herkes aynı soruyu cevaplıyor'});if(stopped(g))return;
    const order=rank(out,alive());
    if(!order.length){log('Kimse bilemedi, bu tur kimse toprak alamadı.',-1);continue}
    for(const [p,n] of [[order[0],2],[order[1],1]]){
      if(p==null)continue;
      for(let k=0;k<n&&empty().length;k++){
        const list=nearOwn(p,empty());let r;
        if(p===0)r=await pickRegion(list,`Bölge seç · ${n-k} hakkın var`,'Kesik çizgili bölgelerden birine dokun. Kendi toprağına komşu olanlar seni güçlendirir.');
        else{refresh(list);idle(`${G.pl[p].n} bölge seçiyor…`,'');await sleep(520);r=botPick(p,list)}
        if(stopped(g))return;
        claim(p,r,200);log(`${G.pl[p].n} ${G.M.regs[r].name} bölgesini aldı.`,p);await sleep(280);if(stopped(g))return;
      }
    }
  }
  empty().forEach(r=>{const n=G.M.regs[r].nb.map(x=>G.owner[x]).filter(x=>x>=0);const p=n.length?n[rnd()*n.length|0]:alive()[0];G.owner[r]=p;G.val[r]=200});
  refresh();
  const W=MODES[CFG.mode].war;
  for(let w=1;w<=W;w++){
    const order=alive().sort((a,b)=>score(a)-score(b));
    await banner(W>1?`Savaş · ${w}. tur`:'Savaş',w===1?'Komşu düşman bölgelerine saldır, başkentleri kuşat':'Sıra puanı düşük olandan başlar');if(stopped(g))return;
    for(const p of order){
      if(!G.pl[p].alive)continue;if(alive().length<2)break;
      let attacks=1;
      while(attacks-->0){
        const tg=targets(p);if(!tg.length){log(`${G.pl[p].n} saldıracak komşu bulamadı.`,p);break}
        G.turn=p;setPh('Savaş',`Tur ${w}/${W} · sıra: ${G.pl[p].n}`);
        let h;
        if(p===0){h=await pickRegion(tg,'Saldırı sırası sende','Sarı çizgili düşman bölgelerinden birini seç. Başkenti düşürmek için üç kulesini de yıkman gerekir.',{attack:1});if(G.dbl){G.dbl=false;attacks++}}
        else{refresh(tg,'tg');idle(`${G.pl[p].n} saldırı hazırlıyor…`,'');await sleep(700);h=botTarget(p,tg)}
        if(stopped(g))return;
        await duel(p,h,g);if(stopped(g))return;
        if(alive().length<2)break;
      }
      G.turn=-1;
    }
    if(alive().length<2)break;
  }
  if(!stopped(g))end();
}
async function duel(a,h,g){
  const d=G.owner[h],isCap=G.pl[d].cap===h,R=G.M.regs;
  const dist=x=>Math.hypot(R[x].lx-R[h].lx,R[x].ly-R[h].ly);
  const from=R[h].nb.filter(n=>G.owner[n]===a).sort((x,y)=>dist(x)-dist(y))[0];
  refresh([h],'tg');const rm=from!=null?arrow(from,h,a):()=>{};KA.sfx.hit();
  log(`${G.pl[a].n}, ${G.pl[d].n} ordusunun ${isCap?'başkentine':R[h].name+' bölgesine'} saldırıyor!`,a);
  const spectate=a!==0&&d!==0&&G.pl[0].alive;
  const lab=a===0?'Saldırı düellosu · rakipten hızlı ve doğru ol':d===0?'Savunma düellosu · bölgeni koru':'Seyirci sorusu · bilirsen +50 puan';
  const {out}=await ask(makeQ('mc'),[a,d],{duel:{a,d,cap:isCap},spectate,defend:d===0,label:lab});
  rm();if(stopped(g))return;
  if(spectate&&out[0]&&out[0].ok){G.pl[0].bonus+=50;G.stats.spec++;floatAt(G.pl[0].cap,'+50 seyirci','g')}
  const A=out[a],D=out[d],win=A.ok&&(!D.ok||A.t<D.t);
  if(win){
    if(d===0&&G.shield){G.shield=false;floatAt(h,'Kalkan!','g');log('Kalkanın saldırıyı durdurdu.',0);KA.sfx.ok()}
    else if(isCap){
      G.pl[d].tw--;const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');KA.sfx.hit();floatAt(h,'−1 kule','r');
      if(G.pl[d].tw<=0){
        G.pl[d].alive=0;own(d).forEach(r=>{G.owner[r]=a});if(a===0)G.stats.razed++;if(d===0)G.stats.lost++;
        refresh();await banner(`${G.pl[d].n} düştü!`,`Bütün toprakları ${G.pl[a].n} ordusuna geçti`,1800);
        log(`${G.pl[a].n} başkenti düşürdü, ${G.pl[d].n} oyundan çıktı.`,a);
      }else log(`${G.pl[d].n} başkentinin bir kulesi yıkıldı (${G.pl[d].tw} kule kaldı).`,a);
    }else{if(a===0)G.stats.caps++;if(d===0)G.stats.lost++;claim(a,h);log(`${G.pl[a].n} ${R[h].name} bölgesini fethetti.`,a)}
  }else{
    if(D.ok){G.val[h]+=100;if(d===0)G.stats.def++;floatAt(h,'+100 savunma',d===0?'g':'');log(`${G.pl[d].n} ${R[h].name} bölgesini savundu, değeri arttı.`,d)}
    else log('İki taraf da bilemedi, sınırlar değişmedi.',-1);
  }
  G.shield=false;refresh();await sleep(500);
}
function end(){
  KA.closeLookup();document.body.classList.remove('ingame');
  const order=[0,1,2].sort((a,b)=>score(b)-score(a)),won=order[0]===0,my=score(0),st=G.stats;
  const medals=[];

  if(st.tot>=8&&st.ok===st.tot)medals.push(['star','Kusursuz']);
  if(st.best>=5)medals.push(['flame','Seri Ustası']);
  if(st.razed)medals.push(['sword','Kale Yıkan']);

  if(st.spec>=2)medals.push(['spark','Keskin Gözlemci']);

  <p class="mut" style="margin:0">${my} puan · +${xp} XP${after.i>before.i?` · <b style="color:var(--acc2)">Yeni rütbe: ${esc(after.n)}</b>`:` · Rütben: ${esc(after.n)}`}</p>
  <div class="podium">${[order[1],order[0],order[2]].map((i,k)=>`<div style="background:${col(i)};min-height:${hgt[[1,0,2][k]]}px">${emblem(i,1)}<b>${score(i)}</b><small>${['2.','1.','3.'][k]} · ${esc(G.pl[i].n)}</small></div>`).join('')}</div>
  ${medals.length?`<div class="medals">${medals.map(([i,n],k)=>`<span class="medal" style="animation-delay:${k*.12}s"><i>${ic(i)}</i>${esc(n)}</span>`).join('')}</div>`:''}
  <div class="tiles"><div><b>%${acc}</b><span>${st.ok}/${st.tot} doğru</span></div><div><b>${st.best}</b><span>en uzun seri</span></div><div><b>${st.caps+st.razed}</b><span>fetih</span></div><div><b>${st.def}</b><span>savunma</span></div></div>
  <div class="row" style="justify-content:center"><button class="btn btn-p btn-lg" data-a="start" id="again">${ic('reset')}Rövanş</button><button class="btn btn-ghost btn-lg" data-a="setup">Ayarlar</button><a class="btn btn-ghost btn-lg" href="./">Ana sayfa</a></div>
  ${missed.length?`<div class="missed"><h3 style="margin:0 0 6px">Tekrar etmen gereken kelimeler</h3>${missed.map(x=>`<div><button class="ka-icon-btn" data-say="${esc(head(x))}" aria-label="Dinle">${ic('sound')}</button><b>${esc(head(x))}</b><span class="mut grow">${esc(x.tr)}</span><button class="btn btn-ghost btn-sm" data-add="${esc(x.en)}">${ic('plus')}Listeme ekle</button></div>`).join('')}</div>`:''}</section>`;
  LASTITEMS=G.items;G=null;scrollTo(0,0);
}
let LASTITEMS=[];
function confetti(){const c=document.createElement('div');c.className='conf';const C=['#0f766e','#14b8a6','#fbbf24','#f59e0b','#c0392b'];for(let i=0;i<80;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=C[i%5];s.style.animationDelay=Math.random()*.8+'s';c.appendChild(s)}document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}

/* ---------- Kurulum ekranı ---------- */
function setup(){
  G=null;document.body.classList.remove('ingame');
  const packs=KA.listPacks().filter(p=>(p.items||[]).filter(x=>x.tr).length>=8);
  if(!CFG.pack||!packs.find(p=>p.id===CFG.pack))CFG.pack=(packs.find(p=>p.id===KA.activeId())||packs[0]||{}).id||'';
  const R=rankOf(REC.xp),pct=Math.min(100,Math.round((REC.xp-R.lo)/(R.hi-R.lo)*100));
  const M=genMap(CFG.mode==='daily'?seeded(daySeed()+11):Math.random);
  $('#main').innerHTML=`<div class="setup">
  <section class="card hero"><div class="hero-map" id="pv">${M?mapSVG(M):''}</div>
    <div class="hero-txt"><span class="eyebrow">Strateji · kelime · hız</span><h1>Arena Fethi</h1><p>Kelimelerin senin ordun. Her maçta yeni bir Akdeniz haritası kurulur: hızlı cevaplarla toprak kap, jokerlerini doğru anda kullan, rakip başkentlerin kulelerini tek tek yık.</p></div>
    <div class="steps"><div><b>${ic('flag')}Yayılma</b>Herkes aynı soruyu cevaplar. En hızlı doğru 2, ikinci 1 bölge alır.</div><div><b>${ic('sword')}Düello</b>Komşu düşmana saldır. Hızlı ve doğru olan bölgeyi kazanır.</div><div><b>${ic('shield')}Jokerler</b>Yarı yarıya, Kalkan ve Çift saldırı. Her 3'lü seri yeni joker verir.</div><div><b>${ic('crown')}Başkent</b>3 kuleyi yıkan, o ordunun bütün topraklarını alır.</div></div>
    <div class="rankcard">${emblem(0)}<div class="rk"><span class="eyebrow" style="margin:0">Rütben</span><b>${esc(R.n)}</b><div class="xpbar"><i style="width:${pct}%"></i></div><div class="recs"><span>${REC.xp} XP${R.next!=='—'?` · ${esc(R.next)} için ${R.hi-REC.xp} XP`:''}</span></div></div>
      <div class="recs" style="flex-direction:column;gap:2px;text-align:right"><span><b>${REC.games}</b> maç</span><span><b>${REC.games?Math.round(REC.wins/REC.games*100)+'%':'—'}</b> galibiyet</span><span><b>${REC.best}</b> en iyi</span></div></div>
  </section>
  <section class="card cfg">
    <div><h3>Oyun modu</h3><div class="opts3">${Object.entries(MODES).map(([k,m])=>`<button class="choice ${CFG.mode===k?'on':''}" data-gm="${k}"><b>${ic(m.ic)}${m.n}</b><span>${m.d}${k==='daily'&&REC.daily[today()]!=null?` · bugün: ${REC.daily[today()]}`:''}</span></button>`).join('')}</div></div>
    <div><h3>Rakip seviyesi</h3><div class="opts3">${Object.entries(DIFF).map(([k,m])=>`<button class="choice ${CFG.diff===k?'on':''}" data-diff="${k}"><b>${m.n}</b><span>${m.d} · ${m.lim} sn</span></button>`).join('')}</div></div>
    <div><h3>Kelimeler</h3>${CFG.mode==='daily'?'<p class="mut" style="margin:0;font-size:14px">Günün Fethi herkes için aynı harita ve akademik kelimelerle oynanır.</p>':packs.length?`<select class="select" id="pk">${packs.map(p=>`<option value="${esc(p.id)}" ${p.id===CFG.pack?'selected':''}>${esc(p.name)} · ${(p.items||[]).filter(x=>x.tr).length} kelime</option>`).join('')}</select>`:'<p class="mut" style="margin:0;font-size:14px">Henüz en az 8 anlamlı kelimesi olan bir listen yok; hazır akademik kelimelerle oynayacaksın. <a href="./">Liste oluştur</a></p>'}</div>
    <div><h3>Ordular</h3><div class="row" style="gap:12px">${PL.map((p,i)=>`<span class="row" style="gap:6px;font-weight:800;font-size:13.5px;flex-wrap:nowrap"><span style="width:22px;height:25px;display:inline-flex">${emblem(i)}</span>${esc(p.n)}</span>`).join('')}</div></div>
    <button class="btn btn-p btn-lg startbtn" data-a="start">${ic('sword')}Arenaya gir</button>
  </section></div>`;
  if(M){const pv=$('#pv svg');M.caps.forEach((r,i)=>{pv.querySelector(`.rg[data-r="${r}"]`).classList.add('o'+i);const C=M.regs[r];pv.querySelector('.lbs').insertAdjacentHTML('beforeend',castle(C.lx,C.ly+4,'#fff'))});
    pv.querySelector('.lbs').insertAdjacentHTML('beforeend',M.regs.filter(r=>!M.caps.includes(r.i)).map(r=>`<text class="lb lbn" x="${f1(r.lx)}" y="${f1(r.ly+3)}">${esc(r.name)}</text>`).join(''))}
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const m=t.closest('[data-gm]');if(m&&!G){CFG.mode=m.dataset.gm;KA.store.set('ka_fetih_cfg',CFG);setup();return}
  const d=t.closest('[data-diff]');if(d&&!G){CFG.diff=d.dataset.diff;KA.store.set('ka_fetih_cfg',CFG);setup();return}
  const a=t.closest('[data-a]');if(a){const k=a.dataset.a;if(k==='start'){newGame();scrollTo(0,0)}else if(k==='setup')setup();else if(k==='quit'){if(confirm('Oyundan çıkılsın mı? Bu maç kaydedilmez.'))setup()}return}
  const ad=t.closest('[data-add]');if(ad){const src=(G?G.items:LASTITEMS).concat(words());const x=src.find(o=>o.en===ad.dataset.add);if(x){const r=KA.addUnknown(x.en,x.tr,{s:x.s||'',st:x.st||'',syn:x.syn||[]});KA.toast(r==='var'?'Bu kelime zaten listende.':'“Bilmediklerim” listesine eklendi.');ad.disabled=true}return}
  const s=t.closest('[data-say]');if(s)KA.speak(s.dataset.say);
});
document.addEventListener('change',e=>{if(e.target.id==='pk'){CFG.pack=e.target.value;KA.store.set('ka_fetih_cfg',CFG)}});
document.addEventListener('keydown',e=>{if(!G||!G.key||e.metaKey||e.ctrlKey)return;if(e.target.matches&&e.target.matches('input')&&e.key!=='Enter')return;G.key(e)});
KA.nav('fetih.html',{stats:true});
setup();
})();
</script>
</body>
</html>
