<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahkeme · Kelime Arenası</title>
<meta name="theme-color" content="#0f766e">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css?v=19">
<style>
:root{--wood:#5b3a1e;--wood2:#7a4f2a;--paper:#fbf8f1;--ink9:#1f1b16;--brass:#c9a227}
:root[data-mode=dark]{--paper:#f1ece0}
.office{position:relative;border-radius:26px;overflow:hidden;padding:26px 24px;color:#f6efe3;background:linear-gradient(160deg,#2b1d12,#4a301b 60%,#3a2615);box-shadow:var(--sh2)}
.office::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,162,39,.25),transparent);pointer-events:none}
.office h1{font-family:Fraunces,serif;font-size:clamp(32px,5.6vw,52px);margin:6px 0 4px;line-height:1.02}
.office .sub{color:#d8c7ad;max-width:62ch}
.scale{position:absolute;right:26px;top:22px;width:92px;opacity:.9;color:var(--brass)}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.cs{position:relative;border:0;text-align:left;font-family:inherit;border-radius:16px;padding:18px 16px 16px;background:var(--paper);color:var(--ink9);box-shadow:0 10px 0 var(--wood2),var(--sh2);display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .25s var(--spring)}
.cs:hover:not(.soon){transform:translateY(-5px)}
.cs .no{font:800 10.5px "Plus Jakarta Sans";letter-spacing:.14em;color:#8a6a3a}
.cs b{font-family:Fraunces,serif;font-size:23px;line-height:1.1}
.cs .d{font-size:13.5px;color:#4b4335;line-height:1.45}
.cs .m{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:#6b5a3a}
.cs .st{align-self:flex-start;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#efe6d4}
.cs .st.ok{background:#15803d;color:#fff}.cs .st.on{background:var(--ink9);color:#fff}
.cs .seal{position:absolute;right:12px;top:12px;rotate:12deg;font-family:Fraunces,serif;font-weight:900;font-size:14px;letter-spacing:.08em;color:#15803d;border:3px double #15803d;border-radius:6px;padding:1px 8px}
.cs.soon{background:repeating-linear-gradient(-45deg,#efe6d4 0 12px,#e7dcc6 12px 24px);opacity:.7;box-shadow:0 10px 0 #a58a62}
/* HUD */
.ahud{position:sticky;top:64px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);box-shadow:0 0 0 1.5px var(--line) inset,var(--sh1);margin-bottom:14px}
.ahud .ph{display:flex;gap:6px;flex-wrap:wrap}
.ahud .ph span{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--mut)}
.ahud .ph span.on{background:var(--p);color:var(--p-ink)}.ahud .ph span.ok{background:var(--ok-soft);color:var(--ok)}
.ahud .pill{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);border:0}
.ahud .pill b{color:var(--ink)}
.ahud .sp{flex:1}
/* mentor */
.mentor{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset,var(--sh1);margin-bottom:14px;animation:kaRise .45s var(--out)}
.mentor i{flex:0 0 54px;height:54px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--brass)}
.mentor i svg{width:100%;height:100%;display:block}
.mentor small{font-size:11px;font-weight:800;letter-spacing:.1em;color:#a16207}
.mentor p{margin:2px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink)}
.mentor p b{color:var(--ink)}
/* belge */
.prep{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.95fr);gap:16px;align-items:start}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dtabs button{border:0;border-radius:12px 12px 4px 4px;padding:8px 12px;font-weight:800;font-size:13px;background:var(--soft);color:var(--ink2)}
.dtabs button.on{background:var(--paper);color:var(--ink9);box-shadow:0 -3px 0 var(--brass) inset}
.paper{position:relative;background:var(--paper);color:var(--ink9);border-radius:6px;padding:24px 24px;box-shadow:var(--sh2);font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.75}
.paper .hd{font:800 12px "Plus Jakarta Sans";letter-spacing:.12em;text-transform:uppercase;color:#6b5a3a;border-bottom:2px solid var(--ink9);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paper .cl{display:block;margin-bottom:10px;border-radius:6px;padding:2px 6px 2px 46px;position:relative;transition:background .3s}
.paper .cl em{position:absolute;left:4px;top:3px;font-style:normal;font:800 11.5px "Plus Jakarta Sans";color:#8a6a3a;background:#efe6d4;border-radius:6px;padding:2px 6px}
.paper.plain .cl{padding-left:6px}
.paper .cl.hl{background:color-mix(in srgb,var(--acc) 38%,transparent)}
.paper .cl.got{box-shadow:inset 3px 0 0 var(--ok)}
.gl{border-bottom:2px dotted #a16207;cursor:pointer}.gl.got{border-bottom-style:solid;border-color:var(--p)}
.gpop{position:fixed;z-index:95;max-width:240px;padding:9px 12px;border-radius:12px;background:#1f2937;color:#fff;font-size:13.5px;line-height:1.35;box-shadow:var(--sh2);animation:kaPop .25s var(--spring);pointer-events:none}
.gpop b{display:block;font-size:15px}
.qcard{padding:18px 20px;position:sticky;top:132px}
.qty{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--p) 12%,var(--card));color:var(--p)}
.qcard h3{margin:10px 0 12px;font-size:18.5px;line-height:1.35}
.qo{display:grid;gap:8px}
.qo button{--d:var(--line2);display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:13px;padding:11px 13px;font-size:15px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s;font-family:inherit}
.qo button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.qo button kbd{flex:0 0 22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:800 12px "Plus Jakarta Sans"}
.qo button.ok{--d:color-mix(in srgb,var(--ok) 66%,#000);box-shadow:0 0 0 2px var(--ok) inset,0 4px 0 var(--d);background:var(--ok-soft)}
.qo button.no{opacity:.55;box-shadow:0 0 0 2px var(--bad) inset;background:var(--bad-soft);animation:kaShake .45s}
.why{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--soft);font-size:14.5px;line-height:1.5;animation:kaRise .4s var(--out)}
.why b{color:var(--ink)}
.card2{position:relative;background:#fff;color:var(--ink9);border-radius:10px;padding:12px 14px 10px 16px;box-shadow:0 0 0 1.5px #e5dccb inset,0 6px 14px rgba(0,0,0,.08);font-size:13.5px;line-height:1.4}
.card2::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brass)}
.card2 b{display:block;font-size:14px;margin-bottom:2px}
.card2 q{display:block;margin-top:5px;font-family:Georgia,serif;font-style:italic;font-size:12.5px;color:#6b5a3a;quotes:none}
.card2.fresh{animation:kaStamp .55s var(--spring)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.qprog{display:flex;gap:4px}.qprog i{width:18px;height:6px;border-radius:4px;background:var(--soft)}.qprog i.on{background:var(--p)}
/* duruşma */
.court{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#3b2614,#5b3a1e);padding:18px 18px 0;box-shadow:var(--sh2);color:#f6efe3}
.court .bench{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.court .who{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#d8c7ad}
.court .who i{width:74px;height:74px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #7a4f2a}
.court .who i svg{width:100%;height:100%;display:block}
.court .who.judge i{width:90px;height:90px;box-shadow:0 0 0 4px var(--brass)}
.court .who.spk i{box-shadow:0 0 0 4px #fde68a,0 0 24px rgba(253,230,138,.5)}
.court .desk{margin-top:12px;height:22px;background:linear-gradient(180deg,#8a5a2e,#6b4220);border-radius:10px 10px 0 0}
.jury{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0 12px}
.jury svg{width:22px;height:26px;transition:color .4s}
.jury .j{color:#7a6650}.jury .j.on{color:#5eead4}
.jlab{text-align:center;font-size:12px;font-weight:800;color:#d8c7ad;padding-bottom:12px}
.stmt{margin:16px 0 10px;padding:18px 20px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset;position:relative}
.stmt .by{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.stmt .say{font-family:Fraunces,serif;font-size:clamp(20px,2.8vw,26px);line-height:1.45;margin-top:6px}
.stmt .say .w{border-radius:5px;transition:background .15s}
.pickw .say .w{cursor:pointer}
.pickw .say .w:hover{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.stmt .say .w.x{background:var(--bad);color:#fff;padding:0 3px}
.stmt .say .w.no{background:var(--bad-soft);animation:kaShake .4s}
.stmt .tr{margin-top:8px;font-size:14px;color:var(--ink2);font-style:italic}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{justify-content:center;padding:14px}
.btn-obj{background:var(--bad)!important;color:#fff!important;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)!important}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cmp div{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.cmp .a{background:var(--bad-soft)}.cmp .b{background:var(--ok-soft)}
.cmp small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mut);margin-bottom:3px}
.cmp mark{background:transparent;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;color:inherit}
.ruling{margin-top:12px;padding:14px 16px;border-radius:16px;animation:kaRise .4s var(--out)}
.ruling.ok{background:color-mix(in srgb,var(--ok) 10%,var(--card));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ok) 35%,transparent) inset}
.ruling.bad{background:color-mix(in srgb,var(--bad) 8%,var(--card));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bad) 35%,transparent) inset}
.ruling .say{font-family:Fraunces,serif;font-size:19px}
.ruling p{margin:6px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.slam{position:fixed;inset:0;z-index:99;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(225,29,72,.22),transparent 60%)}
.slam span{font-family:Fraunces,serif;font-weight:900;font-size:clamp(48px,11vw,110px);letter-spacing:.03em;color:#fff;background:var(--bad);padding:6px 26px;border-radius:16px;rotate:-6deg;box-shadow:0 10px 0 color-mix(in srgb,var(--bad) 55%,#000),0 20px 50px rgba(0,0,0,.4);animation:kaSlam .45s var(--spring)}
.slam.g span{background:#a16207;box-shadow:0 10px 0 #713f12,0 20px 50px rgba(0,0,0,.4)}
body.quake .ka-wrap{animation:quake .5s}
@keyframes quake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.sheet{position:fixed;inset:0;z-index:85;background:rgba(10,15,20,.55);display:grid;align-items:end;justify-items:center}
.sheet .in{width:min(760px,100%);max-height:82vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 28px;animation:sheetUp .35s var(--out)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
.sheet .card2{cursor:pointer;border:0;text-align:left;font-family:inherit;width:100%}
.sheet .card2:hover{box-shadow:0 0 0 2px var(--brass) inset,0 6px 14px rgba(0,0,0,.08)}
/* kapanış */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.slot{border:2px dashed var(--line2);border-radius:16px;padding:12px;min-height:130px;background:var(--card);text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.slot h4{margin:0;font:800 12px "Plus Jakarta Sans";letter-spacing:.1em;text-transform:uppercase;color:#a16207}
.slot p{margin:0;font-size:12.5px;color:var(--mut)}
.slot .card2{margin-top:auto}
.slot.ok{border:2px solid var(--ok)}.slot.bad{border:2px solid var(--bad);animation:kaShake .45s}
.copts{display:grid;gap:10px;margin-top:12px}
.copts button{--d:var(--line2);border:0;border-radius:14px;padding:14px 16px;text-align:left;font-family:Georgia,serif;font-size:16px;line-height:1.5;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d)}
.copts button.on{box-shadow:0 0 0 2.5px var(--p) inset,0 4px 0 color-mix(in srgb,var(--p) 60%,#000);background:color-mix(in srgb,var(--p) 6%,var(--card))}
.copts button.no{box-shadow:0 0 0 2px var(--bad) inset;background:var(--bad-soft);opacity:.7}
/* karar */
.verdict{max-width:820px;margin:0 auto;padding:28px 24px;text-align:center;position:relative;overflow:hidden}
.verdict .gav{width:84px;margin:0 auto;color:#a16207;animation:gavel .9s var(--spring)}
@keyframes gavel{0%{transform:rotate(-40deg) translateY(-20px);opacity:0}60%{transform:rotate(8deg)}100%{transform:none;opacity:1}}
.verdict .stamp{display:inline-block;font-family:Fraunces,serif;font-weight:900;font-size:clamp(28px,6vw,44px);letter-spacing:.06em;color:var(--ok);border:6px double var(--ok);border-radius:14px;padding:4px 20px;rotate:-6deg;margin:8px 0;animation:kaSlam .6s var(--spring) .3s backwards}
.verdict .stamp.bad{color:var(--bad);border-color:var(--bad)}
.ruletext{text-align:left;background:var(--paper);color:var(--ink9);border-radius:8px;padding:18px 20px;margin:16px 0;font-family:Georgia,serif;font-size:16px;line-height:1.7;box-shadow:var(--sh1)}
.ruletext .t{margin-top:8px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13.5px;color:#5c4f35;font-style:italic}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat div{background:var(--soft);border-radius:14px;padding:12px;text-align:left}
.stat b{display:block;font-family:Fraunces,serif;font-size:24px}
.stat span{font-size:12px;font-weight:800;color:var(--mut)}
.skills{text-align:left;display:grid;gap:8px;margin:10px 0}
.skills div{display:grid;grid-template-columns:170px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.skills .bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.skills .bar i{display:block;height:100%;background:var(--p);border-radius:6px}.skills .bar i.lo{background:var(--bad)}
.skills span{text-align:right;color:var(--mut)}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.words span{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.words span em{font-style:normal;color:var(--mut);font-weight:600}
.secT{font:800 12px "Plus Jakarta Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px;text-align:left}
.brief{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.client{padding:16px;text-align:center}
.client i{display:block;width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--line2)}
.client i svg{width:100%;height:100%;display:block}
.client b{display:block;font-family:Fraunces,serif;font-size:20px;margin-top:10px}
.client small{color:var(--mut);font-weight:700}
.client blockquote{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--ink2);text-align:left;background:var(--soft);border-radius:12px;padding:10px 12px}
.plan{padding:18px 20px}
.plan ol{margin:8px 0 0;padding-left:20px;line-height:1.7;color:var(--ink2)}
.plan ol b{color:var(--ink)}
@media (max-width:900px){.prep,.brief{grid-template-columns:1fr}.qcard{position:static}.cases{grid-template-columns:1fr}}
@media (max-width:620px){.office{padding:20px 16px}.scale{width:60px;opacity:.5}.paper{padding:18px 14px;font-size:15.5px}.paper .cl{padding-left:40px}.court .who i{width:54px;height:54px}.court .who.judge i{width:66px;height:66px}.jury svg{width:16px;height:20px}.slots,.stat{grid-template-columns:1fr 1fr}.slots .slot:last-child{grid-column:1/-1}.cmp{grid-template-columns:1fr}.skills div{grid-template-columns:120px 1fr 44px;font-size:13px}.ahud{top:58px}}
#wsx{margin-top:18px;position:relative}#wsx .wsrc{margin:0}
</style>
</head>

<script>
(function(){
'use strict';
const {$,esc}=KA,ic=KA.ic;
const face=(c,hair,acc,skin)=>`<svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" fill="${c}" opacity=".16"/><path d="M30 200c6-40 34-62 70-62s64 22 70 62z" fill="${c}"/><path d="M84 140l16 22 16-22" fill="#fff" opacity=".85"/><rect x="88" y="112" width="24" height="30" fill="${skin||'#e8b98f'}"/><ellipse cx="100" cy="82" rx="38" ry="44" fill="${skin||'#e8b98f'}"/><path d="M62 76c0-30 16-44 38-44s38 14 38 44c-8-12-20-18-38-18s-30 6-38 18z" fill="${hair}"/><circle cx="86" cy="82" r="4" fill="#1f2937"/><circle cx="114" cy="82" r="4" fill="#1f2937"/><path d="M90 106q10 6 20 0" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>${acc||''}</svg>`;
const ACC={glasses:`<g fill="none" stroke="#111" stroke-width="3.5"><rect x="74" y="72" width="22" height="17" rx="5"/><rect x="104" y="72" width="22" height="17" rx="5"/><path d="M96 80h8"/></g>`,bun:`<circle cx="100" cy="30" r="15" fill="#292524"/>`,wig:`<path d="M56 70c-6 30-4 60 4 70h14c-6-20-6-46 0-66zM144 70c6 30 4 60-4 70h-14c6-20 6-46 0-66z" fill="#f1f5f9"/><path d="M60 64c4-26 20-36 40-36s36 10 40 36c-10-8-24-12-40-12s-30 4-40 12z" fill="#f8fafc"/>`,tie:`<path d="M96 146l4 30 4-30-4-6z" fill="#b91c1c"/>`,beard:`<path d="M66 92c4 30 18 38 34 38s30-8 34-38c-8 10-20 14-34 14s-26-4-34-14z" fill="#57534e"/>`};
const P={
 selma:face('#7c2d12','#1c1917',ACC.bun+ACC.glasses),
 crane:face('#1e293b','#a8a29e',ACC.tie),
 ward:face('#111827','#e5e7eb',ACC.wig),
 ayse:face('#b45309','#3f1d0b'),
 can:face('#0e7490','#292524',ACC.beard)
};
const JUROR='<svg viewBox="0 0 22 26"><circle cx="11" cy="7" r="5.5" fill="currentColor"/><path d="M2 26c0-7 4-11 9-11s9 4 9 11z" fill="currentColor"/></svg>';
const GAVEL='<svg viewBox="0 0 64 64" fill="currentColor"><rect x="8" y="14" width="30" height="14" rx="4" transform="rotate(-35 23 21)"/><rect x="26" y="26" width="30" height="6" rx="3" transform="rotate(-35 41 29)" opacity=".85"/><rect x="6" y="52" width="40" height="7" rx="3"/></svg>';

   if(q('#trn')){S.trShown=S.ti;save();trial();return}
   if(q('#whisper')){S.wh=S.ti;S.jury=Math.max(0,S.jury-3);save();trial();return}
   if(q('#accept')){if(st.ok){S.obj.acc++;skAdd('İtiraz',true);KA.sfx.ok();setRes(true,'Noted. Continue, Mr. Crane.','Doğru karar. '+st.why,3)}else{S.obj.missed++;skAdd('İtiraz',false);KA.sfx.bad();setRes(false,'Noted.','Selma kulağına eğiliyor: "Bunu kaçırdık! "'+st.why,-12)}return}
   if(q('#object')){slam('İTİRAZ!');if(st.ok){S.obj.bad++;skAdd('İtiraz',false);KA.sfx.bad();setTimeout(()=>setRes(false,'Overruled. That statement is accurate, counsel.',st.why,-8),500)}else{S.tstate='word';save();setTimeout(trial,500)}return}
   if(b=q('.pickw [data-wi]')){const w=b.textContent.replace(/[.,:;']/g,'').toLowerCase();const hit=st.bad.some(x=>w===x.toLowerCase()||w.replace(/s$/,'')===x.toLowerCase().replace(/s$/,''));if(hit){S.tstate='card';KA.sfx.ok();save();trial()}else{S.twr.push(+b.dataset.wi);S.jury=Math.max(0,S.jury-3);KA.sfx.bad();save();trial()}return}
   if(q('#showcards')){sheet('Hangi kart bu çarpıtmayı çürütür?',`<div class="cards">${S.cards.map(k=>cardHtml(k,0,'button')).join('')}</div>`);return}
   if(b=q('[data-pc]')){document.querySelector('.sheet')?.remove();const k=b.dataset.pc;if(st.card.includes(k)){S.obj.ok++;skAdd('İtiraz',!S.tpick);KA.sfx.ok();slam('SUSTAINED',1);setTimeout(()=>setRes(true,'Sustained. The jury will disregard that statement.',st.why,S.tpick?8:12),400)}else{S.tpick=true;S.jury=Math.max(0,S.jury-4);KA.sfx.bad();KA.toast('Hâkim kaşlarını çattı: "Is that really relevant, counsel?" Başka bir kart dene.');save();trial()}return}
   if(q('#tnext')){S.ti++;S.tstate='idle';S.twr=[];S.tpick=null;S.tres=null;save();trial();scrollTo({top:0,behavior:'smooth'});return}
  }
  /* kapanış */
  if(b=q('[data-slot]')){const i=+b.dataset.slot;sheet(`${C.slots[i][0]} için kart seç`,`<div class="cards">${S.cards.map(k=>`<button class="card2" data-sk="${k}" data-si="${i}"><b>${esc(C.cards[k].t)}</b>${esc(C.cards[k].d)}<q>${esc(C.cards[k].en)}</q></button>`).join('')}</div>`);return}
  if(b=q('[data-sk]')){S.slots[+b.dataset.si]=b.dataset.sk;S.sres=null;S.cmsg=null;document.querySelector('.sheet')?.remove();save();closing();return}
  if(b=q('[data-cl]')){S.cpick=+b.dataset.cl;S.cmsg=null;save();closing();return}
  if(q('#rest')){const r=C.slots.map((s,i)=>s[2].includes(S.slots[i]));S.sres=r;const cOk=C.closing[S.cpick][1];
    if(!cOk){S.cwr.push(S.cpick);S.cpick=null;S.jury=Math.max(0,S.jury-8);S.cmsg='<b>Hâkim Ward: "Is that all, counsel?"</b> Bu konuşma jüriyi ikna etmedi. Kanıta dayalı olanı seç.';KA.sfx.bad();save();closing();return}
    if(!r.every(Boolean)){S.jury=Math.max(0,S.jury-6);S.cmsg=`<b>Argümanlarından biri zayıf.</b> ${C.slots.filter((s,i)=>!r[i]).map(s=>s[0]).join(' ve ')} için başka bir kart seç.`;KA.sfx.bad();save();closing();return}
    S.jury=Math.min(100,S.jury+10);S.end=S.jury>=55?'win':'lose';try{KA.addXp(S.end==='win'?60:15,'avukat')}catch(e){}save();slam(S.end==='win'?'KARAR':'KARAR',1);setTimeout(()=>go('verdict'),800);return}
  if(q('#restart')){DB.cases[C.id]=S=fresh();save();render();return}
  if(q('#addw')){Object.entries(S.words).forEach(([w,t])=>KA.addUnknown(w,t));KA.toast('Kelimeler Bilmediklerim listesine eklendi.');q('#addw').disabled=true;return}
});
KA.nav('oyunlar.html');
render();
})();
</script>
