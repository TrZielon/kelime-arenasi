<!DOCTYPE html>
<html lang="tr" data-mode="light">

<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light';if(sessionStorage.getItem('ka_gate'))document.documentElement.classList.add('ka-gin')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ortak.css?v=22">
<style>
.kh{padding:26px;margin-bottom:16px}
.kh h1{font-size:clamp(28px,4vw,40px);margin:6px 0 8px}
.kh p{color:var(--ink2);margin:0}
.kmodes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kmode{padding:22px;text-align:left;border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:10px}
.kmode:hover{border-color:var(--p);transform:translateY(-1px)}
.kmode .mi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--g);color:#fff}
.kmode .mi svg{width:26px;height:26px}
.kmode b{font-family:Fraunces,serif;font-size:23px}
.kmode p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.kmode ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px;line-height:1.6}
.hist{margin-top:16px;padding:16px 18px}
.hist .bars{display:flex;gap:8px;align-items:flex-end;height:70px;margin-top:10px}
.hist .bars div{flex:1;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--p);position:relative;min-height:6px}
.hist .bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font:800 11.5px "Plus Jakarta Sans",sans-serif;color:var(--ink2)}
.opt-g{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.opt-g .pill.on{background:var(--p);color:var(--p-ink);border-color:var(--p)}
.lbl{font-weight:800;font-size:14px}
.setup{padding:22px;max-width:760px}
/* sınav */
.exh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.exh .t{font-weight:800;font-size:17px;flex:1}
.steps{display:flex;gap:6px}
.steps span{font:800 12px "Plus Jakarta Sans",sans-serif;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--mut)}
.steps span.on{background:var(--p);color:var(--p-ink)}.steps span.ok{background:var(--ok-soft);color:var(--ok)}
.room{padding:22px;display:grid;gap:16px}
.exq{display:flex;gap:14px;align-items:flex-start}
.ava{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--acc2));color:#fff;display:grid;place-items:center;font:800 18px Fraunces,serif;flex:0 0 auto}
.bub{background:var(--soft);border-radius:4px 18px 18px 18px;padding:14px 16px;font-family:Fraunces,serif;font-size:19px;line-height:1.55;flex:1}
.bub small{display:block;font:700 12px "Plus Jakarta Sans",sans-serif;color:var(--mut);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.bub .tr{display:block;margin-top:6px;font:500 14px "Plus Jakarta Sans",sans-serif;color:var(--ink2)}
.cue{border:2px dashed var(--line2);border-radius:18px;padding:16px 18px;background:var(--card2)}
.cue b{font-family:Fraunces,serif;font-size:20px;display:block;margin-bottom:6px}
.cue ul{margin:6px 0 0;padding-left:20px;line-height:1.7}
.ansbox{display:grid;gap:10px}
.ansbox textarea{min-height:110px;font-size:16px;line-height:1.55}
.microw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bigmic{width:72px;height:72px;border-radius:50%;border:0;background:var(--p);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--p) 40%,transparent);flex:0 0 auto}
.bigmic svg{width:30px;height:30px}
.bigmic.rec{background:var(--bad);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}70%{box-shadow:0 0 0 18px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tmr{font:800 22px "Plus Jakarta Sans",sans-serif;min-width:64px}
.tmr.warn{color:var(--bad)}
.mhint{color:var(--mut);font-size:13.5px;flex:1;min-width:160px}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--p);transition:width .3s}
/* sonuç */
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.band{padding:14px;border-radius:16px;background:var(--soft);text-align:center}
.band b{display:block;font:800 30px "Plus Jakarta Sans",sans-serif;color:var(--p)}
.band span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.band.ov{background:var(--p);color:var(--p-ink)}.band.ov b{color:var(--p-ink)}.band.ov span{color:inherit}
.rsec{margin-top:16px}
.rsec h3{font-size:18px;margin:0 0 8px}
.fix{display:grid;gap:8px}
.fix div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14.5px;line-height:1.5}
.fix s{color:var(--bad);text-decoration-thickness:1.5px}
.fix ins{color:var(--ok);text-decoration:none;font-weight:700}
.fix small{display:block;color:var(--mut);margin-top:3px}
.call{padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:min(560px,calc(100vh - 210px))}
.cwho{display:flex;align-items:center;gap:10px;align-self:stretch;justify-content:center;flex-wrap:wrap}
.cwho .ava{width:40px;height:40px;font-size:15px}.cwho b{font-size:16px}.cwho small{display:block;color:var(--mut);font-size:12.5px;font-weight:700}
.cx{align-self:stretch;text-align:left}.cx:empty{display:none}
.orb{position:relative;width:190px;height:190px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;margin:14px 0 4px;-webkit-tap-highlight-color:transparent}
.orb .core{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--p) 55%,#fff),var(--p) 60%,color-mix(in srgb,var(--p) 70%,#000));box-shadow:0 18px 50px color-mix(in srgb,var(--p) 40%,transparent);display:grid;place-items:center;color:#fff;transition:transform .18s,background .3s}
.orb .core svg{width:46px;height:46px}
.orb .ring{position:absolute;inset:6px;border-radius:50%;border:3px solid color-mix(in srgb,var(--p) 35%,transparent);opacity:0;transition:opacity .3s}
.orb .ring2{inset:-6px;border-width:2px}
.orb[data-ph=listen] .ring{opacity:1;animation:orbp 1.8s ease-out infinite}.orb[data-ph=listen] .ring2{animation-delay:.6s}
.orb.bump .core{transform:scale(1.07)}
.orb[data-ph=think] .core{background:radial-gradient(circle at 35% 30%,#c4b5fd,#6d28d9 60%,#3b0764)}
.orb[data-ph=think] .ring{opacity:1;border-style:dashed;border-color:#8b5cf6;animation:orbr 2.4s linear infinite}
.orb[data-ph=speak] .core{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--acc2) 45%,#fff),var(--acc2) 60%,color-mix(in srgb,var(--acc2) 65%,#000));box-shadow:0 18px 50px color-mix(in srgb,var(--acc2) 45%,transparent);animation:orbs 1.1s ease-in-out infinite}
.orb[data-ph=pause] .core,.orb[data-ph=idle] .core{background:radial-gradient(circle at 35% 30%,#e5e7eb,#9ca3af 60%,#4b5563);box-shadow:none}
.orb[data-ph=prep] .core{background:radial-gradient(circle at 35% 30%,#fde68a,#d97706 60%,#78350f)}
@keyframes orbp{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.22);opacity:0}}
@keyframes orbr{to{transform:rotate(360deg)}}
@keyframes orbs{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wave{display:flex;gap:4px;align-items:center;height:46px}.wave i{width:6px;border-radius:4px;background:#fff;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:10px}50%{height:40px}}
.cst{font:800 20px "Plus Jakarta Sans",sans-serif}
.ctm{font:800 15px "Plus Jakarta Sans",sans-serif;color:var(--mut);min-height:20px}.ctm.warn{color:var(--bad)}
.ccap{align-self:stretch;max-width:640px;margin:0 auto;padding:12px 14px;border-radius:14px;background:var(--soft);text-align:left;font-size:15px;line-height:1.55}
.ccap p{margin:0}.ccap p+p{margin-top:6px}.ccap b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.cctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:8px}
.cctl .btn{min-width:130px}.cctl .end{background:var(--bad);color:#fff;border-color:var(--bad)}
.chint{font-size:13px;color:var(--mut);max-width:520px;line-height:1.5;margin:0}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.mode2 button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;font:800 14.5px "Plus Jakarta Sans",sans-serif;color:var(--ink);cursor:pointer}
.mode2 button small{display:block;font-weight:600;font-size:12.5px;color:var(--mut);margin-top:3px}
.mode2 button.on{border-color:var(--p);background:var(--p-soft)}.mode2 button:disabled{opacity:.45;cursor:default}
.cue.mini{padding:12px 14px}.cue.mini b{font-size:17px}
@media (max-width:640px){.orb{width:160px;height:160px}.mode2{grid-template-columns:1fr}.call{min-height:calc(100vh - 220px)}}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat span{padding:6px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700}
.trans{max-height:320px;overflow:auto;font-size:14px;line-height:1.6;background:var(--soft);border-radius:12px;padding:12px 14px}
.trans p{margin:0 0 8px}
/* sohbet */
.chat{display:flex;flex-direction:column;gap:10px;padding:18px;min-height:340px;max-height:58vh;overflow:auto}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;line-height:1.5;font-size:15.5px}
.msg.ai{background:var(--soft);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--p);color:var(--p-ink);border-top-right-radius:4px;align-self:flex-end}
.msg .tr{display:block;margin-top:5px;font-size:13px;opacity:.85}
.msg .fx{display:block;margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.3);font-size:13px}
.msg .fx b{font-weight:800}
.msg button.pl{border:0;background:transparent;color:inherit;opacity:.7;cursor:pointer;padding:2px 4px;vertical-align:middle}
.msg button.pl svg{width:15px;height:15px}
.typing{align-self:flex-start;color:var(--mut);font-size:13.5px}
.cbar{display:flex;gap:10px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}
.cbar textarea{flex:1;min-height:52px;max-height:140px;font-size:15.5px}
.cbar .bigmic{width:56px;height:56px}.cbar .bigmic svg{width:24px;height:24px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.sw input{accent-color:var(--p);width:18px;height:18px}
@media (max-width:760px){.kmodes{grid-template-columns:1fr}.bands{grid-template-columns:repeat(2,minmax(0,1fr))}.band.ov{grid-column:1/-1}.bub{font-size:17.5px}.room{padding:16px}.chat{max-height:none;min-height:50vh}}
</style>

<body>
<main class="ka-wrap" id="main"></main>
<script src="firebase-config.js?v=22"></script><script src="ortak.js?v=22"></script>
<script>
(()=>{
const {$,esc,shuf}=KA,ic=KA.ic;
const I={mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5M8 8h4"/></svg>',chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>'};
let BANK=null,HIST=()=>KA.store.get('ka_konus',[])||[];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const FILL=/\b(um+|uh+|er+|erm|hmm+|you know|i mean|like,|kind of|sort of)\b/gi;

/* ---------- Ses tanıma ---------- */
const R={on:false,rec:null,fin:'',t0:0,sec:0,conf:[],box:null,onUi:null};
function recStart(box,onUi){
  if(!SR){KA.toast('Bu tarayıcı sesi yazıya çeviremiyor (Chrome, Edge ya da Safari kullan). Cevabını yazarak da verebilirsin.',4500);box&&box.focus();return false}
  KA.stopSpeak();R.box=box;R.onUi=onUi;R.fin=box.value?box.value.trim()+' ':'';R.on=true;R.t0=Date.now();
  const rec=new SR();R.rec=rec;rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){R.fin+=r[0].transcript.trim()+' ';if(r[0].confidence)R.conf.push(r[0].confidence)}else it+=r[0].transcript}R.box.value=(R.fin+it).replace(/\s+/g,' ').trimStart();R.box.dispatchEvent(new Event('input'))};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){R.on=false;KA.toast('Mikrofon izni verilmedi. Tarayıcının adres çubuğundan mikrofona izin ver ya da cevabını yaz.',5000);onUi&&onUi()}};
  rec.onend=()=>{if(R.on){try{rec.start()}catch(x){}}else onUi&&onUi()};
  try{rec.start()}catch(e){R.on=false;return false}
  onUi&&onUi();return true;
}
function recStop(){if(!R.on)return 0;R.on=false;const s=(Date.now()-R.t0)/1000;R.sec+=s;try{R.rec&&R.rec.stop()}catch(e){}return s}

/* ---------- Sesli görüşme motoru: dinle → sessizlikte cevapla → konuş → tekrar dinle ---------- */
const AND=/Android/i.test(navigator.userAgent);
const C={on:false,ph:'idle',rec:null,fin:'',it:'',sil:null,o:{},t0:0,heard:0,cap:false,ai:'',tick:null,wl:null,bumpT:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function cRender(o){
  const capOn=(()=>{try{return localStorage.getItem('ka_kcap')==='1'}catch(e){return false}})();C.cap=capOn;
  $('#main').innerHTML=`<div class="exh"><button class="btn btn-ghost btn-sm" data-a="${o.end}">${ic('back')}Bitir</button><span class="t">${esc(o.title)}</span>${o.steps||''}<label class="sw"><input type="checkbox" id="capt" ${capOn?'checked':''}>Altyazı</label></div>
  <section class="card call"><div class="cwho"><span class="ava">${esc(o.ava)}</span><span style="text-align:left"><b>${esc(o.who)}</b><small>Sesli görüşme · İngilizce</small></span></div>
  <div class="cx" id="cx"></div>
  <button class="orb" id="orb" data-ph="idle" aria-label="Konuşma düğmesi"><span class="ring"></span><span class="ring ring2"></span><span class="core" id="orbc">${I.mic}</span></button>
  <div class="cst" id="cst">Bağlanıyor…</div><div class="ctm" id="ctm"></div>
  <div class="ccap" id="ccap" ${capOn?'':'hidden'}></div>
  <p class="chint">Konuşman bitince kısa bir sessizlik yeter, ${o.ava==='E'?'sınav görevlisi':'partnerin'} kendiliğinden devam eder. Sözünü kesmek ya da cevabını hemen göndermek için küreye dokun.</p>
  <div class="cctl"><button class="btn btn-ghost" data-a="cpause" id="cpz">Duraklat</button><button class="btn end" data-a="${o.end}">Görüşmeyi bitir</button></div></section>`;
  $('#capt').onchange=e=>{C.cap=e.target.checked;try{localStorage.setItem('ka_kcap',C.cap?'1':'0')}catch(x){}const c=$('#ccap');if(c)c.hidden=!C.cap;cCap()};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>C.wl=w).catch(()=>{})}catch(e){}
}
function cCap(){const c=$('#ccap');if(!c||!C.cap)return;const me=(C.fin+C.it).trim();c.innerHTML=(C.ai?`<p><b>${C.o&&C.o.who||'Koç'}</b><span lang="en">${esc(C.ai)}</span></p>`:'')+(C.ph==='listen'&&me?`<p><b>Sen</b><span lang="en">${esc(me)}</span></p>`:'')||'<p class="mut">Altyazı burada görünecek.</p>'}
function cState(ph,msg){
  C.ph=ph;const o=$('#orb'),s=$('#cst'),core=$('#orbc'),pz=$('#cpz');
  if(o)o.dataset.ph=ph;
  if(core)core.innerHTML=ph==='speak'?'<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>':ph==='think'?'':ph==='pause'?I.play:I.mic;
  if(s)s.textContent=msg||({listen:'Seni dinliyorum…',think:'Düşünüyor…',speak:'Konuşuyor…',pause:'Duraklatıldı',prep:'Hazırlan',idle:''}[ph]||'');
  if(pz)pz.textContent=ph==='pause'?'Devam et':'Duraklat';
  if(ph!=='listen'){const t=$('#ctm');if(t&&!C.o.keepTm){t.textContent='';t.classList.remove('warn')}}
  cCap();
}
function cStopRec(){clearTimeout(C.sil);clearInterval(C.tick);const r=C.rec;C.rec=null;if(r){try{r.onend=null;r.onresult=null;r.onerror=null;r.abort?r.abort():r.stop()}catch(e){}}}
function cStop(){C.on=false;cStopRec();KA.stopSpeak();clearInterval(EX.tick);try{C.wl&&C.wl.release()}catch(e){}C.wl=null}
function addFinal(f){f=f.trim();if(!f)return;const a=C.fin.trim().toLowerCase(),b=f.toLowerCase();if(a&&b.startsWith(a))C.fin=f+' ';else if(a&&a.endsWith(b))return;else C.fin+=f+' '}
function newRec(){
  const rec=new SR();rec.lang='en-US';rec.continuous=!AND;rec.interimResults=true;
  rec.onresult=e=>{if(C.rec!==rec)return;let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){addFinal(r[0].transcript);if(r[0].confidence)R.conf.push(r[0].confidence)}else it+=r[0].transcript}
    C.it=it;if(!C.t0)C.t0=Date.now();C.heard=Date.now();const o=$('#orb');if(o){o.classList.add('bump');clearTimeout(C.bumpT);C.bumpT=setTimeout(()=>o.classList.remove('bump'),160)}cCap();armSil()};
  rec.onerror=e=>{if(C.rec!==rec)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){cStopRec();cState('pause','Mikrofon izni gerekli');KA.toast('Mikrofona izin ver: adres çubuğundaki kilit simgesine dokun, mikrofonu "İzin ver" yap ve küreye dokun.',6000)}};
  rec.onend=()=>{if(C.rec!==rec||C.ph!=='listen'||!C.on)return;const n=newRec();C.rec=n;try{n.start()}catch(x){cState('pause','Dinlemek için küreye dokun')}};
  return rec;
}
function cListen(o){
  if(!C.on)return;cStopRec();C.o=Object.assign({silMs:1800},o||C.o);C.fin='';C.it='';C.t0=0;C.heard=0;C.ls=Date.now();cState('listen');
  const rec=newRec();C.rec=rec;try{rec.start()}catch(e){cState('pause','Dinlemek için küreye dokun');return}
  const t=$('#ctm');
  C.tick=setInterval(()=>{if(C.ph!=='listen')return;const el=C.t0?(Date.now()-C.t0)/1000:0;
    if(t){t.textContent=C.o.maxSec?mm(el)+' / '+mm(C.o.maxSec):(el?mm(el):'');t.classList.toggle('warn',!!C.o.maxSec&&el>C.o.maxSec-15)}
    if(C.o.maxSec&&el>=C.o.maxSec)return cFinish('max');

  <p style="margin:12px 0 0;line-height:1.6">${esc(j.ozet||'')}</p>
  ${L(j.guclu).length?`<div class="rsec"><h3>Güçlü yönlerin</h3><ul>${L(j.guclu).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${L(j.gelisim).length?`<div class="rsec"><h3>Geliştirmen gerekenler</h3><ul>${L(j.gelisim).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${L(j.duzelt).length?`<div class="rsec"><h3>Daha doğru ve doğal söyleyiş</h3><div class="fix">${L(j.duzelt).map(d=>`<div><s>${esc(d.sen)}</s> → <ins>${esc(d.daha_iyi)}</ins> <button class="btn btn-ghost btn-sm" data-say="${esc(d.daha_iyi)}" style="min-height:28px;padding:2px 8px">${I.play}</button><small>${esc(d.neden||'')}</small></div>`).join('')}</div></div>`:''}
  ${L(j.kelime).length?`<div class="rsec"><h3>Kelimeni yükselt</h3><div class="fix">${L(j.kelime).map(k=>`<div><b>${esc(k.sen)}</b> → <ins>${esc(k.oneri)}</ins><small lang="en">${esc(k.ornek||'')}</small></div>`).join('')}</div></div>`:''}
  ${j.ornek_cevap&&j.ornek_cevap.cevap?`<div class="rsec"><h3>Band 8 örnek cevap</h3><div class="fix"><div><b lang="en">${esc(j.ornek_cevap.soru||'')}</b><br><span lang="en">${esc(j.ornek_cevap.cevap)}</span><br><button class="btn btn-ghost btn-sm" data-say="${esc(j.ornek_cevap.cevap)}" style="margin-top:6px">${I.play}Dinle</button></div></div></div>`:''}
  ${L(j.ipuclari).length?`<div class="rsec"><h3>IELTS taktikleri</h3><ul>${L(j.ipuclari).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${transHtml()}
  <p class="mut" style="font-size:12.5px">* Telaffuz, ses tanımanın seni ne kadar doğru anladığına dayanan kaba bir tahmindir. Band puanları resmî IELTS sonucu değildir.</p>
  <div class="row" style="gap:8px"><button class="btn btn-p" data-go="exam">${ic('reset')}Yeni sınav</button><button class="btn btn-ghost" data-a="hub">Konuşma Koçu</button></div></section>`;
  KA.sfx.win();
}
function transHtml(){return `<details class="rsec"><summary style="cursor:pointer;font-weight:800">Konuşmanın dökümü</summary><div class="trans">${EX.log.map(l=>`<p><b>Part ${l.part} · ${esc(l.q)}</b><br>${esc(l.a)} <span class="mut">(${l.sec||0} sn)</span></p>`).join('')}</div></details>`}

/* ---------- Serbest sohbet ---------- */
let CH={};
const CHAT=(s,v,fx)=>`You are a warm, natural English conversation partner for a Turkish university student preparing for English exams (level B1-C1). Scenario: ${s}.
${v?`This is a LIVE SPOKEN conversation (your words are read aloud by text-to-speech; the student's words come from speech recognition, so ignore small transcription errors). Keep every reply short: 1-2 sentences, at most about 30 words, with contractions and everyday spoken phrases; no lists, no emojis, no markdown, no stage directions. ${fx?'When the student makes a clear mistake, naturally recast the correct form inside your reply the way a friendly native speaker would (e.g. "Oh, you went there last week? ..."), never explain grammar out loud.':''} If the student says they don't know how to say something, help them with the English words briefly, then continue.
`:''}Rules: reply in natural spoken English, 1-3 short sentences, then usually ask ONE follow-up question that keeps the conversation going. Match the student's level but gently introduce one useful higher-level word or phrase now and then. Never lecture. If the student writes in Turkish, reply in English and encourage them to try in English.
Also check the student's LAST message: list 0-2 real mistakes or clearly unnatural phrases (not punctuation or capitalisation; speech-to-text may miss commas).
Return ONLY JSON: {"reply":"...","tr":"Turkish translation of your reply","fix":[{"you":"exact words from the student's last message","better":"natural version","why":"very short Turkish reason"}]}`;
const CHEV=`You are an English speaking coach. Read this conversation between a Turkish student and an AI partner and give brief, encouraging, specific feedback in TURKISH (English examples stay in English). Return ONLY JSON: {"ozet":"2 sentences","guclu":["..."],"gelisim":["..."],"ifadeler":[{"ifade":"useful English phrase for this topic","tr":"Turkish meaning"}],"seviye":"estimated CEFR level, e.g. B2"}. 2-3 items in each list, 5 phrases.`;
async function chatSetup(){
  await load();location.hash='chat';
  $('#main').innerHTML=`<div class="exh"><button class="btn btn-ghost btn-sm" data-a="hub">${ic('back')}Konuşma Koçu</button><span class="t">Serbest sohbet</span></div>
  <section class="card setup"><div class="lbl">Senaryo</div><div class="opt-g" id="sc">${BANK.chat.map((c,i)=>`<button class="pill ${i===0?'on':''}" data-sc="${c.k}" title="${esc(c.d)}">${esc(c.n)}</button>`).join('')}</div>
  <div class="lbl">Konu (isteğe bağlı)</div><input class="input" id="topic" placeholder="Örnek: Boğaziçi'de hazırlık hayatı, sevdiğim bir dizi, yapay zekâ…" style="margin:8px 0 14px">
  ${modeUi()}<div class="row" style="gap:16px;justify-content:flex-start;margin-bottom:14px"><label class="sw"><input type="checkbox" id="fx" checked>Hatalarımı düzelt</label><label class="sw"><input type="checkbox" id="trc">Türkçesini göster</label><label class="sw"><input type="checkbox" id="auto" checked>Cevapları sesli oku</label></div>
  <button class="btn btn-p btn-lg" data-a="cstart" style="width:100%">${I.chat}Sohbete başla</button></section>`;
}
function chatStart(){
  const k=document.querySelector('#sc .on').dataset.sc,sc=BANK.chat.find(c=>c.k===k),tp=$('#topic').value.trim();
  CH={sc:sc.s+(tp?`. The student wants to talk about: ${tp}`:''),name:sc.n,fx:$('#fx').checked,tr:$('#trc').checked,auto:$('#auto').checked,msgs:[],busy:false,voice:modeOf()==='voice'};R.sec=0;R.conf=[];
  const seed0=tp?`(The student would like to talk about: ${tp}. Open the conversation.)`:'(Open the conversation with a friendly first line that fits the scenario.)';
  if(CH.voice){C.on=true;C.ai='';KA.muted(false);cRender({title:sc.n,who:'Sohbet partneri',ava:'AI',end:'cvend'});chatVTurn(seed0,true);return}
  $('#main').innerHTML=`<div class="exh"><button class="btn btn-ghost btn-sm" data-a="cend">${ic('back')}Bitir</button><span class="t">${esc(sc.n)}</span><label class="sw"><input type="checkbox" id="trc2" ${CH.tr?'checked':''}>Türkçe</label><button class="btn btn-ghost btn-sm" data-a="ceval">${ic('check')}Değerlendir</button></div>
  <section class="card" style="padding:0;overflow:hidden"><div class="chat" id="chat"></div><div class="cbar"><button class="bigmic" id="mic" aria-label="Konuş">${I.mic}</button><textarea class="textarea" id="ans" lang="en" placeholder="Konuş ya da yaz… (Enter ile gönder)"></textarea><button class="btn btn-p" data-a="csend" aria-label="Gönder">${ic('arrow')}</button></div></section>`;
  const mic=$('#mic'),box=$('#ans');
  const ui=()=>{mic.classList.toggle('rec',R.on);mic.innerHTML=R.on?I.stop:I.mic};
  mic.onclick=()=>{if(R.on){recStop();ui();if(box.value.trim())chatSend()}else recStart(box,ui)};
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend()}});
  $('#trc2').onchange=e=>{CH.tr=e.target.checked;drawChat()};
  chatTurn(tp?`(The student would like to talk about: ${tp}. Open the conversation.)`:'(Open the conversation with a friendly first line that fits the scenario.)',true);
}
function drawChat(typing){
  const c=$('#chat');if(!c)return;
  c.innerHTML=CH.msgs.map((m,i)=>m.r==='ai'?`<div class="msg ai"><span lang="en">${esc(m.t)}</span> <button class="pl" data-say="${esc(m.t)}" aria-label="Dinle">${I.play}</button>${CH.tr&&m.tr?`<span class="tr">${esc(m.tr)}</span>`:''}</div>`:`<div class="msg me"><span lang="en">${esc(m.t)}</span>${m.fx&&m.fx.length?m.fx.map(f=>`<span class="fx"><s>${esc(f.you)}</s> → <b>${esc(f.better)}</b>${f.why?' · '+esc(f.why):''}</span>`).join(''):''}</div>`).join('')+(typing?'<div class="typing"><span class="ka-spin"></span> yazıyor…</div>':'');
  c.scrollTop=c.scrollHeight;
}
function chatSend(){const box=$('#ans');if(!box||CH.busy)return;recStop();const t=box.value.trim();if(!t)return;box.value='';CH.msgs.push({r:'me',t});drawChat(true);chatTurn(null)}
async function chatAsk(seed,first){
  const hist=CH.msgs.slice(-14).map(m=>(m.r==='ai'?'Partner: ':'Student: ')+m.t).join('\n');
  let r=null;try{r=await KA.askJ(CHAT(CH.sc,CH.voice,CH.fx),(hist||'')+(seed?'\n'+seed:''),{tier:'quick',ms:25000})}catch(e){}
  const j=r&&r.json;
  if(!j||!j.reply)return {err:r&&r.err||'bağlantı'};
  const last=[...CH.msgs].reverse().find(m=>m.r==='me');
  if(last&&!first&&CH.fx&&Array.isArray(j.fix))last.fx=j.fix.filter(f=>f&&f.you&&f.better&&f.you.trim().toLowerCase()!==f.better.trim().toLowerCase()).slice(0,2);
  CH.msgs.push({r:'ai',t:String(j.reply),tr:String(j.tr||'')});
  return {reply:String(j.reply)};
}
async function chatTurn(seed,first){
  CH.busy=true;drawChat(true);
  const a=await chatAsk(seed,first);CH.busy=false;
  if(a.err){drawChat();KA.toast('Cevap alınamadı: '+esc(a.err),3500);return}
  drawChat();if(CH.auto)KA.speak(a.reply);
}
async function chatVTurn(seed,first){
  if(!C.on)return;cState('think');
  let a=await chatAsk(seed,first);
  if(a.err&&C.on){await sleep(600);a=await chatAsk(seed,first)}
  if(!C.on)return;
  if(a.err){KA.toast('Bağlantı koptu: '+a.err+'. Tekrar söyleyebilirsin.',4000);cListen({who:'Partner',silMs:1700,onTurn:chatHeard});return}
  const lo={who:'Partner',silMs:1700,onTurn:chatHeard};C.o=lo;
  await cSay(a.reply);if(!C.on||C.ph==='pause')return;
  cListen(lo);
}
function chatHeard(t){CH.msgs.push({r:'me',t});chatVTurn(null)}
function chatVEnd(){
  cStop();const me=CH.msgs.filter(m=>m.r==='me');
  if(me.length<3){hub();return}
  $('#main').innerHTML=`<div class="exh"><button class="btn btn-ghost btn-sm" data-a="hub">${ic('back')}Konuşma Koçu</button><span class="t">${esc(CH.name)} · görüşme bitti</span></div>
  <section class="card room"><span class="eyebrow">Görüşmenin dökümü</span><details><summary style="cursor:pointer;font-weight:800">Konuşmanın yazılı halini göster (${CH.msgs.length} satır)</summary><div class="chat" style="max-height:none;margin-top:10px" id="chat"></div></details>
  <div class="row" style="gap:8px"><button class="btn btn-p" data-go="chat">${I.chat}Yeni görüşme</button><button class="btn btn-ghost" data-a="hub">Konuşma Koçu</button></div></section>`;
  drawChat();chatEval();
}
async function chatEval(){
  const me=CH.msgs.filter(m=>m.r==='me');if(me.length<3){KA.toast('Değerlendirme için en az 3 mesaj yaz ya da söyle.');return}
  recStop();KA.stopSpeak();
  const box=document.createElement('div');box.className='card room';box.style.marginTop='14px';box.innerHTML='<span class="ka-spin"></span> Sohbetin değerlendiriliyor…';$('#main').appendChild(box);box.scrollIntoView({behavior:'smooth'});
  let r=null;try{r=await KA.askJ(CHEV,CH.msgs.map(m=>(m.r==='ai'?'Partner: ':'Student: ')+m.t).join('\n'),{tier:'quick',ms:40000})}catch(e){}
  const j=r&&r.json;if(!j){box.innerHTML='<p class="bad">Değerlendirme alınamadı.</p>';return}
  const fx=me.flatMap(m=>m.fx||[]);const L=a=>Array.isArray(a)?a:[];
  box.innerHTML=`<span class="eyebrow">Sohbet değerlendirmesi${j.seviye?' · tahmini seviye '+esc(j.seviye):''}</span><p style="line-height:1.6;margin:8px 0">${esc(j.ozet||'')}</p>${L(j.guclu).length?`<h3 style="margin:10px 0 6px;font-size:17px">Güçlü yönlerin</h3><ul>${L(j.guclu).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${L(j.gelisim).length?`<h3 style="margin:10px 0 6px;font-size:17px">Geliştirmen gerekenler</h3><ul>${L(j.gelisim).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${fx.length?`<h3 style="margin:10px 0 6px;font-size:17px">Sohbetteki düzeltmeler (${fx.length})</h3><div class="fix">${fx.map(f=>`<div><s>${esc(f.you)}</s> → <ins>${esc(f.better)}</ins><small>${esc(f.why||'')}</small></div>`).join('')}</div>`:''}${L(j.ifadeler).length?`<h3 style="margin:10px 0 6px;font-size:17px">Bu konu için kullanışlı ifadeler</h3><div class="fix">${L(j.ifadeler).map(x=>`<div><b lang="en">${esc(x.ifade)}</b> <button class="btn btn-ghost btn-sm" data-say="${esc(x.ifade)}" style="min-height:28px;padding:2px 8px">${I.play}</button><small>${esc(x.tr||'')}</small></div>`).join('')}</div>`:''}`;
  try{KA.addXp(10)}catch(e){}
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const pt=t.closest('[data-pt]');if(pt){document.querySelectorAll('[data-pt]').forEach(b=>b.classList.toggle('on',b===pt));return}
  const sc=t.closest('[data-sc]');if(sc){document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('on',b===sc));return}
  const md=t.closest('[data-md]');if(md&&!md.disabled){document.querySelectorAll('[data-md]').forEach(b=>b.classList.toggle('on',b===md));return}
  if(t.closest('#orb')){cOrb();return}
  const go=t.closest('[data-go]');if(go){go.dataset.go==='exam'?examSetup():chatSetup();return}
  const a=t.closest('[data-a]');if(!a)return;
  ({hub,estart:examStart,next:sendAns,talk,replay:()=>{const x=EX.Q[EX.i];if(x)KA.speak(x.q)},reeval:()=>examEval(true),
    quit:()=>{if(EX.log.length&&!confirm('Sınavdan çıkılsın mı? Cevapların kaydedilmez.'))return;hub()},
    cstart:chatStart,csend:chatSend,cvend:chatVEnd,cpause:cPause,xend:()=>{if(EX.log.length>=3&&confirm('Sınav burada bitirilsin ve şimdiye kadarki cevapların değerlendirilsin mi?')){cStop();examEval(true);return}if(EX.log.length&&!confirm('Sınavdan çıkılsın mı? Cevapların kaydedilmez.'))return;hub()},ceval:chatEval,cend:()=>{if(CH.msgs&&CH.msgs.filter(m=>m.r==='me').length>=3&&confirm('Çıkmadan önce sohbetin değerlendirilsin mi?')){chatEval();return}hub()}}[a.dataset.a]||(()=>{}))();
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(!h)hub()});
KA.nav('dinle.html');
const h=location.hash.slice(1);if(h==='exam')examSetup();else if(h==='chat')chatSetup();else hub();
})();
</script>
