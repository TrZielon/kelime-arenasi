<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lonca · Kelime Arenası</title>
<meta name="theme-color" content="#0f766e">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700;900&display=swap">

<style>
:root{--parch:#f4e9cf;--parch2:#e9d9b2;--ink8:#2b1d0e;--gold:#d4a72c;--arc:#6d28d9}
.realm{position:relative;border-radius:26px;overflow:hidden;padding:24px 22px;color:#efe7ff;background:radial-gradient(120% 80% at 50% 0%,#3b1c6b,#1a0f33 70%);box-shadow:var(--sh2)}
.realm .stars{position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 60%,#fde68a 50%,transparent 51%),radial-gradient(1px 1px at 85% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 10% 80%,#fff 50%,transparent 51%);opacity:.7;pointer-events:none}
.realm h1{font-family:Cinzel,Fraunces,serif;font-size:clamp(30px,5.4vw,50px);margin:6px 0 4px;line-height:1.05;letter-spacing:.02em}
.realm .sub{color:#c9b8ef;max-width:62ch}
.lore{margin-top:16px;display:flex;gap:12px;align-items:flex-start;background:var(--parch);color:var(--ink8);border-radius:14px;padding:14px 16px;rotate:-.4deg;position:relative}
.lore i{flex:0 0 52px;height:52px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--gold)}
.lore i svg{width:100%;height:100%;display:block}
.lore p{margin:0;font-size:15px;line-height:1.55}
/* harita */
.mapw{margin-top:16px;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 0 0 2px rgba(212,167,44,.35)}
.mapw svg{display:block;width:100%;height:auto}
.mapw .reg{cursor:pointer}
.mapw .reg.lock{cursor:not-allowed;opacity:.55}
.mapw .reg .halo{opacity:0;transition:opacity .3s}
.mapw .reg.cur .halo{opacity:1;animation:halo 1.8s ease-in-out infinite}
@keyframes halo{50%{opacity:.3}}
.mapw .reg text{font:900 14px Cinzel,serif;fill:#2b1d0e;text-anchor:middle;paint-order:stroke;stroke:#f4e9cf;stroke-width:5px}
.mapw .reg .done{fill:#16a34a}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
/* HUD */
.lhud{position:sticky;top:64px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);box-shadow:0 0 0 1.5px var(--line) inset,var(--sh1);margin-bottom:14px}
.mana{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;flex:1;min-width:160px}
.mana .bar{flex:1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.mana .bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#22d3ee);transition:width .5s var(--out)}
.mana svg{width:18px;height:18px;color:#7c3aed}
.lhud .pill{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);border:0}
.lhud .pill b{color:var(--ink)}
.minus{position:fixed;z-index:90;font-family:Fraunces,serif;font-weight:800;font-size:22px;color:#7c3aed;pointer-events:none;animation:mUp 1s var(--out) forwards}
@keyframes mUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
/* bölge */
.banner{position:relative;border-radius:22px;overflow:hidden;height:150px;box-shadow:var(--sh2);margin-bottom:14px}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner .ttl{position:absolute;left:18px;bottom:14px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.banner .ttl b{display:block;font-family:Cinzel,serif;font-size:clamp(24px,4vw,34px)}
.banner .ttl span{font-size:13.5px;font-weight:700;opacity:.92}
.banner .lights{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
.banner .lights i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.banner .lights i.on{background:#fde68a;box-shadow:0 0 12px #fde68a}
.banner .lights i.boss{border-radius:4px;transform:rotate(45deg)}
.meric{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset;margin-bottom:14px;animation:kaRise .45s var(--out)}
.meric i{flex:0 0 46px;height:46px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--gold)}
.meric i svg{width:100%;height:100%;display:block}
.meric small{font-size:11px;font-weight:800;letter-spacing:.1em;color:#7c3aed}
.meric p{margin:2px 0 0;font-size:15px;line-height:1.5}
/* kütüphane */
.scrolls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.scroll{position:relative;border:0;font-family:inherit;text-align:center;padding:22px 12px 16px;border-radius:12px;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink8);box-shadow:0 8px 16px rgba(0,0,0,.14);transition:transform .25s var(--spring)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:12px;border-radius:8px;background:#a0773f}
.scroll::before{top:-4px}.scroll::after{bottom:-4px}
.scroll:hover{transform:translateY(-4px) rotate(-1deg)}
.scroll b{display:block;font-family:Cinzel,serif;font-size:19px}
.scroll small{display:block;font-size:12px;font-weight:700;color:#7a5a2a;margin-top:4px}
.scroll.got{box-shadow:0 0 0 3px #7c3aed,0 8px 16px rgba(0,0,0,.14)}
.scroll.got::after{content:"✓";display:grid;place-items:center;color:#fff;font-size:10px}
.sheet{position:fixed;inset:0;z-index:85;background:rgba(10,8,20,.6);display:grid;align-items:end;justify-items:center}
.sheet .in{width:min(720px,100%);max-height:86vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 28px;animation:sheetUp .35s var(--out)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
.tome{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink8);border-radius:14px;padding:20px 22px;box-shadow:inset 0 0 0 2px #c7a86a}
.tome h2{font-family:Cinzel,serif;font-size:32px;margin:0;line-height:1}
.tome .tr{font-weight:800;color:#6d28d9;margin-top:4px;font-size:16px}
.tome .def{font-family:Georgia,serif;font-style:italic;margin:10px 0;font-size:15.5px;line-height:1.5}
.tome .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tome .row3 div{background:rgba(255,255,255,.5);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.tome .row3 small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#7a5a2a;margin-bottom:2px}
.tome .nu{margin-top:10px;background:#efe4ff;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.tome .nu b{color:#5b21b6}
.tome .ex{margin-top:10px;font-family:Georgia,serif;font-size:15.5px}
/* dilekçe */
.quest{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
.petition{position:relative;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink8);border-radius:6px;padding:22px 22px 18px;box-shadow:var(--sh2)}
.petition .from{display:flex;gap:10px;align-items:center;border-bottom:1.5px solid rgba(43,29,14,.2);padding-bottom:10px;margin-bottom:12px}
.petition .from i{flex:0 0 48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #a0773f}
.petition .from i svg{width:100%;height:100%;display:block}
.petition .from b{display:block;font-family:Fraunces,serif;font-size:17px}
.petition .from small{font-size:12px;color:#7a5a2a;font-weight:700}
.petition .txt{font-family:Georgia,serif;font-size:18px;line-height:1.7}
.petition .gap{display:inline-block;min-width:110px;border-bottom:3px dashed #7c3aed;text-align:center;color:#6d28d9;font-weight:800}
.petition .gap.ok{border-bottom-style:solid;color:#15803d;border-color:#15803d;background:rgba(253,230,138,.5);border-radius:4px;animation:kaStamp .5s var(--spring)}
.petition .seal{position:absolute;right:-8px;bottom:-10px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f87171,#991b1b);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.cast{padding:18px 20px}
.cast h3{margin:4px 0 10px;font-size:17px}
.spells{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spell{--d:#4c1d95;position:relative;border:0;border-radius:16px;padding:14px 12px;font-family:Cinzel,serif;font-weight:900;font-size:17px;letter-spacing:.02em;color:#fff;background:linear-gradient(160deg,#7c3aed,#4c1d95);box-shadow:0 4px 0 var(--d),0 8px 18px rgba(76,29,149,.25);transition:transform .1s,box-shadow .1s,filter .2s}
.spell:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
.spell.no{filter:grayscale(.8) brightness(.9);animation:kaShake .45s}
.spell.ok{background:linear-gradient(160deg,#16a34a,#14532d);--d:#14532d}
.spell:disabled{cursor:default}
.react{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;animation:kaRise .4s var(--out)}
.react.bad{background:color-mix(in srgb,var(--bad) 8%,var(--card));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bad) 30%,transparent) inset}
.react.good{background:color-mix(in srgb,var(--ok) 10%,var(--card));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ok) 30%,transparent) inset}
.react i{flex:0 0 36px;height:36px;border-radius:50%;overflow:hidden}.react i svg{width:100%;height:100%;display:block}
.react p{margin:0;font-size:14.5px;line-height:1.5}
.react p em{display:block;font-family:Fraunces,serif;font-style:normal;font-size:16px;color:var(--ink);margin-bottom:2px}
.lesson{margin-top:10px;padding:12px 14px;border-radius:14px;background:#f3ecff;color:#2e1065;font-size:14.5px;line-height:1.5}
:root[data-mode=dark] .lesson{background:#2e1a4f;color:#ede9fe}
.flash{position:fixed;inset:0;z-index:98;pointer-events:none;background:radial-gradient(circle,rgba(167,139,250,.55),transparent 60%);animation:flash .7s ease-out forwards}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
/* boss */
.arena{position:relative;border-radius:24px;overflow:hidden;padding:20px;background:radial-gradient(120% 90% at 50% 100%,#4c1d95,#120a24 70%);color:#efe7ff;box-shadow:var(--sh2);margin-bottom:14px}
.arena .fight{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arena .side{text-align:center}
.arena .side svg{width:120px;height:120px;display:block;margin:0 auto}
.arena .side b{display:block;font-family:Cinzel,serif;font-size:16px;margin-top:4px}
.hp{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;transition:width .6s var(--out)}
.hp.me i{background:linear-gradient(90deg,#22d3ee,#a78bfa)}.hp.foe i{background:linear-gradient(90deg,#f43f5e,#f97316)}
.arena .vs{font-family:Cinzel,serif;font-weight:900;font-size:26px;color:var(--gold)}
.foe-svg.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(10px) scale(.95);filter:brightness(2)}60%{transform:translateX(-6px)}}
.foe-svg.dead{animation:die 1s forwards}
@keyframes die{to{transform:scale(.2) rotate(30deg);opacity:0}}
.passage{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink8);border-radius:8px;padding:18px 20px;font-family:Georgia,serif;font-size:17.5px;line-height:1.7;box-shadow:var(--sh1)}
.passage .uw{font-weight:900;font-family:Cinzel,serif;color:#6d28d9;letter-spacing:.03em}
.passage .clue{background:rgba(124,58,237,.15);border-radius:4px;padding:0 3px}
.timer{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#f43f5e,#f97316);width:100%}
/* kitap */
.book{display:grid;gap:8px}
.book div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line)}
.book b{font-family:Cinzel,serif;font-size:16px}
.book small{display:block;color:var(--mut);font-weight:700;font-size:12.5px}
.book .st{color:var(--gold);letter-spacing:2px;font-size:15px}
.ceremony{padding:26px 22px;text-align:center}
.ceremony .rk{font-family:Cinzel,serif;font-weight:900;font-size:clamp(28px,5vw,42px);margin:8px 0;background:linear-gradient(90deg,#7c3aed,#d4a72c);-webkit-background-clip:text;background-clip:text;color:transparent}
.ceremony .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.ceremony .stat div{background:var(--soft);border-radius:14px;padding:12px;text-align:left}
.ceremony .stat b{display:block;font-family:Fraunces,serif;font-size:24px}
.ceremony .stat span{font-size:12px;font-weight:800;color:var(--mut)}
@media (max-width:900px){.quest{grid-template-columns:1fr}.scrolls{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.realm{padding:20px 16px}.tome .row3{grid-template-columns:1fr}.arena .side svg{width:84px;height:84px}.petition .txt{font-size:16.5px}.ceremony .stat{grid-template-columns:1fr 1fr}.lhud{top:58px}}
</style>
</head>

   <section class="card cast"><span class="eyebrow">Büyü seç</span><h3>Bu derde hangi kelime çare olur?</h3><div class="spells">${S.ord.o.map(w=>`<button class="spell ${done&&w===q.a?'ok':S.wr.includes(w)?'no':''}" data-spell="${esc(w)}" ${done||S.wr.includes(w)?'disabled':''}>${esc(w)}</button>`).join('')}</div>
   ${last?`<div class="react bad"><i>${NPC[q.npc]}</i><p><em>"${esc(q.r[last])}"</em></p></div>`:''}
   ${done?`<div class="react good"><i>${NPC[q.npc]}</i><p><em>"Thank you, apprentice. That is exactly the word."</em>Büyü tuttu; ${esc(q.n)} rahatladı.</p></div><div class="lesson">${SP[q.a].nu}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-p" id="qnext">${S.qi<r.q.length-1?'Sıradaki dilekçe':'Bölgenin yaratığıyla yüzleş'} ${ic('arrow')}</button></div>`:''}
   </section></div>`;
}
function bossView(){
  const r=R(),b=r.boss,B=S.boss;S.stage='boss';save();
  const foeHp=B.ph===0?100:B.ph===1?50:0;
  let body='';
  if(B.ph===0){if(!B.o)B.o=sh(b.m.map((x,i)=>i));body=`<div class="passage">${b.p}</div><div class="card cast" style="margin-top:12px"><span class="eyebrow">1 · Adını koy</span><h3>Yaratığın adı <b>${esc(b.w)}</b>. Bu kelime ne anlama geliyor? Mor işaretli ipuçlarına bak.</h3><div class="spells" style="grid-template-columns:1fr">${B.o.map(i=>`<button class="spell ${B.wr.includes(i)?'no':''}" style="font-family:'Plus Jakarta Sans';font-size:15px" data-bm="${i}" ${B.wr.includes(i)?'disabled':''}>${esc(b.m[i])}</button>`).join('')}</div></div>`}
  else if(B.ph===1){if(!B.fo)B.fo=sh(b.f.o);body=`<div class="lesson">${b.why}</div><div class="card cast" style="margin-top:12px"><span class="eyebrow">2 · Bağla</span><h3>Şimdi doğru biçimle bağla: <span style="font-family:Georgia,serif;font-weight:400">${esc(b.f.t).replace('{X}','<b style="color:#6d28d9">_____</b>')}</span></h3><div class="spells">${B.fo.map(w=>`<button class="spell ${B.fwr.includes(w)?'no':''}" data-bf="${esc(w)}" ${B.fwr.includes(w)?'disabled':''}>${esc(w)}</button>`).join('')}</div></div>`}
  else body=`<div class="react good"><i>${MERIC}</i><p><em>"${esc(b.n)} artık senin hükmünde."</em>${b.f.why}</p></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-p" id="bwin">Haritaya dön ${ic('arrow')}</button></div>`;
  $('#view').innerHTML=hud()+`<div class="arena"><div class="fight"><div class="side">${FOES.me}<b>Sen</b><div class="hp me"><i style="width:${S.mana}%"></i></div></div><div class="vs">VS</div><div class="side"><div id="foe">${FOES[b.foe]}</div><b>${esc(b.n)}</b><div class="hp foe"><i style="width:${foeHp}%"></i></div></div></div></div>${body}`;
  if(B.ph===2){const f=document.querySelector('#foe svg');f&&f.classList.add('dead')}
}
function duelView(){
  const D=S.duel;S.stage='duel';save();
  if(D.i>=D.list.length||D.hp<=0)return duelEnd();
  const [t,a]=D.list[D.i];if(!D.o||D.oi!==D.i){D.oi=D.i;D.o=sh([a,...sh(POOL.filter(x=>x!==a)).slice(0,3)])}
  $('#view').innerHTML=hud()+`<div class="arena"><div class="fight"><div class="side">${FOES.me}<b>Sen</b><div class="hp me"><i style="width:${D.hp/3*100}%"></i></div></div><div class="vs">VS</div><div class="side"><div id="foe">${FOES.katip}</div><b>Bulanık Kâtip</b><div class="hp foe"><i style="width:${(1-D.i/D.list.length)*100}%"></i></div></div></div></div>
   ${meric(D.i===0?'Son sınav! Kâtip cümleleri bulandırıyor; boşluğa doğru büyüyü 15 saniye içinde fırlat. Üç hakkın var.':'Odaklan çırak, kelimenin cümledeki görevine bak.')}
   <section class="card cast"><span class="eyebrow">Tur ${D.i+1} / ${D.list.length}</span><h3 style="font-family:Georgia,serif;font-weight:400;font-size:20px">${esc(t).replace('{X}','<b style="color:#6d28d9">_____</b>')}</h3><div class="timer"><i id="dt"></i></div><div class="spells">${D.o.map(w=>`<button class="spell" data-dw="${esc(w)}">${esc(w)}</button>`).join('')}</div></section>`;
  clearInterval(duelView.t);const t0=Date.now();duelView.t=setInterval(()=>{const p=1-(Date.now()-t0)/15000;const el=$('#dt');if(el)el.style.width=Math.max(0,p*100)+'%';if(p<=0){clearInterval(duelView.t);duelHit(null)}},100);
}
function duelHit(w,btn){
  clearInterval(duelView.t);const D=S.duel,[t,a]=D.list[D.i];
  if(w===a){D.ok++;S.use[a]=(S.use[a]||0)+1;flash();KA.sfx.ok();const f=document.querySelector('#foe svg');f&&f.classList.add('hit');D.i++;save();setTimeout(duelView,550)}
  else{D.hp--;KA.sfx.bad();if(btn)btn.classList.add('no');KA.toast(w?`Ters tepti! Doğrusu: ${a}`:`Süre doldu! Doğrusu: ${a}`);D.i++;save();setTimeout(duelView,1100)}
}
function duelEnd(){
  const D=S.duel;
  if(D.hp<=0){$('#view').innerHTML=hud()+`<section class="card ceremony"><span class="eyebrow">Kule</span><div class="rk">Kâtip kaçtı</div><p class="mut">Üç hakkını da kaybettin. Büyü kitabını gözden geçir ve tekrar dene.</p><div class="row" style="justify-content:center;gap:8px;margin-top:12px"><button class="btn btn-ghost" id="book">Büyü kitabı</button><button class="btn btn-p" data-reg="3">Tekrar düello ${ic('arrow')}</button></div></section>`;return}
  S.done=true;save();try{KA.addXp(80,'lonca')}catch(e){}
  const tot=Object.keys(S.first).length,fc=Object.values(S.first).filter(Boolean).length;
  const rank=fc>=tot-1&&D.hp===3?'Baş Sözcükçü':fc>=tot*.7?'Usta Sözcükçü':'Sözcükçü';
  $('#view').innerHTML=`<section class="card ceremony"><div style="width:120px;margin:0 auto">${FOES.me}</div><span class="eyebrow">Lonca töreni</span><div class="rk">${rank}</div><p class="mut" style="max-width:56ch;margin:0 auto">Bulanık Kâtip yenildi, Büyük Sözlük'ün ilk üç sayfası yerine kondu. Usta Meriç asasını sana uzatıyor.</p>
   <div class="stat"><div><b>${fc}/${tot}</b><span>ilk denemede doğru büyü</span></div><div><b>${D.ok}/${D.list.length}</b><span>düello isabeti</span></div><div><b>${Object.keys(S.book).length}</b><span>öğrenilen büyü</span></div><div><b>${S.mana}</b><span>kalan mana</span></div></div>
   <div class="book" style="text-align:left">${Object.keys(S.book).map(w=>`<div><span><b>${esc(w)}</b><small>${esc(SP[w].tr)}</small></span><span class="st">${'★'.repeat(Math.min(3,1+(S.use[w]||0)))}${'☆'.repeat(3-Math.min(3,1+(S.use[w]||0)))}</span></div>`).join('')}</div>
   <div class="row" style="justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-ghost" id="addw">Büyüleri listeme ekle</button><a class="btn btn-ghost" href="oyunlar.html">Oyun Salonu</a><button class="btn btn-p" id="reset">Yeni çıraklık ${ic('arrow')}</button></div></section>`;
  setTimeout(()=>{const r=document.querySelector('.rk');if(r&&KA.confetti){const b=r.getBoundingClientRect();KA.confetti(b.left+b.width/2,b.top,40,Math.PI*1.2)}},300);
}
function faint(){$('#view').innerHTML=hud()+`<section class="card ceremony"><span class="eyebrow">Mana tükendi</span><div class="rk">Bayıldın</div><p class="mut" style="max-width:52ch;margin:0 auto">Usta Meriç seni kuleye taşıdı. Manan yenilendi; bölgeye kaldığın yerden dönebilirsin. Ters tepen büyüleri büyü kitabında bir kez daha oku.</p><div class="row" style="justify-content:center;gap:8px;margin-top:14px"><button class="btn btn-ghost" id="book">Büyü kitabı</button><button class="btn btn-p" id="revive">Devam et ${ic('arrow')}</button></div></section>`}
function bookView(){const ws=Object.keys(S.book);const sh2=document.createElement('div');sh2.className='sheet';sh2.innerHTML=`<div class="in"><div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:18px;font-family:Cinzel,serif">Büyü kitabı · ${ws.length}</b><button class="btn btn-ghost btn-sm" data-close>Kapat</button></div>${ws.length?`<div class="book">${ws.map(w=>`<div data-scroll="${w}" style="cursor:pointer"><span><b>${esc(w)}</b><small>${esc(SP[w].tr)}</small></span><span class="st">${'★'.repeat(Math.min(3,1+(S.use[w]||0)))}${'☆'.repeat(3-Math.min(3,1+(S.use[w]||0)))}</span></div>`).join('')}</div><p class="mut" style="font-size:13px;margin-top:10px">Yıldızlar, büyüyü doğru kullandıkça artar. Bir büyüye dokunursan parşömeni yeniden açılır.</p>`:'<p class="mut">Kütüphanede okuduğun parşömenler buraya yazılır.</p>'}</div>`;document.body.appendChild(sh2)}
function enterReg(i){
  if(i===3){S.reg=3;S.duel={i:0,hp:3,ok:0,list:sh(DUEL).slice(0,8)};save();return duelView()}
  S.reg=i;const r=R();save();
  if(S.cleared.includes(r.id)){S.qi=0;S.qdone=false;S.wr=[];S.lastWrong=null;return library()}
  if(S.stage==='quest'&&S.reg===i)return quest();
  if(S.stage==='boss'&&S.boss)return bossView();
  if(r.spells.every(w=>S.read[w])&&S.qi>0)return quest();
  library();
}
/* ================= OLAYLAR ================= */
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let b;
  if(q('[data-close]')||t.classList.contains('sheet')){document.querySelector('.sheet')?.remove();return}
  if(b=q('[data-say]')){try{KA.speak(b.dataset.say)}catch(e){}return}
  if(b=q('[data-scroll]')){document.querySelector('.sheet')?.remove();scroll(b.dataset.scroll);return}
  if(b=q('[data-learn]')){const w=b.dataset.learn;S.read[w]=1;S.book[w]=1;save();document.querySelector('.sheet')?.remove();KA.sfx.ok();flash();if(S.stage==='lib')library();return}
  if(q('#book')){bookView();return}
  if(b=q('[data-go]')){map();scrollTo({top:0,behavior:'smooth'});return}
  if(b=q('[data-reg]')){enterReg(+b.dataset.reg);scrollTo({top:0,behavior:'smooth'});return}
  if(q('#toq')){S.qi=0;S.qdone=false;S.wr=[];S.lastWrong=null;quest();scrollTo({top:0,behavior:'smooth'});return}
  if(b=q('[data-spell]')){const r=R(),qq=r.q[S.qi],w=b.dataset.spell,k=r.id+S.qi;
    if(w===qq.a){S.qdone=true;S.lastWrong=null;if(S.first[k]==null)S.first[k]=!S.wr.length;S.use[w]=(S.use[w]||0)+1;flash();KA.sfx.ok();save();quest();const g=document.querySelector('.gap.ok');g&&KA.confetti&&(x=>KA.confetti(x.left+x.width/2,x.top,18,Math.PI*.8))(g.getBoundingClientRect())}
    else{S.wr.push(w);S.lastWrong=w;S.first[k]=false;S.wrongs++;KA.sfx.bad();lose(15,b);if(S.mana>0)quest()}return}
  if(q('#qnext')){const r=R();if(S.qi<r.q.length-1){S.qi++;S.qdone=false;S.wr=[];S.lastWrong=null;quest()}else{S.boss={ph:0,wr:[],fwr:[]};bossView()}scrollTo({top:0,behavior:'smooth'});return}
  if(b=q('[data-bm]')){const bb=R().boss,i=+b.dataset.bm,k=R().id+'b';if(i===bb.ma){S.boss.ph=1;if(S.first[k]==null)S.first[k]=!S.boss.wr.length;flash();KA.sfx.ok();const f=document.querySelector('#foe svg');f&&f.classList.add('hit');save();setTimeout(bossView,500)}else{S.boss.wr.push(i);S.first[k]=false;S.wrongs++;KA.sfx.bad();lose(20,b);if(S.mana>0)bossView()}return}
  if(b=q('[data-bf]')){const bb=R().boss,w=b.dataset.bf,k=R().id+'f';if(w===bb.f.a){S.boss.ph=2;if(S.first[k]==null)S.first[k]=!S.boss.fwr.length;flash();KA.sfx.ok();if(!S.cleared.includes(R().id))S.cleared.push(R().id);save();bossView();const a=document.querySelector('.arena');a&&KA.confetti&&(x=>KA.confetti(x.right-80,x.top+60,34,Math.PI*1.2))(a.getBoundingClientRect())}else{S.boss.fwr.push(w);S.first[k]=false;S.wrongs++;KA.sfx.bad();lose(20,b);if(S.mana>0)bossView()}return}
  if(q('#bwin')){S.qi=0;S.qdone=false;S.wr=[];S.boss=null;S.stage='map';S.mana=Math.min(100,S.mana+30);save();map();scrollTo({top:0,behavior:'smooth'});return}
  if(b=q('[data-dw]')){duelHit(b.dataset.dw,b);return}
  if(q('#revive')){S.mana=100;save();enterReg(S.reg);return}
  if(q('#reset')){S=fresh();save();map();return}
  if(q('#addw')){Object.keys(S.book).forEach(w=>KA.addUnknown(w,SP[w].tr));KA.toast('Büyüler Bilmediklerim listesine eklendi.');q('#addw').disabled=true;return}
});
KA.nav('oyunlar.html');
map();
})();
</script>
</body>
</html>
