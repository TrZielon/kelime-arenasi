<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dedektif Masası · Kelime Arenası</title>
<meta name="theme-color" content="#0f766e">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Special+Elite&display=swap">
<link rel="stylesheet" href="ortak.css?v=8">
<style>
:root{--cork:color-mix(in srgb,#b7834a 55%,var(--card));--paper:#fbf7ee;--pink:#e11d48;--type:"Special Elite",ui-monospace,Menlo,monospace}
:root[data-mode=dark]{--cork:color-mix(in srgb,#7a5530 55%,var(--card));--paper:#f3ecdc}
.paperink{color:#2a2418}
/* HUD */
.hud{position:sticky;top:64px;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);box-shadow:0 0 0 1.5px var(--line) inset,var(--sh1);margin-bottom:14px}
.hud .clk{display:flex;align-items:center;gap:8px;font-weight:800}
.hud .clk b{font-family:Fraunces,serif;font-size:22px;font-variant-numeric:tabular-nums}
.hud .clk.warn b{color:var(--bad);animation:kaShake .6s}
.hud .tbar{flex:1;min-width:90px;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.hud .tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--acc));transition:width .6s var(--out)}
.hud .pill{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);border:0}
.hud .pill b{color:var(--ink)}
.cost{position:fixed;z-index:90;font-family:Fraunces,serif;font-weight:800;font-size:26px;color:var(--bad);pointer-events:none;animation:costUp 1.2s var(--out) forwards}
@keyframes costUp{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
/* INTRO */
.cover{position:relative;max-width:720px;margin:10px auto;padding:34px 30px 30px;border-radius:10px 26px 26px 26px;background:linear-gradient(180deg,#d9b77a,#c9a464);color:#3a2a10;box-shadow:var(--sh2);overflow:hidden}
.cover::before{content:"";position:absolute;left:0;top:-18px;width:170px;height:30px;border-radius:12px 12px 0 0;background:#d9b77a}
.cover .tabl{position:absolute;left:22px;top:10px;font:800 11px "Plus Jakarta Sans";letter-spacing:.14em;opacity:.7}
.cover h1{font-family:Fraunces,serif;font-size:clamp(32px,6vw,52px);line-height:1;margin:18px 0 6px;color:#2a1b05}
.cover .sub{font-family:var(--type);font-size:15px;opacity:.85}
.cover .sec{position:absolute;right:18px;top:26px;rotate:12deg;font-family:Fraunces,serif;font-weight:800;font-size:22px;letter-spacing:.12em;color:#b91c1c;border:4px double #b91c1c;border-radius:8px;padding:2px 12px;opacity:.85}
.brief{background:var(--paper);color:#2a2418;border-radius:6px;padding:18px 20px;margin-top:18px;box-shadow:0 2px 0 rgba(0,0,0,.08);font-size:15.5px;line-height:1.6;rotate:-.6deg}
.brief b{color:#000}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rules div{background:rgba(255,255,255,.45);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.rules b{display:block;font-size:13.5px}
.cover .btn{margin-top:18px}
/* BOARD */
.board{border-radius:26px;padding:18px;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.12) 0 2px,transparent 3px) 0 0/22px 22px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.06) 0 2px,transparent 3px) 0 0/18px 18px,var(--cork);box-shadow:inset 0 0 0 10px color-mix(in srgb,#5b3a17 60%,var(--card)),var(--sh2)}
.bsec{margin-bottom:18px}
.bsec h3{display:inline-block;font:800 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#2a1b05;background:var(--paper);padding:5px 10px;border-radius:6px;margin:0 0 10px;rotate:-1deg}
.docs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.doc{position:relative;border:0;text-align:left;padding:16px 12px 12px;min-height:118px;background:var(--paper);color:#2a2418;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .25s var(--spring);font-family:inherit}
.doc:nth-child(odd){rotate:-1.6deg}.doc:nth-child(even){rotate:1.3deg}
.doc:hover:not(:disabled){transform:translateY(-4px) rotate(0)}
.doc::before{content:"";position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fda4af,var(--pink));box-shadow:0 2px 3px rgba(0,0,0,.3)}
.doc .dt{font:800 10.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7a6a4a}
.doc b{display:block;font-family:Fraunces,serif;font-size:16px;line-height:1.2;margin:4px 0}
.doc .ds{font-size:12px;color:#7a6a4a;font-weight:700}
.doc.locked{background:color-mix(in srgb,var(--paper) 55%,#8b7b5b);cursor:not-allowed}
.doc.locked b,.doc.locked .dt{opacity:.45}
.doc.solved::after{content:"ÇÖZÜLDÜ";position:absolute;right:6px;bottom:8px;font:800 11px Fraunces,serif;letter-spacing:.1em;color:#15803d;border:2px solid #15803d;border-radius:5px;padding:1px 5px;rotate:-10deg}
.doc.new{animation:docNew 1.6s ease-in-out infinite}
@keyframes docNew{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 55%,transparent),0 6px 14px rgba(0,0,0,.18)}}
.sus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sp{position:relative;background:var(--paper);color:#2a2418;padding:10px 10px 12px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.18);text-align:center;border:0;font-family:inherit}
.sp:nth-child(odd){rotate:1.2deg}.sp:nth-child(even){rotate:-1.4deg}
.sp svg{width:100%;height:auto;border-radius:3px;display:block;background:#e8e1d0}
.sp b{display:block;font-family:Fraunces,serif;font-size:15px;margin-top:6px}
.sp small{display:block;font-size:11.5px;color:#7a6a4a;font-weight:700}
.sp .int{margin-top:8px;font-size:12px;padding:6px 10px}
.sp .tagx{position:absolute;left:8px;top:8px;font:800 10px "Plus Jakarta Sans";background:var(--acc);color:#1f1300;border-radius:5px;padding:2px 6px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ev{position:relative;background:#fff8c5;color:#2a2418;padding:12px 12px 10px;border-radius:3px;box-shadow:0 5px 10px rgba(0,0,0,.16);font-size:13px;line-height:1.4}
:root[data-mode=dark] .ev{background:#f6eeb4}
.ev:nth-child(3n){rotate:1.5deg}.ev:nth-child(3n+1){rotate:-1.2deg}
.ev::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#93c5fd,#2563eb)}
.ev b{display:block;font-size:13.5px;margin-bottom:2px}
.ev.fresh{animation:kaStamp .6s var(--spring)}
.ev.empty{background:transparent;border:2px dashed rgba(0,0,0,.25);box-shadow:none;color:rgba(0,0,0,.45);display:grid;place-items:center;min-height:70px;font-weight:800;rotate:0deg}
.tline{position:relative;background:var(--paper);color:#2a2418;border-radius:6px;padding:16px 14px 12px;box-shadow:0 6px 14px rgba(0,0,0,.16);overflow-x:auto}
.tline .ax{position:relative;height:74px;min-width:560px}
.tline .ax::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:#2a2418;opacity:.3;border-radius:2px}
.tline .tk{position:absolute;top:0;translate:-50% 0;text-align:center;width:92px}
.tline .tk i{display:block;width:13px;height:13px;border-radius:50%;margin:28px auto 4px;background:var(--p);box-shadow:0 0 0 3px var(--paper)}
.tline .tk.red i{background:var(--bad)}
.tline .tk.q i{background:#bbb}
.tline .tk em{position:absolute;top:2px;left:0;right:0;font-style:normal;font:800 12px "Plus Jakarta Sans";font-variant-numeric:tabular-nums}
.tline .tk span{display:block;font-size:11px;line-height:1.2;font-weight:700;color:#5c4f35}
.acc{display:flex;justify-content:center;margin-top:8px}
/* DOC READER */
.reader{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.paper{position:relative;background:var(--paper);color:#2a2418;border-radius:6px;padding:26px 24px;box-shadow:var(--sh2);font-size:16.5px;line-height:1.8}
.paper.report{font-family:var(--type);font-size:15.5px}
.paper.report .hd{display:flex;justify-content:space-between;border-bottom:2px solid #2a2418;padding-bottom:8px;margin-bottom:12px;font-size:13px;letter-spacing:.06em}
.paper.log{font-family:var(--type);background:repeating-linear-gradient(var(--paper) 0 31px,#cfd8e6 31px 32px);line-height:32px;padding-top:30px;font-size:15px}
.paper.log::before{content:"";position:absolute;left:58px;top:0;bottom:0;width:2px;background:#f2a3a3}
.paper.log .sn{display:block;padding-left:48px;text-indent:-48px}
.paper.mail .mh{font-size:13px;background:#eef1f5;border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.6;color:#3d4757}
.paper.letter .lh{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--p);padding-bottom:10px;margin-bottom:14px;font-family:Fraunces,serif;font-weight:800;font-size:18px;color:var(--p)}
.paper.letter .lh i{width:30px;height:30px;border-radius:8px;background:var(--p);display:grid;place-items:center;color:#fff;font-style:normal}
.phone{max-width:340px;margin:0 auto;border-radius:34px;padding:14px;background:#111;box-shadow:var(--sh2)}
.phone .scr{border-radius:24px;background:#ece5dd;padding:16px 12px 20px;min-height:360px}
.phone .ph{display:flex;align-items:center;gap:8px;font:700 13px "Plus Jakarta Sans";color:#333;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:10px;margin-bottom:12px}
.phone .ph i{width:30px;height:30px;border-radius:50%;background:#999;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.phone .sn{display:block;background:#fff;color:#222;border-radius:4px 16px 16px 16px;padding:9px 12px;margin:0 30px 8px 0;font-size:15px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.phone .sn.meta{background:none;box-shadow:none;text-align:center;font-size:11.5px;color:#777;margin:0 0 8px}
.sn{border-radius:4px;transition:background .3s}
.sn.hl{background:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.gl{border-bottom:2px dotted #b45309;cursor:pointer}
.gl.got{border-bottom-style:solid;border-color:var(--p)}
.gpop{position:fixed;z-index:95;max-width:240px;padding:9px 12px;border-radius:12px;background:#1f2937;color:#fff;font-size:13.5px;line-height:1.35;box-shadow:var(--sh2);animation:kaPop .25s var(--spring);pointer-events:none}
.gpop b{display:block;font-size:15px}
.qs{padding:20px 22px;position:sticky;top:132px}
.qtype{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--p) 12%,var(--card));color:var(--p)}
.qs h3{margin:10px 0 12px;font-size:19px;line-height:1.35}
.qo{display:grid;gap:8px}
.qo button{--d:var(--line2);display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:13px;padding:11px 13px;font-size:15px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.qo button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.qo button kbd{flex:0 0 22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:800 12px "Plus Jakarta Sans"}
.qo button.ok{--d:color-mix(in srgb,var(--ok) 66%,#000);box-shadow:0 0 0 2px var(--ok) inset,0 4px 0 var(--d);background:var(--ok-soft)}
.qo button.no{opacity:.55;box-shadow:0 0 0 2px var(--bad) inset,0 2px 0 var(--bad);background:var(--bad-soft);animation:kaShake .45s}
.qo button:disabled{cursor:default}
.why{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--soft);font-size:14.5px;line-height:1.5;animation:kaRise .4s var(--out)}
.got{animation:kaRise .5s var(--out)}
.earn{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:#fff8c5;color:#2a2418;font-size:13.5px;animation:earn .7s var(--spring)}
.earn i{flex:0 0 34px;height:34px;border-radius:10px;background:#2563eb;color:#fff;display:grid;place-items:center}
.earn i svg{width:18px;height:18px}
@keyframes earn{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* INTERROGATION */
.room{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.port{padding:14px;text-align:center;position:sticky;top:132px}
.port svg{width:100%;height:auto;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 18%,var(--card)),var(--card));display:block}
.port.shake{animation:kaShake .5s}
.port b{display:block;font-family:Fraunces,serif;font-size:21px;margin-top:8px}
.port small{color:var(--mut);font-weight:700}
.mood{margin-top:8px;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.mood i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc),var(--bad));transition:width .6s var(--out)}
.moodl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--mut);margin-top:3px}
.talk{padding:20px 22px}
.tip{font-size:13.5px;color:var(--ink2);background:var(--acc-soft);border-radius:12px;padding:10px 12px;line-height:1.45}
.bubble{position:relative;margin:16px 0 12px;padding:18px 20px;border-radius:20px;background:var(--card2,var(--soft));box-shadow:0 0 0 1.5px var(--line) inset}
.bubble .no{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.bubble .say{font-family:Fraunces,serif;font-size:clamp(20px,2.8vw,25px);line-height:1.45;margin-top:6px;animation:kaRise .35s var(--out)}
.bubble .tr{margin-top:8px;font-size:14.5px;color:var(--ink2);font-style:italic}
.bubble .pr{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line2);font-size:15.5px;color:var(--ink2);animation:kaRise .35s var(--out)}
.bubble .pr b{color:var(--ink)}
.snav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.snav .dots{display:flex;gap:5px}
.snav .dots i{width:22px;height:7px;border-radius:4px;background:var(--soft)}.snav .dots i.c{background:var(--p)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acts .btn{justify-content:center}
.btn-obj{background:var(--bad)!important;color:#fff!important;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)!important}
.sheet{position:fixed;inset:0;z-index:85;background:rgba(10,15,20,.55);display:grid;align-items:end;justify-items:center;animation:kaFade .2s}
.sheet .in{width:min(760px,100%);max-height:82vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 28px;animation:sheetUp .35s var(--out)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
@keyframes kaFade{from{opacity:0}}
.sheet .evs .ev{cursor:pointer;border:0;text-align:left;font-family:inherit}
.sheet .evs .ev:hover{transform:translateY(-3px) rotate(0)}
.slam{position:fixed;inset:0;z-index:99;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(225,29,72,.25),transparent 60%);animation:kaFade .15s}
.slam span{font-family:Fraunces,serif;font-weight:800;font-size:clamp(54px,12vw,120px);letter-spacing:.04em;color:#fff;background:var(--bad);padding:6px 28px;border-radius:16px;rotate:-6deg;box-shadow:0 10px 0 color-mix(in srgb,var(--bad) 55%,#000),0 20px 50px rgba(0,0,0,.4);animation:kaSlam .45s var(--spring)}
body.quake .ka-wrap{animation:quake .5s}
@keyframes quake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.brk{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--bad) 8%,var(--card));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bad) 35%,transparent) inset;animation:kaRise .45s var(--out)}
.brk .say{font-family:Fraunces,serif;font-size:19px;line-height:1.45}
.brk .lesson{margin-top:10px;font-size:14px;color:var(--ink2);background:var(--card);border-radius:10px;padding:10px 12px}
.brk .lesson b{color:var(--ink)}
/* ACCUSE */
.acc-s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.acc-s button{border:0;background:var(--card);border-radius:16px;padding:10px;box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--line2);font-family:inherit;color:var(--ink)}
.acc-s button svg{width:100%;height:auto;border-radius:10px;display:block;background:var(--soft)}
.acc-s button b{display:block;margin-top:6px;font-size:14px}
.acc-s button.on{box-shadow:0 0 0 3px var(--bad) inset,0 4px 0 color-mix(in srgb,var(--bad) 60%,#000);background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.slot{border:2px dashed var(--line2);border-radius:16px;padding:12px;min-height:130px;background:var(--card);text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.slot:hover{border-color:var(--p)}
.slot h4{margin:0;font:800 12px "Plus Jakarta Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--p)}
.slot p{margin:0;font-size:12.5px;color:var(--mut)}
.slot .ev{rotate:0deg;margin-top:auto}
.slot.ok{border:2px solid var(--ok)}.slot.bad{border:2px solid var(--bad);animation:kaShake .45s}
/* END */
.verdict{max-width:760px;margin:0 auto;text-align:center;padding:30px 24px;position:relative;overflow:hidden}
.verdict .stamp{display:inline-block;font-family:Fraunces,serif;font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:.1em;color:var(--ok);border:6px double var(--ok);border-radius:14px;padding:4px 20px;rotate:-8deg;animation:kaSlam .6s var(--spring)}
.verdict .stamp.bad{color:var(--bad);border-color:var(--bad)}
.epi{text-align:left;background:var(--paper);color:#2a2418;border-radius:8px;padding:18px 20px;margin:18px 0;font-size:16px;line-height:1.7;box-shadow:var(--sh1)}
.epi .ttr{margin-top:10px;font-size:14px;color:#5c4f35;font-style:italic}
.rankb{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 10px}
.rankb i{width:80px;height:80px;border-radius:26px;background:var(--p);color:var(--p-ink);display:grid;place-items:center;animation:kaStamp .6s var(--spring) .3s backwards}
.rankb i svg{width:44px;height:44px}
.rankb b{font-family:Fraunces,serif;font-size:26px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat div{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:26px}
.stat span{font-size:12px;font-weight:800;color:var(--mut)}
.skills{text-align:left;display:grid;gap:8px;margin:12px 0}
.skills div{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.skills .bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.skills .bar i{display:block;height:100%;background:var(--p);border-radius:6px}
.skills .bar i.lo{background:var(--bad)}
.skills span{text-align:right;color:var(--mut)}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.words span{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.words span em{font-style:normal;color:var(--mut);font-weight:600}

const CASE_ORDER=['harita','veri'];

/* ================= MOTOR ================= */
const COST={doc:20,talk:15,wrong:15,hint:10,tr:5,ask:10,badEv:20,badAcc:30};
const KEY='ka_dava2';
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))||{cases:{},cur:null}}catch(e){DB={cases:{},cur:null}}
const fresh=()=>({phase:'intro',mode:null,used:0,docs:{},ev:[],words:{},talks:{},first:{},wrongs:0,acc:null,end:null,newEv:null,note:null,rank:null});
let C=null,S=null;
const save=()=>{try{if(C)DB.cases[C.id]=S;localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
function useCase(id){C=CASES[id];DB.cur=id;S=DB.cases[id]||fresh();DB.cases[id]=S;save()}
const timed=()=>S.mode==='det';
const left=()=>Math.max(0,C.limit-S.used);
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const clock=()=>hm(C.start+S.used);
const EVK=()=>Object.keys(C.ev);
function spend(min,el){
  if(!timed()){S.used+=Math.round(min/2);save();return}
  S.used+=min;save();
  if(el){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='cost';d.textContent='−'+min+' dk';d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top-10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
  hud();if(left()<=0){S.end='time';S.phase='end';save();setTimeout(render,700)}}
const docOf=id=>C.docs.find(d=>d.id===id);
const solved=id=>{const d=S.docs[id];return d&&d.solved};
const talkDone=id=>{const t=S.talks[id];return t&&t.done};
const isOpen=id=>{const u=(docOf(id)||C.talk[id]).unlock;return u.every(x=>x.startsWith('i_')?talkDone(x):solved(x))};
const susOf=k=>C.sus.find(s=>s.k===k);
const evDoc=e=>{for(const d of C.docs)for(const q of d.q)if(q.e===e)return d;return null};
/* ---------- portreler ---------- */
function face(f){
  if(f.shadow)return `<svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" fill="#1e293b"/><path d="M30 200c6-40 34-62 70-62s64 22 70 62z" fill="#334155"/><ellipse cx="100" cy="82" rx="38" ry="44" fill="#334155"/><text x="100" y="100" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="56" fill="#94a3b8">?</text></svg>`;
  const c=f.c,hair=f.hair||'#1c1917',skin=f.skin||'#e8b98f';

   bun:`<circle cx="100" cy="30" r="15" fill="${hair}"/><g fill="none" stroke="#111" stroke-width="3"><circle cx="86" cy="80" r="9"/><circle cx="114" cy="80" r="9"/><path d="M95 80h10"/></g>`,
   glasses:`<g fill="none" stroke="#111" stroke-width="3.5"><rect x="74" y="72" width="22" height="17" rx="5"/><rect x="104" y="72" width="22" height="17" rx="5"/><path d="M96 80h8"/></g>`,
   beard:`<path d="M66 92c4 30 18 38 34 38s30-8 34-38c-8 10-20 14-34 14s-26-4-34-14z" fill="${hair}"/>`}[f.acc]||'';
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><path d="M30 200c6-40 34-62 70-62s64 22 70 62z" fill="${c}"/><path d="M84 140l16 22 16-22" fill="#fff" opacity=".85"/><rect x="88" y="112" width="24" height="30" fill="${skin}"/><ellipse cx="100" cy="82" rx="38" ry="44" fill="${skin}"/><path d="M62 76c0-30 16-44 38-44s38 14 38 44c-8-12-20-18-38-18s-30 6-38 18z" fill="${hair}"/><circle cx="86" cy="82" r="4" fill="#1f2937"/><circle cx="114" cy="82" r="4" fill="#1f2937"/><path d="M90 106q10 6 20 0" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>${acc}</svg>`;
}
const NIL=`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="var(--p)"/><path d="M12 64c2-14 10-20 20-20s18 6 20 20z" fill="#1e3a5f"/><ellipse cx="32" cy="28" rx="13" ry="15" fill="#e8b98f"/><path d="M18 28c0-12 6-17 14-17s14 5 14 17c-3-5-8-7-14-7s-11 2-14 7z" fill="#292524"/><path d="M17 30c-3 10 0 18 4 20M47 30c3 10 0 18-4 20" stroke="#292524" stroke-width="4" fill="none"/><circle cx="27" cy="29" r="1.8" fill="#111"/><circle cx="37" cy="29" r="1.8" fill="#111"/><path d="M28 36q4 3 8 0" stroke="#7f1d1d" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
/* ---------- görev ---------- */
function objective(){
  for(const d of C.docs)if(isOpen(d.id)&&!solved(d.id))return {t:S.docs[d.id]?`"${d.t}" belgesine devam et`:`"${d.t}" belgesini oku`,a:`data-open="${d.id}"`};
  for(const s of C.sus)if(s.talk&&isOpen(s.talk)&&!talkDone(s.talk))return {t:`${s.n} ile sorguya gir`,a:`data-talk="${s.talk}"`};
  if(C.docs.every(d=>solved(d.id)))return {t:'Suçluyu göster',a:'data-go="accuse"'};
  return null;
}
/* ---------- HUD ---------- */
function hudHtml(){const l=left();return `<div class="hud" id="hud">${timed()?`<div class="clk ${l<=45?'warn':''}">${I.clock.replace('<svg','<svg width="20" height="20"')}<b>${clock()}</b></div><div class="tbar" title="${C.deadline}'e kalan süre"><i style="width:${l/C.limit*100}%"></i></div>`:`<div class="clk"><span class="pill" style="background:var(--p);color:var(--p-ink)">Hikâye modu</span></div><div style="flex:1"></div>`}<span class="pill">Kanıt <b>${S.ev.length}/${EVK().length}</b></span><button class="pill" id="defter">Defter <b>${Object.keys(S.words).length}</b></button>${S.phase!=='board'?'<button class="pill" data-go="board">← Pano</button>':'<button class="pill" data-go="desk">Masa</button>'}</div>`}
function hud(){const h=$('#hud');if(h)h.outerHTML=hudHtml()}
/* ---------- render ---------- */
function render(){
  const v=$('#view');
  if(!C||S.phase==='desk'||DB.cur==null){return desk()}
  if(S.phase==='intro')return intro();
  if(S.phase==='end')return ending();
  if(S.phase==='board')v.innerHTML=hudHtml()+board();
  else if(S.phase.startsWith('d'))v.innerHTML=hudHtml()+reader(S.phase);
  else if(S.phase.startsWith('i_')){v.innerHTML=hudHtml()+room(S.phase);typewrite()}
  else if(S.phase==='accuse')v.innerHTML=hudHtml()+accuse();
  S.newEv=null;save();
}
function desk(){
  DB.cur=null;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}

  if(a.who!==sol.who){a.msg='<b>Suçlama çöktü.</b> '+(sol.wrong[a.who]||'Bu kişiyi destekleyen yeterli kanıt yok.');a.res=null;S.wrongs++;KA.sfx.bad();save();spend(COST.badAcc,el);if(S.phase==='accuse')render();return}
  const r=sol.slots.map((s,i)=>s[2].includes(a.slots[i]));a.res=r;
  if(r.every(Boolean)){S.end='win';save();try{KA.addXp(60,'dava')}catch(e){}const sl=document.createElement('div');sl.className='slam';sl.innerHTML='<span>SUÇLU!</span>';document.body.appendChild(sl);document.body.classList.add('quake');KA.sfx.ok();setTimeout(()=>{sl.remove();document.body.classList.remove('quake');go('end')},1100);return}
  a.msg=`<b>Doğru kişi, ama iddian zayıf.</b> ${sol.slots.map((s,i)=>r[i]?'':s[0]).filter(Boolean).join(' ve ')} kanıtı bunu desteklemiyor. İpucu: ${sol.hint}`;
  S.wrongs++;KA.sfx.bad();save();spend(15,el);if(S.phase==='accuse')render();
}
function slotPick(i){sheet(`${C.sol.slots[i][0]} için kanıt seç`,`<div class="evs">${S.ev.map(e=>`<button class="ev" data-se="${e}" data-si="${i}"><b>${esc(C.ev[e].t)}</b>${esc(C.ev[e].d)}<q>${esc(C.ev[e].en)}</q></button>`).join('')}</div>`)}
function defter(){const w=Object.entries(S.words);sheet(`Dedektif defteri · ${w.length} kelime`,w.length?`<div class="words" style="justify-content:flex-start">${w.map(([a,b])=>`<span>${esc(a)} <em>· ${esc(b)}</em></span>`).join('')}</div>`:'<p class="mut">Belgelerdeki noktalı kelimelere dokundukça burası dolacak.</p>')}
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let b;
  if(q('[data-close]')||t.classList.contains('sheet')){document.querySelector('.sheet')?.remove();return}
  if(b=q('[data-case]')){useCase(b.dataset.case);render();window.scrollTo({top:0});return}
  if(b=q("[data-gm]")){S.mode=b.dataset.gm;S.phase='board';save();render();return}
  if(q('#cont')){if(!S.mode)S.mode='story';go(S.phase==='intro'?'board':S.phase);return}
  if(q('#restart')){const m=S.mode;DB.cases[C.id]=S=fresh();save();render();return}
  if(b=q('[data-go]')){go(b.dataset.go);return}
  if(q('#defter')){defter();return}
  if(b=q('[data-open]')){openDoc(b.dataset.open,b);return}
  if(b=q('[data-talk]')){openTalk(b.dataset.talk,b);return}
  if(b=q('[data-gl]')){gloss(b);return}
  if(b=q('[data-qa]')){answer(+b.dataset.qa,b);return}
  if(q('#qhint')){const st=S.docs[S.phase],d=docOf(S.phase);st.hl=d.q[st.qi].ev;st.hinted=true;S.first[S.phase+st.qi]=false;save();spend(COST.hint,q('#qhint'));render();setTimeout(()=>document.querySelector('.sn.hl')?.scrollIntoView({behavior:'smooth',block:'center'}),80);return}
  if(q('#qnext')){const st=S.docs[S.phase];if(st.qi===0){st.qi=1;st.ans=null;st.wr=[];st.hl=null;st.hinted=false;save();render()}else{st.solved=true;S.note=docOf(S.phase).note;save();go('board')}return}
  const T=S&&S.phase&&S.phase.startsWith('i_')?S.talks[S.phase]:null;
  if(T){const list=curList(S.phase),cur=list[T.i];
    if(q('#sp')){T.i--;save();render();return}
    if(q('#sn')){T.i++;save();render();return}
    if(b=q('[data-si]')){T.i=+b.dataset.si;save();render();return}
    if(q('#press')){if(!T.pr.includes(cur.en))T.pr.push(cur.en);save();render();return}
    if(q('#trn')){T.trs.push(cur.en);save();spend(COST.tr,q('#trn'));render();return}
    if(q('#ask')){askNil();return}
    if(q('#present')){presentEv();return}
    if(b=q('[data-pe]')){pickEv(b.dataset.pe);return}
  }
  if(b=q('[data-who]')){S.acc.who=b.dataset.who;S.acc.res=null;S.acc.msg=null;save();render();return}
  if(b=q('[data-slot]')){slotPick(+b.dataset.slot);return}
  if(b=q('[data-se]')){S.acc.slots[+b.dataset.si]=b.dataset.se;S.acc.res=null;S.acc.msg=null;document.querySelector('.sheet')?.remove();save();render();return}
  if(q('#doacc')){doAccuse(q('#doacc'));return}
  if(q('#addw')){Object.entries(S.words).forEach(([w,t])=>KA.addUnknown(w,t));KA.toast('Kelimeler Bilmediklerim listesine eklendi.');q('#addw').disabled=true;return}
});
KA.nav('oyunlar.html');
if(DB.cur&&CASES[DB.cur])useCase(DB.cur);
render();

})();
</script>
