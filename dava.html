<!DOCTYPE html>
<html lang="tr" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dedektif Masası · Kelime Arenası</title>
<meta name="theme-color" content="#0f766e">
<script>try{var m=localStorage.getItem('ka_pal');document.documentElement.dataset.mode=(m==='derin_akdeniz')?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Special+Elite&display=swap">
<link rel="stylesheet" href="ortak.css?v=14">
<style>
:root{--cork:color-mix(in srgb,#b7834a 55%,var(--card));--paper:#fbf7ee;--pink:#e11d48;--type:"Special Elite",ui-monospace,Menlo,monospace}
:root[data-mode=dark]{--cork:color-mix(in srgb,#7a5530 55%,var(--card));--paper:#f3ecdc}
.paperink{color:#2a2418}
/* HUD */
.hud{position:sticky;top:64px;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);box-shadow:0 0 0 1.5px var(--line) inset,var(--sh1);margin-bottom:14px}
.hud .clk{display:flex;align-items:center;gap:8px;font-weight:800}
.hud .clk b{font-family:Fraunces,serif;font-size:22px;font-variant-numeric:tabular-nums}
.hud .clk.warn b{color:var(--bad);animation:kaShake .6s}
.hud .tbar{flex:1;min-width:90px;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.hud .tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--acc));transition:width .6s var(--out)}
.hud .pill{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);border:0}
.hud .pill b{color:var(--ink)}
.cost{position:fixed;z-index:90;font-family:Fraunces,serif;font-weight:800;font-size:26px;color:var(--bad);pointer-events:none;animation:costUp 1.2s var(--out) forwards}
@keyframes costUp{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
/* INTRO */
.cover{position:relative;max-width:720px;margin:10px auto;padding:34px 30px 30px;border-radius:10px 26px 26px 26px;background:linear-gradient(180deg,#d9b77a,#c9a464);color:#3a2a10;box-shadow:var(--sh2);overflow:hidden}
.cover::before{content:"";position:absolute;left:0;top:-18px;width:170px;height:30px;border-radius:12px 12px 0 0;background:#d9b77a}
.cover .tabl{position:absolute;left:22px;top:10px;font:800 11px "Plus Jakarta Sans";letter-spacing:.14em;opacity:.7}
.cover h1{font-family:Fraunces,serif;font-size:clamp(32px,6vw,52px);line-height:1;margin:18px 0 6px;color:#2a1b05}
.cover .sub{font-family:var(--type);font-size:15px;opacity:.85}
.cover .sec{position:absolute;right:18px;top:26px;rotate:12deg;font-family:Fraunces,serif;font-weight:800;font-size:22px;letter-spacing:.12em;color:#b91c1c;border:4px double #b91c1c;border-radius:8px;padding:2px 12px;opacity:.85}
.brief{background:var(--paper);color:#2a2418;border-radius:6px;padding:18px 20px;margin-top:18px;box-shadow:0 2px 0 rgba(0,0,0,.08);font-size:15.5px;line-height:1.6;rotate:-.6deg}
.brief b{color:#000}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rules div{background:rgba(255,255,255,.45);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.rules b{display:block;font-size:13.5px}
.cover .btn{margin-top:18px}
/* BOARD */
.board{border-radius:26px;padding:18px;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.12) 0 2px,transparent 3px) 0 0/22px 22px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.06) 0 2px,transparent 3px) 0 0/18px 18px,var(--cork);box-shadow:inset 0 0 0 10px color-mix(in srgb,#5b3a17 60%,var(--card)),var(--sh2)}
.bsec{margin-bottom:18px}
.bsec h3{display:inline-block;font:800 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#2a1b05;background:var(--paper);padding:5px 10px;border-radius:6px;margin:0 0 10px;rotate:-1deg}
.docs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.doc{position:relative;border:0;text-align:left;padding:16px 12px 12px;min-height:118px;background:var(--paper);color:#2a2418;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .25s var(--spring);font-family:inherit}
.doc:nth-child(odd){rotate:-1.6deg}.doc:nth-child(even){rotate:1.3deg}
.doc:hover:not(:disabled){transform:translateY(-4px) rotate(0)}
.doc::before{content:"";position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fda4af,var(--pink));box-shadow:0 2px 3px rgba(0,0,0,.3)}
.doc .dt{font:800 10.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7a6a4a}
.doc b{display:block;font-family:Fraunces,serif;font-size:16px;line-height:1.2;margin:4px 0}
.doc .ds{font-size:12px;color:#7a6a4a;font-weight:700}
.doc.locked{background:color-mix(in srgb,var(--paper) 55%,#8b7b5b);cursor:not-allowed}
.doc.locked b,.doc.locked .dt{opacity:.45}
.doc.solved::after{content:"ÇÖZÜLDÜ";position:absolute;right:6px;bottom:8px;font:800 11px Fraunces,serif;letter-spacing:.1em;color:#15803d;border:2px solid #15803d;border-radius:5px;padding:1px 5px;rotate:-10deg}
.doc.new{animation:docNew 1.6s ease-in-out infinite}
@keyframes docNew{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 55%,transparent),0 6px 14px rgba(0,0,0,.18)}}
.sus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sp{position:relative;background:var(--paper);color:#2a2418;padding:10px 10px 12px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.18);text-align:center;border:0;font-family:inherit}
.sp:nth-child(odd){rotate:1.2deg}.sp:nth-child(even){rotate:-1.4deg}
.sp svg{width:100%;height:auto;border-radius:3px;display:block;background:#e8e1d0}
.sp b{display:block;font-family:Fraunces,serif;font-size:15px;margin-top:6px}
.sp small{display:block;font-size:11.5px;color:#7a6a4a;font-weight:700}
.sp .int{margin-top:8px;font-size:12px;padding:6px 10px}
.sp .tagx{position:absolute;left:8px;top:8px;font:800 10px "Plus Jakarta Sans";background:var(--acc);color:#1f1300;border-radius:5px;padding:2px 6px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ev{position:relative;background:#fff8c5;color:#2a2418;padding:12px 12px 10px;border-radius:3px;box-shadow:0 5px 10px rgba(0,0,0,.16);font-size:13px;line-height:1.4}
:root[data-mode=dark] .ev{background:#f6eeb4}
.ev:nth-child(3n){rotate:1.5deg}.ev:nth-child(3n+1){rotate:-1.2deg}
.ev::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#93c5fd,#2563eb)}
.ev b{display:block;font-size:13.5px;margin-bottom:2px}
.ev.fresh{animation:kaStamp .6s var(--spring)}
.ev.empty{background:transparent;border:2px dashed rgba(0,0,0,.25);box-shadow:none;color:rgba(0,0,0,.45);display:grid;place-items:center;min-height:70px;font-weight:800;rotate:0deg}
.tline{position:relative;background:var(--paper);color:#2a2418;border-radius:6px;padding:16px 14px 12px;box-shadow:0 6px 14px rgba(0,0,0,.16);overflow-x:auto}
.tline .ax{position:relative;height:74px;min-width:560px}
.tline .ax::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:#2a2418;opacity:.3;border-radius:2px}
.tline .tk{position:absolute;top:0;translate:-50% 0;text-align:center;width:92px}
.tline .tk i{display:block;width:13px;height:13px;border-radius:50%;margin:28px auto 4px;background:var(--p);box-shadow:0 0 0 3px var(--paper)}
.tline .tk.red i{background:var(--bad)}
.tline .tk.q i{background:#bbb}
.tline .tk em{position:absolute;top:2px;left:0;right:0;font-style:normal;font:800 12px "Plus Jakarta Sans";font-variant-numeric:tabular-nums}
.tline .tk span{display:block;font-size:11px;line-height:1.2;font-weight:700;color:#5c4f35}
.acc{display:flex;justify-content:center;margin-top:8px}
/* DOC READER */
.reader{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.paper{position:relative;background:var(--paper);color:#2a2418;border-radius:6px;padding:26px 24px;box-shadow:var(--sh2);font-size:16.5px;line-height:1.8}
.paper.report{font-family:var(--type);font-size:15.5px}
.paper.report .hd{display:flex;justify-content:space-between;border-bottom:2px solid #2a2418;padding-bottom:8px;margin-bottom:12px;font-size:13px;letter-spacing:.06em}
.paper.log{font-family:var(--type);background:repeating-linear-gradient(var(--paper) 0 31px,#cfd8e6 31px 32px);line-height:32px;padding-top:30px;font-size:15px}
.paper.log::before{content:"";position:absolute;left:58px;top:0;bottom:0;width:2px;background:#f2a3a3}
.paper.log .sn{display:block;padding-left:48px;text-indent:-48px}
.paper.mail .mh{font-size:13px;background:#eef1f5;border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.6;color:#3d4757}
.paper.letter .lh{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--p);padding-bottom:10px;margin-bottom:14px;font-family:Fraunces,serif;font-weight:800;font-size:18px;color:var(--p)}
.paper.letter .lh i{width:30px;height:30px;border-radius:8px;background:var(--p);display:grid;place-items:center;color:#fff;font-style:normal}
.phone{max-width:340px;margin:0 auto;border-radius:34px;padding:14px;background:#111;box-shadow:var(--sh2)}
.phone .scr{border-radius:24px;background:#ece5dd;padding:16px 12px 20px;min-height:360px}
.phone .ph{display:flex;align-items:center;gap:8px;font:700 13px "Plus Jakarta Sans";color:#333;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:10px;margin-bottom:12px}
.phone .ph i{width:30px;height:30px;border-radius:50%;background:#999;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.phone .sn{display:block;background:#fff;color:#222;border-radius:4px 16px 16px 16px;padding:9px 12px;margin:0 30px 8px 0;font-size:15px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.phone .sn.meta{background:none;box-shadow:none;text-align:center;font-size:11.5px;color:#777;margin:0 0 8px}
.sn{border-radius:4px;transition:background .3s}
.sn.hl{background:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.gl{border-bottom:2px dotted #b45309;cursor:pointer}
.gl.got{border-bottom-style:solid;border-color:var(--p)}
.gpop{position:fixed;z-index:95;max-width:240px;padding:9px 12px;border-radius:12px;background:#1f2937;color:#fff;font-size:13.5px;line-height:1.35;box-shadow:var(--sh2);animation:kaPop .25s var(--spring);pointer-events:none}
.gpop b{display:block;font-size:15px}
.qs{padding:20px 22px;position:sticky;top:132px}
.qtype{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--p) 12%,var(--card));color:var(--p)}
.qs h3{margin:10px 0 12px;font-size:19px;line-height:1.35}
.qo{display:grid;gap:8px}
.qo button{--d:var(--line2);display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:13px;padding:11px 13px;font-size:15px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--d);transition:transform .08s,box-shadow .08s}
.qo button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--d)}
.qo button kbd{flex:0 0 22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:800 12px "Plus Jakarta Sans"}
.qo button.ok{--d:color-mix(in srgb,var(--ok) 66%,#000);box-shadow:0 0 0 2px var(--ok) inset,0 4px 0 var(--d);background:var(--ok-soft)}
.qo button.no{opacity:.55;box-shadow:0 0 0 2px var(--bad) inset,0 2px 0 var(--bad);background:var(--bad-soft);animation:kaShake .45s}
.qo button:disabled{cursor:default}
.why{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--soft);font-size:14.5px;line-height:1.5;animation:kaRise .4s var(--out)}
.got{animation:kaRise .5s var(--out)}
.earn{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:#fff8c5;color:#2a2418;font-size:13.5px;animation:earn .7s var(--spring)}
.earn i{flex:0 0 34px;height:34px;border-radius:10px;background:#2563eb;color:#fff;display:grid;place-items:center}
.earn i svg{width:18px;height:18px}
@keyframes earn{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* INTERROGATION */
.room{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.port{padding:14px;text-align:center;position:sticky;top:132px}
.port svg{width:100%;height:auto;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 18%,var(--card)),var(--card));display:block}
.port.shake{animation:kaShake .5s}
.port b{display:block;font-family:Fraunces,serif;font-size:21px;margin-top:8px}
.port small{color:var(--mut);font-weight:700}
.mood{margin-top:8px;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.mood i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc),var(--bad));transition:width .6s var(--out)}
.moodl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--mut);margin-top:3px}
.talk{padding:20px 22px}
.tip{font-size:13.5px;color:var(--ink2);background:var(--acc-soft);border-radius:12px;padding:10px 12px;line-height:1.45}
.bubble{position:relative;margin:16px 0 12px;padding:18px 20px;border-radius:20px;background:var(--card2,var(--soft));box-shadow:0 0 0 1.5px var(--line) inset}
.bubble .no{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.bubble .say{font-family:Fraunces,serif;font-size:clamp(20px,2.8vw,25px);line-height:1.45;margin-top:6px;animation:kaRise .35s var(--out)}
.bubble .tr{margin-top:8px;font-size:14.5px;color:var(--ink2);font-style:italic}
.bubble .pr{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line2);font-size:15.5px;color:var(--ink2);animation:kaRise .35s var(--out)}
.bubble .pr b{color:var(--ink)}
.snav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.snav .dots{display:flex;gap:5px}
.snav .dots i{width:22px;height:7px;border-radius:4px;background:var(--soft)}.snav .dots i.c{background:var(--p)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acts .btn{justify-content:center}
.btn-obj{background:var(--bad)!important;color:#fff!important;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)!important}
.sheet{position:fixed;inset:0;z-index:85;background:rgba(10,15,20,.55);display:grid;align-items:end;justify-items:center;animation:kaFade .2s}
.sheet .in{width:min(760px,100%);max-height:82vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 28px;animation:sheetUp .35s var(--out)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
@keyframes kaFade{from{opacity:0}}
.sheet .evs .ev{cursor:pointer;border:0;text-align:left;font-family:inherit}
.sheet .evs .ev:hover{transform:translateY(-3px) rotate(0)}
.slam{position:fixed;inset:0;z-index:99;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(225,29,72,.25),transparent 60%);animation:kaFade .15s}
.slam span{font-family:Fraunces,serif;font-weight:800;font-size:clamp(54px,12vw,120px);letter-spacing:.04em;color:#fff;background:var(--bad);padding:6px 28px;border-radius:16px;rotate:-6deg;box-shadow:0 10px 0 color-mix(in srgb,var(--bad) 55%,#000),0 20px 50px rgba(0,0,0,.4);animation:kaSlam .45s var(--spring)}
body.quake .ka-wrap{animation:quake .5s}
@keyframes quake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.brk{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--bad) 8%,var(--card));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bad) 35%,transparent) inset;animation:kaRise .45s var(--out)}
.brk .say{font-family:Fraunces,serif;font-size:19px;line-height:1.45}
.brk .lesson{margin-top:10px;font-size:14px;color:var(--ink2);background:var(--card);border-radius:10px;padding:10px 12px}
.brk .lesson b{color:var(--ink)}
/* ACCUSE */
.acc-s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.acc-s button{border:0;background:var(--card);border-radius:16px;padding:10px;box-shadow:0 0 0 1.5px var(--line2) inset,0 4px 0 var(--line2);font-family:inherit;color:var(--ink)}
.acc-s button svg{width:100%;height:auto;border-radius:10px;display:block;background:var(--soft)}
.acc-s button b{display:block;margin-top:6px;font-size:14px}
.acc-s button.on{box-shadow:0 0 0 3px var(--bad) inset,0 4px 0 color-mix(in srgb,var(--bad) 60%,#000);background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.slot{border:2px dashed var(--line2);border-radius:16px;padding:12px;min-height:130px;background:var(--card);text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.slot:hover{border-color:var(--p)}
.slot h4{margin:0;font:800 12px "Plus Jakarta Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--p)}
.slot p{margin:0;font-size:12.5px;color:var(--mut)}
.slot .ev{rotate:0deg;margin-top:auto}
.slot.ok{border:2px solid var(--ok)}.slot.bad{border:2px solid var(--bad);animation:kaShake .45s}
/* END */
.verdict{max-width:760px;margin:0 auto;text-align:center;padding:30px 24px;position:relative;overflow:hidden}
.verdict .stamp{display:inline-block;font-family:Fraunces,serif;font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:.1em;color:var(--ok);border:6px double var(--ok);border-radius:14px;padding:4px 20px;rotate:-8deg;animation:kaSlam .6s var(--spring)}
.verdict .stamp.bad{color:var(--bad);border-color:var(--bad)}
.epi{text-align:left;background:var(--paper);color:#2a2418;border-radius:8px;padding:18px 20px;margin:18px 0;font-size:16px;line-height:1.7;box-shadow:var(--sh1)}
.epi .ttr{margin-top:10px;font-size:14px;color:#5c4f35;font-style:italic}
.rankb{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 10px}
.rankb i{width:80px;height:80px;border-radius:26px;background:var(--p);color:var(--p-ink);display:grid;place-items:center;animation:kaStamp .6s var(--spring) .3s backwards}
.rankb i svg{width:44px;height:44px}
.rankb b{font-family:Fraunces,serif;font-size:26px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat div{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:26px}
.stat span{font-size:12px;font-weight:800;color:var(--mut)}
.skills{text-align:left;display:grid;gap:8px;margin:12px 0}
.skills div{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.skills .bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.skills .bar i{display:block;height:100%;background:var(--p);border-radius:6px}
.skills .bar i.lo{background:var(--bad)}
.skills span{text-align:right;color:var(--mut)}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.words span{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.words span em{font-style:normal;color:var(--mut);font-weight:600}

 {id:'d1',k:'mail',t:'İsimsiz e-posta',sub:'10 Nisan, 07:48',unlock:[],
  mh:'<b>From:</b> a.concerned.scientist@protonmail.com<br><b>To:</b> editor@journal-of-memory.org<br><b>Subject:</b> Paper #2291: urgent',
  s:['Dear Editor,','I am writing to warn you about the paper by Dr. Kaya\'s team, which you plan to publish today.','The figures in Table 2 do not match the original data.','In the original file, the improvement in memory was around 5 percent, not 40 percent.','I believe the file was changed only a few hours before the paper was submitted.','I cannot reveal my name, but please check the file history.'],
  g:{'warn':'uyarmak','figures':'rakamlar','original':'asıl, orijinal','improvement':'iyileşme, gelişme','submitted':'gönderildi, teslim edildi','reveal':'açıklamak, ifşa etmek'},
  note:'%40 sahte olabilir. İpucu e-postanın sonunda: dosya geçmişine bakalım. Kim, ne zaman değiştirmiş?',
  q:[{ty:'Bağlamda anlam',q:'In the text, the word "figures" is closest in meaning to…',o:['people','numbers','pictures','shapes'],a:1,ev:2,e:'v1',why:'"Table 2" ve hemen sonraki "5 percent, not 40 percent" ipucu: figures burada sayılar. Bağlamda anlam sorularında çevredeki kelimeler anlamı daraltır.'},
     {ty:'Detay',q:'According to the writer, when was the file changed?',o:['After the paper was published','Shortly before the paper was submitted','Years before the study began','While the editor was reading it'],a:1,ev:4,e:'v2',why:'"only a few hours before the paper was submitted" = shortly before. Paraphrase: aynı anlam, farklı kelimeler.'}]},

 {id:'d3',k:'report',t:'Denetim raporu',sub:'5 Nisan',unlock:['d1'],head:['SAFETY & IT INSPECTION','LAB B-12'],
  s:['During the weekly inspection on 5 April, several problems were noted in Lab B-12.','Most importantly, a note with a username and password was found stuck to the monitor of PC-3.','The note was clearly visible to anyone entering the lab.','The lab manager was asked to remove it immediately; however, at the time of this report, it had not been removed.'],

he museum at all\"</b> ↔ <b>\"4 May 19:55: S. Yıldız, entry\"</b>. Bir kayıt, kesin konuşan bir ifadeyi tek satırda çürütür."}, {"en": "Only Dr. Demir decides when a fossil is moved.", "tr": "Bir fosilin ne zaman taşınacağına yalnızca Dr. Demir karar verir.", "pr": "That is the procedure here."}]}, "i_ok": {"who": "ok", "unlock": ["d3"], "done": ["d4"], "note": "Okan Demir'in \"eğitim maketi\" bahanesi çöktü. Bilgi işlem, iş e-postasındaki bir mesajı buldu.", "st": [{"en": "Cleaning a fossil is a routine procedure. There is nothing unusual about it.", "tr": "Bir fosili temizlemek rutin bir işlemdir. Olağandışı bir şey yok.", "pr": "I have done it hundreds of times."}, {"en": "The plaster and the resin were for the education department. They asked me for training models.", "tr": "Alçı ve reçine eğitim birimi içindi. Benden eğitim maketi istediler.", "pr": "Children love touching copies of fossils.", "c": ["f6"], "w": ["education", "asked", "training"], "br": "…Fine. Nobody asked me for models. But making a copy is not a crime, detective.", "lesson": "<b>\"They asked me for training models\"</b> ↔ <b>\"We have not requested any training models this year\"</b>. Biri \"istediler\" diyor, diğeri \"hiç istemedik\". Tam zıtlık."}, {"en": "I would never sell a single piece from this museum.", "tr": "Bu müzeden tek bir parçayı bile asla satmam.", "pr": "This collection is my life."}]}}, "tl": [["28 Nis", "Kalıp siparişi", "f5", "", 4], ["3 May", "Atölyeye alındı", "f3", "red", 22], ["4 May", "Sena girer", "f4", "", 38], ["5 May", "Vitrine döner", "f3", "red", 54], ["15 May", "80.000 € teklif", "f7", "red", 70], ["21 May", "Kopya fark edilir", "f1", "", 84], ["22 May", "Teslim günü", "f8", "red", 97]], "sol": {"who": "ok", "slots": [["Sebep", "Neden yaptı?", ["f7", "f8"]], ["Araç", "Kopyayı neyle yaptı?", ["f5", "f6", "f2"]], ["Fırsat", "Orijinale nasıl ulaştı?", ["f3"]]], "hint": "Sebep için teklif, araç için sipariş edilen malzeme, fırsat için atölyedeki iki gün.", "wrong": " Kaynağı göstermelisin.", "q": [{"ty": "Doğru / Yanlış / Yok", "q": "\"Deniz Kaya paid Ece Arslan before she sent the file.\"", "o": ["True", "False", "Not given"], "a": 1, "ev": 1, "e": "s8", "why": "Dosya 21:40'ta gitti, para 21:52'de. Önce dosya, sonra para: ifade sırayı ters çeviriyor → False. Sıra soruları saat karşılaştırmasıyla çözülür."}, {"ty": "Çıkarım", "q": "Who is \"midnight_owl\"?", "o": ["Ece Arslan", "Deniz Kaya", "Mr. Hall", "A moderator"], "a": 1, "ev": 0, "e": "s7", "why": "Hesap d.k.2005 adresiyle açılmış; d3'e göre bu adres Deniz Kaya'nın. İki belgeyi birleştirerek çıkarım."}], "head": ["POLICE REQUEST · Records", "9 December"]}], "sus": [{"k": "ha", "n": "Mr. Peter Hall", "r": "Okutman, sınavı hazırlayan", "f": {"c": "#1e3a8a", "hair": "#a8a29e", "acc": "beard"}, "talk": "i_ha"}, {"k": "ec", "n": "Ece Arslan", "r": "Asistan, okuma kontrolü", "f": {"c": "#be185d", "hair": "#292524", "acc": "glasses"}, "talk": "i_ec"}, {"k": "de", "n": "Deniz Kaya", "r": "Hazırlık öğrencisi", "f": {"c": "#ea580c", "hair": "#1c1917"}}, {"k": "po", "n": "Matbaa", "r": "Baskı ofisi", "f": {"shadow": 1}}], "talk": {"i_ha": {"who": "ha", "unlock": ["d2"], "done": ["d3"], "note": "Mr. Hall taslağı Ece'yle paylaştığını kabul etti. Bilgi işlem, o gecenin e-posta kayıtlarını çıkardı.", "st": [{"en": "I have been writing exams for this school for fifteen years.", "tr": "On beş yıldır bu okul için sınav hazırlıyorum.", "pr": "Nothing like this has ever happened."}, {"en": "I never shared any version of this exam with anyone.", "tr": "Bu sınavın hiçbir sürümünü kimseyle paylaşmadım.", "pr": "Exams are confidential.", "c": ["s3"], "w": ["never", "shared", "anyone"], "br": "Ah… you are right. Ece proofread version two. I trust her completely; she is my best assistant. But the printing office only ever had the final version.", "lesson": "<b>\"never shared … with anyone\"</b> ↔ <b>\"shared with E. Arslan for proofreading\"</b>. \"Never\" ve \"anyone\" gibi mutlak kelimeler kolay çürür."}, {"en": "The final version was sent only to the printing office.", "tr": "Son sürüm sadece matbaaya gönderildi.", "pr": "They have strict rules."}]}, "i_ec": {"who": "ec", "unlock": ["d3"], "done": ["d4"], "note": "Ece dosyayı kuzeni Deniz'e gönderdiğini itiraf etti. Polis banka ve forum kayıtlarını istedi.", "st": [{"en": "I only checked the exam for spelling mistakes.", "tr": "Sınavı sadece yazım hataları için kontrol ettim.", "pr": "It took me about an hour."}, {"en": "After proofreading, I deleted my copy and never sent it to anyone.", "tr": "Okuma kontrolünden sonra kopyamı sildim ve kimseye göndermedim.", "pr": "I know the rules.", "c": ["s5", "s6"], "w": ["never", "sent", "anyone", "deleted"], "br": "…Deniz is my cousin. He begged me. He said he just wanted to see the format of the questions. I never thought he would post it online!", "lesson": "<b>\"never sent it to anyone\"</b> ↔ <b>\"sent … to an external address\"</b>. Bilgi işlem kaydı, \"silmiştim\" diyen birini yakalar."}, {"en": "I do not know any student called Deniz.", "tr": "Deniz adında bir öğrenci tanımıyorum.", "pr": "There are hundreds of students here."}]}}, "tl": [["5 Ara", "v2 paylaşılır", "s3", "", 5], ["8 Ara", "v3 matbaaya", "s4", "", 22], ["21:40", "v2 dışarı gider", "s5", "red", 42], ["21:52", "300 € transfer", "s8", "red", 58], ["23:12", "Forum gönderisi", "s2", "red", 76], ["07:30", "Gönderi silinir", null, "", 94]], "sol": {"who": "ec", "slots": [["Sebep", "Karşılığında ne aldı?", ["s8"]], ["Araç", "Taslağa nasıl sahipti?", ["s3"]], ["Sızıntı", "Dosyayı nasıl dışarı çıkardı?", ["s5", "s6"]]], "hint": "Kaynağı göster: para, taslağa erişim ve o e-posta.", "wrong": {"de": "Deniz soruları yayımladı, ama sınavı ona biri verdi. Kaynağı göster. (Deniz de disiplin kuruluna gidecek.)", "ha": "Mr. Hall taslağı sadece asistanıyla paylaştı; dışarıya bir şey göndermedi.", "po": "Matbaada yalnızca v3 vardı; fotoğraftaki ise v2."}}, "epi": {"en": "At 11:30, the school replaced the leaked exam with a reserve exam that only the director had seen. Ece Arslan admitted that she had sent the draft to her cousin for €300. Both students and staff learned the same lesson that day: \"not for distribution\" means exactly what it says.", "tr": "11:30'da okul, sızan sınavın yerine yalnızca müdürün gördüğü yedek bir sınav koydu. Ece Arslan taslağı 300 € karşılığında kuzenine gönderdiğini itiraf etti. O gün öğrenciler de personel de aynı dersi aldı: \"not for distribution\" tam olarak ne yazıyorsa onu demek."}, "fail": {"en": "At 14:00, the leaked exam was given to 600 students. By evening, everyone knew the answers had been online all night.", "tr": "Saat 14:00'te sızan sınav 600 öğrenciye uygulandı. Akşam olduğunda herkes cevapların bütün gece internette olduğunu biliyordu."}}, "gol": {"id": "gol", "no": "0318", "title": "Sessiz Göl", "place": "Sapanca Gölü · Lakeview Textiles", "stars": 3, "len": "20–25 dk", "start": 540, "limit": 300, "deadline": "14:00", "brief": "Sapanca Gölü'nde yüzlerce ölü balık bulundu. Bir tekstil fabrikasının sunduğu laboratuvar raporu suyun \"temiz\" olduğunu söylüyor. Belediye, fabrikanın iznini yenileyip yenilemeyeceğine bugün saat <b>14:00</b>'te karar verecek.", "intro": "İki rapor var ve ikisi birbirini tutmuyor. Önce üniversitenin bağımsız ölçümüne bakalım.", "aw": {"concentration": "yoğunluk, derişim", "exceed": "aşmak", "legal": "yasal", "sample": "numune", "source": "kaynak", "renew": "yenilemek", "contract": "sözleşme", "procedure": "prosedür"}, "ev": {"g1": {"t": "Çıkış B çevresi", "d": "Ölü balıklar çoğunlukla fabrikanın atık su çıkışı B'nin çevresinde.", "en": "\"concentrated within 300 metres of Outlet B\"", "s": "ar"}, "g2": {"t": "12 kat", "d": "Çıkış B'deki boya kimyasalı yasal sınırın 12 katı.", "en": "\"twelve times the legal limit\"", "s": "ar"}, "g3": {"t": "Numuneyi kim aldı?", "d": "Resmî numuneyi laboratuvar değil, fabrika müdürü A. Kurt toplamış.", "en": "\"Collected by: A. Kurt\"", "s": "ar"}, "g4": {"t": "Beş buçuk saat", "d": "Numune 10:00'da alınmış, laboratuvara 15:30'da ulaşmış.", "en": "\"Delivered to laboratory: 15:30\"", "s": "ar"}, "g5": {"t": "Pınar durağı", "d": "Şirket aracı 11:20–12:30 arasında Kırkpınar memba suyu kaynağında durmuş.", "en": "\"stopped: Kırkpınar Spring car park\"", "s": "ar"}, "g6": {"t": "Temiz kaynak", "d": "Kırkpınar bir içme suyu kaynağı: suyu doğal olarak çok temiz.", "en": "\"a natural drinking water source\"", "s": "ar"}, "g7": {"t": "2 milyon € sözleşme", "d": "İzin yenilenmezse fabrika Paris'teki 2 milyon €'luk sözleşmeyi kaybedecek.", "en": "\"we lose the Paris contract\"", "s": "ar"}, "g8": {"t": "\"Kendim hallederim\"", "d": "A. Kurt numune alma işini \"bizzat\" üstleneceğini yazmış.", "en": "\"I will handle the sampling personally\"", "s": "ar"}}, "docs": [{"id": "d1", "k": "report", "t": "Üniversite ölçümü", "sub": "20 Mart", "unlock": [], "s": ["Following reports of dead fish, our team examined the eastern shore of Lake Sapanca.", "Over 80 percent of the dead fish were concentrated within 300 metres of Outlet B, the waste water pipe of Lakeview Textiles.", "Water taken directly from Outlet B contained dye chemicals at twelve times the legal limit.", "Samples taken one kilometre away were within normal levels."], "g": {"following": "-in ardından", "examined": "inceledi", "concentrated": "yoğunlaşmış, toplanmış", "waste water": "atık su", "dye": "boya", "legal limit": "yasal sınır", "within": "içinde, sınırları dahilinde"}, "note": "Kirlilik fabrikanın borusunun hemen önünde, yasal sınırın 12 katı. Peki fabrikanın raporu nasıl \"temiz\" çıktı? O raporu açalım.", "q": [{"ty": "Detay", "q": "Where were most of the dead fish found?", "o": ["On the western shore", "Near Outlet B", "One kilometre from the factory", "In the middle of the lake"], "a": 1, "ev": 1, "e": "g1", "why": "\"Over 80 percent … within 300 metres of Outlet B\". Yüzde ve mesafe gibi sayılar tarama sorularının cevabıdır."}, {"ty": "Çıkarım", "q": "What does the comparison with samples one kilometre away suggest?", "o": ["The whole lake is polluted.", "The pollution comes from a source near Outlet B.", "The fish died of cold.", "The test was not accurate."], "a": 1, "ev": 3, "e": "g2", "why": "Uzakta değerler normal, çıkışta 12 kat. Kaynak çıkışın kendisi. Karşılaştırma, çıkarımın en güçlü aracıdır."}], "head": ["ENVIRONMENTAL REPORT · Sakarya University", "Dept. of Biology"]}, {"id": "d2", "k": "record", "t": "Fabrika raporu ve numune formu", "sub": "14 Mart", "unlock": ["d1"], "s": ["Clearwater Lab result: Sample LT-0314 (Outlet B): all chemical values within legal limits.", "Chain-of-custody form, sample LT-0314.", "Collected by: A. Kurt (Lakeview Textiles), 14 March, 10:00.", "Delivered to laboratory: 14 March, 15:30, by A. Kurt."], "g": {"result": "sonuç", "values": "değerler", "chain-of-custody": "gözetim zinciri (numunenin el değiştirme kaydı)", "collected by": "toplayan", "delivered": "teslim edildi"}, "note": "Numuneyi laboratuvar değil, fabrika müdürü kendisi almış ve beş buçuk saat sonra teslim etmiş. Laboratuvar teknisyeniyle konuşalım.", "q": [{"ty": "Detay", "q": "Who collected the official sample?", "o": ["A laboratory technician", "A university scientist", "The factory manager, A. Kurt", "A city inspector"], "a": 2, "ev": 2, "e": "g3", "why": "\"Collected by: A. Kurt (Lakeview Textiles)\". Normalde numuneyi bağımsız bir kişi alır; kontrol edilen kişinin değil."}, {"ty": "Çıkarım", "q": "Why is the time between collection and delivery important?", "o": ["Because the lab was closed in the morning", "Because the sample was out of control for five and a half hours", "Because the water became colder", "It is not important."], "a": 1, "ev": 3, "e": "g4", "why": "10:00 → 15:30: numune 5,5 saat boyunca tek bir kişinin elindeydi. Gözetim zincirindeki boşluk, değiştirme fırsatıdır."}], "head": ["CLEARWATER LAB · Result & Form", "Sample LT-0314"]}, {"id": "d3", "k": "record", "t": "Araç GPS kaydı", "sub": "14 Mart", "u results\" suggest about Arda's intention?", "o": ["He wanted an honest test.", "He planned to make the result look clean whatever the truth.", "He wanted to close the factory.", "He did not care about the test."], "a": 1, "ev": 2, "e": "g7", "why": "\"must show clean results\": sonucun önceden belirlendiği bir cümle. Gerçek ne olursa olsun."}, {"ty": "Bağlamda anlam", "q": "\"I will handle the sampling personally\" means…", "o": ["Someone else will take the samples.", "He will take the samples himself.", "The samples will be handled carefully by the lab.", "He will stop the sampling."], "a": 1, "ev": 3, "e": "g8", "why": "\"personally\" = bizzat. \"Handle\" = ilgilenmek, halletmek. Yani numuneyi kendisi alacak."}], "mh": "<b>From:</b> A. Kurt<br><b>To:</b> J. Owen (Owner)<br><b>Subject:</b> Permit"}], "sus": [{"k": "ar", "n": "Arda Kurt", "r": "Fabrika müdürü", "f": {"c": "#334155", "hair": "#1c1917"}, "talk": "i_ar"}, {"k": "ze", "n": "Zeynep Ak", "r": "Laboratuvar teknisyeni", "f": {"c": "#0891b2", "hair": "#7c2d12", "acc": "glasses"}, "talk": "i_ze"}, {"k": "re", "n": "Tom Reed", "r": "Belediye çevre müfettişi", "f": {"c": "#4d7c0f", "hair": "#a8a29e"}}, {"k": "ow", "n": "J. Owen", "r": "Fabrikanın sahibi", "f": {"shadow": 1}}], "talk": {"i_ze": {"who": "ze", "unlock": ["d2"], "done": ["d3"], "note": "Zeynep, numuneyi o gün müdürün kendisinin getirdiğini söyledi. Şirket aracının GPS kaydını istedim.", "st": [{"en": "Our lab follows the official procedure step by step.", "tr": "Laboratuvarımız resmî prosedürü adım adım uygular.", "pr": "We are certified by the ministry."}, {"en": "We always collect the samples ourselves. Nobody else touches them.", "tr": "Numuneleri her zaman kendimiz toplarız. Başka kimse dokunmaz.", "pr": "That is the whole point of an independent lab.", "c": ["g3"], "w": ["always", "ourselves", "Nobody"], "br": "…That day Mr. Kurt said our van was broken and brought the bottle himself. I thought it was a small exception. I see now that it was not.", "lesson": "<b>\"We always collect the samples ourselves\"</b> ↔ <b>\"Collected by: A. Kurt (Lakeview Textiles)\"</b>. \"Always\" kelimesi tek bir istisnayla çöker."}, {"en": "The result we received was completely normal.", "tr": "Aldığımız sonuç tamamen normaldi.", "pr": "Clean water, clean result."}]}, "i_ar": {"who": "ar", "unlock": ["d3"], "done": ["d4"], "note": "Arda Kurt \"öğle yemeği\" bahanesine sığındı. Polis şirket e-postalarına erişim izni aldı.", "st": [{"en": "Our factory has never had a single environmental problem.", "tr": "Fabrikamız tek bir çevre sorunu bile yaşamadı.", "pr": "Our filters are the best in the region."}, {"en": "After I collected the sample, I drove straight to the laboratory.", "tr": "Numuneyi aldıktan sonra doğrudan laboratuvara gittim.", "pr": "I wanted the result as soon as possible.", "c": ["g5"], "w": ["straight"], "br": "I… stopped for lunch. That is all. Is it a crime to eat?", "lesson": "<b>\"drove straight to the laboratory\"</b> ↔ <b>\"11:20–12:30: stopped at Kırkpınar Spring\"</b>. \"Straight\" = hiç durmadan; kayıt 70 dakikalık bir durak gösteriyor."}, {"en": "The fish probably died because of the cold winter.", "tr": "Balıklar muhtemelen soğuk kış yüzünden öldü.", "pr": "Nature is cruel, detective."}]}}, "tl": [["10:00", "Numune alınır", "g3", "", 5], ["10:05", "Çıkış B'den ayrılır", "g5", "", 20], ["11:20", "Pınar'da durur", "g5", "red", 38], ["12:30", "Pınar'dan ayrılır", "g5", "red", 55], ["15:30", "Laba teslim", "g4", "", 74], ["20 Mart", "Üniversite ölçümü", "g2", "", 95]], "sol": {"who": "ar", "slots": [["Sebep", "Neden yaptı?", ["g7", "g8"]], ["Araç", "Temiz suyu nereden buldu?", ["g5", "g6"]], ["Fırsat", "Numuneye nasıl erişti?", ["g3", "g4"]]], "hint": "Sebep için sözleşme, araç için pınar, fırsat için numuneyi kimin taşıdığı.", "wrong": {"ze": "Zeynep numuneyi kendisi almadı; şişe ona müdür tarafından getirildi.", "re": "Müfettişin adı numune sürecinin hiçbir aşamasında geçmiyor.", "ow": "Sahip baskı yaptı ama numuneyi değiştiren kişi sahadaydı."}}, "epi": {"en": "At 13:30, the city council refused to renew the permit. A new sample, taken by inspectors under police supervision, showed the same result as the university's test. Arda Kurt was charged with falsifying official documents, and Lakeview Textiles was ordered to clean the eastern shore.", "tr": "13:30'da belediye meclisi izni yenilemeyi reddetti. Polis gözetiminde müfettişlerin aldığı yeni numune, üniversitenin ölçümüyle aynı sonucu verdi. Arda Kurt resmî belgede sahtecilikle suçlandı; Lakeview Textiles'a doğu kıyısını temizleme cezası verildi."}, "fail": {"en": "At 14:00, the permit was renewed. The next morning, more dead fish appeared on the shore.", "tr": "Saat 14:00'te izin yenilendi. Ertesi sabah kıyıda daha fazla ölü balık belirdi."}}, "tablo": {"id": "tablo", "no": "0612", "title": "Haliç'te Sabah", "place": "Pera Müzayede Evi · İstanbul", "stars": 3, "len": "20–25 dk", "start": 540, "limit": 300, "deadline": "14:00", "brief": "Bugün saat <b>14:00</b>'te, ressam Nuri Saffet'in 1898 tarihli \"Haliç'te Sabah\" tablosu açık artırmaya çıkacak. Tahmini değeri 6 milyon lira. Ama müzayede evinin uzmanı tablonun boyasında tuhaf bir şey buldu.", "intro": "Bir tablonun yaşını boyası söyler. Uzmanın analizinden başlayalım.", "aw": {"authentic": "gerçek, orijinal", "detect": "tespit etmek", "period": "dönem", "acquire": "edinmek, satın almak", "estimate": "tahmin, tahmini değer", "genuine": "hakiki, sahici", "analysis": "analiz", "profit": "kâr"}, "ev": {"t1": {"t": "Titanyum beyazı", "d": "Boyada titanyum beyazı var; bu pigment 1920'lerden önce sanatçı boyası olarak kullanılmıyordu.", "en": "\"not used in artists' paints before the 1920s\"", "s": "ta"}, "t2": {"t": "Makine dokuması", "d": "Tuval lifleri makinede dokunmuş, modern bir kumaş.", "en": "\"machine-woven, modern\"", "s": "ta"}, "t3": {"t": "Ölü uzmanın imzası", "d": "Sertifika Prof. Selim Arı imzalı, 1995 tarihli; ama Prof. Arı 1993'te ölmüş.", "en": " ement with", "more expensive than", "older than", "famous because of"], "a": 0, "ev": 3, "e": "t2", "why": "\"consistent with\" = ile uyumlu. \"Not consistent\" = uyuşmuyor. Akademik raporlarda bulguları tartışmanın standart kalıbı."}], "head": ["TECHNICAL ANALYSIS · Lot 42", "\"Morning on the Golden Horn\""]}, {"id": "d2", "k": "report", "t": "Orijinallik sertifikası", "sub": "Dosya eki", "unlock": ["d1"], "s": ["Certificate of authenticity: \"Morning on the Golden Horn\", Nuri Saffet, 1898.", "Signed by Prof. Selim Arı, art historian, 3 June 1995.", "Supplied to the auction house by K. Ersoy Gallery.", "Archive note from the University Library: Prof. Selim Arı died in March 1993."], "g": {"certificate": "sertifika, belge", "authenticity": "orijinallik, sahicilik", "signed by": "imzalayan", "supplied": "tedarik edildi, verildi", "archive": "arşiv"}, "note": "Ölü bir uzman, öldükten iki yıl sonra sertifika imzalamış! Tablonun sahibi Nevin Tan'la konuşalım; tablonun nereden geldiğini anlatacak.", "q": [{"ty": "Çıkarım", "q": "What is wrong with the certificate?", "o": ["It has the wrong title.", "It was signed two years after the expert died.", "It is written in French.", "It has no date."], "a": 1, "ev": 3, "e": "t3", "why": "İmza 1995, ölüm 1993. Tarih karşılaştırması belgeyi tek başına çürütüyor."}, {"ty": "Detay", "q": "Who gave the certificate to the auction house?", "o": ["Prof. Arı", "The University Library", "K. Ersoy Gallery", "Nuri Saffet"], "a": 2, "ev": 2, "e": "t4", "why": "\"Supplied … by K. Ersoy Gallery\". Sahte belgenin kim tarafından getirildiği, en az kim tarafından yapıldığı kadar önemli."}], "head": ["CERTIFICATE · Lot 42"]}, {"id": "d3", "k": "mail", "t": "Satış faturası ve e-posta", "sub": "2019 ve 2026", "unlock": ["i_ta"], "s": ["Invoice #219, 12 May 2019: \"Morning on the Golden Horn\" sold by K. Ersoy Gallery to Mrs. N. Tan. Price: ₺150,000. Certificate of authenticity included.", "E-mail from K. Ersoy to N. Tan, 2 February 2026:", "\"At auction, the painting could reach six million. As agreed, we split the profit 50/50, and remember: it has always been in your family.\""], "g": {"invoice": "fatura", "included": "dahil", "reach": "ulaşmak", "as agreed": "anlaştığımız gibi", "split": "bölüşmek", "profit": "kâr"}, "note": "Ersoy tabloyu 2019'da satmış ve şimdi kârın yarısını istiyor. Galerici Kemal Ersoy'la yüzleşme zamanı. İki kez yalan söyleyecek gibi.", "q": [{"ty": "Detay", "q": "How much did Mrs. Tan pay for the painting?", "o": ["₺6 million", "₺150,000", "₺50,000", "Nothing; it was a gift."], "a": 1, "ev": 0, "e": "t5", "why": "Faturada ₺150,000. 6 milyon, açık artırmada beklenen fiyat. Sayıların hangi bağlamda geçtiğine dikkat."}, {"ty": "Çıkarım", "q": "What does \"remember: it has always been in your family\" suggest?", "o": ["It is true family history.", "Ersoy wants Mrs. Tan to repeat a false story.", "Mrs. Tan forgot her family.", "The painting was a wedding gift."], "a": 1, "ev": 2, "e": "t6", "why": "\"remember\" burada bir talimat: hatırlaman gereken bir hikâye. Gerçek olsaydı hatırlatmaya gerek olmazdı."}], "mh": "<b>Attachment:</b> Invoice #219<br><b>From:</b> K. Ersoy &lt;kemal@ersoygallery.com&gt;<br><b>To:</b> N. Tan"}, {"id": "d4", "k": "report", "t": "Kopyacının ifadesi", "sub": "Polis tutanağı", "unlock": ["i_er"], "s": ["Statement of Yavuz Er, painter, given voluntarily.", "\"In 2018, Mr. Kemal Ersoy ordered a painting in the style of Nuri Saffet for what he said was a hotel lobby.", "He asked me to use an old frame and to make the surface look old with smoke and tea.", "I did not know that it would be sold as an original.\""], "g": {"statement": "ifade", "voluntarily": "gönüllü olarak", "in the style of": "tarzında", "lobby": "lobi", "surface": "yüzey", "original": "orijinal"}, "note": "Sebep kâr, sahte belge ölü uzmanın imzası, tablonun kaynağı Ersoy'un siparişi. Suçluyu gösterebilirsin.", "q": [{"ty": "Detay", "q": "When was the painting actually made?", "o": ["1898", "1993", r sold anything at auction before.", "tr": "Daha önce hiç açık artırmada bir şey satmadım.", "pr": "I am nervous, to be honest."}]}, "i_er": {"who": "er", "unlock": ["d3"], "done": ["d4"], "note": "Ersoy iki yalanda yakalandı. Polis, tabloyu yapan ressamı buldu; ifadesi geldi.", "st": [{"en": "I have never seen this painting before today.", "tr": "Bu tabloyu bugüne kadar hiç görmedim.", "pr": "There are thousands of paintings in Istanbul.", "c": ["t5"], "w": ["never", "seen"], "br": "Alright, I sold it to Mrs. Tan. But it came with a genuine certificate!", "lesson": "<b>\"never seen this painting\"</b> ↔ <b>\"sold by K. Ersoy Gallery to Mrs. N. Tan\"</b>. Kendi imzalı faturası onu yalanlıyor."}, {"en": "My gallery is one of the most respected in the city.", "tr": "Galerim şehrin en saygın galerilerinden biri.", "pr": "Thirty years of honest work."}, {"en": "I received the certificate directly from Professor Arı himself, in 1995.", "tr": "Sertifikayı 1995'te bizzat Profesör Arı'dan aldım.", "pr": "He was a dear friend of mine.", "c": ["t3"], "w": ["1995", "Professor", "himself"], "br": "I… I need to speak to my lawyer.", "lesson": "<b>\"from Professor Arı himself, in 1995\"</b> ↔ <b>\"Prof. Arı died in March 1993\"</b>. Ölü bir insandan belge alınamaz: tarihlerin gücü.", "stage": 2}, {"en": "If the painting is a copy, then someone fooled me too.", "tr": "Tablo kopyaysa, birisi beni de kandırmış demektir.", "pr": "I am a victim here.", "stage": 2}]}}, "tl": [["1898", "İddia edilen tarih", null, "", 4], ["1993", "Prof. Arı ölür", "t3", "", 22], ["1995", "Sertifika tarihi", "t3", "red", 40], ["2018", "Kopya siparişi", "t7", "red", 58], ["2019", "Tan'a satış", "t5", "", 76], ["2026", "Açık artırma", null, "", 96]], "sol": {"who": "er", "slots": [["Sebep", "Ne kazanacaktı?", ["t6"]], ["Sahte belge", "Sertifika neden sahte?", ["t3", "t4"]], ["Tablonun kaynağı", "Tabloyu kim yaptırdı?", ["t7", "t8"]]], "hint": "Sebep için kâr, belge için ölü uzmanın imzası, kaynak için kopy s asleep in my dorm room.", "tr": "Sabah üçte yurt odamda uyuyordum.", "pr": "Ask my roommate.", "c": ["v5", "v6"], "w": ["asleep", "dorm", "three"], "br": "…I was in the library. I added the votes. Kaan didn't know.", "lesson": "<b>\"asleep in my dorm room\"</b> ↔ <b>\"02:50: B. Tunç sits at desk 14 with a laptop\"</b>. Kamera, saat ve etiket: üç ayrı ayrıntı aynı şeyi söylüyor.", "stage": 2}, {"en": "Anyway, anyone could have used that laptop.", "tr": "Zaten o laptopu herkes kullanabilirdi.", "pr": "It was not even password protected.", "stage": 2}]}}, "tl": [["22:00", "Laptop alınır", "v4", "", 4], ["00:00", "Sandık kapanır", null, "", 20], ["02:50", "Bora kütüphanede", "v5", "red", 38], ["02:58", "Yönetici girişi", "v3", "red", 54], ["03:00", "52 oy eklenir", "v2", "red", 70], ["03:10", "Bora çıkar", "v5", "", 84], ["09:00", "Laptop iade", "v4", "", 97]], "sol": {"who": "bo", "slots": [["Sebep", "Ne kazanacaktı?", ["v7", "v8"]], ["Araç", "Oyları hangi cihazla ekledi?", ["v3", "v4", "v6"]], ["Fırsat", "O saatte neredeydi?", ["v5"]]], "hint": "Sebep için koordinatörlük, araç için kurul laptopu, fırsat için kamera kaydı.", "wrong": {"ka": "Kaan'ın sisteme girdiğine dair hiçbir kayıt yok; laptop ve kamera başka birini gösteriyor.", "me": "Melis kaybeden aday; eklenen oyların hepsi rakibine gitti.", "pe": "Kurul başkanı laptopu imzalayıp almadı; zimmet formunda başka bir isim var."}}, "epi": {"en": "At 12:00, the election committee removed the 52 late votes. The corrected result: Kaan Demir 403, Melis Aydın 412. Melis Aydın was declared president. Kaan Demir, who said he had known nothing, apologised publicly, and Bora Tunç was suspended from all student activities.", "tr": "12:00'de seçim kurulu geç eklenen 52 oyu iptal etti. Düzeltilmiş sonuç: Kaan Demir 403, Melis Aydın 412. Melis Aydın başkan ilan edildi. Hiçbir şeyden haberi olmadığını söyleyen Kaan kamuoyundan özür diledi; Bora Tunç bütün öğrenci etkinliklerinden uzaklaştırıldı."}, "fail": {"en": "At 14:00, the ead": ["POLICE REPORT · Vienna & Customs"]}], "sus": [{"k": "vl", "n": "\"Dr.\" Victor Lang", "r": "Misafir araştırmacı", "f": {"c": "#475569", "hair": "#a8a29e", "acc": "glasses"}, "talk": "i_vl"}, {"k": "ay", "n": "Aylin Koç", "r": "Nadir eserler kütüphanecisi", "f": {"c": "#7c2d12", "hair": "#292524", "acc": "bun"}, "talk": "i_ay"}, {"k": "st", "n": "Selim Ok", "r": "Doktora öğrencisi", "f": {"c": "#2563eb", "hair": "#1c1917"}}, {"k": "co", "n": "Viyanalı alıcı", "r": "Koleksiyoner", "f": {"shadow": 1}}], "talk": {"i_ay": {"who": "ay", "unlock": ["d2"], "done": ["d3"], "note": "Aylin Hanım öğle arası salonu boş bıraktığını kabul etti. Dr. Lang'ın üniversitesine bir yazı gönderdik; cevap geldi.", "st": [{"en": "I have worked in the rare books room for twenty-two years.", "tr": "Yirmi iki yıldır nadir eserler bölümünde çalışıyorum.", "pr": "I know every book here."}, {"en": "Researchers in this room are always watched by a member of staff.", "tr": "Bu odadaki araştırmacılar her zaman bir görevli tarafından izlenir.", "pr": "That is our most important rule.", "c": ["a4"], "w": ["always", "watched"], "br": "…You are right. On the eleventh I was alone, and I went for lunch. One hour. We do not have enough staff. I am so sorry.", "lesson": "<b>\"always watched by a member of staff\"</b> ↔ <b>\"the reading room was unstaffed from 12:00 to 13:00\"</b>. \"Always\" yine tek bir istisnayla çöktü."}, {"en": "Dr. Lang seemed like a real gentleman.", "tr": "Dr. Lang gerçek bir beyefendiye benziyordu.", "pr": "He knew everything about old maps."}]}, "i_vl": {"who": "vl", "unlock": ["d3"], "done": ["d4"], "note": "Lang'ın kimliği çöktü. Avusturya polisi bir satış ilanı ve bir gümrük kaydı gönderdi.", "st": [{"en": "I came to Istanbul to study the history of map making.", "tr": "İstanbul'a harita yapımının tarihini çalışmaya geldim.", "pr": "It is my great passion."}, {"en": "I am a professor at the University of Graz.", "tr": "Graz Üniversitesi'nde profesörüm.", "pr": "I have taught there for many years.", "c": ["a5", "a6"], "w": ["professor", "Graz"], "br": "…I am a dealer, not a professor. But that does not make me a thief!", "lesson": "<b>\"a professor at the University of Graz\"</b> ↔ <b>\"no staff member with this name\"</b>. Resmî bir kurum yazısı, bir unvanı tek cümlede siler."}, {"en": "When I returned the atlas, it was complete.", "tr": "Atlası iade ettiğimde tamdı.", "pr": "I checked every page myself."}]}}, "tl": [["2 Eyl", "Sayfalar tam", "a2", "", 4], ["10 Eyl", "Lang ilk gün", "a3", "", 22], ["11 Eyl", "Lang ikinci gün", "a3", "red", 40], ["12:00", "Salon boş", "a4", "red", 56], ["12 Eyl", "Paket Viyana'ya", "a8", "red", 74], ["13 Eyl", "Lot 88 ilanı", "a7", "red", 96]], "sol": {"who": "vl", "slots": [["Sebep", "Sayfaları neden aldı?", ["a7", "a8"]], ["Kimlik", "Nasıl içeri girdi?", ["a5", "a6"]], ["Fırsat", "Ne zaman kesebildi?", ["a3", "a4"]]], "hint": "Sebep için satış ilanı, kimlik için Graz'ın yazısı, fırsat için tek okur ve boş salon.", "wrong": {"ay": "Aylin Hanım salonu boş bıraktı ama kitabı isteyen tek okur başkasıydı.", "st": "Selim Ok'un adı okuma kayıtlarında hiç geçmiyor.", "co": "Alıcı Viyana'daydı; sayfaları İstanbul'da kesemezdi."}}, "epi": {"en": "At 12:10, the Vienna police removed Lot 88 from the online auction. The four pages flew back to Istanbul in a diplomatic bag. The library introduced a new rule: rare books can only be read when two members of staff are present, and lunch breaks are now taken in turns.", "tr": "12:10'da Viyana polisi Lot 88'i internetteki açık artırmadan kaldırdı. Dört sayfa diplomatik çantayla İstanbul'a geri döndü. Kütüphane yeni bir kural koydu: nadir eserler yalnızca iki görevli varken okunabilecek; öğle aralarıysa artık sırayla veriliyor."}, "fail": {"en": "At 14:00, Lot 88 was sold to an anonymous buyer. The atlas now has four empty pages where the world used to be.", "tr": "Saat 14:00'te Lot 88 isimsiz bir alıcıya satıldı. Atlasın, eskiden dünyanın durduğu yerde dört boş sayfası var artık."}}, "doping": {"id": "doping", "no": "0905", "title": "Yanlış Numune", "place": "İstanbul Atletizm Şampiyonası", "stars": 3, "len": "20–25 dk", "start": 540, "limit": 300, "deadline": "14:00", "brief": "Maratoncu Elif Yurt'un doping testi pozitif çıktı. Federasyon bugün saat <b>14:00</b>'te ona dört yıl men cezası verecek. Elif hiçbir şey kullanmadığını söylüyor. Laboratuvar raporunda ise kimsenin dikkat etmediği bir satır var.", "intro": "Bu davada suçlu sanılan kişi kurban olabilir. Laboratuvar raporunu dikkatle oku.", "aw": {"substance": "madde", "protocol": "protokol, kural dizisi", "temporary": "geçici", "investigate": "soruşturmak, araştırmak", "detect": "tespit etmek", "purchase": "satın alma", "access": "erişim", "misconduct": "görevi kötüye kullanma, usulsüzlük"}, "ev": {"p1": {"t": "EPO bulundu", "d": "Numunede yasaklı madde EPO bulundu.", "en": "\"contains erythropoietin (EPO)\"", "s": "el"}, "p2": {"t": "DNA uyuşmuyor", "d": "Numunedeki DNA Elif Yurt'a ait değil; numune bir erkekten.", "en": "\"does not match the athlete\"", "s": "el"}, "p3": {"t": "80 dakika", "d": "Kurye geciktiği için numune 10:20–11:40 arası \"geçici olarak\" takım doktoru Dr. Aydın'da kaldı.", "en": "\"handed to Dr. U. Aydın for temporary storage\"", "s": "ua"}, "p4": {"t": "Mühür numarası", "d": "Alınırken mühür 55102; laboratuvara gelen kutunun mührü 55120.", "en": "\"seal number 55102 … arrived with seal 55120\"", "s": "ua"}, "p5": {"t": "Dolap iki kez açıldı", "d": "Sağlık odası dolabı 10:31 ve 11:02'de U. Aydın'ın kartıyla açıldı.", "en": "\"opened at 10:31 and 11:02 by U. Aydın\"", "s": "ua"}, "p6": {"t": "Yedek mühürler", "d": "Dr. Aydın 1 Eylül'de internetten 20 adet resmî mühür satın aldı.", "en": "\"20 official seals purchased\"", "s": "ua"}, "p7": {"t": "Elif'in şikâyeti", "d": "Elif, 20 Ağustos'ta Dr. Aydın'ı ona yasaklı madde teklif ettiği için şikâyet etti.", "en": "\"offering me banned substances\"", "s": "ua"}, "p8": {"t": "Soruşturma bekliyor", "d": " Dr. Aydın by the courier.", "Laboratory note: the box arrived with seal number 55120."], "g": {"collected": "alındı", "sealed": "mühürlendi", "courier": "kurye", "delayed": "gecikmiş", "handed to": "teslim edildi", "temporary storage": "geçici saklama", "medical room": "sağlık odası"}, "note": "Numune 80 dakika boyunca takım doktorundaymış ve mühür numarası değişmiş. Önce doping memuru Rıza Şen'le konuşalım.", "q": [{"ty": "Detay", "q": "How long was the sample with Dr. Aydın?", "o": ["15 minutes", "About 80 minutes", "Two days", "It was never with him."], "a": 1, "ev": 1, "e": "p3", "why": "10:20 → 11:40 = 80 dakika. Protokole göre numune memurun elinden çıkmamalıydı."}, {"ty": "Çıkarım", "q": "What does the difference in seal numbers suggest?", "o": ["The laboratory made a typing error.", "The box was opened and sealed again with a different seal.", "Seals change colour over time.", "There were two athletes."], "a": 1, "ev": 3, "e": "p4", "why": "55102 ile kapatılan kutu 55120 ile gelmiş. Mühür değiştiyse kutu açılmış: tek bir rakam farkı, bütün davayı değiştirir."}], "head": ["CHAIN OF CUSTODY · A-2207"]}, {"id": "d3", "k": "record", "t": "Dolap ve satın alma kaydı", "sub": "Takım kayıtları", "unlock": ["i_rs"], "s": ["Medical room fridge, electronic lock log: opened at 10:31 and at 11:02 with the card of U. Aydın.", "Online purchase, 1 September: 20 official doping-control seals, ordered by U. Aydın and delivered to his home address.", "Rule 4.3 of the federation: official seals may only be purchased by doping-control officers."], "g": {"electronic lock": "elektronik kilit", "log": "kayıt", "purchase": "satın alma", "ordered": "sipariş edildi", "delivered": "teslim edildi", "may only": "yalnızca … -ebilir"}, "note": "Dolap iki kez açılmış ve doktor, yalnızca memurların alabileceği mühürlerden almış. Dr. Aydın'la konuşma zamanı.", "q": [{"ty": "Detay", "q": "How many times was the fridge opened while Dr. Aydın had the sample?", "o": ["Never", "Once", "Twice", "Five times"], "a": 2, "ev": 0, "e": "p5", "why": "10:31 ve 11:02: iki kez. İkisi de 10:20–11:40 aralığında."}, {"ty": "Doğru / Yanlış / Yok", "q": "\"Team doctors are allowed to buy official seals.\"", "o": ["True", "False", "Not given"], "a": 1, "ev": 2, "e": "p6", "why": "\"may only be purchased by doping-control officers\": doktorlar bu listede yok → False. \"Only\" kelimesi kapsamı daraltır."}], "head": ["TEAM RECORDS · Medical room"]}, {"id": "d4", "k": "mail", "t": "Elif'in şikâyeti", "sub": "20 Ağustos", "unlock": ["i_ua"], "s": ["To the Athletics Federation,", "I wish to report Dr. Ufuk Aydın for offering me banned substances before the national trials.", "I refused, and I told him that I would inform the federation.", "Reply from the federation, 22 August: \"Thank you. Your complaint will be investigated after the championship.\""], "g": {"report": "bildirmek, şikâyet etmek", "offering": "teklif etmek", "trials": "seçmeler", "refused": "reddetti", "inform": "bilgilendirmek", "complaint": "şikâyet"}, "note": "Dr. Aydın'ın kariyeri, Elif'in şikâyeti yüzünden tehlikedeydi. Sebep, araç, fırsat: hepsi elimizde.", "q": [{"ty": "Çıkarım", "q": "Why might Dr. Aydın have wanted Elif to fail the test?", "o": ["He wanted her to win.", "A banned athlete's complaint would be less likely to be believed.", "He was her biggest fan.", "He wanted to change teams."], "a": 1, "ev": 1, "e": "p7", "why": "Elif onu şikâyet etmişti ve soruşturma bekliyordu. Elif dopingli görünürse şikâyetinin inandırıcılığı kalmaz."}, {"ty": "Gönderme", "q": "\"Your complaint will be investigated\". Whose complaint?", "o": ["Dr. Aydın's", "Elif Yurt's", "The courier's", "The federation's"], "a": 1, "ev": 3, "e": "p8", "why": "Cevap, şikâyeti yazan kişiye: \"Your\" = mektubu yazan Elif."}], "mh": "<b>From:</b> Elif Yurt<br><b>To:</b> Athletics Federation<br><b>Subject:</b> Report of misconduct"}], "sus": [{"k": "ua", "n": "Dr. Ufuk Aydın", "r": "Takım doktoru", "f": {"c": "#0f766e", "hair": "#57534e", "acc": "glasses"}, "talk": "i_ua"}, {"k": "rs", "n": "Rıza Şen", "r": "Doping memuru", "f": {"c": "#1e3a5f", "hair": "#1c1917", "acc": "cap"}, "talk": "i_rs"}, {"k": "el", "n": "Elif Yurt", "r": "Maratoncu", "f": {"c": "#dc2626", "hair": "#292524", "acc": "bun"}}, {"k": "co", "n": "Kemal Ural", "r": "Antrenör", "f": {"c": "#a16207", "hair": "#a8a29e", "acc": "beard"}}], "talk": {"i_rs": {"who": "rs", "unlock": ["d2"], "done": ["d3"], "note": "Rıza Şen protokolü çiğnediğini kabul etti. Takımın dolap ve satın alma kayıtlarını istedim.", "st": [{"en": "I have collected more than a thousand samples in my career.", "tr": "Kariyerimde binden fazla numune aldım.", "pr": "I know the protocol by heart."}, {"en": "A sample never leaves my sight until the courier arrives.", "tr": "Bir numune kurye gelene kadar asla gözümün önünden ayrılmaz.", "pr": "That is the first rule of the protocol.", "c": ["p3"], "w": ["never", "sight"], "br": "…The courier was late, so I gave the box to Dr. Aydın. He is a doctor, I thought it was safe. I broke the protocol. I am sorry.", "lesson": "<b>\"never leaves my sight\"</b> ↔ <b>\"handed to team doctor Dr. U. Aydın for temporary storage\"</b>. Kendi imzalı formu, sözünü yalanlıyor."}, {"en": "The seal was perfect when I closed the box.", "tr": "Kutuyu kapattığımda mühür kusursuzdu.", "pr": "Number 55102. I wrote it myself."}]}, "i_ua": {"who": "ua", "unlock": ["d3"], "done": ["d4"], "note": "Dr. Aydın mühür konusunda yalan söyledi. Federasyon, Elif'in ağustostaki şikâyetini bize iletti.", "st": [{"en": "I put the box straight into the fridge and did not open it.", "tr": "Kutuyu doğrudan dolaba koydum ve açmadım.", "pr": "Why would I?"}, {"en": "I do not have access to official seals. Only doping officers can get them.", "tr": "Resmî mühürlere erişimim yok. Onları yalnızca doping memurları alabilir.", "pr": "I am just a doctor.", "c": ["p6"], "w": ["not", "access", "Only"], "br": "…Those seals were for training young doctors! I… I would like to   const ws=Object.entries(C.aw||{}).slice(0,6),V=S.voc;
  if(V.i>=ws.length){return `<section class="card" style="padding:20px 22px;text-align:center"><span class="eyebrow">Başmüfettiş raporu · 2 / 2</span><h2 style="margin:4px 0 6px;font-size:26px">${V.ok} / ${ws.length} akademik kelime</h2><p class="mut" style="margin:0 auto 12px;max-width:52ch">Bu kelimeler BUEPT ve akademik metinlerde sık geçer. Doğru bilmediklerin Defter'ine eklendi.</p><div class="words">${ws.map(([w,t])=>`<span>${esc(w)} <em>· ${esc(t)}</em></span>`).join('')}</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-p" data-go="end">Dava raporunu kapat ${ic('arrow')}</button></div></section>`}
  const [w,t]=ws[V.i];if(!V.o||V.oi!==V.i){V.oi=V.i;V.wr=[];const others=Object.values(C.aw).filter(x=>x!==t).sort(()=>Math.random()-.5).slice(0,3);V.o=[t,...others].sort(()=>Math.random()-.5);save()}
  return `<section class="card" style="padding:20px 22px"><span class="eyebrow">Başmüfettiş raporu · 2 / 2 · Kelime ${V.i+1} / ${ws.length}</span><h2 style="margin:6px 0 4px;font-size:34px;font-family:Fraunces,serif">${esc(w)}</h2><p class="mut" style="margin:0 0 12px">Bu kelime davanın belgelerinde geçti. Türkçe karşılığı hangisi?</p><div class="qo">${V.o.map((o,i)=>`<button data-voc="${i}" class="${V.wr.includes(i)?'no':''}" ${V.wr.includes(i)?'disabled':''}><kbd>${'ABCD'[i]}</kbd><span>${esc(o)}</span></button>`).join('')}</div></section>`;
}
function ending(){
  const win=S.end==='win',l=left();
  const nq=C.docs.length*2,fc=Object.values(S.first).filter(Boolean).length;
  const by={};C.docs.forEach(d=>d.q.forEach((q,j)=>{const k=d.id+j;by[q.ty]=by[q.ty]||[0,0];by[q.ty][1]++;if(S.first[k])by[q.ty][0]++}));
  const score=win?Math.round((timed()?l/C.limit*40:30)+fc/nq*60-S.wrongs*2):0;
  const rank=!win?['Dava düştü','Süre yetmedi.']:score>=85?['Başmüfettiş','Neredeyse kusursuz bir soruşturma.']:score>=65?['Komiser','Sağlam bir dava, birkaç gereksiz adım.']:['Dedektif','Davayı çözdün; isabet arttıkça rütben yükselecek.'];
  if(win&&!S.rank){S.rank=rank[0];save()}
  const words=Object.entries(S.words),ep=win?C.epi:C.fail;
  $('#view').innerHTML=`<section class="card verdict"><span class="stamp ${win?'':'bad'}">${win?'DAVA KAPANDI':'SÜRE DOLDU'}</span>
   <div class="epi">${esc(ep.en)}<div class="ttr">${esc(ep.tr)}</div></div>
   <div class="rankb"><i>${I.badge}</i><b>${rank[0]}</b><span class="mut">${rank[1]}</span></div>
   ${hard()&&win&&S.chr?`<div class="stat"><div><b>${S.chr.wrong}</b><span>olay sırası hatası</span></div><div><b>${S.voc?S.voc.ok:0}/${Math.min(6,Object.keys(C.aw||{}).length)}</b><span>akademik kelime</span></div><div><b>${Object.values(S.talks).reduce((a,t)=>a+(t.bad||0),0)}</b><span>yanlış kanıt</span></div><div><b>Başmüfettiş</b><span>modu</span></div></div>`:''}<div class="stat"><div><b>${timed()?(win?clock():C.deadline):'—'}</b><span>${timed()?'bitiş saati':'hikâye modu'}</span></div><div><b>${fc}/${nq}</b><span>ilk denemede doğru</span></div><div><b>${S.wrongs}</b><span>hata</span></div><div><b>${words.length}</b><span>yeni kelime</span></div></div>
   <div class="secT">Reading becerilerin</div><div class="skills">${Object.entries(by).map(([k,[o,t]])=>`<div>${esc(k)}<div class="bar"><i class="${o/t<.5?'lo':''}" style="width:${o/t*100}%"></i></div><span>${o}/${t}</span></div>`).join('')}</div>
   ${words.length?`<div class="secT">Defterine girenler</div><div class="words">${words.map(([w,t])=>`<span>${esc(w)} <em>· ${esc(t)}</em></span>`).join('')}</div>`:''}
   <div class="row" style="justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap">${words.length?'<button class="btn btn-ghost" id="addw">Kelimeleri listeme ekle</button>':''}<button class="btn btn-ghost" id="restart">Davayı yeniden aç</button><button class="btn btn-p" data-go="desk">Masaya dön ${ic('arrow')}</button></div></section>`;
  if(win)setTimeout(()=>{const s=document.querySelector('.stamp');if(s&&KA.confetti){const r=s.getBoundingClientRect();KA.confetti(r.left+r.width/2,r.top+r.height/2,40,Math.PI*1.2)}},350);
}
/* ---------- etkileşim ---------- */
function go(p){if(p==='desk'){C=null;S=null;DB.cur=null;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){};desk();window.scrollTo({top:0,behavior:'smooth'});return}
  S.phase=p;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function openDoc(id,el){if(!S.docs[id]){S.docs[id]={qi:0,ans:null,wr:[],hl:null,solved:false};S.phase=id;spend(COST.doc,el)}go(id)}
function openTalk(id,el){if(!S.talks[id]){S.talks[id]={stage:1,i:0,bad:0,pr:[],trs:[],done:false,ask:null};S.phase=id;spend(COST.talk,el)}go(id)}
let pop;
function gloss(el){const k=el.dataset.gl,d=docOf(el.dataset.d),t=d.g[k];if(pop)pop.remove();
  pop=document.createElement('div');pop.className='gpop';pop.innerHTML=`<b>${esc(el.textContent)}</b>${esc(t)}`;document.body.appendChild(pop);const r=el.getBoundingClientRect(),w=pop.offsetWidth;
  pop.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';pop.style.top=(r.top-pop.offsetHeight-8<8?r.bottom+8:r.top-pop.offsetHeight-8)+'px';
  KA.speak&&KA.speak(el.textContent);if(!S.words[k]){S.words[k]=t;save();document.querySelectorAll(`[data-gl="${CSS.escape(k)}"]`).forEach(x=>x.classList.add('got'));const h=$('#defter b');if(h)h.textContent=Object.keys(S.words).length}
  clearTimeout(gloss.t);gloss.t=setTimeout(()=>{if(pop){pop.remove();pop=null}},2400)}
function answer(i,el){
  const id=S.phase,d=docOf(id),st=S.docs[id],q=d.q[st.qi],k=id+st.qi;
  if(i===q.a){st.ans=i;st.hl=q.ev;if(S.first[k]==null)S.first[k]=!(st.wr||[]).length&&!st.hinted;if(!S.ev.includes(q.e)){S.ev.push(q.e);S.newEv=q.e}KA.sfx.ok();save();render();const e=document.querySelector('.earn');if(e){e.scrollIntoView({behavior:'smooth',block:'nearest'});if(KA.confetti){const r=e.getBoundingClientRect();KA.confetti(r.left+30,r.top,16,Math.PI*.8)}}}
  else{st.wr=st.wr||[];st.wr.push(i);S.first[k]=false;S.wrongs++;if(st.wr.length>=2&&st.hl==null&&!hard())st.hl=q.ev;KA.sfx.bad();save();spend(COST.wrong,el);if(S.phase===id)render()}
}
function sheet(title,html){const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div class="in"><div class="row" style="justify-content:space-between;margin-bottom:12px;gap:10px"><b style="font-size:18px">${title}</b><button class="btn btn-ghost btn-sm" data-close>Kapat</button></div>${html}</div>`;document.body.appendChild(sh)}
function presentEv(){const T=C.talk[S.phase];const ord=S.ev.slice().sort((a,b)=>(C.ev[b].s===T.who)-(C.ev[a].s===T.who));sheet('Hangi kanıt bu ifadeyle çelişiyor?',`<div class="evs">${ord.map(e=>evCard(e,0,'button')).join('')}</div>`)}
function pickEv(e){
  document.querySelector('.sheet')?.remove();
  const id=S.phase,T=C.talk[id],st=S.talks[id],cur=curList(id)[st.i];
  if(cur.c&&cur.c.includes(e)){
    if(hard()&&!st.pendOk){st.pend=e;st.swr=[];KA.sfx.ok();save();render();return}
    const sl=document.createElement('div');sl.className='slam';sl.innerHTML='<span>ÇELİŞKİ!</span>';document.body.appendChild(sl);document.body.classList.add('quake');KA.sfx.ok();
    setTimeout(()=>{sl.remove();document.body.classList.remove('quake')},900);
    if(st.stage===1&&T.st.some(x=>x.stage===2)){st.stage=2;st.i=0;st.ask=null;st.brk={br:cur.br,lesson:cur.lesson}}
    else{st.done=true;st.br=cur.br;st.lesson=cur.lesson;S.note=T.note}
    save();setTimeout(render,500);
  }else{
    st.bad++;S.wrongs++;KA.sfx.bad();const p=$('#port');p&&(p.classList.remove('shake'),void p.offsetWidth,p.classList.add('shake'));
    KA.toast(cur.c?`"That proves nothing." Bu ifade çelişkili ama başka bir kanıtla.`:`"That proves nothing." Bu ifade bu kanıtla çelişmiyor.`);
    save();spend(COST.badEv,$('#present'));if(S.phase===id)render();
  }
}
function askNil(){const id=S.phase,st=S.talks[id],list=curList(id),k=list.findIndex(x=>x.c);if(k<0)return;const d=evDoc(list[k].c[0]);st.ask=k;st.askDoc=d?d.t:'';st.i=k;S.first['ask'+id+st.stage]=false;save();spend(COST.ask,$('#ask'));render()}
function doAccuse(el){
  const a=S.acc,sol=C.sol;
  if(a.who!==sol.who){a.msg='<b>Suçlama çöktü.</b> '+(sol.wrong[a.who]||'Bu kişiyi destekleyen yeterli kanıt yok.');a.res=null;S.wrongs++;KA.sfx.bad();save();spend(COST.badAcc,el);if(S.phase==='accuse')render();return}
  const r=sol.slots.map((s,i)=>s[2].includes(a.slots[i]));a.res=r;
  if(r.every(Boolean)){S.end='win';save();try{KA.addXp(60,'dava')}catch(e){}const sl=document.createElement('div');sl.className='slam';sl.innerHTML='<span>SUÇLU!</span>';document.body.appendChild(sl);document.body.classList.add('quake');KA.sfx.ok();setTimeout(()=>{sl.remove();document.body.classList.remove('quake');if(hard()){S.chr={done:[],wrong:0,ord:null};S.voc={i:0,ok:0,o:null,wr:[]};go('chrono')}else go('end')},1100);return}
  a.msg=`<b>Doğru kişi, ama iddian zayıf.</b> ${sol.slots.map((s,i)=>r[i]?'':s[0]).filter(Boolean).join(' ve ')} kanıtı bunu desteklemiyor. İpucu: ${sol.hint}`;
  S.wrongs++;KA.sfx.bad();save();spend(15,el);if(S.phase==='accuse')render();
}
function slotPick(i){sheet(`${C.sol.slots[i][0]} için kanıt seç`,`<div class="evs">${S.ev.map(e=>`<button class="ev" data-se="${e}" data-si="${i}"><b>${esc(C.ev[e].t)}</b>${esc(C.ev[e].d)}<q>${esc(C.ev[e].en)}</q></button>`).join('')}</div>`)}
function defter(){const w=Object.entries(S.words);sheet(`Dedektif defteri · ${w.length} kelime`,w.length?`<div class="words" style="justify-content:flex-start">${w.map(([a,b])=>`<span>${esc(a)} <em>· ${esc(b)}</em></span>`).join('')}</div>`:'<p class="mut">Belgelerdeki noktalı kelimelere dokundukça burası dolacak.</p>')}
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let b;
  if(q('[data-close]')||t.classList.contains('sheet')){document.querySelector('.sheet')?.remove();return}
  if(b=q('[data-case]')){useCase(b.dataset.case);render();window.scrollTo({top:0});return}
  if(b=q("[data-gm]")){S.mode=b.dataset.gm;S.phase='board';save();render();return}
  if(q('#cont')){if(!S.mode)S.mode='story';go(S.phase==='intro'?'board':S.phase);return}
  if(q('#restart')){const m=S.mode;DB.cases[C.id]=S=fresh();save();render();return}
  if(b=q('[data-go]')){go(b.dataset.go);return}
  if(q('#defter')){defter();return}
  if(b=q('[data-open]')){openDoc(b.dataset.open,b);return}
  if(b=q('[data-talk]')){openTalk(b.dataset.talk,b);return}
  if(b=q('[data-gl]')){gloss(b);return}
  if(b=q('[data-qa]')){answer(+b.dataset.qa,b);return}
  if(q('#qhint')){const st=S.docs[S.phase],d=docOf(S.phase);st.hl=d.q[st.qi].ev;st.hinted=true;S.first[S.phase+st.qi]=false;save();spend(COST.hint,q('#qhint'));render();setTimeout(()=>document.querySelector('.sn.hl')?.scrollIntoView({behavior:'smooth',block:'center'}),80);return}
  if(q('#qnext')){const st=S.docs[S.phase];if(st.qi===0){st.qi=1;st.ans=null;st.wr=[];st.hl=null;st.hinted=false;save();render()}else{st.solved=true;S.note=docOf(S.phase).note;save();go('board')}return}
  const T=S&&S.phase&&S.phase.startsWith('i_')?S.talks[S.phase]:null;
  if(T){const list=curList(S.phase),cur=list[T.i];
    if(q('#sp')){T.i--;save();render();return}
    if(q('#sn')){T.i++;save();render();return}
    if(b=q('[data-si]')){T.i=+b.dataset.si;save();render();return}
    if(q('#press')){if(!T.pr.includes(cur.en))T.pr.push(cur.en);save();render();return}
    if(q('#trn')){T.trs.push(cur.en);save();spend(COST.tr,q('#trn'));render();return}
    if(q('#ask')){askNil();return}
    if(b=q('[data-sw]')){const tok=norm(b.textContent),hit=(cur.w||[]).some(x=>{const n=norm(x);return tok===n||(n.length>=4&&tok.startsWith(n))});if(hit){const e=T.pend;T.pend=null;T.pendOk=true;pickEv(e);T.pendOk=false;save()}else{T.swr=T.swr||[];T.swr.push(+b.dataset.sw);T.bad++;S.wrongs++;KA.sfx.bad();save();spend(10,b);if(S.phase.startsWith('i_'))render()}return}
    if(q('#present')){presentEv();return}
    if(b=q('[data-pe]')){pickEv(b.dataset.pe);return}
  }
  if(b=q('[data-chr]')){const X=S.chr,i=+b.dataset.chr,need=C.tl.map((t,j)=>[t,j]).filter(([t])=>t[2]).map(x=>x[1]);if(i===need[X.done.length]){X.done.push(i);KA.sfx.ok()}else{X.wrong++;S.wrongs++;KA.sfx.bad();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');save();return}save();render();return}
  if(b=q('[data-voc]')){const V=S.voc,ws=Object.entries(C.aw||{}).slice(0,6),[w,t]=ws[V.i],i=+b.dataset.voc;if(V.o[i]===t){if(!V.wr.length)V.ok++;else if(!S.words[w])S.words[w]=t;KA.sfx.ok();V.i++;V.o=null}else{V.wr.push(i);S.wrongs++;if(!S.words[w])S.words[w]=t;KA.sfx.bad()}save();render();return}
  if(b=q('[data-who]')){S.acc.who=b.dataset.who;S.acc.res=null;S.acc.msg=null;save();render();return}
  if(b=q('[data-slot]')){slotPick(+b.dataset.slot);return}
  if(b=q('[data-se]')){S.acc.slots[+b.dataset.si]=b.dataset.se;S.acc.res=null;S.acc.msg=null;document.querySelector('.sheet')?.remove();save();render();return}
  if(q('#doacc')){doAccuse(q('#doacc'));return}
  if(q('#addw')){Object.entries(S.words).forEach(([w,t])=>KA.addUnknown(w,t));KA.toast('Kelimeler Bilmediklerim listesine eklendi.');q('#addw').disabled=true;return}
});
KA.nav('oyunlar.html');
if(DB.cur&&CASES[DB.cur])useCase(DB.cur);
render();

})();
</script>
</body>
</html>
