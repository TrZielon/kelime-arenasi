    if(won) showConquestCeremony(K, `${MODES[K].n} mücadelesini ${qok} doğru hamleyle zaferle tamamladın!`);
  };

  const baseGrade = window.__kaOrigGrade || (window.__kaOrigGrade = grade);
  grade = async function(){
    const p = cur, wasAll = p && p.groups && p.groups.length && p.groups.every(x=>x.ok);
    await baseGrade();
    if(p && p.groups && p.groups.length && p.groups.every(x=>x.ok) && !wasAll){
      showConquestCeremony(6, 'Tüm akademik paragraf gruplarının ana düşüncesini başarıyla onaylattın!');

  /* ============================================================================
     OTOMASYON 5: ÖRNEK CÜMLEDEKİ BİLİNMEYEN KELİMEYE TIKLAYINCA ANLAM YANINDA
     "➕ LİSTEYE EKLE" BUTONU & OTOMATİK TURENG + CÜMLE ÜRETİMİ
     ============================================================================ */
  function findWordInPack(p, wordStr){
    if(!p || !Array.isArray(p.items)) return null;
    const k = String(wordStr||'').toLowerCase().trim();
    if(!k) return null;
    return p.items.find(x =>
      x.en.toLowerCase().trim() === k ||
      x.en.toLowerCase().split(/\s*[\/~]\s*/).map(s=>s.trim()).includes(k)
    ) || null;
  }

  async function enrichSingleAddedWord(p, item){
    if(!p || !item || !SMP) return;
    try{
      if(!item.turengDone){
        const rTr = await askJ(TURENG_SYS, `1. ${item.en}${item.tr ? ` [Mevcut: ${item.tr}]` : ''}`, 45000, 'quick');
        if(rTr && Array.isArray(rTr.items) && rTr.items[0]){
          const o = rTr.items[0];
          if(validTr(o.tr, item.en)){
            item.tr = combineTurengMeaning(item.baseTr || item.tr, o.tr);
            item.turengDone = true;
          }
        }
      }
      if(item.tr && !item.s){
        const rB = await askJ(BATCH_HARD, `${item.en} - ${item.tr}`, 60000, 'quick');
        if(rB && Array.isArray(rB.items) && rB.items[0]){
          const g = rB.items[0];
          merge(item, g);
          if(Array.isArray(g.syn) && g.syn.length) item.syn = g.syn.map(s=>String(s||'').trim()).filter(Boolean);
          item.d = buildSubtleDistractors(item);
          item.dV2 = true;
        }
      }
      save(p);
      renderFoot();
      document.querySelectorAll(`[data-added-status="${CSS && CSS.escape ? CSS.escape(item.en.toLowerCase()) : item.en.toLowerCase()}"]`).forEach(el => {
        el.innerHTML = `✅ <b>"${esc(item.en)}"</b> Listede (Kutu 1 · Tureng & Cümlesi Hazır!)`;
      });
    }catch(e){}
  }

  function addUnknownWordToPack(wordEn, initialTr, btnEl){
    if(!cur) return;
    const cleanEn = String(wordEn||'').trim().toLowerCase();
    if(!cleanEn) return;
    const existing = findWordInPack(cur, cleanEn);
    if(existing){
      if(btnEl) btnEl.outerHTML = `<span class="added-word-badge">✓ Zaten Listede (Kutu ${bx(existing)})</span>`;
      return;
    }
    const cleanTr = String(initialTr||'').trim();
    const newItem = {
      en: cleanEn,
      tr: cleanTr,
      baseTr: cleanTr,
      turengDone: false,
      s: '',
      st: '',
      d: [],
      gl: {},
      mo: {}
    };
    cur.items.push(newItem);
    if(Array.isArray(cur.words)) cur.words.push({ en: cleanEn, tr: cleanTr });
    cur.prog = cur.prog || { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 };
    cur.prog.box = cur.prog.box || {};
    cur.prog.box[cleanEn] = 1;
    if(step === 0 && Array.isArray(deck) && !deck.some(d => d.en.toLowerCase() === cleanEn)){
      deck.push(newItem);
      if(KART_TOTAL) KART_TOTAL++;
    }
    save(cur);
    SFX.ok();
    renderFoot();
    if(step === -1) renderHome();
    if(btnEl){
      btnEl.outerHTML = `<span class="added-word-badge" data-added-status="${esc(cleanEn)}">✅ <b>"${esc(cleanEn)}"</b> Listeye Eklendi! (Kutu 1${SMP ? ' · Detayları Hazırlanıyor…' : ''})</span>`;
    }
    if(SMP) enrichSingleAddedWord(cur, newItem);
  }

  function renderAddWordActionHtml(wordStr, meaningStr){
    const k = String(wordStr||'').toLowerCase().trim();
    if(!k || !cur) return '';
    const existing = findWordInPack(cur, k);
    if(existing){
      return `<span class="added-word-badge">✓ Listede Mevcut (Kutu ${bx(existing)})</span>`;
    }
    return `<button type="button" class="add-word-btn" data-add-word="${esc(k)}" data-add-tr="${esc(meaningStr||'')}">➕ Listeye Ekle</button>`;
  }

  qNext = function(){
    const total = qTotal();
    if(qi >= total || lives <= 0) return qEnd(lives > 0);
    if(!cur.items.some(x=>x.tr) || FILL[cur.id]){ $('#st').innerHTML = waitBox(); return; }
    if(qmode === 'cum' && !cur.items.some(x=>x.s && x.st)){
      $('#st').innerHTML = `<div class="qbox waitc" data-wait="1"><div class="eyebrow">Cümle</div><p class="m">Cümleler henüz hazırlanıyor… Hazırlamak için yukarıdaki “Hazırla” düğmesine bas.</p><div class="row"><button class="pill" id="re">Yeniden dene</button></div></div>`;
      return;
    }

    if(qmode === 'boss' && BOSS_QUEUE[qi]){
      Q = BOSS_QUEUE[qi];
      Q.done = 0;
      Q.tries = 0;
    } else {
      Q = (qmode === 'cum' && mkQ(true)) || mkQ(false);
      if(Q) Q.done = 0;
    }
    if(!Q){ $('#st').innerHTML = waitBox(); return; }
    SRC = Q.x || null;
    setProg((qi / total) * 100);
    setHearts();

    /* Eğer Boss turundaki soru "Yazma (Kelime Ocağı)" aşamasıysa: */
    if(Q.k === 'y'){
      $('#st').innerHTML = `
        <div class="coach">${mascot('',62)}<div class="bubble">🐉 <b>Boss Düellosu · Yazma Aşaması!</b> Kelimeye çok yaklaşırsan canın gitmez, <b>2. bir hak</b> kazanırsın!</div></div>
        <div class="qbox">
          <div class="boss-phase-tag">🐉 BOSS HAMLESİ ${qi+1}/${total} · ✍️ KELİME OCAĞI (YAZMA)</div>
          <h2 class="q">${esc(Q.x.tr)}</h2>
          <input class="txt" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="İngilizce karşılığını yaz…">
          <div class="row"><button class="btn3" id="ck">⚔️ Saldır (Kontrol Et)</button></div>
          <div class="fb" id="fb"></div>
        </div>`;
      const a = $('#ans'); if(a) a.focus();
      return;
    }

    const phaseBadges = {
      sec: '🎯 KELİME DÜELLOSU (SEÇ)',
      pair: '⚡ HIZLI EŞLEŞTİRME BAĞI',
      cum: '📖 AKADEMİK CÜMLE ANALİZİ'
    };
    const label = qmode === 'boss'
      ? `🐉 BOSS DÜELLOSU · ${qi+1} / ${total}`
      : (qmode === 'cum' ? `RİNG VI · CÜMLE · ${qi+1} / ${total} (Tüm Liste)` : `RİNG III · SEÇ · ${qi+1} / ${total} (Tüm Liste)`);

    $('#st').innerHTML = `
      <div class="coach">${mascot('',62)}<div class="bubble">${qmode==='boss' ? '🐉 Boss tüm ringlerin sınavını birleştirdi! Dikkatli ol, 3 canın var.' : esc(rnd(CHEER))}</div></div>
      <div class="qbox">
        ${qmode === 'boss' ? `<div class="boss-phase-tag">🐉 BOSS HAMLESİ ${qi+1}/${total} · ${phaseBadges[Q.sub] || 'KARMA DÜELLO'}</div>` : `<div class="eyebrow">${label}</div>`}
        ${Q.k === 's'
          ? `<div class="m" style="margin:-2px 0 8px">Bu akademik cümlenin doğru Türkçe çevirisi hangisi?</div><div class="ex" style="margin-top:0">${sent(Q.q)}</div><div class="tip" id="tip" style="margin-top:10px">${tipHtml()}</div><div class="row" style="justify-content:flex-start"><button class="pill" data-say="${esc(Q.q)}">🔊 Cümleyi Dinle (US)</button></div>`
          : `<div class="m" style="margin:-2px 0 4px">${Q.sub === 'pair' ? '⚡ Hızlı Eşleştir: Bu Türkçe anlam hangi İngilizce kelimeye ait?' : (Q.dirEn ? 'İngilizce → Türkçe' : 'Türkçe → İngilizce')}</div><h2 class="q">${esc(Q.q)}</h2>${Q.dirEn ? `<div class="row" style="justify-content:flex-start"><button class="pill" data-say="${esc(Q.x.en.split(/\s*[\/~]\s*/)[0])}">🔊 Kelimeyi Dinle (US)</button></div>` : ''}`}
        <div class="opts">${Q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join('')}</div>
        <div class="fb" id="fb"></div>
        <div class="row"><button class="btn3" id="nx" hidden>Sonraki →</button></div>
      </div>`;
  };

  tap = async function(w, el){
    document.querySelectorAll('.tk.sel').forEach(x => x.classList.remove('sel'));
    if(el) el.classList.add('sel');
    const cleanW = String(w||'').trim();
    const k = cleanW.toLowerCase();
    const mo = SRC && SRC.mo ? aMo(SRC.mo[k]) : [];
    const my = ++TAPN, q = encodeURIComponent(k), ctx = tipCtx();
    say(cleanW);

    const inlineTip = el && el.closest ? (el.closest('.sent-card-ex-wrap') && el.closest('.sent-card-ex-wrap').querySelector('.sent-inline-tip')) : null;
    const writeTip = html => {
      if(inlineTip){
        inlineTip.hidden = false;
        inlineTip.innerHTML = html;
      } else {
        let tEl = $('#tip');
        if(!tEl && el && el.closest){
          const exBox = el.closest('.ex,.para');
          if(exBox){
            exBox.insertAdjacentHTML('afterend', '<div class="tip" id="tip" style="margin-top:10px"></div>');
            tEl = $('#tip');
          }
        }
        setTip(html);
      }
    };

    const show = (g, note) => {
      const addBtnHtml = renderAddWordActionHtml(cleanW, g);
      writeTip(
        `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">` +
          `<div><b>${esc(cleanW)}</b> — ${g ? `<span class="good" style="font-weight:800">${esc(g)}</span>` : `<span class="m">${esc(note||'')}</span>`} ${addBtnHtml}</div>` +
          `<div><a class="m" href="https://dictionary.cambridge.org/dictionary/english-turkish/${q}" target="_blank" rel="noopener">Cambridge ↗</a> <a class="m" href="https://tureng.com/en/turkish-english/${q}" target="_blank" rel="noopener">Tureng ↗</a></div>` +
        `</div>` +
        (mo.length ? `<div style="margin-top:6px">${mo.map(([p,t,d])=>`<span class="chip">${esc(p)} · ${esc(t)}: ${esc(d)}</span>`).join('')}</div>` : '')
      );
    };

    const g = meaningOf(k);
    if(g) return show(g);
    show('', 'anlam aranıyor…');
    const r = await askJ(GLOSS, k, 60000, 'quick');

    if(v && cur){ cur.dict = cur.dict || {}; cur.dict[k] = v; save(cur); }
    if(my === TAPN && (inlineTip || tipCtx() === ctx)) show(v, 'anlam bulunamadı (yine de listeye ekleyebilirsin)');
  };

  /* 7. ETKİLEŞİM DİNLEYİCİLERİ (ÇİFT TETİKLENME KORUMALI) */
  if(!window.__kaListenersBound){
    window.__kaListenersBound = true;
    document.addEventListener('click', e => {
      const t = e.target;
      const addW = t.closest('[data-add-word]');
      if(addW){
        e.stopPropagation();
        addUnknownWordToPack(addW.dataset.addWord, addW.dataset.addTr || '', addW);
        spawnSparks(e.clientX, e.clientY, 18);
        return;
      }
      if(t.closest('#conqCloseBtn') || t.id==='conqOv'){ closeConquestCeremony(); return; }
      const cNext = t.closest('#conqNextBtn');
      if(cNext && cNext.dataset.conqOpen!=null){ closeConquestCeremony(); showAct(+cNext.dataset.conqOpen); return; }
      const vw = t.closest('[data-view]');
      if(vw){ HOME_VIEW = vw.dataset.view; try{localStorage.setItem('ka_view',HOME_VIEW)}catch(err){} renderHome(); return; }
      const tr = t.closest('[data-tier]');
      if(tr){ openTierModal(+tr.dataset.tier); return; }
      const wb = t.closest('[data-wbox]');
      if(wb){ WEXP_BOX = +wb.dataset.wbox; const w=$('#wexpWrap'); if(w) w.innerHTML=renderWordExplorerBody(); return; }
      if(t.closest('[data-sent-modal]')){ openSentencesModal(); return; }
      if(t.closest('#toggleAllSentTr')){
        SEXP_HIDE_TR = !SEXP_HIDE_TR;
        const sw = $('#sexpWrap');
        if(sw) sw.innerHTML = renderSentencesExplorerBody();
        return;
      }
      if(t.closest('#loadSampleDefBtn')){
        try{ localStorage.setItem('ka_keep_buept_def', '1'); }catch(e){}
        if(!packs.some(x => x.id === 'def')){
          const defP = mk('def', 'BUEPT Akademik Örnek Liste', parse(DEF));
          ensureFreshPackState(defP);
          packs.push(defP);
          cur = defP;
        } else {
          cur = packs.find(x => x.id === 'def');
        }
        try{ localStorage.setItem('ka_active_pack_id', cur.id); }catch(e){}
        loadShared(cur).then(() => { save(cur); renderHead(); showHome(); });
        return;
      }
      if(t.closest('#resetProgBtn') && cur){
        if(confirm(`"${cur.name}" listesindeki mod tamamlama ve kutu ilerlemeleri sıfırlansın mı?`)){
          cur.prog = { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 };
          if(Array.isArray(cur.groups)) cur.groups.forEach(g => delete g.ok);
          save(cur); renderHead(); showHome();
        }
        return;
      }
      const ws = t.closest('[data-wshift]');
      if(ws && cur){
        const en = ws.dataset.wen, delta = +ws.dataset.wshift;
        cur.prog.box[en] = Math.max(1, Math.min(5, (cur.prog.box[en]||1) + delta));
        save(cur);
        const w = $('#wexpWrap'); if(w) w.innerHTML = renderWordExplorerBody();
        if(step===-1) renderHome();
        return;
      }
      const ml = t.closest('[data-l]');
      if(ml && step===1 && rd && rd[+ml.dataset.l]){
        say(rd[+ml.dataset.l].en);
      }
      if(t.closest('#yes') || t.closest('[data-o]') || t.closest('#ck') || t.closest('[data-l],[data-r]')){
        spawnSparks(e.clientX, e.clientY, 16);
      }
    });

    document.addEventListener('input', e => {
      if(e.target && e.target.id==='wexpInput'){
        WEXP_Q = e.target.value;
        const pos = e.target.selectionStart || WEXP_Q.length;
        const w = $('#wexpWrap');
        if(w){ w.innerHTML = renderWordExplorerBody(); const inp = $('#wexpInput'); if(inp){ inp.focus(); try{inp.setSelectionRange(pos,pos)}catch(err){} } }
      }
      if(e.target && e.target.id==='sexpInput'){
        SEXP_Q = e.target.value;
        const pos = e.target.selectionStart || SEXP_Q.length;
        const sw = $('#sexpWrap');
        if(sw){ sw.innerHTML = renderSentencesExplorerBody(); const inp = $('#sexpInput'); if(inp){ inp.focus(); try{inp.setSelectionRange(pos,pos)}catch(err){} } }
      }
    });
  } else if(!window.__kaAddWordListenersBound){
    window.__kaAddWordListenersBound = true;
    /* Eğer önceki yama zaten dinleyici bağladıysa, yeni Listeye Ekle, Cümleler Modalı ve Sıfırla dinleyicisini ekle */
    document.addEventListener('click', e => {
      const t = e.target;
      const addW = t.closest('[data-add-word]');
      if(addW){
        e.stopPropagation();
        addUnknownWordToPack(addW.dataset.addWord, addW.dataset.addTr || '', addW);
        spawnSparks(e.clientX, e.clientY, 18);
        return;
      }
      if(t.closest('[data-sent-modal]')){ openSentencesModal(); return; }
      if(t.closest('#toggleAllSentTr')){
        SEXP_HIDE_TR = !SEXP_HIDE_TR;
        const sw = $('#sexpWrap');
        if(sw) sw.innerHTML = renderSentencesExplorerBody();
        return;
      }
      if(t.closest('#loadSampleDefBtn')){
        try{ localStorage.setItem('ka_keep_buept_def', '1'); }catch(e){}
        if(!packs.some(x => x.id === 'def')){
          const defP = mk('def', 'BUEPT Akademik Örnek Liste', parse(DEF));
          ensureFreshPackState(defP);
          packs.push(defP);
          cur = defP;
        } else {
          cur = packs.find(x => x.id === 'def');
        }
        try{ localStorage.setItem('ka_active_pack_id', cur.id); }catch(e){}
        loadShared(cur).then(() => { save(cur); renderHead(); showHome(); });
        return;
      }
      if(t.closest('#resetProgBtn') && cur){
        if(confirm(`"${cur.name}" listesindeki mod tamamlama ve kutu ilerlemeleri sıfırlansın mı?`)){
          cur.prog = { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 };
          if(Array.isArray(cur.groups)) cur.groups.forEach(g => delete g.ok);
          save(cur); renderHead(); showHome();
        }
        return;
      }
      const ml = t.closest('[data-l]');
      if(ml && step===1 && rd && rd[+ml.dataset.l]){
        say(rd[+ml.dataset.l].en);
      }
    });
    document.addEventListener('input', e => {
      if(e.target && e.target.id==='sexpInput'){
        SEXP_Q = e.target.value;
        const pos = e.target.selectionStart || SEXP_Q.length;
        const sw = $('#sexpWrap');
        if(sw){ sw.innerHTML = renderSentencesExplorerBody(); const inp = $('#sexpInput'); if(inp){ inp.focus(); try{inp.setSelectionRange(pos,pos)}catch(err){} } }
      }
    });
  }

  function syncNewsAddedWordsToPack(p){
    try{
      const q = JSON.parse(localStorage.getItem('ka_news_added_words') || '[]');
      if(!Array.isArray(q) || !q.length) return;
      if(!p){
        const newP = {
          id: 'p_haber_' + Date.now().toString(36),
          name: 'Haberlerden Eklediklerim',
          words: [],
          items: [],
          groups: [],
          dict: {},
          prog: { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 }
        };
        packs.push(newP);
        cur = newP;
        p = newP;
        try{ localStorage.setItem('ka_active_pack_id', p.id); }catch(e){}
      }
      if(!Array.isArray(p.items)) return;
      let changed = false;
      q.forEach(nw => {
        const cleanEn = String(nw && nw.en || '').trim().toLowerCase();
        if(!cleanEn) return;
        const ex = findWordInPack(p, cleanEn);
        if(!ex){
          const cleanTr = String(nw.tr || '').trim();
          const newItem = {
            en: cleanEn,
            tr: cleanTr,
            baseTr: cleanTr,
            turengDone: !!cleanTr,
            syn: Array.isArray(nw.syn) ? nw.syn : [],
            s: String(nw.s || '').trim(),
            st: String(nw.st || '').trim(),
            d: [],
            gl: {},
            mo: {}
          };
          if(newItem.st) newItem.d = buildSubtleDistractors(newItem);
          p.items.push(newItem);
          if(Array.isArray(p.words)) p.words.push({ en: cleanEn, tr: cleanTr });
          p.prog = p.prog || { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 };
          p.prog.box = p.prog.box || {};
          p.prog.box[cleanEn] = 1;
          changed = true;
          if(SMP && (!newItem.s || !newItem.st)) enrichSingleAddedWord(p, newItem);
        }
      });
      if(changed){
        save(p);
        renderFoot();
      }
    }catch(e){}
  }

  /* ============================================================================
     📲 SEÇENEK 4: "ARENAYI CEBİNE TAŞI" TELEFON VİTRİN KARTI + ANA EKRANA EKLE (PWA)
     ============================================================================ */
  let PWA_PROMPT = null;
  function isStandaloneApp(){
    try{
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isIOSDevice(){
    const ua = navigator.userAgent || '';
    return /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function drawArenaIcon(size){
    try{
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const s = size / 64;
      const grad = g.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#14968c'); grad.addColorStop(1, '#0b5a55');
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      g.lineCap = 'round';
      g.strokeStyle = '#ffffff'; g.lineWidth = 4.8 * s;
      g.beginPath(); g.moveTo(15*s, 47.5*s); g.lineTo(15*s, 30.5*s); g.arc(32*s, 30.5*s, 17*s, Math.PI, 0); g.lineTo(49*s, 47.5*s); g.stroke();
      g.lineWidth = 3 * s;
      g.beginPath(); g.moveTo(11.8*s, 47.5*s); g.lineTo(18.2*s, 47.5*s); g.moveTo(45.8*s, 47.5*s); g.lineTo(52.2*s, 47.5*s); g.stroke();
      g.strokeStyle = '#fbbf24'; g.lineWidth = 4.2 * s;
      g.beginPath(); g.moveTo(24*s, 47.5*s); g.lineTo(24*s, 31.5*s); g.arc(32*s, 31.5*s, 8*s, Math.PI, 0); g.lineTo(40*s, 47.5*s); g.stroke();
      g.lineWidth = 2.7 * s;
      g.beginPath(); g.moveTo(9.5*s, 53.5*s); g.quadraticCurveTo(20.8*s, 49*s, 32*s, 53.8*s); g.quadraticCurveTo(43.2*s, 49*s, 54.5*s, 53.5*s); g.stroke();
      g.fillStyle = '#fbbf24';
      g.beginPath(); g.arc(50*s, 13*s, 3.9*s, 0, Math.PI*2); g.fill();
      return c.toDataURL('image/png');
    }catch(e){ return ''; }
  }
  function setupPwaMeta(){
    if(window.__kaPwaMeta) return;
    window.__kaPwaMeta = true;
    const head = document.head;
    const addMeta = (name, content) => {
      if(head.querySelector(`meta[name="${name}"]`)) return;
      const m = document.createElement('meta'); m.name = name; m.content = content; head.appendChild(m);
    };
    addMeta('apple-mobile-web-app-capable', 'yes');
    addMeta('mobile-web-app-capable', 'yes');
    addMeta('apple-mobile-web-app-status-bar-style', 'black-translucent');
    addMeta('apple-mobile-web-app-title', 'K. Arenası');
    addMeta('theme-color', '#0f766e');
    const icon180 = drawArenaIcon(180);
    const icon512 = drawArenaIcon(512);
    if(icon180 && !head.querySelector('link[rel="apple-touch-icon"]')){
      const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = icon180; head.appendChild(l);
    }
    if(!head.querySelector('link[rel="manifest"]') && icon512){
      try{
        const origin = location.origin;
        const manifest = {
          name: 'Kelime Arenası',
          short_name: 'K. Arenası',
          description: 'Kendi kelimelerinle oyunlaştırılmış akademik İngilizce çalışma arenası',
          start_url: origin + '/',
          scope: origin + '/',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#f3f8f6',
          theme_color: '#0f766e',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(blob); head.appendChild(l);
      }catch(e){}
    }
  }
  setupPwaMeta();
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA_PROMPT = e; });
  window.addEventListener('appinstalled', () => {
    PWA_PROMPT = null;
    try{ localStorage.setItem('ka_pwa_installed', '1'); }catch(e){}
    document.querySelectorAll('.pwa-showcase').forEach(el => el.remove());
  });

  function pwaCardHtml(){
    if(isStandaloneApp() || localStorage.getItem('ka_pwa_installed') === '1') return '';
    return `
      <div class="card pwa-showcase" style="margin-top:16px">
        <div class="pwa-show-in">
          <div class="pwa-mini-phone">
            <div class="pwa-mini-notch"></div>
            <div class="pwa-mini-grid"><i>📅</i><i class="on"><svg viewBox="0 0 64 64" width="18" height="18"><path d="M15 47.5V30.5a17 17 0 0 1 34 0v17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M24 47.5V31.5a8 8 0 0 1 16 0v16" fill="none" stroke="#1f1300" stroke-width="5" stroke-linecap="round"/></svg></i><i>📷</i><i>🎵</i></div>
            <div class="pwa-mini-lbl">K. Arenası</div>
          </div>
          <div class="pwa-show-txt">
            <span class="pwa-show-badge">📱 MOBİL UYGULAMA MODU</span>
            <h3 style="margin:4px 0 4px">Arenayı Cebine Taşı!</h3>
            <p class="m" style="margin:0 0 10px;font-size:13px">App Store'a veya Play Store'a gerek yok. Kelime Arenası'nı telefonunun ana ekranına ekle; tarayıcı çubuğu olmadan tam ekran, gerçek bir uygulama gibi açılsın. Listelerin ve ilerlemen aynen kalır.</p>
            <button type="button" class="btn3 small" data-pwa-install="1">📲 Ana Ekrana Ekle</button>
          </div>
        </div>
      </div>`;
  }

  function openPwaGuide(){
    const ios = isIOSDevice();
    openModalWith(`
      <section class="addp">
        <div class="addp-h"><div><div class="eyebrow">MOBİL UYGULAMA KURULUMU</div><h2>📲 Kelime Arenası'nı Telefonuna Ekle</h2></div></div>
        <p class="m" style="margin-top:6px">Kurulum yaklaşık 5 saniye sürer. Ana ekranındaki <b>K. Arenası</b> ikonuna dokunduğunda site tam ekran, uygulama gibi açılır.</p>
        <div class="pwa-steps">
          <div class="pwa-card" style="${ios ? 'border-color:var(--acc)' : ''}">
            <h4>🍎 iPhone / iPad (Safari)</h4>
            <div class="pwa-step-item">1. Siteyi <b>Safari</b> ile aç (Chrome'da iPhone'da da "Paylaş" menüsü vardır).</div>
            <div class="pwa-step-item">2. Alttaki <b>Paylaş [↑]</b> simgesine dokun.</div>
            <div class="pwa-step-item">3. Listeyi aşağı kaydır ve <b>"Ana Ekrana Ekle"</b>yi seç.</div>
            <div class="pwa-step-item">4. Sağ üstten <b>"Ekle"</b>ye bas. Bitti! ✅</div>
          </div>
          <div class="pwa-card" style="${!ios ? 'border-color:var(--acc)' : ''}">
            <h4>🤖 Android (Chrome)</h4>
            <div class="pwa-step-item">1. Sağ üstteki <b>⋮ (üç nokta)</b> menüsüne dokun.</div>
            <div class="pwa-step-item">2. <b>"Ana ekrana ekle"</b> veya <b>"Uygulamayı yükle"</b>yi seç.</div>
            <div class="pwa-step-item">3. Açılan pencerede <b>"Ekle / Yükle"</b>ye bas. Bitti! ✅</div>
          </div>
        </div>
        <p class="m" style="margin-top:12px;font-size:12.5px">💡 Bilgisayarda (Chrome/Edge) adres çubuğunun sağındaki <b>⊕ Yükle</b> simgesiyle de masaüstü uygulaması olarak kurabilirsin.</p>
      </section>`);
  }

  async function handlePwaInstall(){
    if(isStandaloneApp()){ alert('Kelime Arenası zaten uygulama olarak açık! 🎉'); return; }
    if(PWA_PROMPT){
      try{
        PWA_PROMPT.prompt();
        const choice = await PWA_PROMPT.userChoice;
        PWA_PROMPT = null;
        if(choice && choice.outcome === 'accepted'){
          try{ localStorage.setItem('ka_pwa_installed', '1'); }catch(e){}
          document.querySelectorAll('.pwa-showcase').forEach(el => el.remove());
        }
        return;
      }catch(e){}
    }
    openPwaGuide();
  }

  if(!window.__kaPwaBound){
    window.__kaPwaBound = true;
    document.addEventListener('click', e => {
      const b = e.target.closest && e.target.closest('[data-pwa-install]');
      if(b){ e.preventDefault(); handlePwaInstall(); }
    });
  }

  function applyNow(){
    if(typeof packs !== 'undefined' && Array.isArray(packs)){
      cleanUnwantedDefaultPack();
      packs.forEach(p => ensureFreshPackState(p));
    }
    syncNewsAddedWordsToPack(cur);
    if(typeof cur !== 'undefined' && cur){
      ensureFreshPackState(cur);
    }
    if(step===-1) renderHome();
    try{ document.querySelectorAll('[data-conq-demo]').forEach(el => el.remove()); }catch(e){}
  }
  applyNow();
  setTimeout(applyNow, 180);
  setTimeout(applyNow, 650);
})();
</script>

<script>
(function(){
  /* 0. SADECE SEÇİLEN 2 RENK PALETİ (1. AÇIK AKDENİZ, 2. KOYU AKDENİZ) */
  const VALID_PALS = ['akdeniz', 'derin_akdeniz'];
  const dotsEl = document.querySelector('.dots');
  if(dotsEl){
    dotsEl.innerHTML = `
      <button data-pal="akdeniz" title="🌿 Açık Akdeniz (Varsayılan)" aria-label="Açık Akdeniz" style="background:#0f766e"></button>
      <button data-pal="derin_akdeniz" title="🌌 Koyu Akdeniz (Derin Akdeniz Gecesi)" aria-label="Koyu Akdeniz" style="background:#061514;border-color:#14b8a6"></button>
    `;
  }
  setPal = function(n){
    const target = VALID_PALS.includes(n) ? n : 'akdeniz';
    document.body.dataset.pal = target;
    document.querySelectorAll('.dots button').forEach(b => b.classList.toggle('on', b.dataset.pal === target));
    try{ localStorage.setItem('ka_pal', target); localStorage.setItem('ka_pal_v3', target); }catch(e){}
  };
  try{
    const savedV3 = localStorage.getItem('ka_pal_v3') || localStorage.getItem('ka_pal');
    setPal(VALID_PALS.includes(savedV3) ? savedV3 : 'akdeniz');
  }catch(e){ setPal('akdeniz'); }

  /* ⚡ TURBO HIZ & PERFORMANS OTOMASYONU (4X PARALEL HAVUZ + KALICI AI ÖNBELLEĞİ + HIZLI RENDER) */
  let AI_CACHE = {};
  try{ AI_CACHE = JSON.parse(localStorage.getItem('ka_ai_cache_v2') || '{}') || {}; }catch(e){ AI_CACHE = {}; }
  let cacheSaveTimer = null;
  function saveAiCache(){
    clearTimeout(cacheSaveTimer);
    cacheSaveTimer = setTimeout(() => {
      try{
        const keys = Object.keys(AI_CACHE);
        if(keys.length > 600){
          keys.slice(0, keys.length - 500).forEach(k => delete AI_CACHE[k]);
        }
        localStorage.setItem('ka_ai_cache_v2', JSON.stringify(AI_CACHE));
      }catch(e){}
    }, 400);
  }
  function hashPrompt(s){
    let h = 2166136261;
    for(let i=0; i<s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + '_' + s.length;
  }

  async function turboPool(items, fn, conc = 4){
    let i = 0;
    const workers = Array.from({length: Math.min(conc, items.length)}, async () => {
      while(i < items.length){
        const it = items[i++];
        await fn(it);
      }
    });
    await Promise.all(workers);
  }

  const TURBO_GATE = { n: 0, max: 4, q: [] };
  function tAcquire(){
    if(TURBO_GATE.n < TURBO_GATE.max){ TURBO_GATE.n++; return Promise.resolve(); }
    return new Promise(r => TURBO_GATE.q.push(r));
  }
  function tRelease(){
    const nx = TURBO_GATE.q.shift();
    if(nx) nx(); else TURBO_GATE.n = Math.max(0, TURBO_GATE.n - 1);
  }

  askJ = async function(sys, input, ms, tier){
    if(!SMP){ LASTERR = 'yapay zeka bu sayfada açık değil'; return null; }
    const cacheKey = hashPrompt(sys.slice(0, 80) + '||' + input);
    if(sys !== GRADE && sys !== GRADE2 && AI_CACHE[cacheKey]){
      return JSON.parse(JSON.stringify(AI_CACHE[cacheKey]));
    }
    await tAcquire();
    try{
      for(let attempt=0; attempt<2; attempt++){
        const ac = new AbortController();
        const tm = setTimeout(() => ac.abort(), ms || (tier === 'quick' ? 40000 : 95000));
        try{
          const o = { cache: false, signal: ac.signal };
          if(tier) o.modelTier = tier;
          const r = await SMP(sys + '\n\nGİRDİ:\n' + input, o);
          if(r && r.truncated){ LASTERR = 'çıktı kesildi'; return null; }
          const m = String((r && r.text) || '').match(/[\[{][\s\S]*[\]}]/);
          if(m){
            const v = JSON.parse(m[0]);
            if(v && typeof v === 'object'){
              LASTERR = '';
              if(sys !== GRADE && sys !== GRADE2){
                AI_CACHE[cacheKey] = v;
                saveAiCache();
              }
              return v;
            }
          }
          LASTERR = 'geçersiz yanıt';

  const FIXED_PHRASES = new Set([
    'have to do with','at stake','in danger','at risk','behind bars','take a toll',
    'account for','per capita','per person','a third','one third','invasion of privacy',
    'post-x','x-intensive','water-intensive'
  ]);

  function isTurkishSegment(s){
    const str = String(s || '').trim();
    if(!str) return false;
    if(/[çğıöşüİÇĞÖŞÜ]/.test(str)) return true;
    if(/\b[a-z]{2,}(mak|mek)\b/i.test(str)) return true;
    if(/\b(bir|ve|veya|ile|olan|etmek|olmak|yapmak|vermek|almak|tutmak|olarak|gibi|kadar|sonra|arasında|karşı|göre|ait|dair|ortak|rakip|rekabet|hanedan|veraset|varis|somut|hasat|tohum|miktar|hacim|bahane|verim|aciliyet|ittifak)\b/i.test(str)) return true;
    return false;
  }

  function splitEnglishEntry(enRaw){
    const clean = String(enRaw || '').trim();
    if(!clean) return [];
    if(/[\/~;,]/.test(clean)){
      const parts = clean.split(/\s*[\/~;,]\s*/).map(s=>s.trim()).filter(Boolean);
      if(parts.length > 1) return parts;
    }
    const low = clean.toLowerCase();
    if(!FIXED_PHRASES.has(low) && !/^(to|a|an|the|in|on|at|by|for|with|from|of|into|out)\b/i.test(low)){
      const words = clean.split(/\s+/);
      if(words.length === 2 && !words[0].includes('-') && !words[1].includes('-')){
        const stopWords = new Set(['of','to','in','on','for','with','at','by','from','up','out','off','down','over','under','as','be','have','take','make','get','give','keep','let','put','set']);
        if(!stopWords.has(words[0].toLowerCase()) && !stopWords.has(words[1].toLowerCase()) && words[0].length >= 4 && words[1].length >= 4){
          return [words[0], words[1]];
        }
      }
    }
    return [clean];
  }

  function smartParse(t){
    const rawLines = String(t || '').split(/\r?\n/)
      .map(l => l.replace(/[\u00a0 ]+/g,' ')
        .replace(/[A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ ]{2,}\s*[–-]\s*VOCAB/g,'')
        .replace(/^\s*(?:\d+[.)]|[•*·-])\s+/,'').trim())
      .filter(l => l && !/^[A-ZÇĞİÖŞÜ ]+$/.test(l));

    const out = [];
    const seen = new Set();

    for(const l of rawLines){
      const seg = l.split(/\s+:\s+|\s+[-–—]\s+|\s*\|\s*|\t+/).map(s=>s.trim()).filter(Boolean);
      let enSegments = [l], trPart = '';
      if(seg.length >= 2){
        let ti = seg.findIndex((s,i) => i > 0 && isTurkishSegment(s));
        if(ti === -1) ti = seg.length - 1;
        enSegments = seg.slice(0, ti);
        trPart = seg.slice(ti).join(', ');
      }
      for(const segEn of enSegments){
        const enList = splitEnglishEntry(segEn);
        for(const enItem of enList){
          const key = enItem.toLowerCase();
          if(seen.has(key)) continue;
          seen.add(key);
          out.push({ en: enItem, tr: trPart || '', baseTr: trPart || '' });
        }
      }
    }
    return out;
  }

  function splitCombinedItemsInPack(p){
    if(!p || !Array.isArray(p.items)) return;
    const newItems = [];
    const seen = new Set();
    let changed = false;

    for(const it of p.items){
      const parts = splitEnglishEntry(it.en);
      if(parts.length > 1){
        changed = true;
        for(const part of parts){
          const k = part.toLowerCase();
          if(seen.has(k)) continue;
          seen.add(k);
          const clone = Object.assign({}, it, {
            en: part,
            baseTr: it.baseTr || it.tr || ''
          });
          if(p.prog && p.prog.box && p.prog.box[it.en] && !p.prog.box[part]){
            p.prog.box[part] = p.prog.box[it.en];
          }
          newItems.push(clone);
        }
      } else {
        const k = String(it.en || '').toLowerCase();
        if(!seen.has(k)){
          seen.add(k);
          if(it.tr && !it.baseTr) it.baseTr = it.tr;
          newItems.push(it);
        }
      }
    }
    if(changed){
      p.items = newItems;
      p.words = newItems.map(x => ({ en: x.en, tr: x.tr || '' }));
    }
  }

3. Her kelime için "syn" alanına o kelimenin en önemli 3-4 akademik İngilizce eş anlamlısını (synonyms) dizi olarak yaz.
YALNIZCA geçerli JSON döndür:
{"items":[{"i":1,"tr":"Mevcut anlam, Tureng yaygın anlam 1, Tureng yaygın anlam 2","syn":["synonym1","synonym2","synonym3"],"split":[]}]}`;

  function combineTurengMeaning(baseTr, aiTr){
    const parts = [];
    const seen = new Set();
    const add = str => {
      String(str || '').split(/\s*[,;/]\s*/).forEach(piece => {
        const clean = piece.trim();
        const low = clean.toLowerCase();
        if(clean && !seen.has(low)){
          seen.add(low);
          parts.push(clean);
        }
      });
    };
    if(baseTr) add(baseTr);
    if(aiTr) add(aiTr);
    return parts.slice(0, 5).join(', ');
  }

  fillTr = async function(p){
    splitCombinedItemsInPack(p);
    let todo = p.items.filter(x => !x.tr || !x.turengDone);
    if(!todo.length) return;
    FILL[p.id] = 1;
    try{
      for(const sz of [18, 8]){
        if(!todo.length) break;
        const ch = [];
        for(let i=0; i<todo.length; i+=sz) ch.push(todo.slice(i, i+sz));
        await turboPool(ch, async c => {
          const promptLines = c.map((x,i) => `${i+1}. ${x.en}${x.tr ? ` [Mevcut: ${x.tr}]` : ''}`).join('\n');
          const r = await askJ(TURENG_SYS, promptLines, 50000, 'quick');
          if(r && Array.isArray(r.items)){
            r.items.forEach(o => {
              const x = c[Number(o && o.i) - 1];
              if(!x) return;
              if(Array.isArray(o.split) && o.split.length > 1){
                const idx = p.items.indexOf(x);
                if(idx >= 0){
                  const replacements = o.split.filter(s => s && s.en).map(s => ({
                    en: String(s.en).trim(),
                    baseTr: x.baseTr || x.tr || '',
                    tr: combineTurengMeaning(x.baseTr || x.tr, s.tr || o.tr),
                    syn: Array.isArray(s.syn) ? s.syn : (Array.isArray(o.syn) ? o.syn : []),
                    turengDone: true,
                    d: [], gl: {}, mo: {}
                  }));
                  if(replacements.length){
                    p.items.splice(idx, 1, ...replacements);
                    return;
                  }
                }
              }
              if(validTr(o.tr, x.en)){
                x.tr = combineTurengMeaning(x.baseTr || x.tr, o.tr);
                x.turengDone = true;
              }
              if(Array.isArray(o.syn) && o.syn.length){
                x.syn = o.syn.map(s=>String(s||'').trim()).filter(Boolean);
              }
            });
          }
          if(p.items.some(x => x.tr)){
            delete FILL[p.id];
            refreshWait(p);
          }
          save(p);
        }, 4);
        todo = p.items.filter(x => !x.tr);
      }
    }finally{
      delete FILL[p.id];
    }
  };

  /* ============================================================================
     OTOMASYON 3: CÜMLE MODUNDA UZUNLUK EŞİTLEME & YÜKSEK ÇELDİRİCİ ŞIKLAR
     ============================================================================ */
  const BATCH_HARD = `Sen BUEPT düzeyinde akademik İngilizce ölçme ve değerlendirme uzmanısın. YALNIZCA geçerli JSON döndür: {"items":[...]}.
Girdideki her satır "en - tr" biçimindedir. Her kelime için:
- "en": girdideki kelimenin aynısı
- "tr": mevcut Türkçe anlamları koruyarak Tureng yaygın karşılıklarıyla zenginleştirilmiş Türkçe anlam (3-4 yaygın karşılık, virgülle ayrılmış)
- "syn": kelimenin en yaygın 3-4 akademik İngilizce eş anlamlısı (synonyms) dizisi, örn. ["presume","postulate","hypothesize"]
- "s": kelimeyi içeren akademik C1 düzeyinde 15-22 kelimelik tek İngilizce cümle
- "st": cümlenin doğal, eksiksiz akademik Türkçe çevirisi
- "d": cümlenin anlamı için YÜKSEK ÇELDİRİCİLİKTE 3 yanlış Türkçe çeviri dizisi.
  ÇELDİRİCİ KURALLARI ("d" için ZORUNLU):
  1. UZUNLUK KURALI: Doğru cevap ("st") KESİNLİKLE en uzun şık olmamalıdır! "d" içindeki 3 şıkkın kelime ve karakter uzunluğu "st" ile birebir aynı düzeyde olmalı, hatta en az 2 çeldirici şık "st" cümlesinden 2-5 kelime DAHA UZUN olmalıdır.
  2. İNCE AYRIM KURALI: Şıklar birbirinin basit tam tersi (olumlu/olumsuz zıttı) OLMAMALIDIR. Her çeldirici cümlenin %75-85'ini doğru çeviriyle aynı tutup sadece TEK BİR KRİTİK NOKTADA ayrılmalıdır:
     - 1. çeldirici: Cümlenin geri kalanı doğru, fakat hedef kelimenin/eylemin anlamı bağlama yakın görünen farklı bir akademik kavramla değiştirilmiş.
     - 2. çeldirici: Kelimeler doğru, fakat neden-sonuç, koşul veya karşıtlık ilişkisi (ör. "-mesine rağmen" yerine "-diği için", "ancak ... olduğunda" yerine "her koşulda") ince biçimde kaydırılmış.
     - 3. çeldirici: Cümledeki kapsam, olasılık veya miktar vurgusu (ör. "kısmen/potansiyel olarak" yerine "tamamen/kaçınılmaz biçimde" veya özne-nesne vurgusu) saptırılmış.
- "gl": cümledeki önemli kelimelerin en fazla 10 tanesi için {"kelime":"Türkçe anlam"} (küçük harf)
- "mo": ek-kök ayrımı öğretici en fazla 3 kelime için {"kelime":[["parça","kök" veya "ek","kısa Türkçe açıklama"]]}.`;

  const DIST_UPGRADE_SYS = `Sen BUEPT/YDS düzeyinde akademik İngilizce-Türkçe soru yazarısın.
Girdide numaralandırılmış İngilizce cümleler ("s") ve doğru Türkçe çevirileri ("st") verilmiştir.
Her cümle için 3 adet YÜKSEK ÇELDİRİCİLİKLİ yanlış Türkçe çeviri ("d") üret:
1. KESİN UZUNLUK KURALI: Doğru çeviri ("st") en uzun şık OLMAMALIDIR! Ürettiğin 3 çeldiricinin en az 2 tanesi karakter ve kelime sayısı olarak "st" cümlesinden DAHA UZUN (2-5 kelime daha uzun), diğeri ise "st" ile aynı uzunlukta olmalıdır.
2. İNCE NÜANS KURALI: Çeldiriciler "st" cümlesinin tam zıttı olmamalıdır! Cümlenin %80'i "st" ile aynı kelimelerden oluşmalı, sadece bağlaç yönü (rağmen/dolayı), kesinlik derecesi (tamamen/kısmen/potansiyel olarak) veya hedef kelimenin akademik nüansı farklılaşmalıdır.
YALNIZCA geçerli JSON döndür: {"items":[{"i":1,"d":["çeldirici 1","çeldirici 2","çeldirici 3"]}]}`;

  function buildSubtleDistractors(x){
    const st = String(x.st || '').trim();
    if(!st) return [];
    let rawD = Array.isArray(x.d) ? x.d.map(s=>String(s||'').trim()).filter(s=>s && s!==st) : [];

    const nuanceVariants = [];
    const swaps = [
      [/(\b)rağmen(\b)/i, 'nedeniyle ve bunun doğrudan bir sonucu olarak'],
      [/(\b)için(\b)/i, 'rağmen ilgili süreçte beklenen düzeyde'],
      [/(\b)önemli(\b)/i, 'ikincil ve sınırlı düzeyde kalan'],
      [/(\b)büyük(\b)/i, 'kısmi ve yalnızca belirli koşullarda görülen'],
      [/(\b)art\w+/i, 'belirli dönemlerde kademeli olarak azalmakta ve sınırlandırılmaktadır'],
      [/(\b)azal\w+/i, 'kontrolsüz biçimde artış göstererek mevcut dengeleri zorlamaktadır'],
      [/(\b)engel\w+/i, 'dolaylı yoldan teşvik ederek sürecin hızlanmasına zemin hazırladı'],
      [/(\b)sağla\w+/i, 'ancak uzun vadede beklenen etkiyi yaratmakta yetersiz kaldı'],
      [/(\b)göster\w+/i, 'konusunda kesin bir kanıt sunmaktan ziyade tartışmalı bir varsayım öne sürmektedir'],
      [/(\b)olabilir/i, 'kaçınılmaz ve geri döndürülemez bir zorunluluk haline gelmiştir']
    ];
    for(const [rgx, rep] of swaps){
      if(rgx.test(st)){
        const v = st.replace(rgx, rep);
        if(v !== st) nuanceVariants.push(v);
      }
    }

    const academicExtensions = [
      ' ve bu durum ilgili alandaki mevcut uygulamaların kapsamını doğrudan etkilemektedir',
      '; ancak bu sürecin uzun vadeli sonuçları uzmanlar arasında hâlâ tartışılmaktadır',
      ' ve özellikle kurumsal düzeyde alınan kararların yeniden değerlendirilmesini gerektirmektedir',
      '; üstelik bu eğilim son dönemdeki akademik araştırmaların bulgularıyla da paralellik göstermektedir',
      ' ve söz konusu koşulların değişmesi halinde mevcut dengelerin tamamen farklılaşabileceği belirtilmektedir'
    ];

    const expandToMatchLength = (str, idx, minLen) => {
      let res = str.replace(/[.!?]+$/, '').trim();
      const stComma = st.indexOf(',');
      if(res.length < st.length * 0.72 && stComma > 15 && !res.startsWith(st.slice(0, 12))){
        res = st.slice(0, stComma + 1) + ' ' + res.charAt(0).toLowerCase() + res.slice(1);
      }
      let extIdx = (idx + st.length) % academicExtensions.length;
      while(res.length < minLen){
        res += academicExtensions[extIdx % academicExtensions.length];
        extIdx++;
      }
      return res + '.';
    };

    const pool = [...rawD, ...nuanceVariants].filter((v,i,a) => v && v !== st && a.indexOf(v) === i);
    while(pool.length < 3){
      const base = st.replace(/[.!?]+$/, '');
      if(pool.length === 0) pool.push(base + '; ancak bu durum yalnızca belirli istisnai koşullar altında geçerliliğini korumaktadır.');
      else if(pool.length === 1) pool.push('İlk bakışta öyle görünse de, ' + base.charAt(0).toLowerCase() + base.slice(1) + ' iddiası henüz kesinlik kazanmamıştır.');
      else pool.push(base + ' ve bu gelişme başlangıçta öngörülen hedeflerin tam aksine bir tablo ortaya çıkarmıştır.');
    }

    const chosen = pool.slice(0, 3);
    return chosen.map((dStr, idx) => {
      const targetLen = idx < 2 ? (st.length + 6 + idx * 8) : Math.max(dStr.length, st.length - 4);
      if(dStr.length < targetLen){
        return expandToMatchLength(dStr, idx, targetLen);
      }
      return dStr;
    });
  }

  let DIST_RUN = {};

    const need = (p.items || []).filter(x => x.s && x.st && (!x.dV2 || !Array.isArray(x.d) || x.d.length < 3 || Math.max(0, ...x.d.map(s=>String(s||'').length)) <= x.st.length));
    if(!need.length) return;
    DIST_RUN[p.id] = 1;
    try{
      const ch = [];
      for(let i=0; i<need.length; i+=8) ch.push(need.slice(i, i+8));
      await turboPool(ch, async c => {

        const r = await askJ(DIST_UPGRADE_SYS, inp, 75000, 'quick');

          r.items.forEach(o => {

  }

  enrich = async function(p){
    if(!p || RUN[p.id]) return;
    splitCombinedItemsInPack(p);
    const upd = (t,bad,why) => { ENR[p.id]={t,bad,why:why||''}; if(cur===p) renderEnr(); };

    RUN[p.id]=1; p.dict=p.dict||{};
    p.items.forEach(x=>{ if(x.tr && !validTr(x.tr,x.en)) x.tr=''; });
    const tick = () => {

              if(it){

                merge(it, g);
                if(g.tr && validTr(g.tr, it.en)) it.tr = combineTurengMeaning(prevTr, g.tr);
                if(Array.isArray(g.syn) && g.syn.length) it.syn = g.syn.map(s=>String(s||'').trim()).filter(Boolean);
                it.dV2 = true;

      }
      await Promise.all([
        upgradePackDistractors(p),

      await shareDef(p);
      const G=p.groups||[], inT=new Set(G.filter(g=>g.text).flatMap(g=>g.w));
      const noTr=p.items.filter(x=>!x.tr).length, noS=p.items.filter(x=>x.tr&&!x.s).length, noG=p.items.filter(x=>x.tr&&!inT.has(x.en)).length;
      const parts=[];
      if(noTr) parts.push(`${noTr} kelimenin anlamı yok`);
      if(noS) parts.push(`${noS} kelimenin cümlesi yok`);
      if(noG) parts.push(`${noG} kelime paragrafa girmedi`);
      upd(parts.length?`Eksikler: ${parts.join(' · ')}${LASTERR?' · Neden: '+LASTERR:''}`:'', parts.length>0, LASTERR);
      refreshWait(p);
      if(cur===p && step===-1) renderHome();
    }catch(e){ upd('Hata: '+e.message,true,'hata'); }
    finally{ delete RUN[p.id]; }
  };

  /* ============================================================================
     OTOMASYON 3B: SEÇ, YAZ, CÜMLE MODLARINDA LİSTEDEKİ TÜM KELİMELERİ KULLANMA,
     YAZMA MODUNDA YAKIN KELİMELERE 2. HAK ("ÇOK YAKLAŞTIN!") &
     KARIŞIK MEGA BOSS DÜELLOSU (SEÇ + CÜMLE + HIZLI EŞLEŞTİR + YAZMA)
     ============================================================================ */
  let Q_DECK = [];
  let Y_DECK = [];
  let BOSS_QUEUE = [];

  /* Damerau-Levenshtein Yakınlık Mesafesi (Harf hatası, eksik/fazla harf ve yer değiştirme algılar) */
  function editDistance(a, b){
    a = String(a||'').toLowerCase().trim();
    b = String(b||'').toLowerCase().trim();
    const al = a.length, bl = b.length;
    if(!al) return bl;
    if(!bl) return al;
    const dp = Array.from({length: al + 1}, () => Array(bl + 1).fill(0));
    for(let i=0; i<=al; i++) dp[i][0] = i;
    for(let j=0; j<=bl; j++) dp[0][j] = j;
    for(let i=1; i<=al; i++){
      for(let j=1; j<=bl; j++){
        const cost = a[i-1] === b[j-1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i-1][j] + 1,
          dp[i][j-1] + 1,
          dp[i-1][j-1] + cost
        );
        if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
          dp[i][j] = Math.min(dp[i][j], dp[i-2][j-2] + cost);
        }
      }
    }
    return dp[al][bl];
  }

  function isCloseWordMatch(typed, targetWord){
    const v = String(typed||'').toLowerCase().trim();
    const variants = String(targetWord||'').split(/\s*[\/~]\s*/).map(s=>s.trim().toLowerCase()).filter(Boolean);
    for(const t of variants){
      if(v === t) return false;
      const dist = editDistance(v, t);
      const maxAllowed = t.length <= 4 ? 1 : (t.length <= 8 ? 2 : 3);
      if(dist >= 1 && dist <= maxAllowed) return { target: t, dist };
      /* İlk 3 harfi aynı ve uzunluk farkı en fazla 2 ise */
      if(t.length >= 5 && v.length >= 3 && t.slice(0,3) === v.slice(0,3) && Math.abs(t.length - v.length) <= 2){
        return { target: t, dist };
      }
    }
    return null;
  }

  function buildWordQuizQuestion(x, xs, customSubType){
    const dirEn = customSubType === 'pair' ? false : (Math.random() < .5);
    const key = o => dirEn ? o.tr : o.en;
    const ans = key(x);
    const xMeanings = new Set(String(x.tr||'').toLowerCase().split(/\s*[,;/]\s*/).filter(Boolean));
    const distPool = shuf(xs.filter(o => {
      if(o === x || key(o) === ans) return false;
      const oMeanings = String(o.tr||'').toLowerCase().split(/\s*[,;/]\s*/).filter(Boolean);
      return !oMeanings.some(m => xMeanings.has(m));
    })).slice(0, 3).map(key);
    return { k:'w', sub: customSubType || 'sec', dirEn, q:dirEn ? x.en : x.tr, ans, opts:shuf([ans, ...distPool]), x };
  }

  function buildSentQuizQuestion(x){
    upgradePackDistractors(cur);
    const d = buildSubtleDistractors(x);
    return { k:'s', sub:'cum', q:x.s, ans:x.st, opts:shuf([x.st, ...d]), x };
  }

  mkQ = function(sentOnly){
    const xs = cur.items.filter(x=>x.tr);
    if(sentOnly){
      const cs = xs.filter(x=>x.s && x.st);
      if(!cs.length) return null;
      const targetX = (Q_DECK && Q_DECK[qi]) ? Q_DECK[qi] : rnd(cs);
      return buildSentQuizQuestion(targetX);
    }
    const targetX = (Q_DECK && Q_DECK[qi]) ? Q_DECK[qi] : rnd(xs);
    return buildWordQuizQuestion(targetX, xs, 'sec');
  };

  qTotal = function(){
    if(!cur || !Array.isArray(cur.items)) return 10;
    const xs = cur.items.filter(x => x.tr);
    if(qmode === 'boss') return Math.min(12, Math.max(1, xs.length));
    if(qmode === 'cum'){
      const cs = xs.filter(x => x.s && x.st);
      return Math.max(1, cs.length);
    }
    if(qmode === 'sec'){
      return Math.max(1, xs.length);
    }
    return Math.max(1, xs.length);
  };

  qstart = function(m){
    qmode = m; qi = 0; qok = 0;
    lives = m === 'boss' ? 3 : 9999;
    const xs = cur ? cur.items.filter(x => x.tr) : [];
    if(m === 'sec'){
      Q_DECK = shuf([...xs]);
    } else if(m === 'cum'){
      const cs = xs.filter(x => x.s && x.st);
      Q_DECK = shuf([...cs]);
    } else if(m === 'boss'){
      /* BOSS RİNGİ: Önceki tüm etkinliklerin (Seç + Eşleştir + Cümle + Yazma) 12 soruluk karma düellosu! */
      const bossCount = Math.min(12, Math.max(1, xs.length));
      const pickedWords = shuf([...xs]).slice(0, bossCount);
      const sentCapable = xs.filter(x => x.s && x.st);
      const writeCapable = xs.filter(x => x.tr && !x.en.includes('X'));
      const cycle = ['sec', 'pair', 'yaz', 'cum'];
      BOSS_QUEUE = pickedWords.map((w, idx) => {
        let t = cycle[idx % cycle.length];
        if(t === 'cum' && (!w.s || !w.st)){
          if(sentCapable.length) w = sentCapable[idx % sentCapable.length];
          else t = 'sec';
        }
        if(t === 'yaz' && w.en.includes('X')){
          if(writeCapable.length) w = writeCapable[idx % writeCapable.length];
          else t = 'pair';
        }
        if(t === 'cum') return buildSentQuizQuestion(w);
        if(t === 'yaz') return { k:'y', sub:'yaz', x:w, tries:0, done:0 };
        if(t === 'pair') return buildWordQuizQuestion(w, xs, 'pair');
        return buildWordQuizQuestion(w, xs, 'sec');
      });
    }
    qNext();
  };

  ystart = function(){
    qmode = 'yaz'; qi = 0; qok = 0; lives = 9999;
    const xs = cur ? cur.items.filter(x => x.tr && !x.en.includes('X')) : [];
    Y_DECK = shuf([...xs]);
    ynext();
  };

  ynext = function(){
    const total = Y_DECK.length || (cur ? cur.items.filter(x => x.tr && !x.en.includes('X')).length : 0);
    if(qi >= total) return qEnd(true);
    if(!cur.items.some(x=>x.tr) || FILL[cur.id]){ $('#st').innerHTML = waitBox(); return; }
    if(!total){
      $('#st').innerHTML = '<div class="qbox actempty"><p class="m">Bu listede yazma alıştırması için uygun kelime yok.</p></div>';
      return;
    }
    const targetWord = Y_DECK[qi] || rnd(cur.items.filter(x => x.tr && !x.en.includes('X')));
    Q = { k:'y', x: targetWord, done: 0, tries: 0 };
    setProg((qi / total) * 100);
    $('#st').innerHTML = `

  yCheck = function(){
    if(!Q) return;
    if(Q.done){
      qi++;
      if(qmode === 'boss') qNext(); else ynext();
      return;
    }
    const inp = $('#ans'); if(!inp) return;
    const v = inp.value.trim().toLowerCase().replace(/[.,!?']/g,'').replace(/^to /,'');
    if(!v) return;

    const targetVariants = Q.x.en.split(/\s*[\/~]\s*/).map(a=>a.trim().toLowerCase());
    const ok = targetVariants.includes(v);

    if(!ok){
      /* 1) Aynı listedeki eş anlamlı kelime yazıldıysa hak yemeden ipucu ver */
      const qMeanings = new Set(String(Q.x.tr||'').toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(Boolean));
      const synMatch = cur.items.find(other => {
        if(other === Q.x) return false;
        const otherEn = other.en.toLowerCase().trim();
        if(otherEn !== v) return false;
        const otherMeanings = String(other.tr||'').toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(Boolean);
        return otherMeanings.some(m => qMeanings.has(m));
      });
      if(synMatch){
        const hintWord = Q.x.en.trim();
        SFX.ok();
        $('#fb').innerHTML = `<div class="close-box">💡 <b>"${esc(v)}"</b> kelimesi de bu anlama gelir; harika! Ama bu soruda listedeki <b>diğer eş anlamlı kelimeyi</b> bulmalısın.<br>İpucu: <b>${esc(hintWord.slice(0,2))}…</b> (${hintWord.length} harfli)</div>`;
        inp.value = '';
        inp.focus();
        return;
      }

      /* 2) Gerçek kelimeye çok yakın yazıldıysa 2. bir hak tanı! */
      const closeInfo = isCloseWordMatch(v, Q.x.en);
      if(closeInfo && (Q.tries || 0) < 1){
        Q.tries = (Q.tries || 0) + 1;
        const hintWord = closeInfo.target;
        const revealCount = Math.min(2, Math.max(1, Math.floor(hintWord.length / 3)));
        const masked = hintWord.slice(0, revealCount) + '•'.repeat(Math.max(1, hintWord.length - revealCount - 1)) + (hintWord.length > 3 ? hintWord.slice(-1) : '');
        SFX.ok();
        $('#fb').innerHTML = `
          <div class="close-box">
            🔥 <b>Çok yaklaştın!</b> <i>"${esc(v)}"</i> yazdın — ufak bir harf farkı var.<br>

          </div>`;
        inp.focus();
        try{ inp.select(); }catch(e){}
        return;
      }
    }

    Q.done = 1;
    META.tot = (META.tot||0) + 1;
    if(ok){
      META.ok = (META.ok||0) + 1; qok++; xp(10); SFX.ok();
      setCombo(COMBO + 1);

      if(qmode === 'boss') lives--;

    $('#fb').innerHTML = (ok

      : `<span class="bad2">❌ Doğru cevap: <b>${esc(Q.x.en)}</b></span>`) +

  importFile = async function(f){
    if(!f) return;
    const out = $('#pfs');
    if(out) out.textContent = 'Okunuyor ve birleşik kelimeler ayrıştırılıyor…';
    try{
      const ext = f.name.split('.').pop().toLowerCase();
      let txt = '';
      if(ext === 'pdf'){
        await lib(PDFJS, 'pdfjsLib');
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW;
        const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
        for(let n=1; n<=pdf.numPages; n++){
          const c = await (await pdf.getPage(n)).getTextContent();
          let line = '', lx = null;
          for(const it of c.items){
            if(it.str){
              if(lx !== null && it.transform[4] - lx > 20) line += '\t';
              line += it.str;
              lx = it.transform[4] + (it.width || 0);
            }
            if(it.hasEOL){ txt += line + '\n'; line = ''; lx = null; }
          }
          txt += line + '\n';
        }
      } else if(ext === 'docx'){
        await lib(MAMMOTH, 'mammoth');
        const {value} = await mammoth.convertToHtml({arrayBuffer: await f.arrayBuffer()});
        txt = [...new DOMParser().parseFromString(value, 'text/html').querySelectorAll('p,tr')]
          .filter(el => el.tagName === 'TR' || !el.closest('table'))
          .map(el => el.tagName === 'TR' ? [...el.children].map(c => c.textContent.trim()).join('\t') : el.textContent)
          .join('\n');
      } else {
        txt = await f.text();
      }
      const separated = smartParse(txt);
      const ta = $('#pw');
      if(ta && separated.length){
        const formatted = separated.map(w => w.tr ? `${w.en} - ${w.tr}` : w.en).join('\n');
        ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + formatted;
      }
      if(out){
        out.textContent = separated.length
          ? `✅ ${separated.length} ayrı İngilizce kelime ayrıştırıldı (birleşik kelimeler ayrıldı). Oluşturduğunda Tureng yaygın anlamları eklenecek!`
          : 'Dosyada kelime bulunamadı (taranmış PDF olabilir)';
      }
    }catch(e){
      if(out) out.textContent = 'Dosya okunamadı: ' + e.message;
    }
  };

  function isUntouchedDefaultPack(p){
    if(!p || p.id !== 'def') return false;

    const optedIn = localStorage.getItem('ka_keep_buept_def') === '1';
    return !optedIn && xpVal === 0 && !anyStep && !anyBoxMoved;
  }

  function cleanUnwantedDefaultPack(){
    if(!Array.isArray(packs)) return;
    const defPack = packs.find(p => p && p.id === 'def');
    if(defPack && isUntouchedDefaultPack(defPack)){
      packs = packs.filter(p => p && p.id !== 'def');
      try{

        localStorage.removeItem('db:data/users/' + uid + '/def');
      }catch(e){}

    const savedActiveId = localStorage.getItem('ka_active_pack_id');
    if(packs.length > 0){
      const preferred = (savedActiveId && packs.find(p => p.id === savedActiveId)) || packs[packs.length - 1] || packs[0];
      cur = preferred;

  function polarToCartesian(cx, cy, r, angleDeg){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
  }
  function describeArc(cx, cy, r, startAngle, endAngle){
    const start = polarToCartesian(cx, cy, r, endAngle);
    const end = polarToCartesian(cx, cy, r, startAngle);
    const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
    return ["M", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y].join(" ");
  }
  function build7ArcsSVG(cx, cy, r, stepsArr, newlyIdx, strokeW){
    const total = 7, stepAngle = 360 / total, gap = 9;
    let html = '';
    for(let i=0;i<total;i++){
      const a1 = i * stepAngle + gap/2;
      const a2 = (i+1) * stepAngle - gap/2;
      const d = describeArc(cx, cy, r, a1, a2);
      let cls = 'ring-seg idle';
      if(i === newlyIdx) cls = 'ring-seg newly-conquered';
      else if(stepsArr[i]) cls = 'ring-seg done';
      html += `<path class="${cls}" style="stroke-width:${strokeW}px" d="${d}"/>`;
    }
    return html;
  }

    if(doneCount >= 3 || xpVal >= 180) return '⚔️ Kelime Gladyatörü';
    if(doneCount >= 1 || xpVal >= 60) return '🛡️ Arena Muhafızı';
    return '🌱 Çaylak Savaşçı';

  const SYN_AI_SYS = `Sen akademik İngilizce (BUEPT/IELTS) kelime uzmanısın. Verilen İngilizce kelimenin en yakın 3-4 akademik İngilizce eş anlamlısını (synonyms) döndür. YALNIZCA geçerli JSON döndür: {"syn":["synonym1","synonym2","synonym3"]}`;
  const SYN_PENDING = {};

  function getSynonymsForWord(p, x){
    if(!x || !x.en) return [];
    const k = x.en.toLowerCase().trim();
    const list = [];
    const seen = new Set([k]);
    const add = (w, inPack) => {
      const clean = String(w||'').trim();
      const low = clean.toLowerCase();
      if(!clean || seen.has(low)) return;
      seen.add(low);
      list.push({ en: clean, inPack: !!inPack });
    };

    /* 1. Aynı listede Türkçe anlamı örtüşen diğer İngilizce eş anlamlıları bul */
    if(p && Array.isArray(p.items) && x.tr){
      const xTrSet = new Set(String(x.baseTr || x.tr).toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(s=>s.length>2));
      p.items.forEach(other => {
        if(!other || other === x) return;
        const oTrs = String(other.baseTr || other.tr || '').toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(s=>s.length>2);
        if(oTrs.some(m => xTrSet.has(m))){
          add(other.en, true);
        }
      });
    }

    /* 2. Kelime nesnesinde kayıtlı AI syn dizisi varsa ekle */
    if(Array.isArray(x.syn)){
      x.syn.forEach(s => {
        const inP = p && findWordInPack(p, s);
        add(s, !!inP);
      });
    }

    /* 3. Yerleşik Akademik Eş Anlamlılar Sözlüğünden ekle */
    if(ACADEMIC_SYNS[k]){
      ACADEMIC_SYNS[k].forEach(s => {
        const inP = p && findWordInPack(p, s);
        add(s, !!inP);
      });
    }

    return list.slice(0, 5);
  }

  async function ensureCardSynonyms(p, x){
    if(!p || !x || !x.en || !SMP) return;
    const curSyns = getSynonymsForWord(p, x);
    if(curSyns.length >= 2 || SYN_PENDING[x.en]) return;
    SYN_PENDING[x.en] = 1;
    try{
      const r = await askJ(SYN_AI_SYS, `${x.en} (${x.tr || ''})`, 30000, 'quick');
      if(r && Array.isArray(r.syn) && r.syn.length){
        x.syn = r.syn.map(s=>String(s||'').trim()).filter(Boolean);
        save(p);
        const box = document.getElementById('cardSynBox');
        if(box && step === 0 && deck[di] === x){
          box.outerHTML = renderCardSynonymsHtml(p, x);
        }
      }
    }catch(e){}
    finally{ delete SYN_PENDING[x.en]; }
  }

  function renderCardSynonymsHtml(p, x){
    const syns = getSynonymsForWord(p, x);
    if(!syns.length){
      if(SMP) ensureCardSynonyms(p, x);
      return `<div class="syn-box" id="cardSynBox"><span class="syn-lbl">🔗 Synonyms:</span><span class="m" style="font-size:12px">${SMP ? 'Eş anlamlılar hazırlanıyor…' : '—'}</span></div>`;

    return `
      <div class="syn-box" id="cardSynBox">
        <span class="syn-lbl">🔗 Synonyms (Eş Anlamlılar):</span>
        ${syns.map(s => `<span class="syn-chip tk ${s.inPack?'in-pack':''}" data-w="${esc(s.en)}" title="Tıkla: Telaffuzu dinle, anlamını gör veya listeye ekle">🔊 ${esc(s.en)}${s.inPack ? ' <i>★ Listede</i>' : ''}</span>`).join('')}

  let KART_TOTAL = 0;
  startKart = function(){
    const pool = cur.items.filter(x => x.tr);

      cur.prog.box[x.en] = Math.min(5, bx(x) + 1);
      delete x._retry;
      META.kart = (META.kart || 0) + 1;
      xp(5);

      cur.prog.box[x.en] = 1;
      x._retry = (x._retry || 0) + 1;
      deck.push(x);

  function findWordInPack(p, wordStr){
    if(!p || !Array.isArray(p.items)) return null;
    const k = String(wordStr||'').toLowerCase().trim();
    if(!k) return null;
    return p.items.find(x =>
      x.en.toLowerCase().trim() === k ||
      x.en.toLowerCase().split(/\s*[\/~]\s*/).map(s=>s.trim()).includes(k)
    ) || null;
  }

  async function enrichSingleAddedWord(p, item){
    if(!p || !item || !SMP) return;
    try{
      if(!item.turengDone){
        const rTr = await askJ(TURENG_SYS, `1. ${item.en}${item.tr ? ` [Mevcut: ${item.tr}]` : ''}`, 45000, 'quick');
        if(rTr && Array.isArray(rTr.items) && rTr.items[0]){
          const o = rTr.items[0];
          if(validTr(o.tr, item.en)){
            item.tr = combineTurengMeaning(item.baseTr || item.tr, o.tr);
            item.turengDone = true;
          }
        }
      }
      if(item.tr && !item.s){
        const rB = await askJ(BATCH_HARD, `${item.en} - ${item.tr}`, 60000, 'quick');
        if(rB && Array.isArray(rB.items) && rB.items[0]){
          const g = rB.items[0];
          merge(item, g);
          if(Array.isArray(g.syn) && g.syn.length) item.syn = g.syn.map(s=>String(s||'').trim()).filter(Boolean);
          item.d = buildSubtleDistractors(item);
          item.dV2 = true;
        }
      }
      save(p);
      renderFoot();
      document.querySelectorAll(`[data-added-status="${CSS && CSS.escape ? CSS.escape(item.en.toLowerCase()) : item.en.toLowerCase()}"]`).forEach(el => {
        el.innerHTML = `✅ <b>"${esc(item.en)}"</b> Listede (Kutu 1 · Tureng & Cümlesi Hazır!)`;
      });
    }catch(e){}
  }

  function addUnknownWordToPack(wordEn, initialTr, btnEl){
    if(!cur) return;
    const cleanEn = String(wordEn||'').trim().toLowerCase();
    if(!cleanEn) return;
    const existing = findWordInPack(cur, cleanEn);
    if(existing){
      if(btnEl) btnEl.outerHTML = `<span class="added-word-badge">✓ Zaten Listede (Kutu ${bx(existing)})</span>`;
      return;
    }
    const cleanTr = String(initialTr||'').trim();
    const newItem = {
      en: cleanEn,
      tr: cleanTr,
      baseTr: cleanTr,
      turengDone: false,
      s: '',
      st: '',
      d: [],
      gl: {},
      mo: {}
    };
    cur.items.push(newItem);
    if(Array.isArray(cur.words)) cur.words.push({ en: cleanEn, tr: cleanTr });
    cur.prog = cur.prog || { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 };
    cur.prog.box = cur.prog.box || {};
    cur.prog.box[cleanEn] = 1;
    if(step === 0 && Array.isArray(deck) && !deck.some(d => d.en.toLowerCase() === cleanEn)){
      deck.push(newItem);
      if(KART_TOTAL) KART_TOTAL++;
    }
    save(cur);
    SFX.ok();
    renderFoot();
    if(step === -1) renderHome();
    if(btnEl){
      btnEl.outerHTML = `<span class="added-word-badge" data-added-status="${esc(cleanEn)}">✅ <b>"${esc(cleanEn)}"</b> Listeye Eklendi! (Kutu 1${SMP ? ' · Detayları Hazırlanıyor…' : ''})</span>`;
    }
    if(SMP) enrichSingleAddedWord(cur, newItem);
  }

  tap = async function(w, el){
    document.querySelectorAll('.tk.sel').forEach(x => x.classList.remove('sel'));
    if(el) el.classList.add('sel');
    const cleanW = String(w||'').trim();
    const k = cleanW.toLowerCase();
    const mo = SRC && SRC.mo ? aMo(SRC.mo[k]) : [];
    const my = ++TAPN, q = encodeURIComponent(k), ctx = tipCtx();
    say(cleanW);

    const inlineTip = el && el.closest ? (el.closest('.sent-card-ex-wrap') && el.closest('.sent-card-ex-wrap').querySelector('.sent-inline-tip')) : null;
    const writeTip = html => {
      if(inlineTip){
        inlineTip.hidden = false;
        inlineTip.innerHTML = html;
      } else {
        let tEl = $('#tip');
        if(!tEl && el && el.closest){
          const exBox = el.closest('.ex,.para');
          if(exBox){
            exBox.insertAdjacentHTML('afterend', '<div class="tip" id="tip" style="margin-top:10px"></div>');
            tEl = $('#tip');
          }
        }
        setTip(html);
      }
    };

    const show = (g, note) => {
      const addBtnHtml = renderAddWordActionHtml(cleanW, g);
      writeTip(
        `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">` +
          `<div><b>${esc(cleanW)}</b> — ${g ? `<span class="good" style="font-weight:800">${esc(g)}</span>` : `<span class="m">${esc(note||'')}</span>`} ${addBtnHtml}</div>` +
          `<div><a class="m" href="https://dictionary.cambridge.org/dictionary/english-turkish/${q}" target="_blank" rel="noopener">Cambridge ↗</a> <a class="m" href="https://tureng.com/en/turkish-english/${q}" target="_blank" rel="noopener">Tureng ↗</a></div>` +
        `</div>` +
        (mo.length ? `<div style="margin-top:6px">${mo.map(([p,t,d])=>`<span class="chip">${esc(p)} · ${esc(t)}: ${esc(d)}</span>`).join('')}</div>` : '')
      );
    };

    const g = meaningOf(k);
    if(g) return show(g);
    show('', 'anlam aranıyor…');
    const r = await askJ(GLOSS, k, 60000, 'quick');
    const v = r ? (typeof r[k] === 'string' ? r[k].trim() : String(Object.values(r).find(x => typeof x === 'string') || '').trim()) : '';
    if(v && cur){ cur.dict = cur.dict || {}; cur.dict[k] = v; save(cur); }
    if(my === TAPN && (inlineTip || tipCtx() === ctx)) show(v, 'anlam bulunamadı (yine de listeye ekleyebilirsin)');

  function syncNewsAddedWordsToPack(p){
    try{
      const q = JSON.parse(localStorage.getItem('ka_news_added_words') || '[]');
      if(!Array.isArray(q) || !q.length) return;
      if(!p){
        const newP = {
          id: 'p_haber_' + Date.now().toString(36),
          name: 'Haberlerden Eklediklerim',
          words: [],
          items: [],
          groups: [],
          dict: {},
          prog: { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 }
        };
        packs.push(newP);
        cur = newP;
        p = newP;
        try{ localStorage.setItem('ka_active_pack_id', p.id); }catch(e){}
      }
      if(!Array.isArray(p.items)) return;
      let changed = false;
      q.forEach(nw => {
        const cleanEn = String(nw && nw.en || '').trim().toLowerCase();
        if(!cleanEn) return;
        const ex = findWordInPack(p, cleanEn);
        if(!ex){
          const cleanTr = String(nw.tr || '').trim();
          const newItem = {
            en: cleanEn,
            tr: cleanTr,
            baseTr: cleanTr,
            turengDone: !!cleanTr,
            syn: Array.isArray(nw.syn) ? nw.syn : [],
            s: String(nw.s || '').trim(),
            st: String(nw.st || '').trim(),
            d: [],
            gl: {},
            mo: {}
          };
          if(newItem.st) newItem.d = buildSubtleDistractors(newItem);
          p.items.push(newItem);
          if(Array.isArray(p.words)) p.words.push({ en: cleanEn, tr: cleanTr });
          p.prog = p.prog || { box:{}, steps:[0,0,0,0,0,0,0], mdone:[], xp:0 };
          p.prog.box = p.prog.box || {};
          p.prog.box[cleanEn] = 1;
          changed = true;
          if(SMP && (!newItem.s || !newItem.st)) enrichSingleAddedWord(p, newItem);
        }
      });
      if(changed){
        save(p);
        renderFoot();
      }
    }catch(e){}
  }

  let PWA_PROMPT = null;
  function isStandaloneApp(){
    try{
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isIOSDevice(){
    const ua = navigator.userAgent || '';
    return /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function drawArenaIcon(size){
    try{
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const s = size / 64;
      const grad = g.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#14968c'); grad.addColorStop(1, '#0b5a55');
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      g.lineCap = 'round';
      g.strokeStyle = '#ffffff'; g.lineWidth = 4.8 * s;
      g.beginPath(); g.moveTo(15*s, 47.5*s); g.lineTo(15*s, 30.5*s); g.arc(32*s, 30.5*s, 17*s, Math.PI, 0); g.lineTo(49*s, 47.5*s); g.stroke();
      g.lineWidth = 3 * s;
      g.beginPath(); g.moveTo(11.8*s, 47.5*s); g.lineTo(18.2*s, 47.5*s); g.moveTo(45.8*s, 47.5*s); g.lineTo(52.2*s, 47.5*s); g.stroke();
      g.strokeStyle = '#fbbf24'; g.lineWidth = 4.2 * s;
      g.beginPath(); g.moveTo(24*s, 47.5*s); g.lineTo(24*s, 31.5*s); g.arc(32*s, 31.5*s, 8*s, Math.PI, 0); g.lineTo(40*s, 47.5*s); g.stroke();
      g.lineWidth = 2.7 * s;
      g.beginPath(); g.moveTo(9.5*s, 53.5*s); g.quadraticCurveTo(20.8*s, 49*s, 32*s, 53.8*s); g.quadraticCurveTo(43.2*s, 49*s, 54.5*s, 53.5*s); g.stroke();
      g.fillStyle = '#fbbf24';
      g.beginPath(); g.arc(50*s, 13*s, 3.9*s, 0, Math.PI*2); g.fill();
      return c.toDataURL('image/png');
    }catch(e){ return ''; }
  }
  function setupPwaMeta(){
    if(window.__kaPwaMeta) return;
    window.__kaPwaMeta = true;
    const head = document.head;
    const addMeta = (name, content) => {
      if(head.querySelector(`meta[name="${name}"]`)) return;
      const m = document.createElement('meta'); m.name = name; m.content = content; head.appendChild(m);
    };
    addMeta('apple-mobile-web-app-capable', 'yes');
    addMeta('mobile-web-app-capable', 'yes');
    addMeta('apple-mobile-web-app-status-bar-style', 'black-translucent');
    addMeta('apple-mobile-web-app-title', 'K. Arenası');
    addMeta('theme-color', '#0f766e');
    const icon180 = drawArenaIcon(180);
    const icon512 = drawArenaIcon(512);
    if(icon180 && !head.querySelector('link[rel="apple-touch-icon"]')){
      const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = icon180; head.appendChild(l);
    }
    if(!head.querySelector('link[rel="manifest"]') && icon512){
      try{
        const origin = location.origin;
        const manifest = {
          name: 'Kelime Arenası',
          short_name: 'K. Arenası',
          description: 'Kendi kelimelerinle oyunlaştırılmış akademik İngilizce çalışma arenası',
          start_url: origin + '/',
          scope: origin + '/',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#f3f8f6',
          theme_color: '#0f766e',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(blob); head.appendChild(l);
      }catch(e){}
    }
  }
  setupPwaMeta();
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA_PROMPT = e; });
  window.addEventListener('appinstalled', () => {
    PWA_PROMPT = null;

    return `

            <div class="pwa-mini-lbl">K. Arenası</div>
          </div>
          <div class="pwa-show-txt">
            <span class="pwa-show-badge">📱 MOBİL UYGULAMA MODU</span>
            <h3 style="margin:4px 0 4px">Arenayı Cebine Taşı!</h3>
            <p class="m" style="margin:0 0 10px;font-size:13px">App Store'a veya Play Store'a gerek yok. Kelime Arenası'nı telefonunun ana ekranına ekle; tarayıcı çubuğu olmadan tam ekran, gerçek bir uygulama gibi açılsın. Listelerin ve ilerlemen aynen kalır.</p>
            <button type="button" class="btn3 small" data-pwa-install="1">📲 Ana Ekrana Ekle</button>
          </div>
        </div>
      </div>`;

  function openPwaGuide(){
    const ios = isIOSDevice();
    openModalWith(`
      <section class="addp">
        <div class="addp-h"><div><div class="eyebrow">MOBİL UYGULAMA KURULUMU</div><h2>📲 Kelime Arenası'nı Telefonuna Ekle</h2></div></div>
        <p class="m" style="margin-top:6px">Kurulum yaklaşık 5 saniye sürer. Ana ekranındaki <b>K. Arenası</b> ikonuna dokunduğunda site tam ekran, uygulama gibi açılır.</p>
        <div class="pwa-steps">
          <div class="pwa-card" style="${ios ? 'border-color:var(--acc)' : ''}">
            <h4>🍎 iPhone / iPad (Safari)</h4>
            <div class="pwa-step-item">1. Siteyi <b>Safari</b> ile aç (Chrome'da iPhone'da da "Paylaş" menüsü vardır).</div>
            <div class="pwa-step-item">2. Alttaki <b>Paylaş [↑]</b> simgesine dokun.</div>
            <div class="pwa-step-item">3. Listeyi aşağı kaydır ve <b>"Ana Ekrana Ekle"</b>yi seç.</div>
            <div class="pwa-step-item">4. Sağ üstten <b>"Ekle"</b>ye bas. Bitti! ✅</div>
          </div>
          <div class="pwa-card" style="${!ios ? 'border-color:var(--acc)' : ''}">
            <h4>🤖 Android (Chrome)</h4>
            <div class="pwa-step-item">1. Sağ üstteki <b>⋮ (üç nokta)</b> menüsüne dokun.</div>
            <div class="pwa-step-item">2. <b>"Ana ekrana ekle"</b> veya <b>"Uygulamayı yükle"</b>yi seç.</div>
            <div class="pwa-step-item">3. Açılan pencerede <b>"Ekle / Yükle"</b>ye bas. Bitti! ✅</div>
          </div>
        </div>
        <p class="m" style="margin-top:12px;font-size:12.5px">💡 Bilgisayarda (Chrome/Edge) adres çubuğunun sağındaki <b>⊕ Yükle</b> simgesiyle de masaüstü uygulaması olarak kurabilirsin.</p>
      </section>`);
  }

  async function handlePwaInstall(){
    if(isStandaloneApp()){ alert('Kelime Arenası zaten uygulama olarak açık! 🎉'); return; }
    if(PWA_PROMPT){
      try{
        PWA_PROMPT.prompt();
        const choice = await PWA_PROMPT.userChoice;
        PWA_PROMPT = null;
        if(choice && choice.outcome === 'accepted'){
          try{ localStorage.setItem('ka_pwa_installed', '1'); }catch(e){}
          document.querySelectorAll('.pwa-showcase').forEach(el => el.remove());
        }
        return;
      }catch(e){}
    }
    openPwaGuide();
  }

  if(!window.__kaPwaBound){
    window.__kaPwaBound = true;
    document.addEventListener('click', e => {
      const b = e.target.closest && e.target.closest('[data-pwa-install]');
      if(b){ e.preventDefault(); handlePwaInstall(); }
    });
  }

  function applyNow(){
    if(typeof packs !== 'undefined' && Array.isArray(packs)){
      cleanUnwantedDefaultPack();
      packs.forEach(p => ensureFreshPackState(p));
    }
    syncNewsAddedWordsToPack(cur);
    if(typeof cur !== 'undefined' && cur){
      ensureFreshPackState(cur);
    }
    if(step===-1) renderHome();
    try{ document.querySelectorAll('[data-conq-demo]').forEach(el => el.remove()); }catch(e){}
  }
  applyNow();
  setTimeout(applyNow, 180);
  setTimeout(applyNow, 650);
})();
