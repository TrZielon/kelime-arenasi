  --lg:url(#lgC);--shadow:0 20px 40px -24px rgba(13,43,42,.35);--glow:rgba(20,184,166,.22);--acc-glow:rgba(245,158,11,.25);
}
body[data-pal="derin_akdeniz"],body[data-pal="sicak_espresso"]{
  --bg:#061514;--card:#0c2423;--line:#194240;--ink:#f3f8f6;--mut:#7ca39e;
  --p:#0f766e;--p2:#14b8a6;--acc:#fbbf24;--bad:#f43f5e;--soft:#11312f;--ok:#34d399;
  --lg:url(#lgC);--shadow:0 22px 44px -24px rgba(0,0,0,.8);--glow:rgba(20,184,166,.28);--acc-glow:rgba(251,191,36,.30);
}
body{
  font-family:"Plus Jakarta Sans",system-ui,sans-serif!important;
  background-image:radial-gradient(820px 380px at 14% 0%,var(--glow),transparent 70%),radial-gradient(680px 340px at 88% 8%,var(--acc-glow),transparent 70%),radial-gradient(color-mix(in srgb,var(--mut) 12%,transparent) 1px,transparent 1.4px)!important;
  background-size:100% 100%,100% 100%,24px 24px!important;background-attachment:fixed;
}
.logo svg{width:40px;height:40px;filter:drop-shadow(0 4px 10px var(--glow));transition:transform .2s}
.logo:hover svg{transform:scale(1.06) rotate(-3deg)}
.logo-sub{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--acc);border:1px solid var(--line);margin-left:2px}
@media(max-width:720px){
  .nav-in{padding:10px 12px;gap:8px}.logo{font-size:17px;gap:7px}.logo svg{width:34px;height:34px}
  .wrap{padding:14px 12px 84px!important}.hero{grid-template-columns:1fr!important;padding:20px 18px!important;border-radius:24px!important;gap:16px!important}.hero h1{font-size:24px!important}.hero-r{width:100%;justify-content:center}.modes{grid-template-columns:1fr!important}.txt,input,textarea{font-size:16px!important}
}
.pwa-card{margin-top:16px;background:radial-gradient(280px 140px at 90% 0%,var(--glow),transparent 75%),var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 6px 0 var(--line),var(--shadow);transition:transform .18s,border-color .18s}
.pwa-card:hover{transform:translateY(-2px);border-color:var(--acc)}
.pwa-left{display:flex;align-items:center;gap:14px}
.pwa-badge-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;box-shadow:0 6px 14px var(--glow);flex-shrink:0}
.pwa-btn{background:linear-gradient(135deg,var(--acc),#d97706);color:#1f1300;border:0;border-radius:14px;padding:11px 18px;font-weight:900;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 0 #b45309;white-space:nowrap}
.pwa-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b45309}
.pwa-modal-ov{position:fixed;inset:0;background:rgba(4,13,12,.75);backdrop-filter:blur(8px);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}
.pwa-modal-ov.show{display:flex}
.pwa-modal{background:var(--card);border:2px solid var(--line);border-radius:26px;max-width:440px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.6);position:relative}
.pwa-mstep{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:12px 0;align-items:flex-start;font-size:13.5px}
.pwa-mnum{width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;font-weight:900;display:grid;place-items:center;font-size:12px}
</style>

<script>
(function(){
  /* 1. 1A-SAF LOGO & SEKME FAVICON ENJEKSİYONU */
  const ARENA_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="lgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14968c"/><stop offset="100%" stop-color="#0b5a55"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lgC)"/><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sheen)"/><rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2" fill="none"/><path d="M15 47.5V30.5a17 17 0 0 1 34 0v17" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" fill="none"/><path d="M11.8 47.5H18.2M45.8 47.5H52.2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M24 47.5V31.5a8 8 0 0 1 16 0v16" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round" fill="none"/><path d="M9.5 53.5 Q20.8 49 32 53.8 Q43.2 49 54.5 53.5" stroke="url(#gold)" stroke-width="2.7" stroke-linecap="round" fill="none"/><path d="M14.5 57 Q23.2 53.8 32 57 Q40.8 53.8 49.5 57" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="50" cy="13" r="6.8" fill="#fbbf24" fill-opacity="0.25"/><circle cx="50" cy="13" r="3.7" fill="url(#gold)"/><circle cx="48.8" cy="11.8" r="1.1" fill="#ffffff" fill-opacity="0.9"/></svg>';
  const ARENA_DATA = 'data:image/svg+xml,' + encodeURIComponent(ARENA_SVG);
  try{
    document.querySelectorAll("link[rel*='icon']").forEach(l=>l.remove());
    const l1=document.createElement('link');l1.rel='icon';l1.type='image/svg+xml';l1.href=ARENA_DATA;document.head.appendChild(l1);
    const l2=document.createElement('link');l2.rel='shortcut icon';l2.type='image/svg+xml';l2.href=ARENA_DATA;document.head.appendChild(l2);
    const l3=document.createElement('link');l3.rel='apple-touch-icon';l3.href=ARENA_DATA;document.head.appendChild(l3);
    document.querySelectorAll('.logo svg').forEach(svg=>{svg.outerHTML='<div style="width:38px;height:38px;display:flex;flex-shrink:0">'+ARENA_SVG+'</div>';});
    const logoBtn=document.querySelector('.logo');
    if(logoBtn&&!logoBtn.querySelector('.logo-sub')){logoBtn.insertAdjacentHTML('beforeend','<span class="logo-sub">ARENA</span>');}
  }catch(e){}

  /* 2. SADECE 2 AKDENİZ TEMASI */
  const VALID_PALS=['akdeniz','derin_akdeniz'];
  const dotsEl=document.querySelector('.dots');
  if(dotsEl){
    dotsEl.innerHTML=`<button data-pal="akdeniz" title="🌿 Açık Akdeniz" aria-label="Açık Akdeniz" style="background:#0f766e"></button><button data-pal="derin_akdeniz" title="🌌 Koyu Akdeniz" aria-label="Koyu Akdeniz" style="background:#061514;border-color:#14b8a6"></button>`;
  }
  window.setPal=function(n){
    const target=VALID_PALS.includes(n)?n:'akdeniz';
    document.body.dataset.pal=target;
    document.querySelectorAll('.dots button').forEach(b=>b.classList.toggle('on',b.dataset.pal===target));
    try{localStorage.setItem('ka_pal',target);localStorage.setItem('ka_pal_v3',target);}catch(e){}
  };
  try{const s=localStorage.getItem('ka_pal_v3')||localStorage.getItem('ka_pal');setPal(VALID_PALS.includes(s)?s:'akdeniz');}catch(e){setPal('akdeniz');}

  /* 3. KALICI VERİ DEPOLAMA (SIFIRLANMAZ) & ÖZGÜR KELİME LİSTESİ */
  const origSave=window.save;
  window.save=function(p=cur){
    try{
      if(p&&p.id)localStorage.setItem('ka_active_pack_id',p.id);
      if(origSave)origSave(p);
      localStorage.setItem('ka_packs_backup_v4',JSON.stringify(packs));
    }catch(e){}
  };
  try{
    const b=localStorage.getItem('ka_packs_backup_v4');
    if(b){const parsed=JSON.parse(b);if(Array.isArray(parsed)&&parsed.length){packs=parsed;const lastId=localStorage.getItem('ka_active_pack_id');cur=(lastId&&packs.find(x=>x.id===lastId))||packs[0];}}
  }catch(e){}

  /* 4. YAZMA 2. HAK: "ÇOK YAKLAŞTIN!" & HARF İPUCU */
  function lev(a,b){
    const al=a.length,bl=b.length;if(!al)return bl;if(!bl)return al;
    const m=[];for(let i=0;i<=bl;i++)m[i]=[i];for(let j=0;j<=al;j++)m[0][j]=j;
    for(let i=1;i<=bl;i++){for(let j=1;j<=al;j++){m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);}}
    return m[bl][al];
  }
  function mask(w){return w.length<=3?w[0]+'••':w[0]+'•'.repeat(w.length-2)+w[w.length-1];}

  let ySecondChance=false;
  window.yCheck=function(){
    if(!Q)return;
    if(Q.done){ySecondChance=false;qi++;ynext();return;}
    const inp=document.getElementById('ans');if(!inp)return;
    const v=inp.value.trim().toLowerCase().replace(/[.,!?']/g,'').replace(/^to /,'');
    if(!v)return;
    const cor=Q.x.en.split(/\s*[\/~]\s*/).map(a=>a.trim().toLowerCase());
    if(cor.some(a=>a===v)){
      ySecondChance=false;Q.done=1;META.tot=(META.tot||0)+1;META.ok=(META.ok||0)+1;qok++;xp(10);
      if(window.SFX&&SFX.ok)SFX.ok();saveMeta();
      document.getElementById('fb').innerHTML='<span class="good" style="font-weight:800;color:var(--ok)">✅ Mükemmel Doğru!</span>';
      document.getElementById('ck').textContent='Sonraki →';inp.disabled=true;return;
    }
    const closest=cor.reduce((b,ans)=>{const d=lev(v,ans);return d<b.d?{d,ans}:b;},{d:999,ans:cor[0]});
    if(!ySecondChance&&closest.d<=2&&closest.ans.length>=4){
      ySecondChance=true;if(window.SFX&&SFX.tick)SFX.tick();
      document.getElementById('fb').innerHTML=`<div style="background:rgba(245,158,11,.15);border:1.5px solid var(--acc);border-radius:12px;padding:8px 12px;margin-top:6px"><b style="color:var(--acc)">🔥 Çok yaklaştın!</b> 2. bir şansın var.<br><span style="font-size:12.5px;color:var(--ink)">İpucu: <b>${mask(closest.ans)}</b></span></div>`;
      inp.focus();inp.select();return;
    }
    ySecondChance=false;Q.done=1;META.tot=(META.tot||0)+1;
    if(window.SFX&&SFX.bad)SFX.bad();saveMeta();
    document.getElementById('fb').innerHTML='<span class="bad2" style="font-weight:800;color:var(--bad)">❌ Doğru cevap: <b>'+esc(Q.x.en)+'</b></span>';
    document.getElementById('ck').textContent='Sonraki →';inp.disabled=true;
  };

  /* 5. TÜM ETKİNLİKLERDE BÜTÜN KELİMELER & 12 SORULUK MEGA KARMA BOSS */
  window.qstart=function(mode){
    if(!cur||!cur.items||!cur.items.length)return;
    const hasTr=cur.items.filter(x=>x.tr);if(!hasTr.length)return;
    if(mode==='boss'){
      qmode='boss';qi=0;qok=0;qlives=3;Q_DECK=[];
      const shuffled=[...hasTr].sort(()=>Math.random()-.5);
      const pool=shuffled.slice(0,Math.min(12,shuffled.length));
      const types=['sec','esle','yaz','cum'];
      pool.forEach((x,idx)=>{Q_DECK.push({x,type:types[idx%types.length],done:0});});
      renderBossHp();qNext();return;
    }
    qmode=mode;qi=0;qok=0;qlives=3;
    Q_DECK=[...hasTr].sort(()=>Math.random()-.5).map(x=>({x,type:mode,done:0}));
    qNext();
  };
  function renderBossHp(){
    const acttop=document.querySelector('.acttop');if(!acttop)return;
    let bWrap=document.getElementById('bossWrap');
    if(!bWrap){
      bWrap=document.createElement('div');bWrap.id='bossWrap';
      bWrap.style.cssText='width:100%;margin-bottom:10px;background:rgba(239,68,68,.12);border:1.5px solid var(--bad);border-radius:14px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--bad)';
      acttop.after(bWrap);
    }
    const rem=Q_DECK.length-qi;
    bWrap.innerHTML='<span>🐉 KARMA BOSS CANI:</span><div style="flex:1;height:8px;background:var(--soft);border-radius:999px;margin:0 10px;overflow:hidden"><div style="width:'+Math.round(rem/Math.max(1,Q_DECK.length)*100)+'%;height:100%;background:var(--bad)"></div></div><span>'+rem+' / '+Q_DECK.length+'</span>';
  }

  /* 6. PARAGRAF: "GENEL OLARAK NE ANLATIYOR" KISA ÖZET MOTORU & ANTİ-%0 KALKANI */
  const GRADE_SUMMARY=`Sen motive edici bir İngilizce öğretmenisin. Öğrencinin Türkçe kısa özetini değerlendir. Katı tez/ana fikir arama; metnin genel olarak ne anlattığını kendi cümleleriyle özetlemişse MUTLAKA ONAY VER ve 75-100 ver. ASLA %0 verme. Yalnızca JSON döndür: {"skor": 0-100, "yorum": "Türkçe 1-2 cümle sıcak değerlendirme."}`;

  window.pview=function(){
    const p=cur;if(!p)return;
    const G=p.groups||[];
    setProg(G.length?G.filter(x=>x.ok).length/G.length*100:0);
    if(!G.length){
      document.getElementById('st').innerHTML='<div class="qbox"><div class="eyebrow">📖 Paragraf</div><p class="m">Kelimeler paragraflara ayrılıyor…</p><button class="btn3" id="pg">Paragrafları Oluştur</button></div>';return;
    }
    GI=Math.min(Math.max(GI,0),G.length-1);
    const i=GI,g=G[i];SRC=g;
    document.getElementById('st').innerHTML=`
      <div class="coach">${mascot('',66)}<div class="bubble">Metni oku ve <b>genel olarak ne anlattığını</b> çok uzatmadan 1-2 cümleyle özetle.</div></div>
      <div class="pillsg">${G.map((x,k)=>`<button class="pill ${k===i?'on':''}" data-g="${k}">${x.ok?'✓ ':''}${k+1}. Paragraf</button>`).join('')}</div>
      <div class="qbox">
        <div class="eyebrow">📖 Paragraf ${i+1}</div>
        <div class="para">${sent(g.text||'')}</div>
        <div class="m" style="margin-top:10px">Kelimeler: ${(g.w||[]).map(w=>'<span class="chip">'+esc(w)+'</span>').join(' ')}</div>
      </div>
      <div class="qbox" style="border:1.5px solid var(--p2)">
        <div class="eyebrow" style="color:var(--acc)">✍️ Paragrafın Kısa Özeti</div>
        <p class="m" style="margin-bottom:8px">Metnin çok uzatmadan <b>genel olarak ne anlattığını</b> kendi cümlelerinle özetle. Bot genel kavrayışını değerlendirecektir.</p>
        <textarea id="ap" placeholder="Örn: Metinde genel olarak yapay zekanın sağladığı faydalardan ve olası risklerden bahsediliyor…" style="width:100%;min-height:90px;padding:12px;border-radius:14px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);font-size:15px"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn3" id="gr">📝 Özeti Değerlendir</button></div>
        <div class="fb" id="gfb" style="margin-top:10px">${g.ok?'<div class="good big" style="font-size:15px">✅ Bu paragrafın özeti onaylandı</div>':''}</div>
      </div>`;
  };

  window.grade=async function(){
    const p=cur;if(!p)return;
    const gi=GI,g=p.groups&&p.groups[gi];
    const inp=document.getElementById('ap');const t=inp?inp.value.trim():'';
    if(!t||!g||!g.text)return;
    const gfb=document.getElementById('gfb');
    if(gfb)gfb.innerHTML='<span class="m">⏳ Bot özetini ve metin kavrayışını inceliyor…</span>';
    let r=null;
    try{r=await askJ(GRADE_SUMMARY,`METİN: ${g.text}\n\nÖĞRENCİ ÖZETİ: ${t}`,45000,'quick');}catch(e){r=null;}
    let skor=r?Math.max(0,Math.min(100,Math.round(Number(r.skor)||0))):0;
    let yorum=(r&&r.yorum)?String(r.yorum).trim():'';
    if(skor<50&&t.split(/\s+/).length>=4){skor=75;yorum='Paragrafın genel hatlarını ve konusunu gayet güzel kavrayıp özetledin!';}
    const isPass=skor>=50;
    if(isPass){
      g.ok=true;p.prog.xp=(p.prog.xp||0)+15;
      if(p.groups.every(x=>x.ok))p.prog.steps[6]=1;
      save(p);renderHead();
      if(window.SFX&&SFX.win)SFX.win();
      if(gfb)gfb.innerHTML=`<div style="background:rgba(16,185,129,.12);border:1.5px solid #10b981;border-radius:14px;padding:12px"><div style="font-weight:900;color:var(--ok)">✅ %${skor} - Harika Özet! Onaylandı</div><div style="font-size:13px;color:var(--ink);margin-top:4px">${esc(yorum)}</div></div>`;
    }else{
      if(window.SFX&&SFX.bad)SFX.bad();
      if(gfb)gfb.innerHTML=`<div style="background:rgba(239,68,68,.1);border:1.5px solid var(--bad);border-radius:14px;padding:12px"><div style="font-weight:900;color:var(--bad)">⚠️ %${skor} - Biraz Daha Açabilirsin</div><div style="font-size:13px;color:var(--ink);margin-top:4px">${esc(yorum||'Metnin genel konusunu 1-2 cümleyle biraz daha netleştirebilirsin.')}</div></div>`;
    }
  };

  /* 7. SEÇENEK 4: "ARENAYI CEBİNE TAŞI" VİTRİN BUTONU & PWA MODALI */
  function injectPwa(){
    const main=document.getElementById('main');if(!main||document.getElementById('pwaCardBox'))return;
    const card=document.createElement('div');card.id='pwaCardBox';card.className='pwa-card';
    card.innerHTML=`<div class="pwa-left"><div class="pwa-badge-icon">${ARENA_SVG}</div><div><b style="font-size:15px;color:var(--ink);display:block">📲 Arenayı Cebine Taşı</b><span style="font-size:12px;color:var(--mut)">Telefona tek tıkla ekle, uygulama gibi tam ekran çalış</span></div></div><button class="pwa-btn" id="pwaAddBtn">📲 Telefona Ekle</button>`;
    const homeEl=document.getElementById('home');if(homeEl)homeEl.appendChild(card);else main.appendChild(card);
    const modal=document.createElement('div');modal.id='pwaModal';modal.className='pwa-modal-ov';
    modal.innerHTML=`<div class="pwa-modal"><button style="position:absolute;top:14px;right:14px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut)" id="pwaCloseBtn">✕</button><div style="text-align:center;margin-bottom:14px"><div style="width:64px;height:64px;margin:0 auto 10px">${ARENA_SVG}</div><h3 style="font-family:Fraunces,serif;font-size:20px;color:var(--ink)">Kelime Arenasını Telefona Ekle</h3><p style="font-size:12.5px;color:var(--mut);margin-top:4px">App Store olmadan doğrudan telefon ana ekranına ekle:</p></div><div class="pwa-mstep"><div class="pwa-mnum">1</div><div class="pwa-txt"><b>iPhone (Safari):</b> Alttaki <b>Paylaş (⎋)</b> butonuna dokun.</div></div><div class="pwa-mstep"><div class="pwa-mnum">2</div><div class="pwa-txt">Aşağı kaydırıp <b>"Ana Ekrana Ekle"</b> seçeneğini seç.</div></div><div class="pwa-mstep"><div class="pwa-mnum">3</div><div class="pwa-txt"><b>Android (Chrome):</b> Sağ üstteki (⋮) menüsünden <b>"Uygulamayı Yükle"</b> de.</div></div><button class="btn3" style="width:100%;margin-top:14px" id="pwaGotIt">Harika, Anladım! ⚔️</button></div>`;
    document.body.appendChild(modal);
    document.getElementById('pwaAddBtn').onclick=()=>modal.classList.add('show');
    document.getElementById('pwaCloseBtn').onclick=()=>modal.classList.remove('show');
    document.getElementById('pwaGotIt').onclick=()=>modal.classList.remove('show');
  }
  setTimeout(injectPwa,350);window.addEventListener('hashchange',()=>setTimeout(injectPwa,300));
})();
</script>
<!-- ===== KELİME ARENASI: ULTRA HIZLI & TÜM İSTEKLER TEK KOD (HEPSİ DAHİL) ===== -->
<style>
/* 1. SADECE 2 AKDENİZ TEMASI */
body[data-pal="akdeniz"],body[data-pal="gece"],body[data-pal="kitaplik"]{
  --bg:#f3f8f6;--card:#ffffff;--line:#d5e7e1;--ink:#0d2b2a;--mut:#56736f;
  --p:#0f766e;--p2:#14b8a6;--acc:#f59e0b;--bad:#e11d48;--soft:#e2f1ed;--ok:#059669;
  --shadow:0 12px 28px -18px rgba(13,43,42,.28);--glow:rgba(20,184,166,.18);--acc-glow:rgba(245,158,11,.2);
}
body[data-pal="derin_akdeniz"],body[data-pal="sicak_espresso"]{
  --bg:#061514;--card:#0c2423;--line:#194240;--ink:#f3f8f6;--mut:#7ca39e;
  --p:#0f766e;--p2:#14b8a6;--acc:#fbbf24;--bad:#f43f5e;--soft:#11312f;--ok:#34d399;
  --shadow:0 14px 30px -18px rgba(0,0,0,.7);--glow:rgba(20,184,166,.22);--acc-glow:rgba(251,191,36,.22);
}

/* 2. ULTRA HIZLANDIRMA (GPU DESTEKLİ, SIFIR KASMAYAN SABİT ARKA PLAN) */
body{
  background-color:var(--bg)!important;
  background-image:none!important;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Plus Jakarta Sans","DM Sans",sans-serif!important;
  text-rendering:optimizeSpeed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(800px 360px at 12% 0%,var(--glow),transparent 70%),radial-gradient(650px 320px at 88% 8%,var(--acc-glow),transparent 70%),radial-gradient(color-mix(in srgb,var(--mut) 10%,transparent) 1px,transparent 1.4px);
  background-size:100% 100%,100% 100%,24px 24px;
  transform:translateZ(0);will-change:transform;
}
.nav{backdrop-filter:blur(6px)!important;-webkit-backdrop-filter:blur(6px)!important;transform:translateZ(0)}
.card,.pwa-card,.qbox,.hero{contain:layout style;transform:translateZ(0)}

/* 3. 1A-SAF LOGO STİLLERİ & MOBİL UYUM */
.logo svg{width:38px;height:38px;transition:transform .18s;transform:translateZ(0)}
.logo:hover svg{transform:scale(1.05)}
.logo-sub{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--acc);border:1px solid var(--line);margin-left:2px}
@media(max-width:720px){
  .nav-in{padding:10px 12px;gap:8px}.logo{font-size:17px;gap:7px}.logo svg{width:34px;height:34px}
  .wrap{padding:14px 12px 84px!important}.hero{grid-template-columns:1fr!important;padding:20px 18px!important;border-radius:24px!important;gap:16px!important}.hero h1{font-size:24px!important}.hero-r{width:100%;justify-content:center}.modes{grid-template-columns:1fr!important}.txt,input,textarea{font-size:16px!important}
}

/* 4. SEÇENEK 4 MOBİL VİTRİN KARTI & MODAL */
.pwa-card{margin-top:16px;background:radial-gradient(280px 140px at 90% 0%,var(--glow),transparent 75%),var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 6px 0 var(--line),var(--shadow);transition:transform .18s,border-color .18s}
.pwa-card:hover{transform:translateY(-2px);border-color:var(--acc)}
.pwa-left{display:flex;align-items:center;gap:14px}
.pwa-badge-icon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;box-shadow:0 4px 12px var(--glow);flex-shrink:0}
.pwa-btn{background:linear-gradient(135deg,var(--acc),#d97706);color:#1f1300;border:0;border-radius:14px;padding:11px 18px;font-weight:900;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 0 #b45309;white-space:nowrap}
.pwa-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b45309}
.pwa-modal-ov{position:fixed;inset:0;background:rgba(4,13,12,.75);backdrop-filter:blur(6px);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}
.pwa-modal-ov.show{display:flex}
.pwa-modal{background:var(--card);border:2px solid var(--line);border-radius:26px;max-width:440px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.6);position:relative}
.pwa-mstep{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:12px 0;align-items:flex-start;font-size:13.5px}
.pwa-mnum{width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;font-weight:900;display:grid;place-items:center;font-size:12px}
</style>

<script>
(function(){
  /* 1. 1A-SAF LOGO & FAVICON */
  const ARENA_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="lgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14968c"/><stop offset="100%" stop-color="#0b5a55"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lgC)"/><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sheen)"/><rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2" fill="none"/><path d="M15 47.5V30.5a17 17 0 0 1 34 0v17" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" fill="none"/><path d="M11.8 47.5H18.2M45.8 47.5H52.2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M24 47.5V31.5a8 8 0 0 1 16 0v16" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round" fill="none"/><path d="M9.5 53.5 Q20.8 49 32 53.8 Q43.2 49 54.5 53.5" stroke="url(#gold)" stroke-width="2.7" stroke-linecap="round" fill="none"/><path d="M14.5 57 Q23.2 53.8 32 57 Q40.8 53.8 49.5 57" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="50" cy="13" r="6.8" fill="#fbbf24" fill-opacity="0.25"/><circle cx="50" cy="13" r="3.7" fill="url(#gold)"/><circle cx="48.8" cy="11.8" r="1.1" fill="#ffffff" fill-opacity="0.9"/></svg>';
  const ARENA_DATA = 'data:image/svg+xml,' + encodeURIComponent(ARENA_SVG);
  try{
    document.querySelectorAll("link[rel*='icon']").forEach(l=>l.remove());
    const l1=document.createElement('link');l1.rel='icon';l1.type='image/svg+xml';l1.href=ARENA_DATA;document.head.appendChild(l1);
    const l2=document.createElement('link');l2.rel='shortcut icon';l2.type='image/svg+xml';l2.href=ARENA_DATA;document.head.appendChild(l2);
    const l3=document.createElement('link');l3.rel='apple-touch-icon';l3.href=ARENA_DATA;document.head.appendChild(l3);
    document.querySelectorAll('.logo svg').forEach(svg=>{svg.outerHTML='<div style="width:38px;height:38px;display:flex;flex-shrink:0">'+ARENA_SVG+'</div>';});
    const logoBtn=document.querySelector('.logo');
    if(logoBtn&&!logoBtn.querySelector('.logo-sub')){logoBtn.insertAdjacentHTML('beforeend','<span class="logo-sub">ARENA</span>');}
  }catch(e){}

  /* 2. SADECE 2 AKDENİZ TEMASI */
  const VALID_PALS=['akdeniz','derin_akdeniz'];
  const dotsEl=document.querySelector('.dots');
  if(dotsEl){
    dotsEl.innerHTML=`<button data-pal="akdeniz" title="🌿 Açık Akdeniz" aria-label="Açık Akdeniz" style="background:#0f766e"></button><button data-pal="derin_akdeniz" title="🌌 Koyu Akdeniz" aria-label="Koyu Akdeniz" style="background:#061514;border-color:#14b8a6"></button>`;
  }
  window.setPal=function(n){
    const target=VALID_PALS.includes(n)?n:'akdeniz';
    document.body.dataset.pal=target;
    document.querySelectorAll('.dots button').forEach(b=>b.classList.toggle('on',b.dataset.pal===target));
    try{localStorage.setItem('ka_pal',target);localStorage.setItem('ka_pal_v3',target);}catch(e){}
  };
  try{const s=localStorage.getItem('ka_pal_v3')||localStorage.getItem('ka_pal');setPal(VALID_PALS.includes(s)?s:'akdeniz');}catch(e){setPal('akdeniz');}

  /* 3. KALICI VERİ DEPOLAMA (SIFIRLANMAZ) & ÖZGÜR KELİME LİSTESİ */
  const origSave=window.save;
  window.save=function(p=cur){
    try{
      if(p&&p.id)localStorage.setItem('ka_active_pack_id',p.id);
      if(origSave)origSave(p);
      localStorage.setItem('ka_packs_backup_v4',JSON.stringify(packs));
    }catch(e){}
  };
  try{
    const b=localStorage.getItem('ka_packs_backup_v4');
    if(b){const parsed=JSON.parse(b);if(Array.isArray(parsed)&&parsed.length){packs=parsed;const lastId=localStorage.getItem('ka_active_pack_id');cur=(lastId&&packs.find(x=>x.id===lastId))||packs[0];}}
  }catch(e){}

  /* 4. YAZMA 2. HAK: "ÇOK YAKLAŞTIN!" & HIZLI LEVENSHTEIN + HARF İPUCU */
  function levFast(a,b){
    if(a===b)return 0;
    const al=a.length,bl=b.length;
    if(Math.abs(al-bl)>2)return 99;
    if(!al)return bl;if(!bl)return al;
    const v0=new Array(bl+1);const v1=new Array(bl+1);
    for(let i=0;i<=bl;i++)v0[i]=i;
    for(let i=0;i<al;i++){
      v1[0]=i+1;let minD=v1[0];
      for(let j=0;j<bl;j++){
        const cost=a[i]===b[j]?0:1;
        v1[j+1]=Math.min(v1[j]+1,v0[j+1]+1,v0[j]+cost);
        if(v1[j+1]<minD)minD=v1[j+1];
      }
      if(minD>2)return 99;
      for(let j=0;j<=bl;j++)v0[j]=v1[j];
    }
    return v0[bl];
  }
  function mask(w){return w.length<=3?w[0]+'••':w[0]+'•'.repeat(w.length-2)+w[w.length-1];}

  let ySecondChance=false;
  window.yCheck=function(){
    if(!Q)return;
    if(Q.done){ySecondChance=false;qi++;ynext();return;}
    const inp=document.getElementById('ans');if(!inp)return;
    const v=inp.value.trim().toLowerCase().replace(/[.,!?']/g,'').replace(/^to /,'');
    if(!v)return;
    const cor=Q.x.en.split(/\s*[\/~]\s*/).map(a=>a.trim().toLowerCase());
    if(cor.some(a=>a===v)){
      ySecondChance=false;Q.done=1;META.tot=(META.tot||0)+1;META.ok=(META.ok||0)+1;qok++;xp(10);
      if(window.SFX&&SFX.ok)SFX.ok();saveMeta();
      document.getElementById('fb').innerHTML='<span class="good" style="font-weight:800;color:var(--ok)">✅ Mükemmel Doğru!</span>';
      document.getElementById('ck').textContent='Sonraki →';inp.disabled=true;return;
    }
    const closest=cor.reduce((b,ans)=>{const d=levFast(v,ans);return d<b.d?{d,ans}:b;},{d:999,ans:cor[0]});
    if(!ySecondChance&&closest.d<=2&&closest.ans.length>=4){
      ySecondChance=true;if(window.SFX&&SFX.tick)SFX.tick();
      document.getElementById('fb').innerHTML=`<div style="background:rgba(245,158,11,.15);border:1.5px solid var(--acc);border-radius:12px;padding:8px 12px;margin-top:6px"><b style="color:var(--acc)">🔥 Çok yaklaştın!</b> 2. bir şansın var.<br><span style="font-size:12.5px;color:var(--ink)">İpucu: <b>${mask(closest.ans)}</b></span></div>`;
      inp.focus();inp.select();return;
    }
    ySecondChance=false;Q.done=1;META.tot=(META.tot||0)+1;
    if(window.SFX&&SFX.bad)SFX.bad();saveMeta();
    document.getElementById('fb').innerHTML='<span class="bad2" style="font-weight:800;color:var(--bad)">❌ Doğru cevap: <b>'+esc(Q.x.en)+'</b></span>';
    document.getElementById('ck').textContent='Sonraki →';inp.disabled=true;
  };

  /* 5. TÜM ETKİNLİKLERDE BÜTÜN KELİMELER & 12 SORULUK MEGA KARMA BOSS */
  window.qstart=function(mode){
    if(!cur||!cur.items||!cur.items.length)return;
    const hasTr=cur.items.filter(x=>x.tr);if(!hasTr.length)return;
    if(mode==='boss'){
      qmode='boss';qi=0;qok=0;qlives=3;Q_DECK=[];
      const shuffled=[...hasTr].sort(()=>Math.random()-.5);
      const pool=shuffled.slice(0,Math.min(12,shuffled.length));
      const types=['sec','esle','yaz','cum'];
      pool.forEach((x,idx)=>{Q_DECK.push({x,type:types[idx%types.length],done:0});});
      renderBossHp();qNext();return;
    }
    qmode=mode;qi=0;qok=0;qlives=3;
    Q_DECK=[...hasTr].sort(()=>Math.random()-.5).map(x=>({x,type:mode,done:0}));
    qNext();
  };
  function renderBossHp(){
    const acttop=document.querySelector('.acttop');if(!acttop)return;
    let bWrap=document.getElementById('bossWrap');
    if(!bWrap){
      bWrap=document.createElement('div');bWrap.id='bossWrap';
      bWrap.style.cssText='width:100%;margin-bottom:10px;background:rgba(239,68,68,.12);border:1.5px solid var(--bad);border-radius:14px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--bad)';
      acttop.after(bWrap);
    }
    const rem=Q_DECK.length-qi;
    bWrap.innerHTML='<span>🐉 KARMA BOSS CANI:</span><div style="flex:1;height:8px;background:var(--soft);border-radius:999px;margin:0 10px;overflow:hidden"><div style="width:'+Math.round(rem/Math.max(1,Q_DECK.length)*100)+'%;height:100%;background:var(--bad)"></div></div><span>'+rem+' / '+Q_DECK.length+'</span>';
  }

  /* 6. PARAGRAF: "GENEL OLARAK NE ANLATIYOR" KISA ÖZET MOTORU & ANTİ-%0 KALKANI */
  const GRADE_SUMMARY=`Sen motive edici bir İngilizce öğretmenisin. Öğrencinin Türkçe kısa özetini değerlendir. Katı tez/ana fikir arama; metnin genel olarak ne anlattığını kendi cümleleriyle özetlemişse MUTLAKA ONAY VER ve 75-100 ver. ASLA %0 verme. Yalnızca JSON döndür: {"skor": 0-100, "yorum": "Türkçe 1-2 cümle sıcak değerlendirme."}`;

  window.pview=function(){
    const p=cur;if(!p)return;
    const G=p.groups||[];
    setProg(G.length?G.filter(x=>x.ok).length/G.length*100:0);
    if(!G.length){
      document.getElementById('st').innerHTML='<div class="qbox"><div class="eyebrow">📖 Paragraf</div><p class="m">Kelimeler paragraflara ayrılıyor…</p><button class="btn3" id="pg">Paragrafları Oluştur</button></div>';return;
    }
    GI=Math.min(Math.max(GI,0),G.length-1);
    const i=GI,g=G[i];SRC=g;
    document.getElementById('st').innerHTML=`
      <div class="coach">${mascot('',66)}<div class="bubble">Metni oku ve <b>genel olarak ne anlattığını</b> çok uzatmadan 1-2 cümleyle özetle.</div></div>
      <div class="pillsg">${G.map((x,k)=>`<button class="pill ${k===i?'on':''}" data-g="${k}">${x.ok?'✓ ':''}${k+1}. Paragraf</button>`).join('')}</div>
      <div class="qbox">
        <div class="eyebrow">📖 Paragraf ${i+1}</div>
        <div class="para">${sent(g.text||'')}</div>
        <div class="m" style="margin-top:10px">Kelimeler: ${(g.w||[]).map(w=>'<span class="chip">'+esc(w)+'</span>').join(' ')}</div>
      </div>
      <div class="qbox" style="border:1.5px solid var(--p2)">
        <div class="eyebrow" style="color:var(--acc)">✍️ Paragrafın Kısa Özeti</div>
        <p class="m" style="margin-bottom:8px">Metnin çok uzatmadan <b>genel olarak ne anlattığını</b> kendi cümlelerinle özetle. Bot genel kavrayışını değerlendirecektir.</p>
        <textarea id="ap" placeholder="Örn: Metinde genel olarak yapay zekanın sağladığı faydalardan ve olası risklerden bahsediliyor…" style="width:100%;min-height:90px;padding:12px;border-radius:14px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);font-size:15px"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn3" id="gr">📝 Özeti Değerlendir</button></div>
        <div class="fb" id="gfb" style="margin-top:10px">${g.ok?'<div class="good big" style="font-size:15px">✅ Bu paragrafın özeti onaylandı</div>':''}</div>
      </div>`;
  };

  window.grade=async function(){
    const p=cur;if(!p)return;
    const gi=GI,g=p.groups&&p.groups[gi];
    const inp=document.getElementById('ap');const t=inp?inp.value.trim():'';
    if(!t||!g||!g.text)return;
    const gfb=document.getElementById('gfb');
    if(gfb)gfb.innerHTML='<span class="m">⏳ Bot özetini ve metin kavrayışını inceliyor…</span>';
    let r=null;
    try{r=await askJ(GRADE_SUMMARY,`METİN: ${g.text}\n\nÖĞRENCİ ÖZETİ: ${t}`,45000,'quick');}catch(e){r=null;}
    let skor=r?Math.max(0,Math.min(100,Math.round(Number(r.skor)||0))):0;
    let yorum=(r&&r.yorum)?String(r.yorum).trim():'';
    // Anti-%0 Kalkanı: Öğrenci mantıklı bir özet yazdıysa asla %0 alamaz
    if(skor<50&&t.split(/\s+/).length>=4){skor=75;yorum='Paragrafın genel hatlarını ve konusunu gayet güzel kavrayıp özetledin!';}
    const isPass=skor>=50;
    if(isPass){
      g.ok=true;p.prog.xp=(p.prog.xp||0)+15;
      if(p.groups.every(x=>x.ok))p.prog.steps[6]=1;
      save(p);renderHead();
      if(window.SFX&&SFX.win)SFX.win();
      if(gfb)gfb.innerHTML=`<div style="background:rgba(16,185,129,.12);border:1.5px solid #10b981;border-radius:14px;padding:12px"><div style="font-weight:900;color:var(--ok)">✅ %${skor} - Harika Özet! Onaylandı</div><div style="font-size:13px;color:var(--ink);margin-top:4px">${esc(yorum)}</div></div>`;
    }else{
      if(window.SFX&&SFX.bad)SFX.bad();
      if(gfb)gfb.innerHTML=`<div style="background:rgba(239,68,68,.1);border:1.5px solid var(--bad);border-radius:14px;padding:12px"><div style="font-weight:900;color:var(--bad)">⚠️ %${skor} - Biraz Daha Açabilirsin</div><div style="font-size:13px;color:var(--ink);margin-top:4px">${esc(yorum||'Metnin genel konusunu 1-2 cümleyle biraz daha netleştirebilirsin.')}</div></div>`;
    }
  };

  /* 7. SEÇENEK 4: "ARENAYI CEBİNE TAŞI" VİTRİN BUTONU & PWA MODALI */
  function injectPwa(){
    const main=document.getElementById('main');if(!main||document.getElementById('pwaCardBox'))return;
    const card=document.createElement('div');card.id='pwaCardBox';card.className='pwa-card';
    card.innerHTML=`<div class="pwa-left"><div class="pwa-badge-icon">${ARENA_SVG}</div><div><b style="font-size:15px;color:var(--ink);display:block">📲 Arenayı Cebine Taşı</b><span style="font-size:12px;color:var(--mut)">Telefona tek tıkla ekle, uygulama gibi tam ekran çalış</span></div></div><button class="pwa-btn" id="pwaAddBtn">📲 Telefona Ekle</button>`;
    const homeEl=document.getElementById('home');if(homeEl)homeEl.appendChild(card);else main.appendChild(card);
    const modal=document.createElement('div');modal.id='pwaModal';modal.className='pwa-modal-ov';
    modal.innerHTML=`<div class="pwa-modal"><button style="position:absolute;top:14px;right:14px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut)" id="pwaCloseBtn">✕</button><div style="text-align:center;margin-bottom:14px"><div style="width:64px;height:64px;margin:0 auto 10px">${ARENA_SVG}</div><h3 style="font-family:Fraunces,serif;font-size:20px;color:var(--ink)">Kelime Arenasını Telefona Ekle</h3><p style="font-size:12.5px;color:var(--mut);margin-top:4px">App Store olmadan doğrudan telefon ana ekranına ekle:</p></div><div class="pwa-mstep"><div class="pwa-mnum">1</div><div class="pwa-txt"><b>iPhone (Safari):</b> Alttaki <b>Paylaş (⎋)</b> butonuna dokun.</div></div><div class="pwa-mstep"><div class="pwa-mnum">2</div><div class="pwa-txt">Aşağı kaydırıp <b>"Ana Ekrana Ekle"</b> seçeneğini seç.</div></div><div class="pwa-mstep"><div class="pwa-mnum">3</div><div class="pwa-txt"><b>Android (Chrome):</b> Sağ üstteki (⋮) menüsünden <b>"Uygulamayı Yükle"</b> de.</div></div><button class="btn3" style="width:100%;margin-top:14px" id="pwaGotIt">Harika, Anladım! ⚔️</button></div>`;
    document.body.appendChild(modal);
    document.getElementById('pwaAddBtn').onclick=()=>modal.classList.add('show');
    document.getElementById('pwaCloseBtn').onclick=()=>modal.classList.remove('show');
    document.getElementById('pwaGotIt').onclick=()=>modal.classList.remove('show');
  }
  setTimeout(injectPwa,250);window.addEventListener('hashchange',()=>setTimeout(injectPwa,200));
})();
</script>
<!-- ===== KELİME ARENASI: BUEPT READING SINAV ODASI EKLENTİSİ ===== -->
<style>
.buept-banner{background:linear-gradient(135deg,var(--card),var(--soft));border:2px solid var(--p2);border-radius:24px;padding:20px 22px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 6px 0 var(--line),var(--shadow);transition:transform .18s,border-color .18s}

.buept-room.on{display:block}
.ex-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1.5px solid var(--line);background:var(--bg);flex-wrap:wrap}

.ex-timer{margin-left:auto;font-weight:900;background:#fff7e6;color:#b45309;border:1.5px solid #fcd34d;border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums;font-size:14px}

.ex-pane.right{border-left:1.5px solid var(--line);background:var(--bg)}
@media(max-width:850px){.ex-pane.right{border-left:0;border-top:1.5px solid var(--line)}}
.ex-tools{position:sticky;top:-16px;background:var(--card);z-index:10;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);margin-bottom:12px}
.ex-tools button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;font-weight:800;font-size:12.5px;color:var(--ink);cursor:pointer}
.ex-tools button.on{border-color:var(--p);background:var(--soft);color:var(--p)}
.ex-passage{font-family:Georgia,serif;line-height:1.8}
.ex-pp{display:grid;grid-template-columns:26px 1fr;gap:8px;margin:0 0 14px;font-size:15px;transition:background .3s;padding:4px 6px;border-radius:8px}
.ex-pp b.pl{font-family:-apple-system,sans-serif;color:var(--p);font-size:13px;padding-top:2px}
.ex-pp.flash{animation:exFlash 1.8s}
@keyframes exFlash{0%,60%{background:#fef3c7;box-shadow:0 0 0 3px #fbbf24}100%{background:transparent}}
mark.y{background:#fde68a}mark.g{background:#a7f3d0}mark.k{background:#fbcfe8}
mark.u{background:none;text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;text-underline-offset:3px}
mark.n{background:#dbeafe;border-bottom:2px dotted #2563eb;cursor:help}
.ex-qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ex-qnav span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.ex-qnav span.done{background:var(--p);border-color:var(--p);color:#fff}
.ex-qnav span.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-qnav span.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.ex-qcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ex-qh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px}
.ex-opt{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;font-size:13.5px}
.ex-opt:hover{border-color:var(--p2)}
.ex-opt.sel{border-color:var(--p);background:var(--soft);font-weight:700}
.ex-opt.ok{border-color:var(--ok);background:rgba(16,185,129,.15);font-weight:800}
.ex-opt.no{border-color:var(--bad);background:rgba(239,68,68,.15)}
.ex-tfng{display:flex;gap:6px}.ex-tfng .ex-opt{flex:1;justify-content:center;font-weight:800}
.ex-ev{display:none;margin-top:10px;font-size:12.5px;background:rgba(16,185,129,.1);border-radius:10px;padding:8px 12px;border:1px solid rgba(16,185,129,.2)}
.ex-qcard.graded .ex-ev{display:block}
.ex-res{display:none;padding:24px;background:var(--card);border-top:1.5px solid var(--line)}
.ex-res.on{display:block}
.ex-ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--p) calc(var(--v)*1%),var(--soft) 0)}
.ex-ring span{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:900;font-size:24px;text-align:center;line-height:1.1}
</style>

<script>
(function(){
  const BUEPT_PASSAGE = {
    title: "Urban Heat Islands",
    sub: "BUEPT Reading · Metni seçerek renklendirebilir, not ekleyebilir veya altını çizebilirsin.",
    paragraphs: [
      { id: "pA", pl: "A", t: "Cities are often several degrees warmer than the countryside that surrounds them. This phenomenon, known as the urban heat island effect, was first documented in London in the early nineteenth century. Today, it affects nearly every major city on the planet, and its consequences are becoming more serious as urban populations continue to grow." },
      { id: "pB", pl: "B", t: "The causes are well understood. Dark surfaces such as asphalt roads and rooftops absorb sunlight during the day and release it slowly at night. In addition, cities have far fewer trees than rural areas, so they lose the natural cooling that comes from evaporation. Heat produced by cars, air conditioners and factories adds further to the problem." },
      { id: "pC", pl: "C", t: "The effects are not merely uncomfortable. During heatwaves, death rates in cities can rise sharply, particularly among elderly residents. Higher temperatures also increase energy demand, as more people rely on air conditioning, which in turn releases more heat outdoors — a cycle that is difficult to break." },
      { id: "pD", pl: "D", t: "Fortunately, several strategies can mitigate the problem. Painting roofs white, for instance, reflects a large proportion of sunlight back into the atmosphere. Planting trees and creating green roofs provide shade and cool the air. Some cities, such as Singapore, have made urban greenery a central part of their planning policy." },
      { id: "pE", pl: "E", t: "Nevertheless, experts warn that no single solution will be enough. Reducing the urban heat island effect requires cooperation between architects, city planners and local communities, as well as long-term investment that many governments are reluctant to make." }
    ],
    questions: [
      { t: "Main idea", type: "mc", q: "What is the passage mainly about?", o: ["The history of London's climate", "The causes, effects and solutions of urban heat islands", "Why air conditioners are dangerous to human health", "Singapore's sustainable urban planning policy"], a: 1, ev: "pA", why: "Metin A'dan E'ye kadar kentsel ısı adalarının nedenlerini, ölümcül etkilerini ve azaltma çözümlerini kapsamlı biçimde ele almaktadır." },
      { t: "Reference", type: "txt", q: "What does 'they' in paragraph B refer to?", a: ["cities"], ev: "pB", why: "'...cities have far fewer trees... so they lose...' cümlesinde 'they' doğrudan şehirleri (cities) kastetmektedir." },
      { t: "True / False / NG", type: "tf", q: "Trees help cool cities through evaporation.", a: "True", ev: "pB", why: "Paragraf B: '...lose the natural cooling that comes from evaporation' ifadesi ağaçların buharlaşmayla soğutma sağladığını doğrular." },
      { t: "True / False / NG", type: "tf", q: "The heat island effect was first recorded in Paris.", a: "False", ev: "pA", why: "Paragraf A: '...was first documented in London in the early nineteenth century' belirtilmiştir, Paris değil Londra'dır." },
      { t: "Vocabulary", type: "mc", q: "The word 'mitigate' in paragraph D is closest in meaning to:", o: ["increase", "reduce", "explain", "ignore"], a: 1, ev: "pD", why: "'mitigate' hafifletmek, azaltmak (reduce / alleviate) anlamına gelen kritik bir akademik kelimedir." },
      { t: "Short answer", type: "txt", q: "Which group is most at risk during heatwaves? (max 2 words)", a: ["elderly residents", "elderly", "the elderly", "old people"], ev: "pC", why: "Paragraf C: '...death rates in cities can rise sharply, particularly among elderly residents' ifadesinde açıkça belirtilmiştir." },
      { t: "Matching headings", type: "sel", q: "Choose the best heading for paragraph E:", o: ["— bir başlık seç —", "A vicious cycle that is hard to break", "Simple ways to cool down homes", "A complex challenge requiring teamwork and investment", "Where it all began in London"], a: 3, ev: "pE", why: "Paragraf E, sorunun tek bir yolla çözülemeyeceğini; mimarlar, şehir planlamacıları ve yatırımların ortak işbirliğini gerektirdiğini vurgular." }
    ]
  };

  function injectBueptUI(){
    const navLinks = document.querySelector('.navlinks');
    if(navLinks && !document.getElementById('navBueptBtn')){
      const btn = document.createElement('button');
      btn.id = 'navBueptBtn';
      btn.style.cssText = 'background:var(--soft);color:var(--p);border:1.5px solid var(--line);border-radius:12px;padding:7px 13px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-left:4px';
      btn.innerHTML = '📝 BUEPT Sınavı';
      btn.onclick = openBueptRoom;
      navLinks.appendChild(btn);
    }
    const homeEl = document.getElementById('home');
    if(homeEl && !document.getElementById('bueptBannerBox')){
      const banner = document.createElement('div');
      banner.id = 'bueptBannerBox';
      banner.className = 'buept-banner';
      banner.innerHTML = `
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;font-size:24px;color:#fff;box-shadow:0 6px 16px var(--glow)">📝</div>
          <div>
            <div style="font-size:11px;font-weight:900;letter-spacing:1px;color:var(--p)">BUEPT / AKADEMİK SINAV HAZIRLIK</div>
            <h3 style="margin:2px 0 4px;font-size:18px;color:var(--ink)">BUEPT Reading Sınav Odası</h3>
            <p style="margin:0;font-size:13px;color:var(--mut)">Gerçek sınav gibi: Metni sol tarafta oku, altını çiz & not al; sağda 6 soru tipini çöz ve puanlan!</p>
          </div>
        </div>
        <button class="btn3" id="bueptEnterBtn" style="padding:11px 20px;font-size:13.5px;white-space:nowrap">Sınav Odasına Gir →</button>`;
      homeEl.prepend(banner);
      document.getElementById('bueptEnterBtn').onclick = openBueptRoom;
    }
  }

  let exAnswers = {}, exDone = false, exLeft = 3600, exTimer = null, exMode = 'y', exFontSize = 15;

  function openBueptRoom(){
    const main = document.getElementById('main');
    if(!main) return;
    let room = document.getElementById('bueptRoom');
    if(!room){
      room = document.createElement('div');
      room.id = 'bueptRoom';
      room.className = 'buept-room';
      main.prepend(room);
    }
    const home = document.getElementById('home'); if(home) home.style.display = 'none';
    const act = document.getElementById('act'); if(act) act.style.display = 'none';
    room.classList.add('on');
    buildBueptRoomDOM(room);
    room.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeBueptRoom(){
    const room = document.getElementById('bueptRoom');
    if(room) room.classList.remove('on');
    const home = document.getElementById('home'); if(home) home.style.display = 'block';
    if(exTimer) clearInterval(exTimer);
  }

  function buildBueptRoomDOM(room){
    exAnswers = {}; exDone = false; exLeft = 3599;
    const P = BUEPT_PASSAGE;
    room.innerHTML = `
      <div class="ex-bar">
        <button class="pill" id="exExitBtn" style="padding:6px 12px;font-size:12.5px">← Arenaya Dön</button>
        <span class="ex-title">📖 ${P.title}</span>
        <span class="tag" id="exCountBadge">0 / ${P.questions.length} cevaplandı</span>
        <span class="ex-timer" id="exTimerBadge">⏱ 59:59</span>
        <button class="btn3" id="exFinishBtn" style="padding:8px 16px;font-size:13.5px;margin-left:auto">Bitir & Puanla</button>
      </div>
      <div class="ex-split">
        <div class="ex-pane" id="exPassagePane">
          <div class="ex-tools" id="exTools">
            <button data-m="y" class="on">🟨 Sarı</button>
            <button data-m="g">🟩 Yeşil</button>
            <button data-m="k">🩷 Pembe</button>
            <button data-m="u">U̲ Altını çiz</button>
            <button data-m="n">📝 Not</button>
            <button data-m="w" title="Seçtiğin kelimeyi paketine ekle">➕ Kelimeye ekle</button>
            <button id="exClrBtn">⌫ Temizle</button>
            <button id="exFmBtn">A−</button>
            <button id="exFpBtn">A+</button>
          </div>
          <div class="ex-passage" id="exPassageText">
            <h3 style="margin:4px 0 2px;font-family:Fraunces,serif;font-size:22px">${P.title}</h3>
            <p style="font-size:12.5px;color:var(--mut);margin:0 0 14px">${P.sub}</p>
            ${P.paragraphs.map(p => `
              <div class="ex-pp" id="${p.id}">
                <b class="pl">${p.pl}</b>
                <span class="pp-content">${p.t}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="ex-pane right" id="exQuestionsPane">
          <div class="ex-qnav" id="exQNav">
            ${P.questions.map((_, i) => `<span id="exNav_${i}" data-q="${i}">${i+1}</span>`).join('')}
          </div>
          <div id="exQuestionList">
            ${P.questions.map((q, i) => renderQuestionHtml(q, i)).join('')}
          </div>
        </div>
      </div>
      <div class="ex-res" id="exResultPane">
        <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
          <div class="ex-ring" id="exScoreRing" style="--v:0"><span id="exScoreText">0%<br><small style="font-size:12px;color:var(--mut)">0 / 7</small></span></div>
          <div style="flex:1;min-width:240px" id="exCategoryBars"></div>
          <div style="min-width:180px">
            <div class="eyebrow">Tahmini BUEPT Seviyesi</div>
            <div style="font-size:26px;font-weight:900" id="exBandGrade">—</div>
            <div style="font-size:13px;color:var(--mut);margin:4px 0 12px">Süre: <b id="exDuration">—</b></div>
            <button class="btn3" id="exReviewBtn" style="padding:9px 16px;font-size:13px">🔍 Kanıtları İncele</button>
          </div>
        </div>
      </div>`;

    document.getElementById('exExitBtn').onclick = closeBueptRoom;
    document.getElementById('exFinishBtn').onclick = finishBueptExam;
    document.getElementById('exFpBtn').onclick = () => { exFontSize = Math.min(22, exFontSize + 1); updateFontSize(); };
    document.getElementById('exFmBtn').onclick = () => { exFontSize = Math.max(12, exFontSize - 1); updateFontSize(); };
    document.getElementById('exClrBtn').onclick = () => {
      document.querySelectorAll('#exPassageText mark').forEach(m => m.replaceWith(...m.childNodes));
    };

    const toolsEl = document.getElementById('exTools');
    toolsEl.addEventListener('click', e => {
      const b = e.target.closest('button[data-m]');
      if(!b) return;
      exMode = b.dataset.m;
      toolsEl.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b));
    });

    const passageText = document.getElementById('exPassageText');
    passageText.addEventListener('mouseup', () => {
      const sel = window.getSelection();
      if(!sel.rangeCount || sel.isCollapsed) return;
      const range = sel.getRangeAt(0);
      if(!passageText.contains(range.commonAncestorContainer)) return;
      const str = sel.toString().trim();
      if(exMode === 'w'){
        if(typeof packs !== 'undefined' && packs[0]){
          packs[0].items.push({ en: str.toLowerCase(), tr: '' });
          if(window.save) save(packs[0]);
          alert(`➕ "${str}" kelimesi aktif çalışma paketine eklendi!`);
        }
        sel.removeAllRanges(); return;
      }
      const mark = document.createElement('mark');
      mark.className = exMode;
      if(exMode === 'n'){
        const note = prompt('Bu kısma notun:');
        if(!note) return;
        mark.title = '📝 ' + note;
      }
      try{ range.surroundContents(mark); }catch(err){ mark.appendChild(range.extractContents()); range.insertNode(mark); }
      sel.removeAllRanges();
    });

    const qList = document.getElementById('exQuestionList');
    qList.addEventListener('click', e => {
      const opt = e.target.closest('.ex-opt');
      if(!opt || exDone) return;
      const qIdx = opt.dataset.q;
      opt.parentElement.querySelectorAll('.ex-opt').forEach(x => x.classList.remove('sel'));
      opt.classList.add('sel');
      exAnswers[qIdx] = opt.dataset.v;
      updateAnswerProgress();
    });
    qList.addEventListener('input', e => {
      const qIdx = e.target.dataset.q;
      if(qIdx == null || exDone) return;
      exAnswers[qIdx] = e.target.value.trim();
      updateAnswerProgress();
    });

    qList.addEventListener('click', e => {
      const evBtn = e.target.closest('[data-ev]');
      if(!evBtn) return;
      const p = document.getElementById(evBtn.dataset.ev);
      if(p){
        p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
        p.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    if(exTimer) clearInterval(exTimer);
    exTimer = setInterval(() => {
      if(exDone) return;
      exLeft = Math.max(0, exLeft - 1);
      const m = String(Math.floor(exLeft / 60)).padStart(2, '0');
      const s = String(exLeft % 60).padStart(2, '0');
      const badge = document.getElementById('exTimerBadge');
      if(badge) badge.textContent = `⏱ ${m}:${s}`;
    }, 1000);
  }

  function renderQuestionHtml(q, i){
    let body = '';
    if(q.type === 'mc'){
      body = q.o.map((opt, k) => `<div class="ex-opt" data-q="${i}" data-v="${k}"><b>${'ABCD'[k]})</b> ${opt}</div>`).join('');
    } else if(q.type === 'tf'){
      body = '<div class="ex-tfng">' + ['True', 'False', 'Not Given'].map(v => `<div class="ex-opt" data-q="${i}" data-v="${v}">${v}</div>`).join('') + '</div>';
    } else if(q.type === 'txt'){
      body = `<input data-q="${i}" placeholder="Cevabını buraya yaz…" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">`;
    } else if(q.type === 'sel'){
      body = `<select data-q="${i}" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">${q.o.map((v, k) => `<option value="${k}">${v}</option>`).join('')}</select>`;
    }
    return `
      <div class="ex-qcard" id="exQCard_${i}">
        <div class="ex-qh"><span>SORU ${i+1}</span><span>${q.t}</span></div>
        <p style="margin:0 0 8px;font-weight:700">${q.q}</p>
        ${body}
        <div class="ex-ev"></div>
      </div>`;
  }

  function updateFontSize(){
    document.querySelectorAll('.ex-pp').forEach(p => p.style.fontSize = exFontSize + 'px');
  }

  function updateAnswerProgress(){
    const P = BUEPT_PASSAGE;
    let answered = 0;
    P.questions.forEach((q, i) => {
      const val = exAnswers[i];
      const isAns = val !== undefined && val !== '' && !(q.type === 'sel' && val === '0');
      if(isAns) answered++;
      const navSpan = document.getElementById('exNav_' + i);
      if(navSpan) navSpan.classList.toggle('done', isAns);
    });
    const badge = document.getElementById('exCountBadge');
    if(badge) badge.textContent = `${answered} / ${P.questions.length} cevaplandı`;
  }

  function finishBueptExam(){
    if(exDone) return;
    exDone = true;
    if(exTimer) clearInterval(exTimer);
    const P = BUEPT_PASSAGE;
    let rightCount = 0;
    const typeStats = {};

    P.questions.forEach((q, i) => {
      const userVal = (exAnswers[i] || '').toString().trim().toLowerCase();
      let isCorrect = false;
      if(q.type === 'mc' || q.type === 'sel') isCorrect = Number(exAnswers[i]) === q.a;
      else if(q.type === 'tf') isCorrect = userVal === q.a.toLowerCase();
      else if(q.type === 'txt') isCorrect = q.a.some(a => userVal.replace(/^the /,'') === a.replace(/^the /,''));

      if(isCorrect) rightCount++;
      typeStats[q.t] = typeStats[q.t] || [0, 0];
      typeStats[q.t][1]++;
      if(isCorrect) typeStats[q.t][0]++;

      const card = document.getElementById('exQCard_' + i);
      const nav = document.getElementById('exNav_' + i);
      if(card){
        card.classList.add('graded');
        card.style.borderColor = isCorrect ? 'var(--ok)' : 'var(--bad)';
      }
      if(nav){
        nav.classList.remove('done');
        nav.classList.add(isCorrect ? 'right' : 'wrong');
      }

      if(q.type === 'mc' || q.type === 'tf'){
        card.querySelectorAll('.ex-opt').forEach(opt => {
          const val = opt.dataset.v;
          if(q.type === 'mc' && Number(val) === q.a) opt.classList.add('ok');
          else if(q.type === 'tf' && val === q.a) opt.classList.add('ok');
          else if(opt.classList.contains('sel')) opt.classList.add('no');
        });
      }

      const correctStr = (q.type === 'mc' || q.type === 'sel') ? q.o[q.a] : (q.type === 'tf' ? q.a : q.a[0]);
      const evBox = card.querySelector('.ex-ev');
      if(evBox){
        evBox.innerHTML = `
          <div style="font-weight:800;color:${isCorrect ? 'var(--ok)' : 'var(--bad)'}">${isCorrect ? '✅ Doğru!' : '❌ Doğru Cevap: ' + correctStr}</div>
          <div style="margin:4px 0">${q.why}</div>
          <button type="button" class="pill" data-ev="${q.ev}" style="padding:4px 10px;font-size:12px;margin-top:4px">📍 Metindeki Kanıtı Göster</button>`;
      }
    });

    const pct = Math.round((rightCount / P.questions.length) * 100);
    const ring = document.getElementById('exScoreRing');
    if(ring) ring.style.setProperty('--v', pct);
    const scoreText = document.getElementById('exScoreText');
    if(scoreText) scoreText.innerHTML = `${pct}%<br><small style="font-size:12px;color:var(--mut)">${rightCount} / ${P.questions.length} Doğru</small>`;

    const barBox = document.getElementById('exCategoryBars');
    if(barBox){
      barBox.innerHTML = '<div class="eyebrow" style="margin-bottom:6px">Soru Tipine Göre Başarı</div>' +
        Object.entries(typeStats).map(([tName, [ok, tot]]) => `
          <div style="margin:6px 0;font-size:13px">
            <div style="display:flex;justify-content:space-between"><span>${tName}</span><b>${ok}/${tot}</b></div>
            <div style="height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:3px">
              <div style="width:${Math.round(ok/tot*100)}%;height:100%;background:${ok/tot >= 0.5 ? 'var(--p2)' : 'var(--bad)'}"></div>
            </div>
          </div>
        `).join('');
    }

    const bandEl = document.getElementById('exBandGrade');
    if(bandEl) bandEl.textContent = pct >= 85 ? 'A · Muaf ✨' : (pct >= 70 ? 'B · Geçti ✅' : (pct >= 55 ? 'C · Sınırda ⚠️' : 'D · Tekrar 📚'));

    const durEl = document.getElementById('exDuration');
    const elapsed = 3599 - exLeft;
    if(durEl) durEl.textContent = `${Math.floor(elapsed / 60)} dk ${elapsed % 60} sn`;

    const resPane = document.getElementById('exResultPane');
    if(resPane){
      resPane.classList.add('on');
      resPane.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  window.addEventListener('hashchange', () => {
    if(location.hash === '#sinav') openBueptRoom();
  });
  setTimeout(() => {
    injectBueptUI();
    if(location.hash === '#sinav') openBueptRoom();
  }, 350);
})();
</script>
<!-- =====================================================================
     KELİME ARENASI · TÜM YENİLİKLER TEK NİHAİ KOD (index.html)
     1. 1A-Saf Logo & Favicon
     2. 2 Yeni Akdeniz Paleti (Akdeniz Esintisi & Turkuaz Sahil) + Kalıcı Hafıza
     3. Yazma Modu 2. Hak (Can) Sistemi
     4. Tüm Etkinliklerde Bütün Kelimeler + 12 Soruluk Karma Boss
     5. Paragraf Kısa Özet & Anti-%0 Kalkanı
     6. Seçenek 4 PWA Mobil Vitrini & Modalı
     7. YENİ SINAV MODÜLÜ (Sınav Odası & PDF/Metin Sınav Yükleyici - Online Soru Çözümü)
     8. ARENA FETHİ V2 (Gelişmiş Bil ve Fethet Kelime Oyunu)
     ===================================================================== -->
<style>
[data-theme="aegean"]{--bg:#f4f7f6;--card:#fff;--ink:#133330;--mut:#50726e;--line:#cfe0dd;--soft:#e4eeec;--p:#0f766e;--p2:#14b8a6;--acc:#f59e0b;--glow:rgba(20,184,166,.22);--shadow:0 12px 28px -10px rgba(15,118,110,.18);--grad:linear-gradient(135deg,#0f766e,#14b8a6 60%,#f59e0b)}
[data-theme="turq"]{--bg:#f0f9fa;--card:#fff;--ink:#0b353d;--mut:#457680;--line:#c3e3ea;--soft:#dcf0f4;--p:#088395;--p2:#059212;--acc:#ff9800;--glow:rgba(8,131,149,.22);--shadow:0 12px 28px -10px rgba(8,131,149,.18);--grad:linear-gradient(135deg,#088395,#0a97ac 60%,#ff9800)}

.pwa-left{display:flex;align-items:center;gap:14px}
.pwa-badge-icon{width:48px;height:48px;border-radius:14px;background:var(--p);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 6px 14px -3px var(--glow);flex-shrink:0}
.pwa-badge-icon svg{width:30px;height:30px}

.sinav-banner,.fetih-banner{background:linear-gradient(135deg,var(--card),var(--soft));border:2px solid var(--p2);border-radius:24px;padding:20px 22px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 6px 0 var(--line),var(--shadow);transition:transform .18s,border-color .18s}

.sinav-banner:hover,.fetih-banner:hover{transform:translateY(-2px)}
.sinav-room,.fetih-room{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 14px 40px -20px rgba(0,0,0,.35);margin-top:14px;position:relative}
.sinav-room.on,.fetih-room.on{display:block}
.ex-bar,.f-hud{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1.5px solid var(--line);background:var(--bg);flex-wrap:wrap}
.ex-timer,.f-evt{margin-left:auto;font-weight:900;background:#fff7e6;color:#b45309;border:1.5px solid #fcd34d;border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums;font-size:13.5px}
.ex-split{display:grid;grid-template-columns:1.2fr 1fr;height:660px}
@media(max-width:880px){.ex-split{grid-template-columns:1fr;height:auto}}
.ex-pane{overflow-y:auto;padding:18px 20px}
.ex-pane.right{border-left:1.5px solid var(--line);background:var(--bg)}
@media(max-width:880px){.ex-pane.right{border-left:0;border-top:1.5px solid var(--line)}}
.ex-tools{position:sticky;top:-18px;background:var(--card);z-index:10;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);margin-bottom:12px}
.ex-tools button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;font-weight:800;font-size:12px;color:var(--ink);cursor:pointer}

mark.y{background:#fde68a}mark.g{background:#a7f3d0}mark.k{background:#fbcfe8}

.ex-qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ex-qnav span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.ex-qnav span.done{background:var(--p);border-color:var(--p);color:#fff}
.ex-qnav span.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-qnav span.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.ex-qcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ex-opt{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;font-size:13.5px;background:var(--card)}
.ex-opt:hover{border-color:var(--p2);background:var(--soft)}
.ex-opt.sel{border-color:var(--p);background:var(--soft);font-weight:700}
.ex-opt.ok{border-color:var(--ok);background:rgba(16,185,129,.15);font-weight:800}

.ex-tfng{display:flex;gap:6px}.ex-tfng .ex-opt{flex:1;justify-content:center;font-weight:800}
.ex-ev{display:none;margin-top:10px;font-size:12.5px;background:rgba(16,185,129,.1);border-radius:10px;padding:8px 12px;border:1px solid rgba(16,185,129,.2)}
.ex-qcard.graded .ex-ev{display:block}
.ex-res{display:none;padding:24px;background:var(--card);border-top:1.5px solid var(--line)}
.ex-res.on{display:block}
.ex-ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--p) calc(var(--v)*1%),var(--soft) 0)}
.ex-ring span{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:900;font-size:22px;text-align:center;line-height:1.1}
.ex-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1.5px solid var(--line);padding-bottom:8px}
.ex-tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);margin-bottom:12px}

.ex-tab.on{color:var(--p);border-bottom-color:var(--p)}
.ex-tab-pane{display:none}.ex-tab-pane.on{display:block}
.ex-fg{margin-bottom:10px}.ex-fg label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}
.ex-fg input,.ex-fg textarea{width:100%;padding:9px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.ex-dropzone{border:2px dashed var(--p2);background:var(--soft);border-radius:14px;padding:20px;text-align:center;cursor:pointer;margin-bottom:10px}
.ex-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--bg)}
.ex-item.active{border-color:var(--p);background:var(--soft)}
.f-lobby{padding:24px;text-align:center}
.f-gm{display:grid;grid-template-columns:1fr 280px}
@media(max-width:920px){.f-gm{grid-template-columns:1fr}}
.f-mapw{position:relative;background:radial-gradient(ellipse at 50% 45%,#bfe9e2,#7cc6bb 70%,#4fa89c);padding:8px}
.f-status{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(13,43,42,.9);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px;white-space:nowrap;z-index:5}
.rg{cursor:pointer}.rg:hover polygon{filter:brightness(1.12)}
.rg.sel polygon{animation:fbl 1s infinite}
@keyframes fbl{50%{filter:brightness(1.35)}}
.f-side{border-left:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.f-pl{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.f-pl.turn{border-color:var(--acc);box-shadow:0 0 0 3px #fef3c7}
.f-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex-shrink:0}
.f-pv{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 6px;border-radius:8px;background:var(--soft)}
.f-pv.own{background:#ecfdf5;outline:1.5px solid var(--ok)}
.f-ov{position:absolute;inset:0;background:rgba(6,21,20,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.f-ov.on{display:flex}
.f-md{background:var(--card);border-radius:24px;max-width:460px;width:100%;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative}
.f-an{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.f-an button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-weight:800;text-align:left;color:var(--ink);cursor:pointer}
.f-an button:hover{border-color:var(--p2)}
.f-an button.ok{background:#d1fae5;border-color:var(--ok)}.f-an button.no{background:#ffe4e6;border-color:var(--bad)}
</style>

<script>
(function(){
  /* 1. 1A-SAF LOGO & FAVICON */
  const ARENA_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="lgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14968c"/><stop offset="100%" stop-color="#0b5a55"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.25"/><stop offset="55%" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lgC)"/><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sheen)"/><rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#fff" stroke-opacity="0.2" stroke-width="1.2" fill="none"/><path d="M15 47.5V30.5a17 17 0 0 1 34 0v17" stroke="#fff" stroke-width="4.8" stroke-linecap="round" fill="none"/><path d="M11.8 47.5H18.2M45.8 47.5H52.2" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M24 47.5V31.5a8 8 0 0 1 16 0v16" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round" fill="none"/><path d="M9.5 53.5 Q20.8 49 32 53.8 Q43.2 49 54.5 53.5" stroke="url(#gold)" stroke-width="2.7" stroke-linecap="round" fill="none"/><path d="M14.5 57 Q23.2 53.8 32 57 Q40.8 53.8 49.5 57" stroke="#fff" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="50" cy="13" r="6.8" fill="#fbbf24" fill-opacity="0.25"/><circle cx="50" cy="13" r="3.7" fill="url(#gold)"/><circle cx="48.8" cy="11.8" r="1.1" fill="#fff" fill-opacity="0.9"/></svg>';
  const ARENA_DATA='data:image/svg+xml,'+encodeURIComponent(ARENA_SVG);
  try{
    let fi=document.querySelector("link[rel*='icon']");if(!fi){fi=document.createElement('link');fi.rel='icon';document.head.appendChild(fi);}
    fi.type='image/svg+xml';fi.href=ARENA_DATA;
    document.querySelectorAll('.brand-badge, .logo, a.brand, header .brand').forEach(el=>{const old=el.querySelector('svg, img');if(old)old.remove();el.insertAdjacentHTML('afterbegin',ARENA_SVG);});
  }catch(e){}

  /* 2. 2 YENİ AKDENİZ PALETİ & HAFIZA */
  function setPal(n){
    if(n==='def'||!n){document.documentElement.removeAttribute('data-theme');localStorage.removeItem('arena_palette');}
    else{document.documentElement.setAttribute('data-theme',n);localStorage.setItem('arena_palette',n);}
    document.querySelectorAll('.pal-btn').forEach(b=>{b.classList.toggle('active',b.dataset.p===n);});
  }
  window.setPal=setPal;
  const savedPal=localStorage.getItem('arena_palette');if(savedPal)setPal(savedPal);

  /* 3. YAZMA MODU 2. HAK */
  let writeFailCount=0;const origQcheck=window.qcheck;
  window.qcheck=function(){
    if(window.qmode!=='yaz'){if(origQcheck)origQcheck.apply(this,arguments);return;}
    const Q=Q_DECK[qi];if(!Q)return;
    const inp=document.getElementById('ans');if(!inp)return;
    const v=inp.value.trim().toLowerCase(), target=(Q.x.en||'').trim().toLowerCase();
    if(v===target){
      writeFailCount=0;if(window.SFX&&SFX.ok)SFX.ok();
      Q.done=1;qok++;inp.disabled=true;
      document.getElementById('fb').innerHTML='<span style="font-weight:800;color:var(--ok)">🎉 Mükemmel! Doğru yazdın.</span>';
      document.getElementById('ck').textContent='Sonraki →';return;
    }
    if(writeFailCount===0){
      writeFailCount=1;if(window.SFX&&SFX.bad)SFX.bad();
      inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);inp.select();
      const hint=target.length>2?(target[0]+' · '.repeat(target.length-2)+target[target.length-1]):target[0]+'…';
      document.getElementById('fb').innerHTML=`<span style="font-weight:800;color:#f59e0b">⚠️ 1 hakkın daha var! İpucu: <code>${hint}</code></span>`;
      return;
    }
    writeFailCount=0;if(window.SFX&&SFX.bad)SFX.bad();
    qlives=Math.max(0,qlives-1);renderLives();
    document.getElementById('fb').innerHTML='<span style="font-weight:800;color:var(--bad)">❌ Doğru cevap: <b>'+esc(Q.x.en)+'</b></span>';
    document.getElementById('ck').textContent='Sonraki →';inp.disabled=true;
  };

  /* 4. TÜM KELİMELER & 12 SORULUK BOSS */
  window.qstart=function(mode){
    if(!cur||!cur.items||!cur.items.length)return;
    const hasTr=cur.items.filter(x=>x.tr);if(!hasTr.length)return;
    if(mode==='boss'){
      qmode='boss';qi=0;qok=0;qlives=3;Q_DECK=[];
      const shuffled=[...hasTr].sort(()=>Math.random()-.5);
      const pool=shuffled.slice(0,Math.min(12,shuffled.length));
      const types=['sec','esle','yaz','cum'];
      pool.forEach((x,idx)=>{Q_DECK.push({x,type:types[idx%types.length],done:0});});
      renderBossHp();qNext();return;
    }
    qmode=mode;qi=0;qok=0;qlives=3;
    Q_DECK=[...hasTr].sort(()=>Math.random()-.5).map(x=>({x,type:mode,done:0}));
    qNext();
  };
  function renderBossHp(){
    const acttop=document.querySelector('.acttop');if(!acttop)return;
    let bWrap=document.getElementById('bossWrap');
    if(!bWrap){
      bWrap=document.createElement('div');bWrap.id='bossWrap';
      bWrap.style.cssText='width:100%;margin-bottom:10px;background:rgba(239,68,68,.12);border:1.5px solid var(--bad);border-radius:14px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--bad)';
      acttop.after(bWrap);
    }
    const rem=Q_DECK.length-qi;
    bWrap.innerHTML='<span>🐉 KARMA BOSS:</span><div style="flex:1;height:8px;background:var(--soft);border-radius:999px;margin:0 10px;overflow:hidden"><div style="width:'+Math.round(rem/Math.max(1,Q_DECK.length)*100)+'%;height:100%;background:var(--bad)"></div></div><span>'+rem+' / '+Q_DECK.length+'</span>';
  }

  /* 5. PARAGRAF ÖZET & ANTİ-%0 */
  const GRADE_SUMMARY=`Sen motive edici bir İngilizce öğretmenisin. Öğrencinin Türkçe kısa özetini değerlendir. Katı tez arama; metnin konusunu 1-2 cümleyle özetlemişse MUTLAKA ONAY VER ve 75-100 ver. ASLA %0 verme. Yalnızca JSON: {"skor": 0-100, "yorum": "Kısa sıcak değerlendirme."}`;
  window.pview=function(){
    const p=cur;if(!p)return;const G=p.groups||[];setProg(G.length?G.filter(x=>x.ok).length/G.length*100:0);
    if(!G.length){document.getElementById('st').innerHTML='<div class="qbox"><div class="eyebrow">📖 Paragraf</div><p class="m">Kelimeler paragraflara ayrılıyor…</p><button class="btn3" id="pg">Paragrafları Oluştur</button></div>';return;}
    GI=Math.min(Math.max(GI,0),G.length-1);const i=GI,g=G[i];SRC=g;
    document.getElementById('st').innerHTML=`
      <div class="coach">${mascot('',66)}<div class="bubble">Metni oku ve <b>genel olarak ne anlattığını</b> 1-2 cümleyle özetle.</div></div>
      <div class="pillsg">${G.map((x,k)=>`<button class="pill ${k===i?'on':''}" data-g="${k}">${x.ok?'✓ ':''}${k+1}. Paragraf</button>`).join('')}</div>
      <div class="qbox"><div class="eyebrow">📖 Paragraf ${i+1}</div><div class="para">${sent(g.text||'')}</div><div class="m" style="margin-top:10px">Kelimeler: ${(g.w||[]).map(w=>'<span class="chip">'+esc(w)+'</span>').join(' ')}</div></div>
      <div class="qbox" style="border:1.5px solid var(--p2)">
        <div class="eyebrow" style="color:var(--acc)">✍️ Paragrafın Kısa Özeti</div>
        <p class="m" style="margin-bottom:8px">Metnin <b>genel olarak ne anlattığını</b> kendi cümlelerinle özetle.</p>
        <textarea id="ap" placeholder="Örn: Metinde genel olarak yapay zekanın sağladığı faydalardan bahsediliyor…" style="width:100%;min-height:85px;padding:10px;border-radius:12px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);font-size:14px"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn3" id="gr">📝 Özeti Değerlendir</button></div>
        <div class="fb" id="gfb" style="margin-top:8px">${g.ok?'<div class="good big">✅ Bu paragrafın özeti onaylandı</div>':''}</div>
      </div>`;
  };
  window.grade=async function(){
    const p=cur;if(!p)return;const gi=GI,g=p.groups&&p.groups[gi];const inp=document.getElementById('ap');const t=inp?inp.value.trim():'';if(!t||!g||!g.text)return;
    const gfb=document.getElementById('gfb');if(gfb)gfb.innerHTML='<span class="m">⏳ Bot özetini inceliyor…</span>';
    let r=null;try{r=await askJ(GRADE_SUMMARY,`METİN: ${g.text}\n\nÖĞRENCİ ÖZETİ: ${t}`,45000,'quick');}catch(e){r=null;}
    let skor=r?Math.max(0,Math.min(100,Math.round(Number(r.skor)||0))):0;let yorum=(r&&r.yorum)?String(r.yorum).trim():'';
    if(skor<50&&t.split(/\s+/).length>=4){skor=75;yorum='Paragrafın genel hatlarını gayet güzel kavrayıp özetledin!';}
    if(skor>=50){
      g.ok=true;p.prog.xp=(p.prog.xp||0)+15;if(p.groups.every(x=>x.ok))p.prog.steps[6]=1;save(p);renderHead();
      if(window.SFX&&SFX.win)SFX.win();
      if(gfb)gfb.innerHTML=`<div style="background:rgba(16,185,129,.12);border:1.5px solid #10b981;border-radius:12px;padding:10px"><b style="color:var(--ok)">✅ %${skor} - Harika Özet! Onaylandı</b><div style="font-size:12.5px;margin-top:4px">${esc(yorum)}</div></div>`;
    }else{
      if(window.SFX&&SFX.bad)SFX.bad();
