<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Akademik İngilizce kelime çalışma oyunu: kartlar, eşleştirme, testler ve paragraf çalışması.">
<title>Kelime Arenası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body[data-pal="gece"]{--bg:#0f1224;--card:#171b33;--line:#2a3050;--ink:#f4f1ff;--mut:#9aa3c7;--p:#6366f1;--p2:#8b5cf6;--acc:#fbbf24;--bad:#f43f5e;--soft:#1f2545;--lg:url(#lgA);--shadow:0 22px 40px -26px rgba(0,0,0,.7)}
body[data-pal="kitaplik"]{--bg:#f7f1e3;--card:#fffaf0;--line:#e6d9bf;--ink:#2e1a1f;--mut:#7d6a5f;--p:#7a1f2e;--p2:#a33a4a;--acc:#c08a2b;--bad:#b42318;--soft:#f1e5cc;--lg:url(#lgB);--shadow:0 22px 40px -28px rgba(46,26,31,.45)}
body[data-pal="akdeniz"]{--bg:#f3f8f6;--card:#ffffff;--line:#d5e7e1;--ink:#0d2b2a;--mut:#56736f;--p:#0f766e;--p2:#14b8a6;--acc:#f59e0b;--bad:#e11d48;--soft:#e2f1ed;--lg:url(#lgC);--shadow:0 22px 40px -28px rgba(13,43,42,.4)}
body{--pd:color-mix(in srgb,var(--p) 66%,#000);margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;transition:background .3s,color .3s;background-image:radial-gradient(color-mix(in srgb,var(--mut) 13%,transparent) 1px,transparent 1.4px);background-size:24px 24px}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:20px;background:none;border:0;padding:0;letter-spacing:-.3px}
.logo svg{width:38px;height:38px}
.navlinks{display:flex;gap:4px;margin-left:10px}
.navlinks button{background:none;border:0;padding:8px 13px;border-radius:12px;font-weight:700;color:var(--mut)}
.navlinks button:hover{color:var(--ink);background:var(--soft)}
.stats-top{margin-left:auto;display:flex;gap:8px;align-items:center}
.chipst{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.dots{display:flex;gap:7px;margin-left:6px}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.dots button.on{box-shadow:0 0 0 2px var(--p)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 90px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:32px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:0 26px 46px -30px var(--pd)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 88% 0%,rgba(255,255,255,.2),transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 18px)}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(26px,4vw,40px);margin:6px 0 8px;letter-spacing:-.7px;line-height:1.12}
.hero p{margin:0 0 20px;opacity:.92;max-width:520px}
.hero-r{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--v)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center}
.ring span{width:94px;height:94px;border-radius:50%;background:var(--pd);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:800;font-size:22px;color:#fff}
.hero .ring span{background:color-mix(in srgb,var(--p) 80%,#000)}
.btn3{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#1f1300;border:0;border-radius:18px;padding:15px 24px;font-weight:800;font-size:16px;box-shadow:0 6px 0 color-mix(in srgb,var(--acc) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn3:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 55%,#000)}
.btn3:disabled{opacity:.45;box-shadow:0 6px 0 color-mix(in srgb,var(--acc) 35%,#000);cursor:default;transform:none}
.btn-ghost{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 20px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 26px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.sc b{display:block;font-family:Fraunces,serif;font-size:24px;letter-spacing:-.4px}
.sc span{font-size:13px;color:var(--mut);font-weight:700}
.homegrid{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.sec{font-family:Fraunces,serif;font-size:22px;margin:0 0 12px;letter-spacing:-.3px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--line),var(--shadow);transition:transform .15s,box-shadow .15s,border-color .2s;animation:rise .4s ease both}
.mcard:hover{transform:translateY(-3px);border-color:var(--p)}
.mcard:active{transform:translateY(2px)}
.mcard h3{margin:4px 0 0;font-family:Fraunces,serif;font-size:19px}
.mcard p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.mcard .ic{width:54px;height:54px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:27px}
.mcard.done{border-color:#16a34a}
.mcard.done .ic{background:color-mix(in srgb,#16a34a 18%,var(--card))}
.mcard .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;background:var(--soft);border-radius:999px;padding:3px 9px;color:var(--mut)}
.mcard.done .tag{background:#16a34a;color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.card h3{font-family:Fraunces,serif;margin:0 0 12px;font-size:19px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-weight:700}
.lb-row:first-of-type{border-top:0}
.lb-row .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;font-size:13px;flex:0 0 36px}
.lb-row .xp{margin-left:auto;color:var(--mut);font-size:14px}
.lb-row.me{background:var(--soft);border-radius:14px;padding:10px 10px;border-top-color:transparent}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mut);text-align:center}
.badge i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--soft);font-style:normal}
.badge.got i{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#fff));box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 50%,#000)}
.badge.got{color:var(--ink)}
.act{max-width:680px;margin:0 auto;padding-bottom:150px}
.acttop{display:flex;align-items:center;gap:14px}
.xbtn{width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:800;flex:0 0 40px}
.prog{flex:1;height:16px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#22c55e,color-mix(in srgb,#22c55e 60%,var(--acc)));transition:width .45s ease}
.hearts{font-size:17px;letter-spacing:1px;white-space:nowrap}
.coach{display:flex;align-items:flex-end;gap:14px;margin:26px 0 14px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;box-shadow:0 4px 0 var(--line);max-width:420px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.masc{flex:0 0 auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.masc .fr{display:none}
.masc.sad .sm{display:none}
.masc.sad .fr{display:inline}
.masc.wink{transform:rotate(-4deg)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 6px 0 var(--line),var(--shadow);margin-bottom:16px}
.q{font-family:Fraunces,serif;font-size:clamp(22px,3.6vw,30px);font-weight:800;margin:8px 0 16px;line-height:1.2;letter-spacing:-.4px}
.opt{display:flex;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--mut)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--p);box-shadow:0 4px 0 var(--pd);color:var(--p)}
.opt.ok{border-color:#16a34a;box-shadow:0 4px 0 #15803d;background:color-mix(in srgb,#16a34a 14%,var(--card));color:var(--ink)}
.opt.no{border-color:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000);background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.opt:disabled{cursor:default}
.pill{background:var(--soft);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.flip{position:relative;height:340px;perspective:1100px;cursor:pointer;margin:6px 0 6px}
.face{position:absolute;inset:0;border-radius:28px;padding:26px;background:var(--card);border:2px solid var(--line);box-shadow:0 6px 0 var(--line),var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.face.back{transform:rotateY(180deg);align-items:stretch;text-align:left;border-top:5px solid var(--acc)}
.flip.is .face.front{transform:rotateY(180deg)}
.flip.is .face.back{transform:rotateY(0)}
.big{font-family:Fraunces,serif;font-weight:800;font-size:clamp(34px,6vw,54px);letter-spacing:-.8px;margin:6px 0 4px;word-break:break-word}
.big.tr{font-size:32px;color:var(--p);text-align:center}
.m{color:var(--mut);font-size:14px}
.ex{font-size:17px;line-height:1.75;background:var(--bg);border-radius:16px;padding:14px 16px;margin-top:14px}
.tk{border-bottom:2px dotted var(--mut);cursor:pointer;border-radius:5px;padding:0 1px;transition:background .15s,color .15s}
.tk:hover,.tk.sel{background:var(--soft);color:var(--p);border-bottom-color:transparent}
.tip{margin-top:14px;background:var(--soft);border-radius:16px;padding:12px 14px;min-height:54px;font-size:15px;text-align:left}
.tip b{color:var(--p)}
.tip a{color:var(--p);font-weight:800;text-decoration:none;margin-left:8px;font-size:14px}
.tip a:hover{text-decoration:underline}
.row2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;font-weight:800;box-shadow:0 4px 0 var(--line);margin-bottom:0;transition:transform .08s,box-shadow .08s,border-color .2s,opacity .3s;word-break:break-word}
.tile:hover{border-color:var(--mut)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.sel{border-color:var(--p);color:var(--p);box-shadow:0 4px 0 var(--pd)}
.tile.gone{opacity:.25;pointer-events:none;border-color:#16a34a;box-shadow:none}
.tile.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.txt,textarea{width:100%;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:17px;box-shadow:0 4px 0 var(--line)}
.txt:focus,textarea:focus{outline:none;border-color:var(--p)}
.simbox{margin-top:16px;background:var(--bg);border-radius:18px;padding:16px 18px}
.simrow{display:flex;align-items:center;gap:14px}
.simrow b{font-family:Fraunces,serif;font-size:34px;min-width:90px}
.meter{flex:1;height:16px;background:var(--soft);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p),var(--acc));transition:width .5s ease}
textarea{min-height:120px;resize:vertical}
.para{font-size:18px;line-height:1.9;background:var(--bg);border-radius:18px;padding:18px 20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;visibility:hidden;pointer-events:none;background:var(--card);border-top:2px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.7,.3,1),visibility .3s}
.bar.show{transform:none;visibility:visible;pointer-events:auto}
.bar.ok{background:color-mix(in srgb,#16a34a 18%,var(--card));border-top-color:#16a34a}
.bar.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-top-color:var(--bad)}
.bar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between}
.bar .msg{font-weight:800;font-size:17px;line-height:1.3}
.bar.ok .msg{color:#15803d}
.bar.bad .msg{color:var(--bad)}
.result{text-align:center;padding:40px 10px}
.result h2{font-family:Fraunces,serif;font-size:36px;margin:10px 0 6px;letter-spacing:-.6px}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:3px;animation:fall 1.9s ease-in forwards;z-index:60;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(680deg);opacity:.85}}
.foot{margin-top:40px;text-align:center;color:var(--mut);font-size:13px}
@media(max-width:900px){.homegrid{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-r{flex-direction:row;justify-content:flex-start}}
@media(max-width:640px){.chipst span.lbl{display:none}.hero{padding:24px}.tiles{grid-template-columns:1fr}.flip{height:300px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.addp{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 6px 0 var(--line),var(--shadow);margin-bottom:26px}
.addp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.addp h2{font-family:Fraunces,serif;font-size:24px;margin:4px 0 0;letter-spacing:-.3px}
.lists{display:flex;gap:8px;flex-wrap:wrap}
.lists button{background:var(--soft);border:2px solid transparent;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.lists button.on{border-color:var(--p);color:var(--p);background:var(--card)}
.addp-g{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-top:16px}
.drop2{border:2px dashed var(--acc);border-radius:20px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:170px}
.drop2:hover{border-color:var(--p)}
.typed label{display:block;margin-bottom:6px}
.typed textarea{min-height:160px;font-size:15px}
.addp-f{display:flex;gap:10px;margin-top:14px;align-items:center}
.addp-f .txt{flex:1}
#lstat{margin-top:10px;font-weight:700;min-height:22px}
.emptyc{text-align:center;padding:30px 20px}
@media(max-width:640px){.addp-g{grid-template-columns:1fr}.addp-f{flex-direction:column;align-items:stretch}}
.navlinks .addbtn{background:var(--p);color:#fff;margin-left:6px}
.navlinks .addbtn:hover{color:#fff;filter:brightness(1.08)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(6,7,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal[hidden]{display:none}
.mbox{position:relative;width:min(880px,100%);margin:auto 0}
.mbox .addp{margin-bottom:0}
.mbox .addp-h{padding-right:52px}
.mclose{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:800}
@media(max-width:640px){.navlinks [data-scroll]{display:none}.navlinks{margin-left:4px}.navlinks button{padding:7px 10px;font-size:13px}.modal{padding:14px 10px}}
[hidden]{display:none!important}
html{scroll-padding-top:120px}
.nav-in{flex-wrap:wrap;row-gap:8px}
.logo,.logo span,.navlinks button,.chipst{white-space:nowrap}
.navlinks{flex-wrap:wrap}
.stats-top{flex-wrap:wrap;justify-content:flex-end}
.navlinks .addbtn{margin-left:6px}
.enr{margin:6px 0}
.enrbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--mut)}
.enrbar:empty{display:none}
.enrbar .btn3{padding:10px 16px;font-size:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 55%,#000)}
.opts{display:grid;gap:10px;margin-top:14px}
.stackc{display:grid;gap:12px}
.coach{display:flex;align-items:flex-end;gap:14px;margin:22px 0 12px}
.coach .bubble{flex:1;min-width:0}
.qbox .q{word-break:break-word}
.flip{cursor:pointer}
.flip .face .big{word-break:break-word}
.fb{min-height:26px;margin-top:12px;text-align:center;font-weight:700}
.good{color:#16a34a}
.bad2{color:var(--bad)}
.result{text-align:center;padding:40px 10px}
.result h2{font-family:Fraunces,serif;font-size:32px;margin:10px 0 6px;letter-spacing:-.6px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:28px;align-items:center}
.foot span,.foot button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);font-weight:700;font-family:inherit}
.foot b{color:var(--ink)}
.foot button{cursor:pointer}
.tip{min-height:54px}
.tip b{color:var(--p)}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 10px;margin:3px;font-size:13px;font-weight:700}
.pillsg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.pillsg .pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.btn3.small{padding:10px 16px;font-size:14px}
.lsel{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-weight:700;color:var(--ink);font-family:inherit;font-size:15px}
.listrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.card h3{font-family:Fraunces,serif;margin:0 0 12px;font-size:19px}
.card .m{margin:8px 0 0}
.waitc{margin-top:24px}
.waitc .m{margin:6px 0}
.dropzone{cursor:pointer}
.dropzone.over{border-color:var(--p);background:var(--soft)}
.addp .txt{margin-bottom:8px}
.actempty{padding:30px 20px}
.hero .sub-note{font-size:14px;opacity:.9;margin:0 0 16px}

const P_LANE={fg:0,bg:0},P_MAX={fg:2,bg:2},P_WAIT={fg:[],bg:[]};
function P_acquire(l){
if(P_LANE[l]<P_MAX[l]){P_LANE[l]++;return Promise.resolve()}
return new Promise(r=>P_WAIT[l].push(r));
}
function P_release(l){
const n=P_WAIT[l].shift();
if(n)n(); else P_LANE[l]--;
}
const GRADE2=`Bir İngilizce akademik metnin Türkçe ana düşüncesini öğrenci yazdı. Referans ana düşünceyle karşılaştır ve 0 ile 100 arasında bir benzerlik puanı ver: 100 = aynı ana fikir, 60 = ana fikir doğru ama önemli bir ayrıntı eksik, 0 = alakasız ya da yanlış. Kelime seçimi ve ifade farklılıklarını cezalandırma. YALNIZCA geçerli JSON döndür: {"skor": 0-100 arası tam sayı, "yorum": "Türkçe, 2 cümle. Eksik ya da yanlış noktayı belirt, doğru ana düşünceyi kısaca yaz."}`;

async function askJ(sys,input,ms,tier){
if(!SMP){LASTERR='yapay zeka bu sayfada açık değil';return null}
const lane=(sys===GRADE||sys===GRADE2||sys===GLOSS)?'fg':'bg';
await P_acquire(lane);
const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||(lane==='fg'?60000:180000));
try{
const o={cache:false,signal:ac.signal};if(tier)o.modelTier=tier;
const r=await SMP(sys+'\n\nGİRDİ:\n'+input,o);
if(r&&r.truncated){LASTERR='çıktı kesildi';return null}
const m=String(r&&r.text||'').match(/[\[{][\s\S]*[\]}]/);
if(m){const v=JSON.parse(m[0]);if(v&&typeof v==='object'){LASTERR='';return v}}
LASTERR='geçersiz yanıt';return null;
}catch(e){
const c=e&&e.code;
LASTERR=c==='rate_limited'?'çok fazla istek, biraz sonra yeniden dene':(e&&e.name==='AbortError')?'zaman aşımı':((e&&e.message)||'bağlantı hatası');
return null;
}finally{clearTimeout(tm);P_release(lane)}
}

const p=cur,gi=GI,g=p.groups&&p.groups[gi],t=$('#ap').value.trim();

if(!r){show(`<span class="bad2">Bot yanıt veremedi${LASTERR?' ('+esc(LASTERR)+')':''}. Tekrar dene.</span>`);return}
const skor=Math.max(0,Math.min(100,Math.round(Number(r.skor)||0)));
const bar=`<div class="bar"><i style="width:${skor}%"></i></div><div class="big">%${skor} benzerlik</div><div class="m">Geçiş puanı: %60</div>`;
if(skor>=60){
if(!g.ok){g.ok=true;p.prog.xp=(p.prog.xp||0)+15}
if(p.groups.every(x=>x.ok))p.prog.steps[6]=1;
save(p);
if(cur===p){renderHead();tickUI(p)}
SFX.win();
show(`${bar}<div class="good big">✅ Onaylandı</div><div>${esc(r.yorum||'')}</div>`);
}else show(`${bar}<div class="bad2 big">❌ Onaylanmadı</div><div>${esc(r.yorum||'')}</div>`);
}

async function askJ(sys, input, ms, tier) {

if (!SMP) {
LASTERR = 'yapay zeka bu sayfada açık değil';
return null;
}

await gateIn();

try {

const maxRetries = 3;
const baseWait = 1000;

for (let attempt = 0; attempt < maxRetries; attempt++) {

const ac = new AbortController();
const tm = setTimeout(() => ac.abort(), ms || (tier === 'quick' ? 60000 : 180000));

try {

const o = { cache: false, signal: ac.signal };

if (tier) o.modelTier = tier;

const r = await SMP(sys + '\n\nGİRDİ:\n' + input, o);

if (r && r.truncated) {
LASTERR = 'çıktı kesildi';
return null;
}

const m = String(r && r.text || '').match(/[\[{][\s\S]*[\]}]/);

if (m) {
const v = JSON.parse(m[0]);
if (v && typeof v === 'object') {
LASTERR = '';
return v;
}
}

LASTERR = 'geçersiz yanıt';

} catch (e) {

const c = e && e.code;

LASTERR = c === 'not_granted' ? 'izin verilmedi'
: c === 'rate_limited' ? 'çok fazla istek, biraz sonra yeniden dene'
: c === 'session_expired' ? 'oturumun yeniden açılması gerekiyor'
: (e && e.name === 'AbortError') ? 'zaman aşımı'
: ((e && e.message) || 'bağlantı hatası');

} finally {
clearTimeout(tm);
}

if (attempt < maxRetries - 1) {
await new Promise(res => setTimeout(res, baseWait * Math.pow(2, attempt)));
}
}

return null;

} finally {
gateOut();
}

}

async function genGroup(p,g){

const words=g.w.map(en=>p.items.find(x=>x.en===en)).filter(Boolean);

if(!words.length)return false;

let best=null,miss=[];

for(let t=0;t<3;t++){

const input='KALIPLAR: '+words.map(x=>x.en+(x.tr?` (${x.tr})`:'')).join(' | ')+(t&&miss.length?'\nÖZELLİKLE ŞUNLAR PARAGRAFTA GEÇMELİ: '+miss.join(' | '):'');

const r=await askJ(PARA_G,input);

if(!r||typeof r.par!=='string'||!r.par.trim())continue;

const m=words.map(x=>x.en).filter(en=>!covered(r.par,en));

if(!best||m.length<best.m.length)best={par:r.par.trim(),ana:String(r.ana_fikir||'').trim(),gl:lowerKeys(r.gl),m};

miss=m;

if(!m.length)break;

}

if(!best)return false;

if(!g.text||best.m.length<(g.miss||[]).length)Object.assign(g,{text:best.par,ana:best.ana,gl:best.gl,miss:best.m});

return true;

}

})();

}

 </section>

       ${MODES.map((m,i)=>`<button class="mcard ${S[i]?'done':''}" data-open="${i}" ${hasTr?'':'disabled'}><span class="tag">${S[i]?'Tamamlandı':(hasTr?'Başla':'Bekliyor')}</span><span class="ic">${m.ic}</span><h3>${m.n}</h3><p>${m.d}</p></button>`).join('')}

function runStep(i){
[startKart,mstart,()=>qstart('sec'),ystart,()=>qstart('boss'),()=>qstart('cum'),pview][i]();
}

step=-1;
$('#act').hidden=true;$('#home').hidden=false;$('#hearts').hidden=true;
renderHome();renderEnr();renderFoot();
window.scrollTo(0,0);
}

function pick(id){cur=packs.find(p=>p.id===id)||packs[0];GI=0;showHome()}

function tickUI(p){
if(cur!==p)return;
const el=$('#gprog');if(el)el.textContent=progTxt(p);
renderFoot();

}

function refreshWait(p){if(cur===p&&step>=0&&$('#st [data-wait]'))runStep(step)}

function waitBox(){

}

/* ---------- Kartlar ---------- */

function startKart(){
const pool=cur.items.filter(x=>x.tr);
if(!pool.length||FILL[cur.id]){$('#st').innerHTML=waitBox();return}
deck=shuf(pool).sort((a,b)=>bx(a)-bx(b));di=0;flip=false;drawK();
}

function drawK(){
if(di>=deck.length){
cur.prog.steps[0]=1;save();renderHead();setProg(100);
$('#st').innerHTML=`<div class="result">${mascot('wink',110)}<div class="eyebrow" style="margin-top:12px">Kartlar</div><h2>Kartlar tamam!</h2><p class="m">${deck.length} kelime tekrarlandı</p><div class="row2"><button class="btn3" data-open="1">Eşleştir →</button><button class="btn-ghost" data-home="1">Ana sayfa</button></div></div>`;
return;
}
const x=deck[di];SRC=x;
setProg(di/deck.length*100);
const ex=x.s?`<div class="ex">${sent(x.s)}</div>`:'<div class="ex m">Örnek cümle hazırlanıyor…</div>';
$('#st').innerHTML=`
   <div class="coach">${mascot('',66)}<div class="bubble">Kartı çevir, anlamını gör.</div></div>
   <div class="m" style="text-align:center;margin-bottom:8px">${di+1} / ${deck.length} · Kutu ${bx(x)}</div>
   <div class="flip ${flip?'is':''}" id="cd" role="button" tabindex="0" aria-label="Kartı çevir">
     <div class="face front"><div class="eyebrow">English</div><div class="big">${esc(x.en)}</div><div class="m">Dokun ve çevir · Boşluk</div></div>
     <div class="face back"><div class="eyebrow" style="text-align:center">Türkçe</div><div class="big tr">${esc(x.tr)}</div>${ex}${x.st?`<div class="m" id="trs" hidden style="margin-top:8px">${esc(x.st)}</div>`:''}<div class="tip" id="tip">${tipHtml()}</div></div>
   </div>
   <div class="row"><button class="pill" data-say="${esc(x.en.split(/\s*[\/~]\s*/)[0])}">🔊 Dinle</button>${x.st?'<button class="pill" id="tt">🇹🇷 Çeviri</button>':''}</div>
   <div class="row2"><button class="btn-ghost" id="no">Bilmiyorum (1)</button><button class="btn3" id="yes">Biliyorum (2)</button></div>`;
}

function flipCard(){flip=!flip;const c=$('#cd');if(c)c.classList.toggle('is',flip)}

function kartAns(know){
const x=deck[di];if(!x)return;
cur.prog.box[x.en]=know?Math.min(5,bx(x)+1):1;
META.kart=(META.kart||0)+1;
if(know){xp(5);SFX.ok()}
saveMeta();
di++;flip=false;drawK();save();
}

/* ---------- Eşleştir ---------- */

function markM(en){cur.prog.mdone=[...new Set([...(cur.prog.mdone||[]),en])]}

function mstart(){
const all=cur.items.filter(x=>x.tr);
if(!all.length||FILL[cur.id]){$('#st').innerHTML=waitBox();return}
const got=new Set(cur.prog.mdone||[]),rem=all.filter(x=>!got.has(x.en));
setProg((all.length-rem.length)/all.length*100);
if(!rem.length){
cur.prog.steps[1]=1;save();renderHead();
$('#st').innerHTML=`<div class="result">${mascot('wink',110)}<div class="eyebrow" style="margin-top:12px">Eşleştir</div><h2>Eşleştirme tamam!</h2><div class="row2"><button class="btn3" data-open="2">Seç →</button><button class="btn-ghost" data-home="1">Ana sayfa</button></div></div>`;
return;
}
rd=shuf(rem).slice(0,6);md=new Set();sL=sR=bL=bR=null;
const ix=shuf(rd.map((_,i)=>i)),jx=shuf(rd.map((_,i)=>i));
$('#st').innerHTML=`<div class="coach">${mascot('',66)}<div class="bubble">Soldan kelimeyi, sağdan anlamını seç.</div></div>
 <div class="qbox"><div class="m">${all.length-rem.length}/${all.length} eşleşti</div>
   <div class="tiles"><div class="stackc">${ix.map(i=>`<button class="tile" data-l="${i}">${esc(rd[i].en)}</button>`).join('')}</div><div class="stackc">${jx.map(i=>`<button class="tile" data-r="${i}">${esc(rd[i].tr)}</button>`).join('')}</div></div>
   <div class="fb" id="fb"></div><div class="row" id="nrw"></div></div>`;
}

function paintM(){
document.querySelectorAll('[data-l]').forEach(b=>{const i=+b.dataset.l;b.className='tile'+(md.has(i)?' gone':'')+(sL===i?' sel':'')+(bL===i?' bad':'')});
document.querySelectorAll('[data-r]').forEach(b=>{const i=+b.dataset.r;b.className='tile'+(md.has(i)?' gone':'')+(sR===i?' sel':'')+(bR===i?' bad':'')});
}

function mclick(b){
const L=b.hasAttribute('data-l'),i=+(L?b.dataset.l:b.dataset.r);
if(md.has(i))return;
if(L)sL=i;else sR=i;
if(sL==null||sR==null){paintM();return}
const a=sL,c=sR;sL=sR=null;
if(a===c){md.add(a);markM(rd[a].en);xp(5);SFX.ok()}
else{bL=a;bR=c;SFX.bad();setTimeout(()=>{bL=bR=null;paintM()},450)}
paintM();
if(md.size===rd.length){$('#fb').innerHTML='<span class="good">✅ Tur tamam</span>';$('#nrw').innerHTML='<button class="btn3" id="nr">Sonraki tur</button>'}
}

/* ---------- Seç / Boss / Cümle ---------- */

function mkQ(sentOnly){

const xs=cur.items.filter(x=>x.tr);

if(sentOnly){

const cs=xs.filter(x=>x.s&&x.st);

for(const x of shuf(cs)){

const d=[...x.d,...shuf(cs.filter(o=>o!==x).map(o=>o.st))].filter((v,i,a)=>v&&v!==x.st&&a.indexOf(v)===i).slice(0,3);

if(d.length===3)return {k:'s',q:x.s,ans:x.st,opts:shuf([x.st,...d]),x};

}

return null;

}

const x=rnd(xs),dirEn=Math.random()<.5,key=o=>dirEn?o.tr:o.en,ans=key(x);

return {k:'w',dirEn,q:dirEn?x.en:x.tr,ans,opts:shuf([ans,...shuf(xs.filter(o=>o!==x&&key(o)!==ans)).slice(0,3).map(key)]),x};

}

function qstart(m){qmode=m;qi=0;qok=0;lives=m==='boss'?3:99;qNext()}

function qTotal(){return qmode==='boss'?10:qmode==='cum'?6:12}

function setHearts(){
const hs=$('#hearts');
if(qmode==='boss'){hs.hidden=false;hs.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives))}
else hs.hidden=true;
}

function qNext(){

const total=qTotal();

if(qi>=total||lives<=0)return qEnd(lives>0);

if(!cur.items.some(x=>x.tr)||FILL[cur.id]){$('#st').innerHTML=waitBox();return}

if(qmode==='cum'&&!cur.items.some(x=>x.s&&x.st)){$('#st').innerHTML=`<div class="qbox waitc" data-wait="1"><div class="eyebrow">Cümle</div><p class="m">Cümleler henüz hazırlanıyor… Hazırlamak için yukarıdaki “Hazırla” düğmesine bas.</p><div class="row"><button class="pill" id="re">Yeniden dene</button></div></div>`;return}

const q=Q=(qmode==='cum'&&mkQ(true))||mkQ(false);q.done=0;SRC=null;
setProg(qi/total*100);setHearts();

const label=qmode==='boss'?`Boss · ${qi+1}/10`:qmode==='cum'?`Cümle · ${qi+1}/6`:`Seç · ${qi+1}/12`;

$('#st').innerHTML=`<div class="coach">${mascot('',66)}<div class="bubble">${esc(rnd(CHEER))}</div></div>
 <div class="qbox">
   <div class="eyebrow">${label}</div>
   ${q.k==='s'
     ?`<div class="m" style="margin:-4px 0 8px">Bu cümlenin anlamı hangisi?</div><div class="ex" style="margin-top:0">${sent(q.q)}</div><div class="row" style="justify-content:flex-start"><button class="pill" data-say="${esc(q.q)}">🔊 Dinle</button></div>`
     :`<div class="m" style="margin:-4px 0 4px">${q.dirEn?'İngilizce → Türkçe':'Türkçe → İngilizce'}</div><h2 class="q">${esc(q.q)}</h2>${q.dirEn?`<div class="row" style="justify-content:flex-start"><button class="pill" data-say="${esc(q.x.en.split(/\s*[\/~]\s*/)[0])}">🔊 Dinle</button></div>`:''}`}
   <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>
   <div class="row"><button class="btn3" id="nx" hidden>Sonraki →</button></div>
 </div>`;
}

function qAns(i){
if(!Q||Q.done)return;Q.done=1;
const ok=Q.opts[i]===Q.ans;
document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(Q.opts[k]===Q.ans)b.classList.add('ok');else if(k===i)b.classList.add('no')});
META.tot=(META.tot||0)+1;
if(ok){META.ok=(META.ok||0)+1;qok++;xp(10);SFX.ok()}
else{lives--;SFX.bad()}
saveMeta();
setHearts();
$('#fb').innerHTML=(ok?'<span class="good">✅ Doğru</span>':'<span class="bad2">❌ Doğru cevap: '+esc(Q.ans)+'</span>')+`<div class="m">${esc(Q.x.en)} = ${esc(Q.x.tr)}</div>`;
$('#nx').hidden=false;
}

function qEnd(won){
const K={sec:2,yaz:3,boss:4,cum:5}[qmode];
if(won){cur.prog.steps[K]=1;xp(20);save();SFX.win();confetti()}
renderHead();
$('#hearts').hidden=true;
setProg(100);
$('#st').innerHTML=`<div class="result">${mascot(won?'wink':'sad',110)}<div class="eyebrow" style="margin-top:12px">${esc(MODES[K].n)}</div><h2>${won?'Tamamlandı!':'Canların bitti'}</h2><p class="m">${qok} doğru</p><div class="row2">${won?(K<6?`<button class="btn3" data-open="${K+1}">Sonraki mod →</button>`:''):'<button class="btn3" data-restart="1">Tekrar dene</button>'}<button class="btn-ghost" data-home="1">Ana sayfa</button></div></div>`;
}

/* ---------- Yaz ---------- */

function ystart(){qmode='yaz';qi=0;qok=0;ynext()}

function ynext(){
if(qi>=10)return qEnd(true);
if(!cur.items.some(x=>x.tr)||FILL[cur.id]){$('#st').innerHTML=waitBox();return}
const xs=cur.items.filter(x=>x.tr&&!x.en.includes('X'));
if(!xs.length){$('#st').innerHTML='<div class="qbox actempty"><p class="m">Bu listede yazma alıştırması için uygun kelime yok.</p></div>';return}
Q={x:rnd(xs),done:0};setProg(qi/10*100);
$('#st').innerHTML=`<div class="coach">${mascot('',66)}<div class="bubble">Doğru yazımı düşün, sonra kontrol et.</div></div>
 <div class="qbox"><div class="eyebrow">Yaz · ${qi+1}/10</div><h2 class="q">${esc(Q.x.tr)}</h2>
   <input class="txt" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="İngilizcesini yaz">
   <div class="row"><button class="btn3" id="ck">Kontrol et</button></div><div class="fb" id="fb"></div></div>`;
const a=$('#ans');if(a)a.focus();
}

function yCheck(){
if(!Q)return;
if(Q.done){qi++;ynext();return}
const inp=$('#ans');if(!inp)return;
const v=inp.value.trim().toLowerCase().replace(/[.,!?']/g,'').replace(/^to /,'');
if(!v)return;
Q.done=1;
const ok=Q.x.en.split(/\s*[\/~]\s*/).some(a=>a.trim().toLowerCase()===v);
META.tot=(META.tot||0)+1;
if(ok){META.ok=(META.ok||0)+1;qok++;xp(10);SFX.ok()}else SFX.bad();
saveMeta();
$('#fb').innerHTML=(ok?'<span class="good">✅ Doğru</span>':'<span class="bad2">❌ Doğru cevap: '+esc(Q.x.en)+'</span>');
$('#ck').textContent='Sonraki →';inp.disabled=true;
}

/* ---------- Paragraf ---------- */

const p=cur,G=p.groups||[];
const inG=new Set(G.flatMap(g=>g.w)),left=p.items.filter(x=>x.tr&&!inG.has(x.en)).length;
setProg(G.length?G.filter(x=>x.ok).length/G.length*100:0);
if(!G.length){
$('#st').innerHTML=left
?`<div class="qbox waitc" data-wait="1"><div class="eyebrow">Paragraf</div><p class="m">${left} kelime paragraflara bölünmeyi bekliyor.</p>${LASTERR?`<p class="m">Son hata: ${esc(LASTERR)}</p>`:''}<div class="row"><button class="btn3" id="pg">Paragrafları oluştur</button></div></div>`

return;
}

 <div class="m" id="gprog" style="margin-bottom:8px">${progTxt(p)}</div>

 <div class="qbox"${pending?' data-wait="1"':''}>
   <div class="eyebrow">Grup ${i+1}</div>
   ${g.text
     ?`<div class="para">${sent(g.text)}</div><div class="row" style="justify-content:flex-start"><button class="pill" data-say="${esc(g.text)}">🔊 Metni dinle</button></div>`
     :`<p class="m">${busy?'Bu grubun paragrafı oluşturuluyor…':'Bu grubun paragrafı oluşturulamadı.'}</p>${LASTERR&&!busy?`<p class="m">Son hata: ${esc(LASTERR)}</p>`:''}`}
   <div class="m" style="margin-top:10px">Kelimeler: ${g.w.map(w=>{const it=p.items.find(x=>x.en===w);return `<span class="chip">${esc(w)}${it&&it.tr?' = '+esc(it.tr):' (anlam eksik)'}</span>`}).join('')}</div>
   ${g.miss&&g.miss.length?`<div class="m" style="margin-top:6px">Metinde geçmeyen: ${g.miss.map(w=>esc(w)).join(', ')}</div>`:''}
   ${needRe?`<div class="row"><button class="pill" id="rg" data-gi="${i}">Bu grubu yeniden oluştur</button></div>`:''}
   <div class="tip" id="tip">${tipHtml()}</div>
 </div>
 ${g.text?`<div class="qbox"><div class="eyebrow">Ana düşünce</div><p class="m">Bu paragrafın Türkçe ana düşüncesini yaz; bot onaylayacak ya da onaylamayacak.</p><textarea id="ap" placeholder="Ana düşünce…"></textarea><div class="row"><button class="btn3" id="gr">Bota gönder</button></div><div class="fb" id="gfb">${g.ok?'<span class="good">✅ Bu grup onaylandı</span>':''}</div></div>`:''}
 <div class="row">${i>0?`<button class="pill" data-g="${i-1}">← Önceki</button>`:''}${i<G.length-1?`<button class="pill" data-g="${i+1}">Sonraki grup →</button>`:''}</div>`;
}

const FX={fg:0,bg:0},FXMAX={fg:2,bg:2},FXQ={fg:[],bg:[]};
function fxLock(l){
  if(FX[l]<FXMAX[l]){FX[l]++;return Promise.resolve()}
  return new Promise(r=>FXQ[l].push(r));
}
function fxUnlock(l){
  const n=FXQ[l].shift();
  if(n)n(); else FX[l]--;
}

async function askJ(sys,input,ms,tier){
  if(!SMP){LASTERR='yapay zeka bu sayfada açık değil';return null}
  const lane=(sys===GRADE||sys===GRADE2||sys===GLOSS)?'fg':'bg';
  await fxLock(lane);
  try{
    for(let attempt=0;attempt<2;attempt++){
      const ac=new AbortController();
      const tm=setTimeout(()=>ac.abort(),ms||(lane==='fg'?45000:120000));
      try{
        const o={cache:false,signal:ac.signal};
        if(tier)o.modelTier=tier;
        const r=await SMP(sys+'\n\nGİRDİ:\n'+input,o);
        if(r&&r.truncated){LASTERR='çıktı kesildi';return null}
        const m=String(r&&r.text||'').match(/[\[{][\s\S]*[\]}]/);
        if(m){const v=JSON.parse(m[0]);if(v&&typeof v==='object'){LASTERR='';return v}}
        LASTERR='geçersiz yanıt';
        return null;
      }catch(e){
        const c=e&&e.code;
        LASTERR=c==='rate_limited'?'çok fazla istek, biraz sonra yeniden dene':(e&&e.name==='AbortError')?'zaman aşımı':((e&&e.message)||'bağlantı hatası');
        if(c!=='rate_limited'||attempt===1)return null;
        await new Promise(res=>setTimeout(res,1500));
      }finally{clearTimeout(tm)}
    }
    return null;
  }finally{fxUnlock(lane)}
}

async function genGroup(p,g){
  const words=g.w.map(en=>p.items.find(x=>x.en===en)).filter(Boolean);
  if(!words.length)return false;
  let best=null,miss=[];
  for(let t=0;t<2;t++){
    const input='KALIPLAR: '+words.map(x=>x.en+(x.tr?` (${x.tr})`:'')).join(' | ')+(t&&miss.length?'\nÖZELLİKLE ŞUNLAR PARAGRAFTA GEÇMELİ: '+miss.join(' | '):'');
    const r=await askJ(PARA_G,input,120000,'quick');
    if(!r||typeof r.par!=='string'||!r.par.trim())continue;
    const m=words.map(x=>x.en).filter(en=>!covered(r.par,en));
    if(!best||m.length<best.m.length)best={par:r.par.trim(),ana:String(r.ana_fikir||'').trim(),gl:lowerKeys(r.gl),m};
    miss=m;
    if(!m.length)break;
  }
  if(!best)return false;
  if(!g.text||best.m.length<(g.miss||[]).length)Object.assign(g,{text:best.par,ana:best.ana,gl:best.gl,miss:best.m});
  return true;
}

async function grade(){
  const p=cur,gi=GI,g=p.groups&&p.groups[gi],t=$('#ap').value.trim();
  if(!t||!g||!g.text)return;
  const show=h=>{if(cur===p&&GI===gi&&step===6&&$('#gfb'))$('#gfb').innerHTML=h};
  show('<span class="m">Bot değerlendiriyor…</span>');
  const r=await askJ(GRADE2,`REFERANS ANA DÜŞÜNCE: ${g.ana||''}\nÖĞRENCİ CEVABI: ${t}`,45000,'quick');
  if(!r){show(`<span class="bad2">Bot yanıt veremedi${LASTERR?' ('+esc(LASTERR)+')':''}. Tekrar dene.</span>`);return}
  const skor=Math.max(0,Math.min(100,Math.round(Number(r.skor)||0)));
  const bar=`<div class="bar"><i style="width:${skor}%"></i></div><div class="big">%${skor} benzerlik</div><div class="m">Geçiş puanı: %60</div>`;
  if(skor>=60){
    if(!g.ok){g.ok=true;p.prog.xp=(p.prog.xp||0)+15;markDay();saveMeta()}
    if(p.groups.every(x=>x.ok))p.prog.steps[6]=1;
    save(p);
    renderHead();
    if(cur===p&&step===6&&GI===gi)pview();
    SFX.win();
    show(`${bar}<div class="good big">✅ Onaylandı</div><div>${esc(r.yorum||'')}</div>`);
  }else{
    show(`${bar}<div class="bad2 big">❌ Onaylanmadı</div><div>${esc(r.yorum||'')}</div>`);
  }
}

async function askJ(sys,input,ms,tier){
  if(!SMP){LASTERR='yapay zeka bu sayfada açık değil';return null}
  for(let attempt=0;attempt<3;attempt++){
    const ac=new AbortController();
    const tm=setTimeout(()=>ac.abort(),ms||(tier==='quick'?45000:120000));
    try{
      const o={cache:false,signal:ac.signal};
      if(tier)o.modelTier=tier;
      const r=await SMP(sys+'\n\nGİRDİ:\n'+input,o);
      if(r&&r.truncated){LASTERR='çıktı kesildi';return null}
      const m=String(r&&r.text||'').match(/[\[{][\s\S]*[\]}]/);
      if(m){const v=JSON.parse(m[0]);if(v&&typeof v==='object'){LASTERR='';return v}}
      LASTERR='geçersiz yanıt';
    }catch(e){
      const c=e&&e.code;
      LASTERR=c==='not_granted'?'izin verilmedi'
        :c==='rate_limited'?'çok fazla istek, biraz sonra yeniden dene'
        :c==='session_expired'?'oturumun yeniden açılması gerekiyor'
        :(e&&e.name==='AbortError')?'zaman aşımı'
        :((e&&e.message)||'bağlantı hatası');
    }finally{clearTimeout(tm)}
    await new Promise(res=>setTimeout(res,1000*Math.pow(2,attempt)));
  }
  return null;
}

/* ===== TÜM SİTE: SESLER SUNUCUDAKİ AMERİKAN SESİYLE ÇALAR ===== */
(function(){
  const cache=new Map();
  let audio=null, seq=0;
  const nativeSpeak=speechSynthesis.speak.bind(speechSynthesis);
  const nativeCancel=speechSynthesis.cancel.bind(speechSynthesis);

  async function cloud(text){
    let url=cache.get(text);
    if(!url){
      const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
      if(!r.ok) throw new Error('tts '+r.status);
      url=URL.createObjectURL(await r.blob());
      cache.set(text,url);
    }
    return url;
  }

  speechSynthesis.speak=function(u){
    const my=++seq, text=u.text||'', rate=u.rate||1;
    if(audio){try{audio.pause()}catch(e){}}
    cloud(text).then(url=>{
      if(my!==seq) return;
      audio=new Audio(url);
      audio.playbackRate=rate;
      return audio.play();
    }).catch(()=>{ if(my===seq) nativeSpeak(u); });
  };

  speechSynthesis.cancel=function(){
    seq++;
    if(audio){try{audio.pause()}catch(e){}}
    nativeCancel();
  };
})();
</script>

<script>
(function(){
  /* 0. SADECE SEÇİLEN 2 RENK PALETİ (1. AÇIK AKDENİZ, 2. KOYU AKDENİZ) */
  const VALID_PALS = ['akdeniz', 'derin_akdeniz'];
  const dotsEl = document.querySelector('.dots');
  if(dotsEl){
    dotsEl.innerHTML = `
      <button data-pal="akdeniz" title="🌿 Açık Akdeniz (Varsayılan)" aria-label="Açık Akdeniz" style="background:#0f766e"></button>
      <button data-pal="derin_akdeniz" title="🌌 Koyu Akdeniz (Derin Akdeniz Gecesi)" aria-label="Koyu Akdeniz" style="background:#061514;border-color:#14b8a6"></button>
    `;
  }
  setPal = function(n){
    const target = VALID_PALS.includes(n) ? n : 'akdeniz';
    document.body.dataset.pal = target;
    document.querySelectorAll('.dots button').forEach(b => b.classList.toggle('on', b.dataset.pal === target));
    try{ localStorage.setItem('ka_pal', target); localStorage.setItem('ka_pal_v3', target); }catch(e){}
  };
  try{
    const savedV3 = localStorage.getItem('ka_pal_v3') || localStorage.getItem('ka_pal');
    setPal(VALID_PALS.includes(savedV3) ? savedV3 : 'akdeniz');
  }catch(e){ setPal('akdeniz'); }

  /* ⚡ TURBO HIZ & PERFORMANS OTOMASYONU (4X PARALEL HAVUZ + KALICI AI ÖNBELLEĞİ + HIZLI RENDER) */
  let AI_CACHE = {};
  try{ AI_CACHE = JSON.parse(localStorage.getItem('ka_ai_cache_v2') || '{}') || {}; }catch(e){ AI_CACHE = {}; }
  let cacheSaveTimer = null;
  function saveAiCache(){
    clearTimeout(cacheSaveTimer);
    cacheSaveTimer = setTimeout(() => {
      try{
        const keys = Object.keys(AI_CACHE);
        if(keys.length > 600){
          keys.slice(0, keys.length - 500).forEach(k => delete AI_CACHE[k]);
        }
        localStorage.setItem('ka_ai_cache_v2', JSON.stringify(AI_CACHE));
      }catch(e){}
    }, 400);
  }
  function hashPrompt(s){
    let h = 2166136261;
    for(let i=0; i<s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + '_' + s.length;
  }

  async function turboPool(items, fn, conc = 4){
    let i = 0;
    const workers = Array.from({length: Math.min(conc, items.length)}, async () => {
      while(i < items.length){
        const it = items[i++];
        await fn(it);
      }
    });
    await Promise.all(workers);
  }

  const TURBO_GATE = { n: 0, max: 4, q: [] };
  function tAcquire(){
    if(TURBO_GATE.n < TURBO_GATE.max){ TURBO_GATE.n++; return Promise.resolve(); }
    return new Promise(r => TURBO_GATE.q.push(r));
  }
  function tRelease(){
    const nx = TURBO_GATE.q.shift();
    if(nx) nx(); else TURBO_GATE.n = Math.max(0, TURBO_GATE.n - 1);
  }

  askJ = async function(sys, input, ms, tier){
    if(!SMP){ LASTERR = 'yapay zeka bu sayfada açık değil'; return null; }
    const cacheKey = hashPrompt(sys.slice(0, 80) + '||' + input);
    if(sys !== GRADE && sys !== GRADE2 && AI_CACHE[cacheKey]){
      return JSON.parse(JSON.stringify(AI_CACHE[cacheKey]));
    }
    await tAcquire();
    try{
      for(let attempt=0; attempt<2; attempt++){
        const ac = new AbortController();
        const tm = setTimeout(() => ac.abort(), ms || (tier === 'quick' ? 40000 : 95000));
        try{
          const o = { cache: false, signal: ac.signal };
          if(tier) o.modelTier = tier;
          const r = await SMP(sys + '\n\nGİRDİ:\n' + input, o);
          if(r && r.truncated){ LASTERR = 'çıktı kesildi'; return null; }
          const m = String((r && r.text) || '').match(/[\[{][\s\S]*[\]}]/);
          if(m){
            const v = JSON.parse(m[0]);
            if(v && typeof v === 'object'){
              LASTERR = '';
              if(sys !== GRADE && sys !== GRADE2){
                AI_CACHE[cacheKey] = v;
                saveAiCache();
              }
              return v;
            }
          }
          LASTERR = 'geçersiz yanıt';
        }catch(e){
          const c = e && e.code;

  const FIXED_PHRASES = new Set([
    'have to do with','at stake','in danger','at risk','behind bars','take a toll',
    'account for','per capita','per person','a third','one third','invasion of privacy',
    'post-x','x-intensive','water-intensive'
  ]);

  function isTurkishSegment(s){
    const str = String(s || '').trim();
    if(!str) return false;
    if(/[çğıöşüİÇĞÖŞÜ]/.test(str)) return true;
    if(/\b[a-z]{2,}(mak|mek)\b/i.test(str)) return true;
    if(/\b(bir|ve|veya|ile|olan|etmek|olmak|yapmak|vermek|almak|tutmak|olarak|gibi|kadar|sonra|arasında|karşı|göre|ait|dair|ortak|rakip|rekabet|hanedan|veraset|varis|somut|hasat|tohum|miktar|hacim|bahane|verim|aciliyet|ittifak)\b/i.test(str)) return true;
    return false;
  }

  function splitEnglishEntry(enRaw){
    const clean = String(enRaw || '').trim();
    if(!clean) return [];
    if(/[\/~;,]/.test(clean)){
      const parts = clean.split(/\s*[\/~;,]\s*/).map(s=>s.trim()).filter(Boolean);
      if(parts.length > 1) return parts;
    }
    const low = clean.toLowerCase();
    if(!FIXED_PHRASES.has(low) && !/^(to|a|an|the|in|on|at|by|for|with|from|of|into|out)\b/i.test(low)){
      const words = clean.split(/\s+/);
      if(words.length === 2 && !words[0].includes('-') && !words[1].includes('-')){
        const stopWords = new Set(['of','to','in','on','for','with','at','by','from','up','out','off','down','over','under','as','be','have','take','make','get','give','keep','let','put','set']);
        if(!stopWords.has(words[0].toLowerCase()) && !stopWords.has(words[1].toLowerCase()) && words[0].length >= 4 && words[1].length >= 4){
          return [words[0], words[1]];
        }
      }
    }
    return [clean];
  }

  function smartParse(t){
    const rawLines = String(t || '').split(/\r?\n/)
      .map(l => l.replace(/[\u00a0 ]+/g,' ')
        .replace(/[A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ ]{2,}\s*[–-]\s*VOCAB/g,'')
        .replace(/^\s*(?:\d+[.)]|[•*·-])\s+/,'').trim())
      .filter(l => l && !/^[A-ZÇĞİÖŞÜ ]+$/.test(l));

    const out = [];
    const seen = new Set();

    for(const l of rawLines){
      const seg = l.split(/\s+:\s+|\s+[-–—]\s+|\s*\|\s*|\t+/).map(s=>s.trim()).filter(Boolean);
      let enSegments = [l], trPart = '';
      if(seg.length >= 2){
        let ti = seg.findIndex((s,i) => i > 0 && isTurkishSegment(s));
        if(ti === -1) ti = seg.length - 1;
        enSegments = seg.slice(0, ti);
        trPart = seg.slice(ti).join(', ');
      }
      for(const segEn of enSegments){
        const enList = splitEnglishEntry(segEn);
        for(const enItem of enList){
          const key = enItem.toLowerCase();
          if(seen.has(key)) continue;
          seen.add(key);
          out.push({ en: enItem, tr: trPart || '', baseTr: trPart || '' });
        }
      }
    }
    return out;
  }

  function splitCombinedItemsInPack(p){
    if(!p || !Array.isArray(p.items)) return;
    const newItems = [];
    const seen = new Set();
    let changed = false;

    for(const it of p.items){
      const parts = splitEnglishEntry(it.en);
      if(parts.length > 1){
        changed = true;
        for(const part of parts){
          const k = part.toLowerCase();
          if(seen.has(k)) continue;
          seen.add(k);
          const clone = Object.assign({}, it, {
            en: part,
            baseTr: it.baseTr || it.tr || ''
          });
          if(p.prog && p.prog.box && p.prog.box[it.en] && !p.prog.box[part]){
            p.prog.box[part] = p.prog.box[it.en];
          }
          newItems.push(clone);
        }
      } else {
        const k = String(it.en || '').toLowerCase();
        if(!seen.has(k)){
          seen.add(k);
          if(it.tr && !it.baseTr) it.baseTr = it.tr;
          newItems.push(it);
        }
      }
    }
    if(changed){
      p.items = newItems;
      p.words = newItems.map(x => ({ en: x.en, tr: x.tr || '' }));
    }
  }

  function combineTurengMeaning(baseTr, aiTr){
    const parts = [];
    const seen = new Set();
    const add = str => {
      String(str || '').split(/\s*[,;/]\s*/).forEach(piece => {
        const clean = piece.trim();
        const low = clean.toLowerCase();
        if(clean && !seen.has(low)){
          seen.add(low);
          parts.push(clean);
        }
      });
    };
    if(baseTr) add(baseTr);
    if(aiTr) add(aiTr);
    return parts.slice(0, 5).join(', ');
  }

                if(idx >= 0){
                  const replacements = o.split.filter(s => s && s.en).map(s => ({
                    en: String(s.en).trim(),
                    baseTr: x.baseTr || x.tr || '',
                    tr: combineTurengMeaning(x.baseTr || x.tr, s.tr || o.tr),
                    syn: Array.isArray(s.syn) ? s.syn : (Array.isArray(o.syn) ? o.syn : []),
                    turengDone: true,
                    d: [], gl: {}, mo: {}
                  }));
                  if(replacements.length){
                    p.items.splice(idx, 1, ...replacements);
                    return;
                  }
                }
              }
              if(validTr(o.tr, x.en)){
                x.tr = combineTurengMeaning(x.baseTr || x.tr, o.tr);
                x.turengDone = true;
              }
              if(Array.isArray(o.syn) && o.syn.length){

            refreshWait(p);

          save(p);

        todo = p.items.filter(x => !x.tr);

Her cümle için 3 adet YÜKSEK ÇELDİRİCİLİKLİ yanlış Türkçe çeviri ("d") üret:
1. KESİN UZUNLUK KURALI: Doğru çeviri ("st") en uzun şık OLMAMALIDIR! Ürettiğin 3 çeldiricinin en az 2 tanesi karakter ve kelime sayısı olarak "st" cümlesinden DAHA UZUN (2-5 kelime daha uzun), diğeri ise "st" ile aynı uzunlukta olmalıdır.
2. İNCE NÜANS KURALI: Çeldiriciler "st" cümlesinin tam zıttı olmamalıdır! Cümlenin %80'i "st" ile aynı kelimelerden oluşmalı, sadece bağlaç yönü (rağmen/dolayı), kesinlik derecesi (tamamen/kısmen/potansiyel olarak) veya hedef kelimenin akademik nüansı farklılaşmalıdır.
YALNIZCA geçerli JSON döndür: {"items":[{"i":1,"d":["çeldirici 1","çeldirici 2","çeldirici 3"]}]}`;

  function buildSubtleDistractors(x){
    const st = String(x.st || '').trim();
    if(!st) return [];
    let rawD = Array.isArray(x.d) ? x.d.map(s=>String(s||'').trim()).filter(s=>s && s!==st) : [];

    const nuanceVariants = [];
    const swaps = [
      [/(\b)rağmen(\b)/i, 'nedeniyle ve bunun doğrudan bir sonucu olarak'],
      [/(\b)için(\b)/i, 'rağmen ilgili süreçte beklenen düzeyde'],
      [/(\b)önemli(\b)/i, 'ikincil ve sınırlı düzeyde kalan'],
      [/(\b)büyük(\b)/i, 'kısmi ve yalnızca belirli koşullarda görülen'],
      [/(\b)art\w+/i, 'belirli dönemlerde kademeli olarak azalmakta ve sınırlandırılmaktadır'],
      [/(\b)azal\w+/i, 'kontrolsüz biçimde artış göstererek mevcut dengeleri zorlamaktadır'],
      [/(\b)engel\w+/i, 'dolaylı yoldan teşvik ederek sürecin hızlanmasına zemin hazırladı'],
      [/(\b)sağla\w+/i, 'ancak uzun vadede beklenen etkiyi yaratmakta yetersiz kaldı'],
      [/(\b)göster\w+/i, 'konusunda kesin bir kanıt sunmaktan ziyade tartışmalı bir varsayım öne sürmektedir'],
      [/(\b)olabilir/i, 'kaçınılmaz ve geri döndürülemez bir zorunluluk haline gelmiştir']
    ];
    for(const [rgx, rep] of swaps){
      if(rgx.test(st)){
        const v = st.replace(rgx, rep);
        if(v !== st) nuanceVariants.push(v);
      }
    }

    const academicExtensions = [
      ' ve bu durum ilgili alandaki mevcut uygulamaların kapsamını doğrudan etkilemektedir',
      '; ancak bu sürecin uzun vadeli sonuçları uzmanlar arasında hâlâ tartışılmaktadır',
      ' ve özellikle kurumsal düzeyde alınan kararların yeniden değerlendirilmesini gerektirmektedir',
      '; üstelik bu eğilim son dönemdeki akademik araştırmaların bulgularıyla da paralellik göstermektedir',
      ' ve söz konusu koşulların değişmesi halinde mevcut dengelerin tamamen farklılaşabileceği belirtilmektedir'
    ];

    const expandToMatchLength = (str, idx, minLen) => {
      let res = str.replace(/[.!?]+$/, '').trim();
      const stComma = st.indexOf(',');
      if(res.length < st.length * 0.72 && stComma > 15 && !res.startsWith(st.slice(0, 12))){
        res = st.slice(0, stComma + 1) + ' ' + res.charAt(0).toLowerCase() + res.slice(1);
      }
      let extIdx = (idx + st.length) % academicExtensions.length;
      while(res.length < minLen){
        res += academicExtensions[extIdx % academicExtensions.length];
        extIdx++;
      }
      return res + '.';
    };

    const pool = [...rawD, ...nuanceVariants].filter((v,i,a) => v && v !== st && a.indexOf(v) === i);
    while(pool.length < 3){
      const base = st.replace(/[.!?]+$/, '');
      if(pool.length === 0) pool.push(base + '; ancak bu durum yalnızca belirli istisnai koşullar altında geçerliliğini korumaktadır.');
      else if(pool.length === 1) pool.push('İlk bakışta öyle görünse de, ' + base.charAt(0).toLowerCase() + base.slice(1) + ' iddiası henüz kesinlik kazanmamıştır.');
      else pool.push(base + ' ve bu gelişme başlangıçta öngörülen hedeflerin tam aksine bir tablo ortaya çıkarmıştır.');
    }

    const chosen = pool.slice(0, 3);
    return chosen.map((dStr, idx) => {
      const targetLen = idx < 2 ? (st.length + 6 + idx * 8) : Math.max(dStr.length, st.length - 4);
      if(dStr.length < targetLen){
        return expandToMatchLength(dStr, idx, targetLen);
      }
      return dStr;
    });
  }

  let DIST_RUN = {};
  async function upgradePackDistractors(p){
    if(!p || DIST_RUN[p.id] || !SMP) return;
    const need = (p.items || []).filter(x => x.s && x.st && (!x.dV2 || !Array.isArray(x.d) || x.d.length < 3 || Math.max(0, ...x.d.map(s=>String(s||'').length)) <= x.st.length));
    if(!need.length) return;
    DIST_RUN[p.id] = 1;
    try{
      const ch = [];
      for(let i=0; i<need.length; i+=8) ch.push(need.slice(i, i+8));
      await turboPool(ch, async c => {
        const inp = c.map((x,i) => `${i+1}.\nEN: ${x.s}\nDOĞRU TR (st): ${x.st}`).join('\n\n');
        const r = await askJ(DIST_UPGRADE_SYS, inp, 75000, 'quick');
        if(r && Array.isArray(r.items)){
          r.items.forEach(o => {
            const x = c[Number(o && o.i) - 1];
            if(x && Array.isArray(o.d) && o.d.length >= 3){
              x.d = o.d.map(s => String(s || '').trim()).filter(Boolean);
              x.dV2 = true;
            }
          });
          save(p);
        }
      }, 4);
    }finally{
      delete DIST_RUN[p.id];
    }
  }

                it.dV2 = true;

      await Promise.all([

      await shareDef(p);
      const G=p.groups||[], inT=new Set(G.filter(g=>g.text).flatMap(g=>g.w));
      const noTr=p.items.filter(x=>!x.tr).length, noS=p.items.filter(x=>x.tr&&!x.s).length, noG=p.items.filter(x=>x.tr&&!inT.has(x.en)).length;
      const parts=[];
      if(noTr) parts.push(`${noTr} kelimenin anlamı yok`);
      if(noS) parts.push(`${noS} kelimenin cümlesi yok`);

      upd(parts.length?`Eksikler: ${parts.join(' · ')}${LASTERR?' · Neden: '+LASTERR:''}`:'', parts.length>0, LASTERR);
      refreshWait(p);
      if(cur===p && step===-1) renderHome();
    }catch(e){ upd('Hata: '+e.message,true,'hata'); }
    finally{ delete RUN[p.id]; }
  };

  /* ============================================================================
     OTOMASYON 3B: SEÇ, YAZ, CÜMLE MODLARINDA LİSTEDEKİ TÜM KELİMELERİ KULLANMA,
     YAZMA MODUNDA YAKIN KELİMELERE 2. HAK ("ÇOK YAKLAŞTIN!") &
     KARIŞIK MEGA BOSS DÜELLOSU (SEÇ + CÜMLE + HIZLI EŞLEŞTİR + YAZMA)

  let Q_DECK = [];
  let Y_DECK = [];
  let BOSS_QUEUE = [];

  /* Damerau-Levenshtein Yakınlık Mesafesi (Harf hatası, eksik/fazla harf ve yer değiştirme algılar) */
  function editDistance(a, b){
    a = String(a||'').toLowerCase().trim();
    b = String(b||'').toLowerCase().trim();
    const al = a.length, bl = b.length;
    if(!al) return bl;
    if(!bl) return al;
    const dp = Array.from({length: al + 1}, () => Array(bl + 1).fill(0));
    for(let i=0; i<=al; i++) dp[i][0] = i;
    for(let j=0; j<=bl; j++) dp[0][j] = j;
    for(let i=1; i<=al; i++){
      for(let j=1; j<=bl; j++){
        const cost = a[i-1] === b[j-1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i-1][j] + 1,
          dp[i][j-1] + 1,
          dp[i-1][j-1] + cost
        );
        if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
          dp[i][j] = Math.min(dp[i][j], dp[i-2][j-2] + cost);
        }
      }
    }
    return dp[al][bl];
  }

  function isCloseWordMatch(typed, targetWord){
    const v = String(typed||'').toLowerCase().trim();
    const variants = String(targetWord||'').split(/\s*[\/~]\s*/).map(s=>s.trim().toLowerCase()).filter(Boolean);
    for(const t of variants){
      if(v === t) return false;
      const dist = editDistance(v, t);
      const maxAllowed = t.length <= 4 ? 1 : (t.length <= 8 ? 2 : 3);
      if(dist >= 1 && dist <= maxAllowed) return { target: t, dist };
      /* İlk 3 harfi aynı ve uzunluk farkı en fazla 2 ise */
      if(t.length >= 5 && v.length >= 3 && t.slice(0,3) === v.slice(0,3) && Math.abs(t.length - v.length) <= 2){
        return { target: t, dist };
      }
    }
    return null;
  }

  function buildWordQuizQuestion(x, xs, customSubType){
    const dirEn = customSubType === 'pair' ? false : (Math.random() < .5);
    const key = o => dirEn ? o.tr : o.en;
    const ans = key(x);
    const xMeanings = new Set(String(x.tr||'').toLowerCase().split(/\s*[,;/]\s*/).filter(Boolean));
    const distPool = shuf(xs.filter(o => {
      if(o === x || key(o) === ans) return false;
      const oMeanings = String(o.tr||'').toLowerCase().split(/\s*[,;/]\s*/).filter(Boolean);
      return !oMeanings.some(m => xMeanings.has(m));
    })).slice(0, 3).map(key);
    return { k:'w', sub: customSubType || 'sec', dirEn, q:dirEn ? x.en : x.tr, ans, opts:shuf([ans, ...distPool]), x };
  }

  function buildSentQuizQuestion(x){
    upgradePackDistractors(cur);
    const d = buildSubtleDistractors(x);
    return { k:'s', sub:'cum', q:x.s, ans:x.st, opts:shuf([x.st, ...d]), x };
  }

  mkQ = function(sentOnly){
    const xs = cur.items.filter(x=>x.tr);
    if(sentOnly){
      const cs = xs.filter(x=>x.s && x.st);
      if(!cs.length) return null;
      const targetX = (Q_DECK && Q_DECK[qi]) ? Q_DECK[qi] : rnd(cs);
      return buildSentQuizQuestion(targetX);
    }
    const targetX = (Q_DECK && Q_DECK[qi]) ? Q_DECK[qi] : rnd(xs);
    return buildWordQuizQuestion(targetX, xs, 'sec');
  };

  qTotal = function(){
    if(!cur || !Array.isArray(cur.items)) return 10;
    const xs = cur.items.filter(x => x.tr);
    if(qmode === 'boss') return Math.min(12, Math.max(1, xs.length));
    if(qmode === 'cum'){
      const cs = xs.filter(x => x.s && x.st);
      return Math.max(1, cs.length);
    }
    if(qmode === 'sec'){
      return Math.max(1, xs.length);
    }
    return Math.max(1, xs.length);
  };

  qstart = function(m){
    qmode = m; qi = 0; qok = 0;
    lives = m === 'boss' ? 3 : 9999;
    const xs = cur ? cur.items.filter(x => x.tr) : [];
    if(m === 'sec'){
      Q_DECK = shuf([...xs]);
    } else if(m === 'cum'){
      const cs = xs.filter(x => x.s && x.st);
      Q_DECK = shuf([...cs]);
    } else if(m === 'boss'){
      /* BOSS RİNGİ: Önceki tüm etkinliklerin (Seç + Eşleştir + Cümle + Yazma) 12 soruluk karma düellosu! */
      const bossCount = Math.min(12, Math.max(1, xs.length));
      const pickedWords = shuf([...xs]).slice(0, bossCount);
      const sentCapable = xs.filter(x => x.s && x.st);
      const writeCapable = xs.filter(x => x.tr && !x.en.includes('X'));
      const cycle = ['sec', 'pair', 'yaz', 'cum'];
      BOSS_QUEUE = pickedWords.map((w, idx) => {
        let t = cycle[idx % cycle.length];
        if(t === 'cum' && (!w.s || !w.st)){
          if(sentCapable.length) w = sentCapable[idx % sentCapable.length];
          else t = 'sec';
        }
        if(t === 'yaz' && w.en.includes('X')){
          if(writeCapable.length) w = writeCapable[idx % writeCapable.length];
          else t = 'pair';
        }
        if(t === 'cum') return buildSentQuizQuestion(w);
        if(t === 'yaz') return { k:'y', sub:'yaz', x:w, tries:0, done:0 };
        if(t === 'pair') return buildWordQuizQuestion(w, xs, 'pair');
        return buildWordQuizQuestion(w, xs, 'sec');
      });
    }
    qNext();
  };

  ystart = function(){
    qmode = 'yaz'; qi = 0; qok = 0; lives = 9999;
    const xs = cur ? cur.items.filter(x => x.tr && !x.en.includes('X')) : [];

    ynext();
  };

  yCheck = function(){
    if(!Q) return;
    if(Q.done){
      qi++;
      if(qmode === 'boss') qNext(); else ynext();
      return;
    }
    const inp = $('#ans'); if(!inp) return;
    const v = inp.value.trim().toLowerCase().replace(/[.,!?']/g,'').replace(/^to /,'');
    if(!v) return;

    const targetVariants = Q.x.en.split(/\s*[\/~]\s*/).map(a=>a.trim().toLowerCase());
    const ok = targetVariants.includes(v);

    if(!ok){
      /* 1) Aynı listedeki eş anlamlı kelime yazıldıysa hak yemeden ipucu ver */
      const qMeanings = new Set(String(Q.x.tr||'').toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(Boolean));
      const synMatch = cur.items.find(other => {
        if(other === Q.x) return false;
        const otherEn = other.en.toLowerCase().trim();
        if(otherEn !== v) return false;
        const otherMeanings = String(other.tr||'').toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(Boolean);
        return otherMeanings.some(m => qMeanings.has(m));
      });
      if(synMatch){
        const hintWord = Q.x.en.trim();
        SFX.ok();
        $('#fb').innerHTML = `<div class="close-box">💡 <b>"${esc(v)}"</b> kelimesi de bu anlama gelir; harika! Ama bu soruda listedeki <b>diğer eş anlamlı kelimeyi</b> bulmalısın.<br>İpucu: <b>${esc(hintWord.slice(0,2))}…</b> (${hintWord.length} harfli)</div>`;
        inp.value = '';
        inp.focus();
        return;
      }

      /* 2) Gerçek kelimeye çok yakın yazıldıysa 2. bir hak tanı! */
      const closeInfo = isCloseWordMatch(v, Q.x.en);
      if(closeInfo && (Q.tries || 0) < 1){
        Q.tries = (Q.tries || 0) + 1;
        const hintWord = closeInfo.target;
        const revealCount = Math.min(2, Math.max(1, Math.floor(hintWord.length / 3)));
        const masked = hintWord.slice(0, revealCount) + '•'.repeat(Math.max(1, hintWord.length - revealCount - 1)) + (hintWord.length > 3 ? hintWord.slice(-1) : '');
        SFX.ok();
        $('#fb').innerHTML = `
          <div class="close-box">
            🔥 <b>Çok yaklaştın!</b> <i>"${esc(v)}"</i> yazdın — ufak bir harf farkı var.<br>
            🎯 <b>2. Hakkın Aktif:</b> İpucu: <b style="color:var(--p);letter-spacing:1px">${esc(masked)}</b> (${hintWord.length} harfli). Tekrar dene!
          </div>`;
        inp.focus();
        try{ inp.select(); }catch(e){}
        return;
      }
    }

    Q.done = 1;
    META.tot = (META.tot||0) + 1;
    if(ok){
      META.ok = (META.ok||0) + 1; qok++; xp(10); SFX.ok();
      setCombo(COMBO + 1);
    } else {
      if(qmode === 'boss') lives--;
      SFX.bad();
      setCombo(0);
    }
    saveMeta();
    setHearts();
    say(Q.x.en);
    $('#fb').innerHTML = (ok
      ? `<span class="good">✅ Doğru!${Q.tries ? ' (2. hakkında tam isabet!)' : ''}</span>`
      : `<span class="bad2">❌ Doğru cevap: <b>${esc(Q.x.en)}</b></span>`) +
      ` <button type="button" class="pill" style="padding:3px 10px;font-size:12px;margin-left:6px" data-say="${esc(Q.x.en)}">🔊 Amerikan Aksanıyla Dinle</button>`;
    $('#ck').textContent = 'Sonraki →';
    inp.disabled = true;
  };

  /* ============================================================================
     OTOMASYON 4: PDF AYRIŞTIRMA & HER YENİ LİSTEDE TAMAMLANMA DURUMUNU SIFIRLAMA
     ============================================================================ */
  importFile = async function(f){
    if(!f) return;
    const out = $('#pfs');
    if(out) out.textContent = 'Okunuyor ve birleşik kelimeler ayrıştırılıyor…';
    try{
      const ext = f.name.split('.').pop().toLowerCase();
      let txt = '';
      if(ext === 'pdf'){
        await lib(PDFJS, 'pdfjsLib');
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW;
        const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
        for(let n=1; n<=pdf.numPages; n++){
          const c = await (await pdf.getPage(n)).getTextContent();
          let line = '', lx = null;
          for(const it of c.items){
            if(it.str){
              if(lx !== null && it.transform[4] - lx > 20) line += '\t';
              line += it.str;
              lx = it.transform[4] + (it.width || 0);
            }
            if(it.hasEOL){ txt += line + '\n'; line = ''; lx = null; }
          }
          txt += line + '\n';
        }
      } else if(ext === 'docx'){
        await lib(MAMMOTH, 'mammoth');
        const {value} = await mammoth.convertToHtml({arrayBuffer: await f.arrayBuffer()});
        txt = [...new DOMParser().parseFromString(value, 'text/html').querySelectorAll('p,tr')]
          .filter(el => el.tagName === 'TR' || !el.closest('table'))
          .map(el => el.tagName === 'TR' ? [...el.children].map(c => c.textContent.trim()).join('\t') : el.textContent)
          .join('\n');
      } else {
        txt = await f.text();
      }
      const separated = smartParse(txt);
      const ta = $('#pw');
      if(ta && separated.length){
        const formatted = separated.map(w => w.tr ? `${w.en} - ${w.tr}` : w.en).join('\n');
        ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + formatted;
      }
      if(out){
        out.textContent = separated.length
          ? `✅ ${separated.length} ayrı İngilizce kelime ayrıştırıldı (birleşik kelimeler ayrıldı). Oluşturduğunda Tureng yaygın anlamları eklenecek!`

  loadShared = async function(p){
    if(!p || p.id !== 'def' || !DB) return;
    try{
      const s = await DB.doc('shared/def').get();
      if(!s.exists) return;
      const d = JSON.parse(JSON.stringify(s.data()));
      if(Array.isArray(d.items)){
        p.items.forEach(x => {
          const low = x.en.toLowerCase().trim();
          const y = d.items.find(it => it && (it.en.toLowerCase().trim() === low || it.en.toLowerCase().split(/\s*[\/~;,]\s*/).map(v=>v.trim()).includes(low)));
          if(y){
            if(!x.tr && y.tr) x.tr = y.tr;
            if(!x.baseTr && y.tr) x.baseTr = y.tr;
            if(!x.s && y.s){ x.s = y.s; x.st = y.st || ''; x.d = y.d || []; x.gl = y.gl || {}; x.mo = y.mo || {}; }
          }
        });
      }
      if(Array.isArray(d.groups) && !(p.groups || []).length) p.groups = d.groups;
      if(d.dict && typeof d.dict === 'object') p.dict = Object.assign({}, d.dict, p.dict || {});

      localStorage.setItem('db:data/users/' + uid + '/' + id, JSON.stringify(b));

      localStorage.setItem('ka_user_pack_ids', JSON.stringify(backupIds));

    clearTimeout(p._t);

        await DB.collection('data/users/' + UID).doc(id).set(b);

  function isUntouchedDefaultPack(p){
    if(!p || p.id !== 'def') return false;
    const xpVal = (p.prog && p.prog.xp) || 0;
    const anyStep = p.prog && Array.isArray(p.prog.steps) && p.prog.steps.some(Boolean);
    const anyBoxMoved = p.prog && p.prog.box && Object.values(p.prog.box).some(v => v > 1);
    const optedIn = localStorage.getItem('ka_keep_buept_def') === '1';
    return !optedIn && xpVal === 0 && !anyStep && !anyBoxMoved;
  }

  function cleanUnwantedDefaultPack(){
    if(!Array.isArray(packs)) return;
    const defPack = packs.find(p => p && p.id === 'def');
    if(defPack && isUntouchedDefaultPack(defPack)){
      packs = packs.filter(p => p && p.id !== 'def');
      try{
        const uid = UID || localUid();
        localStorage.removeItem('db:data/users/' + uid + '/def');
      }catch(e){}
    }
    const savedActiveId = localStorage.getItem('ka_active_pack_id');
    if(packs.length > 0){
      const preferred = (savedActiveId && packs.find(p => p.id === savedActiveId)) || packs[packs.length - 1] || packs[0];
      cur = preferred;
    } else {
      cur = null;
    }
  }

  function polarToCartesian(cx, cy, r, angleDeg){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
  }
  function describeArc(cx, cy, r, startAngle, endAngle){
    const start = polarToCartesian(cx, cy, r, endAngle);
    const end = polarToCartesian(cx, cy, r, startAngle);
    const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
    return ["M", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y].join(" ");
  }
  function build7ArcsSVG(cx, cy, r, stepsArr, newlyIdx, strokeW){
    const total = 7, stepAngle = 360 / total, gap = 9;
    let html = '';
    for(let i=0;i<total;i++){
      const a1 = i * stepAngle + gap/2;
      const a2 = (i+1) * stepAngle - gap/2;
      const d = describeArc(cx, cy, r, a1, a2);
      let cls = 'ring-seg idle';
      if(i === newlyIdx) cls = 'ring-seg newly-conquered';
      else if(stepsArr[i]) cls = 'ring-seg done';
      html += `<path class="${cls}" style="stroke-width:${strokeW}px" d="${d}"/>`;
    }
    return html;
  }
  function getArenaRank(xpVal, doneCount){
    if(doneCount === 7 || xpVal >= 600) return '👑 Arena Efsanesi';
    if(doneCount >= 5 || xpVal >= 350) return '🏆 Kolezyum Şampiyonu';
    if(doneCount >= 3 || xpVal >= 180) return '⚔️ Kelime Gladyatörü';
    if(doneCount >= 1 || xpVal >= 60) return '🛡️ Arena Muhafızı';
    return '🌱 Çaylak Savaşçı';
  }
  function spawnSparks(x, y, count=26){
    const cx = x || window.innerWidth/2, cy = y || window.innerHeight/2;
    const cols = ['#fbbf24','#fef08a','#10b981','#6366f1','#8b5cf6','#f43f5e'];
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'spark-pt';
      const sz = 5 + Math.random()*6;
      s.style.width = sz+'px'; s.style.height = sz+'px';
      s.style.left = cx+'px'; s.style.top = cy+'px';
      s.style.background = cols[i%cols.length];
      const ang = (Math.PI*2*i)/count + (Math.random()-.5)*.3, dist = 45 + Math.random()*135;
      s.style.setProperty('--tx', Math.cos(ang)*dist+'px');
      s.style.setProperty('--ty', (Math.sin(ang)*dist - 25)+'px');
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 850);
    }
  }

  const SYN_AI_SYS = `Sen akademik İngilizce (BUEPT/IELTS) kelime uzmanısın. Verilen İngilizce kelimenin en yakın 3-4 akademik İngilizce eş anlamlısını (synonyms) döndür. YALNIZCA geçerli JSON döndür: {"syn":["synonym1","synonym2","synonym3"]}`;
  const SYN_PENDING = {};

  function getSynonymsForWord(p, x){
    if(!x || !x.en) return [];
    const k = x.en.toLowerCase().trim();
    const list = [];
    const seen = new Set([k]);
    const add = (w, inPack) => {
      const clean = String(w||'').trim();
      const low = clean.toLowerCase();
      if(!clean || seen.has(low)) return;
      seen.add(low);
      list.push({ en: clean, inPack: !!inPack });
    };

    /* 1. Aynı listede Türkçe anlamı örtüşen diğer İngilizce eş anlamlıları bul */
    if(p && Array.isArray(p.items) && x.tr){
      const xTrSet = new Set(String(x.baseTr || x.tr).toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(s=>s.length>2));
      p.items.forEach(other => {
        if(!other || other === x) return;
        const oTrs = String(other.baseTr || other.tr || '').toLowerCase().split(/\s*[,;/]\s*/).map(s=>s.trim()).filter(s=>s.length>2);
        if(oTrs.some(m => xTrSet.has(m))){
          add(other.en, true);
        }
      });
    }

    /* 2. Kelime nesnesinde kayıtlı AI syn dizisi varsa ekle */
    if(Array.isArray(x.syn)){
      x.syn.forEach(s => {
        const inP = p && findWordInPack(p, s);
        add(s, !!inP);
      });
    }

    /* 3. Yerleşik Akademik Eş Anlamlılar Sözlüğünden ekle */
    if(ACADEMIC_SYNS[k]){
      ACADEMIC_SYNS[k].forEach(s => {
        const inP = p && findWordInPack(p, s);
        add(s, !!inP);
      });
    }

    return list.slice(0, 5);
  }

  async function ensureCardSynonyms(p, x){
    if(!p || !x || !x.en || !SMP) return;
    const curSyns = getSynonymsForWord(p, x);
    if(curSyns.length >= 2 || SYN_PENDING[x.en]) return;
    SYN_PENDING[x.en] = 1;
    try{
      const r = await askJ(SYN_AI_SYS, `${x.en} (${x.tr || ''})`, 30000, 'quick');
      if(r && Array.isArray(r.syn) && r.syn.length){
        x.syn = r.syn.map(s=>String(s||'').trim()).filter(Boolean);
        save(p);
        const box = document.getElementById('cardSynBox');
        if(box && step === 0 && deck[di] === x){
          box.outerHTML = renderCardSynonymsHtml(p, x);
        }
      }
    }catch(e){}
    finally{ delete SYN_PENDING[x.en]; }
  }

  function renderCardSynonymsHtml(p, x){
    const syns = getSynonymsForWord(p, x);
    if(!syns.length){
      if(SMP) ensureCardSynonyms(p, x);
      return `<div class="syn-box" id="cardSynBox"><span class="syn-lbl">🔗 Synonyms:</span><span class="m" style="font-size:12px">${SMP ? 'Eş anlamlılar hazırlanıyor…' : '—'}</span></div>`;
    }
    return `
      <div class="syn-box" id="cardSynBox">

        ${syns.map(s => `<span class="syn-chip tk ${s.inPack?'in-pack':''}" data-w="${esc(s.en)}" title="Tıkla: Telaffuzu dinle, anlamını gör veya listeye ekle">🔊 ${esc(s.en)}${s.inPack ? ' <i>★ Listede</i>' : ''}</span>`).join('')}
      </div>`;

  let KART_TOTAL = 0;
  startKart = function(){
    const pool = cur.items.filter(x => x.tr);
    if(!pool.length || FILL[cur.id]){ $('#st').innerHTML = waitBox(); return; }
    pool.forEach(x => delete x._retry);
    deck = shuf(pool).sort((a,b) => bx(a) - bx(b));
    KART_TOTAL = deck.length;
    di = 0; flip = false;
    drawK();
  };

  kartAns = function(know){
    const x = deck[di];
    if(!x) return;
    if(know){
      cur.prog.box[x.en] = Math.min(5, bx(x) + 1);
      delete x._retry;
      META.kart = (META.kart || 0) + 1;
      xp(5);
      SFX.ok();
    } else {
      cur.prog.box[x.en] = 1;
      x._retry = (x._retry || 0) + 1;
      deck.push(x);
      SFX.bad();
    }
    saveMeta();
    di++;
    flip = false;
    drawK();
    save();
  };

  drawK = function(){
    const totalUnique = KART_TOTAL || cur.items.filter(w => w.tr).length || 1;
    const remCount = Math.max(0, deck.length - di);
    const knownCount = Math.max(0, totalUnique - remCount);
    if(di>=deck.length){
      cur.prog.steps[0]=1; save(); renderHead(); setProg(100);
      $('#st').innerHTML=`<div class="result">${mascot('wink',110)}<div class="eyebrow" style="margin-top:12px">RİNG I · KARTLAR</div><h2>Kartlar Ringi Fethedildi!</h2><p class="m">Listedeki tüm ${totalUnique} kelimeye "Biliyorum" diyerek eksiksiz tamamladın!</p><div class="row2"><button class="btn3" data-open="1">⚔️ Eşleştir Ringine Geç →</button><button class="btn-ghost" data-home="1">Ana sayfa</button></div></div>`;
      showConquestCeremony(0, `Tüm ${totalUnique} kelime eksiksiz öğrenildi! Kartlar Ringi mühürlendi.`);
      return;
    }
    const x=deck[di]; SRC=x;
    setProg((knownCount / totalUnique) * 100);
    const synHtml = renderCardSynonymsHtml(cur, x);
    const ex=x.s?`<div class="ex">${sent(x.s)}</div>`:'<div class="ex m">Örnek cümle hazırlanıyor…</div>';
    const retryBadge = x._retry ? `<span style="display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 9px;border-radius:999px;background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.45);color:var(--bad);font-size:11.5px;font-weight:900">🔁 Tekrar Turu (${x._retry}. kez)</span>` : '';
    $('#st').innerHTML=`
       <div class="coach">${mascot('',62)}<div class="bubble">${x._retry ? '🔁 Daha önce "Bilmiyorum" dediğin kelime geri geldi! Şimdi tekrar dene.' : 'Kartı çevir, Tureng anlamlarını, eş anlamlılarını (Synonyms) ve cümleyi gör! Tüm kelimelere "Biliyorum" demeden ring bitmez.'}</div></div>
       <div class="m" style="text-align:center;margin-bottom:8px;font-weight:800">✅ Öğrenilen: ${knownCount} / ${totalUnique} · ⏳ Kalan: ${remCount} · 🏛️ Kutu ${bx(x)}${retryBadge}</div>
       <div class="deck-stage">
         <div class="flip ${flip?'is':''}" id="cd" role="button" tabindex="0">
           <div class="face front"><div class="eyebrow">RİNG I · ENGLISH ${x._retry ? '· 🔁 TEKRAR' : ''}</div><div class="big">${esc(x.en)}</div><div class="m">🔄 Dokun ve çevir · [Boşluk]</div></div>
           <div class="face back"><div class="tureng-badge">📚 Mevcut + Tureng Yaygın Karşılıklar</div><div class="big tr">${esc(x.tr)}</div>${synHtml}${ex}${x.st?`<div class="m" id="trs" hidden style="margin-top:8px">${esc(x.st)}</div>`:''}<div class="tip" id="tip">${tipHtml()}</div></div>
         </div>
       </div>
       <div class="row2"><button class="pill" data-say="${esc(x.en)}">🔊 Kelimeyi Dinle (US)</button>${x.s?`<button class="pill" data-say="${esc(x.s)}">🔊 Cümleyi Dinle (US)</button>`:''}${x.st?'<button class="pill" id="tt">🇹🇷 Çeviri</button>':''}<button class="pill" type="button" data-sent-modal="1">📖 Tüm Cümle Anlamları</button></div>
       <div class="row2"><button class="btn-ghost" id="no">🔁 Bilmiyorum (Sonra Tekrar Sor)</button><button class="btn3" id="yes">⚡ Biliyorum · Kulede Yükselt</button></div>`;
  };

  const baseMstart = window.__kaOrigMstart || (window.__kaOrigMstart = mstart);
  mstart = function(){
    const all=cur.items.filter(x=>x.tr);

    const got=new Set(cur.prog.mdone||[]),rem=all.filter(x=>!got.has(x.en));

  const baseQAns = window.__kaOrigQAns || (window.__kaOrigQAns = qAns);
  qAns = function(i){

  qEnd = function(won){
    const K={sec:2,yaz:3,boss:4,cum:5}[qmode];
    if(won){cur.prog.steps[K]=1;xp(20);save();SFX.win();confetti()}
    renderHead(); $('#hearts').hidden=true;
