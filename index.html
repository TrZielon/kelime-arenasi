<!DOCTYPE html>
<html lang="tr" data-theme="arena">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelime Arenası</title>
<style>
:root{--bg:#120e22;--p:#1d1837;--p2:#2a2352;--ink:#f6f1ff;--m:#a29ad0;--a:#ffc857;--a2:#ff9f43;--ok:#34d399;--bad:#ff5d73;--b:#2b2650;--bi:#1a1020}
[data-theme=neon]{--bg:#05060d;--p:#10132a;--p2:#161d3c;--ink:#e6fbff;--m:#6f83a8;--a:#27f4ff;--a2:#b388ff;--ok:#7dff6b;--bad:#ff3ea5;--b:#161b35;--bi:#04121a}
[data-theme=kagit]{--bg:#f3ecdb;--p:#fffcf4;--p2:#f7f0de;--ink:#2a2118;--m:#7a6b57;--a:#b5562b;--a2:#d9823b;--ok:#2e8b57;--bad:#c0392b;--b:#e8dcc2;--bi:#fff}
[data-theme=akdeniz]{--bg:#f3f8f6;--p:#ffffff;--p2:#e2f1ed;--ink:#0d2b2a;--m:#56736f;--a:#0f766e;--a2:#f59e0b;--ok:#15803d;--bad:#e11d48;--b:#d5e7e1;--bi:#fff}
[data-theme=kitaplik]{--bg:#f7f1e3;--p:#fffaf0;--p2:#f1e5cc;--ink:#2e1a1f;--m:#7d6a5f;--a:#7a1f2e;--a2:#c08a2b;--ok:#3f7d3a;--bad:#b42318;--b:#e6d9bf;--bi:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,var(--p2),var(--bg) 70%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
#app{max-width:700px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.brand svg{width:30px;height:30px}
.hud{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hud>span{background:var(--p);border:1px solid var(--b);border-radius:999px;padding:6px 12px;font-weight:700}

.on{border-color:var(--a)!important;color:var(--a)}

.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .3s}
.btn{background:var(--a);color:var(--bi)!important;border:0;border-radius:14px;padding:12px 20px;min-height:46px;font-weight:800;cursor:pointer;opacity:1}
.btn.ok{background:var(--ok);color:#fff!important}
.btn.bad{background:var(--bad);color:#fff!important}
.btn:disabled{opacity:.5}
.box{background:var(--p);border:1px solid var(--b);border-top:3px solid var(--a);border-radius:18px;padding:18px;margin:12px 0;text-align:center}
.big{font-size:clamp(24px,7vw,34px);font-weight:800;margin:6px 0;word-break:break-word}
.sent{font-size:18px;line-height:1.85;text-align:left;margin:8px 0}
.tk{cursor:pointer;border-bottom:1px dotted var(--m)}
.tk:hover,.tk.sel{background:var(--b);color:var(--a)}
.tip{min-height:44px;margin-top:8px;text-align:left;background:var(--p2);border-radius:12px;padding:10px 12px}
.tip b{color:var(--a)}
.chip{display:inline-block;background:var(--b);border-radius:8px;padding:2px 8px;margin:3px;font-size:13px}
.m{color:var(--m);font-size:14px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.opt{display:block;width:100%;margin:8px 0;padding:14px;min-height:50px;border-radius:14px;border:1.5px solid var(--b);background:var(--p);color:var(--ink);text-align:left;cursor:pointer;font-size:16px;font-weight:600}
.opt.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 18%,var(--p))!important}
.opt.bad{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 18%,var(--p))!important}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:block;width:100%;margin:5px 0;padding:12px;min-height:50px;border-radius:14px;border:1.5px solid var(--b);background:var(--p);color:var(--ink);text-align:left;cursor:pointer;word-break:break-word;font-weight:600}
.tile.sel{border-color:var(--a);box-shadow:inset 0 0 0 2px var(--a)}
.tile.gone{opacity:.25;pointer-events:none;border-color:var(--ok)}
.tile.bad{border-color:var(--bad)}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--b);background:var(--p);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.fb{min-height:26px;margin:8px 0;text-align:center;font-weight:600}
.good{color:var(--ok)}.bad2{color:var(--bad)}
#stat{text-align:center;min-height:24px;font-size:14px;margin-top:4px}
.boxes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--m);margin-top:14px}
.boxes b{color:var(--a)}
@media(max-width:480px){.cols{gap:6px}.tile{font-size:14px;padding:9px}}
</style>
</head>

<header>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lg)"/><path d="M15 50V31a17 17 0 0 1 34 0v19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M25 50V33a7 7 0 0 1 14 0v17" fill="none" stroke="url(#gd)" stroke-width="4.5" stroke-linecap="round"/><circle cx="50" cy="13" r="3.6" fill="url(#gd)"/></svg>Kelime Arenası</div>
  <div class="hud"><span>⭐ <b id="xp">0</b></span><select id="pk"></select><button class="pill" id="addb">＋ Liste</button><button class="pill" id="del">🗑</button><button class="pill" id="th">🎨</button><button class="pill" id="snd">🔊</button></div>

<script>
const DEF=`rule - Yönetmek, hükmetmek
ruler - Hükümdar, yönetici

alliance - İttifak

trim - Kesmek, keserek kısaltmak

yield - Verim
unprecedented - Eşi benzeri görülmemiş
account for - Oluşturmak, teşkil etmek
per capita / per person - Kişi başına
urgency - Aciliyet
allot / allocate - Ayırmak, tahsis etmek
shrink - Küçültmek, küçülmek
water-intensive - Çok su gerektiren
X-intensive - Çok X gerektiren`;

const TR_SYS=`Sen İngilizce-Türkçe sözlük yazarısın. Girdide numaralandırılmış İngilizce kelimeler var. Her biri için en yaygın Türkçe karşılığını yaz (1-3 kelime). Kelimeyi İngilizce bırakma. YALNIZCA geçerli JSON döndür: {"items":[{"i":1,"tr":"Türkçe karşılık"}]}. Her numarayı girdideki sırayla eksiksiz döndür.`;
const BATCH=`Sen BUEPT düzeyinde akademik İngilizce öğretmenisin. YALNIZCA geçerli JSON döndür: {"items":[...]}. Girdideki her satır "en - tr" biçimindedir. Her kelime için: "en" girdideki kelimenin aynısı; "s" kelimeyi içeren akademik C1 düzeyinde 14-22 kelimelik tek İngilizce cümle; "st" cümlenin doğal Türkçe çevirisi; "d" cümlenin anlamı olarak yanlış ama makul görünen 3 Türkçe çeviri dizisi; "gl" cümledeki önemli kelimelerin en fazla 6 tanesi için {"kelime":"Türkçe anlam"} (küçük harf); "mo" ek-kök ayrımı öğretici en fazla 2 kelime için {"kelime":[["parça","kök" veya "ek","kısa Türkçe açıklama"]]}. "X" içeren maddelerde X yerine gerçek bir örnek kullan ve cümlede onu kullan.`;
const PARA_G=`Sen BUEPT sınavına hazırlanan öğrenciler için akademik İngilizce paragraf yazan bir yazarsın. YALNIZCA geçerli JSON döndür. Kurallar: (1) Verilen her kalıbı paragrafta en az bir kez, parantez içindeki Türkçe anlamına uygun ve doğal çekimli biçimde kullan. "a / b" biçimindeki kalıplarda biri yeterlidir. X içeren kalıplarda X yerine gerçek bir kelime kullan. (2) Tek bir konu seç, cümleleri mantıksal bağlarla bağla. (3) İlk cümle konuyu tanıtsın, son cümle sonuç ya da değerlendirme içersin. (4) C1 akademik üslup, dolgu ve tekrar yok. (5) Uzunluk 60-85 kelime. (6) Uydurma istatistik kullanma. Biçim: {"par":"paragraf metni","ana_fikir":"paragrafın asıl iddiası, Türkçe, tek cümle","gl":{"kelime":"Türkçe anlam"}} gl: en fazla 10 önemli kelime.`;
const GLOSS=`Verilen İngilizce kelimelerin her birinin en yaygın Türkçe karşılığını yaz (1-3 kelime). YALNIZCA geçerli JSON döndür: {"kelime":"Türkçe karşılık"}. Anahtarlar küçük harfli ve girdideki gibi olsun.`;
const GRADE=`Bir İngilizce akademik metnin Türkçe ana düşüncesini öğrenci yazdı. Öğrencinin cevabını referans ana düşünceyle karşılaştır ve 0 ile 100 arasında tam sayılı bir yüzde ver. Ölçek: 100 = tam örtüşme; 85 = merkezi iddia doğru, küçük ayrıntı eksik; 70 = merkezi iddia doğru ama önemli ayrıntı eksik; 40 = kısmen doğru; 0 = alakasız ya da yanlış. Dil hatalarına değil düşüncenin doğruluğuna ve kapsamına bak. YALNIZCA geçerli JSON döndür: {"yuzde": 0-100 arası tam sayı, "yorum": "Türkçe, 2-3 cümle; eksik ya da yanlış noktayı ve doğru ana düşünceyi belirt"}`;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];
const chunks=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
const cl=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
const aMo=v=>Array.isArray(v)?v.filter(Array.isArray):[];
const tokHTML=s=>esc(s).split(/([A-Za-z][A-Za-z'-]*)/).map((t,i)=>i%2?`<span class="tk" data-w="${t}">${t}</span>`:t).join('');
const validTr=(t,en)=>typeof t==='string'&&!!t.trim()&&t.trim().toLowerCase()!==String(en||'').trim().toLowerCase()&&!/^\?+$/.test(t.trim());
const lowerKeys=o=>{const s=cl(o),r={};Object.keys(s).forEach(k=>{if(typeof s[k]==='string'&&s[k].trim())r[k.toLowerCase().trim()]=s[k].trim()});return r};
const tipDefault=()=>'<span class="m">Kelimelere dokun: anlam ve ek-kök ayrımı.</span>';
const emptyBox=msg=>`<div class="box"><p class="m">${esc(msg)}</p></div>`;

function parseAny(t){
  const out=[];
  t.split(/\r?\n/).forEach(raw=>{
    const l=raw.replace(/[\u00a0 ]+/g,' ').replace(/[A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ ]{2,}\s*[–-]\s*VOCAB/g,'').replace(/^\s*(?:\d+[.)]|[•*·-])\s+/,'').trim();
    if(!l||/^[A-ZÇĞİÖŞÜ ]+$/.test(l))return;
    const seg=l.split(/\s+:\s+|\s+[-–—]\s+|\s*\|\s*|\t/).map(s=>s.trim()).filter(Boolean);
    if(seg.length<2){out.push({en:l,tr:''});return}
    const ti=seg.findIndex((s,i)=>i>0&&/[çğıöşüİ]/i.test(s));
    out.push(ti>1?{en:seg.slice(0,ti).join(' / '),tr:seg.slice(ti).join(' / ')}:{en:seg[0],tr:seg.slice(1).join(' / ')});
  });
  return out;
}

/* ---------- Veri ---------- */
const KEY='ka_v18';
let packs=[],cur=null,SRC=null,step=0,GI=0,DECK=[],DI=0,FLIP=false,MUTED=false,BUSY=false,LASTERR='';
function ensure(p){
  p.words=p.words||[];
  if(!p.items)p.items=p.words.map(w=>({en:w.en,tr:w.tr||'',d:[],gl:{},mo:{}}));
  p.groups=p.groups||[];p.dict=p.dict||{};
  p.prog=Object.assign({box:{},steps:[0,0,0,0,0,0,0],xp:0,gi:0,cg:0,mdone:[]},p.prog||{});
  if(p.prog.steps.length<7)p.prog.steps=[0,0,0,0,0,0,0];
  return p;
}
const mkPack=(id,name,words)=>ensure({id,name,words,items:null,groups:[],dict:{},prog:null});
function save(){try{localStorage.setItem(KEY,JSON.stringify({packs}));localStorage.setItem('ka_cur',cur?cur.id:'def')}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.packs))packs=d.packs}catch(e){}}
const bx=w=>cur.prog.box[w.en]||1;
function xpAdd(n){cur.prog.xp=(cur.prog.xp||0)+n;$('#xp').textContent=cur.prog.xp;save()}
function localMean(k){
  if(SRC&&SRC.gl&&SRC.gl[k])return SRC.gl[k];
  if(cur.dict[k])return cur.dict[k];
  const it=cur.items.find(x=>x.en.toLowerCase().split(/\s*[\/~]\s*/).map(v=>v.trim()).includes(k));
  return it&&it.tr?it.tr:'';
}
function missingCount(p){
  const tr=p.items.filter(x=>!x.tr).length,s=p.items.filter(x=>x.tr&&!x.s).length;
  const cov=new Set(p.groups.flatMap(g=>g.w));
  return tr+s+p.items.filter(x=>x.tr&&!cov.has(x.en)).length+p.groups.filter(g=>!g.text).length;
}

/* ---------- Yapay zekâ çağrıları ---------- */
const NAMES=['Kartlar','Eşleştir','Seç','Yaz','Boss','Cümle','Paragraf'];
async function callAPI(prompt,tier,ms){
  if(location.protocol==='file:')throw new Error('sayfayı https adresinden aç');
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||60000);
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,tier:tier||'default'}),signal:ac.signal});
    if(r.status===429)throw new Error('çok fazla istek, biraz bekle');
    if(!r.ok){let c='',d='';try{const j=await r.json();c=j.error||'';d=j.detail||''}catch(e){}throw new Error(d||c||('sunucu hatası '+r.status))}
    const j=await r.json();
    return {text:String(j.text||''),truncated:!!j.truncated};
  }catch(e){
    if(e.name==='AbortError')throw new Error('zaman aşımı');
    throw e;
  }finally{clearTimeout(tm)}
}
function parseJSON(text){const m=String(text||'').match(/[\[{][\s\S]*[\]}]/);if(!m)return null;try{return JSON.parse(m[0])}catch(e){return null}}
const GATE={n:0,q:[],max:2};
const gateIn=()=>GATE.n<GATE.max?(GATE.n++,Promise.resolve()):new Promise(r=>GATE.q.push(r));
const gateOut=()=>{const r=GATE.q.shift();if(r)r();else GATE.n--};
async function askJ(sys,input,tier,ms){
  await gateIn();
  try{const r=await callAPI(sys+'\n\nGİRDİ:\n'+input,tier,ms);return {json:parseJSON(r.text),err:parseJSON(r.text)?'':'geçersiz yanıt'}}
  catch(e){return {json:null,err:e.message}}
  finally{gateOut()}
}
async function askNow(sys,input,tier,ms){
  try{const r=await callAPI(sys+'\n\nGİRDİ:\n'+input,tier,ms);const j=parseJSON(r.text);return {json:j,err:j?'':'geçersiz yanıt'}}
  catch(e){return {json:null,err:e.message}}
}
async function runPool(items,fn,n,label){
  let i=0,done=0;const total=items.length;
  const w=async()=>{while(i<items.length){const it=items[i++];await fn(it);done++;if(label)status(`${label} hazırlanıyor · ${done}/${total}`)}};
  await Promise.all(Array.from({length:Math.min(n,total)},w));
}
function planGroups(p){
  const have=new Set(p.groups.flatMap(g=>g.w));
  const left=p.items.filter(x=>x.tr&&!have.has(x.en)).map(x=>x.en);
  for(let i=0;i<left.length;i+=10)p.groups.push({w:left.slice(i,i+10),text:'',ana:'',gl:{},miss:[],ok:false});
}
function covered(t,en){
  const T=t.toLowerCase();
  return en.toLowerCase().split(/\s*[\/~]\s*/).some(a=>{
    a=a.trim();if(!a)return false;
    if(/(^|[-\s])x([-\s]|$)/.test(a))return a.split('x').map(s=>s.trim()).filter(Boolean).every(s=>T.includes(s));
    const stem=(a.length>5?a.slice(0,-2):a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return new RegExp('\\b'+stem).test(T);
  });
}
async function genGroup(p,g){
  const words=g.w.map(en=>p.items.find(x=>x.en===en)).filter(Boolean);
  if(!words.length)return false;
  const r=await askJ(PARA_G,'KALIPLAR: '+words.map(x=>x.en+(x.tr?` (${x.tr})`:'')).join(' | '),'default',150000);
  if(!r.json||typeof r.json.par!=='string'||!r.json.par.trim()){LASTERR=r.err;return false}
  const miss=words.map(x=>x.en).filter(en=>!covered(r.json.par,en));
  Object.assign(g,{text:r.json.par.trim(),ana:String(r.json.ana_fikir||'').trim(),gl:lowerKeys(r.json.gl),miss});
  return true;
}
async function glossAll(p){
  const lex=new Set(p.items.flatMap(x=>x.en.toLowerCase().split(/\s*[\/~]\s*/).map(v=>v.trim())));
  const txt=[...p.items.map(x=>x.s||''),...p.groups.map(g=>g.text||'')].join(' ');
  const need=[...new Set(txt.toLowerCase().match(/[a-z][a-z'-]*/g)||[])].filter(w=>w.length>1&&!lex.has(w)&&!p.dict[w]);
  await runPool(chunks(need,80),async c=>{

  VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aaron|Zira|David|Microsoft|Natural/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||null;
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function sayNow(text){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.92;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}
function speak(t){
  if(MUTED||!('speechSynthesis' in window))return;
  const text=String(t||'').split(/\s*[\/~]\s*/)[0].trim();
  if(!text)return;
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>sayNow(text),80)}
    else sayNow(text);
  }catch(e){}
}
let AC=null;
function tone(f,d,ty){
  if(MUTED)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    f.forEach((x,i)=>{const o=AC.createOscillator(),g=AC.createGain(),s=t+i*d;o.type=ty;o.frequency.value=x;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(1e-4,s);g.gain.exponentialRampToValueAtTime(.15,s+.01);g.gain.exponentialRampToValueAtTime(1e-4,s+d);o.start(s);o.stop(s+d+.02)});
  }catch(e){}
}
const SFX={ok:()=>tone([523,659,784],.09,'triangle'),bad:()=>tone([220,165],.2,'sawtooth'),win:()=>tone([523,659,784,1047],.11,'triangle')};

/* ---------- 3-6. Quiz (Seç, Yaz, Boss, Cümle) ---------- */
const QX={mode:'',K:2,q:[],total:0,solved:0,lives:3,cur:null,locked:false,won:false};
function qPool(m){
  const it=cur.items.filter(x=>x.tr);
  if(m==='cum')return it.filter(x=>x.s&&x.st);
  if(m==='yaz')return it.filter(x=>!x.en.includes('X'));
  return it;
}
function quizStart(m){
  QX.mode=m;QX.K={sec:2,yaz:3,boss:4,cum:5}[m];
  QX.q=shuf(qPool(m));QX.total=QX.q.length;QX.solved=0;
  QX.lives=m==='boss'?3:99;QX.cur=null;QX.won=false;
  if(!QX.q.length){$('#st').innerHTML=emptyBox(m==='cum'?'Cümleler henüz hazır değil. Üstteki “Hazırla” düğmesine bas.':'Bu mod için uygun kelime yok.');return}
  qNext();
}
function quizWord(k){
  const it=cur.items.find(x=>x.tr&&x.en.toLowerCase().split(/\s*[\/~]\s*/).map(v=>v.trim()).includes(k));
  if(!it)return;
  const rest=shuf(qPool('sec').filter(x=>x!==it));
  QX.mode='sec';QX.K=2;QX.q=[it,...rest];QX.total=QX.q.length;QX.solved=0;QX.lives=99;QX.cur=null;QX.won=false;
  step=2;renderHead();qNext();
}
function qNext(){
  QX.locked=false;
  if(QX.mode==='boss'&&QX.lives<=0)return qEnd(false);
  if(!QX.q.length)return qEnd(true);
  const x=QX.q[0];
  if(QX.mode==='yaz')return yazRender(x);
  const q=qMake(x,QX.mode);QX.cur=q;qRender(q);
}
function qMake(x,m){
  const items=cur.items.filter(y=>y.tr);
  const useSent=x.s&&x.st&&(m==='cum'||(m==='sec'&&Math.random()<.5)||(m==='boss'&&Math.random()<.4));
  if(useSent){
    const d=[...(x.d||[]),...shuf(items.filter(o=>o!==x&&o.st).map(o=>o.st))].filter((v,i,a)=>v&&v!==x.st&&a.indexOf(v)===i).slice(0,3);
    if(d.length===3)return {k:'s',x,q:x.s,ans:x.st,opts:shuf([x.st,...d])};
  }
  const dirEn=Math.random()<.5,key=o=>dirEn?o.tr:o.en,ans=key(x);
  const d=shuf(items.filter(o=>o!==x&&key(o)!==ans)).slice(0,3).map(key);
  return {k:'w',x,dirEn,q:dirEn?x.en:x.tr,ans,opts:shuf([ans,...d])};
}
function qRender(q){
  const n=Math.min(QX.solved+1,QX.total),t=QX.total;
  const head=QX.mode==='boss'?`Boss · ${n}/${t} · ${'❤️'.repeat(Math.max(QX.lives,0))}`:(QX.mode==='cum'?`Cümle · ${n}/${t}`:`Seç · ${n}/${t}`);
  const body=q.k==='s'
    ?`<div class="m">Cümlenin anlamı hangisi?</div><div class="sent">${esc(q.q)}</div><button class="pill" data-say="${esc(q.q)}">🔊 Dinle</button>`
    :`<div class="m">${q.dirEn?'İngilizce → Türkçe':'Türkçe → İngilizce'}</div><div class="big">${esc(q.q)}</div>${q.dirEn?`<button class="pill" data-say="${esc(q.x.en)}">🔊 Dinle</button>`:''}`;
  $('#st').innerHTML=`<div class="m">${head}</div>
    <div class="bar"><i style="width:${t?QX.solved/t*100:0}%"></i></div>
    <div class="box">${body}</div>
    ${q.opts.map((o,i)=>`<button class="opt" data-fo="${i}" data-ok="${o===q.ans?1:0}">${esc(o)}</button>`).join('')}
    <div class="fb" id="qfb"></div>
    <div class="row"><button class="btn" id="qnext" hidden>Sonraki</button></div>`;
}
function qAnswer(btn){
  const q=QX.cur;if(!q||QX.locked||!q.opts)return;
  QX.locked=true;
  const ok=btn.dataset.ok==='1';
  document.querySelectorAll('[data-fo]').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('ok');else if(b===btn&&!ok)b.classList.add('bad')});
  if(ok){QX.solved++;QX.q.shift();xpAdd(10);SFX.ok()}
  else{QX.q.push(QX.q.shift());if(QX.mode==='boss')QX.lives--;SFX.bad()}
  $('#qfb').innerHTML=(ok?'<span class="good">✅ Doğru</span>':`<span class="bad2">❌ Doğru cevap: ${esc(q.ans)}</span>`)+`<div class="m">${esc(q.x.en)} = ${esc(q.x.tr)}${ok?'':' · bu kelime tekrar gelecek'}</div>`;
  $('#qnext').hidden=false;
}
function yazRender(x){
  QX.cur={k:'y',x};QX.locked=false;

  $('#st').innerHTML=`<div class="m">Yaz · ${n}/${t}</div>

    <div class="row"><input id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="İngilizcesini yaz" style="max-width:360px"></div>
    <div class="row"><button class="btn" id="qcheck">Kontrol et</button></div>

}
function yazCheck(){

/* ---------- Liste ekleme ---------- */
const LIBS={};
function lib(u,g){
  if(window[g])return Promise.resolve();
  if(!LIBS[u])LIBS[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('kütüphane yüklenemedi'));document.head.appendChild(s)});
  return LIBS[u];
}
async function readFile(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='pdf'){
    await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    let txt='';
    for(let n=1;n<=pdf.numPages;n++){
      const c=await (await pdf.getPage(n)).getTextContent();
      let line='',lx=null;
      for(const it of c.items){
        if(it.str){if(lx!==null&&it.transform[4]-lx>20)line+='\t';line+=it.str;lx=it.transform[4]+(it.width||0)}
        if(it.hasEOL){txt+=line+'\n';line='';lx=null}
      }
      txt+=line+'\n';
    }
    return txt;
  }
  if(ext==='docx'){
    await lib('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','mammoth');
    const {value}=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});
    return [...new DOMParser().parseFromString(value,'text/html').querySelectorAll('p,tr')]
      .filter(el=>el.tagName==='TR'||!el.closest('table'))
      .map(el=>el.tagName==='TR'?[...el.children].map(c=>c.textContent.trim()).join('\t'):el.textContent).join('\n');
  }
  return f.text();
}
async function importFile(f){
  const out=$('#pfs');out.textContent='Okunuyor…';
  try{
    const txt=await readFile(f),n=parseAny(txt).length,ta=$('#pw');
    ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+txt.trim();
    if(!$('#pn').value)$('#pn').value=f.name.replace(/\.[^.]+$/,'');
    out.textContent=n?`${n} satır okundu, kontrol edip oluştur`:'Kelime bulunamadı (taranmış PDF olabilir)';
  }catch(e){out.textContent='Okunamadı: '+e.message}
}
function vAdd(){
  $('#st').innerHTML=`<div class="box" style="text-align:left">
    <div class="big" style="text-align:center">Yeni liste</div>
    <p class="m">Her satıra “kelime - anlam” yaz. Anlamı olmayanları “Hazırla” tamamlar. PDF, Word (.docx) ya da .txt de yükleyebilirsin.</p>
    <input id="pn" placeholder="Liste adı" style="margin-bottom:8px">
    <div class="row"><button class="pill" id="pfb">📄 Dosya yükle</button><span class="m" id="pfs"></span><input type="file" id="pf" accept=".pdf,.docx,.txt" hidden></div>
    <textarea id="pw" placeholder="rule - yönetmek&#10;ally - müttefik"></textarea>
    <div class="row"><button class="btn" id="mk">Listeyi oluştur</button><button class="pill" data-st="${step}">Vazgeç</button></div>
  </div>`;
}
function createPack(){
  const w=parseAny($('#pw').value);
  if(!w.length){$('#pfs').textContent='Önce kelime ekle';return}
  const p=mkPack('p'+Date.now().toString(36),($('#pn').value||'').trim()||'Yeni liste',w.map(x=>({en:x.en,tr:x.tr})));
  packs.push(p);cur=p;step=0;GI=0;save();renderHead();vKart();
}
function deletePack(){
  if(cur.id==='def'||!confirm('Bu liste silinsin mi?'))return;
  packs=packs.filter(p=>p.id!==cur.id);cur=packs[0];save();step=0;renderHead();vKart();
}

/* ---------- Dışa aktarma (varsayılan içerik) ---------- */
function exportDef(){
  const p=cur,data={items:p.items.map(x=>({en:x.en,tr:x.tr,s:x.s,st:x.st,d:x.d,gl:x.gl,mo:x.mo})),groups:p.groups.map(g=>({w:g.w,text:g.text,ana:g.ana,gl:g.gl,miss:g.miss})),dict:p.dict};
  $('#st').innerHTML=`<div class="box" style="text-align:left"><p class="m">Bu metni kopyalayıp sakla.</p><textarea style="min-height:280px;font-size:12px">${esc(JSON.stringify(data))}</textarea></div>`;
}

/* ---------- Tema ---------- */
const THEMES=['arena','neon','kagit','akdeniz','kitaplik'];
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('ka_theme',t)}catch(e){}}
function nextTheme(){const i=THEMES.indexOf(document.documentElement.dataset.theme);setTheme(THEMES[(i+1)%THEMES.length])}

/* ---------- Olaylar ---------- */
document.addEventListener('click',e=>{
  const el0=e.target.nodeType===1?e.target:e.target.parentElement;
  if(!el0)return;
  const c=s=>el0.closest(s);
  let el;
  if(el=c('[data-say]')){speak(el.dataset.say);return}
  if(el=c('.tk')){tapWord(el.dataset.w,el);return}
  if(el=c('[data-quiz]')){quizWord(el.dataset.quiz);return}
  if(el=c('[data-st]')){goStep(+el.dataset.st);return}
  if(el=c('[data-go]')){goStep(+el.dataset.go);return}
  if(el=c('[data-gi]')){GI=+el.dataset.gi;vPara();return}
  if(el=c('[data-fo]')){qAnswer(el);return}
  if(el=c('[data-ml]')){matchClick('l',+el.dataset.ml);return}
  if(el=c('[data-mr]')){matchClick('r',+el.dataset.mr);return}
  if(c('#card')){FLIP=!FLIP;vKart();return}
  if(c('#yes')){answerCard(true);return}
  if(c('#no')){answerCard(false);return}
  if(c('#prv')){DI=Math.max(0,DI-1);FLIP=false;vKart();return}
  if(c('#restart0')){DECK=[];vKart();return}
  if(c('#qnext')){qNext();return}
  if(c('#qcheck')){yazCheck();return}
  if(c('#qrestart')){qAfterEnd();return}
  if(c('#mnext')){vMatch();return}
  if(c('#grade')){grade();return}
  if(c('#hz')){prepare();return}
  if(c('#xj')){exportDef();return}
  if(c('#addb')){vAdd();return}
  if(c('#mk')){createPack();return}
  if(c('#pfb')){$('#pf').click();return}
  if(c('#del')){deletePack();return}
  if(c('#th')){nextTheme();return}
  if(c('#snd')){MUTED=!MUTED;c('#snd').textContent=MUTED?'🔇':'🔊';return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='pk'){cur=packs.find(p=>p.id===e.target.value)||cur;step=0;GI=0;renderHead();vKart()}
  if(e.target.id==='pf'&&e.target.files[0])importFile(e.target.files[0]);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.id==='qin'&&e.key==='Enter'){e.preventDefault();yazCheck();return}
  if(t&&t.matches&&t.matches('input,textarea,select'))return;
  if(step===0&&$('#card')){
    if(e.key===' '){e.preventDefault();FLIP=!FLIP;vKart()}
    else if(e.key==='1')answerCard(false);
    else if(e.key==='2')answerCard(true);
    return;
  }
  if([2,4,5].includes(step)&&QX.cur&&QX.cur.opts){
    if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`[data-fo="${e.key-1}"]`);if(b&&!b.disabled){e.preventDefault();qAnswer(b)}}
    else if((e.key===' '||e.key==='Enter')&&$('#qnext')&&!$('#qnext').hidden){e.preventDefault();qNext()}
  }
});

/* ---------- Başlat ---------- */
async function loadStatic(p){
  try{
    const r=await fetch('data/def.json',{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    if(Array.isArray(d.items)&&d.items.length===p.items.length){
      p.items.forEach((x,i)=>{const y=d.items[i];if(y&&y.en===x.en){x.tr=x.tr||y.tr||'';if(!x.s&&y.s)Object.assign(x,{s:y.s,st:y.st||'',d:y.d||[],gl:y.gl||{},mo:y.mo||{}})}});
    }
    if(Array.isArray(d.groups)&&d.groups.length&&!p.groups.some(g=>g.text))p.groups=d.groups;
    if(d.dict)p.dict=Object.assign({},d.dict,p.dict);
  }catch(e){}
}
async function init(){
  load();
  if(!packs.some(p=>p.id==='def'))packs.unshift(mkPack('def','BUEPT Listesi',parseAny(DEF)));
  packs.forEach(ensure);
  const dpk=packs.find(p=>p.id==='def');
  cur=packs.find(p=>p.id===(localStorage.getItem('ka_cur')||'def'))||dpk;
  try{setTheme(localStorage.getItem('ka_theme')||'arena')}catch(e){}
  await loadStatic(dpk);
  save();
  step=0;renderHead();vKart();
}
init();
</script>
