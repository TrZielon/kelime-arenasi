  function renderSinavQHtml(q,i){
    let body='';
    if(q.type==='mc')body=q.o.map((opt,k)=>`<div class="ex-opt" data-q="${i}" data-v="${k}"><b>${'ABCD'[k]||(k+1)})</b> ${opt}</div>`).join('');
    else if(q.type==='tf')body='<div class="ex-tfng">'+['True','False','Not Given'].map(v=>`<div class="ex-opt" data-q="${i}" data-v="${v}">${v}</div>`).join('')+'</div>';
    else if(q.type==='txt')body=`<input data-q="${i}" placeholder="Cevabını buraya yaz…" style="width:100%;padding:9px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">`;
    return `<div class="ex-qcard" id="exQCard_${i}"><div class="ex-qh"><span>SORU ${i+1}</span><span>${q.t||'Soru'}</span></div><p style="margin:0 0 8px;font-weight:700">${q.q}</p>${body}<div class="ex-ev"></div></div>`;
  }
  function updateSinavProgress(){
    const P=getActiveExam();let ansCount=0;
    P.questions.forEach((q,i)=>{const v=exAnswers[i];const isAns=v!==undefined&&v!=='';if(isAns)ansCount++;const nav=document.getElementById('exNav_'+i);if(nav)nav.classList.toggle('done',isAns);});
    const badge=document.getElementById('exCountBadge');if(badge)badge.textContent=`${ansCount} / ${P.questions.length} cevaplandı`;
  }
  function finishSinavExam(){
    if(exDone)return;exDone=true;if(exTimer)clearInterval(exTimer);
    const P=getActiveExam();let rightCount=0,typeStats={};
    P.questions.forEach((q,i)=>{
      const userVal=(exAnswers[i]||'').toString().trim().toLowerCase();let isCorrect=false;
      if(q.type==='mc')isCorrect=Number(exAnswers[i])===q.a;
      else if(q.type==='tf')isCorrect=userVal===String(q.a).toLowerCase();
      else if(q.type==='txt'){const accepted=Array.isArray(q.a)?q.a:[q.a];isCorrect=accepted.some(a=>userVal.replace(/^the /,'')===String(a).toLowerCase().replace(/^the /,''));}
      if(isCorrect)rightCount++;const tName=q.t||'Sorular';typeStats[tName]=typeStats[tName]||[0,0];typeStats[tName][1]++;if(isCorrect)typeStats[tName][0]++;
      const card=document.getElementById('exQCard_'+i),nav=document.getElementById('exNav_'+i);
      if(card){card.classList.add('graded');card.style.borderColor=isCorrect?'var(--ok)':'var(--bad)';}
      if(nav){nav.classList.remove('done');nav.classList.add(isCorrect?'right':'wrong');}
      if(q.type==='mc'||q.type==='tf'){card.querySelectorAll('.ex-opt').forEach(opt=>{const val=opt.dataset.v;if((q.type==='mc'&&Number(val)===q.a)||(q.type==='tf'&&val.toLowerCase()===String(q.a).toLowerCase()))opt.classList.add('ok');else if(opt.classList.contains('sel'))opt.classList.add('no');});}
      const correctStr=q.type==='mc'?q.o[q.a]:(q.type==='tf'?q.a:(Array.isArray(q.a)?q.a[0]:q.a));
      const evBox=card.querySelector('.ex-ev');
      if(evBox){evBox.innerHTML=`<div style="font-weight:800;color:${isCorrect?'var(--ok)':'var(--bad)'}">${isCorrect?'✅ Doğru!':'❌ Doğru Cevap: '+correctStr}</div><div style="margin:4px 0">${q.why||'Metin incelemesine göre cevap doğrulanmıştır.'}</div>${q.ev?`<button type="button" class="pill" data-ev="${q.ev}" style="padding:4px 10px;font-size:12px;margin-top:4px">📍 Kanıtı Göster</button>`:''}`;}
    });
    const pct=Math.round((rightCount/P.questions.length)*100);
    const ring=document.getElementById('exScoreRing');if(ring)ring.style.setProperty('--v',pct);
    const scoreText=document.getElementById('exScoreText');if(scoreText)scoreText.innerHTML=`${pct}%<br><small style="font-size:12px;color:var(--mut)">${rightCount} / ${P.questions.length} Doğru</small>`;
    const barBox=document.getElementById('exCategoryBars');
    if(barBox){barBox.innerHTML='<div class="eyebrow" style="margin-bottom:6px">Soru Tipine Göre Başarı</div>'+Object.entries(typeStats).map(([tName,[ok,tot]])=>`<div style="margin:5px 0;font-size:12.5px"><div style="display:flex;justify-content:space-between"><span>${tName}</span><b>${ok}/${tot}</b></div><div style="height:7px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:2px"><div style="width:${Math.round(ok/tot*100)}%;height:100%;background:${ok/tot>=0.5?'var(--p2)':'var(--bad)'}"></div></div></div>`).join('');}
    const bandEl=document.getElementById('exBandGrade');if(bandEl)bandEl.textContent=pct>=85?'A · Üstün Başarı ✨':(pct>=70?'B · Geçti ✅':(pct>=50?'C · Sınırda ⚠️':'D · Tekrar 📚'));
    const durEl=document.getElementById('exDuration');const elapsed=3599-exLeft;if(durEl)durEl.textContent=`${Math.floor(elapsed/60)} dk ${elapsed%60} sn`;
    const resPane=document.getElementById('exResultPane');if(resPane){resPane.classList.add('on');resPane.scrollIntoView({behavior:'smooth',block:'nearest'});}
  }

      if(!questions.length)return alert('Soru tespit edilemedi. Lütfen numaraları (1. ..., 2. ...) ve şıkları kontrol edin.');
      const newEx={id:'custom_'+Date.now(),title:title,sub:`${questions.length} Soru · Kullanıcı sınavı.`,paragraphs:paragraphs,questions:questions};
      saveCustomExam(newEx);m.classList.remove('on');openSinavRoom(newEx.id);
    };
    const drop=document.getElementById('exDrop'),fInp=document.getElementById('exFileInput');
    drop.onclick=()=>fInp.click();
    fInp.onchange=e=>{if(e.target.files&&e.target.files[0])processUploadedFile(e.target.files[0],m);};

  function processUploadedFile(file,modalEl){
    const msg=document.getElementById('exFileMsg');msg.style.display='block';msg.textContent=`⏳ "${file.name}" okunuyor...`;
    if(file.name.endsWith('.json')){
      const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);d.id='custom_'+Date.now();saveCustomExam(d);modalEl.classList.remove('on');openSinavRoom(d.id);}catch(err){alert('Geçersiz JSON.');}};
      r.readAsText(file);return;
    }
    const r=new FileReader();
    r.onload=ev=>{
      let text=typeof ev.target.result==='string'?ev.target.result:"";
      if(!text){const bytes=new Uint8Array(ev.target.result);for(let i=0;i<bytes.length;i++){const c=bytes[i];if((c>=32&&c<=126)||c===10||c===13)text+=String.fromCharCode(c);}const m=text.match(/\(([^)]{2,})\)/g)||[];text=m.map(x=>x.slice(1,-1)).join(' ');}
      modalEl.querySelector('[data-t="tab1"]').click();document.getElementById('upTitle').value=file.name.replace(/\.[^/.]+$/,"");
      const qIdx=text.search(/(?:questions?|sorular?|1[\.\)])/i);
      if(qIdx>80){document.getElementById('upPassage').value=text.slice(0,qIdx).trim();document.getElementById('upQuestions').value=text.slice(qIdx).trim();}
      else{document.getElementById('upPassage').value=text.trim();}
      msg.innerHTML=`✅ "${file.name}" okundu ve aktarıldı! Kaydet butonuna basabilirsin.`;
    };
    if(file.name.endsWith('.pdf'))r.readAsArrayBuffer(file);else r.readAsText(file);
  }

  function parsePassage(raw){
    const parts=raw.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    return parts.map((pt,idx)=>{
      const match=pt.match(/^(?:\[?(?:paragraph|paragraf)?\s*([A-Za-z0-9]+)[\]\.\:\)]\s*)(.*)$/is);
      let pl=letters[idx%letters.length],content=pt;if(match){pl=match[1].toUpperCase();content=match[2].trim();}
      return {id:"p"+pl,pl:pl,t:content};
    });
  }

  function parseQuestions(raw){
    const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const questions=[];let curQ=null;
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const qMatch=line.match(/^(?:(?:soru|question|q)\s*)?(\d+)[\.\)\:\-]\s*(.*)$/i);
      if(qMatch){if(curQ)questions.push(curQ);curQ={q:qMatch[2]||"Soru "+qMatch[1],type:'mc',o:[],a:0,t:'Soru '+qMatch[1],why:'Doğru cevap anahtara göre belirlendi.'};continue;}
      if(!curQ){curQ={q:line,type:'mc',o:[],a:0,t:'Soru 1',why:'Doğru cevap anahtara göre belirlendi.'};continue;}
      const optMatch=line.match(/^[\*\[]?\s*([A-Ea-e])[\.\)\:\-]\s*(.*)$/);
      if(optMatch){const optText=optMatch[2].replace(/^[\*\]]\s*/,'').trim();curQ.o.push(optText);if(line.includes('*')||line.startsWith('[*'))curQ.a=curQ.o.length-1;continue;}
      if(/^(?:true\s*\/\s*false|t\s*\/\s*f)/i.test(line)){curQ.type='tf';curQ.a='True';continue;}
      const ansMatch=line.match(/^(?:answer|cevap|do[gğ]ru(?:\s*cevap)?)\s*[\:\=]\s*([a-e]|true|false|not given|.+)$/i);
      if(ansMatch){const rawAns=ansMatch[1].trim();if(/^(true|false|not given)$/i.test(rawAns))curQ.type='tf',curQ.a=rawAns.charAt(0).toUpperCase()+rawAns.slice(1).toLowerCase();else if(/^[A-E]$/i.test(rawAns))curQ.a=rawAns.toUpperCase().charCodeAt(0)-65;else curQ.type='txt',curQ.a=[rawAns.toLowerCase()];continue;}
      const whyMatch=line.match(/^(?:why|açıklama|aciklama|neden)\s*[\:\=]\s*(.*)$/i);
      if(whyMatch){curQ.why=whyMatch[1].trim();continue;}
      if(curQ.o.length===0&&curQ.type!=='tf')curQ.q+=" "+line;
    }
    if(curQ)questions.push(curQ);return questions;
  }

          else{document.getElementById('fHudMsg').textContent=`🛡️ Kuşatma başarısız.`;}
          checkNextPhaseOrBots();
        },500);
      };
    });
  }

  function checkNextPhaseOrBots(){
    refreshHud();
    const unc=FETIH_TERRITORIES.filter(t=>!fState.owners[t.id]);
    if(fState.phase==='expand'&&unc.length===0){
      fState.phase='battle';document.getElementById('fHudMsg').textContent='🏰 KUŞATMA FAZI BAŞLADI!';
      document.getElementById('fStatusPill').textContent='Düşman kalelerine tıkla ve kuşat!';
      refreshHud();return;
    }
    runBotTurns();
  }

  function runBotTurns(){
    [FETIH_PLAYERS[1],FETIH_PLAYERS[2]].forEach(b=>{
      if(!b.alive)return;
      const myTerrs=FETIH_TERRITORIES.filter(x=>fState.owners[x.id]===b.id).map(x=>x.id);
      if(fState.phase==='expand'){
        const free=FETIH_TERRITORIES.filter(t=>!fState.owners[t.id]&&myTerrs.some(m=>(FETIH_ADJ[m]||[]).includes(t.id)));
        if(free.length&&Math.random()>.3){const pick=free[Math.floor(Math.random()*free.length)];fState.owners[pick.id]=b.id;b.score+=pick.pts;}
      }else if(fState.phase==='battle'){
        const enemies=FETIH_TERRITORIES.filter(t=>fState.owners[t.id]&&fState.owners[t.id]!==b.id&&myTerrs.some(m=>(FETIH_ADJ[m]||[]).includes(t.id)));
        if(enemies.length&&Math.random()>.4){const target=enemies[Math.floor(Math.random()*enemies.length)];fState.owners[target.id]=b.id;}
      }
    });
    fState.round++;
    if(fState.round>=12){
      const ov=document.getElementById('fOverlay'),modal=document.getElementById('fModalBox');ov.classList.add('on');
      const sorted=[...FETIH_PLAYERS].sort((a,b)=>b.score-a.score);
      modal.innerHTML=`<div style="text-align:center"><div style="font-size:40px">🏆👑</div><h2 style="font-family:Fraunces,serif">SAVAŞ BİTTİ</h2><div style="margin:12px 0">${sorted.map((p,i)=>`<div><b>${i+1}. ${p.name}</b>: ${p.score} Puan</div>`).join('')}</div><button class="btn3" onclick="location.reload()">Yeniden Oyna</button></div>`;
    }else{
      refreshHud();
    }
  }

  /* 9. NAV & HOME BANNER */
  function injectAllFeatures(){
    const navLinks=document.querySelector('.nav-links, nav .links, nav, header');
    if(navLinks){
      if(!document.getElementById('navFetihBtn')){
        const btnF=document.createElement('button');btnF.id='navFetihBtn';
        btnF.style.cssText='background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-weight:900;font-size:13px;cursor:pointer;margin-left:6px';
        btnF.innerHTML='⚔️ Arena Fethi';btnF.onclick=openFetihRoom;navLinks.appendChild(btnF);
      }
      if(!document.getElementById('navSinavBtn')){
        const btnB=document.createElement('button');btnB.id='navSinavBtn';
        btnB.style.cssText='background:var(--soft);color:var(--p);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:900;font-size:13px;cursor:pointer;margin-left:4px';
        btnB.innerHTML='📝 Sınav';btnB.onclick=()=>openSinavRoom();navLinks.appendChild(btnB);
      }
    }
    const homeEl=document.getElementById('home');
    if(homeEl){
      if(!document.getElementById('fetihBannerBox')){
        const bannerF=document.createElement('div');bannerF.id='fetihBannerBox';bannerF.className='fetih-banner';
        bannerF.innerHTML=`
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:36px">🗺️</div>
            <div>
              <span class="tag" style="background:#fef3c7;color:#92400e;font-weight:900;font-size:11px">BİL VE FETHET</span>
              <h3 style="margin:2px 0;font-size:17px;color:var(--ink)">Arena Fethi: Krallık Kur</h3>
              <p style="margin:0;font-size:12.5px;color:var(--mut)">15 bölge, 5 vilayet, hızlı düello ve kale kuşatmalarıyla kelime savaşı!</p>
            </div>
          </div>
          <button class="btn3" id="fetihEnterBtn" style="padding:10px 18px;font-size:13px">Fethe Başla ⚔️</button>`;
        homeEl.prepend(bannerF);document.getElementById('fetihEnterBtn').onclick=openFetihRoom;
      }
      if(!document.getElementById('sinavBannerBox')){
        const bannerS=document.createElement('div');bannerS.id='sinavBannerBox';bannerS.className='sinav-banner';
        bannerS.innerHTML=`
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:36px">📝</div>
            <div>
              <span class="tag" style="background:#ccfbf1;color:#0f766e;font-weight:900;font-size:11px">SINAV MODU</span>
              <h3 style="margin:2px 0;font-size:17px;color:var(--ink)">Sınav Odası (Kendi Sınavını Yükle)</h3>
              <p style="margin:0;font-size:12.5px;color:var(--mut)">İstediğin sınavı yükle (PDF/Metin): Metni oku, altını çiz, soruları online çöz ve puanlan!</p>
            </div>
          </div>
          <button class="btn3" id="sinavEnterBtn" style="padding:10px 18px;font-size:13px">Sınav Odasına Gir →</button>`;
        homeEl.prepend(bannerS);document.getElementById('sinavEnterBtn').onclick=()=>openSinavRoom();
      }
    }
    injectPwa();
  }

  window.addEventListener('hashchange',()=>{
    if(location.hash==='#fetih')openFetihRoom();
    else if(location.hash==='#sinav')openSinavRoom();
  });
  setTimeout(()=>{
    injectAllFeatures();
    if(location.hash==='#fetih')openFetihRoom();
    else if(location.hash==='#sinav')openSinavRoom();
  },300);
})();

<script>
(function(){
  /* 1. 1A-SAF LOGO & FAVICON */
  const ARENA_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="lgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14968c"/><stop offset="100%" stop-color="#0b5a55"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.25"/><stop offset="55%" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lgC)"/><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#sheen)"/><rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#fff" stroke-opacity="0.2" stroke-width="1.2" fill="none"/><path d="M15 47.5V30.5a17 17 0 0 1 34 0v17" stroke="#fff" stroke-width="4.8" stroke-linecap="round" fill="none"/><path d="M11.8 47.5H18.2M45.8 47.5H52.2" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M24 47.5V31.5a8 8 0 0 1 16 0v16" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round" fill="none"/><path d="M9.5 53.5 Q20.8 49 32 53.8 Q43.2 49 54.5 53.5" stroke="url(#gold)" stroke-width="2.7" stroke-linecap="round" fill="none"/><path d="M14.5 57 Q23.2 53.8 32 57 Q40.8 53.8 49.5 57" stroke="#fff" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="50" cy="13" r="6.8" fill="#fbbf24" fill-opacity="0.25"/><circle cx="50" cy="13" r="3.7" fill="url(#gold)"/><circle cx="48.8" cy="11.8" r="1.1" fill="#fff" fill-opacity="0.9"/></svg>';
  const ARENA_DATA='data:image/svg+xml,'+encodeURIComponent(ARENA_SVG);
  try{
    let fi=document.querySelector("link[rel*='icon']");if(!fi){fi=document.createElement('link');fi.rel='icon';document.head.appendChild(fi);}
    fi.type='image/svg+xml';fi.href=ARENA_DATA;
    document.querySelectorAll('.brand-badge, .logo, a.brand, header .brand').forEach(el=>{const old=el.querySelector('svg, img');if(old)old.remove();el.insertAdjacentHTML('afterbegin',ARENA_SVG);});
  }catch(e){}

  /* 2. 2 YENİ AKDENİZ PALETİ & HAFIZA */
  function setPal(n){
    if(n==='def'||!n){document.documentElement.removeAttribute('data-theme');localStorage.removeItem('arena_palette');}
    else{document.documentElement.setAttribute('data-theme',n);localStorage.setItem('arena_palette',n);}
    document.querySelectorAll('.pal-btn').forEach(b=>{b.classList.toggle('active',b.dataset.p===n);});
  }
  window.setPal=setPal;
  const savedPal=localStorage.getItem('arena_palette');if(savedPal)setPal(savedPal);

  /* 3. YAZMA MODU 2. HAK */
  let writeFailCount=0;const origQcheck=window.qcheck;
  window.qcheck=function(){
    if(window.qmode!=='yaz'){if(origQcheck)origQcheck.apply(this,arguments);return;}
    const Q=Q_DECK[qi];if(!Q)return;
    const inp=document.getElementById('ans');if(!inp)return;
    const v=inp.value.trim().toLowerCase(), target=(Q.x.en||'').trim().toLowerCase();
    if(v===target){
      writeFailCount=0;if(window.SFX&&SFX.ok)SFX.ok();
      Q.done=1;qok++;inp.disabled=true;
      document.getElementById('fb').innerHTML='<span style="font-weight:800;color:var(--ok)">🎉 Mükemmel! Doğru yazdın.</span>';
      document.getElementById('ck').textContent='Sonraki →';return;
    }
    if(writeFailCount===0){
      writeFailCount=1;if(window.SFX&&SFX.bad)SFX.bad();
      inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);inp.select();
      const hint=target.length>2?(target[0]+' · '.repeat(target.length-2)+target[target.length-1]):target[0]+'…';
      document.getElementById('fb').innerHTML=`<span style="font-weight:800;color:#f59e0b">⚠️ 1 hakkın daha var! İpucu: <code>${hint}</code></span>`;
      return;
    }
    writeFailCount=0;if(window.SFX&&SFX.bad)SFX.bad();
    qlives=Math.max(0,qlives-1);renderLives();

  /* 4. TÜM KELİMELER & 12 SORULUK BOSS */
  window.qstart=function(mode){
    if(!cur||!cur.items||!cur.items.length)return;
    const hasTr=cur.items.filter(x=>x.tr);if(!hasTr.length)return;
    if(mode==='boss'){
      qmode='boss';qi=0;qok=0;qlives=3;Q_DECK=[];
      const shuffled=[...hasTr].sort(()=>Math.random()-.5);
      const pool=shuffled.slice(0,Math.min(12,shuffled.length));
      const types=['sec','esle','yaz','cum'];
      pool.forEach((x,idx)=>{Q_DECK.push({x,type:types[idx%types.length],done:0});});
      renderBossHp();qNext();return;
    }
    qmode=mode;qi=0;qok=0;qlives=3;
    Q_DECK=[...hasTr].sort(()=>Math.random()-.5).map(x=>({x,type:mode,done:0}));
    qNext();
  };

  /* 7. YENİ SINAV MODÜLÜ (ÖZEL SINAV YÜKLEYİCİ & AI SINAV MOTORU) */

  function renderSinavQHtml(q,i){

  function updateSinavProgress(){
    const P=getActiveExam();let ansCount=0;
    P.questions.forEach((q,i)=>{const v=exAnswers[i];const isAns=v!==undefined&&v!=='';if(isAns)ansCount++;const nav=document.getElementById('exNav_'+i);if(nav)nav.classList.toggle('done',isAns);});
    const badge=document.getElementById('exCountBadge');if(badge)badge.textContent=`${ansCount} / ${P.questions.length} cevaplandı`;
  }
  function finishSinavExam(){
    if(exDone)return;exDone=true;if(exTimer)clearInterval(exTimer);
    const P=getActiveExam();let rightCount=0,typeStats={};
    P.questions.forEach((q,i)=>{
      const userVal=(exAnswers[i]||'').toString().trim().toLowerCase();let isCorrect=false;
      if(q.type==='mc')isCorrect=Number(exAnswers[i])===q.a;
      else if(q.type==='tf')isCorrect=userVal===String(q.a).toLowerCase();
      else if(q.type==='txt'){const accepted=Array.isArray(q.a)?q.a:[q.a];isCorrect=accepted.some(a=>userVal.replace(/^the /,'')===String(a).toLowerCase().replace(/^the /,''));}
      if(isCorrect)rightCount++;const tName=q.t||'Sorular';typeStats[tName]=typeStats[tName]||[0,0];typeStats[tName][1]++;if(isCorrect)typeStats[tName][0]++;
      const card=document.getElementById('exQCard_'+i),nav=document.getElementById('exNav_'+i);
      if(card){card.classList.add('graded');card.style.borderColor=isCorrect?'var(--ok)':'var(--bad)';}
      if(nav){nav.classList.remove('done');nav.classList.add(isCorrect?'right':'wrong');}
      if(q.type==='mc'||q.type==='tf'){card.querySelectorAll('.ex-opt').forEach(opt=>{const val=opt.dataset.v;if((q.type==='mc'&&Number(val)===q.a)||(q.type==='tf'&&val.toLowerCase()===String(q.a).toLowerCase()))opt.classList.add('ok');else if(opt.classList.contains('sel'))opt.classList.add('no');});}
      const correctStr=q.type==='mc'?q.o[q.a]:(q.type==='tf'?q.a:(Array.isArray(q.a)?q.a[0]:q.a));
      const evBox=card.querySelector('.ex-ev');
      if(evBox){evBox.innerHTML=`<div style="font-weight:800;color:${isCorrect?'var(--ok)':'var(--bad)'}">${isCorrect?'✅ Doğru!':'❌ Doğru Cevap: '+correctStr}</div><div style="margin:4px 0">${q.why||'Metin incelemesine göre cevap doğrulanmıştır.'}</div>${q.ev?`<button type="button" class="pill" data-ev="${q.ev}" style="padding:4px 10px;font-size:12px;margin-top:4px">📍 Kanıtı Göster</button>`:''}`;}
    });
    const pct=Math.round((rightCount/P.questions.length)*100);
    const ring=document.getElementById('exScoreRing');if(ring)ring.style.setProperty('--v',pct);
    const scoreText=document.getElementById('exScoreText');if(scoreText)scoreText.innerHTML=`${pct}%<br><small style="font-size:12px;color:var(--mut)">${rightCount} / ${P.questions.length} Doğru</small>`;

  async function extractPdfText(file){
    if(!window.pdfjsLib){
      await new Promise(resolve=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload=()=>{
          if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          resolve();
        };
        s.onerror=()=>resolve();
        document.head.appendChild(s);
      });
    }
    if(window.pdfjsLib){
      const ab=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:ab}).promise;
      let full="";
      for(let i=1;i<=pdf.numPages;i++){
        const p=await pdf.getPage(i);
        const tc=await p.getTextContent();
        let lastY=null,line="";
        for(const item of tc.items){
          if(lastY!==null&&Math.abs(item.transform[5]-lastY)>6){line+="\n";}
          else if(line&&!line.endsWith(" ")&&!item.str.startsWith(" ")){line+=" ";}
          line+=item.str;
          lastY=item.transform[5];
        }
        full+=line+"\n\n";
      }
      return full;
    }
    return "";
  }

  function splitPassageAndQuestions(raw){
    let cleaned=raw.replace(/\bPage\s+\d+\s+of\s+\d+\b/gi,'').replace(/---\s*Page\s+\d+\s*---/gi,'').trim();
    const markers=[
      /\n\s*(?:part\s+[b-z]|section\s+[2-9]|questions|reading\s+comprehension\s+questions)\b/i,
      /\n\s*(?:question\s+1\b|q1[\.\:\)]|1[\.\)]\s+[A-Z])/i,
      /\n\s*1\.\s+(?:What|According|Which|Why|How)\b/i
    ];
    let splitIdx=-1;
    for(const re of markers){
      const m=cleaned.search(re);
      if(m>120){splitIdx=m;break;}
    }
    if(splitIdx!==-1){
      return {passage:cleaned.slice(0,splitIdx).trim(),questions:cleaned.slice(splitIdx).trim()};
    }
    return {passage:cleaned,questions:""};
  }

  function parsePassage(raw){
    // Bytecode satırlarını at
    const parts=raw.split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p&&!isPdfGarbage(p));
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    return parts.map((pt,idx)=>{
      const match=pt.match(/^(?:\[?(?:paragraph|paragraf)?\s*([A-Za-z0-9]+)[\]\.\:\)]\s*)(.*)$/is);
      let pl=letters[idx%letters.length],content=pt;if(match){pl=match[1].toUpperCase();content=match[2].trim();}
      return {id:"p"+pl,pl:pl,t:content};
    });
  }

  function isPdfGarbage(line){
    return /endstream|endobj|\/Resources|\/ProcSet|\/XObject|\/Subtype|\/Length|\/Matrix|\[\s*0\s+0\.0|MWFOForm/i.test(line);
  }

  function parseQuestionsSafe(raw){
    const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!isPdfGarbage(l));
    const questions=[];let curQ=null;
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const qMatch=line.match(/^(?:(?:soru|question|q)\s*)?(\d+)[\.\)\:\-]\s*(.*)$/i);
      if(qMatch){
        if(curQ&&(curQ.o.length>0||curQ.type==='tf'||curQ.type==='txt')) questions.push(curQ);
        curQ={q:qMatch[2]||"Soru "+qMatch[1],type:'mc',o:[],a:0,t:'Soru '+qMatch[1],why:'Doğru cevap anahtara göre belirlendi.'};
        continue;
      }
      if(!curQ) continue;
      const optMatch=line.match(/^[\*\[]?\s*([A-Ea-e])[\.\)\:\-]\s*(.*)$/);
      if(optMatch){
        const optText=optMatch[2].replace(/^[\*\]]\s*/,'').trim();curQ.o.push(optText);
        if(line.includes('*')||line.startsWith('[*'))curQ.a=curQ.o.length-1;continue;
      }
      if(/^(?:true\s*\/\s*false|t\s*\/\s*f)/i.test(line)){curQ.type='tf';curQ.a='True';continue;}
      const ansMatch=line.match(/^(?:answer|cevap|do[gğ]ru(?:\s*cevap)?)\s*[\:\=]\s*([a-e]|true|false|not given|.+)$/i);
      if(ansMatch){
        const rawAns=ansMatch[1].trim();
        if(/^(true|false|not given)$/i.test(rawAns))curQ.type='tf',curQ.a=rawAns.charAt(0).toUpperCase()+rawAns.slice(1).toLowerCase();
        else if(/^[A-E]$/i.test(rawAns))curQ.a=rawAns.toUpperCase().charCodeAt(0)-65;
        else curQ.type='txt',curQ.a=[rawAns.toLowerCase()];
        continue;
      }
      const whyMatch=line.match(/^(?:why|açıklama|aciklama|neden)\s*[\:\=]\s*(.*)$/i);
      if(whyMatch){curQ.why=whyMatch[1].trim();continue;}
      if(curQ.o.length===0&&curQ.type!=='tf')curQ.q+=" "+line;
    }
    if(curQ&&(curQ.o.length>0||curQ.type==='tf'||curQ.type==='txt')) questions.push(curQ);
    return questions;
  }

    t9:['t2','t5','t7','t8','t14'],t10:['t3','t11','t12'],t11:['t3','t7','t8','t10','t12','t13'],
    t12:['t10','t11','t13'],t13:['t8','t11','t12','t14'],t14:['t8','t9','t13','t15'],t15:['t5','t6','t14']
  };
  const FETIH_PLAYERS=[
    {id:'p1',name:'Sen (Gladyatör)',col:'#0f766e',score:0,combo:0,alive:true,bot:false,avatar:'🛡️'},
    {id:'p2',name:'Kızıl Baron (Bot)',col:'#b91c1c',score:0,combo:0,alive:true,bot:true,avatar:'⚔️'},
    {id:'p3',name:'Gölge Lordu (Bot)',col:'#1d4ed8',score:0,combo:0,alive:true,bot:true,avatar:'🏹'}
  ];
  let fState={phase:'lobby',turnP:0,round:1,owners:{},towers:{t1:3,t4:3,t10:3,t13:3},selectedT:null,attackTarget:null,activeQ:null,timer:null,weakWords:[]};

  function openFetihRoom(){
    const main=document.getElementById('main');if(!main)return;
    let room=document.getElementById('fetihRoom');
    if(!room){room=document.createElement('div');room.id='fetihRoom';room.className='fetih-room';main.prepend(room);}
    hideAllRooms();room.classList.add('on');renderFetihLobby(room);room.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function closeFetihRoom(){
    const room=document.getElementById('fetihRoom');if(room)room.classList.remove('on');
    const home=document.getElementById('home');if(home)home.style.display='block';
    if(fState.timer)clearInterval(fState.timer);
  }
  function hideAllRooms(){
    const f=document.getElementById('fetihRoom');if(f)f.classList.remove('on');
    const b=document.getElementById('sinavRoom');if(b)b.classList.remove('on');
    const home=document.getElementById('home');if(home)home.style.display='none';
  }
  function renderFetihLobby(room){
    room.innerHTML=`
      <div class="f-lobby">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <button class="pill" id="fBackBtn" style="padding:6px 12px;font-size:12.5px">← Arenaya Dön</button>
          <span style="font-size:12px;font-weight:900;color:var(--acc)">⚔️ ARENA FETHİ V2</span>
        </div>
        <div style="max-width:500px;margin:0 auto">
          <div style="font-size:42px;margin-bottom:6px">🗺️⚔️🏰</div>
          <h2 style="font-family:Fraunces,serif;font-size:24px;margin:0 0 6px">Arena Fethi: Krallık Kur</h2>
          <p style="font-size:13.5px;color:var(--mut);line-height:1.5;margin:0 0 14px">15 bölgeli strateji ve kelime savaşı! Hızlı düello ile başla, vilayet bonuslarını topla ve rakiplerin kalelerini kuşat!</p>
          <button class="btn3" id="fStartGameBtn" style="font-size:15px;padding:12px 28px">Savaşı Başlat (Düello) ⚔️</button>
        </div>
      </div>`;
    document.getElementById('fBackBtn').onclick=closeFetihRoom;
    document.getElementById('fStartGameBtn').onclick=startSpeedDuelPhase;
  }
  function startSpeedDuelPhase(){
    fState={phase:'duel',turnP:0,round:1,owners:{},towers:{t1:3,t4:3,t10:3,t13:3},selectedT:null,attackTarget:null,activeQ:null,timer:null,weakWords:[]};
    FETIH_PLAYERS.forEach(p=>{p.score=0;p.combo=0;p.alive=true;});
    renderFetihGameDOM();launchSpeedDuelModal();
  }
  function renderFetihGameDOM(){
    const room=document.getElementById('fetihRoom');if(!room)return;
    room.innerHTML=`
      <div class="f-hud">
        <button class="pill" id="fQuitBtn" style="padding:6px 12px;font-size:12px">← Çıkış</button>
        <span style="font-size:12.5px;font-weight:800;color:var(--p)">⚔️ Arena Fethi</span>
        <div class="f-evt" id="fHudMsg">Hızlı Düello Başlıyor!</div>
      </div>
      <div class="f-gm">
        <div class="f-mapw">
          <div class="f-status" id="fStatusPill">En hızlı çözen başkenti kapar!</div>
          <svg viewBox="0 0 380 440" id="fSvgMap">${renderSvgMap()}</svg>
        </div>
        <div class="f-side">
          <div class="eyebrow">Savaşçılar</div>
          <div id="fPlayersList">${renderPlayersList()}</div>
          <div class="eyebrow" style="margin-top:6px">Vilayetler</div>
          <div id="fProvinceList">${renderProvincesList()}</div>
        </div>
      </div>
      <div class="f-ov" id="fOverlay"><div class="f-md" id="fModalBox"></div></div>`;
    document.getElementById('fQuitBtn').onclick=closeFetihRoom;
    attachMapClicks();
  }
  function hexPath(cx,cy,r){
    const pts=[];for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
    return pts.join(' ');
  }
  function renderSvgMap(){
    let conn='';
    Object.entries(FETIH_ADJ).forEach(([fromId,tos])=>{
      const from=FETIH_TERRITORIES.find(t=>t.id===fromId);if(!from)return;
      tos.forEach(toId=>{const to=FETIH_TERRITORIES.find(t=>t.id===toId);if(to&&from.id<to.id){conn+=`<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="3,3"/>`;}});
    });
    const hexes=FETIH_TERRITORIES.map(t=>{
      const prov=FETIH_PROVINCES.find(p=>p.id===t.pv);
      const owner=fState.owners[t.id];
      const ownerPl=owner?FETIH_PLAYERS.find(p=>p.id===owner):null;
      const fill=ownerPl?ownerPl.col:(prov?prov.col:'#cbd5e1');
      const isSel=fState.selectedT===t.id;
      return `<g class="rg ${isSel?'sel':''}" data-tid="${t.id}">
        <polygon points="${hexPath(t.x,t.y,38)}" fill="${fill}" stroke="#fff" stroke-width="${isSel?'3.5':'2'}" opacity="${owner?'1':'.85'}"/>
        ${t.isCap?`<text x="${t.x}" y="${t.y-14}" font-size="10" text-anchor="middle">👑</text>`:''}
        <text x="${t.x}" y="${t.y+1}" font-size="10.5" font-weight="800" text-anchor="middle" fill="#fff" style="text-shadow:0 1px 3px rgba(0,0,0,.6)">${t.n}</text>
        <text x="${t.x}" y="${t.y+13}" font-size="9" font-weight="900" text-anchor="middle" fill="#fef3c7">${t.pts}P</text>
      </g>`;
    }).join('');
    return conn+hexes;
  }
  function renderPlayersList(){
    return FETIH_PLAYERS.map(p=>{
      const isTurn=FETIH_PLAYERS[fState.turnP]&&FETIH_PLAYERS[fState.turnP].id===p.id;
      return `<div class="f-pl ${isTurn?'turn':''} ${!p.alive?'dead':''}">
        <div class="f-av" style="background:${p.col}">${p.avatar}</div>
        <div style="flex:1"><div style="display:flex;justify-content:space-between"><b>${p.name}</b><span>${p.score}P</span></div><div style="font-size:11px;color:var(--mut)">Seri: ${p.combo}x</div></div>
      </div>`;
    }).join('');
  }
  function renderProvincesList(){
    return FETIH_PROVINCES.map(pv=>{
      const pTerrs=FETIH_TERRITORIES.filter(t=>t.pv===pv.id);
      return `<div class="f-pv"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${pv.col}"></span><span style="flex:1"><b>${pv.name}</b> (+${pv.bonus}P)</span><span>${pTerrs.filter(t=>fState.owners[t.id]).length}/${pTerrs.length}</span></div>`;
    }).join('');
  }
  function refreshHud(){
    const mapEl=document.getElementById('fSvgMap');if(mapEl)mapEl.innerHTML=renderSvgMap();
    const plEl=document.getElementById('fPlayersList');if(plEl)plEl.innerHTML=renderPlayersList();
    const pvEl=document.getElementById('fProvinceList');if(pvEl)pvEl.innerHTML=renderProvincesList();
    attachMapClicks();
  }
  function attachMapClicks(){document.querySelectorAll('.rg').forEach(el=>{el.onclick=()=>handleTerritoryClick(el.dataset.tid);});}

  function launchSpeedDuelModal(){
    const modal=document.getElementById('fModalBox'),ov=document.getElementById('fOverlay');ov.classList.add('on');
    const w=FETIH_WORDS[Math.floor(Math.random()*FETIH_WORDS.length)];
    const wrongs=FETIH_WORDS.filter(x=>x[0]!==w[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]);
    const choices=[w[1],...wrongs].sort(()=>Math.random()-.5);
    modal.innerHTML=`
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="tag" style="background:#fef3c7;color:#92400e">⚡ HIZLI DÜELLO</span></div>
      <h3 style="font-family:Fraunces,serif;font-size:20px;margin:0 0 4px">"${w[0]}" ne demek?</h3>
      <p style="font-size:12px;color:var(--mut);margin:0 0 10px">En hızlı doğru cevabı veren başkenti kurar!</p>
      <div class="f-an" id="duelOpts">${choices.map((c,k)=>`<button data-c="${c}"><b>${'ABCD'[k]})</b> ${c}</button>`).join('')}</div>`;
    modal.querySelectorAll('#duelOpts button').forEach(b=>{
      b.onclick=()=>{
        const isOk=b.dataset.c===w[1];b.classList.add(isOk?'ok':'no');
        setTimeout(()=>{
          ov.classList.remove('on');
          fState.owners['t1']='p1';fState.owners['t4']='p2';fState.owners['t10']='p3';
          FETIH_PLAYERS.forEach(p=>p.score+=100);fState.phase='expand';
          document.getElementById('fHudMsg').textContent='🎉 Başkentler kuruldu! Yayılma başladı.';
          document.getElementById('fStatusPill').textContent='Komşu bir gri bölgeye tıkla ve fethet!';
          refreshHud();
        },500);
      };
    });
  }

  function handleTerritoryClick(tid){
    const t=FETIH_TERRITORIES.find(x=>x.id===tid);if(!t)return;
    if(FETIH_PLAYERS[fState.turnP].bot)return;
    const myTerrs=FETIH_TERRITORIES.filter(x=>fState.owners[x.id]==='p1').map(x=>x.id);
    const isNeighbor=myTerrs.some(myId=>(FETIH_ADJ[myId]||[]).includes(tid));
    if(fState.phase==='expand'){
      if(fState.owners[tid]){alert('Bu bölge zaten fethedilmiş!');return;}
      if(!isNeighbor){alert('Sadece sınırındaki bölgeleri seçebilirsin!');return;}
      launchExpansionQuestion(t,'p1');
    }else if(fState.phase==='battle'){
      if(fState.owners[tid]==='p1'){alert('Bu bölge zaten senin!');return;}
      if(!isNeighbor){alert('Kuşatmak için sınırında olmalısın!');return;}
      launchSiegeQuestion(t,'p1',fState.owners[tid]);
    }
  }

  function launchExpansionQuestion(t,pid){
    const ov=document.getElementById('fOverlay'),modal=document.getElementById('fModalBox');ov.classList.add('on');
    const w=FETIH_WORDS[Math.floor(Math.random()*FETIH_WORDS.length)];
    const wrongs=FETIH_WORDS.filter(x=>x[0]!==w[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]);
    const options=[w[1],...wrongs].sort(()=>Math.random()-.5);
    modal.innerHTML=`
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="tag" style="background:#ccfbf1;color:#0f766e">🏰 BÖLGE FETHİ: ${t.n}</span><span style="font-weight:800;color:var(--acc)">+${t.pts}P</span></div>
      <h3 style="font-family:Fraunces,serif;font-size:18px;margin:0 0 6px">"${w[0]}" anlamı nedir?</h3>
      <div class="f-an" id="expOpts">${options.map((opt,k)=>`<button data-opt="${opt}"><b>${'ABCD'[k]})</b> ${opt}</button>`).join('')}</div>`;
    modal.querySelectorAll('#expOpts button').forEach(b=>{
      b.onclick=()=>{
        const isOk=b.dataset.opt===w[1];b.classList.add(isOk?'ok':'no');
        setTimeout(()=>{
          ov.classList.remove('on');
          if(isOk){fState.owners[t.id]=pid;FETIH_PLAYERS[0].score+=t.pts;document.getElementById('fHudMsg').textContent=`🎉 ${t.n} fethedildi! (+${t.pts}P)`;}
          else{document.getElementById('fHudMsg').textContent=`❌ Yanlış! ${t.n} alınamadı.`;}
          checkNextPhaseOrBots();
        },500);
      };
    });
  }

  function launchSiegeQuestion(t,atkPid,defPid){
    const ov=document.getElementById('fOverlay'),modal=document.getElementById('fModalBox');ov.classList.add('on');
    const w=FETIH_WORDS[Math.floor(Math.random()*FETIH_WORDS.length)];
    const wrongs=FETIH_WORDS.filter(x=>x[0]!==w[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]);
    const options=[w[1],...wrongs].sort(()=>Math.random()-.5);
    modal.innerHTML=`
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="tag" style="background:#fee2e2;color:#991b1b">🔥 KUŞATMA: ${t.n}</span></div>
      <h3 style="font-family:Fraunces,serif;font-size:18px;margin:0 0 6px">"${w[0]}" anlamı nedir?</h3>
      <div class="f-an" id="siegeOpts">${options.map((opt,k)=>`<button data-opt="${opt}"><b>${'ABCD'[k]})</b> ${opt}</button>`).join('')}</div>`;
    modal.querySelectorAll('#siegeOpts button').forEach(b=>{
      b.onclick=()=>{
        const isOk=b.dataset.opt===w[1];b.classList.add(isOk?'ok':'no');
        setTimeout(()=>{
          ov.classList.remove('on');
          if(isOk){fState.owners[t.id]=atkPid;FETIH_PLAYERS[0].score+=t.pts*2;document.getElementById('fHudMsg').textContent=`💥 KALE DÜŞTÜ! ${t.n} senin!`;}
          else{document.getElementById('fHudMsg').textContent=`🛡️ Kuşatma başarısız.`;}
          checkNextPhaseOrBots();
        },500);
      };
    });
  }

  function checkNextPhaseOrBots(){
    refreshHud();
    const unc=FETIH_TERRITORIES.filter(t=>!fState.owners[t.id]);
    if(fState.phase==='expand'&&unc.length===0){
      fState.phase='battle';document.getElementById('fHudMsg').textContent='🏰 KUŞATMA FAZI BAŞLADI!';
      document.getElementById('fStatusPill').textContent='Düşman kalelerine tıkla ve kuşat!';
      refreshHud();return;
    }
    runBotTurns();
  }

  function runBotTurns(){
    [FETIH_PLAYERS[1],FETIH_PLAYERS[2]].forEach(b=>{
      if(!b.alive)return;
      const myTerrs=FETIH_TERRITORIES.filter(x=>fState.owners[x.id]===b.id).map(x=>x.id);
      if(fState.phase==='expand'){
        const free=FETIH_TERRITORIES.filter(t=>!fState.owners[t.id]&&myTerrs.some(m=>(FETIH_ADJ[m]||[]).includes(t.id)));
        if(free.length&&Math.random()>.3){const pick=free[Math.floor(Math.random()*free.length)];fState.owners[pick.id]=b.id;b.score+=pick.pts;}
      }else if(fState.phase==='battle'){
        const enemies=FETIH_TERRITORIES.filter(t=>fState.owners[t.id]&&fState.owners[t.id]!==b.id&&myTerrs.some(m=>(FETIH_ADJ[m]||[]).includes(t.id)));
        if(enemies.length&&Math.random()>.4){const target=enemies[Math.floor(Math.random()*enemies.length)];fState.owners[target.id]=b.id;}
      }
    });
    fState.round++;
    if(fState.round>=12){
      const ov=document.getElementById('fOverlay'),modal=document.getElementById('fModalBox');ov.classList.add('on');
      const sorted=[...FETIH_PLAYERS].sort((a,b)=>b.score-a.score);
      modal.innerHTML=`<div style="text-align:center"><div style="font-size:40px">🏆👑</div><h2 style="font-family:Fraunces,serif">SAVAŞ BİTTİ</h2><div style="margin:12px 0">${sorted.map((p,i)=>`<div><b>${i+1}. ${p.name}</b>: ${p.score} Puan</div>`).join('')}</div><button class="btn3" onclick="location.reload()">Yeniden Oyna</button></div>`;
    }else{
      refreshHud();
    }
  }

  /* 9. NAV & HOME BANNER */
  function injectAllFeatures(){
    const navLinks=document.querySelector('.nav-links, nav .links, nav, header');
    if(navLinks){
      if(!document.getElementById('navFetihBtn')){
        const btnF=document.createElement('button');btnF.id='navFetihBtn';
        btnF.style.cssText='background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-weight:900;font-size:13px;cursor:pointer;margin-left:6px';
        btnF.innerHTML='⚔️ Arena Fethi';btnF.onclick=openFetihRoom;navLinks.appendChild(btnF);
      }
      if(!document.getElementById('navSinavBtn')){
        const btnB=document.createElement('button');btnB.id='navSinavBtn';
        btnB.style.cssText='background:var(--soft);color:var(--p);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:900;font-size:13px;cursor:pointer;margin-left:4px';
        btnB.innerHTML='📝 Sınav';btnB.onclick=()=>openSinavRoom();navLinks.appendChild(btnB);
      }
    }
    const homeEl=document.getElementById('home');
    if(homeEl){
      if(!document.getElementById('fetihBannerBox')){
        const bannerF=document.createElement('div');bannerF.id='fetihBannerBox';bannerF.className='fetih-banner';
        bannerF.innerHTML=`
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:36px">🗺️</div>
            <div>
              <span class="tag" style="background:#fef3c7;color:#92400e;font-weight:900;font-size:11px">BİL VE FETHET</span>
              <h3 style="margin:2px 0;font-size:17px;color:var(--ink)">Arena Fethi: Krallık Kur</h3>
              <p style="margin:0;font-size:12.5px;color:var(--mut)">15 bölge, 5 vilayet, hızlı düello ve kale kuşatmalarıyla kelime savaşı!</p>
            </div>
          </div>
          <button class="btn3" id="fetihEnterBtn" style="padding:10px 18px;font-size:13px">Fethe Başla ⚔️</button>`;
        homeEl.prepend(bannerF);document.getElementById('fetihEnterBtn').onclick=openFetihRoom;
      }
      if(!document.getElementById('sinavBannerBox')){
        const bannerS=document.createElement('div');bannerS.id='sinavBannerBox';bannerS.className='sinav-banner';
        bannerS.innerHTML=`
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:36px">📝</div>
            <div>
              <span class="tag" style="background:#ccfbf1;color:#0f766e;font-weight:900;font-size:11px">SINAV MODU</span>
              <h3 style="margin:2px 0;font-size:17px;color:var(--ink)">Sınav Odası (Kendi Sınavını Yükle)</h3>
              <p style="margin:0;font-size:12.5px;color:var(--mut)">İstediğin sınavı yükle (PDF/Metin): Metni oku, altını çiz, soruları online çöz ve puanlan!</p>
            </div>
          </div>
          <button class="btn3" id="sinavEnterBtn" style="padding:10px 18px;font-size:13px">Sınav Odasına Gir →</button>`;
        homeEl.prepend(bannerS);document.getElementById('sinavEnterBtn').onclick=()=>openSinavRoom();
      }
    }
    injectPwa();
  }

  window.addEventListener('hashchange',()=>{
    if(location.hash==='#fetih')openFetihRoom();
    else if(location.hash==='#sinav')openSinavRoom();
  });
  setTimeout(()=>{
    injectAllFeatures();
    if(location.hash==='#fetih')openFetihRoom();
    else if(location.hash==='#sinav')openSinavRoom();
  },300);
})();
</script>
