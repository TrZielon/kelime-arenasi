<!DOCTYPE html>
<html lang="tr" data-theme="arena">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelime Arenası</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

:root{
  --bg:#0d0920;--p:#171130;--p2:#1f1840;--ink:#f7f3ff;--m:#a79cd6;
  --a:#ffc857;--a2:#ff9f43;--ok:#34d399;--bad:#ff5d73;--b:#2a2352;
  --r:18px;--sh:0 12px 30px -14px rgba(0,0,0,.65);
  --ring:0 0 0 3px rgba(255,200,87,.45);
  color-scheme:dark;
}
[data-theme=neon]{
  --bg:#04050c;--p:#0c1026;--p2:#131a3a;--ink:#e6fbff;--m:#7088b0;
  --a:#27f4ff;--a2:#b388ff;--ok:#7dff6b;--bad:#ff3ea5;--b:#161d3c;
  --ring:0 0 0 3px rgba(39,244,255,.45);
}
[data-theme=kagit]{
  --bg:#f3ecdb;--p:#fffcf4;--p2:#f7f0de;--ink:#2a2118;--m:#7a6b57;
  --a:#b5562b;--a2:#d9823b;--ok:#2e8b57;--bad:#c0392b;--b:#e8dcc2;
  --sh:0 8px 24px -14px rgba(60,40,20,.35);
  --ring:0 0 0 3px rgba(181,86,43,.35);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(1000px 500px at 50% -10%,var(--p2),transparent 60%),var(--bg);
  color:var(--ink);
  font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  transition:background .3s,color .3s;
}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px}

#app{max-width:700px;margin:0 auto;padding:14px 16px 40px}

header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0;
  background:linear-gradient(var(--bg) 75%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.brand{
  font-weight:800;font-size:22px;letter-spacing:-.3px;
  background:linear-gradient(90deg,var(--a),var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hud{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.hud>span{background:var(--p);border:1px solid var(--b);border-radius:999px;padding:6px 12px;font-weight:700}

.pill,select{
  background:var(--p);border:1.5px solid var(--b);border-radius:999px;
  padding:7px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:14px;
  transition:transform .15s,border-color .2s,background .2s;
}
.pill:hover,select:hover{border-color:var(--m)}
.pill:active,.btn:active,.opt:active,.tile:active{transform:scale(.97)}
.on{border-color:var(--a)!important;color:var(--a);background:var(--p2)}
select{padding-right:14px;max-width:180px}

.steps{
  display:flex;gap:6px;justify-content:safe center;
  overflow-x:auto;padding:8px 2px 10px;margin-top:6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.steps::-webkit-scrollbar{display:none}
.steps .pill{flex:0 0 auto}
.steps .pill:disabled{opacity:.35;cursor:not-allowed}

.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden;margin:4px 0 6px}
.bar i{
  display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,var(--a),var(--a2));
  transition:width .4s ease;
}

.btn{
  background:linear-gradient(135deg,var(--a),var(--a2));color:#1a1020;
  border:0;border-radius:14px;padding:12px 22px;min-height:46px;
  font-weight:800;font-size:15px;cursor:pointer;
  box-shadow:0 8px 20px -10px var(--a);
  transition:transform .15s,filter .2s;
}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ok{background:linear-gradient(135deg,var(--ok),#22c55e);color:#04210f}
.btn.bad{background:linear-gradient(135deg,var(--bad),#ff3b5c);color:#fff}

.box{
  background:var(--p);border:1px solid var(--b);border-top:3px solid var(--a);
  border-radius:var(--r);padding:20px;margin:12px 0;text-align:center;
  box-shadow:var(--sh);animation:rise .35s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.big{font-size:clamp(26px,7vw,36px);font-weight:800;margin:8px 0;letter-spacing:-.3px;word-break:break-word}
.sent{font-size:18px;line-height:1.85;text-align:left;margin:10px 0}

.tk{
  cursor:pointer;border-bottom:2px dotted var(--m);border-radius:4px;
  padding:0 1px;transition:background .15s,color .15s;
}
.tk:hover,.tk.sel{background:var(--b);color:var(--a);border-bottom-color:transparent}

.tip{
  min-height:48px;margin-top:10px;text-align:left;font-size:15px;
  background:var(--p2);border-radius:12px;padding:10px 12px;
}
.tip b{color:var(--a)}
.tip a{color:var(--a);text-decoration:none;font-weight:600}
.tip a:hover{text-decoration:underline}

.chip{
  display:inline-block;background:var(--b);border-radius:999px;
  padding:3px 10px;margin:3px;font-size:13px;
}
.m{color:var(--m);font-size:14px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}

.opt{
  display:block;width:100%;margin:8px 0;padding:14px 16px;min-height:52px;
  border-radius:14px;border:1.5px solid var(--b);background:var(--p);color:var(--ink);
  text-align:left;cursor:pointer;font-size:16px;font-weight:600;
  transition:border-color .2s,background .2s,transform .15s;
}
.opt:hover:not(:disabled){border-color:var(--m);background:var(--p2)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--p))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--p))}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols>div{min-width:0}
.tile{
  display:block;width:100%;margin:6px 0;padding:12px;min-height:52px;
  border-radius:14px;border:1.5px solid var(--b);background:var(--p);color:var(--ink);
  text-align:left;cursor:pointer;word-break:break-word;font-weight:600;
  transition:border-color .2s,background .2s,opacity .3s;
}
.tile:hover{border-color:var(--m)}
.tile.sel{border-color:var(--a);background:var(--p2);box-shadow:inset 0 0 0 2px var(--a)}
.tile.gone{opacity:.25;pointer-events:none;border-color:var(--ok)}
.tile.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

input,textarea{
  width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--b);
  background:var(--p);color:var(--ink);font-size:16px;transition:border-color .2s;
}
input:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:var(--ring)}
textarea{min-height:140px;resize:vertical}

.fb{min-height:28px;margin:8px 0;text-align:center;font-weight:600}
.good{color:var(--ok)}
.bad2{color:var(--bad)}

.boxes{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  font-size:13px;color:var(--m);margin-top:18px;
}
.boxes>span{background:var(--p);border:1px solid var(--b);border-radius:999px;padding:4px 10px}
.boxes b{color:var(--a)}

@media(max-width:480px){
  #app{padding:12px}
  .brand{font-size:19px}
  .sent{font-size:17px}
  .tile{font-size:14px;padding:10px}
  .cols{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">⚔️ Kelime Arenası</div>
<div class="hud"><span>⭐ <b id="xp">0</b></span><select id="pk"></select><button class="pill" id="addb">＋ Liste</button><button class="pill" id="del" hidden>🗑</button><button class="pill" id="th">🎨</button><button class="pill" id="snd">🔊</button></div></header>
<nav class="steps" id="steps"></nav>
<div class="m" id="enr" style="text-align:center;min-height:20px"></div><div class="bar"><i id="pb" style="width:0"></i></div>
<main id="st"></main>
<footer class="boxes" id="ft"></footer>
</div>
<script>
const DEF=`rule - Yönetmek, hükmetmek
ruler - Hükümdar, yönetici
ally - Partner, ortak, müttefik
alliance - İttifak
boundary - Sınır
rationale - Bir şeyin arkasındaki sebep, amaç
hinder - Engellemek
hesitate - Çekinmek, tereddüt etmek
prevail - Baskın, yaygın olmak
prevalent - Yaygın, baskın
concerning / about / regarding / as to - İle alakalı, ile ilgili
fallacy / misconception - Yanlış fikir, yanlış inanç
suppose / assume - Varsaymak
supposition / assumption - Varsayım
rival - Rakip
rivalry - Rekabet
treaty - Antlaşma

successor - Varis
expand - Genişlemek
expansion - Genişleme
overt - Açıktan yapılan
covert - Gizli, örtülü
means - Araç
retain - Tutmak, bırakmamak, akılda tutmak
trace - İz
susceptible / vulnerable - Savunmasız, zayıf

heat - Isı

behind bars - Hapiste
worry - Endişe

deceive / fool / trick / mislead - Kandırmak, yanıltmak

invasion - İşgal

post-X - X sonrası

following / after - Sonra, ardından
retail - Satış, perakende satış
leftover - Arta kalanlar
toss - Fırlatmak, atmak
expire - Süresi dolmak, zamanı geçmek
take a toll - Zarar vermek
fertilizer - Gübre
pesticide - Haşere öldürücü kimyasal
seed - Tohum
quantity - Miktar
trivial - Önemsiz

discard - Atmak, çöpe atmak

finite - Sınırlı
extravagancy - Müsriflik
impeccable / perfect / flawless - Kusursuz, mükemmel
evaluate - Değerlendirmek
dispute - Anlaşmazlık, tartışma
excuse - Bahane
compensate - Zararı tazmin etmek
trim - Kesmek, keserek kısaltmak
grain - Tahıl
yield - Verim
unprecedented - Eşi benzeri görülmemiş
account for - Oluşturmak, teşkil etmek
per capita / per person - Kişi başına
urgency - Aciliyet
allot / allocate - Ayırmak, tahsis etmek
shrink - Küçültmek, küçülmek
water-intensive - Çok su gerektiren
X-intensive - Çok X gerektiren`;

const BATCH=`Sen BUEPT düzeyinde akademik İngilizce öğretmenisin. YALNIZCA geçerli JSON döndür: {"items":[...]}. Girdideki her satır "en - tr" biçimindedir (anlam yoksa tr alanına uygun Türkçe anlam yaz). Her kelime için: "en" girdideki kelimenin aynısı; "tr" Türkçe anlam; "s" kelimeyi içeren akademik C1 düzeyinde 14-22 kelimelik tek İngilizce cümle; "st" cümlenin doğal Türkçe çevirisi; "d" cümlenin anlamı olarak yanlış ama makul görünen 3 Türkçe çeviri dizisi; "gl" cümledeki önemli kelimelerin en fazla 10 tanesi için {"kelime":"Türkçe anlam"} (küçük harf); "mo" ek-kök ayrımı öğretici en fazla 3 kelime için {"kelime":[["parça","kök" veya "ek","kısa Türkçe açıklama"]]}. "X" içeren maddelerde X yerine gerçek bir örnek kullan (ör. post-harvest, energy-intensive) ve cümlede onu kullan.`;
const GS=10,PRUN={},FILL={};let GI=0;
const PARA_G=`Sen BUEPT sınavına hazırlanan öğrenciler için akademik İngilizce paragraf yazan uzman bir yazarsın. YALNIZCA geçerli JSON döndür. Kurallar: (1) Verilen her kalıbı paragrafta en az bir kez, parantez içindeki Türkçe anlamına uygun ve doğal çekimli biçimde kullan. \"a / b / c\" biçimindeki kalıplarda bunlardan biri yeterlidir. X içeren kalıplarda X yerine gerçek bir kelime kullan (ör. energy-intensive). (2) Tek bir konu seç ve bütün cümleleri o konuya bağla. Cümleler arasında mantıksal bağlar kullan (neden-sonuç, karşıtlık, örnek, sonuç). (3) İlk cümle konuyu tanıtan net bir ana cümle olsun; son cümle bir sonuç ya da değerlendirme içersin. (4) C1 düzeyi akademik üslup, doğal eşdizimler (collocations) kullan; dolgu ifadesi ve tekrar yok; her cümlenin yapısı farklı olsun. (5) Uzunluk 60-85 kelime. (6) Gerçek olmayan istatistik ya da iddia uydurma. Biçim: {\"par\":\"paragraf metni\",\"ana_fikir\":\"paragrafın asıl iddiası, Türkçe, tek cümle\",\"gl\":{\"kelime\":\"Türkçe anlam\"}} gl: paragrafta kullandığın önemli kelimelerin en fazla 10 tanesi, küçük harfli anahtarlarla.`;
const GLOSS=`Verilen İngilizce kelimelerin her birinin en yaygın Türkçe karşılığını yaz (1-3 kelime; çekimli biçimse o biçimin anlamı). YALNIZCA geçerli JSON döndür: {"kelime":"Türkçe karşılık"}. Anahtarlar küçük harfli ve girdideki gibi olsun.`;
const GRADE=`Bir İngilizce akademik metnin Türkçe ana düşüncesini öğrenci yazdı. Referans ana düşünceyle karşılaştır. Yalnızca genel ana fikrin doğru aktarılması yeterlidir; kelime seçimi, ifade ya da ayrıntılardaki eksiklere takılma. Genel yapı ve ana fikir doğruysa onay ver. Ana fikir yanlışsa ya da belirgin biçimde eksikse onaylama. YALNIZCA geçerli JSON döndür: {"onay":true veya false,"yorum":"Türkçe, 2-3 cümle. Onaylanmadıysa eksik ya da yanlış noktayı ve doğru ana düşünceyi açıkla; onaylandıysa kısa bir değerlendirme yap."}`;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];
const parse=t=>t.split(/\r?\n/).map(l=>l.replace(/[\u00a0 ]+/g,' ').replace(/[A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ ]{2,}\s*[–-]\s*VOCAB/g,'').replace(/^\s*(?:\d+[.)]|[•*·-])\s+/,'').trim()).filter(l=>l&&!/^[A-ZÇĞİÖŞÜ ]+$/.test(l)).map(l=>{const seg=l.split(/\s+:\s+|\s+[-–—]\s+|\s*\|\s*|\t/).map(s=>s.trim()).filter(Boolean);if(seg.length<2)return {en:l,tr:''};const ti=seg.findIndex((s,i)=>i>0&&/[çğıöşüİ]/i.test(s));return ti>1?{en:seg.slice(0,ti).join(' / '),tr:seg.slice(ti).join(' / ')}:{en:seg[0],tr:seg.slice(1).join(' / ')}});
const cl=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
const aMo=v=>Array.isArray(v)?v.filter(Array.isArray):[];
const sent=s=>esc(s).split(/([A-Za-z][A-Za-z'-]*)/).map((t,i)=>i%2?`<span class="tk" data-w="${t}">${t}</span>`:t).join('');
const seed=w=>w.map(x=>({en:x.en,tr:x.tr||'',d:[],gl:{},mo:{}}));
const mk=(id,name,words)=>({id,name,words,items:seed(words),para:null,prog:{box:{},steps:[0,0,0,0,0,0,0],xp:0}});

let muted=false,ac=null,DB=null,UID=null,SMP=null,packs=[],cur=null,SRC=null,step=0,tmr=0;
let deck=[],di=0,flip=false,rd=[],md=new Set(),sL=null,sR=null,bL=null,bR=null;
let Q=null,qi=0,qok=0,lives=3,qmode='';
const bx=w=>cur.prog.box[w.en]||1;
const xp=n=>{cur.prog.xp=(cur.prog.xp||0)+n;$('#xp').textContent=cur.prog.xp;save()};

const tone=(fs,d,ty)=>{try{if(muted)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=t+i*d;o.type=ty;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(1e-4,s);g.gain.exponentialRampToValueAtTime(.15,s+.01);g.gain.exponentialRampToValueAtTime(1e-4,s+d);o.start(s);o.stop(s+d+.02)})}catch(e){}};
const SFX={ok:()=>tone([523,659,784],.09,'triangle'),bad:()=>tone([220,165],.2,'sawtooth'),win:()=>tone([523,659,784,1047],.11,'triangle')};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}};

function save(p=cur){clearTimeout(p._t);p._t=setTimeout(async()=>{if(!DB||!UID)return;try{const {id,_t,...b}=p;await DB.collection('data/users/'+UID).doc(id).set(b)}catch(e){}},300)}

const GATE={n:0,q:[]};
const gateIn=()=>GATE.n<2?(GATE.n++,Promise.resolve()):new Promise(r=>GATE.q.push(r));
const gateOut=()=>{const r=GATE.q.shift();if(r)r();else GATE.n--};
const runPool=async(items,fn,n=2)=>{let i=0;const w=async()=>{while(i<items.length){const it=items[i++];await fn(it)}};await Promise.all(Array.from({length:Math.min(n,items.length)},w))};
async function askJ(sys,input,ms,tier){
  if(!SMP){LASTERR='yapay zeka bu sayfada açık değil';return null}
  await gateIn();
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||(tier==='quick'?60000:180000));
  try{
    const o={cache:false,signal:ac.signal};if(tier)o.modelTier=tier;
    const r=await SMP(sys+'\n\nGİRDİ:\n'+input,o);
    if(r&&r.truncated){LASTERR='çıktı kesildi';return null}
    const m=String(r&&r.text||'').match(/[\[{][\s\S]*[\]}]/);
    if(m){const v=JSON.parse(m[0]);if(v&&typeof v==='object'){LASTERR='';return v}}
    LASTERR='geçersiz yanıt';return null;
  }catch(e){
    const c=e&&e.code;
    LASTERR=c==='not_granted'?'izin verilmedi':c==='rate_limited'?'çok fazla istek, biraz sonra yeniden dene':c==='session_expired'?'oturumun yeniden açılması gerekiyor':(e&&e.name==='AbortError')?'zaman aşımı':((e&&e.message)||'bağlantı hatası');
    return null;
  }finally{clearTimeout(tm);gateOut()}
}

function renderHead(){$('#del').hidden=cur.id==='def';renderEnr();
  $('#pk').innerHTML=packs.map(p=>`<option value="${esc(p.id)}" ${p.id===cur.id?'selected':''}>${esc(p.name)}</option>`).join('');
  $('#xp').textContent=cur.prog.xp||0;
  $('#pb').style.width=cur.prog.steps.filter(Boolean).length/7*100+'%';
  $('#steps').innerHTML=['Kartlar','Eşleştir','Seç','Yaz','Boss','Cümle','Paragraf'].map((n,i)=>{const lock=false;return `<button class="pill ${step===i?'on':''}" data-st="${i}" ${lock?'disabled':''}>${cur.prog.steps[i]?'✓ ':''}${i+1} ${n}</button>`}).join('');
  $('#ft').innerHTML=footHtml();
}

function goStep(i){
  step=i;renderHead();
  
  [startKart,mstart,()=>qstart('sec'),ystart,()=>qstart('boss'),()=>qstart('cum'),pview][i]();
}
function pick(id){cur=packs.find(p=>p.id===id);goStep(0)}

const ENR={},LIBS={},RUN={};let LASTERR='';
const useCap=n=>window.claude?window.claude.use(n):Promise.resolve(null);
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',MAMMOTH='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';

const lowerKeys=o=>{const s=cl(o),r={};Object.keys(s).forEach(k=>{if(typeof s[k]==='string'&&s[k].trim())r[k.toLowerCase().trim()]=s[k].trim()});return r};
const covered=(t,en)=>{
  const T=t.toLowerCase();
  return en.toLowerCase().split(/\s*[\/~]\s*/).some(a=>{
    a=a.trim();if(!a)return false;
    if(/(^|[-\s])x([-\s]|$)/.test(a))return a.split('x').map(s=>s.trim()).filter(Boolean).every(s=>T.includes(s));
    const stem=(a.length>5?a.slice(0,-2):a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return new RegExp('\\b'+stem).test(T);
  });
};
function planGroups(p){
  p.groups=p.groups||[];
  const have=new Set(p.groups.flatMap(g=>g.w)),left=p.items.filter(x=>x.tr&&!have.has(x.en)).map(x=>x.en);
  for(let i=0;i<left.length;i+=GS)p.groups.push({w:left.slice(i,i+GS),text:'',ana:'',gl:{},miss:[]});
  return p.groups;
}
async function genGroup(p,g){
  const words=g.w.map(en=>p.items.find(x=>x.en===en)).filter(Boolean);
  if(!words.length)return false;
  let best=null,miss=[];
  for(let t=0;t<3;t++){
    const input='KALIPLAR: '+words.map(x=>x.en+(x.tr?` (${x.tr})`:'')).join(' | ')+(t&&miss.length?'\nÖZELLİKLE ŞUNLAR PARAGRAFTA GEÇMELİ: '+miss.join(' | '):'');
    const r=await askJ(PARA_G,input);
    if(!r||typeof r.par!=='string'||!r.par.trim())continue;
    const m=words.map(x=>x.en).filter(en=>!covered(r.par,en));
    if(!best||m.length<best.m.length)best={par:r.par.trim(),ana:String(r.ana_fikir||'').trim(),gl:lowerKeys(r.gl),m};
    miss=m;
    if(!m.length)break;
  }
  if(!best)return false;
  if(!g.text||best.m.length<(g.miss||[]).length)Object.assign(g,{text:best.par,ana:best.ana,gl:best.gl,miss:best.m});
  return true;
}
function genGroups(p,onTick){
  if(PRUN[p.id])return PRUN[p.id];
  return PRUN[p.id]=(async()=>{
    try{
      planGroups(p);
      const todo=p.groups.map((g,i)=>i).filter(i=>!p.groups[i].text);
      const worker=async()=>{while(todo.length){const g=p.groups[todo.shift()];await genGroup(p,g);save(p);onTick&&onTick()}};
      await Promise.all(Array.from({length:Math.min(2,todo.length)},worker));
    }finally{delete PRUN[p.id]}
    return p.groups;
  })();
}
const TR_SYS=`Sen İngilizce-Türkçe sözlük yazarısın. Girdide numaralandırılmış İngilizce kelimeler ve kalıplar var. Her biri için en yaygın Türkçe karşılığını yaz (1-3 kelime). Kelimeyi İngilizce bırakma ve aynen tekrarlama. YALNIZCA geçerli JSON döndür: {"items":[{"i":1,"tr":"Türkçe karşılık"}]}. Her numarayı girdideki sırayla ve eksiksiz döndür.`;
const validTr=(t,en)=>typeof t==='string'&&!!t.trim()&&!/^\?+$/.test(t.trim())&&t.trim().toLowerCase()!==String(en||'').trim().toLowerCase();
async function fillTr(p){
  let todo=p.items.filter(x=>!x.tr);
  if(!todo.length)return;
  FILL[p.id]=1;
  try{
    for(const sz of [20,8,3]){
      if(!todo.length)break;
      const ch=[];for(let i=0;i<todo.length;i+=sz)ch.push(todo.slice(i,i+sz));
      await runPool(ch,async c=>{
        const r=await askJ(TR_SYS,c.map((x,i)=>`${i+1}. ${x.en}`).join('\n'),0,'quick');
        (r&&Array.isArray(r.items)?r.items:[]).forEach(o=>{const x=c[Number(o&&o.i)-1];if(x&&!x.tr&&validTr(o.tr,x.en))x.tr=o.tr.trim()});
        save(p);
      });
      todo=todo.filter(x=>!x.tr);
    }
  }finally{delete FILL[p.id]}
}

async function glossAll(p){
  const lex=new Set();p.items.forEach(x=>x.en.toLowerCase().split(/\s*[\/~]\s*/).forEach(w=>lex.add(w.trim())));
  const txt=[...p.items.map(x=>x.s||''),...(p.groups||[]).map(g=>g.text||'')].join(' ');
  const need=[...new Set(txt.toLowerCase().match(/[a-z][a-z'-]*/g)||[])].filter(w=>w.length>1&&!lex.has(w)&&!p.dict[w]);
  const ch=[];for(let i=0;i<need.length;i+=80)ch.push(need.slice(i,i+80));
  const worker=async()=>{while(ch.length){const c=ch.shift(),r=await askJ(GLOSS,c.join(', '),60000,'quick');if(r)Object.keys(r).forEach(k=>{if(typeof r[k]==='string')p.dict[k.toLowerCase()]=r[k]});save(p)}};
  await Promise.all(Array.from({length:Math.min(2,ch.length)},worker));
}
async function enrich(p){
  if(RUN[p.id])return;
  const upd=(t,bad,why)=>{ENR[p.id]={t,bad,why:why||''};if(cur===p)renderEnr()};
  if(!SMP){upd('Yapay zekâ bu sayfada açık değil. Sayfa Claude üzerinde yayınlanmış olmalı ve izin verilmelidir.',true,'yok');return}
  RUN[p.id]=1;p.dict=p.dict||{};
  p.items.forEach(x=>{if(x.tr&&!validTr(x.tr,x.en))x.tr=''});
  const tick=()=>{const G=p.groups||[];upd(`✨ Hazırlanıyor · anlam ${p.items.filter(x=>x.tr).length}/${p.items.length} · cümle ${p.items.filter(x=>x.s).length}/${p.items.length} · paragraf ${G.filter(g=>g.text).length}/${G.length}`);tickUI(p)};
  try{
    await fillTr(p);tick();
    for(let pass=0;pass<3;pass++){
      const todo=p.items.filter(x=>x.tr&&!x.s),ch=[];
      if(!todo.length)break;
      for(let i=0;i<todo.length;i+=6)ch.push(todo.slice(i,i+6));
      await runPool(ch,async c=>{
        const r=await askJ(BATCH,c.map(w=>w.en+' - '+(w.tr||'?')).join('\n'),120000,'quick');
        if(r&&Array.isArray(r.items))r.items.forEach(g=>{const it=c.find(x=>x.en.toLowerCase()===String(g&&g.en).toLowerCase());if(it)merge(it,g)});
        save(p);tick();
      });
    }
    await genGroups(p,tick);
    await glossAll(p);
    save(p);
    await shareDef(p);
    const G=p.groups||[],inT=new Set(G.filter(g=>g.text).flatMap(g=>g.w));
    const noTr=p.items.filter(x=>!x.tr).length,noS=p.items.filter(x=>x.tr&&!x.s).length,noG=p.items.filter(x=>x.tr&&!inT.has(x.en)).length;
    const parts=[];
    if(noTr)parts.push(`${noTr} kelimenin anlamı yok`);
    if(noS)parts.push(`${noS} kelimenin cümlesi yok`);
    if(noG)parts.push(`${noG} kelime paragrafa girmedi`);
    upd(parts.length?`Eksikler: ${parts.join(' · ')}`:'',parts.length>0,LASTERR);
    refreshWait(p);
  }catch(e){upd('Hata: '+e.message,true,'hata')}
  finally{delete RUN[p.id]}
}
