const TR_SYS=`Sen İngilizce-Türkçe sözlük yazarısın. Girdide numaralandırılmış İngilizce kelimeler ve kalıplar var. Her biri için en yaygın Türkçe karşılıklarını yaz: akademik metinlerde en sık kullanılan anlam önce gelsin; kelimenin gerçekten farklı anlamları varsa en fazla 3 ayrı anlam ver (her biri 1-3 kelime, aynı anlamı tekrar etme). Fiilleri -mek/-mak ile, kalıpları kalıp anlamıyla yaz (regardless of = -e rağmen, -den bağımsız olarak). Kelimeyi İngilizce bırakma. YALNIZCA geçerli JSON döndür: {"items":[{"i":1,"tr":["birinci anlam","ikinci anlam"]}]}. Her numarayı girdideki sırayla ve eksiksiz döndür.`;
const BUEPT_STYLE=`BUEPT ÜSLUP PROFİLİ (20 gerçek Boğaziçi deneme sınavının analizinden; metinleri KOPYALAMA, yalnızca mantığını uygula):

- Cümle mantığı: taviz ve karşıtlık (although, while, despite, whereas), kesinlik derecesi (may, tend to, is likely to, not necessarily, to some extent), karşılaştırma yönü (far less X than Y, at least as X as), vurgu yapıları (It was only after ... that), not only ... but also, neden-sonuç zinciri (as X rose, Y fell), edilgen + by (was silenced by), koşul (Without X, Y would not ...), raporlama fiilleri (argues, contends, points out), kavram tanımı (X refers to ...).
- Paragraf mantığı: konu cümlesi → kavram tanımı → araştırmacı ya da çalışma (gerçek değilse genel ifade: "one study", "researchers") → somut örnek ya da vaka → karşı görüş, sınırlama ya da eleştiri → değerlendirme/bağlantı cümlesi.`;
const PTOP=['a psychology experiment and what it reveals','a sociological theory of collective behaviour','media, advertising and persuasion','an ethical or legal dilemma','technology and artificial intelligence','economic or colonial history','the history of a food or health habit','education, learning and reading habits','film, art and cultural analysis','science versus pseudoscience','business ethics and attitudes towards business','social psychology of group behaviour'];
const ptop=()=>PTOP[Math.floor(Math.random()*PTOP.length)];

const EN_ONE=/^[A-Za-z][A-Za-z '\-\/()]{0,60}$/;
/* Bir satırı düzelt: yer değiştirmiş dilleri çevir, "Sword: Kılıç, Shield, Kalkan, Bow, Yay" gibi karışık satırları çiftlere ayır */
function normLine(en,tr,known){
  en=String(en||'').trim();tr=String(tr||'').trim();known=known||new Set();
  let toks=splitMeans(tr);
  const isEn=v=>{const k=String(v).toLowerCase();return k!==en.toLowerCase()&&(known.has(k)||langOf(v)==='en')};

  if(en&&toks.length&&langOf(en)==='tr'&&toks.every(v=>isEnSide(v)&&langOf(v)!=='tr')&&(toks.some(isEn)||TRCH.test(en))){const e2=toks.join(', ');tr=en;en=e2;toks=splitMeans(tr)}

    let c={en,tr:[]};toks.forEach(v=>{if(String(v).toLowerCase()===c.en.toLowerCase())return;if(isEn(v)&&EN_ONE.test(v)){out.push(c);c={en:v,tr:[]}}else c.tr.push(v)});out.push(c);

}
function parse(t){
  const out=[];

    const l=raw.replace(/[  ]+/g,' ').replace(/[A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ ]{2,}\s*[–-]\s*VOCAB/g,'').replace(/^\s*(?:\d+[.)]|[•*·])\s+/,'').trim();
    if(!l||/^[A-ZÇĞİÖŞÜ .]+$/.test(l)&&l.length<30)return;
    let seg=l.split(/\s+:\s+|\s*:\s+(?=[A-ZÇĞİÖŞÜa-zçğıöşü_])|\s+[-–—]\s+|\s*\|\s*|\t+/).map(s=>s.trim()).filter(Boolean);
    if(seg.length<2){if(/^[A-Za-z][A-Za-z '\-\/~,;]{0,80}$/.test(l))l.split(/\s*[,;]\s*/).filter(Boolean).forEach(e=>out.push({en:e.replace(/\s*~\s*/g,' / '),tr:''}));return}
    let en,tr;

    if(TRCH.test(seg[0])&&seg.slice(1).every(isEnSide)){tr=seg[0];en=seg.slice(1).join(', ')}
    else{const ti=seg.findIndex((s,i)=>i>0&&TRCH.test(s));
      en=(ti>1?seg.slice(0,ti):[seg[0]]).join(' / ');tr=(ti>1?seg.slice(ti):seg.slice(1)).join(', ')}
    en=en.replace(/\s*~\s*/g,' / ').trim();tr=splitMeans(tr.replace(/^_+/,'')).join(', ');

    normLine(en,tr).forEach(o=>{if(o.en.length<=80)out.push({en:o.en,tr:/[a-z]/i.test(o.tr)?o.tr:''})});
  });
  // aynı kelime iki kez yazıldıysa anlamlarını birleştir
  const map=new Map();out.forEach(x=>{const k=x.en.toLowerCase();if(!map.has(k)){map.set(k,x);return}const y=map.get(k);y.tr=splitMeans([y.tr,x.tr].filter(Boolean).join(', ')).join(', ')});

function sessClear(i){const o=sessAll();if(o[i]){delete o[i];sessPut(o)}}
function sessSnap(){
  if(!cur||mode<0)return;const o=sessAll(),t=Date.now();let d=null;
  if(mode===0&&K&&K.q.length)d={q:K.q.map(x=>x.en),total:K.total,known:K.known};
  else if((mode===2||mode===3)&&Q&&Q.q.length)d={q:Q.q.map(x=>x.en),total:Q.total,solved:Q.solved};
  else if(mode===4&&B&&B.q.length&&B.lives>0)d={q:B.q.map(m=>({en:m.x.en,t:m.t,key:m.key||0,again:m.again||0})),total:B.total,ord:B.ord,lives:B.lives,hits:B.hits,miss:B.miss.map(x=>x.en),fell:B.fell};

}
const byEn=en=>cur.items.find(x=>x.en===en&&x.tr);

  const d=sessLoad(i);if(!d)return false;
  if(i===0){const q=d.q.map(byEn).filter(Boolean);if(!q.length)return false;K={q,total:d.total,known:d.known,flip:false};drawKart()}
  else if(i===2||i===3){const q=d.q.map(byEn).filter(Boolean);if(!q.length)return false;Q={m:i===2?'sec':'yaz',q,total:d.total,solved:d.solved,cur:null,tries:0,locked:false};nextQ()}
  else if(i===4){const q=d.q.map(m=>({x:byEn(m.en),t:m.t,key:m.key,again:m.again})).filter(m=>m.x);if(!q.length)return false;B={q,total:d.total,ord:d.ord,lives:d.lives,hits:d.hits,miss:d.miss.map(byEn).filter(Boolean),locked:false,fell:d.fell};$('#hearts').hidden=false;drawHearts();nextBoss()}

}

function sessLabel(){if(!cur)return null;const o=sessAll();let best=null;Object.keys(o).forEach(k=>{const i=+k;if(i===6)return;const d=o[k];if(!d||!d.q||!d.q.length)return;if(!best||d.t>best.d.t)best={i,d}});if(!best)return null;const {i,d}=best,done=i===0?d.known:i===4?d.hits:d.solved;return {i,txt:`${MODES[i].n} · ${done}/${d.total}`}}

const prog=(a,b)=>{setTimeout(sessSnap,0);const p=$('#pb');if(p)p.style.width=(b?Math.min(100,a/b*100):0)+'%';const c=$('#cnt');if(c)c.textContent=b?`${Math.min(a,b)}/${b}`:''};

let K=null;
function startKart(){
  const pool=withTr();if(!pool.length)return emptyMsg('Bu listede henüz anlam yok.',true);

}

  ST().innerHTML=`<div class="card qcard gk ${open?'open':'ask'}" id="gk"><span class="hint">${open?(cf===2?'Emindin':cf===1?'Tahmin ettin':'Bilmiyordun')+' · kapı açıldı':(ajar?'Kapı aralandı. İpucu yetti mi?':'Anlamı kapının ardında. Ne kadar eminsin?')}</span><div class="qword">${esc(x.en)}</div><div class="row" style="justify-content:center;gap:8px"><span class="tag">Kat ${bx(x)}</span><button class="btn btn-ghost btn-sm" data-say="${esc(x.en)}">${ic('sound')}Dinle</button></div>

    :`<button class="btn btn-bad btn-lg" data-k="0">Yanılmışım</button><button class="btn btn-ok btn-lg" data-k="1" style="grid-column:span 2">Doğru bildim</button>`}</div>`;

/* ---------- 2. Eşleştir ---------- */
let M=null;
function startEsle(){
  const all=withTr();if(all.length<2)return emptyMsg('Çark için en az iki anlamlı kelime gerekli.',true);
  const done=new Set(cur.prog.mdone||[]);if(all.every(x=>done.has(x.en)))cur.prog.mdone=[];
  M={all:all.length};roundEsle();
}
function roundEsle(){
  const done=new Set(cur.prog.mdone||[]),rem=withTr().filter(x=>!done.has(x.en));
  if(!rem.length){cur.prog.mdone=[];return finish(1,'Bütün çarkları döndürdün','Çark ringi')}
  const r=[];shuf(rem).forEach(o=>{if(r.length<6&&!r.some(y=>MEAN(y).some(v=>sharesM(o,v))))r.push(o)});if(r.length<2)r.push(...shuf(rem).filter(o=>!r.includes(o)).slice(0,2-r.length));M.r=r;M.mm=r.map(pickM);M.ok=new Set();M.order=shuf(r.map((_,i)=>i));M.pos=shuf(r.map((_,i)=>i));M.pi=0;M.lock=false;M.fresh=true;
  prog(M.all-rem.length,M.all);drawEsle();
}

function wordOpts(x,dirEn,m){
  m=m||pickM(x);const mine=MEAN(x).map(mKey);
  if(dirEn){
    const pool=withTr().filter(o=>o!==x&&!MEAN(o).some(v=>mine.includes(mKey(v))));
    const d=shuf(pool).sort((a,b)=>Math.abs(String(a.tr).length-m.length)-Math.abs(String(b.tr).length-m.length)).slice(0,8);
    const used=new Set([mKey(m)]),opts=[m];shuf(d).forEach(o=>{if(opts.length>=4)return;const v=pickM(o);if(!used.has(mKey(v))){used.add(mKey(v));opts.push(v)}});
    const r=shuf(opts);r.m=m;r.ans=m;return r;
  }
  const L=x.en.length,pool=withTr().filter(o=>o!==x&&o.en.toLowerCase()!==x.en.toLowerCase()&&!sharesM(o,m));
  const d=shuf(pool).sort((a,b)=>Math.abs(a.en.length-L)-Math.abs(b.en.length-L)).slice(0,8);

const HARD=`Sen BUEPT (Boğaziçi İngilizce yeterlik sınavı) için çeviri sorusu hazırlayan deneyimli bir sınav yazarısın. Girdide numaralı İngilizce akademik cümleler ve doğru Türkçe çevirileri (TR) var. Her cümle için 3 çeldirici Türkçe çeviri yaz.
Kurallar: Her çeldirici doğru çeviriyle aynı konuyu, büyük ölçüde aynı kelimeleri, aynı üslubu ve neredeyse aynı uzunluğu kullansın; dilbilgisi kusursuz ve doğal olsun; hızlı okuyan birine doğru gibi görünsün. Ama her biri TEK bir kilit noktada anlamı bozsun ve üçü farklı noktaları bozsun. Kilit noktalar: hedef kelimenin yakın ama yanlış anlamı; neden-sonuç, karşıtlık (however/although/despite) ya da koşul ilişkisinin tersine çevrilmesi; kesinlik, olasılık ve nicelik dereceleri (may/must, some/most, rarely/often, partly/entirely); kimin kime ne yaptığının yer değiştirmesi; zaman, karşılaştırma ya da olumsuzluk. Bariz yanlış, eksik, konu dışı ya da saçma çeviri yazma. Doğru çeviriyi aynen tekrar etme.
YALNIZCA geçerli JSON döndür: {"items":[{"i":1,"d":["çeldirici 1","çeldirici 2","çeldirici 3"],"dn":"doğru çeviriyi ayıran kilit noktayı anlatan kısa Türkçe ipucu"}]}`;
async function hardenSet(list){

    if(!r.json)return;(r.json.items||[]).forEach(o=>{const x=c[Number(o&&o.i)-1];if(!x||!Array.isArray(o.d))return;const d=o.d.map(v=>String(v).trim()).filter(v=>v&&v!==x.st);if(d.length>=3){x.d=d.slice(0,3);x.dv=2;x.dn=String(o.dn||'')}})},3);

}
function sentOpts(x){
  if(x.dv===2&&x.d&&x.d.length>=3)return shuf([x.st,...x.d.slice(0,3)]);
  const T=x.st,toks=s=>new Set((s.toLocaleLowerCase('tr').match(/[a-zçğıöşü]{4,}/g)||[]).map(w=>w.slice(0,5)));
  const A=toks(T),sc=s=>{let o=0;toks(s).forEach(w=>{if(A.has(w))o++});return Math.abs(s.length-T.length)*.12-o*3};
  const own=(x.d||[]).filter(v=>v&&v!==T);
  const others=sentOf().filter(o=>o!==x).map(o=>o.st).filter(v=>v!==T).sort((a,b)=>sc(a)-sc(b)).slice(0,6);
  const d=[...new Set([...own,...others])].slice(0,3);
  return d.length<3?null:shuf([T,...d]);
}

/* Yazılan cevabı esnek değerlendir: yazım hatası, çekim, eksik/fazla edat yerelde; eş anlamlıyı yapay zekâ kontrol eder */
const PREP=new Set(['of','to','for','with','in','on','at','from','about','by','into','upon','off','up','out','over','as']);
const nEn=v=>String(v||'').toLowerCase().replace(/[’`]/g,"'").replace(/\((?:sth|sb|something|someone|somebody)\)|\b(?:sth|sb|something|someone|somebody|one's|oneself)\b/g,' ').replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim().replace(/^(to|a|an|the) /,'');
const stemEn=w=>w.replace(/(ies)$/,'y').replace(/(ied)$/,'y').replace(/(ing|ed|es|s|ly)$/,'').replace(/e$/,'');
const noPrep=w=>w.split(' ').filter((t,i,a)=>!(PREP.has(t)&&(i===a.length-1||i===0))).join(' ');
function localJudge(v,cands){
  v=nEn(v);if(!v)return null;const cs=[...new Set(cands.map(nEn).filter(Boolean))];
  if(cs.includes(v))return 'exact';
  const tol=c=>c.length>8?2:c.length>4?1:0;
  const dist=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
  for(const c of cs){
    if(noPrep(c)&&noPrep(c)===noPrep(v))return 'prep';
    const a=c.split(' ').map(stemEn).join(' '),b=v.split(' ').map(stemEn).join(' ');
    if(a.length>2&&a===b)return 'form';
    if(noPrep(c).split(' ').map(stemEn).join(' ')===noPrep(v).split(' ').map(stemEn).join(' ')&&a.length>2)return 'form';
  }
  for(const c of cs){if(tol(c)&&Math.abs(c.length-v.length)<=tol(c)&&dist(c,v)<=tol(c))return 'typo';const p=noPrep(c);if(p!==c&&tol(p)&&dist(p,noPrep(v))<=tol(p))return 'typo'}
  return null;
}
const YZK='ka_yzchk';
const JUDGE=`Sen deneyimli ve adil bir İngilizce öğretmenisin. Öğrenciye bir Türkçe anlam gösterildi ve İngilizcesini yazması istendi. Cevabı bir öğretmen gibi değerlendir.
ok=true ver: cevap gösterilen Türkçe anlamı doğru karşılıyorsa. Eş anlamlı kelime, aynı kökün başka biçimi (çoğul, fiil çekimi, isim-fiil), Amerikan/İngiliz yazımı, eksik ya da fazla edat/artikel ve 1-2 harflik yazım hatası kabul.
ok=false ver: anlam farklıysa, yalnızca uzaktan ilgiliyse, çok genel ya da çok özelse, Türkçe yazılmışsa ya da anlamsızsa.
Listedeki kelime de bazen hatalı girilmiş olabilir: gösterilen Türkçe anlam listedeki kelimeyle uyuşmuyor ve öğrencinin cevabı bu Türkçe anlama uyuyorsa ok=true ver ve "liste":true yaz.
"not": Türkçe, en fazla 18 kelime. Ret ise öğrencinin yazdığı kelimenin ne demek olduğunu ve farkı söyle (ör. "sided = taraflı; mızrak spear demek"). Kabul ise kısa onay.
"dogru": bu Türkçe anlam için en doğru İngilizce karşılık.
YALNIZCA JSON: {"ok":false,"not":"...","dogru":"...","liste":false}`;
const jKey=(x,v)=>'v2|'+x.en.toLowerCase()+'|'+nEn(v);
const jCache=()=>{try{return JSON.parse(localStorage.getItem(YZK))||{}}catch(e){return {}}};
function jPut(k,o){const c=jCache();c[k]=o;const ks=Object.keys(c);if(ks.length>500)ks.slice(0,ks.length-500).forEach(z=>delete c[z]);try{localStorage.setItem(YZK,JSON.stringify(c))}catch(e){}}
async function aiJudge(v,x,m){
  const k=jKey(x,v),c=jCache();if(c[k])return c[k];
  if(!/[a-z]{2}/i.test(v)||TRCH.test(v)||v.length>60)return {ok:false,not:TRCH.test(v)?'Türkçe yazdın; İngilizcesi isteniyor.':''};
  const others=cur.items.filter(o=>o!==x&&sharesM(o,m)).map(o=>o.en).slice(0,6);
  const r=await KA.askJ(JUDGE,`Gösterilen Türkçe anlam: ${m}\nListedeki kelime: ${x.en} (listedeki tüm anlamları: ${MEAN(x).join(', ')})${others.length?`\nListede aynı anlamı taşıyan başka kelimeler: ${others.join(', ')}`:''}\nÖğrencinin cevabı: ${v}`,{tier:'quick',ms:15000});
  if(!r.json)return null;
  const o={ok:r.json.ok===true||String(r.json.ok).toLowerCase()==='true',not:String(r.json.not||'').slice(0,160),dogru:String(r.json.dogru||'').slice(0,60),liste:r.json.liste===true};
  jPut(k,o);return o;
}
/* sonuç: {ok, how:'exact'|'typo'|'prep'|'form'|'ai'|'me', not} */
async function judgeEn(v,x,m,fb){
  const same=cur.items.filter(o=>o===x||sharesM(o,m));
  const loc=localJudge(v,same.flatMap(o=>forms(o.en)));
  if(loc)return {ok:true,how:loc};
  const ck=jCache()[jKey(x,v)];if(ck&&ck.me)return {ok:true,how:'me'};
  if(fb)fb.innerHTML='<p class="mut" style="text-align:center;margin-top:12px"><span class="ka-spin"></span> Cevabına bakılıyor…</p>';
  let r=null;try{r=await aiJudge(v,x,m)}catch(e){}
  if(fb)fb.innerHTML='';
  return r&&r.ok?{ok:true,how:'ai',not:r.not,liste:r.liste}:{ok:false,not:r&&r.not||'',dogru:r&&r.dogru||''};
}
const HOW={exact:'Mükemmel!',typo:'Küçük bir yazım hatası, kabul edildi',prep:'Edat eksik/fazla, kabul edildi',form:'Farklı biçimiyle yazdın, kabul edildi',ai:'Yakın anlamlı, kabul edildi',me:'Daha önce doğru saydığın cevap'};

/* ---------- Yapay zekâ liste denetimi: yer değiştirmiş, karışmış ya da yanlış kartları düzeltir ---------- */
const AUDIT=`Sen titiz bir İngilizce-Türkçe sözlük editörüsün. Girdide bir öğrencinin kelime listesinden numaralı satırlar var: "n. İNGİLİZCE ⇒ TÜRKÇE". Liste fotoğraftan ya da dosyadan okunduğu için hatalı olabilir. Her satırı kontrol et ve YALNIZCA hatalı satırlar için düzeltme döndür.
Hata türleri:
1) Diller yer değiştirmiş: sol taraf Türkçe, sağ taraf İngilizce.
2) Bir satıra birden fazla kelime çifti karışmış ("Sword ⇒ Kılıç, Shield, Kalkan, Bow, Yay"): her İngilizce kelimeyi kendi Türkçesiyle ayrı öğe yap.
3) Türkçe taraf çeviri değil: başlık, kategori, kullanım notu ("ekonomik krizden bahsederken") ya da yanlış çeviri. Kelimenin doğru, yaygın Türkçe karşılığını yaz.
4) İngilizce kelimede OCR ya da yazım hatası: düzelt.
5) Satır öğrenilecek bir kelime değil (başlık, sayı, anlamsız): "items":[] ver.
Doğru satırları döndürme. Öğrencinin yazdığı doğru Türkçe anlamları silme; gerekirse eksik ana anlamı ekle. Türkçe anlamlar kısa olsun (1-4 kelime), birden fazlaysa virgülle ayır, en fazla 3 anlam. Fiilleri -mek/-mak ile yaz.
YALNIZCA geçerli JSON: {"fix":[{"i":3,"items":[{"en":"recession","tr":"durgunluk, resesyon"}],"neden":"kısa Türkçe neden"}]}`;
const AUD_RUN=new Map(),AUD_TRIED=new Set();
function runAudit(p,force){
  if(!p||!p.items.length)return Promise.resolve(0);
  if(AUD_RUN.has(p.id))return AUD_RUN.get(p.id);
  if((p.aud||AUD_TRIED.has(p.id))&&!force)return Promise.resolve(0);AUD_TRIED.add(p.id);
  const pr=auditPack(p).finally(()=>{AUD_RUN.delete(p.id);if(mode<0&&cur&&cur.id===p.id)renderHome()});
  AUD_RUN.set(p.id,pr);if(mode<0&&cur&&cur.id===p.id)setTimeout(renderHome,0);return pr;
}
async function auditPack(p){
  const before=JSON.parse(JSON.stringify(p.items)),fixes=new Map();let fail=0;const idx=p.items.map((x,i)=>i);
  await pool(chunks(idx,40),async c=>{
    const r=await KA.askJ(AUDIT,c.map((k,i)=>`${i+1}. ${p.items[k].en} ⇒ ${p.items[k].tr||'(boş)'}`).join('\n'),{tier:'quick',ms:60000});
    if(!r.json){fail++;return}
    (r.json.fix||[]).forEach(f=>{const k=c[Number(f&&f.i)-1];if(k==null||!Array.isArray(f.items))return;
      const its=f.items.map(o=>({en:String(o&&o.en||'').trim(),tr:splitMeans(Array.isArray(o&&o.tr)?o.tr.join(', '):o&&o.tr).slice(0,4).join(', ')})).filter(o=>o.en&&/[a-z]/i.test(o.en)&&!TRCH.test(o.en)&&o.en.length<=80);
      if(!its.length&&f.items.length)return;fixes.set(k,{items:its,why:String(f.neden||'').slice(0,120)})});
  },3);
  if(fail&&!fixes.size)return 0;
  const log=[],out=[],seen=new Map();
  p.items.forEach((x,k)=>{
    const f=fixes.get(k);
    if(!f){const key=x.en.toLowerCase();if(!seen.has(key)){seen.set(key,x);out.push(x)}return}
    const same=f.items.length===1&&f.items[0].en===x.en&&f.items[0].tr===x.tr;if(same){if(!seen.has(x.en.toLowerCase())){seen.set(x.en.toLowerCase(),x);out.push(x)}return}
    log.push({from:x.en+' = '+(x.tr||'—'),to:f.items.length?f.items.map(o=>o.en+' = '+o.tr).join(' · '):'(listeden çıkarıldı)',why:f.why});
    f.items.forEach((o,i)=>{const key=o.en.toLowerCase();
      if(seen.has(key)){const y=seen.get(key);y.tr=splitMeans([y.tr,o.tr].filter(Boolean).join(', ')).join(', ');return}
      let y;if(o.en.toLowerCase()===x.en.toLowerCase()||i===0){y=x;if(o.en.toLowerCase()!==x.en.toLowerCase()){if(p.prog.box[x.en]&&!p.prog.box[o.en])p.prog.box[o.en]=p.prog.box[x.en];x.s='';x.st='';x.d=[];x.dv=0}x.en=o.en;x.tr=o.tr}
      else y=KA.normPack({items:[{en:o.en,tr:o.tr}]}).items[0];
      seen.set(key,y);out.push(y)});
  });
  p.aud=1;
  if(log.length){p.bak={items:before,at:Date.now()};p.items=out;p.words=out.map(x=>({en:x.en,tr:x.tr}));p.audLog=log.slice(0,80);p.audSeen=0}
  KA.savePack(p,true);
  return log.length;
}
function auditUndo(){
  if(!cur||!cur.bak||!confirm('Yapay zekânın yaptığı düzeltmeler geri alınsın mı? Liste önceki haline döner.'))return;
  cur.items=KA.normPack({items:cur.bak.items}).items;cur.words=cur.items.map(x=>({en:x.en,tr:x.tr}));cur.bak=null;cur.audLog=[];cur.audSeen=1;cur.fix=3;save(true);renderHome();KA.toast('Liste önceki haline döndü.');
}
function auditLog(){
  const L=cur.audLog||[];
  const {el,close}=KA.modal(`<span class="eyebrow">Yapay zekâ denetimi</span><h2 style="margin:6px 0 12px">${L.length} kart düzeltildi</h2>
  <div style="max-height:55vh;overflow:auto;display:grid;gap:8px">${L.map(l=>`<div class="card" style="padding:10px 12px"><div class="mut" style="text-decoration:line-through;font-size:13.5px">${esc(l.from)}</div><div style="font-weight:700">${esc(l.to)}</div>${l.why?`<small class="mut">${esc(l.why)}</small>`:''}</div>`).join('')}</div>
  <div class="row" style="margin-top:14px;justify-content:flex-end">${cur.bak?`<button class="btn btn-ghost" data-a="audundo">Hepsini geri al</button>`:''}<button class="btn btn-p" data-close>Tamam</button></div>`);
  el.querySelector('[data-close]').onclick=close;el.addEventListener('click',e=>{if(e.target.closest('[data-a=audundo]'))close()});

/* ---------- 5. Bekçi: en zayıf 12 kelime kemerin taşları, 3 can ---------- */
let B=null;const BOSS_MOVES=12,LIVES=3;
function startBoss(){
  const pool=withTr();if(pool.length<4)return emptyMsg('Bekçi için en az 4 anlamlı kelime gerekli.',true);
  const pick=shuf(pool).sort((a,b)=>bx(a)-bx(b)).slice(0,Math.min(BOSS_MOVES,pool.length));
  const hasS=sentOf().length>=4,noType=x=>/(^|[-\s])x($|[-\s])/i.test(x.en);
  const q=shuf(pick).map(x=>{const r=Math.random();let t=r<.4?'sec':r<.65?'ters':r<.82?'yaz':'cumle';if(t==='cumle'&&!(hasS&&x.s&&x.st))t='sec';if(t==='yaz'&&noType(x))t='ters';return {x,t}});
  const last=q[q.length-1];if(!noType(last.x))last.t='yaz';last.key=1; // kilit taşı: son darbe yazarak
  const n=q.length,ord=[];for(let a=0,b=n-1;a<=b;a++,b--){ord.push(a);if(a!==b)ord.push(b)} // taşlar dıştan içe düşer, en son tepedeki kilit taşı
  B={q,total:n,ord,lives:LIVES,hits:0,miss:[],locked:false,fell:-1};

}
function drawHearts(){const h=$('#hearts');if(!h)return;const heart='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.6 4.5c2 0 3.3 1 4.4 2.4 1.1-1.4 2.4-2.4 4.4-2.4 3.6 0 5.8 3.7 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>';h.innerHTML=Array.from({length:LIVES},(_,i)=>`<span class="${i<B.lives?'':'off'}">${heart}</span>`).join('');h.setAttribute('aria-label',B.lives+' can')}
function archSvg(){
  const n=B.total,cx=160,cy=150,r1=92,r2=138,pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy-r*Math.sin(a)).toFixed(1)];
  const stones=Array.from({length:n},(_,i)=>{const a0=Math.PI-(i/n)*Math.PI,a1=Math.PI-((i+1)/n)*Math.PI,g=.012;
    const [x1,y1]=pt(r1,a0-g),[x2,y2]=pt(r2,a0-g),[x3,y3]=pt(r2,a1+g),[x4,y4]=pt(r1,a1+g);
    const k=B.ord.indexOf(i),cls=k<B.hits?(k===B.fell?'fall':'gone'):k===B.hits?'cur':'';
    return `<path class="st ${cls}" d="M${x1} ${y1}L${x2} ${y2}A${r2} ${r2} 0 0 1 ${x3} ${y3}L${x4} ${y4}A${r1} ${r1} 0 0 0 ${x1} ${y1}Z"/>`}).join('');
  const left=B.total-B.hits;
  return `<div class="keeper ${B.hurt?'hurt':''} ${B.fell>=0?'hit':''}"><svg viewBox="0 0 320 160" aria-hidden="true">${stones}<path class="gr" d="M8 152h304"/></svg><div class="kin"><i>${mic('boss')}</i><b>${left} taş</b><span>${B.q[0]&&B.q[0].key&&left===1?'Kilit taşı · son darbe':B.q[0]&&B.q[0].again?'Geri dönen taş':'Kemer Bekçisi'}</span></div></div>`;
}
function nextBoss(){
  KA.closeLookup();
  if(B.lives<=0)return bossEnd(false);
  if(!B.q.length)return bossEnd(true);
  B.locked=false;prog(B.hits,B.total);
  B.fell=-1;B.hurt=false;const {x,t}=B.q[0],top=archSvg();

    ST().innerHTML=top+`<div class="card qcard"><div class="qlab">${lab}${B.q[0].key?'Son darbe · yaz':'Yaz'}</div><div class="qword">${esc(B.cur.m)}</div><input class="input yin" id="yin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="İngilizcesini yaz"><div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-p btn-lg" data-a="bcheck">Vur</button></div><div id="fb"></div></div>`;

  const dirEn=t!=='ters',op=wordOpts(x,dirEn);B.cur={x,t,ans:op.ans,m:op.m,opts:op};
  ST().innerHTML=top+'<div id="mc"></div>';
  drawMCInto(B.cur,lab+(dirEn?'İngilizce → Türkçe':'Türkçe → İngilizce'),`<div class="qword">${esc(dirEn?x.en:op.m)}</div>`);
}
function drawMCInto(q,lab,body){$('#mc').innerHTML=`<div class="card qcard"><div class="qlab">${lab}</div>${body}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div>`}
function bossResolve(ok,shown){
  B.locked=true;tally(ok);const m=B.q.shift(),x=m.x;
  if(ok){B.fell=B.hits;B.hits++;KA.sfx.hit();addXp(2);cur.prog.box[x.en]=Math.min(5,bx(x)+1)}
  else{B.lives=Math.max(0,B.lives-1);B.hurt=true;KA.sfx.bad();drawHearts();cur.prog.box[x.en]=1;if(!B.miss.includes(x))B.miss.push(x);m.again=1;if(m.t==='yaz'&&!m.key)m.t='ters';B.q.splice(Math.min(B.q.length,2),0,m)}
  save();prog(B.hits,B.total);
  const k=document.querySelector('.keeper');if(k)k.outerHTML=archSvg();
  const dead=B.lives<=0,won=!B.q.length;
  feedback(ok,ok?(won?'Kilit taşı düştü, kemer açıldı!':'Taş düştü!'):'Bekçi taşı yerine oturttu',ok?esc(x.en)+' = '+esc(x.tr):'Doğru cevap: '+esc(shown)+(dead?'':' · bu taş birazdan yine gelecek · '+B.lives+' can'),dead?'Sonucu gör':(won?'Kemerden geç':'Sıradaki taş'));
}
function bossMC(i){const q=B.cur;if(!q||B.locked||!q.opts)return;const ok=q.opts[i]===q.ans;document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(q.opts[k]===q.ans)b.classList.add('ok');else if(k===i)b.classList.add('no')});bossResolve(ok,q.ans)}
async function bossYaz(){const q=B.cur;if(!q||B.locked||B.busy)return;const inp=$('#yin'),v=String(inp&&inp.value||'').trim();if(!v)return;B.busy=true;inp.disabled=true;let r={ok:false};try{r=await judgeEn(v,q.x,q.m,$('#fb'))}finally{B.busy=false}if(B.cur!==q)return;bossResolve(r.ok,q.x.en);if(r.ok&&r.how!=='exact'){const s2=document.querySelector('#fb .msg span');if(s2)s2.innerHTML=`${esc(HOW[r.how])} · listendeki kelime: <b>${esc(q.x.en)}</b>`}}
function bossEnd(won){

  if(won){finish(4,'Kemerden geçtin!',`${B.total} taş · ${B.lives} can kaldı${B.miss.length?'':' · kusursuz'}`);if(rev)ST().querySelector('.done-card').insertAdjacentHTML('beforeend',rev);return}

/* ---------- 6. Cümle: bütün cümleler, onar onar ---------- */
/* ---------- BUEPT metin bankası: 20 deneme sınavının metinleri ---------- */
let BUDB=null;
async function buLoad(){if(BUDB)return BUDB;const r=await fetch('okuma-db.json?v=1');if(!r.ok)throw new Error('Metin bankası yüklenemedi');BUDB=await r.json();return BUDB}
const srcOf=m=>'my';
const BUK='ka_bu';
const buSt=()=>{let o={};try{o=JSON.parse(localStorage.getItem(BUK))||{}}catch(e){}o.p=o.p||{};o.c=o.c||[];o.x=o.x||{};return o};
const buPut=o=>{try{localStorage.setItem(BUK,JSON.stringify(o))}catch(e){}};
const buTitle=id=>{const t=BUDB&&BUDB.texts.find(x=>x.id===id);return t?t.title:''};
function myForms(){const F=new Map();(cur?cur.items:[]).forEach(x=>forms(x.en).forEach(f=>{if(f.length>2&&!/\bx\b/.test(f))F.set(f,x.en)}));return F}
function hitsOf(text,F){const low=' '+String(text).toLowerCase().replace(/[^a-z' -]/g,' ')+' ';const h=new Set();F.forEach((en,f)=>{const st=f.replace(/e$/,'');if(low.includes(' '+f+' ')||(st.length>4&&new RegExp('\\b'+st.replace(/[^a-z ]/g,'')+'(s|es|ed|d|ing|ly)?\\b').test(low)))h.add(en)});return [...h]}
function srcBar(m){const v=srcOf(m);return `<div class="srcsw" role="tablist"><button class="${v==='bu'?'on':''}" data-src="bu" data-m2="${m}">${ic('book')}BUEPT metinleri</button><button class="${v==='my'?'on':''}" data-src="my" data-m2="${m}">${ic('list')}Kendi listem</button></div>`}
const TRSYS=`Sen BUEPT (Boğaziçi İngilizce yeterlik sınavı) için çeviri sorusu hazırlayan deneyimli bir sınav yazarısın. Girdide gerçek BUEPT okuma metinlerinden alınmış numaralı İngilizce cümleler var. Her cümle için:
- "st": doğal, akıcı ve anlamı birebir koruyan Türkçe çeviri (bağlaçları, kesinlik derecesini, olumsuzluğu ve kimin kime ne yaptığını tam koru).
- "d": 3 çeldirici Türkçe çeviri. Her biri doğru çeviriyle aynı konuyu, büyük ölçüde aynı kelimeleri ve neredeyse aynı uzunluğu kullansın; doğal ve dilbilgisi kusursuz olsun; ama TEK bir kilit noktada anlamı bozsun (bağlaç ilişkisi, neden-sonuç yönü, kesinlik/olasılık, nicelik, olumsuzluk, özne-nesne, karşılaştırma yönü) ve üçü farklı noktaları bozsun.
- "dn": doğru çeviriyi ayıran kilit noktayı anlatan kısa Türkçe ipucu (ör. "despite = -e rağmen · less likely = olasılığı daha düşük").
YALNIZCA geçerli JSON: {"items":[{"i":1,"st":"...","d":["...","...","..."],"dn":"..."}]}`;
async function buHarden(list){

  const o=buSt();
  await pool(chunks(need,5),async c=>{const r=await KA.askJ(TRSYS,c.map((x,i)=>`${i+1}. ${x.s}`).join('\n'),{tier:'quick',ms:55000});
    if(!r.json)return;(r.json.items||[]).forEach(v=>{const x=c[Number(v&&v.i)-1];if(!x||!v.st||!Array.isArray(v.d))return;const d=v.d.map(String).map(t=>t.trim()).filter(t=>t&&t!==v.st);if(d.length<3)return;
      Object.assign(x,{st:String(v.st).trim(),d:d.slice(0,3),dv:2,dn:String(v.dn||'')});o.x[x.en]={st:x.st,d:x.d,dn:x.dn,dv:2}})},3);
  buPut(o);
}
const cDone=()=>new Set(C&&C.bu?buSt().c:(cur.prog.cdone||[]));
function cMark(en){if(C&&C.bu){const o=buSt();o.c=[...new Set([...o.c,en])];buPut(o)}else cur.prog.cdone=[...new Set([...(cur.prog.cdone||[]),en])]}
function cReset(){if(C&&C.bu){const o=buSt();o.c=[];buPut(o)}else cur.prog.cdone=[]}
let C=null;
function startCumle(){
  if(srcOf(5)==='bu')return startCumleBu();
  const pool=sentOf();if(pool.length<4)return emptyMsg('Cümleler henüz hazır değil. Hazırla düğmesiyle akademik cümleleri oluştur.',true);
  const order=[],seen=new Set();
  cur.groups.forEach(g=>g.w.forEach(en=>{const x=pool.find(p=>p.en===en);if(x&&!seen.has(x.en)){seen.add(x.en);order.push(x)}}));
  pool.forEach(x=>{if(!seen.has(x.en))order.push(x)});
  const G=[];for(let i=0;i<order.length;i+=10)G.push(order.slice(i,i+10));

}
async function startCumleBu(){
  ST().innerHTML=srcBar(5)+'<div class="card done-card"><span class="ka-spin"></span><p class="mut">BUEPT metinleri yükleniyor…</p></div>';
  let db;try{db=await buLoad()}catch(e){ST().innerHTML=srcBar(5)+`<div class="card done-card"><p class="bad">${esc(e.message)}</p></div>`;return}
  if(mode!==5)return;
  const o=buSt(),F=myForms();
  const items=db.sents.map((v,k)=>{const id='bs'+k;const x=Object.assign({en:id,t:v.t,pi:v.i,s:v.s,st:v.st||'',d:v.d||[],dn:v.dn||'',dv:v.st&&v.d?2:0},o.x[id]||{});x.hit=hitsOf(v.s,F);return x});

function gibberish(t,para){

    {const again=p.items.filter(x=>x.tr&&!x.s);if(again.length){prepMsg('Eksik kalan cümleler yeniden deneniyor…');await pool(chunks(again,3),sentOne,2)}}
    const have=new Set(p.groups.flatMap(g=>g.w)),left=p.items.filter(x=>x.tr&&!have.has(x.en)).map(x=>x.en);
    for(let i=0;i<left.length;i+=10)p.groups.push({w:left.slice(i,i+10),text:'',ana:'',gl:{},ok:false});
    const gs=p.groups.filter(g=>!g.text);done=0;
    const paraOne=async g=>{const ws=g.w.map(en=>p.items.find(x=>x.en===en)).filter(Boolean);const r=await KA.askJ(PARA_G,'KONU: '+ptop()+'\nKALIPLAR: '+ws.map(x=>x.en+(x.tr?` (${x.tr})`:'')).join(' | '),{ms:65000});if(r.json&&r.json.par){Object.assign(g,{text:String(r.json.par).trim(),ana:String(r.json.ana_fikir||'').trim(),gl:lowerKeys(r.json.gl)})}else LASTERR=r.err;done++;prepMsg(`Paragraflar hazırlanıyor · ${Math.min(done,gs.length)}/${gs.length}`);KA.savePack(p)};
    await pool(gs,paraOne,2);
    {const again=p.groups.filter(g=>!g.text);if(again.length){prepMsg('Eksik kalan paragraflar yeniden deneniyor…');await pool(again,paraOne,1)}}
    const lexs=new Set(p.items.flatMap(x=>forms(x.en)));
    const txt=[...p.items.map(x=>x.s||''),...p.groups.map(g=>g.text||'')].join(' ');
    const need=[...new Set(txt.toLowerCase().match(/[a-z][a-z'-]*/g)||[])].filter(w=>w.length>2&&!lexs.has(w)&&!p.dict[w]);
    await pool(chunks(need,90),async c=>{const r=await KA.askJ(GLOSS,c.join(', '),{tier:'quick'});if(r.json)Object.keys(r.json).forEach(k=>{if(typeof r.json[k]==='string')p.dict[k.toLowerCase()]=r.json[k].trim()});KA.savePack(p)},2);
  }catch(e){LASTERR=e.message}
  BUSY=false;KA.savePack(p,true);
  const ms=missing(p);
  if(ms.tr+ms.s+ms.g)KA.toast(LASTERR?'Bazı içerikler hazırlanamadı ('+LASTERR+'). Hazırla düğmesine tekrar basınca kalanlar tamamlanır.':'Bazı içerikler eksik kaldı, Hazırla düğmesine tekrar bas.',4200);else KA.toast('Liste hazır. İyi çalışmalar!');

}

const STRUCT=`Görevin: Bir fotoğraftan OCR ile okunmuş metni İngilizce kelime listesine dönüştürmek. Metin kelime listesi, defter, tablo, kitap sayfası ya da çalışma kâğıdı olabilir; OCR hataları içerebilir (harf karışması, bölünmüş kelime, gereksiz işaret).
Kurallar:
- Metindeki HER İngilizce kelimeyi ve kalıbı sırasıyla al (liste ya da tabloysa hiçbirini atlama). Metin düz bir paragrafsa öğrenmeye değer kelimeleri seç (en fazla 40).
- OCR hatalarını düzelt ("rn"→"m", "0"→"o", bölünmüş kelimeleri birleştir). Numara, madde işareti, başlık, sayfa numarası ve tarih alma.
- Kelimenin yanında Türkçe anlamı yazıyorsa aynen al ve "oto":false yap. Yoksa en yaygın Türkçe karşılığını SEN yaz ve "oto":true yap. Fiil kalıplarını ("take into account") tek öğe olarak al.
- Türkçe kelimeyi İngilizce sanma; İngilizce kelime olmayan satırları alma.
YALNIZCA geçerli JSON döndür: {"items":[{"en":"kelime ya da kalıp","tr":"Türkçe anlam","oto":false}]}`;
function ocrItems(j){
  if(!j)return [];
  let arr=Array.isArray(j)?j:Array.isArray(j.items)?j.items:Object.values(j).find(Array.isArray)||[];
  return arr.map(o=>typeof o==='string'?{en:o,tr:'',oto:false}:o&&({en:o.en||o.word||o.english||o.kelime||'',tr:o.tr||o.turkish||o.anlam||'',oto:!!o.oto})).filter(o=>o&&/[a-z]{2}/i.test(String(o.en))).map(o=>({en:String(o.en).trim(),tr:String(o.tr||'').trim(),oto:o.oto}));
}
function rawItems(txt){
  let items=parse(txt).filter(x=>/[a-z]{2,}/i.test(x.en)&&!/[çğışİ]/.test(x.en));
  if(items.length<2){const w=(txt.match(/\b[A-Za-z][a-z'-]{2,}(?:\s(?:in|on|of|to|up|out|for|with|into|off|down|away)\b)?/g)||[]);items=[...new Set(w.map(x=>x.toLowerCase()))].slice(0,60).map(en=>({en,tr:''}))}
  return items;
}
const SCAN=`Bu fotoğraf bir İngilizce kelime listesi, defter, tablo, kitap sayfası ya da çalışma kâğıdı. Fotoğraftaki kelimeleri doğrudan bir İngilizce kelime listesine dönüştür.
Kurallar:
- Fotoğraftaki HER İngilizce kelimeyi ve kalıbı yukarıdan aşağıya sırasıyla al (liste ya da tabloysa hiçbirini atlama, el yazısını da oku). Düz bir paragrafsa öğrenmeye değer kelimeleri seç (en fazla 40).
- Numara, madde işareti, başlık, sayfa numarası ve tarih alma. Fiil kalıplarını ("take into account") tek öğe olarak al.
- Kelimenin yanında Türkçe anlamı yazıyorsa aynen al (Türkçe harfleri koru) ve "oto":false yap. Yoksa en yaygın Türkçe karşılığını SEN yaz ve "oto":true yap. Birden fazla anlam varsa virgülle ayır.
- Bir Türkçe kelimenin yanında birden fazla İngilizce kelime varsa her İngilizce kelimeyi ayrı öğe yap.
YALNIZCA geçerli JSON döndür: {"items":[{"en":"kelime","tr":"Türkçe anlam","oto":false}]}`;
async function scanPhoto(f,say){
  say('Fotoğraf hazırlanıyor…');
  const img=await KA.prepImage(f,1600);
  say('Kelimeler okunuyor…');
  // Hızlı yol: tek istekte fotoğraftan doğrudan liste
  const r=await KA.askJ(SCAN,'(fotoğraf ekte)',{image:{mime:img.mime,data:img.data},mode:'scan',ms:45000});
  let items=ocrItems(r.json);
  if(items.length)return {items};
  if(/hak|limit|anahtar|kod/i.test(r.err||''))return {items:[],err:r.err};
  // Yedek yol: önce yazıyı oku, sonra listeye çevir
  say('Daha dikkatli okunuyor…');
  const o=await KA.ocrText(img,{status:say});
  if(!o.text)return {items:[],err:o.err||r.err};
  const r2=await KA.askJ(STRUCT,o.text.slice(0,12000),{ms:60000,json:true});
  items=ocrItems(r2.json);
  if(!items.length)items=rawItems(o.text);
  return {items,text:o.text};
}
async function importFiles(fs,el){
  fs=fs.filter(Boolean);if(!fs.length)return;
  const imgs=fs.filter(KA.isImage),rest=fs.filter(f=>!KA.isImage(f));
  for(const f of rest)await importFile(f,el);
  if(!imgs.length)return;
  const out=el.querySelector('#pfs'),res=new Array(imgs.length),errs=[],st=new Array(imgs.length).fill('Sırada');let done=0;
  const show=()=>{out.innerHTML='<span class="ka-spin"></span> '+(imgs.length>1?esc(`${done}/${imgs.length} fotoğraf okundu · `)+esc(st.find(x=>x!=='Bitti'&&x!=='Sırada')||'Okunuyor…'):esc(st[0]))};
  show();
  // Fotoğraflar aynı anda (en fazla 3) okunur
  let next=0;
  const worker=async()=>{while(next<imgs.length){const i=next++;const say=t=>{st[i]=t;show()};
    try{const {items,err}=await scanPhoto(imgs[i],say);res[i]=items;if(!items.length)errs.push(err||'yazı bulunamadı')}catch(e){res[i]=[];errs.push(e.message)}
    st[i]='Bitti';done++;show()}};
  await Promise.all(Array.from({length:Math.min(3,imgs.length)},worker));
  const all=res.flat().filter(Boolean);
  const seen=new Set(),items=all.filter(x=>{const k=x.en.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
  if(!items.length){out.innerHTML=`Fotoğraftaki kelimeler okunamadı${errs[0]?' ('+esc(errs[0])+')':''}. Sayfayı düz tutup ışıklı bir yerde, kelimeler ekranı dolduracak şekilde yeniden çek ya da ekran görüntüsü kullan.`;return}
  const ta=el.querySelector('#pw');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+items.map(x=>x.tr?x.en+' - '+x.tr:x.en).join('\n');
  const pn=el.querySelector('#pn');if(!pn.value)pn.value='Fotoğraftan liste';
  const auto=items.filter(x=>x.oto).length,miss=items.filter(x=>!x.tr).length;
  out.textContent=`${items.length} kelime bulundu${auto?` · ${auto} tanesinin Türkçesi otomatik eklendi`:''}${miss?` · ${miss} tanesinin anlamı liste oluşunca tamamlanacak`:''}${errs.length?` · ${errs.length} fotoğraf okunamadı`:''}. Kontrol edip “Listeyi oluştur”a bas.`;
}
async function importFile(f,el){
  const out=el.querySelector('#pfs');out.innerHTML='<span class="ka-spin"></span> Dosya okunuyor…';
  try{
    const ext=f.name.split('.').pop().toLowerCase();let txt='';
    if(KA.isImage(f))return importFiles([f],el);
    if(ext==='pdf'){
      const lib=await import('./lib/pdfjs/pdf-v3.min.mjs');lib.GlobalWorkerOptions.workerSrc=new URL('lib/pdfjs/pdf.worker-v3.min.mjs',location.href).href;
      const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      for(let n=1;n<=doc.numPages;n++){const c=await (await doc.getPage(n)).getTextContent();let line='',lastY=null,lx=null;for(const it of c.items){if(!('str' in it))continue;const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){txt+=line+'\n';line='';lx=null}if(lx!==null&&it.transform[4]-lx>18)line+='\t';line+=it.str;lx=it.transform[4]+(it.width||0);lastY=y;if(it.hasEOL){txt+=line+'\n';line='';lx=null;lastY=null}}txt+=line+'\n'}
    }else if(ext==='docx'){
      if(!window.mammoth)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';s.onload=ok;s.onerror=()=>no(new Error('Word okuyucu yüklenemedi'));document.head.appendChild(s)});
      txt=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
    }else txt=await f.text();
    const n=parse(txt).length,ta=el.querySelector('#pw');
    ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+parse(txt).map(x=>x.tr?x.en+' - '+x.tr:x.en).join('\n');
    const pn=el.querySelector('#pn');if(!pn.value)pn.value=f.name.replace(/\.[^.]+$/,'');
    out.textContent=n?`${n} kelime bulundu. Kontrol edip “Listeyi oluştur”a bas.`:'Dosyada kelime bulunamadı. Taranmış bir PDF olabilir.';
  }catch(e){out.textContent='Dosya okunamadı: '+e.message}
}

  const cg=t.closest('[data-cg]');if(cg){C.gi=+cg.dataset.cg;groupCumle();return}
  const sw=t.closest('[data-src]');if(sw){try{localStorage.setItem('ka_src_'+sw.dataset.m2,sw.dataset.src)}catch(e){}P.ok0=0;openMode(+sw.dataset.m2,true);return}
  const pg=t.closest('[data-pg]');if(pg){P.gi=+pg.dataset.pg;setTimeout(sessSnap,0);drawPara();scrollTo({top:0,behavior:'smooth'});return}
  const tr=t.closest('[data-tier]');if(tr){modalTier(+tr.dataset.tier);return}
  const a=t.closest('[data-a]');if(!a)return;
  ({home:renderHome,restart:restartMode,new:modalNew,prep:prepare,explore:modalExplore,sents:modalSents,pwa:modalPwa,export:exportPack,grade,regen,
    sample:()=>{const p=mkPack('def','BUEPT Akademik Örnek Liste',parse(DEF));KA.savePack(p,true);KA.activeId('def');renderHome();KA.toast('Örnek liste yüklendi.')},
    reset:()=>{if(!confirm('Bu listedeki bütün ilerleme sıfırlansın mı? Kelimeler ve cümleler silinmez.'))return;cur.prog={box:{},steps:[0,0,0,0,0,0,0],xp:0,mdone:[],cdone:[]};cur.groups.forEach(g=>{g.ok=false;g.last=null});save(true);renderHome()},
    del:()=>{if(!confirm('“'+cur.name+'” listesi tamamen silinsin mi?'))return;KA.deletePack(cur.id);KA.activeId('');renderHome()},
    next:()=>{if(mode===4)nextBoss();else if(mode===5)nextCumle();else nextQ()},
    ctx:()=>{C.ctx=!C.ctx;const x=C.cur&&C.cur.x;if(!x)return;const fb=$('#fb').innerHTML,lk=C.locked;nextCumle();if(lk){document.querySelectorAll('.opt').forEach(b=>{b.disabled=true});$('#fb').innerHTML=fb;C.locked=true}},
    prand:()=>{const G=PL(),c=G.map((x,i)=>i).filter(i=>i!==P.gi&&!G[i].ok);P.gi=c.length?c[Math.floor(Math.random()*c.length)]:0;drawPara();scrollTo({top:0,behavior:'smooth'})},
    ycheck:()=>yazCheck(false),yskip:()=>yazCheck(true),bcheck:bossYaz,cnext:nextGroup,override:overrideYaz,editcard:()=>Q&&Q.cur&&editCard(Q.cur.x),
    styup:()=>{if(BUSY)return;cur.items.forEach(x=>{x.s='';x.st='';x.d=[];x.dv=0;x.dn=''});cur.groups.forEach(g=>{g.text='';g.ana='';g.gl={};g.last=null;g.draft=''});cur.prog.cdone=[];cur.sty=2;save(true);prepare()},
    styno:()=>{cur.sty=2;save(true);renderHome()},
    audundo:auditUndo,audok:()=>{cur.audSeen=1;save(true);renderHome()},audlog:auditLog,audrun:()=>runAudit(cur,true)
  }[a.dataset.a]||(()=>{}))();
});
document.addEventListener('change',e=>{if(e.target.id==='pk'){KA.activeId(e.target.value);renderHome()}
  if(e.target.id==='ptt'&&P.bu){const G=PL(),cand=G.map((x,i)=>[x,i]).filter(([x])=>x.t===e.target.value).sort((a,b)=>a[0].i-b[0].i),f=cand.find(([x])=>!x.ok)||cand[0];P.gi=f?f[1]:0;drawPara()}});
document.addEventListener('keydown',e=>{
  if(mode<0||e.metaKey||e.ctrlKey||e.altKey)return;
  const inInput=e.target.matches&&e.target.matches('input,textarea,select');
  if(e.key==='Enter'&&e.target.id==='yin'){e.preventDefault();if($('#nextBtn'))$('#nextBtn').click();else if(mode===4)bossYaz();else yazCheck(false);return}
  if(inInput)return;
  if(mode===0&&K&&K.q.length){const op=K.stage==='open';if(!op){const c={'1':2,'2':1,'3':0,' ':1}[e.key];if(c!==undefined){e.preventDefault();if(c===1&&(K.stage!=='open'&&K.stage!=='hint')){K.stage='hint';drawKart()}else{K.conf=c;K.stage='open';drawKart()}}}else if(K.conf===0){if(e.key==='Enter'||e.key===' '||e.key==='1'){e.preventDefault();answerKart(false)}}else if(e.key==='1')answerKart(false);else if(e.key==='2')answerKart(true);return}
  const nb=$('#nextBtn');if(nb&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nb.click();return}
  if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-o="${e.key-1}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}
});

/* ---------- Başlat ---------- */
KA.nav('index.html',{stats:true});
(function legacyQueue(){const q=KA.store.get('ka_news_added_words',null);if(Array.isArray(q)&&q.length){q.forEach(w=>{if(w&&w.en&&w.tr)KA.addUnknown(w.en,w.tr)});KA.store.del('ka_news_added_words')}})();
renderHome();
})();
</script>
